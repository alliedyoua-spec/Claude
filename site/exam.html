","choices":["ควรทยอยถอนมาตรการอย่างค่อยเป็นค่อยไปและสื่อสารแผนล่วงหน้าอย่างชัดเจน เพราะหากคงไว้จะดันผลผลิตเกินศักยภาพจนเกิดเงินเฟ้อ แต่หากถอนกะทันหันอาจทำให้การฟื้นตัวสะดุดลง","ควรคงมาตรการไว้ในระดับเดิมต่อไปอีกหลายปีจนกว่าผลผลิตจะสูงกว่าศักยภาพอย่างชัดเจน เพราะการหยุดกระตุ้นก่อนที่เศรษฐกิจจะร้อนแรงเต็มที่จะทำให้ความพยายามที่ผ่านมาสูญเปล่าไปทั้งหมด","ควรยกเลิกมาตรการทั้งหมดทันทีในคราวเดียว เพราะการทยอยถอนจะทำให้ตลาดสับสนและคาดเดาไม่ได้ การตัดสินใจที่เด็ดขาดจะสร้างความน่าเชื่อถือให้ผู้ดำเนินนโยบายมากกว่าอย่างชัดเจน","ควรเพิ่มขนาดของมาตรการขึ้นอีกเพื่อเร่งให้เศรษฐกิจเติบโตเร็วขึ้น เพราะเมื่อผลผลิตใกล้ศักยภาพแล้วแสดงว่ามาตรการได้ผลดี การเพิ่มขนาดจึงจะให้ผลลัพธ์ที่ดียิ่งขึ้นไปอีกตามสัดส่วน"],"answer":0,"a":"จังหวะการถอนมาตรการเป็นศิลปะที่ยากพอ ๆ กับจังหวะการเริ่มใช้\nทำไมต้องถอน — เมื่อผลผลิตใกล้ศักยภาพและการว่างงานใกล้อัตราธรรมชาติแล้ว ช่องว่างการหดตัวปิดลงเกือบหมด หากยังกระตุ้นต่อในระดับเดิม AD จะดันผลผลิตเกิน Y_FE เกิดช่องว่างเงินเฟ้อ ค่าจ้างถูกดันขึ้น SRAS เลื่อนขึ้น และจบด้วยระดับราคาที่สูงขึ้นถาวรโดยไม่ได้ผลผลิตเพิ่มในระยะยาว\nทำไมต้องค่อยเป็นค่อยไป — การถอนกะทันหันเท่ากับให้ AD หดตัวแรงในจังหวะที่การฟื้นตัวยังไม่มั่นคง ซึ่งอาจผลักเศรษฐกิจกลับเข้าสู่ภาวะถดถอยรอบสอง\nทำไมต้องสื่อสารล่วงหน้า — เมื่อตลาดรู้แผนล่วงหน้า ธุรกิจและครัวเรือนจะปรับตัวได้ราบรื่น ลดความผันผวนในตลาดการเงิน และรักษาความน่าเชื่อถือของผู้ดำเนินนโยบายไว้\nทั้งสามเหตุผลนี้ชี้ไปที่การถอนแบบทยอยพร้อมการสื่อสารที่ชัดเจน","whys":["ถูกต้อง — สมดุลระหว่างความเสี่ยงเงินเฟ้อจากการคงไว้กับความเสี่ยงที่การฟื้นตัวจะสะดุดจากการถอนเร็วเกินไป","ไม่ถูกต้อง — การกระตุ้นจนผลผลิตเกินศักยภาพไม่ใช่เป้าหมาย แต่เป็นการซื้อผลผลิตชั่วคราวด้วยระดับราคาที่สูงขึ้นถาวร","ไม่ถูกต้อง — การถอนกะทันหันทำให้ AD หดตัวแรงและอาจผลักเศรษฐกิจกลับเข้าสู่ภาวะถดถอยรอบสองก่อนที่การฟื้นตัวจะมั่นคง","ไม่ถูกต้อง — เมื่อผลผลิตใกล้ศักยภาพแล้ว การกระตุ้นเพิ่มจะไปลงที่ระดับราคาแทนที่จะลงที่ผลผลิต ผลลัพธ์จึงไม่ได้ดีขึ้นตามสัดส่วน"],"tip":"หลักการถอนมาตรการ: ทยอยถอน · สื่อสารล่วงหน้า · ดูข้อมูลประกอบ — เพราะทั้งการถอนช้าเกินไปและเร็วเกินไปต่างก็มีต้นทุน"},{"id":"C28","type":"mcq","lvl":2,"topic":"AD-AS","ref":"ความยาวและความลึกของวัฏจักร","q":"ข้อใดอธิบายลักษณะเชิงประจักษ์ของวัฏจักรธุรกิจที่นักเศรษฐศาสตร์สังเกตพบได้ถูกต้องที่สุด","choices":["วัฏจักรไม่ได้มีความยาวหรือความลึกที่สม่ำเสมอเป็นรอบตายตัว แต่ช่วงขยายตัวมักยาวกว่าช่วงหดตัวอย่างชัดเจน และแต่ละรอบมีสาเหตุกับลักษณะเฉพาะของตัวเองที่แตกต่างกันไป","วัฏจักรมีความยาวที่แน่นอนเป็นรอบละเจ็ดปีพอดีเสมอ โดยแบ่งเป็นช่วงขยายตัวสี่ปีและช่วงหดตัวสามปี ซึ่งทำให้นักเศรษฐศาสตร์สามารถพยากรณ์จุดพลิกของวัฏจักรได้อย่างแม่นยำล่วงหน้า","ช่วงหดตัวมักยาวนานกว่าช่วงขยายตัวเสมอ เพราะการฟื้นตัวของเศรษฐกิจต้องอาศัยการสะสมทุนใหม่ซึ่งใช้เวลานานกว่าการที่ทุนเดิมจะถูกทำลายลงในช่วงวิกฤตอย่างมีนัยสำคัญ","วัฏจักรธุรกิจเกิดขึ้นพร้อมกันทุกประเทศในโลกด้วยความยาวและความลึกที่เท่ากันทุกประการ เพราะเศรษฐกิจโลกเชื่อมโยงกันจนกลายเป็นระบบเดียวที่เคลื่อนไหวสอดคล้องกันอย่างสมบูรณ์"],"answer":0,"a":"คำว่า “วัฏจักร” อาจทำให้เข้าใจผิดว่ามันเป็นรอบที่สม่ำเสมอแบบนาฬิกา ซึ่งไม่จริง\nไม่สม่ำเสมอ — ความยาวของแต่ละรอบต่างกันมาก บางช่วงขยายตัวยาวเกินสิบปี บางช่วงสั้นเพียงไม่กี่ปี ความลึกของการหดตัวก็ต่างกันตั้งแต่ตื้นมากจนถึงวิกฤตรุนแรง\nไม่สมมาตร — ข้อเท็จจริงที่สำคัญคือช่วงขยายตัวมักยาวกว่าช่วงหดตัวอย่างชัดเจน การหดตัวมักกินเวลาไม่กี่ไตรมาสถึงสองปี ส่วนการขยายตัวมักยาวหลายปี ซึ่งสอดคล้องกับภาพที่ว่าเศรษฐกิจมีแนวโน้มเติบโตเป็นพื้นฐานและการหดตัวเป็นการสะดุดชั่วคราว\nแต่ละรอบไม่เหมือนกัน — บางรอบมาจากช็อกด้านอุปทาน บางรอบจากฟองสบู่สินทรัพย์ บางรอบจากวิกฤตการเงิน บางรอบจากนโยบายที่ผิดพลาด สาเหตุที่ต่างกันทำให้ทั้งลักษณะและวิธีรับมือต่างกัน\nนี่คือเหตุผลที่การพยากรณ์จุดพลิกของวัฏจักรจึงยากมากในทางปฏิบัติ","whys":["ถูกต้อง — ระบุทั้งความไม่สม่ำเสมอ ความไม่สมมาตรระหว่างสองช่วง และความจำเพาะของแต่ละรอบได้ครบถ้วน","ไม่ถูกต้อง — ไม่มีรอบเวลาที่ตายตัว และหากพยากรณ์จุดพลิกได้แม่นยำจริง ภาวะถดถอยก็คงถูกป้องกันไปได้เกือบทั้งหมดแล้ว","ไม่ถูกต้อง — ข้อเท็จจริงเชิงประจักษ์ชี้ตรงข้าม ช่วงขยายตัวมักยาวกว่าช่วงหดตัวอย่างมีนัยสำคัญในเกือบทุกประเทศ","ไม่ถูกต้อง — วัฏจักรของแต่ละประเทศสอดคล้องกันสูงแต่ไม่เหมือนกันทุกประการ เพราะโครงสร้างเศรษฐกิจและนโยบายต่างกัน"]},{"id":"C29","type":"mcq","lvl":4,"topic":"AD-AS","ref":"วิเคราะห์วัฏจักรครบวงจรหนึ่งรอบ","q":"ลำดับเหตุการณ์ในประเทศหนึ่ง — ปีที่ 1 ความเชื่อมั่นพุ่งและสินเชื่อขยายตัว · ปีที่ 3 ผลผลิตเกินศักยภาพและค่าจ้างเร่งตัว · ปีที่ 4 ธนาคารกลางขึ้นดอกเบี้ยแรง · ปีที่ 5 การลงทุนดิ่งและเกิดการเลิกจ้าง ข้อใดอธิบายลำดับนี้ได้ถูกต้องที่สุด","choices":["เป็นวัฏจักรครบหนึ่งรอบที่ขับเคลื่อนโดยอุปสงค์ ปีที่ 1-3 คือขยายตัวจน AD เกิน LRAS · ปีที่ 3 คือช่องว่างเงินเฟ้อและ SRAS เริ่มเลื่อนขึ้น · ปีที่ 4-5 คือการหดตัวจากนโยบายที่กด AD กลับลงมา","เป็นวัฏจักรที่ขับเคลื่อนโดยอุปทานทั้งหมด เพราะค่าจ้างที่เร่งตัวในปีที่ 3 เป็นช็อกด้านต้นทุนที่ทำให้ SRAS เลื่อนขึ้น ซึ่งเป็นต้นเหตุเดียวของทั้งการขยายตัวและการหดตัวในรอบนี้","เหตุการณ์ทั้งสี่ปีไม่มีความเกี่ยวข้องกันเลย เป็นเพียงเหตุการณ์อิสระที่บังเอิญเกิดขึ้นต่อเนื่องกัน เพราะวัฏจักรธุรกิจไม่มีกลไกเชื่อมโยงจากระยะหนึ่งไปสู่อีกระยะหนึ่งอย่างเป็นระบบ","เป็นการเติบโตทางเศรษฐกิจระยะยาวไม่ใช่วัฏจักร เพราะผลผลิตที่เพิ่มขึ้นในปีที่ 1-3 สะท้อนการเลื่อนขวาของ LRAS ส่วนการหดตัวในปีที่ 5 เป็นการปรับฐานชั่วคราวที่ไม่กระทบแนวโน้มระยะยาว"],"answer":0,"a":"ลำดับนี้คือวัฏจักรที่ขับเคลื่อนโดยอุปสงค์แบบตำรา ซึ่งเดินครบทุกระยะ\nปีที่ 1-2 การขยายตัว — ความเชื่อมั่นที่พุ่งขึ้นเพิ่มทั้ง C และ I ขณะที่สินเชื่อที่ขยายตัวเสริมแรงเข้าไปอีก AD เลื่อนขวาอย่างต่อเนื่อง ผลผลิตเพิ่มและการว่างงานลดลง\nปีที่ 3 จุดสูงสุดและช่องว่างเงินเฟ้อ — ผลผลิตแซง Y_FE ตลาดแรงงานตึงตัวจนอัตราการว่างงานต่ำกว่าอัตราธรรมชาติ ค่าจ้างเร่งตัว ต้นทุนสูงขึ้น SRAS เริ่มเลื่อนขึ้น ซึ่งเป็นจุดเริ่มต้นของการพลิกกลับ\nปีที่ 4 นโยบายเข้ามา — ธนาคารกลางขึ้นดอกเบี้ยเพื่อคุมเงินเฟ้อ ซึ่งกด AD ไปทางซ้ายอย่างตั้งใจ\nปีที่ 5 การหดตัว — ต้นทุนการกู้ที่แพงทำให้การลงทุนดิ่ง (องค์ประกอบที่ผันผวนที่สุด) และเมื่อผลผลิตหด การเลิกจ้างจึงตามมา ซึ่งลดรายได้และกด C ลงอีกทอดผ่านตัวคูณ\nนี่คือภาพที่แสดงว่าวัฏจักรมีกลไกเชื่อมโยงกันจากระยะหนึ่งไปสู่อีกระยะหนึ่งอย่างเป็นระบบ","whys":["ถูกต้อง — ลำดับทุกระยะถูกต้องและเชื่อมโยงกลไกจากความเชื่อมั่น สู่ช่องว่างเงินเฟ้อ สู่การตอบสนองเชิงนโยบาย และสู่การหดตัว","ไม่ถูกต้อง — ต้นเหตุของรอบนี้คือความเชื่อมั่นและสินเชื่อซึ่งอยู่ฝั่งอุปสงค์ ส่วนค่าจ้างที่เร่งตัวเป็นผลของตลาดแรงงานที่ตึงตัว ไม่ใช่ต้นเหตุ","ไม่ถูกต้อง — เหตุการณ์ทั้งสี่ปีเชื่อมโยงกันเป็นเหตุเป็นผลอย่างชัดเจนตามกลไกของวัฏจักรที่ขับเคลื่อนโดยอุปสงค์","ไม่ถูกต้อง — ผลผลิตที่เพิ่มขึ้นจากความเชื่อมั่นและสินเชื่อคือการเลื่อนของ AD ไม่ใช่การขยายศักยภาพการผลิตที่เลื่อน LRAS"]},{"id":"C30","type":"mcq","lvl":4,"topic":"AD-AS","ref":"สังเคราะห์: ประเมินภาวะเศรษฐกิจและวางนโยบาย","q":"ข้อมูลล่าสุด — ผลผลิตหดตัวสองไตรมาสติดต่อกัน · อัตราการว่างงาน 6.2% เทียบอัตราธรรมชาติ 5.8% · เงินเฟ้อ 1.2% และชะลอลง · การใช้กำลังการผลิต 74% เทียบค่าเฉลี่ย 79% · คำสั่งซื้อสินค้าทุนเริ่มกลับมาเพิ่มขึ้นในเดือนล่าสุด ข้อใดประเมินได้แม่นยำที่สุด","choices":["เศรษฐกิจอยู่ในช่วงหดตัวที่มีช่องว่างการหดตัวไม่ใหญ่นัก และตัวชี้วัดล่วงหน้าเริ่มส่งสัญญาณว่าอาจใกล้จุดต่ำสุดแล้ว · ควรใช้มาตรการกระตุ้นขนาดพอประมาณพร้อมติดตามข้อมูลอย่างใกล้ชิด","เศรษฐกิจอยู่ในภาวะถดถอยรุนแรงที่มีช่องว่างการหดตัวขนาดใหญ่มาก · ควรอัดฉีดมาตรการกระตุ้นขนาดใหญ่ที่สุดเท่าที่จะทำได้ทันทีโดยไม่ต้องกังวลเรื่องการกระตุ้นเกินขนาดเลยแม้แต่น้อย","เศรษฐกิจอยู่ในช่องว่างเงินเฟ้อเพราะอัตราการว่างงานยังอยู่ในระดับต่ำ · ควรขึ้นอัตราดอกเบี้ยนโยบายเพื่อป้องกันไม่ให้แรงกดดันด้านราคาก่อตัวขึ้นในระยะถัดไปอย่างเร่งด่วน","เศรษฐกิจกำลังเผชิญช็อกด้านอุปทานเชิงลบเพราะการใช้กำลังการผลิตต่ำกว่าค่าเฉลี่ย · ควรใช้เฉพาะนโยบายด้านอุปทานเท่านั้นเพราะเครื่องมือด้านอุปสงค์จะทำให้เงินเฟ้อเร่งตัวขึ้นทันที"],"answer":0,"a":"ต้องอ่านข้อมูลทุกชุดประกอบกันแล้วประเมินทั้งทิศทางและขนาด\nทิศทาง — ผลผลิตหดตัวสองไตรมาส เข้าเกณฑ์คร่าว ๆ ของภาวะถดถอย\nขนาดของช่องว่าง — นี่คือส่วนที่สำคัญ อัตราการว่างงานสูงกว่าอัตราธรรมชาติเพียง 0.4 จุด และการใช้กำลังการผลิตต่ำกว่าค่าเฉลี่ย 5 จุด ซึ่งบ่งชี้ช่องว่างการหดตัวที่มีอยู่จริงแต่ไม่ใหญ่มาก ไม่ใช่วิกฤตรุนแรง\nต้นเหตุ — เงินเฟ้อ 1.2% และกำลังชะลอลง แปลว่า P กับ Y เคลื่อนไปทางเดียวกัน จึงเป็นปัญหาฝั่งอุปสงค์ ซึ่งนโยบายด้านอุปสงค์แก้ได้ตรงจุดและความเสี่ยงเงินเฟ้อต่ำ\nสัญญาณอนาคต — คำสั่งซื้อสินค้าทุนเป็นตัวชี้วัดล่วงหน้า การที่มันกลับมาเพิ่มขึ้นบ่งชี้ว่าอาจใกล้จุดต่ำสุดแล้ว\nข้อสรุป — ควรกระตุ้นแต่ขนาดพอประมาณ เพราะช่องว่างไม่ใหญ่และการฟื้นตัวอาจกำลังเริ่มต้น หากอัดฉีดเต็มกำลังบวกกับความล่าช้าของนโยบาย มาตรการอาจไปออกฤทธิ์ตอนที่เศรษฐกิจฟื้นแล้วและกลายเป็นตัวสร้างเงินเฟ้อ","whys":["ถูกต้อง — ประเมินได้ทั้งทิศทาง ขนาดของช่องว่าง ต้นเหตุจากฝั่งอุปสงค์ และสัญญาณจากตัวชี้วัดล่วงหน้า","ไม่ถูกต้อง — ช่องว่างการหดตัวมีขนาดเล็ก การอัดฉีดเต็มกำลังเสี่ยงต่อการกระตุ้นเกินขนาดโดยเฉพาะเมื่อคำนึงถึงความล่าช้าของนโยบาย","ไม่ถูกต้อง — อัตราการว่างงาน 6.2% สูงกว่าอัตราธรรมชาติ 5.8% จึงเป็นช่องว่างการหดตัว ไม่ใช่ช่องว่างเงินเฟ้อ","ไม่ถูกต้อง — เงินเฟ้อที่ชะลอลงชี้ว่าเป็นปัญหาฝั่งอุปสงค์ ไม่ใช่ช็อกด้านอุปทานซึ่งจะทำให้เงินเฟ้อเร่งตัวขึ้น"],"tip":"โจทย์สังเคราะห์แบบนี้ต้องประเมินสามเรื่อง: ทิศทาง · ขนาดของช่องว่าง · ต้นเหตุมาจากฝั่งไหน แล้วจึงเลือกทั้งชนิดและขนาดของนโยบาย"},{"id":"M01","type":"mcq","lvl":2,"topic":"ปริมาณเงิน","ref":"หน้าที่ของเงินกับคุณสมบัติที่ดี","q":"ในภาวะเงินเฟ้อรุนแรงที่ระดับราคาเพิ่มขึ้นหลายร้อยเปอร์เซ็นต์ต่อปี ประชาชนเริ่มซื้อขายด้วยเงินตราต่างประเทศและสินค้าแทนเงินในประเทศ ข้อใดอธิบายได้ถูกต้องว่าหน้าที่ใดของเงินเสียหายก่อน","choices":["หน้าที่รักษามูลค่าเสียหายก่อน เพราะเงินที่เสื่อมค่าเร็วไม่มีใครอยากถือ · เมื่อคนเลิกถือ หน้าที่สื่อกลางแลกเปลี่ยนก็พังตามไป และสุดท้ายหน้าที่หน่วยวัดมูลค่าก็ใช้ไม่ได้","หน้าที่หน่วยวัดมูลค่าเสียหายก่อนเพียงหน้าที่เดียว เพราะตัวเลขราคาเปลี่ยนเร็วเกินกว่าจะจดจำได้ · ส่วนหน้าที่รักษามูลค่าและสื่อกลางแลกเปลี่ยนยังทำงานได้ปกติเพราะเงินยังใช้ชำระหนี้ได้ตามกฎหมายอยู่ดี","หน้าที่สื่อกลางแลกเปลี่ยนเสียหายก่อนเพราะร้านค้าปฏิเสธไม่รับเงิน · แต่หน้าที่รักษามูลค่ายังคงอยู่ครบถ้วนเพราะธนาคารกลางยังรับประกันมูลค่าของธนบัตรที่ออกไว้ตามกฎหมายทุกฉบับอย่างไม่มีเงื่อนไข","ไม่มีหน้าที่ใดเสียหาย เพราะเงินเฟ้อกระทบเพียงระดับราคาซึ่งเป็นตัวเลขที่ปรับกันได้ทั้งสองฝ่าย · การที่ประชาชนเปลี่ยนไปใช้เงินตราต่างประเทศจึงเป็นเพียงความนิยมชั่วคราวที่ไม่เกี่ยวกับคุณสมบัติของเงิน"],"answer":0,"a":"เงินมีสามหน้าที่ และในภาวะเงินเฟ้อรุนแรงมันพังเป็นลำดับ\n1. รักษามูลค่า (store of value) พังก่อน — เงินที่มูลค่าหายไปทุกวันไม่มีใครอยากถือไว้ คนจะรีบใช้ทันทีที่ได้รับ หรือเปลี่ยนเป็นสินทรัพย์อื่น\n2. สื่อกลางแลกเปลี่ยน (medium of exchange) พังตาม — เมื่อไม่มีใครอยากถือ ผู้ขายก็เริ่มปฏิเสธที่จะรับ เพราะกลัวว่าเงินที่ได้มาจะเสื่อมค่าก่อนจะใช้ได้\n3. หน่วยวัดมูลค่า (unit of account) พังท้ายสุด — ราคาที่เปลี่ยนทุกวันทำให้ตัวเลขราคาไม่มีความหมาย สัญญาระยะยาวทำไม่ได้ ผู้คนจึงหันไปตั้งราคาด้วยเงินสกุลอื่นแทน\nทำไมลำดับนี้จึงสำคัญ — มันอธิบายว่าภาวะเงินเฟ้อรุนแรงไม่ใช่เพียงเรื่อง “ของแพง” แต่เป็นการที่ระบบเงินของประเทศล่มสลาย ต้นทุนทางเศรษฐกิจจึงสูงมาก เพราะการแลกเปลี่ยนที่ควรง่ายกลับกลายเป็นเรื่องยาก","whys":["ถูกต้อง — ระบุลำดับการพังของทั้งสามหน้าที่ได้ถูกต้องและอธิบายกลไกที่เชื่อมโยงจากหน้าที่หนึ่งไปสู่อีกหน้าที่","ไม่ถูกต้อง — หน้าที่รักษามูลค่าคือหน้าที่ที่เสียหายก่อนและรุนแรงที่สุด การเป็นเงินที่ชำระหนี้ได้ตามกฎหมายไม่ช่วยรักษาอำนาจซื้อ","ไม่ถูกต้อง — สลับลำดับ และธนาคารกลางไม่ได้รับประกันอำนาจซื้อของธนบัตร เพียงรับประกันว่าใช้ชำระหนี้ได้ตามกฎหมาย","ไม่ถูกต้อง — เงินเฟ้อรุนแรงทำลายหน้าที่ของเงินอย่างแท้จริง การหันไปใช้เงินสกุลอื่นเป็นอาการของความล่มสลายนั้น"],"tip":"ลำดับการพัง: รักษามูลค่า → สื่อกลางแลกเปลี่ยน → หน่วยวัดมูลค่า — เพราะไม่มีใครอยากถือ จึงไม่มีใครอยากรับ จึงไม่มีใครใช้ตั้งราคา"},{"id":"M02","type":"mcq","lvl":4,"topic":"ปริมาณเงิน","ref":"จัดกลุ่มปริมาณเงินตามนิยาม","q":"พิจารณารายการต่อไปนี้ — (1) ธนบัตรในกระเป๋าประชาชน (2) เงินฝากออมทรัพย์ (3) เงินฝากกระแสรายวัน (4) หุ้นสามัญในพอร์ตลงทุน (5) เงินฝากประจำ 12 เดือน · ข้อใดจัดกลุ่มตามนิยามปริมาณเงินได้ถูกต้อง","choices":["รายการที่ 1 และ 3 อยู่ใน M1 เพราะใช้จ่ายได้ทันที · รายการที่ 2 และ 5 เพิ่มเข้ามาใน M2 เพราะเปลี่ยนเป็นเงินสดได้แต่ไม่ทันที · รายการที่ 4 ไม่นับในปริมาณเงินเพราะมูลค่าไม่แน่นอน","รายการที่ 1 อยู่ใน M1 เพียงรายการเดียว เพราะเฉพาะเงินสดเท่านั้นที่ถือเป็นเงิน · รายการที่ 2 3 และ 5 อยู่ใน M2 ทั้งหมดเพราะเป็นเงินฝากธนาคาร · ส่วนรายการที่ 4 อยู่ใน M3 เพราะเป็นสินทรัพย์ทางการเงิน","รายการที่ 1 2 3 และ 5 อยู่ใน M1 ทั้งหมดเพราะทุกรายการเป็นเงินที่ประชาชนถือครองอยู่จริง · รายการที่ 4 อยู่ใน M2 เพราะขายในตลาดหลักทรัพย์แล้วได้เงินสดกลับมาภายในไม่กี่วันทำการ","รายการที่ 3 และ 5 อยู่ใน M1 เพราะเป็นเงินฝากที่มีสัญญาชัดเจนกับธนาคาร · รายการที่ 1 และ 2 อยู่ใน M2 เพราะไม่มีสัญญาผูกพัน · ส่วนรายการที่ 4 ไม่นับเพราะเป็นตราสารทุนไม่ใช่ตราสารหนี้"],"answer":0,"a":"หลักการจัดกลุ่มคือสภาพคล่อง ไล่จากใช้จ่ายได้ทันทีไปสู่ที่ต้องใช้เวลาเปลี่ยนเป็นเงินสด\nM1 (สภาพคล่องสูงสุด) — ธนบัตรและเหรียญในมือประชาชน บวกเงินฝากกระแสรายวันที่เขียนเช็คหรือโอนจ่ายได้ทันที จึงได้รายการที่ 1 และ 3\nM2 = M1 + เงินฝากออมทรัพย์และเงินฝากประจำ — รายการที่ 2 และ 5 ยังไม่ใช่สื่อกลางแลกเปลี่ยนโดยตรง เพราะเงินฝากประจำถอนก่อนกำหนดต้องเสียดอกเบี้ย แต่เปลี่ยนเป็นเงินสดได้ไม่ยาก จึงถูกนับเพิ่มในระดับที่กว้างกว่า\nหุ้นสามัญไม่นับเป็นปริมาณเงิน — เพราะมูลค่าไม่แน่นอน ขายวันนี้อาจได้น้อยกว่าเมื่อวาน สินทรัพย์ที่จะนับเป็นเงินต้องมีมูลค่าที่แน่นอนเป็นตัวเงิน ไม่ใช่เพียงขายได้เร็ว\nเหตุผลที่ต้องแยกหลายนิยาม — M1 บอกอำนาจซื้อที่พร้อมใช้ทันที ส่วน M2 บอกภาพกว้างของสภาพคล่องในระบบ ธนาคารกลางจึงติดตามทั้งสองตัว","whys":["ถูกต้อง — จัดกลุ่มตามสภาพคล่องได้ถูกต้องทุกรายการ และให้เหตุผลที่ถูกต้องว่าทำไมหุ้นจึงไม่นับเป็นปริมาณเงิน","ไม่ถูกต้อง — เงินฝากกระแสรายวันอยู่ใน M1 ด้วยเพราะใช้จ่ายได้ทันที และหุ้นสามัญไม่ถูกนับในนิยามปริมาณเงินใด ๆ","ไม่ถูกต้อง — เงินฝากออมทรัพย์และเงินฝากประจำไม่อยู่ใน M1 เพราะไม่ใช่สื่อกลางแลกเปลี่ยนที่ใช้จ่ายได้ทันที","ไม่ถูกต้อง — เงินสดเป็นสิ่งที่มีสภาพคล่องสูงสุดจึงต้องอยู่ใน M1 และเงินฝากประจำไม่ใช่เงินที่ใช้จ่ายได้ทันที"]},{"id":"M03","type":"mcq","lvl":4,"topic":"ปริมาณเงิน","ref":"คำนวณตัวคูณเงินและปริมาณเงินที่สร้างได้","q":"ธนาคารกลางซื้อพันธบัตรจากธนาคารพาณิชย์มูลค่า 500 ล้านบาท · อัตราเงินสำรองตามกฎหมาย 8% · สมมติธนาคารปล่อยกู้เต็มที่และเงินกู้กลับเข้าระบบธนาคารทั้งหมด ปริมาณเงินฝากในระบบจะเพิ่มขึ้นสูงสุดเท่าใด","choices":["6,250 ล้านบาท","4,000 ล้านบาท","540 ล้านบาท","62,500 ล้านบาท"],"answer":0,"a":"ขั้นที่ 1 หาตัวคูณเงิน\nตัวคูณเงิน = 1 ÷ R = 1 ÷ 0.08 = 12.5\nขั้นที่ 2 คูณกับเงินสำรองส่วนเกินที่เพิ่มขึ้น\nธนาคารกลางซื้อพันธบัตรจากธนาคารพาณิชย์ 500 ล้านบาท ธนาคารพาณิชย์จึงได้เงินสำรองเพิ่มขึ้น 500 ล้านบาท\nΔเงินฝาก = 500 × 12.5 = 6,250 ล้านบาท\nตรวจทานด้วยเหตุผล — เงินฝาก 6,250 ล้านบาท ต้องกันสำรอง 8% = 500 ล้านบาท ซึ่งตรงกับเงินสำรองที่ระบบมีเพิ่มขึ้นพอดี ✓\nข้อควรระวัง — ตัวเลข 6,250 คือยอดเงินฝากที่เพิ่ม ซึ่งรวมเงินฝากรอบแรกไว้แล้ว ส่วนสินเชื่อใหม่ที่ธนาคารปล่อยจะเท่ากับ 6,250 − 500 = 5,750 ล้านบาท ต้องอ่านโจทย์ให้ดีว่าถามตัวไหน","whys":["ถูกต้อง — ใช้ตัวคูณ 1÷0.08 = 12.5 คูณเงินสำรองที่เพิ่มขึ้น 500 ล้านบาท ได้ 6,250 ล้านบาท","ไม่ถูกต้อง — ตัวเลขนี้ได้จากการใช้ตัวคูณ 8 ซึ่งเป็นการคำนวณ 1÷0.125 ไม่ใช่ 1÷0.08 ตามอัตราสำรองที่โจทย์ให้","ไม่ถูกต้อง — ตัวเลขนี้เป็นเพียง 500 บวก 8% ซึ่งไม่ได้ใช้กระบวนการสร้างเงินฝากต่อเนื่องหลายรอบเลย","ไม่ถูกต้อง — ตัวเลขนี้มากเกินไปสิบเท่า เกิดจากการใช้อัตราสำรอง 0.8% แทน 8% ในการคำนวณตัวคูณ"],"tip":"สูตร: Δเงินฝาก = Δเงินสำรอง × (1 ÷ R) — และตรวจทานด้วยการคูณเงินฝากที่ได้ด้วย R ต้องกลับมาเท่ากับเงินสำรองที่เพิ่มขึ้นพอดี"},{"id":"M04","type":"mcq","lvl":4,"topic":"ปริมาณเงิน","ref":"อ่านบัญชีรูปตัวทีของธนาคารพาณิชย์","q":"จากบัญชีของธนาคาร ก. ด้านล่าง ซึ่งมีอัตราเงินสำรองตามกฎหมาย 10% ข้อใดสรุปสถานะและความสามารถในการปล่อยกู้เพิ่มได้ถูกต้อง","choices":["ธนาคารต้องกันสำรองตามกฎหมาย 180 ล้านบาท จึงมีเงินสำรองส่วนเกิน 120 ล้านบาท · ปล่อยกู้เพิ่มได้ทันที 120 ล้านบาท และเมื่อผ่านระบบธนาคารทั้งหมดจะสร้างเงินฝากได้สูงสุด 1,200 ล้านบาท","ธนาคารต้องกันสำรองตามกฎหมาย 200 ล้านบาทจากทุนของธนาคาร จึงมีเงินสำรองส่วนเกิน 100 ล้านบาท · ปล่อยกู้เพิ่มได้ 100 ล้านบาท และเมื่อผ่านระบบธนาคารจะสร้างเงินฝากได้สูงสุด 1,000 ล้านบาท","ธนาคารมีเงินสำรองส่วนเกิน 300 ล้านบาทเพราะเงินสำรองทั้งหมดถือเป็นส่วนเกินได้ · ปล่อยกู้เพิ่มได้ 300 ล้านบาท และเมื่อผ่านระบบธนาคารทั้งหมดจะสร้างเงินฝากได้สูงสุด 3,000 ล้านบาท","ธนาคารขาดเงินสำรอง 140 ล้านบาทเพราะต้องกันสำรอง 10% ของสินทรัพย์รวมคือ 200 ล้านบาท บวกกับเงินให้กู้อีกส่วนหนึ่ง · จึงต้องเรียกคืนสินเชื่อแทนที่จะปล่อยกู้เพิ่มได้"],"answer":0,"a":"ขั้นที่ 1 เงินสำรองที่ต้องกันตามกฎหมาย\nคิดจากเงินฝาก ไม่ใช่สินทรัพย์รวมและไม่ใช่ทุน\n= 1,800 × 10% = 180 ล้านบาท\nขั้นที่ 2 เงินสำรองส่วนเกิน\n= เงินสำรองที่มี − ที่ต้องกัน = 300 − 180 = 120 ล้านบาท\nขั้นที่ 3 ปล่อยกู้เพิ่มได้ทันที\nธนาคารแห่งนี้ปล่อยกู้เพิ่มได้เท่ากับเงินสำรองส่วนเกิน = 120 ล้านบาท\nขั้นที่ 4 ผลต่อทั้งระบบ\nเมื่อเงินกู้หมุนผ่านระบบธนาคารต่อไปเรื่อย ๆ\n= 120 × (1 ÷ 0.10) = 120 × 10 = 1,200 ล้านบาท\nจุดที่มักผิด — ต้องแยกให้ชัดระหว่าง “ธนาคารแห่งนี้ปล่อยกู้ได้เท่าไร” (= เงินสำรองส่วนเกิน) กับ “ระบบสร้างเงินฝากได้เท่าไร” (= เงินสำรองส่วนเกิน × ตัวคูณ)","whys":["ถูกต้อง — คิดสำรองตามกฎหมายจากเงินฝาก ได้ส่วนเกิน 120 ล้านบาท และคูณด้วยตัวคูณ 10 ได้ 1,200 ล้านบาท","ไม่ถูกต้อง — เงินสำรองตามกฎหมายคิดจากยอดเงินฝาก ไม่ใช่จากทุนของธนาคาร ตัวเลขฐานจึงผิดตั้งแต่ต้น","ไม่ถูกต้อง — เงินสำรองส่วนหนึ่งต้องกันไว้ตามกฎหมาย 180 ล้านบาท จึงไม่สามารถนับเงินสำรองทั้งก้อนเป็นส่วนเกินได้","ไม่ถูกต้อง — ฐานการคิดคือเงินฝากไม่ใช่สินทรัพย์รวม และไม่ต้องกันสำรองเพิ่มสำหรับเงินให้กู้ ธนาคารนี้จึงมีส่วนเกินไม่ใช่ขาด"],"fig":"<div class=\"tablewrap\"><table class=\"data tacct\">\n    <tr><th colspan=\"2\">สินทรัพย์</th><th colspan=\"2\">หนี้สินและส่วนของเจ้าของ</th></tr>\n    <tr><td>เงินสำรอง</td><td>300</td><td>เงินฝาก</td><td>1,800</td></tr><tr><td>เงินให้กู้</td><td>1,400</td><td>ทุนของธนาคาร</td><td>200</td></tr><tr><td>พันธบัตร</td><td>300</td><td></td><td></td></tr><tr><td>รวมสินทรัพย์</td><td>2,000</td><td>รวม</td><td>2,000</td></tr>\n  </table><div class=\"figcap\" style=\"text-align:left;margin-top:6px\">ธนาคาร ก. · หน่วย: ล้านบาท</div></div>"},{"id":"M05","type":"mcq","lvl":4,"topic":"ปริมาณเงิน","ref":"เหตุที่ตัวคูณจริงต่ำกว่าค่าทางทฤษฎี","q":"ธนาคารกลางอัดฉีดเงินสำรองเข้าระบบ 100,000 ล้านบาท โดยอัตราสำรองตามกฎหมายคือ 5% แต่ปริมาณเงินในระบบเพิ่มขึ้นเพียงประมาณ 600,000 ล้านบาท ไม่ใช่ 2 ล้านล้านบาทตามที่สูตรทำนาย ข้อใดอธิบายได้ครบถ้วนที่สุด","choices":["เพราะประชาชนถือเงินสดไว้บางส่วนจึงไม่กลับเข้าระบบธนาคารทั้งหมด · ธนาคารกันสำรองส่วนเกินไว้เองมากกว่าที่กฎหมายกำหนด · และอุปสงค์สินเชื่อที่อ่อนแอทำให้ไม่มีผู้กู้มารับเงินไปใช้","เพราะสูตรตัวคูณเงินคำนวณผิดพลาดในทางคณิตศาสตร์ ค่าที่ถูกต้องควรเป็น R หารด้วย 1 ไม่ใช่ 1 หารด้วย R · เมื่อแก้สูตรให้ถูกต้องแล้วตัวเลขที่ได้จะตรงกับข้อมูลจริงที่สังเกตได้ในระบบเศรษฐกิจ","เพราะธนาคารกลางอัดฉีดเงินเข้าระบบไม่ครบตามที่ประกาศไว้ · การที่ปริมาณเงินเพิ่มน้อยกว่าที่คาดจึงเป็นเพียงปัญหาทางเทคนิคในการดำเนินการซึ่งจะแก้ไขได้เองเมื่อธุรกรรมทั้งหมดถูกบันทึกครบถ้วน","เพราะอัตราสำรองตามกฎหมายไม่มีผลต่อการสร้างเงินฝากในทางปฏิบัติเลย · ปริมาณเงินในระบบถูกกำหนดโดยความต้องการถือเงินของประชาชนเพียงอย่างเดียวโดยไม่เกี่ยวข้องกับพฤติกรรมของธนาคาร"],"answer":0,"a":"สูตร 1 ÷ R เป็นขอบบนตามทฤษฎี ที่ต้องอาศัยสองสมมติฐานที่ไม่จริงในโลกจริง คือเงินกู้กลับเข้าระบบธนาคารทั้งหมด และธนาคารปล่อยกู้จนไม่เหลือสำรองส่วนเกิน ในความเป็นจริงมีรอยรั่วสามจุด\nรอยรั่วที่หนึ่ง เงินสดในมือประชาชน — ทุกครั้งที่คนถอนเงินไปถือไว้ในกระเป๋า เงินก้อนนั้นออกจากวงจรการสร้างเงินฝาก\nรอยรั่วที่สอง เงินสำรองส่วนเกินของธนาคาร — ธนาคารมักกันสำรองไว้มากกว่าที่กฎหมายกำหนดเพื่อรองรับการถอน และในช่วงที่ความเสี่ยงสูงหรือเมื่อธนาคารกลางจ่ายดอกเบี้ยบนเงินสำรอง ธนาคารยิ่งกันไว้มาก\nรอยรั่วที่สาม อุปสงค์สินเชื่อ — ข้อนี้สำคัญที่สุดและมักถูกมองข้าม ธนาคารต้องมีผู้กู้ ถ้าธุรกิจไม่มั่นใจและครัวเรือนกำลังลดหนี้ เงินสำรองก็จะกองอยู่เฉย ๆ\nนัยเชิงนโยบาย — นี่คือเหตุผลที่การอัดฉีดเงินสำรองอาจไม่เพิ่มปริมาณเงินตามที่คาดในภาวะวิกฤต และเป็นข้อจำกัดสำคัญของนโยบายการเงิน","whys":["ถูกต้อง — ระบุรอยรั่วครบทั้งสามจุด ทั้งเงินสดในมือประชาชน สำรองส่วนเกินของธนาคาร และอุปสงค์สินเชื่อที่อ่อนแอ","ไม่ถูกต้อง — สูตรตัวคูณเงินคือ 1 หารด้วย R ซึ่งถูกต้องตามหลักการ ปัญหาอยู่ที่สมมติฐานไม่เป็นจริงไม่ใช่ที่สูตร","ไม่ถูกต้อง — ช่องว่างระหว่างค่าทางทฤษฎีกับค่าที่สังเกตได้เกิดจากพฤติกรรมของประชาชนและธนาคาร ไม่ใช่ความคลาดเคลื่อนของการบันทึก","ไม่ถูกต้อง — อัตราสำรองมีผลจริงต่อขอบบนของการสร้างเงินฝาก และพฤติกรรมของธนาคารเป็นตัวกำหนดที่สำคัญมาก"],"tip":"ตัวคูณจริงต่ำกว่าทฤษฎีเพราะสามรอยรั่ว: เงินสดในกระเป๋า · สำรองส่วนเกิน · ไม่มีคนกู้ — รอยรั่วที่สามคือสิ่งที่ทำให้นโยบายการเงินอ่อนแรงในวิกฤต"},{"id":"M06","type":"mcq","lvl":2,"topic":"ปริมาณเงิน","ref":"จับคู่เครื่องมือกับทิศทางของนโยบาย","q":"ธนาคารกลางต้องการลดปริมาณเงินในระบบเพื่อชะลอเงินเฟ้อ ข้อใดคือชุดการดำเนินการที่สอดคล้องกับเป้าหมายนี้ทั้งหมด","choices":["ขึ้นอัตราดอกเบี้ยนโยบาย · ขายพันธบัตรในตลาดเปิด · เพิ่มอัตราเงินสำรองตามกฎหมาย · ขึ้นอัตราดอกเบี้ยที่จ่ายบนเงินสำรองที่ธนาคารฝากไว้","ลดอัตราดอกเบี้ยนโยบาย · ซื้อพันธบัตรในตลาดเปิด · ลดอัตราเงินสำรองตามกฎหมาย · ลดอัตราดอกเบี้ยที่จ่ายบนเงินสำรองที่ธนาคารพาณิชย์ฝากไว้กับธนาคารกลาง","ขึ้นอัตราดอกเบี้ยนโยบาย · ซื้อพันธบัตรในตลาดเปิด · ลดอัตราเงินสำรองตามกฎหมาย · ลดอัตราดอกเบี้ยมาตรฐานที่คิดกับธนาคารพาณิชย์ที่มากู้ยืมระยะสั้น","ลดอัตราดอกเบี้ยนโยบาย · ขายพันธบัตรในตลาดเปิด · เพิ่มอัตราเงินสำรองตามกฎหมาย · ขึ้นอัตราดอกเบี้ยมาตรฐานที่คิดกับธนาคารพาณิชย์ที่มากู้ยืมระยะสั้น"],"answer":0,"a":"นโยบายการเงินแบบหดตัว ทุกเครื่องมือต้องชี้ไปทางเดียวกัน คือทำให้เงินในระบบน้อยลงหรือแพงขึ้น\nขึ้นอัตราดอกเบี้ยนโยบาย — ต้นทุนการกู้สูงขึ้น สินเชื่อและปริมาณเงินขยายตัวช้าลง\nขายพันธบัตรในตลาดเปิด — ธนาคารกลางได้เงินเข้ามา ธนาคารพาณิชย์เสียเงินสำรองออกไป ฐานเงินลดลง\nเพิ่มอัตราเงินสำรองตามกฎหมาย — ธนาคารต้องกันเงินไว้มากขึ้น ปล่อยกู้ได้น้อยลง และตัวคูณเงินลดลงด้วยเพราะตัวคูณ = 1 ÷ R\nขึ้นดอกเบี้ยที่จ่ายบนเงินสำรอง — จุดนี้ต้องคิดให้รอบคอบ ถ้าธนาคารกลางจ่ายดอกเบี้ยสูงขึ้นสำหรับเงินที่ธนาคารพาณิชย์ฝากไว้เฉย ๆ ธนาคารจะอยากเก็บเงินไว้มากกว่าปล่อยกู้ สินเชื่อจึงชะลอ นี่เป็นเครื่องมือหดตัว\nท่าจำ — ทิศของทุกเครื่องมือต้องสอดคล้องกัน หากข้อใดมีทิศผสมกัน ข้อนั้นผิดทันที","whys":["ถูกต้อง — ทุกเครื่องมือชี้ไปทางหดตัวอย่างสอดคล้องกัน รวมถึงดอกเบี้ยบนเงินสำรองที่จูงใจให้ธนาคารเก็บเงินไว้มากกว่าปล่อยกู้","ไม่ถูกต้อง — ชุดนี้เป็นนโยบายการเงินแบบขยายตัวทั้งหมด ซึ่งจะเพิ่มปริมาณเงินและเร่งเงินเฟ้อให้แรงขึ้นอีก","ไม่ถูกต้อง — มีทิศผสมกัน การซื้อพันธบัตรและการลดอัตราสำรองเป็นเครื่องมือขยายตัวซึ่งขัดกับเป้าหมายที่โจทย์ระบุ","ไม่ถูกต้อง — มีทิศผสมกัน การลดอัตราดอกเบี้ยนโยบายเป็นเครื่องมือขยายตัวซึ่งขัดกับเครื่องมืออื่นในชุดเดียวกัน"]},{"id":"M07","type":"mcq","lvl":4,"topic":"ปริมาณเงิน","ref":"ปริมาณเงินส่งผ่านไปสู่ AD-AS","q":"ธนาคารกลางซื้อพันธบัตรในตลาดเปิดเป็นจำนวนมาก ขณะที่เศรษฐกิจอยู่ที่ดุลยภาพระยะยาวพอดี ข้อใดอธิบายผลลัพธ์ทั้งระยะสั้นและระยะยาวตามกรอบที่ SRAS เป็นเส้นแนวนอนได้ถูกต้อง","choices":["ระยะสั้น ปริมาณเงินเพิ่มกดดอกเบี้ยลง การลงทุนและการบริโภคเพิ่ม AD เลื่อนขวา ผลผลิตเพิ่มเกิน Y_FE โดยระดับราคายังคงเดิม · ระยะยาว ค่าจ้างถูกดันขึ้น SRAS เลื่อนขึ้น ผลผลิตกลับสู่ Y_FE เหลือไว้เพียงระดับราคาที่สูงขึ้น","ระยะสั้น ปริมาณเงินเพิ่มทำให้ระดับราคาสูงขึ้นทันทีขณะที่ผลผลิตคงเดิมเพราะเส้น SRAS เป็นแนวตั้ง · ระยะยาว ผลผลิตจะเพิ่มขึ้นเหนือ Y_FE อย่างถาวรเพราะเงินที่มากขึ้นช่วยให้ธุรกิจลงทุนขยายกำลังการผลิตได้ โดยที่ระดับราคาจะทรงตัวอยู่ที่ระดับใหม่","ระยะสั้น ไม่มีผลใด ๆ ต่อทั้งผลผลิตและระดับราคาเพราะเงินเป็นเพียงตัวกลางที่ไม่กระทบตัวแปรจริง · ระยะยาว ผลผลิตจะเพิ่มขึ้นตามปริมาณเงินในสัดส่วนที่เท่ากันพอดีโดยที่ระดับราคาไม่เปลี่ยนแปลงเลย","ระยะสั้น ปริมาณเงินเพิ่มทำให้เส้น LRAS เลื่อนขวาเพราะระบบเศรษฐกิจมีทรัพยากรทางการเงินมากขึ้น · ระยะยาว ทั้งผลผลิตและระดับราคาจะสูงขึ้นพร้อมกันอย่างถาวรโดยไม่มีกลไกใดดึงกลับสู่จุดเดิม"],"answer":0,"a":"ต่อสะพานสองบทให้ครบ — จากปริมาณเงิน ไปสู่ AD-AS\nขั้นที่ 1 ตลาดเงิน — ธนาคารกลางซื้อพันธบัตร เงินสำรองของธนาคารพาณิชย์เพิ่ม ปริมาณเงินขยายตัว อัตราดอกเบี้ยถูกกดลง\nขั้นที่ 2 ส่งผ่านสู่ AD — ดอกเบี้ยต่ำทำให้การลงทุนเพิ่ม (I↑) การบริโภคสินค้าคงทนที่ต้องกู้เพิ่ม (C↑) และค่าเงินอ่อนลงทำให้การส่งออกสุทธิเพิ่ม (NX↑) ทั้งสามช่องทางดัน AD เลื่อนขวา\nขั้นที่ 3 ระยะสั้น — ในกรอบที่ SRAS เป็นเส้นแนวนอน ราคายังไม่ขยับ ผลผลิตเพิ่มเกิน Y_FE เกิดช่องว่างเงินเฟ้อ การว่างงานต่ำกว่าอัตราธรรมชาติ\nขั้นที่ 4 ระยะยาว — ตลาดแรงงานตึงตัวดันค่าจ้างขึ้น ต้นทุนเพิ่ม SRAS เลื่อนขึ้น ผลผลิตไหลกลับสู่ Y_FE เหลือไว้เพียงระดับราคาที่สูงขึ้น\nนี่คือหลักความเป็นกลางของเงินในระยะยาว (long-run neutrality of money) — เงินที่มากขึ้นซื้อได้แต่ราคาที่สูงขึ้น ไม่ใช่ผลผลิตที่มากขึ้นถาวร","whys":["ถูกต้อง — ต่อสะพานจากตลาดเงินสู่ AD และวิเคราะห์ทั้งสองระยะครบ พร้อมสรุปที่ตรงกับความเป็นกลางของเงินในระยะยาว","ไม่ถูกต้อง — SRAS ในกรอบนี้เป็นเส้นแนวนอนไม่ใช่แนวตั้ง และเงินที่เพิ่มขึ้นไม่ได้ขยายกำลังการผลิตในระยะยาว","ไม่ถูกต้อง — เงินเป็นกลางในระยะยาวเท่านั้น ในระยะสั้นมีผลต่อผลผลิตจริง และในระยะยาวผลจะออกที่ระดับราคาไม่ใช่ผลผลิต","ไม่ถูกต้อง — ปริมาณเงินไม่ได้เลื่อน LRAS เพราะ LRAS ถูกกำหนดโดยทุน แรงงาน และเทคโนโลยี ซึ่งเป็นตัวแปรจริงไม่ใช่ตัวแปรทางการเงิน"],"tip":"สะพานที่ต้องท่องให้ได้: ปริมาณเงิน↑ → ดอกเบี้ย↓ → I, C, NX↑ → AD ขวา → ระยะสั้น Y↑ → ระยะยาว SRAS ขึ้น → P↑ เท่านั้น"},{"id":"M08","type":"mcq","lvl":4,"topic":"ปริมาณเงิน","ref":"ข้อจำกัดเมื่อดอกเบี้ยใกล้ศูนย์","q":"เศรษฐกิจอยู่ในภาวะถดถอยลึก ธนาคารกลางลดดอกเบี้ยนโยบายลงจนใกล้ศูนย์แล้วแต่การลงทุนและการบริโภคยังไม่ฟื้น ข้อใดอธิบายสถานการณ์และทางออกได้ถูกต้องที่สุด","choices":["นโยบายการเงินแบบปกติหมดกระสุนเพราะดอกเบี้ยลดต่อไปไม่ได้มาก และผู้กู้ไม่ตอบสนองเมื่อความเชื่อมั่นต่ำ · ทางออกคือมาตรการการเงินแบบพิเศษและนโยบายการคลังที่ใช้จ่ายเข้าระบบโดยตรง","นโยบายการเงินยังทรงพลังเท่าเดิมเสมอ ปัญหาอยู่ที่ธนาคารกลางลดดอกเบี้ยยังไม่มากพอ · ทางออกคือกำหนดดอกเบี้ยนโยบายให้ติดลบมากที่สุดเท่าที่จะทำได้เพื่อบังคับให้ทุกคนต้องนำเงินออกมาใช้จ่าย","สถานการณ์นี้แสดงว่าปัญหาอยู่ฝั่งอุปทานไม่ใช่ฝั่งอุปสงค์ · ทางออกคือใช้เฉพาะนโยบายด้านอุปทานที่เพิ่มผลิตภาพเท่านั้น เพราะเครื่องมือด้านอุปสงค์ทุกชนิดหมดประสิทธิภาพลงอย่างสิ้นเชิงแล้ว","สถานการณ์นี้เป็นไปไม่ได้ในทางทฤษฎี เพราะเมื่อดอกเบี้ยลดลงการลงทุนจะต้องเพิ่มขึ้นตามความสัมพันธ์ที่เป็นสัดส่วนกันเสมอ · ข้อมูลที่ให้มาจึงต้องมีความคลาดเคลื่อนในการเก็บรวบรวม"],"answer":0,"a":"นี่คือสถานการณ์ที่เรียกว่าขอบล่างของอัตราดอกเบี้ย หรือกับดักสภาพคล่อง ซึ่งเปิดเผยข้อจำกัดสำคัญของนโยบายการเงิน\nข้อจำกัดที่หนึ่ง เพดานล่าง — ดอกเบี้ยลดต่ำกว่าศูนย์ได้จำกัดมาก เพราะถ้าติดลบลึก ผู้ฝากจะถอนเงินไปถือเป็นเงินสดแทน ธนาคารกลางจึงเหลือพื้นที่ให้ลดน้อยมาก\nข้อจำกัดที่สอง ฝั่งอุปสงค์สินเชื่อ — สำคัญกว่าข้อแรก ในภาวะถดถอยลึก ธุรกิจไม่ลงทุนเพราะมองไม่เห็นลูกค้า ไม่ใช่เพราะดอกเบี้ยแพง ครัวเรือนที่กลัวตกงานก็ไม่กู้แม้ดอกเบี้ยจะถูก การกดดอกเบี้ยลงอีกจึงเหมือนลดราคาสินค้าที่ไม่มีใครต้องการซื้อ\nทางออก\n· มาตรการการเงินแบบพิเศษ — ซื้อสินทรัพย์ระยะยาวเพื่อกดดอกเบี้ยระยะยาว และสื่อสารทิศทางนโยบายล่วงหน้าเพื่อตรึงการคาดการณ์\n· นโยบายการคลัง — มีข้อดีเด็ดขาดในภาวะนี้ เพราะการที่รัฐใช้จ่ายเองคือการเพิ่ม G เข้าสู่ AD โดยตรงไม่ต้องรอให้ใครยอมกู้","whys":["ถูกต้อง — ระบุข้อจำกัดทั้งด้านเพดานล่างและด้านอุปสงค์สินเชื่อ และเสนอทางออกที่เหมาะกับสถานการณ์นี้","ไม่ถูกต้อง — ดอกเบี้ยติดลบลึกทำได้จำกัดเพราะผู้ฝากจะถอนไปถือเงินสด และปัญหาหลักอยู่ที่ไม่มีคนอยากกู้ไม่ใช่ดอกเบี้ยยังสูงอยู่","ไม่ถูกต้อง — ภาวะถดถอยลึกที่ผลผลิตต่ำกว่าศักยภาพเป็นปัญหาฝั่งอุปสงค์ และนโยบายการคลังยังใช้ได้ผลดีในภาวะนี้","ไม่ถูกต้อง — สถานการณ์นี้เกิดขึ้นจริงในหลายประเทศ เพราะการลงทุนขึ้นกับความคาดหวังต่อยอดขายในอนาคตด้วย ไม่ใช่ขึ้นกับดอกเบี้ยเพียงอย่างเดียว"]},{"id":"M09","type":"mcq","lvl":4,"topic":"ปริมาณเงิน","ref":"สมการแลกเปลี่ยนและการตีความ","q":"ประเทศหนึ่งมีปริมาณเงินเพิ่มขึ้น 12% ต่อปี · อัตราการหมุนเวียนของเงินคงที่ · ผลผลิตจริงขยายตัว 3% ต่อปี · จากสมการแลกเปลี่ยน MV = PY อัตราเงินเฟ้อควรอยู่ที่ประมาณเท่าใด","choices":["ประมาณ 9%","ประมาณ 15%","ประมาณ 4%","ประมาณ 12%"],"answer":0,"a":"สมการแลกเปลี่ยน\nM × V = P × Y\nแปลงเป็นอัตราการเติบโต — เมื่อเขียนในรูปอัตราการเปลี่ยนแปลง จะได้\n%ΔM + %ΔV = %ΔP + %ΔY\nแทนค่า\n12% + 0% = %ΔP + 3%\n%ΔP = 12% − 3% = 9%\nตีความให้ได้ความหมาย — ปริมาณเงินโต 12% แต่ปริมาณสินค้าที่เงินนั้นต้องไปซื้อโตเพียง 3% ส่วนต่าง 9% จึงไปลงที่ราคา\nข้อสรุปเชิงหลักการ — นี่คือที่มาของประโยคว่า “เงินเฟ้อในระยะยาวเป็นปรากฏการณ์ทางการเงิน” หากธนาคารกลางต้องการเงินเฟ้อ 2% โดยที่ผลผลิตโต 3% ก็ควรให้ปริมาณเงินโตประมาณ 5%\nข้อควรระวัง — ความสัมพันธ์นี้แม่นในระยะยาวและเมื่อ V ค่อนข้างเสถียร แต่ในระยะสั้น V ผันผวนได้มาก ทำให้ความสัมพันธ์หลวมกว่าที่สูตรบอก","whys":["ถูกต้อง — จาก %ΔM + %ΔV = %ΔP + %ΔY ได้ 12 + 0 = %ΔP + 3 จึงเหลือเงินเฟ้อ 9%","ไม่ถูกต้อง — ตัวเลขนี้ได้จากการบวกอัตราการเติบโตของผลผลิตเข้าไป แต่ผลผลิตที่โตขึ้นช่วยดูดซับเงินที่เพิ่มจึงต้องนำไปลบ","ไม่ถูกต้อง — ตัวเลขนี้ได้จากการหาร 12 ด้วย 3 ซึ่งไม่ใช่วิธีที่สมการแลกเปลี่ยนในรูปอัตราการเติบโตกำหนดไว้","ไม่ถูกต้อง — จะเท่ากับอัตราการเติบโตของปริมาณเงินพอดีเฉพาะกรณีที่ผลผลิตจริงไม่ขยายตัวเลย ซึ่งไม่ตรงกับโจทย์"],"tip":"รูปอัตราการเติบโตที่ต้องจำ: %ΔM + %ΔV = %ΔP + %ΔY — จัดรูปเป็น เงินเฟ้อ = โตของเงิน − โตของผลผลิต เมื่อ V คงที่"},{"id":"M10","type":"mcq","lvl":2,"topic":"ปริมาณเงิน","ref":"อุปสงค์ต่อการถือเงินและอัตราดอกเบี้ย","q":"ข้อใดอธิบายความสัมพันธ์ระหว่างอัตราดอกเบี้ยกับปริมาณเงินที่ประชาชนต้องการถือได้ถูกต้องและให้เหตุผลได้ถูก","choices":["ดอกเบี้ยสูงขึ้นทำให้ปริมาณเงินที่ต้องการถือลดลง เพราะดอกเบี้ยคือต้นทุนค่าเสียโอกาสของการถือเงินสดที่ไม่ให้ผลตอบแทน คนจึงย้ายเงินไปสู่สินทรัพย์ที่ให้ดอกเบี้ยมากขึ้น","ดอกเบี้ยสูงขึ้นทำให้ปริมาณเงินที่ต้องการถือเพิ่มขึ้น เพราะเมื่อดอกเบี้ยสูงประชาชนจะรู้สึกว่าการถือเงินให้ผลตอบแทนที่คุ้มค่ามากขึ้น จึงต้องการเก็บเงินสดไว้ในมือมากกว่าเดิมอย่างมีนัยสำคัญ","อัตราดอกเบี้ยไม่มีความสัมพันธ์กับปริมาณเงินที่ต้องการถือเลย เพราะความต้องการถือเงินถูกกำหนดโดยระดับรายได้และมูลค่าธุรกรรมที่ต้องชำระในแต่ละเดือนเพียงสองปัจจัยนี้เท่านั้น","ดอกเบี้ยสูงขึ้นทำให้ปริมาณเงินที่ต้องการถือลดลง เพราะธนาคารกลางเป็นผู้กำหนดปริมาณเงินที่ประชาชนแต่ละคนสามารถถือครองได้ตามกฎหมายที่บังคับใช้ในช่วงที่ดอกเบี้ยอยู่ในระดับสูง"],"answer":0,"a":"หัวใจของเรื่องนี้คือ “ต้นทุนค่าเสียโอกาส”\nเงินสดในกระเป๋าและเงินในบัญชีกระแสรายวันแทบไม่ให้ดอกเบี้ย ขณะที่พันธบัตรหรือเงินฝากประจำให้ดอกเบี้ย\nทุกบาทที่ถือเป็นเงินสดจึงมีต้นทุนเท่ากับดอกเบี้ยที่เสียไป\n· ดอกเบี้ย 1% — ต้นทุนของการถือเงินสดต่ำ คนถือเงินสดไว้สะดวก ๆ ได้\n· ดอกเบี้ย 10% — ต้นทุนสูงขึ้นสิบเท่า คนจะย้ายเงินไปสู่สินทรัพย์ที่ให้ผลตอบแทนและถือเงินสดไว้เท่าที่จำเป็น\nเส้นอุปสงค์ต่อการถือเงินจึงลาดลง เมื่อวัดกับอัตราดอกเบี้ย\nสามแรงจูงใจในการถือเงิน\n· เพื่อธุรกรรม — ใช้จ่ายประจำวัน ขึ้นกับระดับรายได้\n· เพื่อสำรองฉุกเฉิน — กันเหตุไม่คาดฝัน\n· เพื่อเก็งกำไร — รอจังหวะซื้อสินทรัพย์ ซึ่งไหวตัวตามดอกเบี้ยมากที่สุด\nเชื่อมกับนโยบาย — เมื่อธนาคารกลางเพิ่มปริมาณเงิน เส้นอุปทานเงินเลื่อนขวา และดุลยภาพในตลาดเงินให้อัตราดอกเบี้ยที่ต่ำลง ซึ่งเป็นจุดเริ่มต้นของการส่งผ่านไปสู่ AD","whys":["ถูกต้อง — ระบุว่าดอกเบี้ยคือต้นทุนค่าเสียโอกาสของการถือเงิน ซึ่งทำให้เส้นอุปสงค์ต่อการถือเงินลาดลง","ไม่ถูกต้อง — เงินสดและเงินฝากกระแสรายวันแทบไม่ให้ดอกเบี้ย ดอกเบี้ยที่สูงขึ้นจึงเป็นต้นทุนของการถือเงินไม่ใช่ผลตอบแทน","ไม่ถูกต้อง — รายได้เป็นตัวกำหนดที่สำคัญจริง แต่อัตราดอกเบี้ยก็มีผลชัดเจนผ่านต้นทุนค่าเสียโอกาสของการถือเงิน","ไม่ถูกต้อง — ข้อสรุปเรื่องทิศทางถูกแต่เหตุผลผิด ไม่มีกฎหมายจำกัดปริมาณเงินที่ประชาชนถือครองตามระดับดอกเบี้ย"]},{"id":"M11","type":"mcq","lvl":4,"topic":"ปริมาณเงิน","ref":"คำนวณย้อนกลับจากเป้าหมายปริมาณเงิน","q":"ธนาคารกลางต้องการให้ปริมาณเงินฝากในระบบเพิ่มขึ้น 900,000 ล้านบาท · อัตราเงินสำรองตามกฎหมาย 6% · หากสมมติว่าตัวคูณเงินทำงานเต็มที่ ธนาคารกลางต้องซื้อพันธบัตรเป็นมูลค่าประมาณเท่าใด","choices":["54,000 ล้านบาท","15,000,000 ล้านบาท","150,000 ล้านบาท","5,400 ล้านบาท"],"answer":0,"a":"โจทย์นี้เดินสูตรย้อนทาง จากเป้าหมายกลับมาหาเครื่องมือ\nขั้นที่ 1 หาตัวคูณเงิน\n= 1 ÷ 0.06 ≈ 16.67\nขั้นที่ 2 จัดรูปสูตรย้อนกลับ\nจาก Δเงินฝาก = Δเงินสำรอง × ตัวคูณ\nจึงได้ Δเงินสำรอง = Δเงินฝาก ÷ ตัวคูณ = Δเงินฝาก × R\nขั้นที่ 3 แทนค่า\n= 900,000 × 0.06 = 54,000 ล้านบาท\nตรวจทาน\n54,000 × 16.67 ≈ 900,000 ✓\nข้อสังเกตที่ช่วยคิดเร็ว — การหารด้วย (1 ÷ R) เท่ากับการคูณด้วย R โจทย์แบบนี้จึงคิดในหัวได้ทันที เพียงคูณเป้าหมายด้วยอัตราสำรอง\nคำเตือนในทางปฏิบัติ — ตัวเลข 54,000 ล้านบาทเป็นค่าที่สมมติว่าตัวคูณทำงานเต็มที่ ในโลกจริงที่มีรอยรั่วจากเงินสดในมือประชาชน สำรองส่วนเกิน และอุปสงค์สินเชื่อที่อ่อนแอ ธนาคารกลางมักต้องอัดฉีดมากกว่านี้","whys":["ถูกต้อง — ใช้ Δเงินสำรอง = Δเงินฝาก × R = 900,000 × 0.06 ได้ 54,000 ล้านบาท และตรวจทานกลับได้ตรง","ไม่ถูกต้อง — ตัวเลขนี้ได้จากการคูณเป้าหมายด้วยตัวคูณ ซึ่งเป็นการเดินสูตรไปข้างหน้าแทนที่จะเดินย้อนกลับ","ไม่ถูกต้อง — ตัวเลขนี้ได้จากการหารด้วย 6 ซึ่งเป็นการใช้เลข 6 เป็นตัวคูณเงินโดยตรงแทนที่จะคำนวณ 1 หาร 0.06","ไม่ถูกต้อง — ตัวเลขนี้น้อยกว่าคำตอบที่ถูกอยู่สิบเท่า เกิดจากการใช้อัตราสำรอง 0.6% แทน 6% ในการคำนวณ"],"tip":"ทางลัดของโจทย์ย้อนทาง: เงินสำรองที่ต้องอัดฉีด = เป้าหมายปริมาณเงิน × R — เพราะหารด้วย 1÷R ก็คือคูณด้วย R"},{"id":"M12","type":"mcq","lvl":4,"topic":"ปริมาณเงิน","ref":"มาตรการผ่อนคลายเชิงปริมาณ","q":"ข้อใดอธิบายมาตรการผ่อนคลายเชิงปริมาณ (Quantitative Easing หรือ QE) และความแตกต่างจากการดำเนินนโยบายการเงินแบบปกติได้ถูกต้องที่สุด","choices":["QE คือการที่ธนาคารกลางซื้อสินทรัพย์ระยะยาวจำนวนมากเพื่อกดดอกเบี้ยระยะยาวโดยตรง · ต่างจากแบบปกติที่มุ่งกดดอกเบี้ยระยะสั้น และถูกใช้เมื่อดอกเบี้ยระยะสั้นลดต่อไปไม่ได้แล้ว","QE คือการที่ธนาคารกลางพิมพ์ธนบัตรแจกให้ประชาชนโดยตรงเพื่อกระตุ้นการใช้จ่าย · ต่างจากแบบปกติที่ทำผ่านระบบธนาคารพาณิชย์ และถูกใช้เมื่อประชาชนไม่ยอมนำเงินฝากออกมาใช้จ่ายในระบบเศรษฐกิจ","QE คือการที่ธนาคารกลางเพิ่มอัตราเงินสำรองตามกฎหมายให้สูงขึ้นเพื่อควบคุมปริมาณเงิน · ต่างจากแบบปกติที่ใช้อัตราดอกเบี้ยเป็นเครื่องมือ และถูกใช้เมื่อเงินเฟ้อสูงเกินกรอบเป้าหมายที่กำหนดไว้","QE คือการที่ธนาคารกลางขายพันธบัตรระยะยาวออกจากงบดุลเพื่อลดขนาดงบดุลลง · ต่างจากแบบปกติที่ไม่กระทบขนาดงบดุล และถูกใช้เมื่อต้องการดึงสภาพคล่องส่วนเกินออกจากระบบการเงิน"],"answer":0,"a":"นโยบายการเงินแบบปกติ — ธนาคารกลางกำหนดอัตราดอกเบี้ยระยะสั้น แล้วปล่อยให้ดอกเบี้ยระยะยาวขยับตามผ่านกลไกตลาด\nปัญหาที่ทำให้ต้องมี QE — เมื่อดอกเบี้ยระยะสั้นลงมาใกล้ศูนย์แล้ว เครื่องมือปกติหมดพื้นที่ แต่ดอกเบี้ยระยะยาวซึ่งเป็นตัวที่สำคัญกว่าสำหรับการลงทุนและสินเชื่อบ้านยังอาจสูงอยู่\nQE ทำอย่างไร — ธนาคารกลางเข้าซื้อสินทรัพย์ระยะยาวจำนวนมาก เช่น พันธบัตรรัฐบาลอายุยาวและตราสารหนี้ที่หนุนด้วยสินเชื่อที่อยู่อาศัย ผลคือ\n· ราคาสินทรัพย์เหล่านั้นสูงขึ้น ผลตอบแทนหรือดอกเบี้ยระยะยาวลดลงโดยตรง\n· ธนาคารพาณิชย์และนักลงทุนมีเงินสำรองและสภาพคล่องเพิ่ม\n· นักลงทุนถูกผลักให้ไปหาสินทรัพย์เสี่ยงกว่า ซึ่งดันราคาหุ้นและตราสารหนี้เอกชนขึ้น สร้างผลทางความมั่งคั่ง\nข้อจำกัด — เงินสำรองที่เพิ่มขึ้นอาจกองอยู่ในระบบธนาคารโดยไม่ถูกปล่อยกู้ถ้าไม่มีอุปสงค์สินเชื่อ และผลข้างเคียงคือราคาสินทรัพย์ที่สูงขึ้นอาจเพิ่มความเหลื่อมล้ำ","whys":["ถูกต้อง — ระบุทั้งกลไกของ QE ที่มุ่งกดดอกเบี้ยระยะยาวและบริบทที่ถูกนำมาใช้เมื่อเครื่องมือปกติหมดพื้นที่","ไม่ถูกต้อง — QE ทำผ่านการซื้อสินทรัพย์ในตลาดการเงิน ไม่ใช่การแจกเงินสดให้ประชาชนโดยตรงซึ่งเป็นมาตรการทางการคลัง","ไม่ถูกต้อง — สลับทิศทาง การเพิ่มอัตราสำรองเป็นเครื่องมือหดตัว ขณะที่ QE เป็นมาตรการผ่อนคลายที่ใช้ในภาวะเศรษฐกิจอ่อนแอ","ไม่ถูกต้อง — สลับทิศทาง การขายสินทรัพย์ออกและลดขนาดงบดุลคือกระบวนการตรงข้ามที่เรียกว่าการดึงสภาพคล่องกลับ"]},{"id":"M13","type":"mcq","lvl":3,"topic":"ปริมาณเงิน","ref":"สามช่องทางส่งผ่านของอัตราดอกเบี้ยนโยบาย","q":"ธนาคารกลางขึ้นอัตราดอกเบี้ยนโยบาย 1.5 จุด ข้อใดระบุช่องทางที่ผลจะส่งผ่านไปสู่อุปสงค์รวมได้ถูกต้องครบถ้วน","choices":["ต้นทุนการกู้ที่แพงขึ้นกดการลงทุนและการบริโภคสินค้าคงทน (I และ C ลด) · ผลตอบแทนที่สูงขึ้นดึงเงินทุนไหลเข้าทำให้ค่าเงินแข็งขึ้นและการส่งออกสุทธิลด (NX ลด) · ราคาสินทรัพย์ที่ลดลงกดความมั่งคั่ง","ต้นทุนการกู้ที่แพงขึ้นกดการลงทุนลง (I ลด) เพียงช่องทางเดียวเท่านั้น · ส่วนการบริโภคและการส่งออกสุทธิไม่ได้รับผลกระทบใด ๆ เลยเพราะทั้งสองส่วนไม่ได้พึ่งพาการกู้ยืมเงินจากสถาบันการเงิน และไม่ไหวตัวตามส่วนต่างดอกเบี้ยด้วย","ดอกเบี้ยที่สูงขึ้นทำให้ผู้ฝากเงินมีรายได้ดอกเบี้ยมากขึ้น การบริโภคจึงเพิ่ม (C เพิ่ม) · ค่าเงินที่แข็งขึ้นทำให้สินค้านำเข้าถูกลงจึงช่วยเพิ่มอำนาจซื้อ ทำให้อุปสงค์รวมขยายตัวสุทธิ","ดอกเบี้ยนโยบายส่งผ่านไปสู่เส้น LRAS โดยตรงเพราะต้นทุนเงินทุนเป็นต้นทุนการผลิต · ผลผลิตศักยภาพจึงลดลงทันทีที่ดอกเบี้ยขึ้น โดยที่เส้นอุปสงค์รวมไม่ได้รับผลกระทบใด ๆ เลย"],"answer":0,"a":"อัตราดอกเบี้ยนโยบายส่งผ่านไปสู่ AD ผ่านหลายช่องทางที่ทำงานพร้อมกัน\nช่องทางที่ 1 ต้นทุนการกู้\n· การลงทุน (I) — โครงการที่ให้ผลตอบแทนต่ำกว่าต้นทุนเงินทุนใหม่จะถูกยกเลิก\n· การบริโภค (C) — รถยนต์ บ้าน เครื่องใช้ไฟฟ้า ที่ซื้อด้วยสินเชื่อจะถูกเลื่อน และครัวเรือนที่มีหนี้อัตราลอยตัวจะมีภาระผ่อนสูงขึ้นจนเหลือเงินใช้จ่ายน้อยลง\nช่องทางที่ 2 อัตราแลกเปลี่ยน (NX) — ดอกเบี้ยในประเทศที่สูงขึ้นดึงเงินทุนต่างชาติไหลเข้า ค่าเงินแข็งขึ้น สินค้าส่งออกแพงขึ้นในสายตาต่างชาติและสินค้านำเข้าถูกลง การส่งออกสุทธิจึงลดลง\nช่องทางที่ 3 ราคาสินทรัพย์และความมั่งคั่ง — ดอกเบี้ยที่สูงขึ้นกดราคาพันธบัตร หุ้น และอสังหาริมทรัพย์ ความมั่งคั่งของครัวเรือนลดลงจึงใช้จ่ายน้อยลง และมูลค่าหลักประกันที่ต่ำลงทำให้กู้ได้ยากขึ้น\nผลรวม — ทุกช่องทางชี้ไปทางเดียวกัน คือ AD เลื่อนซ้าย ซึ่งเป็นเหตุผลที่การขึ้นดอกเบี้ยใช้ชะลอเงินเฟ้อได้","whys":["ถูกต้อง — ครอบคลุมทั้งช่องทางต้นทุนการกู้ ช่องทางอัตราแลกเปลี่ยน และช่องทางความมั่งคั่ง ซึ่งทุกช่องทางกด AD ลง","ไม่ถูกต้อง — การบริโภคสินค้าคงทนพึ่งพาสินเชื่ออย่างมาก และการส่งออกสุทธิได้รับผลผ่านค่าเงินที่แข็งขึ้นอย่างชัดเจน","ไม่ถูกต้อง — ผลสุทธิของการขึ้นดอกเบี้ยคือ AD ที่หดตัว เพราะช่องทางต้นทุนการกู้และค่าเงินมีน้ำหนักมากกว่ารายได้ดอกเบี้ยของผู้ฝาก","ไม่ถูกต้อง — ดอกเบี้ยนโยบายทำงานผ่านฝั่งอุปสงค์เป็นหลัก ส่วน LRAS ถูกกำหนดโดยทุน แรงงาน และเทคโนโลยี"]},{"id":"M14","type":"mcq","lvl":4,"topic":"ปริมาณเงิน","ref":"ความเป็นอิสระของธนาคารกลาง","q":"รัฐบาลประเทศหนึ่งขาดดุลงบประมาณมากและสั่งให้ธนาคารกลางพิมพ์เงินซื้อพันธบัตรรัฐบาลโดยตรงเพื่อชดเชยการขาดดุล ข้อใดวิเคราะห์ผลได้ถูกต้องที่สุด","choices":["การใช้เงินที่พิมพ์ขึ้นมาอุดการขาดดุลอย่างต่อเนื่องจะดัน AD เกินศักยภาพและทำให้เงินเฟ้อเร่งตัว · หากทำซ้ำจนคนคาดการณ์ว่าจะทำต่อไป การคาดการณ์เงินเฟ้อจะหลุดกรอบและนำไปสู่ภาวะเงินเฟ้อรุนแรง","การทำเช่นนี้ไม่มีต้นทุนใด ๆ เพราะธนาคารกลางเป็นหน่วยงานของรัฐอยู่แล้ว การกู้จากตัวเองจึงไม่ใช่หนี้จริง · รัฐบาลจึงสามารถใช้วิธีนี้ชดเชยการขาดดุลได้อย่างไม่จำกัดโดยไม่กระทบเสถียรภาพราคา","การทำเช่นนี้จะทำให้เกิดภาวะเงินฝืดเพราะปริมาณพันธบัตรในตลาดลดลงทำให้อัตราดอกเบี้ยสูงขึ้น · ซึ่งจะกดอุปสงค์รวมลงและทำให้ระดับราคาลดลงต่อเนื่องแม้ปริมาณเงินจะเพิ่มขึ้นก็ตาม","การทำเช่นนี้จะเลื่อนเส้น LRAS ไปทางขวาเพราะรัฐบาลมีเงินไปลงทุนในโครงการพื้นฐาน · ผลผลิตศักยภาพจึงเพิ่มขึ้นมากพอที่จะรองรับปริมาณเงินที่เพิ่มขึ้นได้ทั้งหมดโดยไม่เกิดเงินเฟ้อ"],"answer":0,"a":"การให้ธนาคารกลางพิมพ์เงินอุดการขาดดุลของรัฐบาลโดยตรงเป็นสิ่งที่นักเศรษฐศาสตร์เตือนอย่างหนักแน่น\nกลไกโดยตรง — เงินที่พิมพ์ขึ้นมาใหม่เข้าสู่ระบบผ่านรายจ่ายของรัฐบาล ปริมาณเงินขยายตัวโดยที่ผลผลิตศักยภาพไม่ได้เพิ่มตาม จากสมการแลกเปลี่ยน ส่วนต่างต้องออกมาที่ระดับราคา\nกลไกที่อันตรายกว่า คือการคาดการณ์ — หากประชาชนเชื่อว่ารัฐจะทำเช่นนี้ต่อไปเรื่อย ๆ พวกเขาจะปรับการคาดการณ์เงินเฟ้อขึ้น เรียกร้องค่าจ้างสูงขึ้น ผู้ผลิตตั้งราคาสูงขึ้นล่วงหน้า SRAS เลื่อนขึ้นซ้ำ ๆ และกลายเป็นวงจรที่เลี้ยงตัวเอง\nวงจรที่เลวร้ายที่สุด — เงินเฟ้อสูงทำให้รายได้ภาษีจริงของรัฐลดลง (เพราะภาษีเก็บได้ช้ากว่าที่ราคาขึ้น) รัฐจึงยิ่งต้องพิมพ์เงินมากขึ้น ซึ่งดันเงินเฟ้อขึ้นอีก นี่คือเส้นทางไปสู่ภาวะเงินเฟ้อรุนแรงที่เคยเกิดขึ้นในหลายประเทศ\nเหตุผลที่ต้องให้ธนาคารกลางเป็นอิสระ — เพื่อให้ผู้ที่รับผิดชอบเสถียรภาพราคาไม่ต้องอยู่ใต้แรงกดดันทางการเมืองระยะสั้น ซึ่งเป็นการสร้างความน่าเชื่อถือที่ช่วยตรึงการคาดการณ์เงินเฟ้อไว้","whys":["ถูกต้อง — อธิบายทั้งกลไกโดยตรงผ่านปริมาณเงินและกลไกการคาดการณ์ที่นำไปสู่ภาวะเงินเฟ้อรุนแรง","ไม่ถูกต้อง — ต้นทุนของวิธีนี้คือเงินเฟ้อซึ่งเป็นภาษีรูปแบบหนึ่งที่ตกกับผู้ถือเงิน ไม่ใช่ว่าไม่มีต้นทุนเลย","ไม่ถูกต้อง — ธนาคารกลางที่ซื้อพันธบัตรจะกดอัตราดอกเบี้ยลงไม่ใช่ดันขึ้น และปริมาณเงินที่เพิ่มขึ้นสร้างแรงกดดันเงินเฟ้อไม่ใช่เงินฝืด","ไม่ถูกต้อง — การขาดดุลที่ต้องอุดด้วยการพิมพ์เงินมักเป็นรายจ่ายประจำ และแม้จะลงทุน LRAS ก็ขยายช้ากว่าปริมาณเงินที่เพิ่มขึ้นมาก"],"tip":"เส้นทางสู่เงินเฟ้อรุนแรง: ขาดดุล → พิมพ์เงินอุด → เงินเฟ้อ → รายได้ภาษีจริงลด → พิมพ์เงินมากขึ้น — นี่คือเหตุผลที่ธนาคารกลางต้องเป็นอิสระ"},{"id":"M15","type":"mcq","lvl":4,"topic":"ปริมาณเงิน","ref":"ดุลยภาพในตลาดเงินและผลของการอัดฉีด","q":"ในตลาดเงิน อุปทานเงินถูกกำหนดโดยธนาคารกลางและไม่ขึ้นกับอัตราดอกเบี้ย ขณะที่อุปสงค์ต่อการถือเงินลาดลง หากธนาคารกลางเพิ่มปริมาณเงินขณะที่รายได้ประชาชาติคงที่ ข้อใดอธิบายกระบวนการปรับตัวได้ถูกต้อง","choices":["เส้นอุปทานเงินเลื่อนขวา ที่ดอกเบี้ยเดิมเงินในระบบมากเกินกว่าที่คนอยากถือ คนจึงนำเงินส่วนเกินไปซื้อพันธบัตร ราคาพันธบัตรสูงขึ้นและอัตราดอกเบี้ยลดลงจนคนเต็มใจถือเงินที่มีอยู่ทั้งหมด","เส้นอุปทานเงินเลื่อนขวา ทำให้อัตราดอกเบี้ยสูงขึ้นเพราะเงินในระบบที่มากขึ้นทำให้ธนาคารพาณิชย์มีอำนาจต่อรองมากขึ้นในการกำหนดราคาสินเชื่อกับผู้กู้ที่มาขอกู้เงินจากธนาคาร","เส้นอุปสงค์ต่อการถือเงินเลื่อนขวาตามปริมาณเงินที่เพิ่มขึ้นในสัดส่วนที่เท่ากันพอดี ทำให้อัตราดอกเบี้ยดุลยภาพไม่เปลี่ยนแปลงเลย และปริมาณเงินที่เพิ่มขึ้นจึงไม่มีผลต่อระบบเศรษฐกิจใด ๆ","ทั้งเส้นอุปทานและเส้นอุปสงค์เลื่อนไปทางซ้ายพร้อมกัน เพราะปริมาณเงินที่มากขึ้นทำให้มูลค่าของเงินแต่ละหน่วยลดลง ส่งผลให้ทั้งสองฝ่ายในตลาดต้องการทำธุรกรรมน้อยลงกว่าเดิม"],"answer":0,"a":"กระบวนการปรับตัวในตลาดเงินเดินผ่านตลาดพันธบัตร\nขั้นที่ 1 อุปทานเงินเลื่อนขวา — ธนาคารกลางอัดฉีดเงินเข้าระบบ เส้นอุปทานเงินซึ่งเป็นแนวตั้งเลื่อนไปทางขวา\nขั้นที่ 2 เกิดเงินส่วนเกินที่ดอกเบี้ยเดิม — ที่อัตราดอกเบี้ยเดิม ปริมาณเงินในระบบมากกว่าที่ประชาชนต้องการถือ เพราะการถือเงินไว้เฉย ๆ มีต้นทุนค่าเสียโอกาส\nขั้นที่ 3 กลไกปรับตัว — คนนำเงินส่วนเกินไปซื้อพันธบัตร อุปสงค์พันธบัตรที่เพิ่มขึ้นดันราคาพันธบัตรให้สูงขึ้น\nขั้นที่ 4 ความสัมพันธ์ผกผันที่ต้องจำ — ราคาพันธบัตรกับอัตราผลตอบแทนเคลื่อนไหวตรงข้ามกัน พันธบัตรที่จ่ายคูปองคงที่ เมื่อราคาแพงขึ้น ผลตอบแทนต่อเงินที่จ่ายไปย่อมลดลง ดังนั้นอัตราดอกเบี้ยลดลง\nขั้นที่ 5 ดุลยภาพใหม่ — ดอกเบี้ยที่ต่ำลงทำให้ต้นทุนค่าเสียโอกาสของการถือเงินลดลง คนจึงเต็มใจถือเงินมากขึ้นจนตรงกับปริมาณที่มีอยู่\nจากจุดนี้ ดอกเบี้ยที่ต่ำลงจะส่งต่อไปยัง I C และ NX ซึ่งเป็นสะพานเข้าสู่ AD","whys":["ถูกต้อง — อธิบายกลไกปรับตัวผ่านตลาดพันธบัตรและความสัมพันธ์ผกผันระหว่างราคาพันธบัตรกับอัตราดอกเบี้ยได้ถูกต้อง","ไม่ถูกต้อง — เงินที่มากขึ้นทำให้สินเชื่อมีมากขึ้นและการแข่งขันปล่อยกู้สูงขึ้น ซึ่งกดดอกเบี้ยลงไม่ใช่ดันขึ้น","ไม่ถูกต้อง — อุปสงค์ต่อการถือเงินขึ้นกับรายได้และอัตราดอกเบี้ย ไม่ได้เลื่อนตามปริมาณเงินที่ธนาคารกลางกำหนดโดยอัตโนมัติ","ไม่ถูกต้อง — การอัดฉีดเงินทำให้อุปทานเงินเลื่อนขวา ไม่ใช่ทำให้ทั้งสองเส้นเลื่อนซ้ายพร้อมกัน"],"tip":"ความสัมพันธ์ที่ออกสอบบ่อย: ราคาพันธบัตรขึ้น = อัตราผลตอบแทนลง — และนี่คือกลไกที่ทำให้การอัดฉีดเงินกดดอกเบี้ยลงได้"},{"id":"M16","type":"mcq","lvl":4,"topic":"ปริมาณเงิน","ref":"เงินเฟ้อกับปริมาณเงินในระยะสั้นและระยะยาว","q":"ข้อมูลข้ามประเทศแสดงว่าความสัมพันธ์ระหว่างอัตราการเติบโตของปริมาณเงินกับอัตราเงินเฟ้อนั้นแน่นมากในระยะยาว แต่หลวมในระยะสั้น ข้อใดอธิบายได้ถูกต้องที่สุด","choices":["ระยะสั้น อัตราการหมุนเวียนของเงินผันผวนและผลผลิตปรับตัวรับเงินที่เพิ่มขึ้นได้บางส่วน ทำให้ความสัมพันธ์หลวม · ระยะยาว ผลผลิตกลับสู่ศักยภาพและ V ค่อนข้างเสถียร ส่วนต่างจึงไปลงที่ราคาทั้งหมด","ระยะสั้นความสัมพันธ์หลวมเพราะการวัดปริมาณเงินมีความคลาดเคลื่อนสูง · ระยะยาวข้อมูลถูกปรับปรุงให้ถูกต้องแล้วจึงเห็นความสัมพันธ์ที่ชัดเจน ซึ่งเป็นเพียงเรื่องของคุณภาพข้อมูลไม่ใช่กลไกทางเศรษฐกิจ","ระยะสั้นความสัมพันธ์แน่นกว่าเพราะราคาปรับตัวได้ทันที · ส่วนระยะยาวความสัมพันธ์หลวมลงเพราะผู้คนปรับตัวเข้ากับเงินเฟ้อได้และหันไปใช้สินทรัพย์อื่นแทนเงินในการทำธุรกรรมประจำวันมากขึ้น","ความสัมพันธ์นี้เป็นเพียงความบังเอิญทางสถิติที่ไม่มีกลไกเชิงสาเหตุรองรับ · ปริมาณเงินและเงินเฟ้อเป็นตัวแปรที่ถูกกำหนดแยกกันโดยสิ้นเชิงและไม่มีเส้นทางใดเชื่อมโยงทั้งสองเข้าด้วยกัน"],"answer":0,"a":"อธิบายด้วยสมการแลกเปลี่ยน MV = PY แล้วถามว่าอะไรขยับได้ในแต่ละช่วงเวลา\nในระยะสั้น\n· V ผันผวน — ความต้องการถือเงินเปลี่ยนตามความเชื่อมั่นและนวัตกรรมทางการเงิน เงินที่เพิ่มขึ้นอาจถูก “ดูดซับ” ด้วย V ที่ลดลงโดยไม่ไปที่ราคา\n· Y ปรับตัวได้ — เมื่อมีทรัพยากรว่างอยู่ เงินที่เพิ่มขึ้นดัน AD และผลผลิตจริงเพิ่มขึ้นได้ ราคาจึงขยับน้อย\n· ราคาเหนียว — สัญญาและเมนูราคาปรับตัวช้า\nผลรวมคือความสัมพันธ์ระหว่าง M กับ P หลวมในระยะสั้น\nในระยะยาว\n· Y กลับสู่ Y_FE — ถูกกำหนดโดยทุน แรงงาน และเทคโนโลยี ไม่ใช่โดยปริมาณเงิน\n· V ค่อนข้างเสถียร — เพราะพฤติกรรมการถือเงินเปลี่ยนช้า\nเมื่อทั้ง V และ Y ไม่ขยับตาม M ส่วนต่างทั้งหมดจึงต้องออกมาที่ P\nนัยเชิงนโยบาย — ระยะสั้นธนาคารกลางใช้นโยบายการเงินจัดการวัฏจักรได้จริง แต่ระยะยาวไม่สามารถเลือกทั้งเงินเฟ้อต่ำและปริมาณเงินโตเร็วไปพร้อมกันได้","whys":["ถูกต้อง — แยกได้ว่าระยะสั้นทั้ง V และ Y ช่วยดูดซับเงินที่เพิ่มขึ้น ขณะที่ระยะยาวทั้งสองไม่ขยับจึงเหลือเพียง P","ไม่ถูกต้อง — ความแตกต่างเกิดจากกลไกทางเศรษฐกิจที่ V และ Y ปรับตัวได้ในระยะสั้น ไม่ใช่จากคุณภาพของข้อมูล","ไม่ถูกต้อง — สลับข้อเท็จจริง ราคาปรับตัวช้าในระยะสั้นจึงทำให้ความสัมพันธ์หลวม ส่วนระยะยาวความสัมพันธ์กลับแน่นขึ้น","ไม่ถูกต้อง — มีกลไกเชิงสาเหตุรองรับชัดเจนผ่านสมการแลกเปลี่ยนและพบสม่ำเสมอในข้อมูลของหลายประเทศหลายช่วงเวลา"]},{"id":"M17","type":"mcq","lvl":4,"topic":"ปริมาณเงิน","ref":"เงินสำรองส่วนเกินที่กองอยู่ในระบบ","q":"หลังวิกฤตการเงิน ธนาคารกลางอัดฉีดเงินสำรองเข้าระบบมหาศาล แต่ปริมาณเงินตามนิยาม M2 เพิ่มขึ้นเพียงเล็กน้อยและเงินเฟ้อยังต่ำ ข้อใดอธิบายได้ถูกต้องที่สุด","choices":["เงินสำรองที่อัดฉีดเข้าไปกองอยู่ในบัญชีของธนาคารพาณิชย์โดยไม่ถูกปล่อยกู้ต่อ เพราะธนาคารเข้มงวดการปล่อยกู้และผู้กู้ก็มีไม่พอ · ตัวคูณเงินที่ทำงานจริงจึงต่ำลงมาก และเงินไม่ได้ไหลเข้าสู่การใช้จ่าย","เงินสำรองที่อัดฉีดเข้าไปถูกปล่อยกู้ออกไปหมดแล้วตามที่ควรจะเป็น แต่ผลต่อเงินเฟ้อยังไม่ปรากฏเพราะต้องใช้เวลาอีกหลายสิบปีก่อนที่ปริมาณเงินจะส่งผ่านไปถึงระดับราคาในระบบเศรษฐกิจ","การอัดฉีดเงินสำรองไม่มีความเกี่ยวข้องกับปริมาณเงินตามนิยาม M2 เลย เพราะเงินสำรองของธนาคารพาณิชย์และเงินฝากของประชาชนเป็นสองระบบที่แยกจากกันอย่างสิ้นเชิงโดยไม่มีความเชื่อมโยง","เงินเฟ้อที่ยังต่ำแสดงว่าสมการแลกเปลี่ยนใช้ไม่ได้ในทางปฏิบัติ · ความสัมพันธ์ระหว่างปริมาณเงินกับระดับราคาจึงถูกหักล้างไปแล้วโดยสิ้นเชิงและไม่มีประโยชน์ในการวิเคราะห์อีกต่อไป"],"answer":0,"a":"ปรากฏการณ์นี้เปิดเผยความจริงสำคัญว่าฐานเงินไม่ใช่ปริมาณเงิน\nสิ่งที่ธนาคารกลางควบคุมได้โดยตรง — ฐานเงิน คือเงินสดที่หมุนเวียนบวกเงินสำรองของธนาคารพาณิชย์\nสิ่งที่กระทบการใช้จ่ายจริง — ปริมาณเงินในความหมายกว้าง คือ M2 ที่รวมเงินฝากของประชาชน ซึ่งเกิดขึ้นเมื่อธนาคารปล่อยกู้\nจุดที่สายพานขาด — ธนาคารกลางอัดฉีดเงินสำรองได้ แต่ไม่สามารถบังคับให้ธนาคารปล่อยกู้หรือบังคับให้ใครมากู้ หลังวิกฤต\n· ธนาคารต้องซ่อมงบดุลของตัวเองและระวังความเสี่ยงมากขึ้น\n· ครัวเรือนและธุรกิจที่มีหนี้สูงมุ่งลดหนี้มากกว่ากู้เพิ่ม\n· ธนาคารกลางที่จ่ายดอกเบี้ยบนเงินสำรองยังทำให้การเก็บเงินไว้เฉย ๆ เป็นทางเลือกที่ปลอดภัยและได้ผลตอบแทน\nผลคือเงินสำรองกองอยู่โดยไม่กลายเป็นเงินฝากและไม่กลายเป็นการใช้จ่าย ตัวคูณเงินที่ทำงานจริงจึงดิ่งลง\nบทเรียน — สมการแลกเปลี่ยนยังใช้ได้ แต่ต้องใช้กับปริมาณเงินที่หมุนเวียนจริง ไม่ใช่กับฐานเงิน และต้องระวังว่า V ก็เปลี่ยนได้","whys":["ถูกต้อง — แยกฐานเงินออกจากปริมาณเงินที่หมุนเวียนจริง และอธิบายว่าเหตุใดสายพานส่งผ่านจึงขาดในภาวะนี้","ไม่ถูกต้อง — โจทย์ระบุชัดว่า M2 เพิ่มขึ้นเพียงเล็กน้อย ซึ่งหมายความว่าเงินสำรองไม่ได้ถูกปล่อยกู้ออกไปตามที่คาด","ไม่ถูกต้อง — เงินสำรองเชื่อมโยงกับเงินฝากผ่านกระบวนการปล่อยกู้ของธนาคาร เพียงแต่ในภาวะนี้กระบวนการนั้นไม่ทำงาน","ไม่ถูกต้อง — สมการแลกเปลี่ยนยังใช้ได้ เพียงต้องใช้กับปริมาณเงินที่หมุนเวียนจริงและคำนึงว่าอัตราการหมุนเวียนก็เปลี่ยนได้"],"tip":"แยกให้ชัด: ฐานเงิน = สิ่งที่ธนาคารกลางควบคุมได้ · M2 = สิ่งที่กระทบการใช้จ่าย — ตัวคูณเงินคือสายพานที่เชื่อมสองตัวนี้ และมันขาดได้"},{"id":"M18","type":"mcq","lvl":4,"topic":"ปริมาณเงิน","ref":"ปริมาณเงินกับอัตราแลกเปลี่ยน","q":"ธนาคารกลางของประเทศเล็กที่เปิดเสรีเงินทุนดำเนินนโยบายการเงินแบบผ่อนคลายอย่างมาก ขณะที่ประเทศคู่ค้าหลักคงนโยบายไว้ ข้อใดอธิบายผลต่อค่าเงินและอุปสงค์รวมได้ถูกต้อง","choices":["ดอกเบี้ยในประเทศที่ต่ำลงทำให้เงินทุนไหลออกไปหาผลตอบแทนที่สูงกว่า อุปสงค์ต่อเงินในประเทศลดลงและค่าเงินอ่อนลง · การส่งออกสุทธิเพิ่มขึ้น ซึ่งเสริมแรงกับช่องทางดอกเบี้ยในการดัน AD ไปทางขวา","ดอกเบี้ยในประเทศที่ต่ำลงทำให้เงินทุนไหลเข้าเพราะนักลงทุนต่างชาติต้องการกู้เงินในประเทศที่ดอกเบี้ยถูก อุปสงค์ต่อเงินในประเทศจึงเพิ่มขึ้นและค่าเงินแข็งขึ้นอย่างมีนัยสำคัญตามมา","นโยบายการเงินไม่มีผลต่ออัตราแลกเปลี่ยนเลย เพราะอัตราแลกเปลี่ยนถูกกำหนดโดยดุลการค้าเพียงอย่างเดียว · การส่งออกสุทธิจึงไม่เปลี่ยนแปลงและ AD ขยายตัวผ่านช่องทางดอกเบี้ยในประเทศเท่านั้น","ค่าเงินที่เปลี่ยนแปลงจะหักล้างผลของนโยบายการเงินพอดีเสมอ ทำให้อุปสงค์รวมไม่เปลี่ยนแปลงเลย · นโยบายการเงินในประเทศเล็กที่เปิดเสรีเงินทุนจึงไม่มีประสิทธิผลในการจัดการวัฏจักรเศรษฐกิจใด ๆ"],"answer":0,"a":"นี่คือสะพานเชื่อมปริมาณเงิน กับ อัตราแลกเปลี่ยน ซึ่งเป็นสองบทที่มักออกสอบร่วมกัน\nขั้นที่ 1 ผลต่อดอกเบี้ย — นโยบายผ่อนคลายกดดอกเบี้ยในประเทศลงต่ำกว่าต่างประเทศ\nขั้นที่ 2 การไหลของเงินทุน — นักลงทุนย้ายเงินไปหาผลตอบแทนที่สูงกว่า ในต่างประเทศ เงินทุนจึงไหลออก\nขั้นที่ 3 ผลในตลาดเงินตราต่างประเทศ — การไหลออกหมายถึงมีคนขายเงินในประเทศเพื่อซื้อเงินต่างประเทศ อุปสงค์ต่อเงินในประเทศลดลงและอุปทานเพิ่มขึ้น ค่าเงินอ่อนลง\nขั้นที่ 4 ผลต่อการค้า — ค่าเงินที่อ่อนทำให้สินค้าส่งออกถูกลงในสายตาต่างชาติและสินค้านำเข้าแพงขึ้น NX เพิ่มขึ้น\nข้อสรุปที่สำคัญ — ในประเทศเล็กที่เปิดเสรีเงินทุน ช่องทางอัตราแลกเปลี่ยนเสริมแรงกับช่องทางดอกเบี้ย ทั้งสองดัน AD ไปขวาพร้อมกัน ทำให้นโยบายการเงินมีพลังมากกว่าในประเทศปิด\nข้อควรระวัง — ค่าเงินที่อ่อนยังทำให้สินค้านำเข้าและวัตถุดิบแพงขึ้น ซึ่งดัน SRAS ขึ้นและเพิ่มแรงกดดันเงินเฟ้ออีกทาง ผู้ดำเนินนโยบายจึงต้องชั่งน้ำหนักทั้งสองด้าน","whys":["ถูกต้อง — เดินลำดับจากดอกเบี้ย สู่การไหลของเงินทุน สู่ค่าเงินที่อ่อนลง และสรุปว่าสองช่องทางเสริมแรงกัน","ไม่ถูกต้อง — เงินทุนเคลื่อนย้ายไปหาผลตอบแทนที่สูงกว่า ดอกเบี้ยในประเทศที่ต่ำลงจึงทำให้เงินทุนไหลออกไม่ใช่ไหลเข้า","ไม่ถูกต้อง — อัตราแลกเปลี่ยนถูกกำหนดโดยการไหลของเงินทุนด้วย ซึ่งไหวตัวตามส่วนต่างอัตราดอกเบี้ยอย่างมาก","ไม่ถูกต้อง — ในประเทศเล็กที่เปิดเสรีเงินทุนและใช้อัตราแลกเปลี่ยนลอยตัว ช่องทางค่าเงินเสริมผลของนโยบายการเงินไม่ใช่หักล้าง"],"tip":"สะพานข้ามสองบท: ผ่อนคลาย → ดอกเบี้ย↓ → เงินทุนไหลออก → ค่าเงินอ่อน → NX↑ → AD ขวามากขึ้นอีก"},{"id":"M19","type":"mcq","lvl":2,"topic":"ปริมาณเงิน","ref":"ความล่าช้าและข้อจำกัดของนโยบายการเงิน","q":"ข้อใดเปรียบเทียบข้อดีและข้อจำกัดของนโยบายการเงินกับนโยบายการคลังในการจัดการวัฏจักรได้ถูกต้องที่สุด","choices":["นโยบายการเงินตัดสินใจและปรับเปลี่ยนได้เร็วเพราะไม่ต้องผ่านกระบวนการนิติบัญญัติ แต่ออกฤทธิ์ช้าและอ่อนแรงเมื่อดอกเบี้ยใกล้ศูนย์ · นโยบายการคลังตัดสินใจช้าแต่เพิ่มการใช้จ่ายเข้าระบบได้โดยตรง","นโยบายการเงินตัดสินใจช้าเพราะต้องผ่านการอนุมัติจากรัฐสภาทุกครั้ง แต่ออกฤทธิ์เร็วมากเพราะกระทบการใช้จ่ายทันที · นโยบายการคลังตัดสินใจได้เร็วกว่าเพราะรัฐบาลสั่งการได้เองโดยไม่ต้องรอใคร","ทั้งสองนโยบายมีความล่าช้าเท่ากันทุกขั้นตอนและมีประสิทธิผลเท่ากันในทุกสถานการณ์ · การเลือกใช้จึงขึ้นอยู่กับความชอบของผู้ดำเนินนโยบายเท่านั้นโดยไม่มีหลักการทางเศรษฐศาสตร์ใดมากำหนด","นโยบายการเงินไม่มีความล่าช้าใด ๆ เลยทั้งในการตัดสินใจและการออกฤทธิ์ · ส่วนนโยบายการคลังไม่มีประสิทธิผลในทุกสถานการณ์เพราะถูกหักล้างด้วยการเบียดบังการลงทุนภาคเอกชนอย่างสมบูรณ์เสมอ"],"answer":0,"a":"เปรียบเทียบสองนโยบายตามความล่าช้า และความแรง\nนโยบายการเงิน\n· ข้อดี — คณะกรรมการนโยบายการเงินประชุมเป็นประจำและตัดสินใจได้เองโดยไม่ต้องผ่านกระบวนการนิติบัญญัติ จึงปรับเปลี่ยนได้เร็วและกลับทิศได้ง่าย\n· ข้อจำกัด — ความล่าช้าในการออกฤทธิ์ยาว เพราะต้องรอให้ธุรกิจตัดสินใจลงทุนและครัวเรือนตัดสินใจกู้ ซึ่งมักใช้เวลาหลายไตรมาสถึงกว่าหนึ่งปี และอ่อนแรงมากเมื่อดอกเบี้ยใกล้ศูนย์หรือเมื่อไม่มีใครอยากกู้\nนโยบายการคลัง\n· ข้อดี — เมื่อรัฐใช้จ่ายเอง G เข้าสู่ AD โดยตรงไม่ต้องรอให้ใครยอมกู้ จึงทรงพลังเป็นพิเศษในภาวะที่นโยบายการเงินตัน และมาตรการบางอย่างเช่นการโอนเงินให้ครัวเรือนรายได้น้อยส่งผลต่อการใช้จ่ายได้เร็ว\n· ข้อจำกัด — ความล่าช้าในการตัดสินใจยาวเพราะต้องผ่านกระบวนการงบประมาณและการเมือง โครงการก่อสร้างยังใช้เวลาเตรียมนาน อาจเบียดบังการลงทุนเอกชน และเพิ่มหนี้สาธารณะ\nข้อสรุปในทางปฏิบัติ — ทั้งสองนโยบายเสริมกันได้ และการเลือกน้ำหนักควรขึ้นกับสถานการณ์ โดยเฉพาะว่าดอกเบี้ยเหลือพื้นที่ให้ลดหรือไม่","whys":["ถูกต้อง — ระบุความล่าช้าของแต่ละนโยบายในขั้นที่ถูกต้อง และชี้ข้อดีเด็ดขาดของนโยบายการคลังในภาวะที่การเงินตัน","ไม่ถูกต้อง — สลับกัน นโยบายการเงินไม่ต้องผ่านรัฐสภาจึงตัดสินใจเร็ว ส่วนนโยบายการคลังต้องผ่านกระบวนการงบประมาณ","ไม่ถูกต้อง — ทั้งสองนโยบายมีรูปแบบความล่าช้าและความแรงที่ต่างกันชัดเจน การเลือกใช้จึงมีหลักการรองรับ","ไม่ถูกต้อง — นโยบายการเงินมีความล่าช้าในการออกฤทธิ์ที่ยาว และการเบียดบังการลงทุนเอกชนไม่ได้เกิดขึ้นอย่างสมบูรณ์ในทุกสถานการณ์"]},{"id":"M20","type":"mcq","lvl":4,"topic":"ปริมาณเงิน","ref":"สังเคราะห์: เลือกนโยบายการเงินในภาวะยากลำบาก","q":"ธนาคารกลางเผชิญสถานการณ์ — เงินเฟ้อ 6.5% เทียบเป้าหมาย 2% · ผลผลิตต่ำกว่าศักยภาพ · การว่างงาน 7% เทียบอัตราธรรมชาติ 5% · ต้นตอเงินเฟ้อคือราคาน้ำมันโลกและค่าระวางเรือที่พุ่งขึ้น · การคาดการณ์เงินเฟ้อระยะยาวยังทรงตัวใกล้เป้าหมาย ข้อใดคือแนวทางที่เหมาะสมที่สุด","choices":["เนื่องจากเงินเฟ้อมาจากช็อกต้นทุนภายนอกและการคาดการณ์ยังทรงตัว ควรขึ้นดอกเบี้ยอย่างระมัดระวังพร้อมสื่อสารเป้าหมายให้ชัดเจน เพื่อรักษาความน่าเชื่อถือโดยไม่ซ้ำเติมช่องว่างการหดตัวจนเกินไป","ควรขึ้นดอกเบี้ยอย่างรุนแรงที่สุดเท่าที่จะทำได้ทันทีเพื่อกดเงินเฟ้อกลับสู่เป้าหมายภายในไตรมาสเดียว โดยไม่ต้องคำนึงถึงอัตราการว่างงานที่สูงกว่าอัตราธรรมชาติอยู่แล้วในขณะนี้เลย","ควรลดดอกเบี้ยลงอย่างมากเพื่อปิดช่องว่างการหดตัวให้เร็วที่สุด เพราะการว่างงานที่สูงเป็นปัญหาเร่งด่วนกว่าเงินเฟ้อเสมอ และเงินเฟ้อจากต้นทุนภายนอกจะหายไปเองในที่สุดโดยไม่ต้องทำอะไร","ควรคงดอกเบี้ยไว้เท่าเดิมและประกาศละทิ้งเป้าหมายเงินเฟ้อชั่วคราว เพราะช็อกจากภายนอกอยู่นอกเหนือการควบคุมของนโยบายการเงินโดยสิ้นเชิงจึงไม่มีเหตุผลที่จะต้องตอบสนองใด ๆ"],"answer":0,"a":"นี่คือภาวะเงินเฟ้อควบคู่เศรษฐกิจซบเซา ซึ่งเครื่องมือเดียวต้องเผชิญสองเป้าหมายที่ขัดกัน\nทำไมจึงยาก — ขึ้นดอกเบี้ยช่วยเงินเฟ้อแต่ซ้ำเติมการว่างงาน ลดดอกเบี้ยช่วยการว่างงานแต่ซ้ำเติมเงินเฟ้อ\nข้อมูลสองชิ้นที่ชี้ทาง\n· ต้นตอเป็นช็อกต้นทุนภายนอก — ราคาน้ำมันและค่าระวางไม่ใช่สิ่งที่นโยบายการเงินในประเทศแก้ได้ที่ต้นเหตุ และช็อกแบบนี้มักคลี่คลายไปเองเมื่ออุปทานโลกปรับตัว\n· การคาดการณ์ระยะยาวยังทรงตัว — นี่คือสัญญาณที่ดีที่สุด เพราะแปลว่าประชาชนยังเชื่อว่าธนาคารกลางจะคุมเงินเฟ้อได้ในระยะยาว ยังไม่เกิดวงจรค่าจ้าง-ราคาที่เลี้ยงตัวเอง\nแนวทางที่สมเหตุสมผล — ตอบสนองแต่ระมัดระวัง ขึ้นดอกเบี้ยพอที่จะแสดงความจริงจังและป้องกันไม่ให้การคาดการณ์หลุดกรอบ แต่ไม่รุนแรงจนผลักเศรษฐกิจที่อ่อนแออยู่แล้วลงลึกกว่าเดิม ควบคู่กับการสื่อสารที่ชัดเจน ซึ่งเป็นเครื่องมือที่มีต้นทุนต่ำที่สุดในการตรึงการคาดการณ์\nเส้นแบ่งที่ต้องเฝ้าระวัง — หากการคาดการณ์ระยะยาวเริ่มขยับขึ้น ต้องเปลี่ยนไปตอบสนองแรงขึ้นทันที เพราะเมื่อการคาดการณ์หลุดกรอบแล้ว ต้นทุนในการดึงกลับจะสูงกว่ามาก","whys":["ถูกต้อง — ใช้ทั้งข้อมูลต้นตอของเงินเฟ้อและสถานะของการคาดการณ์ในการเลือกทั้งทิศทางและขนาดของการตอบสนอง","ไม่ถูกต้อง — การขึ้นดอกเบี้ยรุนแรงในภาวะที่การว่างงานสูงกว่าอัตราธรรมชาติแล้วจะสร้างต้นทุนด้านผลผลิตที่สูงเกินความจำเป็น","ไม่ถูกต้อง — การลดดอกเบี้ยขณะที่เงินเฟ้อสูงกว่าเป้าหมายมากเสี่ยงทำให้การคาดการณ์หลุดกรอบ ซึ่งแก้ไขยากและมีต้นทุนสูง","ไม่ถูกต้อง — การละทิ้งเป้าหมายจะทำลายความน่าเชื่อถือซึ่งเป็นสิ่งที่ช่วยตรึงการคาดการณ์ไว้ในขณะนี้"],"tip":"ในภาวะเงินเฟ้อควบคู่เศรษฐกิจซบเซา ตัวชี้ขาดคือ การคาดการณ์เงินเฟ้อระยะยาว — ยังทรงตัว = ตอบสนองพอประมาณ · เริ่มหลุดกรอบ = ต้องเด็ดขาดทันที"},{"id":"X01","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"นิยามอัตราแลกเปลี่ยนตามตำราและทิศทาง","q":"ตามนิยามในตำรา อัตราแลกเปลี่ยนที่เป็นตัวเงิน (e_nom) วัดเป็นจำนวนหน่วยเงินต่างประเทศต่อหนึ่งหน่วยเงินในประเทศ · หาก e_nom ของเงินบาทเพิ่มจาก 0.028 เป็น 0.031 ดอลลาร์ต่อบาท ข้อใดถูกต้อง","choices":["เงินบาทแข็งค่าขึ้น เพราะหนึ่งบาทซื้อดอลลาร์ได้มากกว่าเดิม · สังเกตว่าข่าวในประเทศมักอ้างในรูปบาทต่อดอลลาร์ซึ่งเป็นส่วนกลับ ตัวเลขที่ลดลงในรูปนั้นจึงหมายถึงบาทแข็งเช่นกัน","เงินบาทอ่อนค่าลง เพราะตัวเลขอัตราแลกเปลี่ยนที่สูงขึ้นหมายถึงต้องใช้เงินมากขึ้นในการแลก · ซึ่งสอดคล้องกับที่ข่าวในประเทศรายงานว่าเมื่อตัวเลขอัตราแลกเปลี่ยนสูงขึ้นแสดงว่าค่าเงินบาทอ่อนลง","ไม่สามารถสรุปได้ว่าแข็งหรืออ่อน เพราะต้องทราบอัตราเงินเฟ้อของทั้งสองประเทศก่อน · การเปลี่ยนแปลงของอัตราแลกเปลี่ยนที่เป็นตัวเงินเพียงอย่างเดียวไม่ได้บอกทิศทางของค่าเงินในความหมายใดเลย","เงินบาทมีค่าคงเดิมแต่เงินดอลลาร์อ่อนค่าลง เพราะในระบบอัตราแลกเปลี่ยนลอยตัวการเปลี่ยนแปลงของตัวเลขจะสะท้อนการเปลี่ยนแปลงของเงินสกุลต่างประเทศเพียงฝ่ายเดียวเท่านั้น"],"answer":0,"a":"จุดที่ต้องระวังที่สุดในบทนี้ คือทิศทางของนิยาม\nตำราใช้ e_nom = จำนวนหน่วยเงินต่างประเทศ ต่อหนึ่งหน่วยเงินในประเทศ\nดังนั้น e เพิ่มขึ้น = เงินในประเทศแข็งค่าขึ้น\nตรวจด้วยความหมาย — จาก 0.028 เป็น 0.031 ดอลลาร์ต่อบาท หมายความว่าหนึ่งบาทซื้อดอลลาร์ได้มากขึ้น เงินบาทจึงมีอำนาจซื้อสูงขึ้นในสายตาต่างประเทศ นี่คือการแข็งค่า\nทำไมจึงสับสน — สื่อในประเทศอ้างอิงในรูปส่วนกลับ คือบาทต่อดอลลาร์ ในรูปนั้น 0.028 ดอลลาร์ต่อบาท เท่ากับ 35.7 บาทต่อดอลลาร์ และ 0.031 เท่ากับ 32.3 บาทต่อดอลลาร์ ตัวเลขในรูปนั้นลดลง ซึ่งก็คือบาทแข็งเช่นกัน\nวิธีกันพลาดในห้องสอบ — อย่าจำว่า “ตัวเลขขึ้นคือแข็ง” หรือ “ตัวเลขขึ้นคืออ่อน” แต่ให้ถามว่าหนึ่งหน่วยเงินในประเทศซื้อของต่างประเทศได้มากขึ้นหรือน้อยลง ซึ่งใช้ได้กับทุกวิธีอ้างอิง","whys":["ถูกต้อง — ตีความตามนิยามของตำราได้ถูกต้องและอธิบายความสับสนที่เกิดจากการอ้างอิงในรูปส่วนกลับของสื่อ","ไม่ถูกต้อง — ใช้นิยามในรูปส่วนกลับมาตีความตัวเลขที่โจทย์ให้ในรูปของตำรา ทิศทางจึงกลับด้าน","ไม่ถูกต้อง — อัตราแลกเปลี่ยนที่เป็นตัวเงินบอกทิศทางการแข็งหรืออ่อนในความหมายที่เป็นตัวเงินได้ อัตราเงินเฟ้อจำเป็นเฉพาะกรณีที่ต้องการค่าที่แท้จริง","ไม่ถูกต้อง — อัตราแลกเปลี่ยนเป็นราคาเปรียบเทียบระหว่างสองสกุล การที่บาทแข็งขึ้นเทียบดอลลาร์คือข้อความเดียวกันกับที่ดอลลาร์อ่อนลงเทียบบาท"],"tip":"อย่าท่องทิศทางจากตัวเลข ให้ถามว่า หนึ่งหน่วยเงินในประเทศซื้อของต่างประเทศได้มากขึ้นหรือน้อยลง — มากขึ้น = แข็ง เสมอ ไม่ว่าจะอ้างอิงแบบใด"},{"id":"X02","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"คำนวณอัตราแลกเปลี่ยนที่แท้จริง","q":"ใช้สูตร e = e_nom × (P ÷ P_For) · กำหนดให้ e_nom = 0.030 ดอลลาร์ต่อบาท · ดัชนีราคาในประเทศ P = 120 · ดัชนีราคาต่างประเทศ P_For = 100 · อัตราแลกเปลี่ยนที่แท้จริงเท่ากับเท่าใด","choices":["0.036","0.025","0.150","3.600"],"answer":0,"a":"แทนค่าในสูตร\ne = e_nom × (P ÷ P_For)\ne = 0.030 × (120 ÷ 100)\ne = 0.030 × 1.2 = 0.036\nความหมายของตัวเลขนี้ — อัตราแลกเปลี่ยนที่แท้จริงบอกว่าสินค้าในประเทศหนึ่งหน่วยแลกสินค้าต่างประเทศได้กี่หน่วย ไม่ใช่เพียงเงินแลกเงิน\nอ่านผลให้ได้ความหมาย — ค่า e ที่แท้จริงสูงกว่า e ที่เป็นตัวเงิน เพราะราคาในประเทศสูงกว่าต่างประเทศอยู่ 20% นั่นหมายความว่าสินค้าในประเทศแพงขึ้นในเชิงเปรียบเทียบ ซึ่งบั่นทอนความสามารถในการแข่งขันของผู้ส่งออก\nทำไมต้องใช้ค่าที่แท้จริง — ผู้ซื้อต่างชาติไม่ได้ดูเพียงอัตราแลกเปลี่ยน แต่ดูว่าเมื่อแลกเงินแล้วซื้อสินค้าได้ถูกหรือแพง ตัวเลขที่แท้จริงจึงเป็นตัวชี้วัดความสามารถในการแข่งขันที่แท้จริง","whys":["ถูกต้อง — 0.030 คูณด้วยอัตราส่วนราคา 120 ต่อ 100 ซึ่งเท่ากับ 1.2 ได้ผลลัพธ์ 0.036","ไม่ถูกต้อง — ตัวเลขนี้ได้จากการหารด้วยอัตราส่วนราคาแทนที่จะคูณ ซึ่งกลับทิศของสูตรที่โจทย์กำหนด","ไม่ถูกต้อง — ตัวเลขนี้ได้จากการคูณด้วยอัตราส่วน 120 ต่อ 100 ในรูปที่ไม่ได้แปลงเป็นทศนิยม จึงเกินไปห้าเท่า","ไม่ถูกต้อง — ตัวเลขนี้เกินคำตอบที่ถูกอยู่ร้อยเท่า เกิดจากการใช้ 120 เป็นตัวคูณโดยไม่หารด้วยดัชนีราคาต่างประเทศ"],"tip":"สูตรที่ต้องจำ: e = e_nom × (P ÷ P_For) — และตีความว่าค่าที่แท้จริงสูงขึ้น = สินค้าในประเทศแพงขึ้นเชิงเปรียบเทียบ = แข่งขันยากขึ้น"},{"id":"X03","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"ค่าเงินแข็งขึ้นที่แท้จริงแม้ตัวเงินคงที่","q":"ในสองปี อัตราแลกเปลี่ยนที่เป็นตัวเงินของประเทศหนึ่งไม่เปลี่ยนแปลงเลย แต่เงินเฟ้อในประเทศอยู่ที่ 8% ต่อปี ขณะที่ประเทศคู่ค้าอยู่ที่ 2% ต่อปี ข้อใดอธิบายผลต่อความสามารถในการแข่งขันได้ถูกต้อง","choices":["อัตราแลกเปลี่ยนที่แท้จริงสูงขึ้นเพราะราคาในประเทศเพิ่มเร็วกว่าคู่ค้า สินค้าในประเทศจึงแพงขึ้นเชิงเปรียบเทียบ · ความสามารถในการแข่งขันลดลงและดุลการค้ามีแนวโน้มแย่ลงแม้ตัวเลขอัตราแลกเปลี่ยนจะนิ่ง","อัตราแลกเปลี่ยนที่แท้จริงไม่เปลี่ยนแปลงเพราะอัตราแลกเปลี่ยนที่เป็นตัวเงินคงที่ · ความสามารถในการแข่งขันจึงคงเดิมทุกประการ เพราะเงินเฟ้อในประเทศกระทบเฉพาะผู้บริโภคในประเทศไม่ใช่ผู้ซื้อจากต่างประเทศ","อัตราแลกเปลี่ยนที่แท้จริงลดลงเพราะเงินเฟ้อทำให้มูลค่าของเงินในประเทศลดลง · สินค้าในประเทศจึงถูกลงในสายตาผู้ซื้อต่างชาติ ทำให้การส่งออกเพิ่มขึ้นและดุลการค้าปรับตัวดีขึ้นอย่างชัดเจน","อัตราแลกเปลี่ยนที่แท้จริงจะปรับตัวกลับมาที่ระดับเดิมโดยอัตโนมัติทันที · เพราะอำนาจซื้อเสมอภาคบังคับให้ราคาสินค้าที่วัดเป็นสกุลเดียวกันเท่ากันทุกประเทศในทุกช่วงเวลาโดยไม่มีข้อยกเว้น"],"answer":0,"a":"โจทย์นี้แสดงว่าค่าเงินแข็งขึ้นได้โดยที่ตัวเลขอัตราแลกเปลี่ยนไม่ขยับเลย\nดูจากสูตร\ne = e_nom × (P ÷ P_For)\nเมื่อ e_nom คงที่ แต่ P โต 8% ต่อปี ขณะที่ P_For โต 2% ต่อปี\nอัตราส่วน P ÷ P_For จึงเพิ่มขึ้นประมาณ 6% ต่อปี\nในสองปีจึงเพิ่มขึ้นประมาณ 12% ทำให้ e ที่แท้จริงสูงขึ้นประมาณ 12%\nความหมายในทางปฏิบัติ — ผู้ซื้อต่างชาติที่แลกเงินมาซื้อสินค้าของประเทศนี้พบว่าได้สินค้าน้อยลง เพราะราคาในประเทศขึ้นแต่อัตราแลกเปลี่ยนไม่ช่วยชดเชย สินค้าจากประเทศนี้จึงแพงขึ้น ในเชิงเปรียบเทียบ\nผลที่ตามมา — การส่งออกอ่อนแรง การนำเข้าน่าดึงดูดขึ้น NX ลดลง ซึ่งกด AD และกระทบภาคการผลิตที่แข่งขันกับสินค้านำเข้า\nบทเรียนสำคัญ — ประเทศที่ตรึงอัตราแลกเปลี่ยนไว้แต่มีเงินเฟ้อสูงกว่าคู่ค้าจะสูญเสียความสามารถในการแข่งขันไปเรื่อย ๆ อย่างเงียบ ๆ ซึ่งเป็นแรงกดดันที่นำไปสู่การลดค่าเงินในที่สุด","whys":["ถูกต้อง — คำนวณผลของส่วนต่างเงินเฟ้อต่อค่าที่แท้จริงได้ถูกทิศ และเชื่อมไปสู่ผลต่อความสามารถในการแข่งขันและดุลการค้า","ไม่ถูกต้อง — ผู้ซื้อต่างชาติสนใจราคาสินค้าหลังแลกเงิน เงินเฟ้อในประเทศจึงกระทบพวกเขาผ่านค่าที่แท้จริงอย่างชัดเจน","ไม่ถูกต้อง — กลับทิศ เงินเฟ้อในประเทศที่สูงกว่าคู่ค้าทำให้สินค้าในประเทศแพงขึ้น ในสายตาผู้ซื้อต่างชาติไม่ใช่ถูกลง","ไม่ถูกต้อง — อำนาจซื้อเสมอภาคเป็นแรงโน้มถ่วงในระยะยาว ไม่ใช่กลไกที่บังคับให้ราคาเท่ากันได้ทันทีในทุกช่วงเวลา"],"tip":"จำไว้ว่า ค่าเงินแข็งขึ้นที่แท้จริงเกิดได้สองทาง: อัตราแลกเปลี่ยนที่เป็นตัวเงินแข็งขึ้น หรือ เงินเฟ้อในประเทศสูงกว่าคู่ค้า"},{"id":"X04","type":"mcq","lvl":2,"topic":"อัตราแลกเปลี่ยน","ref":"ปัจจัยที่เลื่อนอุปสงค์ต่อเงินในประเทศ","q":"ในตลาดเงินตราต่างประเทศ ข้อใดคือชุดของเหตุการณ์ที่ทำให้อุปสงค์ต่อเงินในประเทศเพิ่มขึ้นทั้งหมด","choices":["ต่างชาติซื้อสินค้าส่งออกของเราเพิ่มขึ้น · เงินทุนต่างชาติไหลเข้าซื้อพันธบัตรในประเทศ · นักท่องเที่ยวต่างชาติเดินทางเข้ามามากขึ้น · แรงงานที่ทำงานต่างประเทศส่งเงินกลับบ้านเพิ่มขึ้น","คนในประเทศนำเข้าสินค้าจากต่างประเทศมากขึ้น · นักลงทุนในประเทศไปซื้อหลักทรัพย์ต่างประเทศเพิ่มขึ้น · คนในประเทศเดินทางท่องเที่ยวต่างประเทศมากขึ้น · บริษัทในประเทศไปลงทุนตั้งโรงงานในต่างประเทศ","ต่างชาติซื้อสินค้าส่งออกของเราเพิ่มขึ้น · คนในประเทศนำเข้าสินค้ามากขึ้น · นักลงทุนในประเทศไปซื้อหลักทรัพย์ต่างประเทศ · นักท่องเที่ยวต่างชาติลดจำนวนการเดินทางเข้ามาลงอย่างชัดเจน","ธนาคารกลางลดอัตราดอกเบี้ยนโยบายลง · รัฐบาลเพิ่มภาษีนำเข้าสำหรับสินค้าทุกประเภท · คนในประเทศส่งเงินไปให้ญาติที่อยู่ต่างประเทศ · บริษัทต่างชาติถอนเงินลงทุนออกจากตลาดหุ้นในประเทศ"],"answer":0,"a":"หลักคิดที่ใช้ได้ทุกข้อ — ถามว่ารายการนั้นทำให้ใครต้องการเงินในประเทศ\nอุปสงค์ต่อเงินในประเทศเพิ่ม เกิดเมื่อต่างชาติต้องแลกเงินของเขามาเป็นเงินของเรา\n· เราส่งออกได้มากขึ้น — ผู้ซื้อต่างชาติต้องแลกเงินมาจ่ายเรา\n· เงินทุนไหลเข้า — นักลงทุนต่างชาติต้องแลกเงินมาซื้อพันธบัตรหรือหุ้นในประเทศ\n· นักท่องเที่ยวเข้ามา — ต้องแลกเงินมาใช้จ่ายในประเทศ\n· แรงงานส่งเงินกลับ — เงินตราต่างประเทศถูกแลกเป็นเงินในประเทศ\nอุปทานเงินในประเทศเพิ่ม (ซึ่งกดค่าเงินให้อ่อน) เกิดเมื่อคนในประเทศต้องแลกเงินของเราไปเป็นเงินต่างประเทศ ได้แก่ การนำเข้า การไปลงทุนต่างประเทศ การไปเที่ยวต่างประเทศ และการส่งเงินออก\nผลต่ออัตราแลกเปลี่ยน — อุปสงค์ต่อเงินในประเทศที่เพิ่มขึ้นทำให้ค่าเงินแข็งขึ้น ตามนิยาม e ที่สูงขึ้น\nท่าตรวจคำตอบ — ในชุดคำตอบที่ถูก ทุกรายการต้องเป็น “ต่างชาติต้องการเงินเรา” ถ้ามีรายการใดเป็น “เราต้องการเงินเขา” ปนอยู่ ข้อนั้นผิด","whys":["ถูกต้อง — ทุกรายการในชุดนี้ทำให้ต่างชาติต้องแลกเงินมาเป็นเงินในประเทศ จึงเพิ่มอุปสงค์ต่อเงินในประเทศทั้งหมด","ไม่ถูกต้อง — ทุกรายการในชุดนี้ทำให้คนในประเทศต้องแลกเงินออกไป ซึ่งเพิ่มอุปทานเงินในประเทศและกดค่าเงินให้อ่อน","ไม่ถูกต้อง — มีรายการที่ทิศทางสวนกันปนอยู่ ทั้งการนำเข้าที่เพิ่มขึ้นและนักท่องเที่ยวที่ลดลงต่างก็กดค่าเงินให้อ่อน","ไม่ถูกต้อง — การลดดอกเบี้ยทำให้เงินทุนไหลออก และการถอนเงินลงทุนของต่างชาติก็ลดอุปสงค์ต่อเงินในประเทศเช่นกัน"]},{"id":"X05","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"อ่านกราฟตลาดเงินตราต่างประเทศ","q":"จากแผนภาพ เส้นอุปสงค์ต่อเงินบาทเลื่อนไปทางขวาจากเดิม ข้อใดระบุสาเหตุที่เป็นไปได้และผลลัพธ์ได้ถูกต้อง","choices":["สาเหตุอาจมาจากการส่งออกที่ขยายตัวหรือเงินทุนต่างชาติที่ไหลเข้ามากขึ้น · ผลคืออัตราแลกเปลี่ยนสูงขึ้นจาก e₁ เป็น e₂ ซึ่งตามนิยามในตำราหมายถึงเงินบาทแข็งค่าขึ้น","สาเหตุอาจมาจากการนำเข้าที่เพิ่มขึ้นหรือคนในประเทศไปลงทุนต่างประเทศมากขึ้น · ผลคืออัตราแลกเปลี่ยนสูงขึ้นจาก e₁ เป็น e₂ ซึ่งตามนิยามในตำราหมายถึงเงินบาทอ่อนค่าลงจากเดิม","สาเหตุอาจมาจากธนาคารกลางที่ลดอัตราดอกเบี้ยนโยบายลงอย่างมาก · ผลคืออัตราแลกเปลี่ยนลดลงจาก e₁ เป็น e₂ ซึ่งตามนิยามในตำราหมายถึงเงินบาทแข็งค่าขึ้นจากระดับเดิมอย่างชัดเจน","สาเหตุอาจมาจากการที่ธนาคารกลางเข้าขายเงินบาทในตลาดเป็นจำนวนมาก · ผลคืออัตราแลกเปลี่ยนไม่เปลี่ยนแปลงเพราะการเลื่อนของเส้นอุปสงค์จะถูกหักล้างด้วยอุปทานที่เพิ่มขึ้นพอดี"],"answer":0,"a":"อ่านกราฟตามลำดับ\nขั้นที่ 1 เส้นไหนเลื่อน — เส้นอุปสงค์ต่อเงินบาท (D) เลื่อนไปทางขวา\nขั้นที่ 2 อะไรทำให้เลื่อน — ต้องเป็นสิ่งที่ทำให้ต่างชาติต้องการเงินบาทมากขึ้น\n· การส่งออกที่ขยายตัว ผู้ซื้อต่างชาติต้องแลกเงินมาจ่ายเรามากขึ้น\n· เงินทุนไหลเข้า นักลงทุนต่างชาติต้องแลกเงินมาซื้อสินทรัพย์ในประเทศ\n· นักท่องเที่ยวเข้ามามากขึ้น\nขั้นที่ 3 ผลต่อดุลยภาพ — ที่จุดตัดใหม่ ระดับ e สูงขึ้นจาก e₁ เป็น e₂ และปริมาณเงินบาทที่ซื้อขายเพิ่มขึ้น\nขั้นที่ 4 แปลความให้ถูกทิศ — จุดนี้คือที่ผิดกันบ่อยที่สุด ตามนิยามของตำรา e วัดเป็นเงินต่างประเทศต่อหนึ่งหน่วยเงินบาท ดังนั้น e สูงขึ้น = เงินบาทแข็งค่าขึ้น เพราะหนึ่งบาทซื้อเงินต่างประเทศได้มากกว่าเดิม\nผลต่อเนื่อง — บาทที่แข็งขึ้นทำให้สินค้าส่งออกแพงขึ้นในสายตาต่างชาติและสินค้านำเข้าถูกลง ซึ่งจะทอนแรงของการขยายตัวของการส่งออกลงบางส่วนในรอบถัดไป","whys":["ถูกต้อง — ระบุสาเหตุที่ทำให้อุปสงค์ต่อเงินบาทเพิ่มขึ้นและแปลทิศทางของ e ตามนิยามในตำราได้ถูกต้อง","ไม่ถูกต้อง — การนำเข้าและการไปลงทุนต่างประเทศเพิ่มอุปทานเงินบาท ไม่ใช่อุปสงค์ และทิศทางการแปลค่า e ก็กลับด้าน","ไม่ถูกต้อง — การลดดอกเบี้ยทำให้เงินทุนไหลออกซึ่งลดอุปสงค์ต่อเงินบาท และกราฟแสดงว่า e สูงขึ้นไม่ใช่ลดลง","ไม่ถูกต้อง — กราฟแสดงชัดว่าดุลยภาพเคลื่อนจาก e₁ ไปสู่ e₂ ที่ระดับสูงขึ้น ไม่ใช่ไม่เปลี่ยนแปลง"],"tip":"ท่าอ่านกราฟนี้: ใครต้องการเงินเรา = อุปสงค์ · เราต้องการเงินเขา = อุปทาน แล้วจึงแปล e ตามนิยามของตำราให้ถูกทิศ","fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n    <defs><clipPath id=\"clipFX\"><rect x=\"76\" y=\"34\" width=\"422\" height=\"296\"/></clipPath></defs>\n    <line x1=\"76\" y1=\"26\" x2=\"76\" y2=\"330\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n    <line x1=\"76\" y1=\"330\" x2=\"512\" y2=\"330\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n    <text x=\"70\" y=\"20\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"middle\">e (อัตราแลกเปลี่ยน)</text>\n    <text x=\"516\" y=\"336\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"end\" transform=\"translate(0,22)\">ปริมาณเงินบาทในตลาดเงินตราต่างประเทศ</text>\n    <g clip-path=\"url(#clipFX)\"><line x1=\"97.1\" y1=\"69.51999999999998\" x2=\"476.9\" y2=\"306.32\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\" stroke-dasharray=\"7 5\"/><line x1=\"173.06\" y1=\"69.51999999999998\" x2=\"552.8599999999999\" y2=\"306.32\" stroke=\"var(--curve-ad)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><line x1=\"97.1\" y1=\"306.32\" x2=\"476.9\" y2=\"69.51999999999998\" stroke=\"var(--curve-as)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><circle cx=\"287\" cy=\"187.92000000000002\" r=\"4.5\" fill=\"var(--surface)\" stroke=\"var(--muted)\" stroke-width=\"2\"/><line x1=\"287\" y1=\"187.92000000000002\" x2=\"76\" y2=\"187.92000000000002\" stroke=\"var(--line-2)\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/><circle cx=\"324.98\" cy=\"164.23999999999998\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><line x1=\"324.98\" y1=\"164.23999999999998\" x2=\"76\" y2=\"164.23999999999998\" stroke=\"var(--line-2)\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/></g><text x=\"404.72\" y=\"212.9688888888889\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--curve-ad)\">D&#8322; (อุปสงค์)</text><text x=\"404.72\" y=\"123.51111111111109\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--curve-as)\">S (อุปทาน)</text><text x=\"67\" y=\"192.92000000000002\" font-size=\"13\" fill=\"var(--muted)\" text-anchor=\"end\">e<tspan dy=\"3\" font-size=\"10\">1</tspan></text><text x=\"67\" y=\"169.23999999999998\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"end\">e<tspan dy=\"3\" font-size=\"10\">2</tspan></text>\n  </svg><div class=\"figcap\">เส้นอุปสงค์ต่อเงินบาทเลื่อนขวา · เปรียบเทียบดุลยภาพเดิมกับดุลยภาพใหม่</div></div>"},{"id":"X06","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"อำนาจซื้อเสมอภาคและข้อจำกัด","q":"แนวคิดอำนาจซื้อเสมอภาค (Purchasing Power Parity หรือ PPP) ทำนายว่าอัตราแลกเปลี่ยนจะปรับตัวจนราคาสินค้าที่วัดเป็นสกุลเดียวกันเท่ากันทุกประเทศ ข้อใดประเมินแนวคิดนี้ได้ถูกต้องที่สุด","choices":["เป็นแรงโน้มถ่วงที่อธิบายทิศทางในระยะยาวได้ดี โดยเฉพาะประเทศที่มีเงินเฟ้อต่างกันมาก · แต่ในระยะสั้นคลาดเคลื่อนสูงเพราะมีต้นทุนขนส่ง อุปสรรคการค้า สินค้าที่ค้าขายข้ามประเทศไม่ได้ และการไหลของเงินทุน","เป็นแนวคิดที่แม่นยำสมบูรณ์ในทุกช่วงเวลาและทุกประเทศ · อัตราแลกเปลี่ยนที่สังเกตได้จริงในตลาดจะเท่ากับค่าที่แนวคิดนี้ทำนายไว้ตลอดเวลาโดยไม่มีความคลาดเคลื่อนใด ๆ เกิดขึ้นเลย","เป็นแนวคิดที่ถูกหักล้างไปแล้วโดยสิ้นเชิงและไม่มีประโยชน์ในการวิเคราะห์ · อัตราแลกเปลี่ยนถูกกำหนดโดยการเก็งกำไรระยะสั้นเพียงอย่างเดียวและไม่มีความสัมพันธ์กับระดับราคาในแต่ละประเทศ การนำแนวคิดนี้มาใช้จึงให้ผลที่คลาดเคลื่อนในทุกกรณี","เป็นแนวคิดที่อธิบายได้ดีในระยะสั้นเพราะราคาปรับตัวได้เร็ว · แต่ใช้ไม่ได้ในระยะยาวเพราะเมื่อเวลาผ่านไปโครงสร้างเศรษฐกิจของแต่ละประเทศจะแตกต่างกันมากขึ้นจนเทียบกันไม่ได้อีกต่อไป"],"answer":0,"a":"เหตุผลเบื้องหลังแนวคิดนี้ — หากสินค้าเดียวกันราคาถูกกว่าในประเทศหนึ่งมาก ก็จะมีคนซื้อจากที่ถูกไปขายที่แพง ซึ่งดันราคาและอัตราแลกเปลี่ยนให้ลู่เข้าหากัน\nที่ใช้ได้ดี — ในระยะยาวและกับประเทศที่มีอัตราเงินเฟ้อต่างกันมาก ประเทศที่มีเงินเฟ้อสูงกว่าคู่ค้าอย่างต่อเนื่องจะมีค่าเงินอ่อนลงในระยะยาวอย่างชัดเจน ซึ่งเป็นการทำนายที่ข้อมูลสนับสนุน\nที่คลาดเคลื่อน\n· ต้นทุนขนส่งและภาษีนำเข้า — ทำให้การซื้อถูกไปขายแพงไม่คุ้ม ราคาจึงต่างกันได้ถาวร\n· สินค้าที่ค้าขายข้ามประเทศไม่ได้ — ค่าตัดผม ค่าเช่าบ้าน ค่าบริการทางการแพทย์ ขนส่งข้ามประเทศไม่ได้ จึงไม่มีแรงกดดันให้ราคาเท่ากัน และนี่คือสาเหตุสำคัญที่ระดับราคาโดยรวมของประเทศรายได้ต่ำมักต่ำกว่าอย่างเป็นระบบ\n· การไหลของเงินทุน — ในระยะสั้น อัตราแลกเปลี่ยนถูกขับเคลื่อนโดยส่วนต่างดอกเบี้ยและความเชื่อมั่นมากกว่าการค้าสินค้า\n· สินค้าที่ไม่เหมือนกันทุกประการ — แบรนด์และคุณภาพต่างกันทำให้เทียบราคาตรง ๆ ไม่ได้\nวิธีใช้ที่ถูกต้อง — ใช้เป็นเข็มทิศบอกทิศทางระยะยาว ไม่ใช่เป็นสูตรทำนายระดับที่แม่นยำ","whys":["ถูกต้อง — ประเมินได้สมดุล ทั้งพลังในการอธิบายทิศทางระยะยาวและข้อจำกัดในระยะสั้นที่ระบุสาเหตุไว้ครบ","ไม่ถูกต้อง — ข้อมูลจริงแสดงความคลาดเคลื่อนจากค่าที่แนวคิดนี้ทำนายอย่างมากและต่อเนื่องเป็นเวลานาน","ไม่ถูกต้อง — แนวคิดนี้ยังอธิบายทิศทางระยะยาวได้ดี โดยเฉพาะระหว่างประเทศที่มีอัตราเงินเฟ้อแตกต่างกันมาก","ไม่ถูกต้อง — สลับกรอบเวลา แนวคิดนี้อธิบายระยะยาวได้ดีกว่าระยะสั้น เพราะระยะสั้นถูกครอบงำโดยการไหลของเงินทุน"]},{"id":"X07","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"ค่าเงินอ่อนกระทบทั้งสองเส้นพร้อมกัน","q":"เงินบาทอ่อนค่าลงอย่างมาก โดยที่ประเทศนี้พึ่งพาการนำเข้าน้ำมันและวัตถุดิบในสัดส่วนสูง ข้อใดวิเคราะห์ผลต่อ AD และ AS ได้ถูกต้องที่สุด","choices":["AD เลื่อนขวาเพราะการส่งออกสุทธิเพิ่มขึ้นจากสินค้าที่ถูกลงในสายตาต่างชาติ · ขณะเดียวกัน SRAS เลื่อนขึ้นเพราะต้นทุนวัตถุดิบนำเข้าแพงขึ้น · ผลสุทธิต่อผลผลิตจึงขึ้นกับว่าแรงใดมีน้ำหนักมากกว่า","AD เลื่อนขวาเพราะการส่งออกสุทธิเพิ่มขึ้นเพียงผลเดียวเท่านั้น · ส่วนต้นทุนการผลิตไม่ได้รับผลกระทบเลยเพราะผู้ผลิตในประเทศซื้อวัตถุดิบด้วยเงินบาทซึ่งเป็นสกุลเดิมที่ไม่มีการเปลี่ยนแปลง","AD เลื่อนซ้ายเพราะค่าเงินที่อ่อนทำให้ประชาชนสูญเสียความเชื่อมั่นและลดการใช้จ่าย · ขณะที่ SRAS เลื่อนลงเพราะผู้ผลิตต้องลดราคาเพื่อแข่งขันกับสินค้านำเข้าที่ราคาถูกลงกว่าเดิมอย่างมาก","เฉพาะเส้น LRAS เท่านั้นที่เลื่อนซ้ายเพราะค่าเงินที่อ่อนทำให้ประเทศซื้อเครื่องจักรจากต่างประเทศได้น้อยลง · ส่วนเส้น AD และ SRAS ไม่ได้รับผลกระทบใด ๆ จากการเปลี่ยนแปลงของอัตราแลกเปลี่ยน"],"answer":0,"a":"ค่าเงินที่อ่อนลงเป็นตัวอย่างชัดเจนของช็อกที่กระทบทั้งสองฝั่ง\nฝั่งอุปสงค์ AD เลื่อนขวา\n· สินค้าส่งออกของเราถูกลงในสายตาต่างชาติ ปริมาณการส่งออกเพิ่ม\n· สินค้านำเข้าแพงขึ้น คนในประเทศหันมาซื้อสินค้าในประเทศแทน\n· ทั้งสองทางทำให้ NX เพิ่มขึ้น\nฝั่งอุปทาน SRAS เลื่อนขึ้น\n· น้ำมัน วัตถุดิบ และชิ้นส่วนนำเข้าแพงขึ้นในรูปเงินบาท\n· ต้นทุนการผลิตของผู้ผลิตในประเทศสูงขึ้น ผู้ผลิตจึงต้องตั้งราคาสูงขึ้นในทุกระดับผลผลิต\nผลลัพธ์\n· ระดับราคา — สูงขึ้นแน่นอน เพราะทั้งสองแรงดัน P ขึ้นในทิศเดียวกัน\n· ผลผลิต — ไม่แน่นอน ขึ้นกับว่าแรงใดมีน้ำหนักมากกว่า\nอะไรตัดสินน้ำหนัก\n· ประเทศที่ส่งออกสินค้าที่ใช้วัตถุดิบในประเทศเป็นหลัก ฝั่ง AD จะชนะ ค่าเงินอ่อนช่วยเศรษฐกิจ\n· ประเทศที่พึ่งพาการนำเข้าพลังงานและชิ้นส่วนสูงอย่างในโจทย์ ฝั่งต้นทุนจะหนัก ค่าเงินอ่อนอาจให้ผลสุทธิเป็นลบ\nนี่คือเหตุผลที่คำถามว่า “ค่าเงินอ่อนดีหรือไม่” ไม่มีคำตอบเดียวสำหรับทุกประเทศ","whys":["ถูกต้อง — วิเคราะห์ผลทั้งสองฝั่งอย่างครบถ้วนและสรุปว่าผลสุทธิต่อผลผลิตขึ้นกับน้ำหนักเปรียบเทียบของสองแรง","ไม่ถูกต้อง — วัตถุดิบนำเข้ามีราคาอ้างอิงเป็นสกุลต่างประเทศ เมื่อแปลงเป็นเงินบาทที่อ่อนลงจึงแพงขึ้นอย่างชัดเจน","ไม่ถูกต้อง — กลับทิศทั้งสองเส้น ค่าเงินที่อ่อนทำให้สินค้านำเข้าแพงขึ้น ไม่ใช่ถูกลง และช่วยเพิ่มการส่งออกสุทธิ","ไม่ถูกต้อง — ผลหลักในระยะสั้นอยู่ที่ AD และ SRAS ส่วน LRAS อาจถูกกระทบผ่านการลงทุนแต่เป็นผลรองที่ใช้เวลานาน"],"tip":"ค่าเงินอ่อน = ช็อกสองหน้า — AD ขวา (ส่งออกดีขึ้น) และ SRAS ขึ้น (ต้นทุนนำเข้าแพง) · P ขึ้นแน่ ส่วน Y ขึ้นกับโครงสร้างการนำเข้าของประเทศ"},{"id":"X08","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"ระบบอัตราแลกเปลี่ยนคงที่เทียบลอยตัว","q":"ข้อใดเปรียบเทียบข้อดีและข้อเสียของระบบอัตราแลกเปลี่ยนคงที่กับระบบลอยตัวได้ถูกต้องที่สุด","choices":["ระบบคงที่ให้ความแน่นอนแก่ผู้ค้าและช่วยตรึงการคาดการณ์เงินเฟ้อ แต่ต้องใช้เงินสำรองปกป้องและสูญเสียอิสระทางการเงิน · ระบบลอยตัวให้อิสระทางการเงินและปรับตัวรับช็อกได้เอง แต่ต้องรับความผันผวน","ระบบคงที่ให้อิสระทางการเงินอย่างเต็มที่เพราะธนาคารกลางไม่ต้องกังวลเรื่องค่าเงิน · ระบบลอยตัวทำให้สูญเสียอิสระทางการเงินเพราะต้องคอยปรับดอกเบี้ยตามตลาดโลกอยู่ตลอดเวลาไม่มีทางเลือกอื่น","ทั้งสองระบบให้ผลลัพธ์ที่เหมือนกันทุกประการในทุกด้าน · การเลือกใช้จึงเป็นเพียงเรื่องของธรรมเนียมปฏิบัติของแต่ละประเทศโดยไม่มีผลต่อการดำเนินนโยบายหรือความเสี่ยงทางเศรษฐกิจใด ๆ","ระบบลอยตัวเหนือกว่าในทุกมิติและทุกสถานการณ์ · ประเทศที่ยังใช้ระบบคงที่จึงเป็นเพราะขาดความรู้ทางเศรษฐศาสตร์ และไม่มีเหตุผลทางเศรษฐกิจใดที่สนับสนุนการตรึงค่าเงินไว้เลย"],"answer":0,"a":"ทั้งสองระบบมีการแลกเปลี่ยนที่ต้องยอมรับ\nระบบคงที่\n· ข้อดี — ผู้ส่งออกและนำเข้าวางแผนได้โดยไม่ต้องกังวลความเสี่ยงค่าเงิน ช่วยการค้าและการลงทุนข้ามประเทศ และสำหรับประเทศที่มีประวัติเงินเฟ้อสูง การตรึงกับสกุลที่มีเสถียรภาพช่วยยืมความน่าเชื่อถือมาตรึงการคาดการณ์เงินเฟ้อ\n· ข้อเสีย — ต้องมีเงินสำรองระหว่างประเทศเพียงพอที่จะปกป้องค่าเงิน เสี่ยงต่อการถูกโจมตีค่าเงินเมื่อพื้นฐานไม่สอดคล้องกับอัตราที่ตรึงไว้ และต้องใช้ดอกเบี้ยเพื่อรักษาค่าเงินจนไม่เหลืออิสระที่จะใช้ดอกเบี้ยดูแลเศรษฐกิจในประเทศ\nระบบลอยตัว\n· ข้อดี — ธนาคารกลางมีอิสระใช้ดอกเบี้ยดูแลเงินเฟ้อและการว่างงานในประเทศ และค่าเงินทำหน้าที่เป็นตัวดูดซับช็อกโดยอัตโนมัติ เช่น เมื่อราคาสินค้าส่งออกตก ค่าเงินจะอ่อนลงเองซึ่งช่วยพยุงผู้ส่งออก\n· ข้อเสีย — ความผันผวนสร้างความไม่แน่นอนแก่ผู้ค้า และค่าเงินที่อ่อนอาจส่งผ่านไปสู่เงินเฟ้อผ่านราคาสินค้านำเข้า\nข้อสรุป — การเลือกขึ้นกับโครงสร้างเศรษฐกิจ ประวัติเงินเฟ้อ ขนาดเงินสำรอง และความเปิดของบัญชีทุนของประเทศนั้น","whys":["ถูกต้อง — ระบุการแลกเปลี่ยนของทั้งสองระบบได้ครบทั้งด้านความแน่นอน อิสระทางการเงิน และการดูดซับช็อก","ไม่ถูกต้อง — สลับกัน ระบบคงที่คือระบบที่ต้องใช้ดอกเบี้ยรักษาค่าเงินจึงสูญเสียอิสระ ส่วนระบบลอยตัวคืนอิสระนั้นมาให้","ไม่ถูกต้อง — สองระบบให้ผลต่างกันอย่างมีนัยสำคัญทั้งด้านอิสระทางนโยบาย ความผันผวน และความเสี่ยงต่อการถูกโจมตีค่าเงิน","ไม่ถูกต้อง — ระบบคงที่มีเหตุผลรองรับจริง โดยเฉพาะสำหรับเศรษฐกิจขนาดเล็กที่เปิดมากหรือประเทศที่ต้องการยืมความน่าเชื่อถือด้านเงินเฟ้อ"]},{"id":"X09","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"การแทรกแซงเพื่อพยุงค่าเงิน","q":"ค่าเงินของประเทศหนึ่งอ่อนลงอย่างรวดเร็ว ธนาคารกลางจึงเข้าแทรกแซงโดยขายเงินสำรองระหว่างประเทศเพื่อซื้อเงินในประเทศกลับ ข้อใดอธิบายกลไกและข้อจำกัดได้ถูกต้องที่สุด","choices":["การซื้อเงินในประเทศเพิ่มอุปสงค์ในตลาดจึงพยุงค่าเงินไว้ได้ และยังลดปริมาณเงินในประเทศซึ่งเสริมผลอีกทาง · แต่เงินสำรองมีจำกัด หากพื้นฐานไม่สอดคล้องกับอัตราที่ต้องการ การแทรกแซงจะยื้อได้เพียงชั่วคราว","การขายเงินสำรองระหว่างประเทศทำให้ค่าเงินในประเทศอ่อนลงไปอีกเพราะเป็นการเพิ่มอุปทานเงินในตลาด · ธนาคารกลางจึงควรซื้อเงินสำรองระหว่างประเทศเข้ามาเพิ่มแทนเพื่อพยุงค่าเงินให้กลับมาแข็งขึ้น","การแทรกแซงสามารถกำหนดอัตราแลกเปลี่ยนไว้ที่ระดับใดก็ได้อย่างถาวรโดยไม่มีข้อจำกัด · เพราะธนาคารกลางสามารถสร้างเงินในประเทศได้ไม่จำกัดจึงมีอำนาจซื้อในตลาดเงินตราต่างประเทศอย่างไม่สิ้นสุด","การแทรกแซงไม่มีผลต่ออัตราแลกเปลี่ยนเลยเพราะตลาดเงินตราต่างประเทศมีขนาดใหญ่เกินไป · ธนาคารกลางจึงควรปล่อยให้ค่าเงินเคลื่อนไหวอย่างเสรีโดยไม่ต้องถือเงินสำรองระหว่างประเทศไว้เลย"],"answer":0,"a":"กลไกของการแทรกแซง\n· ธนาคารกลางขายเงินสำรองระหว่างประเทศและซื้อเงินในประเทศ\n· อุปสงค์ต่อเงินในประเทศเพิ่มขึ้นในตลาด ซึ่งดันค่าเงินให้แข็งขึ้นหรือชะลอการอ่อนค่า\n· ผลข้างเคียงที่เสริมแรง คือการซื้อเงินในประเทศกลับเท่ากับดูดเงินในประเทศออกจากระบบ ปริมาณเงินลดลง ดอกเบี้ยมีแนวโน้มสูงขึ้น ซึ่งช่วยพยุงค่าเงินอีกทาง\nข้อจำกัดที่หนึ่ง เงินสำรองมีจำกัด — ธนาคารกลางสร้างเงินในประเทศได้ แต่สร้างเงินสำรองระหว่างประเทศไม่ได้ เมื่อสำรองร่อยหรอลง การแทรกแซงก็ต้องหยุด\nข้อจำกัดที่สอง พื้นฐานสำคัญกว่า — ถ้าค่าเงินอ่อนเพราะเงินเฟ้อในประเทศสูงกว่าคู่ค้า ขาดดุลบัญชีเดินสะพัดเรื้อรัง หรือเงินทุนไหลออกจากความไม่เชื่อมั่น การแทรกแซงเพียงยื้อเวลา ไม่ได้แก้ต้นเหตุ\nข้อจำกัดที่สาม เป็นเป้าของการเก็งกำไร — เมื่อผู้เก็งกำไรเห็นว่าสำรองใกล้หมด พวกเขาจะเร่งขายเงินสกุลนั้นเพราะรู้ว่าการลดค่าเงินใกล้จะมาถึง ซึ่งเร่งให้เกิดขึ้นเร็วกว่าเดิม\nบทเรียน — การแทรกแซงใช้ได้ดีเพื่อลดความผันผวนระยะสั้น แต่ไม่สามารถฝืนพื้นฐานได้ในระยะยาว","whys":["ถูกต้อง — อธิบายกลไกทั้งด้านอุปสงค์ในตลาดและด้านปริมาณเงิน พร้อมระบุข้อจำกัดเรื่องเงินสำรองและพื้นฐานเศรษฐกิจ","ไม่ถูกต้อง — การขายเงินสำรองระหว่างประเทศเพื่อซื้อเงินในประเทศคือการเพิ่มอุปสงค์ต่อเงินในประเทศ ซึ่งพยุงค่าเงินไม่ใช่กดให้อ่อน","ไม่ถูกต้อง — ธนาคารกลางสร้างเงินในประเทศได้แต่สร้างเงินสำรองระหว่างประเทศไม่ได้ การพยุงค่าเงินจึงมีขีดจำกัดที่ชัดเจน","ไม่ถูกต้อง — การแทรกแซงมีผลจริงในการลดความผันผวนระยะสั้น และเงินสำรองยังมีบทบาทสำคัญในการรองรับความเสี่ยงภายนอก"]},{"id":"X10","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"อ่านกราฟเมื่ออุปทานเงินในประเทศเพิ่มขึ้น","q":"จากแผนภาพ เส้นอุปทานเงินบาทในตลาดเงินตราต่างประเทศเลื่อนไปทางขวา ข้อใดอธิบายสาเหตุและผลลัพธ์รวมถึงนัยต่อ AD ได้ถูกต้อง","choices":["สาเหตุอาจมาจากการนำเข้าที่เพิ่มขึ้นหรือเงินทุนที่ไหลออก · อัตราแลกเปลี่ยนลดลงจาก e₁ เป็น e₂ ซึ่งหมายถึงเงินบาทอ่อนค่าลง · ผลต่อเนื่องคือการส่งออกสุทธิเพิ่มขึ้นซึ่งดัน AD ไปทางขวาในรอบถัดไป","สาเหตุอาจมาจากการส่งออกที่ขยายตัวหรือเงินทุนต่างชาติที่ไหลเข้ามากขึ้น · อัตราแลกเปลี่ยนลดลงจาก e₁ เป็น e₂ ซึ่งหมายถึงเงินบาทแข็งค่าขึ้น · ผลต่อเนื่องคือการส่งออกสุทธิเพิ่มขึ้นและ AD เลื่อนขวา","สาเหตุอาจมาจากการที่ธนาคารกลางขึ้นอัตราดอกเบี้ยนโยบายอย่างมาก · อัตราแลกเปลี่ยนสูงขึ้นจาก e₁ เป็น e₂ ซึ่งหมายถึงเงินบาทอ่อนค่าลง · ผลต่อเนื่องคือการนำเข้าเพิ่มขึ้นและ AD เลื่อนซ้ายลงกว่าเดิม","สาเหตุอาจมาจากนักท่องเที่ยวต่างชาติที่เดินทางเข้ามามากขึ้นกว่าเดิม · อัตราแลกเปลี่ยนไม่เปลี่ยนแปลงเพราะเส้นอุปทานที่เลื่อนจะถูกหักล้างด้วยอุปสงค์ที่เพิ่มขึ้นในสัดส่วนที่เท่ากันพอดี"],"answer":0,"a":"อ่านกราฟตามลำดับเดิม\nขั้นที่ 1 เส้นไหนเลื่อน — เส้นอุปทานเงินบาท (S) เลื่อนไปทางขวา คือมีเงินบาทออกมาเสนอขายในตลาดมากขึ้น\nขั้นที่ 2 อะไรทำให้เลื่อน — ต้องเป็นสิ่งที่ทำให้คนในประเทศต้องแลกเงินบาทออกไปเป็นเงินต่างประเทศมากขึ้น\n· การนำเข้าที่เพิ่มขึ้น ต้องแลกบาทไปจ่ายผู้ขายต่างชาติ\n· เงินทุนไหลออก นักลงทุนแลกบาทไปซื้อสินทรัพย์ต่างประเทศ\n· คนในประเทศไปเที่ยวต่างประเทศมากขึ้น\nขั้นที่ 3 ผลต่อดุลยภาพ — ที่จุดตัดใหม่ ระดับ e ลดลง จาก e₁ เป็น e₂ และปริมาณเงินบาทที่ซื้อขายเพิ่มขึ้น\nขั้นที่ 4 แปลความ — ตามนิยามของตำรา e ที่ลดลงหมายถึงหนึ่งบาทซื้อเงินต่างประเทศได้น้อยลง เงินบาทจึงอ่อนค่าลง\nขั้นที่ 5 นัยต่อ AD — บาทที่อ่อนทำให้สินค้าส่งออกถูกลงในสายตาต่างชาติและสินค้านำเข้าแพงขึ้น NX จึงเพิ่มขึ้นในรอบถัดไป ซึ่งดัน AD ไปทางขวา\nสังเกตวงจรที่น่าสนใจ — การนำเข้าที่มากขึ้นทำให้บาทอ่อน แล้วบาทที่อ่อนก็ทำให้การนำเข้าลดลงและการส่งออกเพิ่มขึ้น นี่คือกลไกปรับตัวเองที่ระบบอัตราแลกเปลี่ยนลอยตัวมีให้","whys":["ถูกต้อง — ระบุสาเหตุที่เพิ่มอุปทานเงินบาท แปลทิศทางของ e ได้ถูกต้อง และต่อไปถึงผลต่อ AD ในรอบถัดไป","ไม่ถูกต้อง — การส่งออกและเงินทุนไหลเข้าเพิ่มอุปสงค์ต่อเงินบาท และ e ที่ลดลงหมายถึงบาทอ่อนไม่ใช่แข็ง","ไม่ถูกต้อง — การขึ้นดอกเบี้ยดึงเงินทุนไหลเข้าซึ่งทำให้บาทแข็ง และกราฟแสดงว่า e ลดลงไม่ใช่สูงขึ้น","ไม่ถูกต้อง — นักท่องเที่ยวต่างชาติเพิ่มอุปสงค์ต่อเงินบาท ไม่ใช่อุปทาน และกราฟแสดงชัดว่าดุลยภาพเคลื่อนไปที่ระดับ e ต่ำลง"],"fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n    <defs><clipPath id=\"clipFX\"><rect x=\"76\" y=\"34\" width=\"422\" height=\"296\"/></clipPath></defs>\n    <line x1=\"76\" y1=\"26\" x2=\"76\" y2=\"330\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n    <line x1=\"76\" y1=\"330\" x2=\"512\" y2=\"330\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n    <text x=\"70\" y=\"20\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"middle\">e (อัตราแลกเปลี่ยน)</text>\n    <text x=\"516\" y=\"336\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"end\" transform=\"translate(0,22)\">ปริมาณเงินบาทในตลาดเงินตราต่างประเทศ</text>\n    <g clip-path=\"url(#clipFX)\"><line x1=\"97.1\" y1=\"306.32\" x2=\"476.9\" y2=\"69.51999999999998\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\" stroke-dasharray=\"7 5\"/><line x1=\"97.1\" y1=\"69.51999999999998\" x2=\"476.9\" y2=\"306.32\" stroke=\"var(--curve-ad)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><line x1=\"181.5\" y1=\"306.32\" x2=\"561.3\" y2=\"69.51999999999998\" stroke=\"var(--curve-as)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><circle cx=\"287\" cy=\"187.92000000000002\" r=\"4.5\" fill=\"var(--surface)\" stroke=\"var(--muted)\" stroke-width=\"2\"/><line x1=\"287\" y1=\"187.92000000000002\" x2=\"76\" y2=\"187.92000000000002\" stroke=\"var(--line-2)\" stroke-width=\"1.2\" stroke-dasharray=\"4 4
