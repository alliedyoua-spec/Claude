ังการผลิตส่วนเกินเหลืออยู่เท่ากันหมด จึงสามารถผลิตเพิ่มได้ไม่จำกัดโดยที่ต้นทุนส่วนเพิ่มต่อหน่วยไม่เปลี่ยนแปลงเลยไม่ว่าจะผลิตมากเพียงใด","ในระยะสั้นรัฐบาลใช้มาตรการควบคุมราคาสินค้าอย่างเข้มงวด ผู้ผลิตจึงไม่สามารถปรับราคาขึ้นได้ตามกลไกตลาด และต้องขายในราคาที่ทางการกำหนดไว้เป็นเพดานเสมอ","ในระยะสั้นผู้บริโภคไม่รับรู้การเปลี่ยนแปลงของราคาสินค้า ผู้ผลิตจึงไม่มีแรงจูงใจที่จะปรับราคาเพราะไม่ว่าจะตั้งราคาเท่าใดก็ขายได้ในปริมาณที่เท่ากันอยู่ดี"],"answer":0,"a":"สไลด์ระบุไว้ตรงตัวว่า “In the short run, prices remain fixed, so firms supply whatever output is demanded” คำถามคือทำไมราคาจึงคงที่ในระยะสั้น คำตอบอยู่ที่ความหนืดของราคาและค่าจ้าง — ค่าจ้างถูกล็อกด้วยสัญญาจ้างเป็นปี ราคาวัตถุดิบถูกล็อกด้วยสัญญาซื้อขายล่วงหน้า และการเปลี่ยนป้ายราคาก็มีต้นทุนของมันเอง\nเมื่อปรับราคาไม่ได้ ผู้ผลิตจึงเหลือทางเดียวคือปรับปริมาณ ตามคำสั่งซื้อที่เข้ามา นั่นคือเหตุผลที่เส้น SRAS เป็นแนวนอน ณ ระดับราคาที่ถูกตรึงไว้ และเหตุผลเดียวกันนี้ก็อธิบายว่าทำไมในระยะยาวเมื่อสัญญาหมดอายุ ราคาจึงปรับได้และ SRAS จึงเลื่อน","whys":["ถูกต้อง — ชี้ที่ความหนืดของราคาและค่าจ้างซึ่งเป็นรากฐานของสมมติฐานราคาคงที่ในระยะสั้น","ไม่ถูกต้อง — กำลังการผลิตส่วนเกินช่วยให้ขยายการผลิตได้จริง แต่ไม่ใช่เหตุผลที่ทำให้ราคาคงที่ ซึ่งเป็นแก่นของสมมติฐานนี้","ไม่ถูกต้อง — การควบคุมราคาโดยรัฐเป็นมาตรการเฉพาะกิจในบางสถานการณ์ ไม่ใช่สมมติฐานทั่วไปของแบบจำลองระยะสั้น","ไม่ถูกต้อง — ผู้บริโภครับรู้ราคาและตอบสนองต่อราคาเสมอ ซึ่งเป็นเหตุผลที่เส้นอุปสงค์มวลรวมมีความชันเป็นลบตั้งแต่ต้น"]},{"id":"S02","type":"mcq","lvl":2,"topic":"AD-AS","ref":"เหตุผลเบื้องหลังรูปร่างของ LRAS","q":"เหตุใดเส้น LRAS จึงเป็นเส้นแนวตั้ง ณ ระดับผลผลิตการจ้างงานเต็มที่","choices":["เพราะในระยะยาวค่าจ้างและราคาปรับตัวได้เต็มที่ การเพิ่มขึ้นของระดับราคาจะถูกชดเชยด้วยค่าจ้างที่เพิ่มในสัดส่วนเดียวกัน แรงจูงใจที่แท้จริงในการผลิตจึงไม่เปลี่ยน","เพราะในระยะยาวผู้ผลิตทุกรายจะรวมตัวกันกำหนดปริมาณการผลิตร่วมกันให้คงที่ เพื่อรักษาเสถียรภาพของราคาสินค้าและป้องกันไม่ให้เกิดการแข่งขันที่รุนแรงเกินไปในตลาด","เพราะในระยะยาวรัฐบาลจะเข้าแทรกแซงเพื่อกำหนดเพดานการผลิตของประเทศไว้ที่ระดับการจ้างงานเต็มที่ ไม่ให้ระบบเศรษฐกิจผลิตเกินกว่าระดับที่ทรัพยากรจะรองรับไหว","เพราะในระยะยาวอุปสงค์มวลรวมจะเท่ากับอุปทานมวลรวมพอดีเสมอ จุดตัดของทั้งสองเส้นจึงถูกตรึงอยู่ที่ระดับเดียวโดยไม่ขึ้นกับการเปลี่ยนแปลงของระดับราคาใด ๆ"],"answer":0,"a":"กุญแจอยู่ที่แนวคิดเรื่องตัวแปรที่แท้จริงเทียบกับตัวแปรทางการเงิน\nผู้ผลิตตัดสินใจผลิตจากราคาสินค้าเทียบกับต้นทุน ไม่ใช่จากตัวเลขราคาโดด ๆ ในระยะยาวเมื่อระดับราคาสูงขึ้น 10% ค่าจ้างและราคาวัตถุดิบก็ปรับขึ้น 10% ตามไปด้วย อัตราส่วนราคาต่อต้นทุนจึงเท่าเดิม และไม่มีแรงจูงใจให้ผลิตมากขึ้นหรือน้อยลง\nผลคือผลผลิตของประเทศถูกกำหนดโดยปัจจัยที่แท้จริงเท่านั้น ได้แก่ ปริมาณแรงงาน ปริมาณทุน และระดับเทคโนโลยี ตามที่สไลด์ระบุว่า “Full-employment output isn’t affected by the price level” กราฟจึงเป็นเส้นแนวตั้ง — และนี่คือรากฐานของแนวคิดความเป็นกลางของเงินในระยะยาว","whys":["ถูกต้อง — อธิบายกลไกที่ราคาและต้นทุนปรับขึ้นพร้อมกัน ทำให้แรงจูงใจที่แท้จริงในการผลิตไม่เปลี่ยนแปลง","ไม่ถูกต้อง — ไม่มีการรวมตัวกำหนดปริมาณการผลิตในแบบจำลองนี้ และการฮั้วกันก็ไม่ใช่สมมติฐานของเศรษฐศาสตร์มหภาคกระแสหลัก","ไม่ถูกต้อง — LRAS ไม่ได้มาจากการแทรกแซงของรัฐ แต่มาจากข้อจำกัดด้านทรัพยากรและเทคโนโลยีที่ประเทศมีอยู่จริง","ไม่ถูกต้อง — เป็นการอธิบายเงื่อนไขดุลยภาพ ไม่ใช่เหตุผลว่าทำไมเส้นอุปทานระยะยาวจึงไม่ตอบสนองต่อระดับราคา"]},{"id":"S03","type":"mcq","lvl":4,"topic":"AD-AS","ref":"เกณฑ์แยกว่าเส้นไหนเลื่อน","q":"พิจารณาสี่เหตุการณ์ — (1) ราคาน้ำมันพุ่งชั่วคราวจากความขัดแย้ง (2) ประเทศค้นพบแหล่งก๊าซธรรมชาติขนาดใหญ่ (3) ค่าจ้างขั้นต่ำถูกปรับขึ้น (4) ระบบการศึกษาถูกยกระดับจนแรงงานมีทักษะสูงขึ้น ข้อใดจำแนกได้ถูกต้อง","choices":["(1) และ (3) เลื่อนเฉพาะ SRAS เพราะกระทบต้นทุนการผลิต ส่วน (2) และ (4) เลื่อน LRAS ด้วย เพราะเพิ่มทรัพยากรและผลิตภาพที่แท้จริงของประเทศอย่างถาวร","(1) และ (2) เลื่อนเฉพาะ SRAS เพราะทั้งคู่เกี่ยวข้องกับราคาพลังงาน ส่วน (3) และ (4) เลื่อน LRAS เพราะทั้งคู่เกี่ยวข้องกับแรงงานซึ่งเป็นปัจจัยการผลิตที่สำคัญของประเทศ","ทั้งสี่เหตุการณ์เลื่อนเฉพาะเส้น SRAS เพราะทุกเหตุการณ์ล้วนกระทบต้นทุนการผลิตของธุรกิจไม่ทางใดก็ทางหนึ่ง ส่วนเส้น LRAS จะเลื่อนได้ก็ต่อเมื่อจำนวนประชากรของประเทศเปลี่ยนแปลงเท่านั้น","ทั้งสี่เหตุการณ์เลื่อนทั้งเส้น SRAS และเส้น LRAS พร้อมกันในทิศทางเดียวกัน เพราะในระบบเศรษฐกิจจริงแล้วอุปทานระยะสั้นและระยะยาวเชื่อมโยงกันอย่างแยกไม่ออกในทุกกรณี"],"answer":0,"a":"เกณฑ์เดียวที่ใช้ได้เสมอคือถามว่า “เหตุการณ์นี้เปลี่ยนความสามารถในการผลิตที่แท้จริงของประเทศอย่างถาวรหรือไม่”\n(1) ราคาน้ำมันพุ่งชั่วคราว — กระทบต้นทุน ทำให้ SRAS เลื่อนขึ้น แต่ไม่ได้ทำลายเครื่องจักรหรือลดแรงงาน LRAS จึงไม่ขยับ\n(3) ค่าจ้างขั้นต่ำ — เป็นต้นทุนแรงงานที่สูงขึ้น SRAS เลื่อนขึ้น (แม้จะกระทบการจ้างงานบ้าง แต่ไม่ได้เพิ่มหรือลดปัจจัยการผลิตที่มีอยู่)\n(2) ค้นพบแหล่งก๊าซ — เพิ่มทรัพยากรธรรมชาติที่ประเทศมีอยู่จริง ผลผลิตศักยภาพสูงขึ้น LRAS เลื่อนขวา\n(4) การศึกษาดีขึ้น — เพิ่มทุนมนุษย์และผลิตภาพแรงงานอย่างถาวร LRAS เลื่อนขวา (แม้จะใช้เวลาหลายปีกว่าจะเห็นผล)","whys":["ถูกต้อง — ใช้เกณฑ์ชั่วคราว/ถาวร และต้นทุน/ศักยภาพ ได้ถูกต้องครบทั้งสี่เหตุการณ์","ไม่ถูกต้อง — จับคู่ผิดโดยใช้หมวดหมู่ผิวเผิน การค้นพบแหล่งก๊าซเพิ่มทรัพยากรจริงจึงเลื่อน LRAS ส่วนค่าจ้างขั้นต่ำเป็นเรื่องต้นทุน","ไม่ถูกต้อง — LRAS เลื่อนได้จากหลายปัจจัยไม่ใช่เฉพาะจำนวนประชากร ทั้งทุน เทคโนโลยี ทรัพยากร และทักษะของแรงงานล้วนมีผล","ไม่ถูกต้อง — สองเส้นตอบสนองต่อเหตุการณ์คนละประเภท การเหมารวมว่าทุกเหตุการณ์เลื่อนทั้งสองเส้นทำให้เกณฑ์แยกหมดความหมาย"],"tip":"สองคำถามตัดสินได้ทุกข้อ: ชั่วคราวหรือถาวร · กระทบต้นทุนหรือกระทบกำลังการผลิต"},{"id":"S04","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ช็อกต้นทุนค่าจ้างและผลต่อดุลยภาพ","q":"สหภาพแรงงานทั่วประเทศเจรจาขึ้นค่าจ้างได้สำเร็จเป็นวงกว้าง โดยที่ผลิตภาพแรงงานไม่ได้เพิ่มขึ้นตาม เศรษฐกิจเริ่มต้นที่ดุลยภาพระยะยาว ข้อใดอธิบายผลได้ถูกต้อง","choices":["SRAS เลื่อนขึ้นเพราะต้นทุนแรงงานต่อหน่วยผลผลิตสูงขึ้น ระดับราคาจึงสูงขึ้นพร้อมกับผลผลิตที่ลดลงต่ำกว่า Y_FE เกิดภาวะเงินเฟ้อควบคู่เศรษฐกิจซบเซาและช่องว่างการหดตัว","SRAS เลื่อนลงเพราะแรงงานที่ได้ค่าจ้างสูงขึ้นจะมีขวัญกำลังใจและทุ่มเทให้กับงานมากขึ้น ผลิตภาพจึงสูงขึ้นตามมาในที่สุด ต้นทุนต่อหน่วยจึงลดลงและผลผลิตของประเทศเพิ่มขึ้น","AD เลื่อนขวาเพียงเส้นเดียวเพราะแรงงานที่มีรายได้สูงขึ้นจะใช้จ่ายมากขึ้น ระดับราคาและผลผลิตจึงเพิ่มขึ้นพร้อมกัน ส่วนฝั่งอุปทานไม่ได้รับผลกระทบจากการขึ้นค่าจ้างครั้งนี้เลย","LRAS เลื่อนซ้ายอย่างถาวรเพราะค่าจ้างที่สูงขึ้นทำให้ต้นทุนการผลิตของประเทศสูงขึ้นตลอดไป ผลผลิต ณ ระดับการจ้างงานเต็มที่จึงลดลงและไม่มีทางกลับไปที่ระดับเดิมได้อีก"],"answer":0,"a":"ประเด็นสำคัญอยู่ที่วลี “โดยที่ผลิตภาพไม่ได้เพิ่มขึ้นตาม” ถ้าค่าจ้างขึ้น 10% พร้อมผลิตภาพที่ขึ้น 10% ต้นทุนแรงงานต่อหน่วยผลผลิตจะเท่าเดิมและ SRAS ไม่ขยับ แต่เมื่อผลิตภาพนิ่ง ต้นทุนต่อหน่วยจึงสูงขึ้นจริง\nผลคือ SRAS เลื่อนขึ้น ระดับราคาสูงขึ้นและผลผลิตลดลงพร้อมกัน ซึ่งคือลายเซ็นของเงินเฟ้อต้นทุนผลักและภาวะ stagflation จุดดุลยภาพใหม่อยู่ทางซ้ายของ LRAS จึงเป็นช่องว่างการหดตัวด้วย\nในระยะยาว หากไม่มีการแทรกแซง การว่างงานที่สูงขึ้นจะกดดันให้ค่าจ้างชะลอหรือลดลง SRAS ค่อย ๆ เลื่อนกลับลงมา และผลผลิตกลับสู่ Y_FE","whys":["ถูกต้อง — ระบุกลไกต้นทุนต่อหน่วยผลผลิต และผลลัพธ์ที่ P สูงขึ้นพร้อม Y ลดลงพร้อมช่องว่างการหดตัว","ไม่ถูกต้อง — โจทย์กำหนดชัดว่าผลิตภาพไม่ได้เพิ่มขึ้นตาม จึงไม่สามารถอ้างผลด้านขวัญกำลังใจมาหักล้างต้นทุนที่สูงขึ้นได้","ไม่ถูกต้อง — ผลด้านรายได้ต่อ AD มีอยู่บ้าง แต่ช่องทางหลักและตรงที่สุดของการขึ้นค่าจ้างคือต้นทุนการผลิตซึ่งกระทบ SRAS","ไม่ถูกต้อง — LRAS ถูกกำหนดโดยแรงงาน ทุน และเทคโนโลยี ไม่ใช่โดยระดับค่าจ้าง ซึ่งเป็นตัวแปรทางการเงินที่ปรับได้ในระยะยาว"]},{"id":"S05","type":"mcq","lvl":3,"topic":"AD-AS","ref":"เทคโนโลยีกระทบทั้งสองเส้น","q":"ประเทศหนึ่งนำเทคโนโลยีการผลิตอัตโนมัติมาใช้อย่างแพร่หลายจนผลิตภาพแรงงานสูงขึ้นอย่างถาวร ข้อใดอธิบายผลต่อฝั่งอุปทานได้ครบถ้วนที่สุด","choices":["LRAS เลื่อนขวาเพราะผลผลิตศักยภาพสูงขึ้น และ SRAS เลื่อนลงเพราะต้นทุนต่อหน่วยถูกลง ผลรวมคือผลผลิตเพิ่มขึ้นพร้อมกับระดับราคาที่ลดลง ซึ่งเป็นช็อกด้านอุปทานเชิงบวก","LRAS เลื่อนขวาเพียงเส้นเดียวเพราะเทคโนโลยีเป็นปัจจัยที่แท้จริง ส่วน SRAS ไม่ขยับเพราะราคาถูกตรึงไว้ในระยะสั้นและผู้ผลิตยังไม่สามารถปรับราคาขายลงได้ตามต้นทุนที่ถูกลง","SRAS เลื่อนลงเพียงเส้นเดียวเพราะต้นทุนถูกลง ส่วน LRAS ไม่ขยับเพราะเทคโนโลยีอัตโนมัติทดแทนแรงงานคน ทำให้จำนวนแรงงานที่ใช้ในการผลิตลดลงจนหักล้างกับผลิตภาพที่สูงขึ้นพอดี","LRAS เลื่อนซ้ายเพราะเทคโนโลยีทดแทนแรงงานทำให้เกิดการว่างงานตามโครงสร้างจำนวนมาก อัตราการว่างงานตามธรรมชาติจึงสูงขึ้นและผลผลิต ณ การจ้างงานเต็มที่ลดลงตามไปด้วย"],"answer":0,"a":"ผลิตภาพที่สูงขึ้นเป็นกรณีพิเศษที่กระทบทั้งสองเส้นไปในทางที่ดี\nต่อ LRAS — ผลิตภาพสูงขึ้นหมายถึงประเทศผลิตได้มากขึ้นด้วยปัจจัยการผลิตชุดเดิม ผลผลิต ณ การจ้างงานเต็มที่จึงสูงขึ้น เส้นเลื่อนขวา\nต่อ SRAS — ต้นทุนแรงงานต่อหน่วยผลผลิตลดลง ผู้ผลิตยอมขายในราคาที่ต่ำลง เส้นเลื่อนลง\nผลรวมคือผลผลิตเพิ่มขึ้นพร้อมกับระดับราคาที่ลดลง ซึ่งเป็นผลลัพธ์ที่ทุกฝ่ายอยากได้ และเป็นกรณีเดียวที่ Y เพิ่มและ P ลดพร้อมกัน — ต่างจากการกระตุ้นอุปสงค์ซึ่งต้องแลกผลผลิตด้วยราคาที่สูงขึ้นเสมอ","whys":["ถูกต้อง — ครอบคลุมทั้งสองเส้นและสรุปผลลัพธ์ที่เป็นเอกลักษณ์ของช็อกด้านอุปทานเชิงบวกได้ถูกต้อง","ไม่ถูกต้อง — ต้นทุนที่ถูกลงทำให้ผู้ผลิตยอมขายในราคาต่ำลง SRAS จึงเลื่อนลงจริง ซึ่งเป็นการเลื่อนเส้นไม่ใช่การถูกตรึงไว้","ไม่ถูกต้อง — โจทย์ระบุชัดว่าผลิตภาพสูงขึ้นอย่างถาวร ซึ่งเพิ่มผลผลิตที่ทำได้ต่อหน่วยปัจจัย LRAS จึงต้องเลื่อนขวา","ไม่ถูกต้อง — อาจเกิดการว่างงานตามโครงสร้างในช่วงเปลี่ยนผ่านจริง แต่ในภาพรวมผลิตภาพที่สูงขึ้นย่อมขยายศักยภาพของประเทศ"]},{"id":"S06","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ภัยพิบัติที่ทำลายทุนทางกายภาพ","q":"แผ่นดินไหวรุนแรงทำลายโรงงาน เครื่องจักร และโครงสร้างพื้นฐานจำนวนมากอย่างถาวร ขณะที่แรงงานส่วนใหญ่ปลอดภัย ข้อใดอธิบายผลต่อฝั่งอุปทานได้ถูกต้องที่สุด","choices":["LRAS เลื่อนซ้ายเพราะทุนทางกายภาพซึ่งเป็นปัจจัยการผลิตหายไปอย่างถาวร และ SRAS เลื่อนขึ้นเพราะกำลังการผลิตที่เหลือมีจำกัดจนต้นทุนต่อหน่วยสูงขึ้น ผลผลิตลดลงและราคาสูงขึ้น","LRAS ไม่เลื่อนเพราะแรงงานส่วนใหญ่ยังอยู่ครบและแรงงานเป็นปัจจัยการผลิตที่สำคัญที่สุด ส่วน SRAS เลื่อนขึ้นชั่วคราวแล้วจะกลับลงมาเองเมื่อการซ่อมแซมโรงงานเสร็จสิ้นลงในที่สุด","AD เลื่อนขวาเพราะการก่อสร้างซ่อมแซมจะสร้างการจ้างงานและรายจ่ายจำนวนมาก ทำให้ผลผลิตและระดับราคาเพิ่มขึ้น ส่วนฝั่งอุปทานไม่ได้รับผลกระทบเพราะแรงงานยังอยู่ครบถ้วน","LRAS เลื่อนขวาในระยะยาวเพราะโรงงานที่ถูกสร้างใหม่จะทันสมัยกว่าเดิม ผลผลิตศักยภาพของประเทศจึงสูงขึ้นสุทธิ และไม่มีผลลบใด ๆ ต่อฝั่งอุปทานตั้งแต่ระยะสั้นเป็นต้นไป"],"answer":0,"a":"ทุนทางกายภาพเป็นหนึ่งในปัจจัยการผลิตที่กำหนดตำแหน่งของ LRAS โดยตรง เมื่อโรงงานและเครื่องจักรถูกทำลายอย่างถาวรความสามารถในการผลิตของประเทศลดลงจริง LRAS จึงเลื่อนซ้าย\nในระยะสั้น กำลังการผลิตที่เหลืออยู่จำกัดทำให้ผู้ผลิตต้องใช้ทรัพยากรที่มีประสิทธิภาพน้อยกว่า ต้นทุนต่อหน่วยสูงขึ้น SRAS เลื่อนขึ้น ผลรวมคือผลผลิตลดลงและระดับราคาสูงขึ้น\nข้อสังเกตที่ควรระวัง — การก่อสร้างซ่อมแซมภายหลังจะเพิ่ม AD จริง และเมื่อสร้างใหม่เสร็จอาจได้เทคโนโลยีที่ทันสมัยกว่า แต่สิ่งเหล่านั้นเป็นการฟื้นฟูสิ่งที่เสียไป ไม่ได้ทำให้ประเทศร่ำรวยขึ้นสุทธิจากภัยพิบัติ","whys":["ถูกต้อง — ระบุผลต่อทั้งสองเส้นโดยเริ่มจากการสูญเสียทุนทางกายภาพซึ่งเป็นปัจจัยการผลิตโดยตรง","ไม่ถูกต้อง — ทุนทางกายภาพเป็นปัจจัยการผลิตที่กำหนด LRAS เช่นเดียวกับแรงงาน การสูญเสียทุนจึงลดผลผลิตศักยภาพจริง","ไม่ถูกต้อง — มองเห็นเฉพาะด้านการใช้จ่ายซ่อมแซม แต่ละเลยว่าเครื่องจักรและโรงงานที่หายไปคือกำลังการผลิตที่หายไปจริง","ไม่ถูกต้อง — การสร้างใหม่ที่ทันสมัยกว่าเป็นการชดเชยสิ่งที่เสียไป ไม่ใช่กำไรสุทธิ และไม่ได้ลบผลลบในระยะสั้นที่เกิดขึ้นจริง"]},{"id":"S07","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ค่าเงินอ่อนกับต้นทุนวัตถุดิบนำเข้า","q":"ค่าเงินของประเทศหนึ่งอ่อนค่าลงอย่างรุนแรง โดยประเทศนี้ต้องนำเข้าพลังงานและชิ้นส่วนการผลิตเกือบทั้งหมด ข้อใดอธิบายผลต่อแบบจำลอง AD-AS ได้ครบถ้วนที่สุด","choices":["SRAS เลื่อนขึ้นเพราะต้นทุนวัตถุดิบและพลังงานนำเข้าแพงขึ้นมาก ขณะที่ AD เลื่อนขวาจากการส่งออกสุทธิที่ดีขึ้น ผลคือระดับราคาสูงขึ้นแน่นอน ส่วนผลผลิตขึ้นกับว่าแรงใดชนะ","SRAS เลื่อนลงเพราะผู้ส่งออกได้รับรายได้เป็นเงินในประเทศมากขึ้นจึงสามารถลดราคาขายลงได้ ขณะที่ AD เลื่อนขวาจากการส่งออกที่เพิ่มขึ้น ผลคือผลผลิตเพิ่มและระดับราคาลดลงพร้อมกัน","เฉพาะเส้น AD เท่านั้นที่เลื่อนขวาผ่านการส่งออกสุทธิ ส่วนฝั่งอุปทานไม่ได้รับผลกระทบจากอัตราแลกเปลี่ยนเลยเพราะค่าเงินเป็นตัวแปรทางการเงินซึ่งไม่กระทบต้นทุนที่แท้จริง","เฉพาะเส้น LRAS เท่านั้นที่เลื่อนซ้ายเพราะประเทศต้องจ่ายเงินมากขึ้นเพื่อนำเข้าปัจจัยการผลิต ทำให้ทรัพยากรที่ใช้ได้จริงลดลงและผลผลิต ณ การจ้างงานเต็มที่ต่ำลงอย่างถาวร"],"answer":0,"a":"ค่าเงินที่อ่อนลงในประเทศที่พึ่งพาการนำเข้าปัจจัยการผลิตสูง กระทบสองฝั่งในทิศทางที่ขัดกันสำหรับผลผลิต แต่เสริมกันสำหรับราคา\nฝั่งอุปทาน — พลังงานและชิ้นส่วนนำเข้าแพงขึ้นเมื่อคิดเป็นเงินในประเทศ ต้นทุนการผลิตต่อหน่วยสูงขึ้น SRAS เลื่อนขึ้น ซึ่งกด Y ลงและดัน P ขึ้น\nฝั่งอุปสงค์ — สินค้าของเราถูกลงในสายตาต่างชาติ การส่งออกเพิ่ม การนำเข้าลด AD เลื่อนขวา ซึ่งดัน Y ขึ้นและดัน P ขึ้นเช่นกัน\nสรุป — ระดับราคาสูงขึ้นแน่นอนเพราะทั้งสองแรงดันราคาไปทางเดียวกัน ส่วนผลผลิตสรุปไม่ได้เพราะสองแรงดึงคนละทาง นี่คือเหตุผลที่ค่าเงินอ่อนรุนแรงเป็นสถานการณ์อันตรายสำหรับประเทศที่พึ่งพาการนำเข้า","whys":["ถูกต้อง — แยกได้ว่าระดับราคาสรุปทิศทางได้แน่นอน ส่วนผลผลิตต้องชั่งน้ำหนักระหว่างสองแรงที่ดึงคนละทาง","ไม่ถูกต้อง — รายได้ของผู้ส่งออกที่เพิ่มขึ้นไม่ได้ลดต้นทุนการผลิต และในประเทศที่นำเข้าปัจจัยการผลิตเกือบทั้งหมด ต้นทุนย่อมสูงขึ้นไม่ใช่ลดลง","ไม่ถูกต้อง — ค่าเงินกระทบราคาที่จ่ายจริงของวัตถุดิบนำเข้าเมื่อคิดเป็นเงินในประเทศ จึงเป็นต้นทุนที่แท้จริงของผู้ผลิตโดยตรง","ไม่ถูกต้อง — ค่าเงินที่อ่อนเป็นภาวะทางการเงินที่ผันผวนได้ ไม่ได้ทำลายแรงงาน ทุน หรือเทคโนโลยีที่กำหนดตำแหน่งของ LRAS อย่างถาวร"],"tip":"เจอค่าเงินอ่อน ให้ถามเสมอว่าประเทศนั้นนำเข้าปัจจัยการผลิตมากแค่ไหน — ยิ่งพึ่งพานำเข้ามาก ผลลบผ่าน SRAS ยิ่งแรงจนอาจกลบผลบวกจาก NX"},{"id":"S08","type":"mcq","lvl":4,"topic":"AD-AS","ref":"อ่านกราฟช็อกด้านอุปทานเชิงลบ","q":"จากแผนภาพ เศรษฐกิจเริ่มที่ดุลยภาพระยะยาว ณ จุด A แล้วเส้น SRAS เลื่อนจาก SRAS₁ ขึ้นไปเป็น SRAS₂ โดย AD คงเดิม ข้อใดอธิบายจุด B และกลไกปรับตัวในระยะยาวได้ถูกต้อง","choices":["ระดับราคาสูงขึ้นเป็น P₂ พร้อมผลผลิตที่ลดต่ำกว่า Y_FE เกิดช่องว่างการหดตัวควบคู่เงินเฟ้อ · ระยะยาวการว่างงานที่สูงกดค่าจ้างลง SRAS เลื่อนกลับลงมา และผลผลิตกลับสู่ Y_FE","ระดับราคาสูงขึ้นเป็น P₂ พร้อมผลผลิตที่เพิ่มขึ้นเหนือ Y_FE เกิดช่องว่างเงินเฟ้อ · ระยะยาวค่าจ้างจะถูกดันขึ้นอีกจนเส้น SRAS เลื่อนขึ้นต่อไปเรื่อย ๆ โดยไม่มีจุดสิ้นสุดที่แน่นอน","ระดับราคาคงที่ที่ P₁ แต่ผลผลิตลดลงต่ำกว่า Y_FE เพราะในกรอบ SRAS แนวนอน ระดับราคาจะไม่เปลี่ยนแปลงไม่ว่าเส้นอุปทานระยะสั้นจะเลื่อนไปที่ตำแหน่งใดก็ตาม","เศรษฐกิจกลับสู่จุด A ทันทีเพราะเส้น LRAS เป็นแนวตั้งซึ่งบังคับให้ผลผลิตอยู่ที่ระดับการจ้างงานเต็มที่ตลอดเวลา ช็อกด้านอุปทานจึงกระทบเฉพาะระดับราคาโดยไม่กระทบผลผลิตเลย"],"answer":0,"a":"อ่านกราฟตามลำดับ\nระยะสั้น — SRAS เลื่อนขึ้นไปที่ระดับราคา P₂ จุดตัดใหม่กับเส้น AD ที่ลาดลงย่อมอยู่ทางซ้ายของจุดเดิม ดังนั้น P สูงขึ้นและ Y ลดลงพร้อมกัน ซึ่งคือลายเซ็นของช็อกด้านอุปทาน\nชนิดของช่องว่าง — จุด B อยู่ทางซ้ายของ LRAS จึงเป็นช่องว่างการหดตัว ที่มาพร้อมกับเงินเฟ้อ เรียกว่าภาวะชะงักงันเงินเฟ้อ\nระยะยาว — การว่างงานที่สูงกว่าอัตราธรรมชาติกดดันให้ค่าจ้างและราคาปรับลดลง ต้นทุนของผู้ผลิตลดลง SRAS ค่อย ๆ เลื่อนกลับลงมา จนผลผลิตกลับสู่ Y_FE — หากช็อกเป็นเพียงชั่วคราวและ LRAS ไม่ขยับ เศรษฐกิจจะกลับสู่จุด A เดิมทั้ง P และ Y","whys":["ถูกต้อง — ครบทั้งผลระยะสั้นที่ P ขึ้น Y ลง การระบุชนิดของช่องว่าง และทิศทางการปรับตัวของ SRAS ในระยะยาว","ไม่ถูกต้อง — SRAS ที่เลื่อนขึ้นบนเส้น AD ที่ลาดลงย่อมทำให้ผลผลิตลดลง ไม่ใช่เพิ่มขึ้น จุด B จึงอยู่ซ้ายของ LRAS","ไม่ถูกต้อง — เส้น SRAS แนวนอนอยู่ที่ระดับราคาใด ระดับราคาดุลยภาพก็อยู่ที่นั่น เมื่อเส้นเลื่อนขึ้นไปที่ P₂ ระดับราคาจึงสูงขึ้นตาม","ไม่ถูกต้อง — LRAS กำหนดผลผลิตในระยะยาวเท่านั้น ในระยะสั้นเศรษฐกิจเบี่ยงเบนออกจากระดับศักยภาพได้ ซึ่งกราฟแสดงไว้ชัดเจน"],"fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n  <defs>\n    <clipPath id=\"clipG\"><rect x=\"62\" y=\"26\" width=\"466\" height=\"318\"/></clipPath>\n    <marker id=\"arwG\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/>\n    </marker>\n  </defs>\n  <line x1=\"62\" y1=\"18\" x2=\"62\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <line x1=\"62\" y1=\"344\" x2=\"540\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <text x=\"52\" y=\"14\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">P</text>\n  <text x=\"548\" y=\"349\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Y</text><g clip-path=\"url(#clipG)\"><line x1=\"325.28999999999996\" y1=\"356.72\" x2=\"325.28999999999996\" y2=\"26\" stroke=\"var(--curve-lras)\" stroke-width=\"2.6\" /><line x1=\"34.040000000000006\" y1=\"200.9\" x2=\"555.96\" y2=\"200.9\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\"  stroke-linecap=\"round\"/><text x=\"75.98\" y=\"191.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ghost)\" text-anchor=\"start\">SRAS₁</text><line x1=\"34.040000000000006\" y1=\"146.84\" x2=\"555.96\" y2=\"146.84\" stroke=\"var(--curve-as)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"75.98\" y=\"137.84\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-as)\" text-anchor=\"start\">SRAS₂</text><line x1=\"15.399999999999999\" y1=\"38.72000000000003\" x2=\"574.6\" y2=\"331.28\" stroke=\"var(--curve-ad)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"151.88\" y=\"98.98400000000001\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ad)\" text-anchor=\"start\">AD</text><circle cx=\"325.28999999999996\" cy=\"200.9\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"335.28999999999996\" y=\"216.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">A</text><circle cx=\"221.838\" cy=\"146.84\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"197.838\" y=\"134.84\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">B</text></g><text x=\"325.28999999999996\" y=\"17\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-lras)\" text-anchor=\"middle\">LRAS</text><text x=\"325.28999999999996\" y=\"366\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"middle\">Y<tspan dy=\"4\" font-size=\"11\">FE</tspan></text><text x=\"53\" y=\"205.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₁</text><text x=\"53\" y=\"151.84\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₂</text></svg><div class=\"figcap\">ช็อกด้านอุปทานเชิงลบ — SRAS เลื่อนขึ้นโดยที่ AD ไม่เปลี่ยนแปลง</div></div>"},{"id":"S09","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ภาษีที่เก็บจากฝั่งผู้ผลิต","q":"รัฐบาลประกาศเก็บภาษีสิ่งแวดล้อมจากโรงงานทุกแห่งตามปริมาณการปล่อยมลพิษ โดยไม่ได้เปลี่ยนแปลงรายจ่ายภาครัฐ ข้อใดอธิบายผลระยะสั้นต่อแบบจำลอง AD-AS ได้ถูกต้อง","choices":["SRAS เลื่อนขึ้นเพราะภาษีเป็นต้นทุนการผลิตเพิ่มเติมที่ผู้ผลิตต้องแบกรับ ระดับราคาจึงสูงขึ้นและผลผลิตที่แท้จริงลดลงในระยะสั้น ซึ่งเป็นกลไกเดียวกับเงินเฟ้อต้นทุนผลัก","AD เลื่อนซ้ายเพราะภาษีดึงเงินออกจากภาคธุรกิจไปสู่ภาครัฐ ทำให้กำลังซื้อในระบบเศรษฐกิจโดยรวมลดลง ระดับราคาและผลผลิตที่แท้จริงจึงลดลงพร้อมกันทั้งคู่ในระยะสั้น","LRAS เลื่อนซ้ายทันทีเพราะภาษีทำให้ต้นทุนการผลิตของประเทศสูงขึ้นอย่างถาวร ผลผลิต ณ ระดับการจ้างงานเต็มที่จึงลดลงตั้งแต่ปีแรกที่มาตรการมีผลบังคับใช้จริง","ไม่มีเส้นใดเลื่อนเพราะภาษีเป็นเพียงการโอนเงินจากผู้ผลิตไปยังรัฐบาล ซึ่งรัฐบาลจะนำกลับมาใช้จ่ายในระบบเศรษฐกิจเดิม ผลสุทธิต่อทั้งอุปสงค์และอุปทานจึงเท่ากับศูนย์"],"answer":0,"a":"สไลด์ระบุว่า SRAS เลื่อนเมื่อ “factors like increased costs of producing goods lead firms to increase prices” ภาษีที่เก็บจากฝั่งผู้ผลิตเป็นต้นทุนเพิ่มเติมต่อหน่วยผลผลิตโดยตรง ผู้ผลิตจึงต้องขึ้นราคาเพื่อรักษาอัตรากำไร เส้น SRAS เลื่อนขึ้น\nผลระยะสั้นคือระดับราคาสูงขึ้นและผลผลิตที่แท้จริงลดลง ซึ่งเป็นกลไกเดียวกับเงินเฟ้อต้นทุนผลัก\nข้อสังเกตเชิงนโยบาย — ภาษีสิ่งแวดล้อมมีเป้าหมายแก้ผลกระทบภายนอก ไม่ใช่เพื่อรักษาเสถียรภาพเศรษฐกิจ การประเมินจึงต้องชั่งต้นทุนระยะสั้นนี้กับประโยชน์ด้านสิ่งแวดล้อมในระยะยาว และในระยะยาวมากหากมันผลักให้เกิดเทคโนโลยีสะอาดที่มีประสิทธิภาพกว่า ก็อาจช่วย LRAS ได้ด้วยซ้ำ","whys":["ถูกต้อง — จัดประเภทภาษีที่เก็บจากผู้ผลิตเป็นต้นทุนการผลิตซึ่งเลื่อน SRAS ขึ้น และระบุผลต่อ P กับ Y ได้ถูกต้อง","ไม่ถูกต้อง — ช่องทางหลักของภาษีที่เก็บจากผู้ผลิตคือฝั่งต้นทุน และหาก AD เลื่อนซ้ายจริง ระดับราคาจะต้องลดลง ไม่ใช่สูงขึ้น","ไม่ถูกต้อง — LRAS ถูกกำหนดโดยแรงงาน ทุน และเทคโนโลยี ไม่ใช่โดยอัตราภาษี และผลต่อศักยภาพต้องใช้เวลาหลายปีไม่ใช่ทันที","ไม่ถูกต้อง — ภาษีเปลี่ยนต้นทุนและแรงจูงใจของผู้ผลิตจริง จึงไม่ใช่การโอนที่ไม่มีผล และโจทย์ก็ระบุว่ารายจ่ายภาครัฐไม่เปลี่ยน"]},{"id":"S10","type":"mcq","lvl":3,"topic":"AD-AS","ref":"การลงทุนในทุนมนุษย์","q":"ประเทศหนึ่งปฏิรูปการศึกษาและการฝึกอาชีพครั้งใหญ่ ผลลัพธ์ชัดเจนว่าทักษะของแรงงานรุ่นใหม่สูงขึ้นมากเมื่อเทียบกับรุ่นก่อน ข้อใดอธิบายผลต่อฝั่งอุปทานได้ถูกต้องที่สุด","choices":["LRAS เลื่อนขวาเพราะผลิตภาพของแรงงานสูงขึ้นทำให้ผลผลิตศักยภาพเพิ่ม แต่ผลจะปรากฏอย่างช้า ๆ ตลอดหลายปีตามการทยอยเข้าสู่ตลาดแรงงานของแรงงานรุ่นใหม่","LRAS เลื่อนขวาทันทีในปีที่ประกาศการปฏิรูป เพราะการที่ระบบการศึกษาดีขึ้นจะทำให้ความเชื่อมั่นของนักลงทุนทั้งในและต่างประเทศเพิ่มขึ้น และเงินลงทุนจะไหลเข้าประเทศทันที","SRAS เลื่อนลงทันทีเพราะแรงงานที่มีทักษะสูงขึ้นทำให้ต้นทุนการผลิตต่อหน่วยลดลง แต่ LRAS ไม่ขยับเพราะการศึกษาไม่ได้เพิ่มจำนวนแรงงานหรือปริมาณทุนของประเทศแต่อย่างใด","AD เลื่อนขวาเพียงเส้นเดียวเพราะรายจ่ายของรัฐในการปฏิรูปการศึกษาถูกนับเป็น G ในสมการอุปสงค์มวลรวม ส่วนฝั่งอุปทานยังไม่ได้รับผลกระทบจนกว่าแรงงานจะจบการศึกษา"],"answer":0,"a":"สไลด์ระบุว่าสิ่งที่เพิ่มผลผลิต ณ การจ้างงานเต็มที่จะเลื่อน LRAS ไปทางขวา และยกตัวอย่าง “productivity changes that affect labor demand” ไว้โดยตรง ทักษะของแรงงานคือทุนมนุษย์ ซึ่งเป็นปัจจัยการผลิตที่แท้จริงเช่นเดียวกับเครื่องจักร\nจุดที่ข้อสอบต้องการวัดคือมิติเวลา — ผลของการปฏิรูปการศึกษาไม่ได้เกิดทันทีในปีที่ประกาศ แต่ทยอยปรากฏตลอดหลายปีตามที่นักเรียนรุ่นใหม่จบออกมาและเข้าสู่ตลาดแรงงาน นี่คือเหตุผลที่นโยบายด้านอุปทานถูกเรียกว่านโยบายระยะยาว และเป็นข้อจำกัดสำคัญเมื่อต้องรับมือกับภาวะถดถอยเฉพาะหน้า","whys":["ถูกต้อง — ระบุทั้งทิศทางของ LRAS และมิติเวลาที่ผลจะทยอยปรากฏ ซึ่งเป็นลักษณะเด่นของนโยบายด้านอุปทาน","ไม่ถูกต้อง — LRAS เลื่อนได้ก็ต่อเมื่อทักษะของแรงงานเพิ่มขึ้นจริงในตลาดแรงงาน ไม่ใช่จากความเชื่อมั่นซึ่งเป็นปัจจัยฝั่งอุปสงค์","ไม่ถูกต้อง — ทุนมนุษย์เป็นปัจจัยการผลิตที่แท้จริง การเพิ่มทักษะจึงขยายผลผลิตศักยภาพของประเทศและเลื่อน LRAS ได้","ไม่ถูกต้อง — รายจ่ายการศึกษาเพิ่ม AD ในระยะสั้นจริง แต่มองข้ามผลหลักของนโยบายนี้ซึ่งอยู่ที่ฝั่งอุปทานในระยะยาว"]},{"id":"S11","type":"mcq","lvl":4,"topic":"AD-AS","ref":"เปรียบเทียบกรอบ SRAS แนวนอนกับ SRAS ลาดขึ้น","q":"หากใช้กรอบที่เส้น SRAS ลาดขึ้น (เช่นในตำราสาย Mankiw) แทนกรอบที่ SRAS เป็นเส้นแนวนอน ผลของการที่ AD เลื่อนขวาจะต่างไปอย่างไรในระยะสั้น","choices":["ในกรอบลาดขึ้น ทั้งระดับราคาและผลผลิตจะเพิ่มขึ้นพร้อมกันในระยะสั้น ส่วนกรอบแนวนอนจะให้ผลผลิตเพิ่มโดยราคาคงที่ แต่ข้อสรุปในระยะยาวของทั้งสองกรอบเหมือนกันทุกประการ","ในกรอบลาดขึ้น ระดับราคาจะเพิ่มขึ้นโดยผลผลิตคงที่ ส่วนกรอบแนวนอนจะให้ผลผลิตเพิ่มโดยราคาคงที่ ทั้งสองกรอบจึงให้ข้อสรุปที่ตรงข้ามกันโดยสิ้นเชิงทั้งในระยะสั้นและระยะยาว","ในกรอบลาดขึ้น ผลผลิตจะลดลงขณะที่ระดับราคาสูงขึ้น เพราะเส้นที่ลาดขึ้นหมายความว่าผู้ผลิตจะผลิตน้อยลงเมื่อราคาสูงขึ้น ซึ่งเป็นความแตกต่างที่สำคัญที่สุดระหว่างสองกรอบนี้","ทั้งสองกรอบให้ผลเหมือนกันทุกประการในระยะสั้น เพราะรูปร่างของเส้นอุปทานระยะสั้นไม่มีผลต่อจุดตัดดุลยภาพ สิ่งที่กำหนดผลลัพธ์คือตำแหน่งของเส้น AD และ LRAS เท่านั้น"],"answer":0,"a":"ความต่างอยู่ที่ระยะสั้นเท่านั้น และเป็นความต่างเชิงระดับ ไม่ใช่เชิงทิศทาง\nกรอบแนวนอน — ราคาถูกตรึงสนิท ผู้ผลิตปรับเฉพาะปริมาณ ผลคือ Y เพิ่มโดย P ไม่ขยับเลย\nกรอบลาดขึ้น — ราคาปรับได้บางส่วนตั้งแต่ระยะสั้น ผลคือ Y เพิ่มและ P เพิ่มพร้อมกัน ซึ่งเป็นการแบ่งผลกระทบระหว่างปริมาณกับราคา\nระยะยาว — ทั้งสองกรอบจบเหมือนกันทุกประการ คือ SRAS เลื่อนขึ้นจนผลผลิตกลับสู่ Y_FE ตาม LRAS โดยเหลือไว้เพียงระดับราคาที่สูงขึ้น\nในห้องสอบให้ยึดกรอบของสไลด์แล้วเขียนวงเล็บกำกับว่ากรณี SRAS ลาดขึ้นผลจะเป็นอย่างไร จะปลอดภัยที่สุด","whys":["ถูกต้อง — ระบุความต่างในระยะสั้นอย่างแม่นยำและยืนยันว่าข้อสรุประยะยาวของทั้งสองกรอบตรงกัน","ไม่ถูกต้อง — เส้นที่ลาดขึ้นให้ผลผลิตเพิ่มขึ้นด้วย ไม่ใช่คงที่ ผลผลิตจะคงที่ก็ต่อเมื่อเส้นอุปทานเป็นแนวตั้งซึ่งเป็นกรณีของระยะยาว","ไม่ถูกต้อง — เส้นอุปทานที่ลาดขึ้นหมายความว่าราคาที่สูงขึ้นจูงใจให้ผลิตมากขึ้น ไม่ใช่น้อยลง ซึ่งเป็นความหมายพื้นฐานของเส้นอุปทาน","ไม่ถูกต้อง — รูปร่างของ SRAS กำหนดว่าผลกระทบจะตกที่ราคาหรือปริมาณมากน้อยเพียงใดในระยะสั้น จึงมีผลต่อคำตอบอย่างชัดเจน"],"tip":"เวลาทำข้อสอบ ให้ดูรูปที่โจทย์ให้มาก่อนเสมอ — ถ้า SRAS เป็นเส้นนอน ระยะสั้น P ไม่ขยับ · ถ้าลาดขึ้น P ขยับด้วย"},{"id":"S12","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ช็อกด้านอุปทานเชิงบวกและการอ่านกราฟ","q":"จากแผนภาพ เส้น SRAS เลื่อนจาก SRAS₁ ลงมาเป็น SRAS₂ โดย AD คงเดิม ข้อใดอธิบายจุด B และระบุสาเหตุที่เป็นไปได้ของช็อกนี้ได้ถูกต้อง","choices":["ระดับราคาลดลงเป็น P₂ พร้อมผลผลิตที่เพิ่มขึ้นเหนือ Y_FE สาเหตุที่เป็นไปได้คือราคาพลังงานที่ถูกลงหรือผลิตภาพที่สูงขึ้น ซึ่งล้วนลดต้นทุนการผลิตต่อหน่วยของธุรกิจ","ระดับราคาลดลงเป็น P₂ พร้อมผลผลิตที่ลดลงต่ำกว่า Y_FE สาเหตุที่เป็นไปได้คืออุปสงค์รวมที่ตกต่ำลงจากความเชื่อมั่นของผู้บริโภคและภาคธุรกิจที่ถดถอยลงอย่างรุนแรงพร้อมกัน","ระดับราคาคงที่แต่ผลผลิตเพิ่มขึ้น สาเหตุที่เป็นไปได้คือการที่รัฐบาลเพิ่มรายจ่ายภาครัฐและลดภาษีพร้อมกัน ซึ่งทำให้อุปสงค์มวลรวมของระบบเศรษฐกิจขยายตัวขึ้นอย่างมีนัยสำคัญ","ระดับราคาลดลงเป็น P₂ แต่ผลผลิตคงที่ที่ Y_FE เพราะเส้น LRAS เป็นแนวตั้งที่บังคับให้ผลผลิตไม่เปลี่ยนแปลง สาเหตุคือการที่ธนาคารกลางลดปริมาณเงินในระบบเศรษฐกิจลง"],"answer":0,"a":"อ่านกราฟ — SRAS เลื่อนลงไปที่ระดับราคา P₂ จุดตัดใหม่กับเส้น AD ที่ลาดลงย่อมอยู่ทางขวาของจุดเดิม ดังนั้น P ลดลงและ Y เพิ่มขึ้นพร้อมกัน — เป็นการเคลื่อนไหวสวนทางกันซึ่งเป็นลายเซ็นของช็อกด้านอุปทาน\nสาเหตุที่ทำให้ SRAS เลื่อนลงคือสิ่งที่ลดต้นทุนการผลิต เช่น ราคาน้ำมันหรือวัตถุดิบที่ถูกลง ค่าจ้างที่ชะลอตัว เทคโนโลยีที่เพิ่มผลิตภาพ หรือค่าเงินที่แข็งขึ้นทำให้วัตถุดิบนำเข้าถูกลง\nสังเกตว่าจุด B อยู่ทางขวาของ LRAS จึงเป็นช่องว่างเงินเฟ้อในเชิงตำแหน่ง แม้ระดับราคาจะลดลงก็ตาม ซึ่งหมายความว่าในระยะยาวตลาดแรงงานที่ตึงตัวจะดันค่าจ้างขึ้นและ SRAS จะเลื่อนกลับขึ้นไป","whys":["ถูกต้อง — อ่านทิศทางของ P และ Y ได้ถูกต้อง และระบุสาเหตุที่ลดต้นทุนการผลิตซึ่งเป็นตัวขับเคลื่อนของ SRAS","ไม่ถูกต้อง — หากเป็นอุปสงค์ที่ตกต่ำ เส้นที่เลื่อนจะเป็น AD ไม่ใช่ SRAS และผลผลิตจะลดลงไม่ใช่เพิ่มขึ้นอย่างที่กราฟแสดง","ไม่ถูกต้อง — กราฟแสดงชัดว่าระดับราคาลดลงจาก P₁ เป็น P₂ และเส้นที่เลื่อนคือ SRAS ไม่ใช่ AD ตามที่ข้อความระบุ","ไม่ถูกต้อง — LRAS กำหนดผลผลิตในระยะยาว ไม่ได้ตรึงผลผลิตระยะสั้น และการลดปริมาณเงินจะเลื่อน AD ไม่ใช่ SRAS"],"fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n  <defs>\n    <clipPath id=\"clipG\"><rect x=\"62\" y=\"26\" width=\"466\" height=\"318\"/></clipPath>\n    <marker id=\"arwG\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/>\n    </marker>\n  </defs>\n  <line x1=\"62\" y1=\"18\" x2=\"62\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <line x1=\"62\" y1=\"344\" x2=\"540\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <text x=\"52\" y=\"14\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">P</text>\n  <text x=\"548\" y=\"349\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Y</text><g clip-path=\"url(#clipG)\"><line x1=\"325.28999999999996\" y1=\"356.72\" x2=\"325.28999999999996\" y2=\"26\" stroke=\"var(--curve-lras)\" stroke-width=\"2.6\" /><line x1=\"34.040000000000006\" y1=\"200.9\" x2=\"555.96\" y2=\"200.9\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\"  stroke-linecap=\"round\"/><text x=\"75.98\" y=\"191.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ghost)\" text-anchor=\"start\">SRAS₁</text><line x1=\"34.040000000000006\" y1=\"248.60000000000002\" x2=\"555.96\" y2=\"248.60000000000002\" stroke=\"var(--curve-as)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"75.98\" y=\"239.60000000000002\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-as)\" text-anchor=\"start\">SRAS₂</text><line x1=\"15.399999999999999\" y1=\"38.72000000000003\" x2=\"574.6\" y2=\"331.28\" stroke=\"var(--curve-ad)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"151.88\" y=\"98.98400000000001\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ad)\" text-anchor=\"start\">AD</text><circle cx=\"325.28999999999996\" cy=\"200.9\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"335.28999999999996\" y=\"188.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">A</text><circle cx=\"416.626\" cy=\"248.60000000000002\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"426.626\" y=\"264.6\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">B</text></g><text x=\"325.28999999999996\" y=\"17\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-lras)\" text-anchor=\"middle\">LRAS</text><text x=\"325.28999999999996\" y=\"366\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"middle\">Y<tspan dy=\"4\" font-size=\"11\">FE</tspan></text><text x=\"53\" y=\"205.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₁</text><text x=\"53\" y=\"253.60000000000002\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₂</text></svg><div class=\"figcap\">ช็อกด้านอุปทานเชิงบวก — SRAS เลื่อนลงโดยที่ AD ไม่เปลี่ยนแปลง</div></div>"},{"id":"S13","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ช็อกที่เลื่อนสองเส้นคนละทาง","q":"สงครามทำให้แรงงานวัยทำงานจำนวนมากเสียชีวิตหรืออพยพออกนอกประเทศอย่างถาวร ขณะเดียวกันประเทศได้รับเงินช่วยเหลือจากต่างประเทศเพื่อซ่อมแซมโครงสร้างพื้นฐานจำนวนมหาศาล ข้อใดวิเคราะห์ได้รอบด้านที่สุด","choices":["แรงงานที่หายไปดัน LRAS ไปทางซ้าย ขณะที่ทุนทางกายภาพที่ได้รับการฟื้นฟูดัน LRAS ไปทางขวา ทิศทางสุทธิของผลผลิตศักยภาพจึงขึ้นกับว่าผลใดมีขนาดใหญ่กว่ากัน","แรงงานที่หายไปดัน LRAS ไปทางซ้ายอย่างแน่นอน เพราะแรงงานเป็นปัจจัยการผลิตที่สำคัญที่สุดและไม่สามารถทดแทนด้วยทุนทางกายภาพได้เลยไม่ว่าจะลงทุนมากเพียงใดก็ตาม","เงินช่วยเหลือจากต่างประเทศดัน LRAS ไปทางขวาอย่างแน่นอน เพราะการลงทุนในโครงสร้างพื้นฐานเพิ่มผลิตภาพของทั้งระบบเศรษฐกิจได้มากกว่าการสูญเสียแรงงานบางส่วนเสมอ","ทั้งสองเหตุการณ์กระทบเฉพาะเส้น SRAS ไม่ใช่ LRAS เพราะเป็นเหตุการณ์ที่เกิดขึ้นในช่วงเวลาสั้น ๆ และผลของมันจะหายไปเองเมื่อสถานการณ์กลับสู่ภาวะปกติในที่สุด"],"answer":0,"a":"LRAS ถูกกำหนดโดยปัจจัยการผลิตหลายตัวพร้อมกัน — แรงงาน ทุน เทคโนโลยี และทรัพยากร เมื่อเหตุการณ์กระทบสองปัจจัยไปคนละทิศ ทิศทางสุทธิจึงสรุปไม่ได้จากทฤษฎีเพียงอย่างเดียว\nแรงงานที่หายไปอย่างถาวร — ลดปัจจัยการผลิตโดยตรง LRAS เลื่อนซ้าย และผลนี้ยืดเยื้อเพราะการทดแทนประชากรใช้เวลาเป็นรุ่น\nทุนที่ได้รับการฟื้นฟู — เพิ่มปัจจัยการผลิต LRAS เลื่อนขวา และหากโครงสร้างพื้นฐานใหม่ทันสมัยกว่าเดิม ผลิตภาพก็สูงขึ้นด้วย\nการจะสรุปได้ต้องรู้ขนาดสัมพัทธ์ของทั้งสองผล ในข้อเขียนควรวาดกราฟแสดงทั้งสองกรณีและระบุเงื่อนไขว่าผลใดจะชนะภายใต้สถานการณ์แบบใด","whys":["ถูกต้อง — ยอมรับว่าเหตุการณ์กระทบสองปัจจัยไปคนละทิศ และระบุอย่างมีหลักการว่าต้องชั่งขนาดสัมพัทธ์","ไม่ถูกต้อง — ทุนทางกายภาพและเทคโนโลยีสามารถทดแทนแรงงานได้บางส่วน การสรุปว่าผลลบชนะแน่นอนจึงเกินกว่าที่ทฤษฎีรับรอง","ไม่ถูกต้อง — ไม่มีหลักการใดรับประกันว่าการลงทุนในทุนจะชดเชยการสูญเสียแรงงานได้เสมอ ขนาดของทั้งสองผลต้องดูเป็นกรณี ๆ ไป","ไม่ถูกต้อง — โจทย์ระบุชัดว่าแรงงานหายไปอย่างถาวร และโครงสร้างพื้นฐานถูกซ่อมแซมจริง ทั้งคู่จึงกระทบปัจจัยการผลิตที่กำหนด LRAS"]},{"id":"S14","type":"mcq","lvl":2,"topic":"AD-AS","ref":"ความแตกต่างระหว่างการเลื่อน SRAS กับการเคลื่อนที่ตามเส้น","q":"ในกรอบที่ SRAS เป็นเส้นแนวนอน เมื่อ AD เลื่อนไปทางขวา ปริมาณผลผลิตที่ผู้ผลิตป้อนเข้าสู่ตลาดเพิ่มขึ้น ข้อใดอธิบายสิ่งที่เกิดขึ้นกับเส้น SRAS ได้ถูกต้อง","choices":["เส้น SRAS ไม่ได้เลื่อน สิ่งที่เกิดขึ้นคือดุลยภาพเคลื่อนที่ไปตามเส้น SRAS เดิมไปทางขวา เพราะผู้ผลิตยอมผลิตมากขึ้นที่ระดับราคาเดิมตามที่ถูกต้องการเพิ่มขึ้น","เส้น SRAS เลื่อนลงไปพร้อมกับเส้น AD เพราะการผลิตที่มากขึ้นทำให้เกิดการประหยัดต่อขนาด ต้นทุนต่อหน่วยของผู้ผลิตจึงลดลงและเส้นอุปทานระยะสั้นจึงต้องขยับตามไปด้วย","เส้น SRAS เลื่อนขึ้นทันทีเพราะการผลิตที่มากขึ้นทำให้ผู้ผลิตต้องจ้างแรงงานเพิ่มและจ่ายค่าล่วงเวลา ต้นทุนการผลิตต่อหน่วยจึงสูงขึ้นในทันทีที่มีคำสั่งซื้อเข้ามามากกว่าเดิม","เส้น SRAS เลื่อนขวาทั้งเส้นเพราะปริมาณผลผลิตที่เพิ่มขึ้นคือการเพิ่มขึ้นของอุปทาน ซึ่งโดยนิยามแล้วหมายถึงการเลื่อนของเส้นอุปทานไปทางขวาในทุกกรณีที่ปริมาณการผลิตสูงขึ้น"],"answer":0,"a":"นี่คือกับดักเชิงมโนทัศน์ที่พบบ่อยที่สุดของบทนี้ — ปริมาณที่ผลิตเพิ่มขึ้น ไม่ได้แปลว่าเส้นอุปทานเลื่อน\nในกรอบ SRAS แนวนอน เส้นบอกว่า “ณ ระดับราคานี้ ผู้ผลิตยินดีผลิตเท่าใดก็ได้ตามที่ถูกต้องการ” เมื่อ AD เลื่อนขวา จุดตัดจึงขยับไปทางขวาบนเส้นเดิม ปริมาณผลผลิตเพิ่มขึ้นโดยที่ตำแหน่งของเส้น SRAS ไม่ได้เปลี่ยนเลย\nเส้น SRAS จะเลื่อนก็ต่อเมื่อต้นทุนการผลิตเปลี่ยนเท่านั้น เช่น ค่าจ้าง ราคาวัตถุดิบ หรือภาษีที่เก็บจากผู้ผลิต ในระยะยาวเมื่อตลาดแรงงานตึงตัวจนค่าจ้างถูกดันขึ้นจริง เส้น SRAS ถึงจะเลื่อนขึ้น แต่นั่นคือกระบวนการที่กินเวลา ไม่ใช่ผลทันทีในระยะสั้น","whys":["ถูกต้อง — แยกการเคลื่อนที่ไปตามเส้นออกจากการเลื่อนของเส้นได้ถูกต้องตามนิยามของ SRAS แนวนอน","ไม่ถูกต้อง — การประหยัดต่อขนาดเป็นแนวคิดระดับจุลภาคของแต่ละบริษัท ไม่ใช่กลไกที่ทำให้เส้นอุปทานมวลรวมเลื่อนในแบบจำลองนี้","ไม่ถูกต้อง — ในระยะสั้นสมมติว่าราคาและค่าจ้างถูกตรึงไว้ ผลจากตลาดแรงงานที่ตึงตัวเป็นกระบวนการของระยะยาว ไม่ใช่ผลทันที","ไม่ถูกต้อง — สับสนระหว่าง “ปริมาณอุปทาน” ที่เปลี่ยนตามจุดบนเส้น กับ “อุปทาน” ที่หมายถึงตำแหน่งของเส้นทั้งเส้น"],"tip":"ท่องให้ขึ้นใจ: SRAS เลื่อนเมื่อต้นทุนเปลี่ยนเท่านั้น — ปริมาณที่ผลิตเพิ่มขึ้นเพราะมีคนซื้อมากขึ้น ไม่ใช่เหตุผลให้เส้นเลื่อน"},{"id":"S15","type":"mcq","lvl":4,"topic":"AD-AS","ref":"การคาดการณ์ราคาของผู้ผลิตกับตำแหน่งของ SRAS","q":"ธนาคารกลางประกาศเป้าหมายเงินเฟ้อใหม่ที่สูงขึ้นอย่างชัดเจน และประชาชนกับผู้ผลิตเชื่อว่าราคาในอนาคตจะสูงขึ้นตามนั้น โดยที่ยังไม่มีอะไรเกิดขึ้นจริงในตลาดสินค้า ข้อใดอธิบายผลได้ถูกต้องที่สุด","choices":["สหภาพแรงงานจะเรียกร้องค่าจ้างสูงขึ้นล่วงหน้าและผู้ผลิตจะตั้งราคาสูงขึ้นตามที่คาด ทำให้ต้นทุนสูงขึ้นจริงและ SRAS เลื่อนขึ้น การคาดการณ์จึงกลายเป็นจริงด้วยตัวมันเอง","ไม่มีเส้นใดเลื่อนจนกว่าจะมีการเปลี่ยนแปลงของต้นทุนที่เกิดขึ้นจริง เพราะการคาดการณ์เป็นเพียงความคิดของผู้คนซึ่งยังไม่ได้แปลงเป็นธุรกรรมทางเศรษฐกิจที่วัดได้ในตลาดสินค้าและบริการ","เส้น LRAS เลื่อนซ้ายเพราะการคาดการณ์เงินเฟ้อที่สูงขึ้นทำให้ผู้ผลิตลดการลงทุนในกำลังการผลิตระยะยาว ผลผลิต ณ ระดับการจ้างงานเต็มที่ของประเทศจึงลดลงตามไปด้วยทันที","เส้น AD เลื่อนซ้ายเพราะผู้บริโภคที่คาดว่าราคาจะสูงขึ้นจะชะลอการใช้จ่ายเพื่อรอดูสถานการณ์ ทำให้อุปสงค์รวมของระบบเศรษฐกิจหดตัวลงก่อนที่ราคาจะปรับขึ้นจริง"],"answer":0,"a":"การคาดการณ์เป็นตัวแปรที่ทรงพลังมากในเศรษฐศาสตร์มหภาค เพราะมันเปลี่ยนพฤติกรรมวันนี้ ก่อนที่เหตุการณ์จะเกิดขึ้นจริง\nเมื่อทุกฝ่ายเชื่อว่าราคาจะสูงขึ้น สหภาพแรงงานจะเจรจาค่าจ้างล่วงหน้าเพื่อไม่ให้อำนาจซื้อลดลง ซัพพลายเออร์จะตั้งราคาสัญญาสูงขึ้น และผู้ผลิตจะปรับราคาขายขึ้นก่อน ต้นทุนการผลิตจึงสูงขึ้นจริง และ SRAS เลื่อนขึ้นจริง\nปรากฏการณ์นี้เรียกว่าการคาดการณ์ที่ทำให้ตัวเองเป็นจริง (self-fulfilling expectation) และเป็นเหตุผลว่าทำไมธนาคารกลางจึงหวงแหนความน่าเชื่อถือมากที่สุด — เพราะเมื่อการคาดการณ์เงินเฟ้อฝังตัวแล้ว การดึงมันกลับลงมาต้องแลกด้วยการว่างงานที่สูงขึ้นเป็นเวลานาน","whys":["ถูกต้อง — อธิบายกลไกที่การคาดการณ์แปลงเป็นต้นทุนจริงผ่านการเจรจาค่าจ้างและการตั้งราคาล่วงหน้า","ไม่ถูกต้อง — การคาดการณ์เปลี่ยนพฤติกรรมการเจรจาค่าจ้างและการตั้งราคาตั้งแต่วันนี้ ซึ่งเป็นธุรกรรมที่เกิดขึ้นจริงและวัดได้","ไม่ถูกต้อง — ผลต่อการลงทุนและ LRAS ต้องใช้เวลาสะสมหลายปี ไม่ใช่ผลทันที และช่องทางหลักของการคาดการณ์คือต้นทุนผ่าน SRAS","ไม่ถูกต้อง — เมื่อคาดว่าราคาจะสูงขึ้น ผู้บริโภคมีแนวโน้มจะเร่งซื้อก่อนราคาขึ้น ไม่ใช่ชะลอการใช้จ่ายออกไป"],"tip":"จำคำว่า self-fulfilling expectation — การคาดการณ์เงินเฟ้อเปลี่ยนค่าจ้างและราคาได้จริง นี่คือเหตุผลที่ความน่าเชื่อถือของธนาคารกลางมีค่ามหาศาล"},{"id":"S16","type":"mcq","lvl":4,"topic":"AD-AS","ref":"กลไกปรับตัวเองของ SRAS ในภาวะถดถอย","q":"เศรษฐกิจอยู่ในช่องว่างการหดตัวมาสองปี อัตราการว่างงานสูงกว่าอัตราธรรมชาติมาก และรัฐบาลไม่ได้ดำเนินนโยบายใดเลย ข้อใดอธิบายกลไกปรับตัวเองและข้อจำกัดของมันได้ถูกต้อง","choices":["แรงงานที่ว่างงานจำนวนมากยอมรับค่าจ้างต่ำลงและผู้ผลิตยอมลดราคาเพื่อระบายสินค้า ต้นทุนจึงลดลงและ SRAS เลื่อนลงจนผลผลิตกลับสู่ Y_FE แต่กระบวนการนี้ช้ามากเพราะค่าจ้างมีความหนืดในการปรับลด","แรงงานที่ว่างงานจำนวนมากจะถอนตัวออกจากกำลังแรงงาน ทำให้อัตราการว่างงานลดลงจนเท่ากับอัตราธรรมชาติโดยอัตโนมัติ เศรษฐกิจจึงกลับสู่ดุลยภาพระยะยาวโดยที่ผลผลิตไม่ต้องเปลี่ยนแปลงเลย","เส้น LRAS จะค่อย ๆ เลื่อนซ้ายมาบรรจบกับระดับผลผลิตที่เป็นจริง ทำให้ช่องว่างการหดตัวหายไปเอง เศรษฐกิจจึงเข้าสู่ดุลยภาพระยะยาวใหม่ที่ระดับผลผลิตต่ำกว่าเดิมอย่างถาวร","เส้น AD จะเลื่อนกลับไปทางขวาโดยอัตโนมัติ เพราะระดับราคาที่ต่ำลงทำให้อำนาจซื้อของเงินที่ครัวเรือนถือไว้สูงขึ้น ผลผลิตจึงกลับสู่ระดับเดิมโดยไม่ต้องอาศัยการปรับตัวของฝั่งอุปทานเลย"],"answer":0,"a":"กลไกปรับตัวเองทำงานผ่านตลาดแรงงานและตลาดสินค้าที่หย่อนตัว เมื่อมีคนว่างงานมาก อำนาจต่อรองของแรงงานลดลง ค่าจ้างที่เรียกร้องได้ต่ำลง และผู้ผลิตที่ขายของไม่ออกก็ยอมลดราคา ต้นทุนการผลิตต่อหน่วยจึงลดลง SRAS เลื่อนลง จนกระทั่งตัดกับ AD ตรงกับ LRAS พอดี\nข้อจำกัดที่ต้องระบุให้ได้ — ค่าจ้างมีความหนืดในการปรับลด (downward wage rigidity) เพราะสัญญาจ้าง กฎหมายค่าจ้างขั้นต่ำ และการที่นายจ้างไม่อยากลดค่าจ้างเพราะกระทบขวัญกำลังใจ กระบวนการจึงกินเวลาหลายปี ระหว่างนั้นสังคมแบกต้นทุนเป็นการว่างงานที่ยืดเยื้อ — นี่คือเหตุผลหลักที่รัฐบาลมักเลือกเร่งด้วยนโยบายแทนที่จะรอ","whys":["ถูกต้อง — ระบุทั้งกลไกผ่านต้นทุนที่ลดลงและข้อจำกัดเรื่องความหนืดของค่าจ้างซึ่งทำให้กระบวนการช้า","ไม่ถูกต้อง — การถอนตัวออกจากกำลังแรงงานทำให้ตัวเลขดูดีขึ้นเท่านั้น ผลผลิตยังต่ำกว่าศักยภาพและทรัพยากรยังถูกใช้ไม่เต็มที่เหมือนเดิม","ไม่ถูกต้อง — LRAS ถูกกำหนดโดยแรงงาน ทุน และเทคโนโลยี ไม่ได้เลื่อนตามอุปสงค์ที่ตกต่ำ (ยกเว้นกรณีที่ยืดเยื้อมากจนทักษะเสื่อม ซึ่งเป็นคนละกลไก)","ไม่ถูกต้อง — ผลทางความมั่งคั่งจากราคาที่ต่ำลงเป็นการเคลื่อนที่ไปตามเส้น AD ไม่ใช่การเลื่อนเส้น และไม่ใช่กลไกหลักที่แบบจำลองนี้อธิบาย"],"tip":"คำตอบที่ได้คะแนนเต็มต้องมีสองส่วน: กลไกทำงานอย่างไร และ ทำไมมันจึงช้า — คำว่า “ความหนืดของค่าจ้าง” คือคำที่อาจารย์รอฟัง"},{"id":"S17","type":"mcq","lvl":3,"topic":"AD-AS","ref":"การลดต้นทุนธุรกรรมและกฎระเบียบ","q":"รัฐบาลปฏิรูปกระบวนการขออนุญาตประกอบธุรกิจ จากเดิมใช้เวลา 90 วันเหลือ 5 วัน และลดเอกสารลงอย่างมาก โดยไม่ได้ลดมาตรฐานความปลอดภัยใด ๆ ข้อใดอธิบายผลได้ถูกต้องที่สุด","choices":["LRAS เลื่อนขวาเพราะต้นทุนธุรกรรมที่ลดลงทำให้ทรัพยากรถูกจัดสรรได้มีประสิทธิภาพขึ้นและธุรกิจใหม่เข้าสู่ตลาดง่ายขึ้น ผลผลิตศักยภาพของประเทศจึงสูงขึ้นอย่างถาวร","AD เลื่อนขวาเพียงเส้นเดียวเพราะธุรกิจใหม่ที่เกิดขึ้นจะลงทุนซื้อเครื่องจักรและจ้างแรงงานเพิ่ม ส่วนฝั่งอุปทานไม่ได้รับผลกระทบเพราะกฎระเบียบไม่ใช่ปัจจัยการผลิตของประเทศ","SRAS เลื่อนขึ้นเพราะการที่มีธุรกิจใหม่เข้าสู่ตลาดมากขึ้นทำให้เกิดการแย่งชิงแรงงานและวัตถุดิบ ต้นทุนการผลิตของธุรกิจเดิมจึงสูงขึ้นและระดับราคาถูกดันขึ้นตามไปด้วย","ไม่มีเส้นใดเลื่อนเพราะการปฏิรูปกระบวนการทางราชการเป็นเรื่องของการบริหารจัดการภาครัฐ ซึ่งไม่เกี่ยวข้องกับตัวแปรทางเศรษฐศาสตร์มหภาคใด ๆ ในแบบจำลอง AD-AS เลย"],"answer":0,"a":"ต้นทุนธุรกรรมและกฎระเบียบที่ยุ่งยากเป็นแรงเสียดทานที่ทำให้ทรัพยากรไม่ถูกจัดสรรไปสู่การใช้ที่มีประสิทธิผลสูงสุด เมื่อขั้นตอนถูกลดจาก 90 วันเหลือ 5 วัน ผู้ประกอบการที่มีไอเดียดีเข้าสู่ตลาดได้เร็วขึ้น ทุนและแรงงานไหลไปสู่กิจกรรมที่ให้ผลตอบแทนสูงกว่าได้คล่องขึ้น\nผลคือประเทศผลิตได้มากขึ้นด้วยปัจจัยการผลิตชุดเดิม ซึ่งก็คือผลิตภาพรวมที่สูงขึ้น ผลผลิต ณ การจ้างงานเต็มที่จึงสูงขึ้นและ LRAS เลื่อนขวา\nนี่คือตัวอย่างของนโยบายด้านอุปทานที่ไม่ต้องใช้งบประมาณมาก แต่ให้ผลถาวร — ต่างจากนโยบายด้านอุปสงค์ที่ให้ผลชั่วคราวและมีต้นทุนทางการคลัง","whys":["ถูกต้อง — เชื่อมจากต้นทุนธุรกรรมที่ลดลงไปสู่การจัดสรรทรัพยากรที่ดีขึ้นและผลผลิตศักยภาพที่สูงขึ้น","ไม่ถูกต้อง — ผลด้าน AD มีอยู่จริงในระยะสั้น แต่ประเด็นหลักคือประสิทธิภาพในการใช้ทรัพยากรซึ่งเป็นเรื่องของฝั่งอุปทาน","ไม่ถูกต้อง — การแข่งขันที่เพิ่มขึ้นโดยทั่วไปกดดันให้ต้นทุนและราคาต่ำลง ไม่ใช่สูงขึ้น และไม่ใช่กลไกหลักของการปฏิรูปนี้","ไม่ถูกต้อง — ต้นทุนธุรกรรมเป็นตัวแปรเชิงสถาบันที่กระทบผลิตภาพรวมของประเทศโดยตรง จึงมีที่ทางชัดเจนในแบบจำลอง"]},{"id":"S18","type":"mcq","lvl":4,"topic":"AD-AS","ref":"การเปิดเสรีการค้ากับผลผลิตศักยภาพ","q":"ประเทศหนึ่งลดกำแพงภาษีนำเข้าลงมากและเปิดให้มีการแข่งขันจากต่างประเทศเต็มที่ ข้อใดอธิบายผลต่อฝั่งอุปทานในระยะยาวได้สมดุลที่สุด","choices":["LRAS มีแนวโน้มเลื่อนขวาจากการเข้าถึงวัตถุดิบและเทคโนโลยีที่ถูกลงกับแรงกดดันให้เพิ่มผลิตภาพ แต่ในช่วงเปลี่ยนผ่านจะเกิดการว่างงานตามโครงสร้างในอุตสาหกรรมที่แข่งขันไม่ได้","LRAS เลื่อนซ้ายอย่างแน่นอนเพราะอุตสาหกรรมในประเทศจำนวนมากจะต้องปิดตัวลงจากการแข่งขันที่รุนแรง ทำให้กำลังการผลิตรวมของประเทศลดลงและผลผลิตศักยภาพต่ำลงตามไปด้วย","LRAS เลื่อนขวาอย่างแน่นอนโดยไม่มีต้นทุนใด ๆ เพราะการค้าเสรีทำให้ทุกประเทศได้ประโยชน์จากความได้เปรียบโดยเปรียบเทียบ ซึ่งเป็นผลบวกกับทุกภาคส่วนในประเทศพร้อมกันทั้งหมด","เฉพาะเส้น AD เท่านั้นที่เลื่อนซ้ายผ่านการนำเข้าที่เพิ่มขึ้น ส่วนฝั่งอุปทานไม่ได้รับผลกระทบใด ๆ เพราะนโยบายการค้าเป็นเรื่องของการแลกเปลี่ยนสินค้าไม่ใช่การผลิตภายในประเทศ"],"answer":0,"a":"การเปิดเสรีการค้าให้ผลบวกสุทธิในระยะยาวแต่มีต้นทุนการปรับตัวที่กระจุกตัว\nด้านบวกต่อ LRAS — ผู้ผลิตเข้าถึงวัตถุดิบ เครื่องจักร และเทคโนโลยีจากต่างประเทศได้ถูกลง การแข่งขันบีบให้บริษัทในประเทศต้องเพิ่มผลิตภาพหรือออกจากตลาด และทรัพยากรถูกโยกไปสู่อุตสาหกรรมที่ประเทศมีความได้เปรียบโดยเปรียบเทียบ ผลิตภาพรวมจึงสูงขึ้น\nต้นทุนที่ต้องยอมรับ — อุตสาหกรรมที่แข่งขันไม่ได้จะหดตัว แรงงานในนั้นเผชิญการว่างงานตามโครงสร้าง ซึ่งแก้ยากและใช้เวลา นี่คือเหตุผลที่นโยบายการค้าเสรีต้องมาพร้อมโครงการฝึกทักษะใหม่และการช่วยเหลือการปรับตัว มิฉะนั้นอัตราธรรมชาติอาจสูงขึ้นจนกลบผลบวก","whys":["ถูกต้อง — ชั่งทั้งผลบวกต่อผลิตภาพและต้นทุนการปรับตัวที่เกิดกับแรงงานในอุตสาหกรรมที่แข่งขันไม่ได้","ไม่ถูกต้อง — มองเห็นเฉพาะอุตสาหกรรมที่แพ้ แต่ละเลยการเข้าถึงปัจจัยการผลิตที่ถูกลงและการโยกทรัพยากรไปสู่ภาคที่ได้เปรียบ","ไม่ถูกต้อง — ผลบวกสุทธิมีจริง แต่การบอกว่าไม่มีต้นทุนใด ๆ และเป็นผลบวกกับทุกภาคส่วนพร้อมกันนั้นไม่ตรงกับความเป็นจริง","ไม่ถูกต้อง — การค้าเสรีเปลี่ยนต้นทุนปัจจัยการผลิต โครงสร้างการแข่งขัน และการจัดสรรทรัพยากร จึงกระทบฝั่งอุปทานอย่างชัดเจน"]},{"id":"S19","type":"mcq","lvl":4,"topic":"AD-AS","ref":"โรคระบาดที่กระทบทั้งสองฝั่ง","q":"เกิดโรคระบาดรุนแรงที่มีอัตราการเสียชีวิตสูง ประชาชนหลีกเลี่ยงการออกจากบ้าน แรงงานจำนวนมากล้มป่วย และห่วงโซ่อุปทานสะดุด ข้อใดวิเคราะห์ผลต่อแบบจำลอง AD-AS ได้รอบด้านที่สุด","choices":["AD เลื่อนซ้ายจาก C, I และ NX ที่หดตัว พร้อมกับ SRAS เลื่อนขึ้นจากต้นทุนที่สูงขึ้นและ LRAS เลื่อนซ้ายจากแรงงานที่หายไป ผลผลิตลดลงแน่นอน ส่วนระดับราคาสรุปทิศทางไม่ได้","AD เลื่อนซ้ายเพียงเส้นเดียวจากการที่ประชาชนไม่ออกจากบ้านไปจับจ่ายใช้สอย ทำให้ผลผลิตและระดับราคาลดลงพร้อมกันอย่างชัดเจนทั้งคู่ ส่วนฝั่งอุปทานไม่ได้รับผลกระทบใด ๆ เลย","SRAS เลื่อนขึ้นเพียงเส้นเดียวจากห่วงโซ่อุปทานที่สะดุด ทำให้ระดับราคาสูงขึ้นและผลผลิตลดลง ส่วนฝั่งอุปสงค์ไม่ได้รับผลกระทบเพราะประชาชนยังต้องบริโภคสินค้าจำเป็นในปริมาณเท่าเดิม","LRAS เลื่อนขวาในระยะยาวเพราะโรคระบาดเร่งให้เกิดการนำเทคโนโลยีดิจิทัลมาใช้ ผลิตภาพของประเทศจึงสูงขึ้นสุทธิ และไม่มีผลลบต่อฝั่งอุปทานหรืออุปสงค์ในระยะสั้นแต่อย่างใด"],"answer":0,"a":"โรคระบาดรุนแรงเป็นช็อกที่กระทบทุกเส้นพร้อมกัน\nฝั่งอุปสงค์ — ผู้คนหลีกเลี่ยงการเดินทางและจับจ่าย (C ลด) · ธุรกิจเลื่อนการลงทุนเพราะความไม่แน่นอน (I ลด) · นักท่องเที่ยวและคู่ค้าถอนตัว (NX ลด) → AD เลื่อนซ้าย\nฝั่งอุปทานระยะสั้น — แรงงานล้มป่วย ห่วงโซ่อุปทานสะดุด ต้นทุนมาตรการป้องกันสูงขึ้น → SRAS เลื่อนขึ้น\nฝั่งอุปทานระยะยาว — การสูญเสียแรงงานอย่างถาวร → LRAS เลื่อนซ้าย\nสรุป — ทุกแรงกดผลผลิตลงในทิศทางเดียวกัน Y ลดลงแน่นอน แต่ผลต่อระดับราคาขัดแย้งกัน (AD ที่ลดกดราคาลง ส่วน AS ที่หดดันราคาขึ้น) P จึงสรุปทิศทางไม่ได้ — การกล้าบอกว่าตัวแปรใดสรุปได้และตัวแปรใดสรุปไม่ได้ คือสิ่งที่ทำให้ได้คะแนนเต็ม","whys":["ถูกต้อง — ครบทุกเส้น และแยกได้ว่าผลผลิตสรุปทิศทางได้แน่นอนส่วนระดับราคาต้องชั่งน้ำหนักสองแรงที่ขัดกัน","ไม่ถูกต้อง — โจทย์ระบุชัดว่าแรงงานล้มป่วยและห่วงโซ่อุปทานสะดุด ซึ่งกระทบฝั่งอุปทานโดยตรงและมองข้ามไม่ได้","ไม่ถูกต้อง — โจทย์ระบุว่าประชาชนหลีกเลี่ยงการออกจากบ้าน ซึ่งกระทบการบริโภคบริการและการท่องเที่ยวอย่างรุนแรง","ไม่ถูกต้อง — การเร่งเปลี่ยนผ่านสู่ดิจิทัลอาจเกิดขึ้นจริงในบางภาคส่วน แต่ไม่ได้ลบผลลบเฉียบพลันที่โจทย์ระบุไว้ชัดเจน"],"tip":"โจทย์ช็อกใหญ่ที่กระทบหลายเส้น ต้องตอบให้ครบสองส่วน: ตัวแปรใดสรุปทิศทางได้ และ ตัวแปรใดสรุปไม่ได้เพราะแรงขัดกัน"},{"id":"S20","type":"mcq","lvl":4,"topic":"AD-AS","ref":"อ่านข้อมูลย้อนกลับเพื่อระบุเส้นที่เลื่อน","q":"ข้อมูลของปีที่ผ่านมาแสดงว่าระดับราคาสูงขึ้น 6% ขณะที่ผลผลิตที่แท้จริงลดลง 2% ข้อใดคือการวินิจฉัยที่ถูกต้องและนัยเชิงนโยบายที่ตามมา","choices":["เป็นช็อกด้านอุปทานเชิงลบเพราะ P กับ Y เคลื่อนไปคนละทาง เครื่องมือด้านอุปสงค์ชุดเดียวจึงแก้ได้ทีละอย่างและทำให้อีกอย่างแย่ลง ทางออกระยะยาวคือนโยบายด้านอุปทาน","เป็นช็อกด้านอุปสงค์เชิงบวกเพราะระดับราคาสูงขึ้น เครื่องมือที่เหมาะสมคือการใช้นโยบายการเงินแบบเข้มงวดเพื่อกด AD กลับลงมา ซึ่งจะทำให้ทั้งระดับราคาและผลผลิตกลับสู่ระดับปกติพร้อมกัน","เป็นช็อกด้านอุปสงค์เชิงลบเพราะผลผลิตลดลง เครื่องมือที่เหมาะสมคือการกระตุ้นด้วยนโยบายการคลังแบบขาดดุล ซึ่งจะดึงทั้งผลผลิตและระดับราคากลับมาที่ระดับเดิมได้ในเวลาเดียวกัน","เป็นการเลื่อนของเส้น LRAS ไปทางขวาเพราะศักยภาพการผลิตเพิ่มขึ้น เครื่องมือที่เหมาะสมคือการไม่ทำอะไรเลย เพราะเศรษฐกิจกำลังปรับตัวเข้าสู่ดุลยภาพระยะยาวใหม่ที่ดีกว่าเดิมอยู่แล้ว"],"answer":0,"a":"ใช้กฎการอ่านข้อมูลย้อนกลับ — P กับ Y เคลื่อนไปคนละทาง = ช็อกด้านอุปทาน ในที่นี้ราคาขึ้นและผลผลิตลง จึงเป็นช็อกด้านอุปทานเชิงลบ คือ SRAS เลื่อนขึ้น สาเหตุที่เป็นไปได้ ได้แก่ ราคาพลังงานหรือวัตถุดิบที่พุ่ง ค่าจ้างที่ถูกดันขึ้นโดยผลิตภาพไม่ตาม หรือค่าเงินที่อ่อนในประเทศที่พึ่งพาการนำเข้า\nนัยเชิงนโยบาย — นี่คือภาวะที่ยากที่สุด เพราะเครื่องมือด้านอุปสงค์เคลื่อน P กับ Y ไปทางเดียวกันเสมอ ถ้ากระตุ้นเพื่อกู้ผลผลิต ราคาจะยิ่งสูง ถ้ากดเพื่อคุมราคา ผลผลิตจะยิ่งตก ทางออกที่แท้จริงจึงอยู่ที่นโยบายด้านอุปทาน เช่น กระจายแหล่งพลังงาน เพิ่มประสิทธิภาพ หรือลดต้นทุนเชิงโครงสร้าง ซึ่งเลื่อน LRAS ไปทางขวา","whys":["ถูกต้อง — วินิจฉัยด้วยกฎทิศทางของ P กับ Y ได้ถูก และสรุปนัยเชิงนโยบายรวมถึงข้อจำกัดของเครื่องมือด้านอุปสงค์","ไม่ถูกต้อง — ช็อกด้านอุปสงค์เชิงบวกจะทำให้ทั้ง P และ Y สูงขึ้น ไม่ใช่ Y ลดลงอย่างที่ข้อมูลแสดง","ไม่ถูกต้อง — ช็อกด้านอุปสงค์เชิงลบจะทำให้ทั้ง P และ Y ลดลง ซึ่งขัดกับข้อมูลที่ระดับราคาสูงขึ้นถึง 6%","ไม่ถูกต้อง — LRAS ที่เลื่อนขวาจะทำให้ผลผลิตเพิ่มและระดับราคาลดลง ซึ่งตรงข้ามกับข้อมูลทั้งสองตัวที่โจทย์ให้มา"],"tip":"กฎทองที่ใช้ได้ทุกข้อ: P กับ Y ไปทางเดียวกัน = ช็อกด้านอุปสงค์ · P กับ Y ไปคนละทาง = ช็อกด้านอุปทาน"},{"id":"S21","type":"mcq","lvl":3,"topic":"AD-AS","ref":"โครงสร้างประชากรสูงวัย","q":"ประเทศหนึ่งเข้าสู่สังคมสูงวัยอย่างรวดเร็ว สัดส่วนประชากรวัยทำงานต่อประชากรทั้งหมดลดลงต่อเนื่องทุกปี โดยเทคโนโลยีและปริมาณทุนไม่เปลี่ยนแปลง ข้อใดอธิบายผลระยะยาวได้ถูกต้อง","choices":["LRAS เลื่อนซ้ายอย่างค่อยเป็นค่อยไปเพราะกำลังแรงงานซึ่งเป็นปัจจัยการผลิตหดตัวลง ผลผลิต ณ การจ้างงานเต็มที่จึงลดลง และภาระทางการคลังด้านสวัสดิการผู้สูงอายุจะสูงขึ้นตามไปด้วย","LRAS เลื่อนขวาเพราะผู้สูงอายุที่เกษียณแล้วจะใช้เงินออมที่สะสมไว้ ทำให้เงินหมุนเวียนในระบบเศรษฐกิจมากขึ้น และการบริโภคที่สูงขึ้นจะกระตุ้นให้ภาคการผลิตขยายกำลังการผลิตตามไปด้วย","LRAS ไม่เปลี่ยนแปลงเพราะจำนวนประชากรรวมของประเทศยังคงเท่าเดิม สิ่งที่เปลี่ยนคือโครงสร้างอายุเท่านั้น ซึ่งไม่ได้กระทบปริมาณปัจจัยการผลิตที่ประเทศมีอยู่จริงแต่อย่างใดเลย","SRAS เลื่อนลงเพราะแรงงานที่เหลืออยู่จะมีประสบการณ์สูงกว่าค่าเฉลี่ยเดิม ต้นทุนการผลิตต่อหน่วยจึงลดลง และระดับราคาของประเทศจะต่ำลงพร้อมกับผลผลิตที่เพิ่มขึ้นในระยะยาว"],"answer":0,"a":"สไลด์ระบุว่าการเปลี่ยนแปลงของกำลังแรงงานเป็นหนึ่งในปัจจัยที่เลื่อน LRAS เมื่อสัดส่วนประชากรวัยทำงานลดลงต่อเนื่อง ปัจจัยการผลิตหลักของประเทศหดตัว ผลผลิต ณ การจ้างงานเต็มที่จึงลดลงและ LRAS เลื่อนซ้ายอย่างค่อยเป็นค่อยไป\nผลพ่วงที่สำคัญ — จำนวนผู้เสียภาษีต่อผู้รับสวัสดิการลดลง ฐานะการคลังของรัฐบาลตึงตัวขึ้น ซึ่งจำกัดความสามารถในการใช้นโยบายการคลังเมื่อเกิดภาวะถดถอยในอนาคต\nทางออก — ต้องชดเชยด้วยการเพิ่มผลิตภาพ (เทคโนโลยี ระบบอัตโนมัติ การศึกษา) การเพิ่มอัตราการมีส่วนร่วมของกลุ่มที่ยังทำงานได้ หรือการเปิดรับแรงงานข้ามชาติ — ทั้งหมดล้วนเป็นนโยบายด้านอุปทาน","whys":["ถูกต้อง — ระบุทั้งผลต่อ LRAS ผ่านกำลังแรงงานที่หดตัว และผลพ่วงต่อฐานะการคลังของรัฐบาล","ไม่ถูกต้อง — การใช้เงินออมของผู้เกษียณเป็นเรื่องฝั่งอุปสงค์ และไม่ได้เพิ่มแรงงาน ทุน หรือเทคโนโลยีที่กำหนดตำแหน่งของ LRAS","ไม่ถูกต้อง — สิ่งที่สำคัญต่อการผลิตคือจำนวนแรงงาน ไม่ใช่จำนวนประชากรรวม โครงสร้างอายุที่เปลี่ยนจึงกระทบปัจจัยการผลิตโดยตรง","ไม่ถูกต้อง — ประสบการณ์ที่สูงขึ้นอาจช่วยได้บ้าง แต่ไม่ชดเชยการหดตัวของจำนวนแรงงานได้ และไม่ใช่กลไกหลักของสถานการณ์นี้"]},{"id":"S22","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ต้นทุนการปฏิบัติตามกฎระเบียบ","q":"รัฐบาลออกกฎระเบียบใหม่ที่บังคับให้โรงงานทุกแห่งต้องติดตั้งระบบบำบัดและจ้างเจ้าหน้าที่ตรวจสอบเพิ่ม โดยมีผลบังคับใช้ทันที ข้อใดอธิบายผลระยะสั้นและข้อพิจารณาระยะยาวได้ถูกต้อง","choices":["ระยะสั้น SRAS เลื่อนขึ้นจากต้นทุนการปฏิบัติตามกฎที่สูงขึ้น ทำให้ราคาสูงขึ้นและผลผลิตลดลง · ระยะยาวต้องชั่งกับประโยชน์ด้านสุขภาพและสิ่งแวดล้อมที่อาจช่วยผลิตภาพของแรงงานในอนาคต","ระยะสั้น SRAS เลื่อนลงเพราะการลงทุนในระบบบำบัดถูกนับเป็นการลงทุนซึ่งเพิ่มประสิทธิภาพของโรงงาน · ระยะยาวผลผลิตศักยภาพของประเทศจะสูงขึ้นอย่างต่อเนื่องโดยไม่มีต้นทุนใด ๆ ต่อธุรกิจ","ระยะสั้น AD เลื่อนขวาเพราะโรงงานต้องซื้อระบบบำบัดและจ้างเจ้าหน้าที่เพิ่มซึ่งเป็นการใช้จ่ายจริง · ระยะยาวไม่มีผลต่อฝั่งอุปทานเพราะกฎระเบียบไม่ใช่ปัจจัยการผลิตของประเทศแต่อย่างใด","ระยะสั้นและระยะยาวไม่มีเส้นใดเลื่อนเลย เพราะต้นทุนการปฏิบัติตามกฎเป็นต้นทุนคงที่ซึ่งไม่กระทบต้นทุนส่วนเพิ่มต่อหน่วยผลผลิต การตัดสินใจผลิตของธุรกิจจึงไม่เปลี่ยนแปลง"],"answer":0,"a":"ต้นทุนการปฏิบัติตามกฎระเบียบเป็นต้นทุนการผลิตที่แท้จริงของธุรกิจ เมื่อโรงงานต้องลงทุนในระบบบำบัดและจ้างคนเพิ่ม ต้นทุนต่อหน่วยผลผลิตสูงขึ้น ผู้ผลิตจึงขึ้นราคา SRAS เลื่อนขึ้น ระยะสั้นจึงได้ราคาที่สูงขึ้นพร้อมผลผลิตที่ลดลง\nสิ่งที่ทำให้ข้อนี้ยาก คือการประเมินระยะยาวอย่างเป็นธรรม — กฎระเบียบด้านสิ่งแวดล้อมมีเป้าหมายแก้ผลกระทบภายนอกที่ตลาดไม่ได้คิดต้นทุนไว้ อากาศและน้ำที่สะอาดขึ้นอาจลดการเจ็บป่วยและเพิ่มผลิตภาพของแรงงานในอนาคต ซึ่งเป็นผลบวกต่อ LRAS\nการประเมินนโยบายจึงต้องชั่งต้นทุนระยะสั้นที่เห็นชัดกับประโยชน์ระยะยาวที่กระจายตัวและวัดยาก ไม่ใช่ดูเพียงกราฟ AD-AS อย่างเดียว","whys":["ถูกต้อง — ระบุผลระยะสั้นผ่าน SRAS อย่างถูกต้อง และเปิดมุมมองระยะยาวเรื่องผลกระทบภายนอกอย่างเป็นธรรม","ไม่ถูกต้อง — ระบบบำบัดเป็นต้นทุนเพิ่มที่ไม่ได้ทำให้ผลิตสินค้าได้มากขึ้น SRAS จึงเลื่อนขึ้นไม่ใช่ลง และการบอกว่าไม่มีต้นทุนเลยขัดกับโจทย์","ไม่ถูกต้อง — แม้จะมีการใช้จ่ายซื้ออุปกรณ์จริง แต่ช่องทางหลักและตรงที่สุดของกฎระเบียบคือต้นทุนการผลิตซึ่งกระทบฝั่งอุปทาน","ไม่ถูกต้อง — การจ้างเจ้าหน้าที่ตรวจสอบและการเดินระบบบำบัดเป็นต้นทุนที่แปรผันตามการผลิต จึงกระทบต้นทุนต่อหน่วยจริง"]},{"id":"S23","type":"mcq","lvl":4,"topic":"AD-AS","ref":"สองช็อกด้านต้นทุนที่ขัดกัน","q":"ในเวลาเดียวกัน ค่าเงินของประเทศแข็งค่าขึ้นมาก ทำให้วัตถุดิบนำเข้าถูกลง ขณะที่ราคาน้ำมันดิบโลกพุ่งสูงขึ้นรุนแรง ข้อใดวิเคราะห์ผลต่อเส้น SRAS ได้ถูกต้องที่สุด","choices":["ทิศทางการเลื่อนของ SRAS สรุปไม่ได้ เพราะค่าเงินที่แข็งกดต้นทุนนำเข้าลงขณะที่ราคาน้ำมันดันต้นทุนพลังงานขึ้น ผลสุทธิขึ้นกับสัดส่วนของสองรายการนี้ในต้นทุนรวมของผู้ผลิต","SRAS เลื่อนขึ้นอย่างแน่นอน เพราะราคาน้ำมันเป็นต้นทุนที่กระทบทุกอุตสาหกรรมผ่านค่าขนส่งและค่าพลังงาน จึงมีน้ำหนักมากกว่าผลของค่าเงินที่แข็งขึ้นเสมอในทุกโครงสร้างเศรษฐกิจ","SRAS เลื่อนลงอย่างแน่นอน เพราะค่าเงินที่แข็งขึ้นทำให้ราคานำเข้าทุกรายการถูกลงรวมถึงน้ำมันดิบด้วย ผลของค่าเงินจึงหักล้างการขึ้นของราคาน้ำมันในตลาดโลกได้ทั้งหมดเสมอ","SRAS ไม่เลื่อนเลยเพราะสองเหตุการณ์นี้หักล้างกันพอดีตามหลักความเท่าเทียมของอำนาจซื้อ ซึ่งกำหนดว่าค่าเงินจะปรับตัวชดเชยการเปลี่ยนแปลงของราคาสินค้าโภคภัณฑ์โลกเสมอ"],"answer":0,"a":"สองช็อกนี้กระทบต้นทุนการผลิตไปคนละทิศ\nค่าเงินแข็ง — วัตถุดิบ ชิ้นส่วน และเครื่องจักรนำเข้าถูกลงเมื่อคิดเป็นเงินในประเทศ ต้นทุนลดลง แรงกด SRAS ลง\nราคาน้ำมันพุ่ง — ต้นทุนพลังงานและค่าขนส่งสูงขึ้น แรงดัน SRAS ขึ้น\nผลสุทธิขึ้นกับน้ำหนักของสองรายการนี้ในโครงสร้างต้นทุนของผู้ผลิต ประเทศที่นำเข้าชิ้นส่วนอุตสาหกรรมเป็นสัดส่วนใหญ่อาจได้ประโยชน์สุทธิจากค่าเงินแข็ง ส่วนประเทศที่ใช้พลังงานเข้มข้นจะเสียมากกว่า\nข้อสังเกตเพิ่ม — ค่าเงินที่แข็งยังช่วยลดราคาน้ำมันนำเข้าเมื่อคิดเป็นเงินในประเทศได้บางส่วน แต่ไม่จำเป็นต้องหักล้างกันพอดี","whys":["ถูกต้อง — ระบุว่าสองแรงดันต้นทุนไปคนละทาง และชี้ว่าต้องดูสัดส่วนในโครงสร้างต้นทุนจึงจะสรุปได้","ไม่ถูกต้อง — น้ำหนักของพลังงานในต้นทุนรวมต่างกันมากในแต่ละเศรษฐกิจ การสรุปว่าน้ำมันชนะเสมอจึงเกินกว่าที่ทฤษฎีรับรอง","ไม่ถูกต้อง — ค่าเงินที่แข็งช่วยลดราคาน้ำมันนำเข้าได้บางส่วนจริง แต่ไม่มีหลักประกันว่าจะหักล้างการพุ่งขึ้นของราคาโลกได้ทั้งหมด","ไม่ถูกต้อง — ความเท่าเทียมของอำนาจซื้อเป็นแนวคิดระยะยาวที่ไม่ได้รับประกันการหักล้างพอดีของช็อกสองตัวในระยะสั้น"]},{"id":"S24","type":"mcq","lvl":3,"topic":"AD-AS","ref":"การสะสมทุนกับผลผลิตศักยภาพ","q":"ประเทศหนึ่งมีอัตราการออมและการลงทุนสูงติดต่อกันหลายสิบปี ทำให้ปริมาณทุนต่อแรงงานหนึ่งคนเพิ่มขึ้นอย่างมาก ข้อใดอธิบายผลต่อฝั่งอุปทานได้ถูกต้องที่สุด","choices":["LRAS เลื่อนขวาอย่างต่อเนื่องเพราะแรงงานแต่ละคนมีเครื่องมือและเครื่องจักรมากขึ้นจึงผลิตได้มากขึ้น แต่การเพิ่มของผลผลิตต่อหน่วยทุนจะชะลอลงเรื่อย ๆ ตามกฎการลดน้อยถอยลง","LRAS เลื่อนซ้ายเพราะการออมที่สูงหมายถึงการบริโภคที่ต่ำ เมื่ออุปสงค์ในประเทศอ่อนแอ ธุรกิจจะลดกำลังการผลิตลงในที่สุดและผลผลิตศักยภาพของประเทศจะหดตัวลงตามไปด้วย","SRAS เลื่อนลงเพียงเส้นเดียวเพราะเครื่องจักรที่มากขึ้นทำให้ต้นทุนการผลิตต่อหน่วยลดลงในระยะสั้น ส่วน LRAS ไม่ขยับเพราะจำนวนแรงงานของประเทศยังคงเท่าเดิมไม่ได้เพิ่มขึ้นเลย","AD เลื่อนขวาเพียงเส้นเดียวเพราะการลงทุนเป็นองค์ประกอบหนึ่งของอุปสงค์มวลรวม ส่วนฝั่งอุปทานจะได้รับผลกระทบก็ต่อเมื่อเทคโนโลยีการผลิตเปลี่ยนแปลงไปเท่านั้นไม่ใช่จากปริมาณทุน"],"answer":0,"a":"ทุนเป็นหนึ่งในปัจจัยการผลิตที่กำหนดตำแหน่งของ LRAS โดยตรง เมื่อปริมาณทุนต่อแรงงานเพิ่มขึ้น แรงงานแต่ละคนมีเครื่องมือมากขึ้นจึงผลิตได้มากขึ้น ผลผลิต ณ การจ้างงานเต็มที่สูงขึ้นและ LRAS เลื่อนขวาอย่างต่อเนื่อง\nความลึกที่ข้อนี้ต้องการ คือกฎการลดน้อยถอยลงของทุน — เครื่องจักรเครื่องแรกที่ให้คนงานเพิ่มผลผลิตได้มาก เครื่องที่สิบเพิ่มได้น้อยกว่า เครื่องที่ร้อยเพิ่มได้น้อยมาก ดังนั้นการสะสมทุนเพียงอย่างเดียวจะทำให้การเติบโตชะลอลงเรื่อย ๆ\nนี่คือเหตุผลที่ประเทศพัฒนาแล้วต้องพึ่งความก้าวหน้าทางเทคโนโลยีเป็นแรงขับเคลื่อนหลัก เพราะเทคโนโลยีไม่ได้ติดข้อจำกัดนี้ในแบบเดียวกัน","whys":["ถูกต้อง — ระบุทั้งทิศทางของ LRAS และข้อจำกัดจากกฎการลดน้อยถอยลงซึ่งเป็นความรู้ระดับลึกของหัวข้อนี้","ไม่ถูกต้อง — การออมที่สูงเป็นแหล่งเงินทุนสำหรับการลงทุน ซึ่งเพิ่มทุนของประเทศ LRAS จึงเลื่อนขวาไม่ใช่ซ้าย","ไม่ถูกต้อง — ทุนเป็นปัจจัยการผลิตที่กำหนด LRAS เช่นเดียวกับแรงงาน การเพิ่มทุนจึงขยายผลผลิตศักยภาพได้แม้จำนวนแรงงานจะเท่าเดิม","ไม่ถูกต้อง — การลงทุนมีสองบทบาทพร้อมกัน คือเป็นองค์ประกอบของ AD ในระยะสั้น และเป็นตัวสร้างทุนที่เลื่อน LRAS ในระยะยาว"]},{"id":"S25","type":"mcq","lvl":4,"topic":"AD-AS","ref":"อ่านกราฟกลไกปรับตัวเองกลับสู่ LRAS","q":"จากแผนภาพ เศรษฐกิจอยู่ที่จุด B ซึ่งอยู่ขวาของ Y_FE หลังจาก AD เลื่อนขวา หากปล่อยให้กลไกตลาดทำงานโดยไม่มีนโยบายใด ๆ เศรษฐกิจจะเดินไปอย่างไร","choices":["ตลาดแรงงานที่ตึงตัวดันค่าจ้างและต้นทุนขึ้น SRAS เลื่อนขึ้นจาก SRAS₁ ไป SRAS₂ ผลผลิตถอยจากจุด B กลับมาที่ Y_FE ณ จุด C โดยระดับราคาสูงขึ้นจาก P₁ เป็น P₂","ตลาดแรงงานที่หย่อนตัวกดค่าจ้างและต้นทุนลง SRAS เลื่อนลงต่อไปอีก ผลผลิตเพิ่มขึ้นจากจุด B ไปทางขวามากกว่าเดิม และระดับราคาลดลงต่ำกว่า P₁ ในดุลยภาพระยะยาวใหม่","เส้น AD จะเลื่อนกลับมาทางซ้ายเองโดยอัตโนมัติจนถึงตำแหน่งเดิม ผลผลิตกลับมาที่ Y_FE และระดับราคากลับมาที่ P₁ ราวกับว่าไม่เคยมีการเลื่อนของอุปสงค์มวลรวมเกิดขึ้นเลย","เส้น LRAS จะเลื่อนขวามาบรรจบกับจุด B เพราะการที่เศรษฐกิจผลิตได้เกินระดับเดิมเป็นเวลานานพิสูจน์ว่าศักยภาพที่แท้จริงของประเทศสูงกว่าที่เคยประเมินไว้ตั้งแต่ต้น"],"answer":0,"a":"จุด B อยู่ขวาของ LRAS แปลว่าผลผลิตเกินระดับที่ยั่งยืน โรงงานเดินเครื่องเกินกำลังปกติ แรงงานทำล่วงเวลา และอัตราการว่างงานจริงต่ำกว่าอัตราธรรมชาติ — นี่คือช่องว่างเงินเฟ้อ\nสภาพตลาดแรงงานที่ตึงตัวเช่นนี้ทำให้แรงงานมีอำนาจต่อรองสูง ค่าจ้างถูกดันขึ้น ต้นทุนของผู้ผลิตสูงตาม ผู้ผลิตจึงขึ้นราคา SRAS เลื่อนขึ้นจาก SRAS₁ ไปยัง SRAS₂\nกระบวนการนี้ดำเนินไปจนกระทั่งผลผลิตถอยกลับมาที่ Y_FE ณ จุด C ซึ่งเป็นจุดที่เส้นทั้งสามตัดกัน — เป็นดุลยภาพระยะยาวใหม่ที่ผลผลิตเท่าเดิมแต่ระดับราคาสูงขึ้นถาวร ยืนยันข้อสรุปเรื่องความเป็นกลางของนโยบายด้านอุปสงค์ในระยะยาว","whys":["ถูกต้อง — ระบุกลไกผ่านตลาดแรงงานที่ตึงตัว ทิศทางการเลื่อนของ SRAS และจุดจบที่ Y_FE ด้วยราคาที่สูงขึ้น","ไม่ถูกต้อง — จุด B อยู่ขวาของ LRAS ตลาดแรงงานจึงตึงตัวไม่ใช่หย่อนตัว ค่าจ้างจะถูกดันขึ้นไม่ใช่กดลง","ไม่ถูกต้อง — เส้น AD ไม่ได้เลื่อนกลับเอง สิ่งที่ปรับตัวคือฝั่งอุปทานระยะสั้นผ่านค่าจ้างและราคาที่เปลี่ยนไป","ไม่ถูกต้อง — การผลิตเกินศักยภาพชั่วคราวทำได้ด้วยการทำล่วงเวลาและเดินเครื่องเต็มกำลัง ซึ่งไม่ยั่งยืนและไม่ได้เปลี่ยนศักยภาพที่แท้จริง"],"tip":"จำคู่ตรงข้ามนี้: ขวาของ LRAS → ตลาดแรงงานตึง → ค่าจ้างขึ้น → SRAS ขึ้น · ซ้ายของ LRAS → ตลาดแรงงานหย่อน → ค่าจ้างลง → SRAS ลง","fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n  <defs>\n    <clipPath id=\"clipG\"><rect x=\"62\" y=\"26\" width=\"466\" height=\"318\"/></clipPath>\n    <marker id=\"arwG\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/>\n    </marker>\n  </defs>\n  <line x1=\"62\" y1=\"18\" x2=\"62\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <line x1=\"62\" y1=\"344\" x2=\"540\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <text x=\"52\" y=\"14\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">P</text>\n  <text x=\"548\" y=\"349\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Y</text><g clip-path=\"url(#clipG)\"><line x1=\"325.28999999999996\" y1=\"356.72\" x2=\"325.28999999999996\" y2=\"26\" stroke=\"var(--curve-lras)\" stroke-width=\"2.6\" /><line x1=\"34.040000000000006\" y1=\"200.9\" x2=\"555.96\" y2=\"200.9\" stroke=\"var(--curve-as)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"75.98\" y=\"191.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-as)\" text-anchor=\"start\">SRAS₁</text><line x1=\"34.040000000000006\" y1=\"146.84\" x2=\"555.96\" y2=\"146.84\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\" stroke-dasharray=\"7 5\" stroke-linecap=\"round\"/><text x=\"75.98\" y=\"137.84\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ghost)\" text-anchor=\"start\">SRAS₂</text><line x1=\"117.91999999999999\" y1=\"38.72000000000003\" x2=\"677.12\" y2=\"331.28\" stroke=\"var(--curve-ad)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"254.4\" y=\"98.98400000000001\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ad)\" text-anchor=\"start\">AD₂</text><circle cx=\"427.81\" cy=\"200.9\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"437.81\" y=\"216.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">B</text><circle cx=\"325.28999999999996\" cy=\"146.84\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"335.28999999999996\" y=\"134.84\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">C</text></g><text x=\"325.28999999999996\" y=\"17\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-lras)\" text-anchor=\"middle\">LRAS</text><text x=\"325.28999999999996\" y=\"366\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"middle\">Y<tspan dy=\"4\" font-size=\"11\">FE</tspan></text><text x=\"53\" y=\"205.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₁</text><text x=\"53\" y=\"151.84\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₂</text></svg><div class=\"figcap\">ช่องว่างเงินเฟ้อและกลไกปรับตัวเอง — SRAS ค่อย ๆ เลื่อนขึ้นจาก SRAS₁ ไป SRAS₂</div></div>"},{"id":"S26","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ความเร็วในการปรับตัวของ SRAS","q":"ข้อใดอธิบายได้ถูกต้องว่าอะไรเป็นตัวกำหนดความเร็วที่เส้น SRAS จะปรับตัวกลับสู่ดุลยภาพระยะยาว","choices":["ความยืดหยุ่นของค่าจ้างและราคาในระบบ เช่น ระยะเวลาของสัญญาจ้าง อำนาจของสหภาพแรงงาน และความรวดเร็วในการปรับการคาดการณ์เงินเฟ้อของผู้คน","ขนาดของช่องว่างผลผลิตเพียงอย่างเดียว โดยช่องว่างที่ใหญ่กว่าจะทำให้เส้น SRAS ปรับตัวได้เร็วกว่าเสมอไม่ว่าโครงสร้างสถาบันของตลาดแรงงานในประเทศนั้นจะเป็นอย่างไรก็ตาม","ระดับของอัตราดอกเบี้ยนโยบายที่ธนาคารกลางกำหนดไว้ เพราะอัตราดอกเบี้ยเป็นตัวกำหนดต้นทุนเงินทุนของผู้ผลิตซึ่งเป็นองค์ประกอบหลักของต้นทุนการผลิตต่อหน่วยในทุกอุตสาหกรรม","ตำแหน่งของเส้น LRAS เมื่อเทียบกับแกนตั้ง เพราะยิ่งผลผลิตศักยภาพของประเทศสูงเท่าใด กลไกปรับตัวเองก็จะยิ่งทำงานได้รวดเร็วขึ้นเท่านั้นตามขนาดของระบบเศรษฐกิจ"],"answer":0,"a":"SRAS เลื่อนเพราะต้นทุนเปลี่ยน และต้นทุนที่ใหญ่ที่สุดคือค่าจ้าง ดังนั้นความเร็วของกลไกปรับตัวเองจึงขึ้นกับว่าค่าจ้างและราคาในระบบนั้นเปลี่ยนได้เร็วแค่ไหน\nปัจจัยที่ทำให้ช้า — สัญญาจ้างระยะยาว สหภาพแรงงานที่เข้มแข็ง กฎหมายคุ้มครองแรงงานที่เข้มงวด ความไม่เต็มใจของนายจ้างที่จะลดค่าจ้างเพราะกระทบขวัญกำลังใจ และการคาดการณ์เงินเฟ้อที่ปรับตัวช้า\nปัจจัยที่ทำให้เร็ว — ตลาดแรงงานที่ยืดหยุ่น สัญญาระยะสั้น และผู้คนที่ปรับการคาดการณ์ได้ไว\nนี่คือเหตุผลที่คำถามว่า “ควรรอกลไกตลาดหรือใช้นโยบาย” ไม่มีคำตอบสากล — ประเทศที่ตลาดแรงงานยืดหยุ่นอาจรอได้ ส่วนประเทศที่ค่าจ้างหนืดมากอาจต้องเข้าแทรกแซง มิฉะนั้นจะเสียผลผลิตไปหลายปี","whys":["ถูกต้อง — ชี้ที่ความยืดหยุ่นของค่าจ้างและราคาซึ่งเป็นตัวแปรที่กำหนดว่า SRAS จะเลื่อนได้เร็วเพียงใด","ไม่ถูกต้อง — ขนาดของช่องว่างมีผลต่อแรงกดดันอยู่บ้าง แต่โครงสร้างสถาบันของตลาดแรงงานเป็นตัวกำหนดความเร็วที่สำคัญกว่ามาก","ไม่ถูกต้อง — อัตราดอกเบี้ยเป็นเครื่องมือที่เลื่อนเส้น AD ไม่ใช่ตัวกำหนดความเร็วในการปรับตัวของค่าจ้างและราคาในระบบ","ไม่ถูกต้อง — ขนาดของเศรษฐกิจไม่ได้กำหนดความเร็วของการปรับตัว สิ่งที่กำหนดคือความหนืดของค่าจ้างและราคาในสถาบันของประเทศนั้น"]},{"id":"S27","type":"mcq","lvl":4,"topic":"AD-AS","ref":"แยกช็อกชั่วคราวออกจากช็อกถาวร","q":"ราคาแร่หายากที่ใช้ในการผลิตชิ้นส่วนอิเล็กทรอนิกส์พุ่งสูงขึ้นมาก จากการที่ประเทศผู้ผลิตรายใหญ่ประกาศจำกัดการส่งออกเป็นการถาวร ข้อใดอธิบายผลได้ถูกต้องที่สุด","choices":["SRAS เลื่อนขึ้นจากต้นทุนที่สูงขึ้น และหากข้อจำกัดนี้ถาวรจริง LRAS ก็มีแนวโน้มเลื่อนซ้ายด้วย เพราะประเทศเข้าถึงปัจจัยการผลิตได้น้อยลงอย่างถาวรจนกว่าจะหาวัสดุทดแทนได้","SRAS เลื่อนขึ้นเพียงเส้นเดียวและจะกลับลงมาเองภายในไม่กี่เดือน เพราะช็อกราคาสินค้าโภคภัณฑ์ทุกประเภทเป็นเรื่องชั่วคราวเสมอตามวัฏจักรของตลาดสินค้าโภคภัณฑ์โลกที่ผันผวนตลอดเวลา","LRAS เลื่อนขวาเพราะข้อจำกัดนี้จะบีบให้ผู้ผลิตในประเทศคิดค้นวัสดุทดแทนและเทคโนโลยีใหม่ ซึ่งจะทำให้ผลิตภาพของประเทศสูงขึ้นสุทธิตั้งแต่ปีแรกที่มีการประกาศข้อจำกัดดังกล่าว","AD เลื่อนซ้ายเพียงเส้นเดียวเพราะผู้บริโภคต้องจ่ายค่าสินค้าอิเล็กทรอนิกส์แพงขึ้นจนกำลังซื้อสำหรับสินค้าอื่นลดลง ส่วนฝั่งอุปทานไม่ได้รับผลกระทบเพราะเป็นเรื่องของราคาไม่ใช่ปริมาณ"],"answer":0,"a":"คำว่า “ถาวร” ในโจทย์คือกุญแจ\nผลต่อ SRAS — ต้นทุนวัตถุดิบสูงขึ้นทันที ผู้ผลิตขึ้นราคา SRAS เลื่อนขึ้น ราคาสูงขึ้นและผลผลิตลดลงในระยะสั้น\nผลต่อ LRAS — ถ้าการจำกัดเป็นการถาวรและไม่มีแหล่งทดแทน แปลว่าประเทศเข้าถึงปัจจัยการผลิตชนิดหนึ่งได้น้อยลงอย่างถาวร ซึ่งลดความสามารถในการผลิตที่แท้จริง LRAS จึงมีแนวโน้มเลื่อนซ้ายด้วย\nนี่คือความต่างสำคัญจากช็อกราคาน้ำมันชั่วคราวซึ่งกระทบเพียง SRAS — เกณฑ์ตัดสินไม่ได้อยู่ที่ว่าเป็นสินค้าโภคภัณฑ์หรือไม่ แต่อยู่ที่ชั่วคราวหรือถาวร และมีสิ่งทดแทนได้หรือไม่\nในระยะยาวมาก หากผู้ผลิตคิดค้นวัสดุทดแทนได้สำเร็จ ผลลบอาจถูกชดเชย แต่นั่นเป็นกระบวนการที่ใช้เวลาหลายปีและไม่รับประกันความสำเร็จ","whys":["ถูกต้อง — ใช้เกณฑ์ชั่วคราว/ถาวรได้ถูกต้อง และระบุผลต่อทั้งสองเส้นพร้อมเงื่อนไขเรื่องวัสดุทดแทน","ไม่ถูกต้อง — โจทย์ระบุชัดว่าเป็นการจำกัดถาวร การเหมาว่าช็อกสินค้าโภคภัณฑ์ทุกชนิดเป็นเรื่องชั่วคราวจึงขัดกับข้อมูล","ไม่ถูกต้อง — การคิดค้นวัสดุทดแทนอาจเกิดขึ้นได้จริงแต่ใช้เวลาหลายปีและไม่รับประกันผล ไม่ใช่ผลบวกสุทธิตั้งแต่ปีแรก","ไม่ถูกต้อง — แร่หายากเป็นวัตถุดิบในการผลิต ไม่ใช่สินค้าขั้นสุดท้าย ช่องทางหลักจึงเป็นต้นทุนการผลิตซึ่งกระทบฝั่งอุปทาน"]},{"id":"S28","type":"mcq","lvl":2,"topic":"AD-AS","ref":"นโยบายด้านอุปทานเทียบกับด้านอุปสงค์","q":"ข้อใดคือความแตกต่างที่สำคัญที่สุดระหว่างนโยบายด้านอุปทานกับนโยบายด้านอุปสงค์ ในแง่ของผลลัพธ์ที่ได้","choices":["นโยบายด้านอุปทานเลื่อน LRAS จึงเพิ่มผลผลิตได้อย่างถาวรและกดระดับราคาลง ส่วนนโยบายด้านอุปสงค์เลื่อน AD จึงเพิ่มผลผลิตได้ชั่วคราวโดยแลกกับระดับราคาที่สูงขึ้นถาวร","นโยบายด้านอุปทานให้ผลเร็วกว่าเพราะกระทบต้นทุนของผู้ผลิตโดยตรง ส่วนนโยบายด้านอุปสงค์ให้ผลช้ากว่าเพราะต้องรอให้ครัวเรือนและธุรกิจตัดสินใจใช้จ่ายเพิ่มขึ้นก่อนจึงจะเห็นผล","นโยบายด้านอุปทานใช้ได้เฉพาะในภาวะเศรษฐกิจถดถอย ส่วนนโยบายด้านอุปสงค์ใช้ได้เฉพาะในภาวะเศรษฐกิจร้อนแรง ทั้งสองจึงไม่มีทางถูกนำมาใช้พร้อมกันได้ในสถานการณ์ใดเลย","นโยบายด้านอุปทานดำเนินการโดยธนาคารกลางเท่านั้น ส่วนนโยบายด้านอุปสงค์ดำเนินการโดยรัฐบาลเท่านั้น ความแตกต่างจึงอยู่ที่หน่วยงานผู้รับผิดชอบไม่ใช่ที่ผลลัพธ์ทางเศรษฐกิจ"],"answer":0,"a":"ความต่างที่แท้จริงอยู่ที่เส้นไหนถูกเลื่อน ซึ่งกำหนดผลลัพธ์ทั้งหมด\nนโยบายด้านอุปสงค์ (การคลัง การเงิน) เลื่อน AD → ผลผลิตเพิ่มในระยะสั้น แต่ระยะยาว SRAS ปรับขึ้นจนผลผลิตกลับสู่ Y_FE เหลือไว้เพียงระดับราคาที่สูงขึ้น เป็นการซื้อผลผลิตชั่วคราวด้วยราคาถาวร\nนโยบายด้านอุปทาน (การศึกษา เทคโนโลยี การลงทุนในทุน การลดต้นทุนเชิงโครงสร้าง) เลื่อน LRAS ไปทางขวา → ผลผลิตศักยภาพสูงขึ้นอย่างถาวร และเนื่องจากอุปทานที่มากขึ้นกดราคาลง จึงได้ผลผลิตที่สูงขึ้นพร้อมกับระดับราคาที่ต่ำลง\nข้อแลกเปลี่ยน — นโยบายด้านอุปทานใช้เวลาหลายปีกว่าจะเห็นผล จึงไม่เหมาะกับการดับไฟเฉพาะหน้า ทั้งสองจึงเป็นเครื่องมือคนละบทบาทที่ควรใช้คู่ขนานกัน","whys":["ถูกต้อง — จับความต่างที่แก่นคือเส้นที่ถูกเลื่อน ซึ่งกำหนดว่าผลจะถาวรหรือชั่วคราวและระดับราคาจะไปทางไหน","ไม่ถูกต้อง — สลับกัน นโยบายด้านอุปทานอย่างการศึกษาและการสะสมทุนใช้เวลาหลายปี ส่วนนโยบายด้านอุปสงค์ให้ผลเร็วกว่ามาก","ไม่ถูกต้อง — ทั้งสองใช้พร้อมกันได้และควรใช้คู่ขนาน โดยเฉพาะเมื่อเศรษฐกิจมีทั้งปัญหาวัฏจักรและปัญหาเชิงโครงสร้าง","ไม่ถูกต้อง — รัฐบาลเป็นผู้ดำเนินนโยบายด้านอุปทานเป็นหลัก และทั้งรัฐบาลกับธนาคารกลางต่างก็มีเครื่องมือด้านอุปสงค์ของตนเอง"],"tip":"ประโยคเปรียบเทียบที่ใช้ตอบได้ทุกข้อ: อุปสงค์ = ผลผลิตชั่วคราว ราคาถาวร · อุปทาน = ผลผลิตถาวร ราคาต่ำลง แต่ต้องรอ"},{"id":"S29","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ผลิตภาพกับค่าจ้างที่เพิ่มขึ้นพร้อมกัน","q":"ในปีหนึ่ง ค่าจ้างเฉลี่ยทั่วประเทศเพิ่มขึ้น 5% ขณะที่ผลิตภาพแรงงานก็เพิ่มขึ้น 5% เช่นกัน ข้อใดอธิบายผลต่อเส้น SRAS ได้ถูกต้อง","choices":["SRAS ไม่เลื่อน เพราะต้นทุนแรงงานต่อหน่วยผลผลิตไม่เปลี่ยนแปลง ค่าจ้างที่สูงขึ้นถูกชดเชยด้วยผลผลิตต่อคนที่มากขึ้นพอดี ผู้ผลิตจึงไม่มีเหตุผลที่จะปรับราคาขาย","SRAS เลื่อนขึ้น เพราะค่าจ้างที่เพิ่มขึ้น 5% เป็นต้นทุนที่ผู้ผลิตต้องจ่ายเพิ่มจริง ไม่ว่าผลิตภาพจะเปลี่ยนแปลงไปอย่างไรก็ตาม ต้นทุนรวมของธุรกิจย่อมสูงขึ้นตามค่าจ้างเสมอ","SRAS เลื่อนลง เพราะผลิตภาพที่สูงขึ้น 5% ทำให้ผลิตได้มากขึ้น ส่วนค่าจ้างที่สูงขึ้นเป็นเรื่องของการกระจายรายได้ระหว่างนายจ้างกับลูกจ้างซึ่งไม่กระทบต้นทุนการผลิตต่อหน่วยเลย","SRAS เลื่อนขึ้นและ LRAS เลื่อนซ้ายพร้อมกัน เพราะค่าจ้างที่สูงขึ้นทำให้ต้นทุนของประเทศสูงขึ้นถาวร และความสามารถในการแข่งขันกับต่างประเทศลดลงจนศักยภาพการผลิตหดตัวลงตาม"],"answer":0,"a":"สิ่งที่กำหนดตำแหน่งของ SRAS ไม่ใช่ค่าจ้างโดด ๆ แต่คือต้นทุนแรงงานต่อหน่วยผลผลิต (unit labor cost) ซึ่งเท่ากับค่าจ้างหารด้วยผลิตภาพ\nเมื่อค่าจ้างเพิ่ม 5% และผลิตภาพเพิ่ม 5% เท่ากัน ต้นทุนแรงงานต่อหน่วยจึงเท่าเดิมพอดี ผู้ผลิตจ่ายค่าจ้างต่อคนแพงขึ้น แต่ได้ผลผลิตจากคนคนนั้นมากขึ้นในสัดส่วนเดียวกัน ต้นทุนต่อสินค้าหนึ่งชิ้นไม่เปลี่ยน จึงไม่มีเหตุผลที่จะขึ้นราคา SRAS ไม่เลื่อน\nนี่คือหลักการสำคัญของนโยบายค่าจ้าง — ค่าจ้างที่เติบโตตามผลิตภาพไม่สร้างเงินเฟ้อ ส่วนค่าจ้างที่เติบโตเร็วกว่าผลิตภาพต่างหากที่ดัน SRAS ขึ้นและสร้างเงินเฟ้อต้นทุนผลัก ซึ่งเป็นเกณฑ์ที่ธนาคารกลางทั่วโลกใช้ติดตามแรงกดดันเงินเฟ้อจากฝั่งค่าจ้าง","whys":["ถูกต้อง — ใช้แนวคิดต้นทุนแรงงานต่อหน่วยผลผลิตซึ่งเป็นตัวแปรที่กำหนดตำแหน่งของ SRAS อย่างแท้จริง","ไม่ถูกต้อง — ต้นทุนที่สำคัญคือต้นทุนต่อหน่วยผลผลิต ไม่ใช่ต้นทุนต่อคน เมื่อผลผลิตต่อคนเพิ่มขึ้นตาม ต้นทุนต่อหน่วยจึงเท่าเดิม","ไม่ถูกต้อง — ค่าจ้างเป็นต้นทุนการผลิตที่แท้จริงของธุรกิจ ไม่ใช่เพียงเรื่องการกระจายรายได้ และผลของสองแรงหักล้างกันพอดีในกรณีนี้","ไม่ถูกต้อง — ผลิตภาพที่สูงขึ้นตามค่าจ้างทำให้ความสามารถในการแข่งขันไม่ลดลง และผลิตภาพที่เพิ่มยังเป็นผลบวกต่อ LRAS ด้วยซ้ำ"],"tip":"สูตรที่ควรจำ: ต้นทุนแรงงานต่อหน่วย = ค่าจ้าง ÷ ผลิตภาพ — ค่าจ้างขึ้นเท่ากับผลิตภาพ = ไม่มีแรงกดดันเงินเฟ้อ"},{"id":"S30","type":"mcq","lvl":4,"topic":"AD-AS","ref":"สังเคราะห์: จัดชุดนโยบายด้านอุปทาน","q":"ประเทศหนึ่งมีเป้าหมายยกระดับผลผลิตศักยภาพภายใน 10 ปี ที่ปรึกษาเสนอสี่มาตรการ ข้อใดคือชุดที่ทั้งหมดเป็นนโยบายด้านอุปทานที่เลื่อน LRAS ไปทางขวาได้จริง","choices":["ปฏิรูปการศึกษาและฝึกทักษะแรงงาน · ลงทุนโครงสร้างพื้นฐานด้านคมนาคมและพลังงาน · ลดต้นทุนธุรกรรมในการประกอบธุรกิจ · สนับสนุนการวิจัยและพัฒนาเทคโนโลยี","ลดอัตราดอกเบี้ยนโยบายอย่างต่อเนื่อง · เพิ่มรายจ่ายภาครัฐด้านสวัสดิการ · ลดภาษีมูลค่าเพิ่ม · แจกเงินให้ครัวเรือนรายได้น้อยเพื่อกระตุ้นการบริโภคภายในประเทศให้ขยายตัว","ปฏิรูปการศึกษาและฝึกทักษะแรงงาน · ลดอัตราดอกเบี้ยนโยบาย · เพิ่มรายจ่ายภาครัฐด้านสวัสดิการ · สนับสนุนการวิจัยและพัฒนาเทคโนโลยีของภาคเอกชนอย่างเต็มที่","ขึ้นกำแพงภาษีนำเข้าเพื่อปกป้องอุตสาหกรรมในประเทศ · ควบคุมราคาสินค้าจำเป็นไม่ให้สูงเกินไป · เพิ่มค่าจ้างขั้นต่ำอย่างก้าวกระโดด · จำกัดการเข้ามาทำงานของแรงงานข้ามชาติ"],"answer":0,"a":"นโยบายด้านอุปทานคือสิ่งที่เพิ่มแรงงาน ทุน เทคโนโลยี หรือประสิทธิภาพในการใช้ทรัพยากร ซึ่งทั้งสี่มาตรการในคำตอบที่ถูกทำได้ครบ\nการศึกษาและฝึกทักษะ → เพิ่มทุนมนุษย์และผลิตภาพแรงงาน\nโครงสร้างพื้นฐาน → เพิ่มทุนทางกายภาพและลดต้นทุนโลจิสติกส์ของทั้งระบบ\nลดต้นทุนธุรกรรม → เพิ่มประสิทธิภาพในการจัดสรรทรัพยากร\nวิจัยและพัฒนา → เพิ่มระดับเทคโนโลยี ซึ่งเป็นแรงขับเคลื่อนการเติบโตที่ไม่ติดกฎการลดน้อยถอยลง\nทั้งสี่ให้ผลช้าแต่ถาวร และมีคุณสมบัติพิเศษคือเพิ่มผลผลิตพร้อมกับกดระดับราคาลง ต่างจากเครื่องมือด้านอุปสงค์ที่ให้ผลเร็วแต่ชั่วคราวและแลกมาด้วยราคาที่สูงขึ้น","whys":["ถูกต้อง — ทั้งสี่มาตรการเพิ่มปัจจัยการผลิตหรือประสิทธิภาพในการใช้ทรัพยากร จึงเลื่อน LRAS ไปทางขวาได้จริง","ไม่ถูกต้อง — ทั้งสี่เป็นเครื่องมือด้านอุปสงค์ที่เลื่อนเส้น AD ซึ่งเพิ่มผลผลิตได้เพียงชั่วคราวและจบลงที่ระดับราคาที่สูงขึ้น","ไม่ถูกต้อง — มีสองมาตรการที่ถูกต้อง แต่การลดดอกเบี้ยและการเพิ่มรายจ่ายสวัสดิการเป็นเครื่องมือด้านอุปสงค์ ไม่ได้เลื่อน LRAS","ไม่ถูกต้อง — ทั้งสี่มาตรการมีแนวโน้มลดประสิทธิภาพหรือลดปัจจัยการผลิต ซึ่งดัน LRAS ไปทางซ้ายมากกว่าทางขวา"]},{"id":"E01","type":"mcq","lvl":2,"topic":"AD-AS","ref":"นิยามดุลยภาพระยะสั้นและระยะยาว","q":"ข้อใดระบุเงื่อนไขของดุลยภาพระยะสั้นและดุลยภาพระยะยาวในแบบจำลอง AD-AS ได้ถูกต้อง","choices":["ดุลยภาพระยะสั้นคือจุดที่ AD ตัดกับ SRAS ซึ่งอาจอยู่ซ้ายหรือขวาของ LRAS ก็ได้ · ดุลยภาพระยะยาวคือจุดที่ AD, SRAS และ LRAS ตัดกันที่จุดเดียวกันพอดี","ดุลยภาพระยะสั้นคือจุดที่ AD ตัดกับ LRAS เพราะผลผลิตถูกกำหนดโดยศักยภาพ · ดุลยภาพระยะยาวคือจุดที่ SRAS ตัดกับ LRAS เพราะราคาปรับตัวได้เต็มที่แล้วในระยะยาว","ดุลยภาพระยะสั้นคือจุดที่เส้นทั้งสามตัดกัน · ดุลยภาพระยะยาวคือจุดที่ AD ตัดกับ SRAS เท่านั้น เพราะในระยะยาวเส้น LRAS จะหมดความหมายไปเนื่องจากราคาปรับได้หมดแล้ว","ดุลยภาพทั้งสองแบบคือจุดที่ AD ตัดกับ LRAS เสมอ ต่างกันเพียงว่าในระยะสั้นระดับราคายังไม่ปรับตัว ส่วนในระยะยาวระดับราคาได้ปรับตัวจนเข้าสู่ระดับที่เหมาะสมเรียบร้อยแล้ว"],"answer":0,"a":"สไลด์ระบุไว้ตรง ๆ ว่า “Short-run equilibrium: AD intersects SRAS · Long-run equilibrium: AD, LRAS, and SRAS all intersect at same point”\nความหมายเชิงเศรษฐศาสตร์ที่ต้องเข้าใจคือ\nระยะสั้น — ราคายังปรับไม่เต็มที่ ผลผลิตจึงถูกกำหนดที่จุดพบกันของอุปสงค์กับอุปทานระยะสั้น และเบี่ยงเบนออกจากศักยภาพได้ ซึ่งเป็นที่มาของคำว่าช่องว่างผลผลิต\nระยะยาว — ค่าจ้างและราคาปรับตัวครบถ้วน SRAS เลื่อนจนเส้นทั้งสามมาบรรจบกันที่ Y_FE ช่องว่างจึงปิดสนิท\nการเข้าใจจุดนี้เป็นรากฐานของทุกข้อในบทนี้ เพราะคำถามเกือบทั้งหมดคือ “ตอนนี้อยู่ตรงไหนเทียบ LRAS และจะเดินไปทางไหน”","whys":["ถูกต้อง — ครบทั้งนิยามและประเด็นสำคัญว่าดุลยภาพระยะสั้นอยู่นอกเส้น LRAS ได้","ไม่ถูกต้อง — สลับกัน ในระยะสั้นผลผลิตไม่ได้ถูกยึดไว้ที่ LRAS ส่วนดุลยภาพระยะยาวต้องมีอุปสงค์เข้ามาร่วมกำหนดด้วย","ไม่ถูกต้อง — LRAS ไม่ได้หมดความหมายในระยะยาว ตรงกันข้าม มันคือเส้นที่กำหนดผลผลิตในระยะยาวทั้งหมด","ไม่ถูกต้อง — ถ้าดุลยภาพอยู่ที่ LRAS เสมอ เศรษฐกิจก็จะไม่มีวันเกิดภาวะถดถอยหรือร้อนแรงเกินไป ซึ่งขัดกับข้อเท็จจริง"],"tip":"เขียนหัวกระดาษไว้ก่อนทำข้อสอบบทนี้: ระยะสั้น = AD ตัด SRAS · ระยะยาว = เส้นทั้งสามตัดจุดเดียว"},{"id":"E02","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ลำดับขั้นตอนการวิเคราะห์ที่ถูกต้อง","q":"เมื่อเจอโจทย์ที่ให้เหตุการณ์หนึ่งแล้วถามผลระยะสั้นและระยะยาว ข้อใดคือลำดับการวิเคราะห์ที่ครบถ้วนและถูกต้องที่สุด","choices":["ระบุเส้นที่เลื่อนและทิศทาง → หาดุลยภาพระยะสั้นใหม่ว่า P กับ Y เป็นอย่างไร → เทียบตำแหน่งกับ LRAS เพื่อระบุชนิดของช่องว่าง → ติดตามว่า SRAS ปรับตัวไปทางใดจนถึงดุลยภาพระยะยาว","หาดุลยภาพระยะยาวก่อนเพราะเป็นจุดสุดท้าย → ย้อนกลับมาหาดุลยภาพระยะสั้น → ระบุเส้นที่เลื่อนและทิศทางในภายหลัง → สรุปว่าช่องว่างผลผลิตเป็นชนิดใดจากระดับราคาที่เปลี่ยนไป","ระบุว่าระดับราคาเปลี่ยนไปอย่างไรก่อน → อนุมานว่าเส้นใดเลื่อนจากทิศทางของราคา → สรุปผลผลิตในระยะสั้น → ถือว่าระยะยาวไม่ต้องวิเคราะห์เพราะเศรษฐกิจกลับสู่จุดเดิมเสมอ","ระบุเส้นที่เลื่อนและทิศทาง → สรุปผลระยะสั้นและระยะยาวพร้อมกันในขั้นตอนเดียว → ไม่จำเป็นต้องเทียบกับ LRAS เพราะตำแหน่งของดุลยภาพบอกทุกอย่างอยู่แล้วในตัวมันเอง"],"answer":0,"a":"ลำดับสี่ขั้นนี้คือโครงสร้างคำตอบที่ได้คะแนนเต็มของข้อสอบอัตนัยทุกข้อในบทนี้\nขั้นที่ 1 เส้นไหนเลื่อนและทางไหน — ต้องผูกกับกลไกให้ได้ว่าเหตุการณ์กระทบ C, I, G, NX (เลื่อน AD) หรือกระทบต้นทุน (เลื่อน SRAS) หรือกระทบปัจจัยการผลิต (เลื่อน LRAS)\nขั้นที่ 2 ดุลยภาพระยะสั้นใหม่ — P และ Y ขยับไปทางใด\nขั้นที่ 3 เทียบกับ LRAS — ซ้าย = ช่องว่างการหดตัว ขวา = ช่องว่างเงินเฟ้อ ขั้นนี้สำคัญที่สุดเพราะเป็นตัวกำหนดว่า SRAS จะปรับไปทางไหนต่อ\nขั้นที่ 4 ระยะยาว — SRAS เลื่อนจนช่องว่างปิด แล้วสรุปว่า P และ Y ปลายทางเป็นเท่าใดเทียบจุดเริ่มต้น","whys":["ถูกต้อง — เดินจากสาเหตุไปสู่ผลระยะสั้น แล้วใช้ตำแหน่งเทียบ LRAS เป็นตัวชี้ทิศทางการปรับตัวในระยะยาว","ไม่ถูกต้อง — การหาปลายทางก่อนโดยไม่รู้ว่าเส้นใดเลื่อน ทำให้ไม่สามารถระบุได้ว่าดุลยภาพระยะยาวใหม่จะอยู่ที่ระดับราคาใด","ไม่ถูกต้อง — การอนุมานย้อนจากราคาเพียงตัวเดียวไม่พอ ต้องดูทิศทางของผลผลิตควบคู่ และระยะยาวก็ไม่ได้กลับจุดเดิมเสมอไป","ไม่ถูกต้อง — การข้ามขั้นตอนเทียบกับ LRAS ทำให้ไม่รู้ว่าเป็นช่องว่างชนิดใด จึงระบุทิศทางการปรับตัวของ SRAS ไม่ได้"],"tip":"ท่องสี่ขั้นนี้แล้วเขียนเป็นสี่บรรทัดในกระดาษคำตอบทุกข้อ: เส้นไหน → ทางไหน → P,Y ระยะสั้นและอยู่ซ้าย/ขวา LRAS → ระยะยาวจบที่ไหน"},{"id":"E03","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ช่องว่างการหดตัวและการปรับตัวครบวงจร","q":"เศรษฐกิจอยู่ในดุลยภาพระยะยาว แล้วความเชื่อมั่นของผู้บริโภคตกต่ำลงอย่างรุนแรง หากไม่มีนโยบายใด ๆ ข้อใดบรรยายเส้นทางของเศรษฐกิจได้ถูกต้องครบทั้งสองระยะ","choices":["ระยะสั้น AD เลื่อนซ้าย ผลผลิตลดต่ำกว่า Y_FE โดยราคาคงเดิม เกิดช่องว่างการหดตัว · ระยะยาว ค่าจ้างและราคาปรับลดลง SRAS เลื่อนลง ผลผลิตกลับสู่ Y_FE ที่ระดับราคาต่ำกว่าเดิม","ระยะสั้น AD เลื่อนซ้าย ผลผลิตลดต่ำกว่า Y_FE โดยราคาคงเดิม เกิดช่องว่างการหดตัว · ระยะยาว ค่าจ้างและราคาปรับสูงขึ้น SRAS เลื่อนขึ้น ผลผลิตกลับสู่ Y_FE ที่ระดับราคาสูงกว่าเดิม","ระยะสั้น SRAS เลื่อนขึ้น ผลผลิตลดต่ำกว่า Y_FE และราคาสูงขึ้น เกิดภาวะเงินเฟ้อควบคู่เศรษฐกิจซบเซา · ระยะยาว เส้น LRAS เลื่อนซ้ายมาบรรจบกับระดับผลผลิตที่เป็นจริงในขณะนั้น","ระยะสั้น AD เลื่อนขวา ผลผลิตเพิ่มเหนือ Y_FE โดยราคาคงเดิม เกิดช่องว่างเงินเฟ้อ · ระยะยาว ค่าจ้างและราคาปรับสูงขึ้น SRAS เลื่อนขึ้น ผลผลิตกลับสู่ Y_FE ที่ราคาสูงกว่าเดิม"],"answer":0,"a":"เดินสี่ขั้น\n(1) เส้นไหนเลื่อน — ความเชื่อมั่นเป็นตัวกำหนดการบริโภค จึงกระทบ C และเลื่อน AD\n(2) ทางไหน — ความเชื่อมั่นตก C ลด AD เลื่อนซ้าย\n(3) ระยะสั้น — ในกรอบ SRAS แนวนอน ราคาถูกตรึงไว้ ผู้ผลิตปรับด้วยปริมาณ ผลคือ Y ลดลงโดย P คงเดิม จุดดุลยภาพอยู่ซ้ายของ LRAS จึงเป็นช่องว่างการหดตัว พร้อมการว่างงานตามวัฏจักรที่สูงกว่าอัตราธรรมชาติ\n(4) ระยะยาว — ตลาดแรงงานที่หย่อนตัวกดค่าจ้างลง ผู้ผลิตยอมลดราคาเพื่อระบายสินค้า ต้นทุนลดลงทำให้ SRAS เลื่อนลง จนตัด AD ใหม่ตรงกับ LRAS ผลผลิตกลับสู่ Y_FE โดยระดับราคาต่ำกว่าเดิม เพราะอุปสงค์ที่หดตัวลงอย่างถาวร","whys":["ถูกต้อง — ครบทั้งสี่ขั้น และสรุประดับราคาปลายทางได้ถูกทิศคือต่ำกว่าเดิม","ไม่ถูกต้อง — สามขั้นแรกถูก แต่ทิศทางการปรับของ SRAS ผิด ในช่องว่างการหดตัวค่าจ้างจะถูกกดลง SRAS จึงเลื่อนลงไม่ใช่ขึ้น","ไม่ถูกต้อง — ความเชื่อมั่นของผู้บริโภคกระทบ C ซึ่งอยู่ฝั่งอุปสงค์ ไม่ใช่ต้นทุนการผลิต และ LRAS ก็ไม่เลื่อนตามอุปสงค์ที่ตกต่ำ","ไม่ถูกต้อง — ความเชื่อมั่นที่ตกต่ำทำให้การบริโภคลดลง AD จึงเลื่อนซ้ายไม่ใช่ขวา ทิศทางกลับด้านทั้งหมด"]},{"id":"E04","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ช่องว่างเงินเฟ้อและการปรับตัวครบวงจร","q":"เศรษฐกิจอยู่ในดุลยภาพระยะยาว แล้วรัฐบาลเพิ่มรายจ่ายภาครัฐอย่างมาก หากไม่มีมาตรการอื่นใดตามมา ข้อใดบรรยายเส้นทางของเศรษฐกิจได้ถูกต้องครบทั้งสองระยะ","choices":["ระยะสั้น AD เลื่อนขวา ผลผลิตเพิ่มเหนือ Y_FE โดยราคาคงเดิม เกิดช่องว่างเงินเฟ้อ · ระยะยาว ค่าจ้างและต้นทุนปรับสูงขึ้น SRAS เลื่อนขึ้น ผลผลิตกลับสู่ Y_FE ที่ระดับราคาสูงกว่าเดิม","ระยะสั้น AD เลื่อนขวา ผลผลิตเพิ่มเหนือ Y_FE โดยราคาคงเดิม เกิดช่องว่างเงินเฟ้อ · ระยะยาว ผลผลิตยังคงอยู่เหนือ Y_FE อย่างถาวรเพราะรายจ่ายภาครัฐเป็นองค์ประกอบถาวรของ GDP","ระยะสั้น LRAS เลื่อนขวาทันทีเพราะรายจ่ายภาครัฐเพิ่มกำลังการผลิตของประเทศ · ระยะยาว ระดับราคาลดลงเพราะอุปทานที่มากขึ้นกดราคาลงตามกลไกตลาดที่ทำงานอย่างสมบูรณ์","ระยะสั้น SRAS เลื่อนลงเพราะรัฐบาลใช้จ่ายซื้อสินค้าจากผู้ผลิตในประเทศมากขึ้น · ระยะยาว ผลผลิตเพิ่มขึ้นถาวรพร้อมกับระดับราคาที่ลดลงจากการประหยัดต่อขนาดในการผลิต"],"answer":0,"a":"(1) และ (2) รายจ่ายรัฐบาล (G) เป็นองค์ประกอบโดยตรงของ AD การเพิ่ม G จึงเลื่อน AD ไปทางขวา\n(3) ระยะสั้น ในกรอบ SRAS แนวนอน ผลคือ Y เพิ่มขึ้นโดย P คงเดิม จุดดุลยภาพอยู่ขวาของ LRAS จึงเป็นช่องว่างเงินเฟ้อ ตลาดแรงงานตึงตัว อัตราการว่างงานจริงต่ำกว่าอัตราธรรมชาติ\n(4) ระยะยาว แรงงานมีอำนาจต่อรองสูงขึ้น ค่าจ้างถูกดันขึ้น ต้นทุนของผู้ผลิตสูงตาม ผู้ผลิตขึ้นราคา SRAS เลื่อนขึ้น กระบวนการดำเนินไปจนผลผลิตถอยกลับมาที่ Y_FE โดยระดับราคาสูงกว่าเดิมอย่างถาวร\nนี่คือข้อสรุปเรื่องความเป็นกลางของนโยบายด้านอุปสงค์ในระยะยาว — ได้ผลผลิตชั่วคราวโดยแลกกับระดับราคาที่สูงขึ้นถาวร","whys":["ถูกต้อง — ครบทั้งสี่ขั้น พร้อมข้อสรุปว่าระยะยาวผลผลิตกลับที่เดิมแต่ราคาค้างสูง","ไม่ถูกต้อง — ในระยะยาวผลผลิตถูกกำหนดโดย LRAS ซึ่งขึ้นกับปัจจัยการผลิตที่แท้จริง ไม่ใช่โดยระดับของอุปสงค์","ไม่ถูกต้อง — รายจ่ายภาครัฐจะเลื่อน LRAS ได้ก็ต่อเมื่อเป็นการลงทุนที่เพิ่มกำลังการผลิตจริงและต้องใช้เวลาหลายปี ไม่ใช่ทันที","ไม่ถูกต้อง — การที่รัฐบาลซื้อสินค้ามากขึ้นเป็นการเพิ่มอุปสงค์ ไม่ได้ลดต้นทุนการผลิตของผู้ผลิต SRAS จึงไม่เลื่อนลง"]},{"id":"E05","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ระบุว่าเศรษฐกิจอยู่ในดุลยภาพระยะยาวหรือไม่","q":"จากแผนภาพ ข้อใดอธิบายสถานะของเศรษฐกิจ ณ จุดปัจจุบันได้ถูกต้องที่สุด","choices":["เป็นดุลยภาพระยะสั้นแต่ไม่ใช่ระยะยาว เพราะจุด E อยู่ขวาของ LRAS เส้นทั้งสามยังไม่ตัดกันที่จุดเดียว เศรษฐกิจอยู่ในช่องว่างเงินเฟ้อและมีแรงกดดันให้ SRAS เลื่อนขึ้น","เป็นดุลยภาพระยะยาวอยู่แล้ว เพราะจุด E เป็นจุดที่เส้นอุปสงค์มวลรวมตัดกับเส้นอุปทานมวลรวมระยะสั้นพอดี ซึ่งเป็นเงื่อนไขครบถ้วนของการเป็นดุลยภาพในแบบจำลองนี้","เป็นดุลยภาพระยะสั้นแต่ไม่ใช่ระยะยาว เพราะจุด E อยู่ซ้ายของ LRAS เศรษฐกิจอยู่ในช่องว่างการหดตัวและมีแรงกดดันให้เส้นอุปทานระยะสั้นเลื่อนลงในระยะถัดไป","ไม่เป็นดุลยภาพใดเลย เพราะเส้นทั้งสามไม่ได้ตัดกันที่จุดเดียว ระบบเศรษฐกิจจึงอยู่ในภาวะไม่สมดุลที่ปริมาณอุปสงค์กับปริมาณอุปทานไม่เท่ากันในตลาดสินค้า"],"answer":0,"a":"ตรวจสอบทีละเงื่อนไข\nเป็นดุลยภาพระยะสั้นหรือไม่ — ใช่ เพราะ AD ตัดกับ SRAS ที่จุด E ปริมาณที่ต้องการซื้อเท่ากับปริมาณที่ผู้ผลิตป้อนเข้าตลาดพอดี\nเป็นดุลยภาพระยะยาวหรือไม่ — ไม่ใช่ เพราะเงื่อนไขของดุลยภาพระยะยาวคือเส้นทั้งสามต้องตัดกันที่จุดเดียว แต่จุด E อยู่ขวาของ LRAS\nแปลว่าอะไร — ผลผลิตเกินระดับที่ยั่งยืน โรงงานเดินเครื่องเกินกำลังปกติ แรงงานทำล่วงเวลา อัตราการว่างงานต่ำกว่าอัตราธรรมชาติ นี่คือช่องว่างเงินเฟ้อ ซึ่งจะสร้างแรงกดดันให้ค่าจ้างและต้นทุนสูงขึ้น และ SRAS จะเลื่อนขึ้นในระยะถัดไป","whys":["ถูกต้อง — แยกได้ว่าเป็นดุลยภาพระยะสั้นแต่ไม่ใช่ระยะยาว และระบุชนิดของช่องว่างกับทิศทางแรงกดดันได้ถูก","ไม่ถูกต้อง — การที่ AD ตัด SRAS เป็นเงื่อนไขของดุลยภาพระยะสั้นเท่านั้น ดุลยภาพระยะยาวต้องมี LRAS ผ่านจุดเดียวกันด้วย","ไม่ถูกต้อง — จุด E อยู่ทางขวาของ LRAS ตามที่กราฟแสดง จึงเป็นช่องว่างเงินเฟ้อ ไม่ใช่ช่องว่างการหดตัว","ไม่ถูกต้อง — ณ จุด E ปริมาณอุปสงค์เท่ากับปริมาณอุปทานระยะสั้นพอดี จึงเป็นดุลยภาพระยะสั้นที่สมบูรณ์ เพียงแต่ไม่ยั่งยืน"],"fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n  <defs>\n    <clipPath id=\"clipG\"><rect x=\"62\" y=\"26\" width=\"466\" height=\"318\"/></clipPath>\n    <marker id=\"arwG\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/>\n    </marker>\n  </defs>\n  <line x1=\"62\" y1=\"18\" x2=\"62\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <line x1=\"62\" y1=\"344\" x2=\"540\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <text x=\"52\" y=\"14\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">P</text>\n  <text x=\"548\" y=\"349\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Y</text><g clip-path=\"url(#clipG)\"><line x1=\"325.28999999999996\" y1=\"356.72\" x2=\"325.28999999999996\" y2=\"26\" stroke=\"var(--curve-lras)\" stroke-width=\"2.6\" /><line x1=\"34.040000000000006\" y1=\"200.9\" x2=\"555.96\" y2=\"200.9\" stroke=\"var(--curve-as)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"75.98\" y=\"191.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-as)\" text-anchor=\"start\">SRAS</text><line x1=\"117.91999999999999\" y1=\"38.72000000000003\" x2=\"677.12\" y2=\"331.28\" stroke=\"var(--curve-ad)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"254.4\" y=\"98.98400000000001\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ad)\" text-anchor=\"start\">AD</text><circle cx=\"427.81\" cy=\"200.9\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"437.81\" y=\"216.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">E</text></g><text x=\"325.28999999999996\" y=\"17\" font-size=\"14\" font-weight=\"700\
