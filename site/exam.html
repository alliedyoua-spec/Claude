ี่ฝึกตรงกับตำแหน่งที่เปิดจริง","whys":["ถูกต้อง — โจมตีที่ต้นเหตุคือช่องว่างทักษะ และการออกแบบร่วมกับนายจ้างช่วยให้ทักษะที่ฝึกตรงกับตำแหน่งที่ว่างอยู่จริง","ไม่ถูกต้อง — เป็นเครื่องมือด้านอุปสงค์ ซึ่งไม่ได้เปลี่ยนทักษะของแรงงาน ตำแหน่งงานว่างที่หาคนไม่ได้ก็จะยังคงหาคนไม่ได้เหมือนเดิม","ไม่ถูกต้อง — เป็นเครื่องมือด้านอุปสงค์เช่นกัน และโจทย์ไม่ได้บอกว่าอุปสงค์ในเมืองตกต่ำ ตรงกันข้าม ตำแหน่งงานยังว่างอยู่มาก","ไม่ถูกต้อง — ช่วยประคองรายได้ได้จริง แต่ไม่ได้ลดการว่างงาน และยังอาจยืดระยะเวลาการค้นหางานออกไปจนอัตราธรรมชาติสูงขึ้นอีก"]},{"id":"U26","type":"mcq","lvl":2,"topic":"การว่างงาน","ref":"เหตุใดอัตราการว่างงานศูนย์จึงไม่ใช่เป้าหมาย","q":"เหตุใดนักเศรษฐศาสตร์จึงไม่ตั้งเป้าให้อัตราการว่างงานเท่ากับศูนย์ แม้ในภาวะที่เศรษฐกิจดีที่สุด","choices":["เพราะการว่างงานชั่วคราวเป็นผลพลอยได้ที่หลีกเลี่ยงไม่ได้ของเศรษฐกิจที่มีการโยกย้ายตำแหน่งงานตลอดเวลา และการบีบให้เป็นศูนย์จะทำให้การจับคู่คนกับงานด้อยคุณภาพลง","เพราะสำนักงานสถิติไม่สามารถวัดอัตราการว่างงานได้แม่นยำถึงระดับศูนย์ การตั้งเป้าที่ตัวเลขนี้จึงไม่มีความหมายในทางปฏิบัติและไม่สามารถตรวจสอบผลได้จริง","เพราะรัฐบาลจำเป็นต้องมีแรงงานว่างงานจำนวนหนึ่งไว้เป็นกำลังสำรองสำหรับโครงการภาครัฐ ซึ่งต้องการระดมแรงงานจำนวนมากในระยะเวลาอันสั้นเมื่อเกิดความจำเป็น","เพราะกฎหมายค่าจ้างขั้นต่ำและสหภาพแรงงานมีอยู่ในทุกประเทศ จึงไม่มีทางที่อัตราการว่างงานจะลงมาถึงศูนย์ได้ ไม่ว่ารัฐบาลจะดำเนินนโยบายอย่างไรก็ตาม"],"answer":0,"a":"ในเศรษฐกิจที่มีชีวิต ธุรกิจเกิดใหม่และปิดตัวตลอดเวลา คนย้ายงาน ย้ายเมือง และจบการศึกษาเข้าสู่ตลาดแรงงานทุกปี กระบวนการจับคู่คนกับงานย่อมกินเวลาเสมอ การว่างงานชั่วคราวจึงเป็นเงาของพลวัตที่ดีต่อเศรษฐกิจ ไม่ใช่ความล้มเหลว ยิ่งไปกว่านั้น หากบีบให้ทุกคนต้องรับงานแรกที่เจอทันที การจับคู่จะด้อยคุณภาพและผลิตภาพโดยรวมจะต่ำลง เป้าหมายที่สมเหตุสมผลจึงเป็นการทำให้อัตราการว่างงานจริงใกล้เคียงอัตราธรรมชาติ ไม่ใช่ให้เป็นศูนย์","whys":["ถูกต้อง — ชี้ว่าการว่างงานชั่วคราวเป็นผลพลอยได้ของพลวัตทางเศรษฐกิจ และการบีบให้เป็นศูนย์มีต้นทุนด้านคุณภาพการจับคู่งาน","ไม่ถูกต้อง — ปัญหาการวัดมีอยู่จริงแต่ไม่ใช่เหตุผลเชิงทฤษฎี แม้วัดได้แม่นยำสมบูรณ์ เป้าหมายศูนย์เปอร์เซ็นต์ก็ยังไม่พึงปรารถนาอยู่ดี","ไม่ถูกต้อง — ไม่มีทฤษฎีใดในบทเรียนที่เสนอให้รัฐเก็บแรงงานว่างงานไว้เป็นกำลังสำรอง และแรงงานที่ว่างงานนานก็ทักษะเสื่อมถอย","ไม่ถูกต้อง — สถาบันเหล่านี้ทำให้อัตราธรรมชาติสูงขึ้นจริง แต่เป็นคำอธิบายว่า “ทำไมจึงลงไม่ถึงศูนย์” ไม่ใช่ “ทำไมจึงไม่ควรตั้งเป้าที่ศูนย์”"]},{"id":"U27","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"ขอบเขตของนโยบายการเงินต่อการว่างงาน","q":"ธนาคารกลางลดอัตราดอกเบี้ยนโยบายลงอย่างต่อเนื่องจนอัตราการว่างงานลดจาก 9% เหลือ 6.5% แล้วหยุดนิ่ง แม้จะลดดอกเบี้ยต่ออีกก็ไม่ลดลงอีกแต่เงินเฟ้อเริ่มเร่งตัว ข้อใดอธิบายสถานการณ์นี้ได้ดีที่สุด","choices":["อัตราการว่างงานลงมาถึงระดับอัตราธรรมชาติแล้ว ส่วนที่เป็นวัฏจักรถูกกำจัดไปหมดแล้ว การกระตุ้นอุปสงค์ต่อจากนี้จึงไปลงที่ระดับราคาแทนที่จะลงที่การจ้างงาน","อัตราการว่างงานลงมาถึงระดับอัตราธรรมชาติแล้ว แต่ธนาคารกลางยังสามารถกดให้ต่ำลงได้อีกอย่างถาวรหากลดดอกเบี้ยแรงพอ เพียงแต่ต้องยอมรับเงินเฟ้อที่สูงขึ้นเล็กน้อย","นโยบายการเงินหมดประสิทธิภาพโดยสิ้นเชิงเมื่ออัตราดอกเบี้ยลงมาถึงระดับต่ำ ธนาคารกลางจึงควรเปลี่ยนไปใช้นโยบายการคลังแบบขาดดุลเพื่อกดการว่างงานให้ต่ำลงต่อไป","อัตราธรรมชาติของประเทศนี้ต้องต่ำกว่า 6.5% อย่างแน่นอน เพราะการว่างงานหยุดลดลงเป็นเพียงความล่าช้าของกลไกส่งผ่านนโยบายการเงินซึ่งจะออกฤทธิ์เต็มที่ในภายหลัง"],"answer":0,"a":"สิ่งที่เกิดขึ้นคือ เศรษฐกิจได้ปิดช่องว่างการหดตัวจนหมดแล้ว การว่างงานตามวัฏจักร 2.5 จุด (9% → 6.5%) ถูกกำจัดไปด้วยการยก AD กลับขึ้น แต่ส่วนที่เหลือ 6.5% คืออัตราธรรมชาติ ซึ่งประกอบด้วยการว่างงานชั่วคราวและตามโครงสร้าง — ทั้งสองอย่างเป็นปัญหาฝั่งอุปทานที่เครื่องมือด้านอุปสงค์แก้ไม่ได้\nเมื่อผลผลิตถูกดันเลย Y_FE ไปแล้ว การกระตุ้นต่อจะทำให้ตลาดแรงงานตึงตัวเกินไป ค่าจ้างและต้นทุนถูกดันขึ้น SRAS เลื่อนขึ้น ผลลัพธ์จึงตกลงที่ระดับราคา ไม่ใช่ที่การจ้างงาน","whys":["ถูกต้อง — อธิบายทั้งว่าเหตุใดการว่างงานจึงหยุดลดลง และเหตุใดการกระตุ้นต่อจึงกลายเป็นเงินเฟ้อแทน","ไม่ถูกต้อง — การกดการว่างงานต่ำกว่าอัตราธรรมชาติอย่างถาวรเป็นไปไม่ได้ ผลที่ได้คือเงินเฟ้อเร่งตัวขึ้นเรื่อย ๆ โดยการว่างงานกลับสู่ระดับเดิม","ไม่ถูกต้อง — นโยบายการเงินไม่ได้หมดประสิทธิภาพ แต่การว่างงานที่เหลือไม่ใช่ปัญหาด้านอุปสงค์ การเปลี่ยนไปใช้นโยบายการคลังก็จะเจอกำแพงเดียวกัน","ไม่ถูกต้อง — หลักฐานที่ว่าเงินเฟ้อเริ่มเร่งตัวขึ้นคือสัญญาณว่าเศรษฐกิจถึงหรือเลยระดับศักยภาพแล้ว ไม่ใช่ความล่าช้าของกลไกส่งผ่าน"],"tip":"ท่องหลักนี้ไว้: นโยบายด้านอุปสงค์กำจัดได้เฉพาะการว่างงานตามวัฏจักร — พอชนอัตราธรรมชาติแล้ว ทุกหน่วยที่กระตุ้นเพิ่มจะกลายเป็นเงินเฟ้อ"},{"id":"U28","type":"mcq","lvl":3,"topic":"การว่างงาน","ref":"การทำงานต่ำระดับที่สถิติมองไม่เห็น","q":"ในภาวะเศรษฐกิจหดตัว บริษัทจำนวนมากไม่ได้เลิกจ้างพนักงาน แต่ลดชั่วโมงทำงานลงครึ่งหนึ่ง และให้พนักงานปริญญาตรีไปทำงานที่ต้องการวุฒิต่ำกว่ามาก ข้อใดอธิบายผลต่อสถิติตลาดแรงงานได้ถูกต้อง","choices":["อัตราการว่างงานแทบไม่เปลี่ยนแปลงเพราะคนเหล่านี้ยังถูกนับเป็นผู้มีงานทำ สถิติจึงประเมินความหย่อนตัวของตลาดแรงงานต่ำกว่าความเป็นจริงไปมาก","อัตราการว่างงานเพิ่มขึ้นตามสัดส่วนชั่วโมงทำงานที่ถูกตัดลง เพราะสำนักงานสถิติคำนวณการจ้างงานจากจำนวนชั่วโมงทำงานรวมของระบบไม่ใช่จากจำนวนคนที่มีงานทำ","อัตราการมีส่วนร่วมของกำลังแรงงานลดลงอย่างมาก เพราะพนักงานที่ถูกลดชั่วโมงทำงานจะถูกย้ายไปอยู่ในกลุ่มผู้ไม่อยู่ในกำลังแรงงานตามเกณฑ์ของสำนักงานสถิติแรงงาน","สัดส่วนผู้มีงานทำต่อประชากรลดลงอย่างชัดเจน เพราะการทำงานต่ำกว่าวุฒิการศึกษาทำให้พนักงานเหล่านั้นไม่ถูกนับเป็นผู้มีงานทำเต็มเวลาอีกต่อไปในสถิติทางการ"],"answer":0,"a":"เกณฑ์ของสถิติทางการคือ “ทำงานอยู่หรือไม่” ไม่ใช่ “ทำงานมากพอหรือเหมาะกับทักษะหรือไม่” พนักงานที่ถูกลดชั่วโมงลงครึ่งหนึ่ง และผู้ที่ทำงานต่ำกว่าวุฒิ ยังคงถูกนับเป็นผู้มีงานทำทั้งหมด อัตราการว่างงานจึงแทบไม่ขยับ ทั้งที่ความหย่อนตัวของตลาดแรงงานเพิ่มขึ้นจริง ปรากฏการณ์นี้เรียกว่าการทำงานต่ำระดับ (underemployment) และเป็นเหตุผลที่ต้องดูตัวชี้วัดอื่นประกอบ เช่น ชั่วโมงทำงานเฉลี่ยและสัดส่วนผู้มีงานทำต่อประชากร","whys":["ถูกต้อง — ชี้ข้อจำกัดเชิงนิยามของสถิติการว่างงานได้ตรงจุด และระบุทิศทางของความคลาดเคลื่อนได้ถูกต้อง","ไม่ถูกต้อง — สำนักงานสถิติจำแนกคนเป็นรายบุคคลตามสถานะการทำงาน ไม่ได้แปลงชั่วโมงทำงานเป็นจำนวนคนเทียบเท่าในการคำนวณอัตราการว่างงาน","ไม่ถูกต้อง — คนที่ยังทำงานอยู่ ไม่ว่าจะกี่ชั่วโมง ยังคงอยู่ในกำลังแรงงานและถูกนับเป็นผู้มีงานทำ จึงไม่ถูกย้ายออกไปไหน","ไม่ถูกต้อง — การทำงานต่ำกว่าวุฒิไม่มีผลต่อการจำแนกสถานะ คนเหล่านั้นยังถูกนับเป็นผู้มีงานทำ สัดส่วนต่อประชากรจึงไม่ลดลง"]},{"id":"U29","type":"mcq","lvl":3,"topic":"การว่างงาน","ref":"อ่านกราฟตลาดแรงงานที่ค่าจ้างเหนือดุลยภาพ","q":"จากแผนภาพตลาดแรงงาน หากรัฐปรับลดค่าจ้างขั้นต่ำลงจนเท่ากับ W_E พอดี ข้อใดอธิบายสิ่งที่จะเกิดขึ้นได้ถูกต้อง","choices":["ปริมาณอุปสงค์แรงงานเพิ่มขึ้นจาก L₁ และปริมาณอุปทานแรงงานลดลงจาก L₂ จนมาบรรจบกันที่ L_E อุปทานส่วนเกินหายไป การว่างงานจากกลไกนี้จึงหมดไปด้วย","ปริมาณอุปสงค์และอุปทานแรงงานลดลงพร้อมกันทั้งคู่ เพราะค่าจ้างที่ต่ำลงทำให้ทั้งนายจ้างและแรงงานสูญเสียแรงจูงใจในการเข้าร่วมตลาดแรงงานแห่งนี้ไปพร้อม ๆ กัน","เส้นอุปสงค์แรงงานเลื่อนไปทางขวาทั้งเส้น เพราะต้นทุนค่าจ้างที่ถูกลงทำให้นายจ้างทุกรายต้องการจ้างแรงงานเพิ่มขึ้น ณ ทุกระดับค่าจ้างที่เป็นไปได้ในตลาดนี้","เกิดการขาดแคลนแรงงานขนาดใหญ่ เพราะค่าจ้างที่ลดลงทำให้แรงงานจำนวนมากถอนตัวออกจากตลาดไปหางานในภาคอื่นที่ให้ค่าตอบแทนสูงกว่าเดิมอย่างชัดเจน"],"answer":0,"a":"เมื่อค่าจ้างถูกปล่อยให้ลงมาที่ระดับดุลยภาพ W_E ให้อ่านกราฟตามการเคลื่อนที่ไปตามเส้นทั้งสอง: ค่าจ้างที่ถูกลงทำให้นายจ้างเต็มใจจ้างมากขึ้น ปริมาณอุปสงค์ขยับจาก L₁ ไปทางขวา ขณะเดียวกันแรงงานบางส่วนที่เคยอยากทำงานที่ค่าจ้างสูงกลับไม่เต็มใจที่ค่าจ้างต่ำลง ปริมาณอุปทานขยับจาก L₂ มาทางซ้าย ทั้งสองมาบรรจบกันที่ L_E ช่องว่างที่เคยเป็นอุปทานส่วนเกิน (L₂ − L₁) จึงปิดสนิท","whys":["ถูกต้อง — เป็นการเคลื่อนที่ไปตามเส้นทั้งสองเส้นเข้าหาจุดตัด ทำให้ส่วนเกินในตลาดแรงงานหายไป","ไม่ถูกต้อง — ค่าจ้างที่ต่ำลงทำให้ผู้ซื้อแรงงานต้องการมากขึ้นแต่ผู้ขายแรงงานเสนอตัวน้อยลง สองฝั่งเคลื่อนสวนทางกันเสมอ","ไม่ถูกต้อง — ค่าจ้างอยู่บนแกนตั้งของกราฟนี้ การเปลี่ยนค่าจ้างจึงเป็นการเคลื่อนที่ไปตามเส้น ไม่ใช่การเลื่อนเส้นทั้งเส้น","ไม่ถูกต้อง — ที่ระดับดุลยภาพพอดี ปริมาณอุปสงค์เท่ากับปริมาณอุปทาน จึงไม่มีทั้งส่วนเกินและการขาดแคลนแรงงานเกิดขึ้น"],"fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n  <line x1=\"70\" y1=\"24\" x2=\"70\" y2=\"330\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <line x1=\"70\" y1=\"330\" x2=\"514\" y2=\"330\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <text x=\"56\" y=\"18\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"middle\">ค่าจ้าง</text>\n  <text x=\"518\" y=\"336\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--ink)\">ปริมาณแรงงาน</text>\n  <line x1=\"91.5\" y1=\"66\" x2=\"478.5\" y2=\"306\" stroke=\"var(--curve-ad)\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n  <text x=\"484.5\" y=\"306\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--curve-ad)\">L<tspan dy=\"4\" font-size=\"11\">D</tspan><tspan dy=\"-4\" font-size=\"13.5\"> (อุปสงค์)</tspan></text>\n  <line x1=\"91.5\" y1=\"306\" x2=\"478.5\" y2=\"66\" stroke=\"var(--curve-as)\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n  <text x=\"484.5\" y=\"66\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--curve-as)\">L<tspan dy=\"4\" font-size=\"11\">S</tspan><tspan dy=\"-4\" font-size=\"13.5\"> (อุปทาน)</tspan></text>\n  <line x1=\"70\" y1=\"120\" x2=\"500\" y2=\"120\" stroke=\"var(--warn)\" stroke-width=\"2.4\" stroke-dasharray=\"7 5\"/>\n  <text x=\"496\" y=\"140\" font-size=\"13\" font-weight=\"700\" fill=\"var(--warn)\" text-anchor=\"end\">ค่าจ้างขั้นต่ำ</text>\n  <line x1=\"70\" y1=\"186\" x2=\"285\" y2=\"186\" stroke=\"var(--line-2)\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/>\n  <text x=\"62\" y=\"191\" font-size=\"13\" fill=\"var(--muted)\" text-anchor=\"end\">W<tspan dy=\"3\" font-size=\"10\">E</tspan></text>\n  <line x1=\"285\" y1=\"186\" x2=\"285\" y2=\"330\" stroke=\"var(--line-2)\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/>\n  <text x=\"285\" y=\"350\" font-size=\"13\" fill=\"var(--muted)\" text-anchor=\"middle\">L<tspan dy=\"3\" font-size=\"10\">E</tspan></text>\n  <line x1=\"188.25\" y1=\"120\" x2=\"188.25\" y2=\"330\" stroke=\"var(--line-2)\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/>\n  <text x=\"188.25\" y=\"350\" font-size=\"13\" fill=\"var(--muted)\" text-anchor=\"middle\">L<tspan dy=\"3\" font-size=\"10\">1</tspan></text>\n  <line x1=\"381.75\" y1=\"120\" x2=\"381.75\" y2=\"330\" stroke=\"var(--line-2)\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/>\n  <text x=\"381.75\" y=\"350\" font-size=\"13\" fill=\"var(--muted)\" text-anchor=\"middle\">L<tspan dy=\"3\" font-size=\"10\">2</tspan></text>\n  <line x1=\"188.25\" y1=\"104\" x2=\"381.75\" y2=\"104\" stroke=\"var(--bad)\" stroke-width=\"2\"/>\n  <text x=\"285\" y=\"97\" font-size=\"13\" font-weight=\"700\" fill=\"var(--bad)\" text-anchor=\"middle\">ส่วนเกินแรงงาน = การว่างงาน</text>\n  </svg><div class=\"figcap\">รูปที่ 4 — การว่างงานที่เกิดจากค่าจ้างสูงกว่าระดับดุลยภาพ</div></div>"},{"id":"U30","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"สังเคราะห์: ลำดับความสำคัญของมาตรการ","q":"ที่ปรึกษาเสนอมาตรการสี่ชุดให้รัฐบาลที่กำลังเผชิญภาวะถดถอยรุนแรงในปีนี้ ร่วมกับอัตราธรรมชาติที่สูงเรื้อรังมาสิบปี ข้อใดเรียงลำดับเหตุผลได้ถูกต้องที่สุด","choices":["เร่งนโยบายด้านอุปสงค์ก่อนเพื่อหยุดการว่างงานตามวัฏจักรไม่ให้ลากยาวจนกลายเป็นโครงสร้าง แล้วเดินนโยบายด้านอุปทานคู่ขนานไปเพื่อกดอัตราธรรมชาติลงในระยะยาว","เดินนโยบายด้านอุปทานให้เสร็จก่อนจนอัตราธรรมชาติลดลงมาอยู่ในระดับที่ยอมรับได้ แล้วจึงค่อยพิจารณาใช้นโยบายด้านอุปสงค์ในภายหลังเมื่อโครงสร้างตลาดแรงงานพร้อมแล้ว","ใช้เฉพาะนโยบายด้านอุปสงค์อย่างเข้มข้นที่สุดเท่าที่ทำได้ เพราะเมื่อเศรษฐกิจกลับมาร้อนแรง ปัญหาเชิงโครงสร้างทั้งหมดจะถูกแก้ไปเองโดยกลไกตลาดแรงงานที่ตึงตัว","ไม่ใช้นโยบายด้านอุปสงค์เลยเพราะจะสร้างเงินเฟ้อ ให้ทุ่มทรัพยากรทั้งหมดไปที่การฝึกทักษะและการปฏิรูปสถาบันตลาดแรงงานซึ่งเป็นรากของปัญหาที่แท้จริงเพียงอย่างเดียว"],"answer":0,"a":"ปัญหาสองชั้นต้องใช้เครื่องมือสองชุด แต่ลำดับเวลาก็สำคัญ\nความเร่งด่วน — การว่างงานตามวัฏจักรต้องรีบจัดการ เพราะยิ่งลากยาว ทักษะยิ่งเสื่อม นายจ้างยิ่งไม่อยากรับ และมันจะแปรสภาพเป็นการว่างงานตามโครงสร้าง ทำให้อัตราธรรมชาติสูงขึ้นอีก การรอทำนโยบายด้านอุปทานให้เสร็จก่อนจึงเป็นการปล่อยให้แผลลุกลาม\nความยั่งยืน — แต่นโยบายด้านอุปสงค์กำจัดได้เฉพาะส่วนวัฏจักร เมื่อชนอัตราธรรมชาติแล้วจะกลายเป็นเงินเฟ้อ การฝึกทักษะและปฏิรูปสถาบันจึงต้องเดินคู่ขนานไปตั้งแต่ต้น ไม่ใช่รอทีหลัง","whys":["ถูกต้อง — จัดลำดับตามความเร่งด่วนโดยไม่ทิ้งมิติระยะยาว และตระหนักถึงความเสี่ยงที่ปัญหาวัฏจักรจะกลายเป็นปัญหาโครงสร้าง","ไม่ถูกต้อง — นโยบายด้านอุปทานใช้เวลาหลายปีกว่าจะเห็นผล การรอจะทำให้การว่างงานตามวัฏจักรลากยาวจนแปรสภาพเป็นปัญหาถาวร","ไม่ถูกต้อง — ตลาดแรงงานที่ตึงตัวช่วยได้บ้างในขอบ แต่ไม่ได้ปิดช่องว่างทักษะให้ทั้งระบบ และการกระตุ้นเกินขนาดจะจบที่เงินเฟ้อ","ไม่ถูกต้อง — การปฏิเสธนโยบายด้านอุปสงค์ทั้งหมดในภาวะถดถอยรุนแรง เท่ากับยอมเสียผลผลิตและการจ้างงานไปโดยไม่จำเป็น"],"tip":"คำตอบระดับสูงของโจทย์ “ปัญหาสองชั้น” ต้องมีคำว่า คู่ขนาน — ไม่ใช่เลือกอย่างใดอย่างหนึ่ง และไม่ใช่ทำทีละอย่างจนเสร็จ"},{"id":"D01","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ระบุช่องทางที่ทำให้ AD ลาดลง","q":"ระดับราคาโดยรวมในประเทศสูงขึ้น ทำให้สินค้าที่ผลิตในประเทศแพงขึ้นเมื่อเทียบกับสินค้าจากต่างประเทศ ผู้บริโภคจึงหันไปซื้อสินค้านำเข้ามากขึ้นและต่างชาติซื้อสินค้าเราน้อยลง ปรากฏการณ์นี้คือช่องทางใดที่อธิบายความชันของเส้น AD","choices":["ผลทางอัตราแลกเปลี่ยน ซึ่งทำงานผ่านการส่งออกสุทธิ (NX) โดยระดับราคาในประเทศที่สูงขึ้นทำให้สินค้าของเราเสียเปรียบด้านราคาเมื่อเทียบกับสินค้าต่างประเทศ","ผลทางความมั่งคั่ง ซึ่งทำงานผ่านการบริโภค (C) โดยระดับราคาที่สูงขึ้นทำให้อำนาจซื้อของเงินที่ครัวเรือนถืออยู่ลดลง ครัวเรือนจึงรู้สึกจนลงและใช้จ่ายน้อยลงกว่าเดิม","ผลทางอัตราดอกเบี้ย ซึ่งทำงานผ่านการลงทุน (I) โดยระดับราคาที่สูงขึ้นทำให้ความต้องการถือเงินเพิ่มขึ้นและดันอัตราดอกเบี้ยให้สูงตาม การลงทุนจึงลดลง","ผลทางต้นทุนการผลิต ซึ่งทำงานผ่านการตัดสินใจของผู้ผลิต โดยระดับราคาที่สูงขึ้นทำให้ต้นทุนวัตถุดิบแพงขึ้น ผู้ผลิตจึงลดปริมาณการผลิตลงตามไปด้วย"],"answer":0,"a":"เส้น AD ลาดลงด้วยสามช่องทาง และโจทย์ระบุกลไกไว้ชัดเจนว่าเป็นเรื่องของราคาสินค้าในประเทศเทียบกับสินค้าต่างประเทศ ซึ่งกระทบการส่งออกและการนำเข้าโดยตรง จึงเป็นผลทางอัตราแลกเปลี่ยน (exchange-rate effect) ที่ทำงานผ่าน NX\nอีกสองช่องทางมีอยู่จริงแต่ไม่ตรงกับกลไกที่โจทย์บรรยาย ส่วนผลทางต้นทุนการผลิตไม่ใช่คำอธิบายความชันของ AD เลย เพราะเป็นเรื่องฝั่งอุปทาน","whys":["ถูกต้อง — โจทย์บรรยายการเปรียบเทียบราคาในประเทศกับต่างประเทศและผลต่อการค้า ซึ่งคือช่องทาง NX โดยตรง","ไม่ถูกต้อง — เป็นช่องทางที่ถูกต้องของ AD จริง แต่ทำงานผ่านอำนาจซื้อของเงินที่ถืออยู่ ไม่ใช่ผ่านการเปรียบเทียบราคากับต่างประเทศ","ไม่ถูกต้อง — เป็นช่องทางที่ถูกต้องของ AD จริง แต่ทำงานผ่านตลาดเงินและอัตราดอกเบี้ย ซึ่งโจทย์ไม่ได้กล่าวถึงเลย","ไม่ถูกต้อง — เป็นตรรกะฝั่งอุปทานซึ่งอธิบายการเลื่อนของ SRAS ไม่ใช่เหตุผลที่ทำให้เส้นอุปสงค์มวลรวมมีความชันเป็นลบ"],"tip":"จำคู่ช่องทาง–ตัวแปร: ความมั่งคั่ง→C · อัตราดอกเบี้ย→I · อัตราแลกเปลี่ยน→NX แล้วดูว่าโจทย์บรรยายกลไกไหน"},{"id":"D02","type":"mcq","lvl":4,"topic":"AD-AS","ref":"แยกการเลื่อนเส้นออกจากการเคลื่อนที่ตามเส้น","q":"พิจารณาสี่เหตุการณ์ — (1) ระดับราคาโดยรวมลดลง (2) รัฐบาลประกาศลดภาษีเงินได้ (3) ธนาคารกลางลดอัตราดอกเบี้ยนโยบาย (4) ดัชนีความเชื่อมั่นผู้บริโภคปรับตัวดีขึ้น ข้อใดจำแนกได้ถูกต้อง","choices":["เหตุการณ์ (1) ทำให้เคลื่อนที่ไปตามเส้น AD เดิม ส่วนเหตุการณ์ (2) (3) และ (4) ทำให้เส้น AD เลื่อนไปทางขวาทั้งเส้น เพราะเป็นปัจจัยนอกแกนของกราฟ","เหตุการณ์ (1) และ (3) ทำให้เคลื่อนที่ไปตามเส้น AD เดิม เพราะทั้งคู่เกี่ยวข้องกับราคาและดอกเบี้ย ส่วนเหตุการณ์ (2) และ (4) ทำให้เส้น AD เลื่อนไปทางขวา","เหตุการณ์ทั้งสี่ทำให้เส้น AD เลื่อนไปทางขวาทั้งหมด เพราะทุกเหตุการณ์ล้วนส่งผลให้ปริมาณความต้องการซื้อสินค้าและบริการโดยรวมของระบบเศรษฐกิจเพิ่มสูงขึ้น","เหตุการณ์ (1) ทำให้เส้น AD เลื่อนขวา ส่วนอีกสามเหตุการณ์ทำให้เคลื่อนที่ไปตามเส้นเดิม เพราะนโยบายและความเชื่อมั่นไม่ได้เปลี่ยนตำแหน่งของเส้นอุปสงค์มวลรวม"],"answer":0,"a":"กฎเดียวใช้ได้เสมอ — ตัวแปรที่อยู่บนแกนของกราฟทำให้เคลื่อนที่ไปตามเส้น ตัวแปรอื่นทุกตัวทำให้เส้นเลื่อน แกนของกราฟ AD-AS คือระดับราคา (P) และผลผลิตที่แท้จริง (Y)\nเหตุการณ์ (1) ระดับราคาอยู่บนแกนตั้ง จึงเป็นการเคลื่อนที่ไปตามเส้นผ่านสามช่องทาง (ความมั่งคั่ง ดอกเบี้ย อัตราแลกเปลี่ยน)\nเหตุการณ์ (2) (3) (4) ภาษี อัตราดอกเบี้ยนโยบาย และความเชื่อมั่น ล้วนเปลี่ยนการใช้จ่าย ณ ทุกระดับราคา จึงเลื่อนเส้นทั้งเส้น","whys":["ถูกต้อง — แยกด้วยเกณฑ์ว่าตัวแปรนั้นอยู่บนแกนหรือไม่ ซึ่งเป็นเกณฑ์เดียวที่ใช้ได้กับทุกกรณี","ไม่ถูกต้อง — ต้องแยกให้ออกระหว่างดอกเบี้ยที่เปลี่ยนเพราะระดับราคาเปลี่ยน (กลไกภายใน) กับดอกเบี้ยนโยบายที่ธนาคารกลางไปปรับเอง (ปัจจัยภายนอกที่เลื่อนเส้น)","ไม่ถูกต้อง — ระดับราคาที่ลดลงทำให้ปริมาณความต้องการซื้อเพิ่มขึ้นจริง แต่เป็นการขยับตำแหน่งบนเส้นเดิม ไม่ใช่การเลื่อนเส้น","ไม่ถูกต้อง — สลับกันทั้งหมด ระดับราคาคือตัวแปรบนแกน ส่วนนโยบายและความเชื่อมั่นคือปัจจัยภายนอกที่เลื่อนเส้น"]},{"id":"D03","type":"mcq","lvl":4,"topic":"AD-AS","ref":"จำแนกรายการเข้าองค์ประกอบของ AD","q":"จงจำแนกสี่รายการนี้ — (1) ครัวเรือนซื้อบ้านที่สร้างเสร็จใหม่ (2) รัฐบาลจ่ายเบี้ยยังชีพผู้สูงอายุ (3) ร้านค้าสะสมสินค้าคงคลังที่ยังขายไม่ออก (4) ครัวเรือนซื้อโทรศัพท์นำเข้าจากต่างประเทศ","choices":["(1) เป็น I · (2) ไม่นับใน G เพราะเป็นเงินโอน · (3) เป็น I · (4) บวกใน C แล้วหักออกที่ NX ทำให้ผลสุทธิต่อ GDP เท่ากับศูนย์","(1) เป็น C · (2) เป็น G · (3) ไม่นับใน GDP เพราะยังขายไม่ออก · (4) บวกใน C โดยไม่ต้องหักที่ NX เพราะครัวเรือนเป็นผู้จ่ายเงินซื้อเองทั้งจำนวน","(1) เป็น I · (2) เป็น G เพราะเป็นรายจ่ายของรัฐบาล · (3) เป็น C เพราะสินค้าถูกผลิตขึ้นเพื่อการบริโภค · (4) บวกใน C และบวกที่ NX เพิ่มอีกทางหนึ่ง","(1) เป็น C · (2) ไม่นับใน G · (3) เป็น I · (4) ไม่นับใน GDP เลยเพราะเป็นสินค้าที่ผลิตในต่างประเทศจึงไม่เกี่ยวข้องกับการผลิตภายในประเทศ"],"answer":0,"a":"ทั้งสี่รายการคือหลุมพรางคลาสสิกของบทนี้\n(1) บ้านใหม่ — สไลด์ระบุข้อยกเว้นไว้ชัดว่าการซื้อที่อยู่อาศัยใหม่ของครัวเรือนนับเป็นการลงทุน (I) ไม่ใช่ C\n(2) เบี้ยยังชีพ — เป็นเงินโอน ซึ่งสไลด์ระบุว่า G ไม่รวมเงินโอน เพราะไม่ได้แลกกับสินค้าหรือบริการที่ผลิตในปีนั้น\n(3) สินค้าคงคลัง — การสะสมสินค้าคงคลังนับเป็นI เสมือนธุรกิจซื้อสินค้านั้นจากตัวเอง\n(4) สินค้านำเข้า — ถูกบวกใน C ตอนที่ครัวเรือนซื้อ แล้วถูกหักออกที่ NX ผลสุทธิต่อ GDP จึงเป็นศูนย์ เพราะไม่ใช่ผลผลิตในประเทศ","whys":["ถูกต้อง — ถูกครบทั้งสี่จุด รวมถึงการอธิบายว่าสินค้านำเข้าถูกบวกแล้วหักออกจนผลสุทธิเป็นศูนย์","ไม่ถูกต้อง — ผิดสามจุด บ้านใหม่เป็น I ไม่ใช่ C · เงินโอนไม่ใช่ G · และสินค้าคงคลังถูกนับใน GDP ในรูปของ I","ไม่ถูกต้อง — จุดแรกถูก แต่เงินโอนไม่ใช่ G สินค้าคงคลังเป็น I ไม่ใช่ C และสินค้านำเข้าต้องถูกหักที่ NX ไม่ใช่บวกเพิ่ม","ไม่ถูกต้อง — บ้านใหม่เป็น I ไม่ใช่ C และสินค้านำเข้าถูกนับใน C ก่อนแล้วจึงหักที่ NX ไม่ใช่ไม่นับเลยตั้งแต่ต้น"],"tip":"เขียนกำกับไว้ข้างสูตรทุกครั้ง: G ไม่รวมเงินโอน · บ้านใหม่ = I · สินค้าคงคลัง = I · นำเข้า = บวก C แล้วหัก NX"},{"id":"D04","type":"mcq","lvl":4,"topic":"AD-AS","ref":"สินค้าคงคลังที่ไม่ได้ตั้งใจสะสม","q":"ผู้ผลิตทั่วประเทศรายงานว่าสินค้าคงคลังเพิ่มขึ้นผิดปกติเพราะขายไม่ออก ไม่ใช่เพราะวางแผนสะสมไว้ล่วงหน้า ข้อใดตีความสัญญาณนี้ในกรอบ AD-AS ได้ถูกต้อง","choices":["เป็นสัญญาณว่าอุปสงค์รวมอ่อนแอกว่าที่ผู้ผลิตคาดไว้ ผู้ผลิตจะลดการผลิตในรอบถัดไป ทำให้ผลผลิตที่แท้จริงลดลงเข้าหาระดับที่ AD ตัดกับ SRAS จริง ๆ","เป็นสัญญาณว่าอุปสงค์รวมแข็งแกร่งขึ้น เพราะการสะสมสินค้าคงคลังถูกนับเป็นการลงทุน (I) ซึ่งเป็นองค์ประกอบหนึ่งของ AD ทำให้เส้น AD เลื่อนไปทางขวาทั้งเส้น","เป็นสัญญาณว่าเส้น SRAS เลื่อนลง เพราะสินค้าที่ล้นตลาดทำให้ผู้ผลิตต้องลดราคาขายลง ต้นทุนการผลิตต่อหน่วยจึงลดลงตามไปด้วยในรอบการผลิตถัดไป","ไม่เป็นสัญญาณอะไรเลยในกรอบ AD-AS เพราะสินค้าคงคลังเป็นเรื่องการบริหารจัดการภายในของธุรกิจแต่ละราย ไม่เกี่ยวกับตัวแปรมหภาคของทั้งระบบเศรษฐกิจ"],"answer":0,"a":"ต้องแยกการสะสมสินค้าคงคลังที่ตั้งใจ ออกจากที่ไม่ได้ตั้งใจ ให้ขาด ทั้งสองถูกนับเป็น I ในบัญชีรายได้ประชาชาติเหมือนกัน แต่ความหมายทางเศรษฐกิจตรงข้ามกัน\nเมื่อสินค้าคงคลังพอกขึ้นเพราะขายไม่ออก แปลว่าผู้ผลิตผลิตไว้มากกว่าที่ตลาดต้องการจริง นี่คือกลไกที่นำเศรษฐกิจกลับเข้าสู่ดุลยภาพ — ผู้ผลิตจะตัดกำลังการผลิตและการจ้างงานลงในรอบถัดไป ผลผลิตที่แท้จริงจึงหดตัวลงมาที่ระดับที่อุปสงค์รวมรองรับได้จริง เป็นสัญญาณเตือนล่วงหน้าของภาวะหดตัว","whys":["ถูกต้อง — จับได้ว่าสินค้าคงคลังที่ไม่ได้ตั้งใจเป็นสัญญาณอุปสงค์อ่อน และนำไปสู่การลดการผลิตในรอบถัดไป","ไม่ถูกต้อง — แม้จะถูกนับเป็น I ในทางบัญชี แต่การสะสมที่ไม่ได้ตั้งใจสะท้อนอุปสงค์ที่อ่อน ไม่ใช่แข็งแกร่งขึ้น","ไม่ถูกต้อง — การลดราคาระบายสินค้าไม่ได้ทำให้ต้นทุนการผลิตต่อหน่วยลดลง SRAS เลื่อนเมื่อต้นทุนเปลี่ยน ไม่ใช่เมื่อยอดขายเปลี่ยน","ไม่ถูกต้อง — สินค้าคงคลังรวมทั้งระบบเป็นตัวชี้วัดชั้นนำของวัฏจักรธุรกิจที่นักเศรษฐศาสตร์ติดตามอย่างใกล้ชิด"]},{"id":"D05","type":"mcq","lvl":3,"topic":"AD-AS","ref":"เงินโอนกับช่องทางที่ถูกต้อง","q":"รัฐบาลแจกเงินช่วยเหลือค่าครองชีพให้ครัวเรือนรายได้น้อยจำนวน 5 หมื่นล้านบาท โดยไม่ได้ซื้อสินค้าหรือบริการใดเพิ่มเลย ข้อใดวิเคราะห์ผลต่อ AD ได้ถูกต้องที่สุด","choices":["เส้น AD เลื่อนขวาผ่านการบริโภค (C) ที่เพิ่มขึ้นจากรายได้ที่ใช้จ่ายได้ของครัวเรือน และผลจะแรงกว่าปกติเพราะครัวเรือนรายได้น้อยมีความโน้มเอียงหน่วยเพิ่มในการบริโภคสูง","เส้น AD เลื่อนขวาผ่านรายจ่ายรัฐบาล (G) ที่เพิ่มขึ้นโดยตรง 5 หมื่นล้านบาท ตามนิยามขององค์ประกอบ G ในสมการ Y = C + I + G + NX ของระบบบัญชีรายได้ประชาชาติ ซึ่งนับเป็นรายจ่ายเพื่อการอุปโภคของภาครัฐเต็มจำนวน","เส้น AD ไม่เปลี่ยนแปลง เพราะเป็นเพียงการย้ายกำลังซื้อจากผู้เสียภาษีไปยังผู้รับเงิน ผลรวมต่อการใช้จ่ายของทั้งระบบเศรษฐกิจจึงหักล้างกันจนเป็นศูนย์พอดี","เส้น AD เลื่อนซ้าย เพราะรัฐบาลต้องกู้เงินมาแจก ทำให้อัตราดอกเบี้ยในตลาดสูงขึ้นและเบียดขับการลงทุนภาคเอกชนออกไปมากกว่าเงินที่แจกออกไปทั้งหมด ผลสุทธิต่ออุปสงค์มวลรวมจึงติดลบอย่างชัดเจน"],"answer":0,"a":"สไลด์ระบุชัดว่ารายจ่ายรัฐบาล (G) ไม่รวมเงินโอน เพราะเงินโอนไม่ได้แลกกับสินค้าหรือบริการที่ผลิตขึ้นในปีนั้น เงินก้อนนี้จึงไม่เพิ่ม G โดยตรง แต่เพิ่มรายได้ที่ใช้จ่ายได้ของครัวเรือนผู้รับ ซึ่งนำไปสู่ C ที่สูงขึ้น เส้น AD จึงเลื่อนขวาผ่านช่องทาง C\nยิ่งไปกว่านั้น การเจาะจงกลุ่มรายได้น้อยทำให้ผลกระตุ้นแรงกว่าการแจกแบบทั่วไป เพราะครัวเรือนกลุ่มนี้มีความโน้มเอียงหน่วยเพิ่มในการบริโภค (MPC) สูงกว่า คือได้เงินมาแล้วใช้จ่ายออกไปเกือบทั้งหมดแทนที่จะเก็บออม","whys":["ถูกต้อง — ระบุทั้งทิศทาง ช่องทางที่ถูกต้อง และเหตุผลว่าทำไมการเจาะจงกลุ่มรายได้น้อยจึงให้ผลแรงกว่า","ไม่ถูกต้อง — นี่คือหลุมพรางหลักของข้อนี้ เงินโอนถูกกันออกจาก G ตามนิยามในระบบบัญชีรายได้ประชาชาติอย่างชัดเจน","ไม่ถูกต้อง — ผลสุทธิไม่เป็นศูนย์ เพราะผู้รับเงินโอนมี MPC สูงกว่าผู้เสียภาษีโดยเฉลี่ย การใช้จ่ายรวมของระบบจึงเพิ่มขึ้นจริง","ไม่ถูกต้อง — การเบียดขับเกิดขึ้นได้บางส่วน แต่โดยทั่วไปไม่สมบูรณ์ จึงไม่มากพอจะพลิกทิศทางของ AD ให้เลื่อนไปทางซ้าย"]},{"id":"D06","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ผลของตัวคูณต่อขนาดการเลื่อนของ AD","q":"รัฐบาลเพิ่มรายจ่ายซื้อสินค้าและบริการ 100,000 ล้านบาท โดยความโน้มเอียงหน่วยเพิ่มในการบริโภคของระบบเท่ากับ 0.75 และไม่คำนึงถึงการเบียดขับ ข้อใดอธิบายขนาดการเลื่อนของเส้น AD ได้ถูกต้อง","choices":["เส้น AD เลื่อนขวามากกว่า 100,000 ล้านบาท เพราะรายจ่ายรอบแรกกลายเป็นรายได้ของผู้อื่นซึ่งถูกนำไปใช้จ่ายต่ออีกทอด ตัวคูณเท่ากับ 1 ÷ (1 − 0.75) = 4 จึงได้ราว 400,000 ล้านบาท","เส้น AD เลื่อนขวาเท่ากับ 100,000 ล้านบาทพอดี เพราะรายจ่ายรัฐบาลเป็นองค์ประกอบโดยตรงของ AD จึงส่งผลต่อ AD หนึ่งต่อหนึ่งตามจำนวนเงินที่รัฐบาลใช้จ่ายออกไป","เส้น AD เลื่อนขวาน้อยกว่า 100,000 ล้านบาท เพราะครัวเรือนเก็บออมส่วนหนึ่งของรายได้ที่เพิ่มขึ้นไว้ 25% ทำให้ผลกระตุ้นสุทธิเหลือเพียง 75,000 ล้านบาทเท่านั้น ส่วนที่เหลือจะไม่ถูกส่งต่อไปยังรอบการใช้จ่ายถัดไปอีกเลย","เส้น AD เลื่อนขวา 75,000 ล้านบาท เพราะต้องนำความโน้มเอียงหน่วยเพิ่มในการบริโภค 0.75 มาคูณกับรายจ่ายรัฐบาลโดยตรงเพื่อหาผลกระทบสุทธิต่ออุปสงค์มวลรวม ตัวคูณจึงไม่เข้ามาเกี่ยวข้องในการคำนวณนี้เลย"],"answer":0,"a":"รายจ่ายของรัฐบาลไม่ได้หยุดอยู่ที่รอบแรก — เงินที่จ่ายออกไปกลายเป็นรายได้ของผู้รับ ซึ่งจะนำไปใช้จ่ายต่ออีก 75% และเงินก้อนนั้นก็กลายเป็นรายได้ของคนถัดไป วนเป็นทอด ๆ\nผลรวมของทุกทอดคือ 100,000 × (1 + 0.75 + 0.75² + 0.75³ + …) = 100,000 × 1 ÷ (1 − 0.75) = 100,000 × 4 = 400,000 ล้านบาท\nสังเกตว่าตัวคูณรายจ่ายนี้มีโครงสร้างเดียวกับตัวคูณทางการเงิน 1 ÷ R คือเป็นผลรวมอนุกรมเรขาคณิต ในโลกจริงตัวคูณจะเล็กกว่านี้เพราะมีการรั่วไหลจากภาษีและการนำเข้า และมีการเบียดขับการลงทุนเอกชน","whys":["ถูกต้อง — ใช้สูตรตัวคูณรายจ่าย 1 ÷ (1 − MPC) และอธิบายกลไกการใช้จ่ายต่อเป็นทอด ๆ ได้ครบถ้วน","ไม่ถูกต้อง — มองเห็นเฉพาะรอบแรก แต่ละเลยว่าเงินก้อนนั้นกลายเป็นรายได้ที่ถูกนำไปใช้จ่ายต่ออีกหลายทอดในระบบ","ไม่ถูกต้อง — การออมทำให้ตัวคูณเล็กลงกว่ากรณี MPC สูง แต่ตัวคูณยังมากกว่า 1 เสมอ ผลรวมจึงไม่มีทางน้อยกว่ารายจ่ายตั้งต้น","ไม่ถูกต้อง — MPC ต้องเข้าไปอยู่ในสูตร 1 ÷ (1 − MPC) ไม่ใช่นำมาคูณกับรายจ่ายโดยตรง ซึ่งจะให้ผลกลับทิศทางที่ควรจะเป็น"],"tip":"ตัวคูณรายจ่าย = 1 ÷ (1 − MPC) · MPC ยิ่งสูง ตัวคูณยิ่งใหญ่ · และมันคือญาติของตัวคูณทางการเงิน 1 ÷ R"},{"id":"D07","type":"mcq","lvl":4,"topic":"AD-AS","ref":"การเบียดขับการลงทุนภาคเอกชน","q":"รัฐบาลกู้เงินจำนวนมากในตลาดเงินในประเทศเพื่อนำมาใช้จ่ายกระตุ้นเศรษฐกิจ ข้อใดอธิบายปรากฏการณ์การเบียดขับ (crowding out) และผลสุทธิต่อ AD ได้ถูกต้อง","choices":["การกู้ของรัฐดันอัตราดอกเบี้ยในตลาดให้สูงขึ้น การลงทุนภาคเอกชนจึงลดลงบางส่วน ผลสุทธิคือ AD ยังเลื่อนขวาแต่น้อยกว่าที่ตัวคูณล้วน ๆ จะให้ผล","การกู้ของรัฐดันอัตราดอกเบี้ยในตลาดให้สูงขึ้นจนการลงทุนภาคเอกชนลดลงเท่ากับรายจ่ายที่รัฐเพิ่มพอดี ผลสุทธิต่อ AD จึงเป็นศูนย์ในทุกสถานการณ์ทางเศรษฐกิจเสมอ","การกู้ของรัฐทำให้ปริมาณเงินในระบบเพิ่มขึ้น อัตราดอกเบี้ยจึงลดลง การลงทุนภาคเอกชนเพิ่มขึ้นตาม ผลสุทธิคือ AD เลื่อนขวามากกว่าที่ตัวคูณจะให้ผลเสียอีก","การกู้ของรัฐไม่กระทบอัตราดอกเบี้ยเลย เพราะธนาคารกลางเป็นผู้กำหนดอัตราดอกเบี้ยนโยบายโดยตรง ผลสุทธิต่อ AD จึงเท่ากับรายจ่ายที่เพิ่มคูณด้วยตัวคูณพอดี"],"answer":0,"a":"เมื่อรัฐบาลเข้ามากู้ในตลาดเงินในประเทศ ความต้องการเงินทุนโดยรวมสูงขึ้น ดันอัตราดอกเบี้ยให้ปรับตัวขึ้น ธุรกิจเอกชนบางรายที่เคยจะลงทุนจึงพบว่าต้นทุนเงินทุนแพงเกินไปและชะลอโครงการออกไป การลงทุน (I) ที่ลดลงนี้หักล้างบางส่วนกับ G ที่เพิ่มขึ้น\nประเด็นสำคัญคือ การเบียดขับโดยทั่วไปไม่สมบูรณ์ ผลสุทธิจึงยังเป็นการเลื่อน AD ไปทางขวา เพียงแต่น้อยกว่าที่คำนวณจากตัวคูณล้วน ๆ ขนาดของการเบียดขับจะมากเป็นพิเศษเมื่อเศรษฐกิจใกล้เต็มศักยภาพ และจะน้อยมากเมื่อเศรษฐกิจมีทรัพยากรว่างอยู่มากในภาวะถดถอยลึก","whys":["ถูกต้อง — ระบุกลไกผ่านอัตราดอกเบี้ยและสรุปว่าการหักล้างเกิดขึ้นเพียงบางส่วน ผลสุทธิจึงยังเป็นบวก","ไม่ถูกต้อง — การเบียดขับสมบูรณ์เป็นกรณีสุดขั้วที่ต้องอาศัยสมมติฐานเข้มงวดมาก ไม่ใช่ผลลัพธ์ทั่วไปและไม่ได้เกิดในทุกสถานการณ์","ไม่ถูกต้อง — การที่รัฐบาลกู้เงินเป็นการดึงเงินออมจากตลาด ไม่ได้เพิ่มปริมาณเงิน อัตราดอกเบี้ยจึงสูงขึ้นไม่ใช่ลดลง","ไม่ถูกต้อง — ธนาคารกลางกำหนดอัตราดอกเบี้ยระยะสั้นได้ก็จริง แต่อัตราดอกเบี้ยระยะยาวและต้นทุนการกู้ของภาคเอกชนยังตอบสนองต่ออุปทานพันธบัตรรัฐบาล"]},{"id":"D08","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ผลของอัตราดอกเบี้ยนโยบายต่อสามองค์ประกอบ","q":"ธนาคารกลางปรับขึ้นอัตราดอกเบี้ยนโยบายอย่างมีนัยสำคัญ ข้อใดอธิบายผลต่อองค์ประกอบของ AD ได้ครบถ้วนที่สุด","choices":["การลงทุนลดลงจากต้นทุนเงินทุนที่แพงขึ้น การบริโภคสินค้าคงทนที่ใช้สินเชื่อลดลง และเงินทุนไหลเข้าทำให้ค่าเงินแข็งจนการส่งออกสุทธิลดลง เส้น AD จึงเลื่อนซ้าย","การลงทุนลดลงจากต้นทุนเงินทุนที่แพงขึ้นเพียงช่องทางเดียว ส่วนการบริโภคและการส่งออกสุทธิไม่ได้รับผลกระทบ เพราะอัตราดอกเบี้ยเกี่ยวข้องกับการตัดสินใจของภาคธุรกิจเท่านั้น","การออมเพิ่มขึ้นทำให้ธนาคารมีเงินปล่อยกู้มากขึ้น การลงทุนจึงเพิ่มตามในที่สุด และค่าเงินที่แข็งขึ้นทำให้สินค้านำเข้าถูกลงจนการบริโภคเพิ่มขึ้น เส้น AD เลื่อนขวา","เส้น AD ไม่เลื่อน แต่เกิดการเคลื่อนที่ไปตามเส้นเดิม เพราะอัตราดอกเบี้ยเป็นหนึ่งในกลไกที่อธิบายความชันของเส้นอุปสงค์มวลรวมอยู่แล้วตั้งแต่ต้น"],"answer":0,"a":"อัตราดอกเบี้ยนโยบายที่สูงขึ้นส่งผ่านไปยัง AD ถึงสามช่องทางพร้อมกัน\nช่องทาง I — ต้นทุนเงินทุนแพงขึ้น โครงการลงทุนที่เคยคุ้มกลายเป็นไม่คุ้ม การลงทุนลดลง\nช่องทาง C — สินเชื่อบ้านและรถแพงขึ้น การบริโภคสินค้าคงทนลดลง อีกทั้งผลตอบแทนจากการออมสูงขึ้นจึงจูงใจให้เลื่อนการใช้จ่ายออกไป\nช่องทาง NX — ดอกเบี้ยที่สูงดึงเงินทุนไหลเข้า ความต้องการเงินสกุลในประเทศเพิ่ม ค่าเงินแข็งขึ้น สินค้าของเราแพงในสายตาต่างชาติ NX ลดลง\nทั้งสามช่องทางไปทางเดียวกันหมด เส้น AD จึงเลื่อนซ้ายอย่างชัดเจน — นี่คือเหตุผลที่นโยบายการเงินแบบเข้มงวดมีพลังมากกว่าที่หลายคนคาด","whys":["ถูกต้อง — ครบทั้งสามช่องทาง I, C และ NX ซึ่งล้วนดัน AD ไปทางเดียวกันคือทางซ้าย","ไม่ถูกต้อง — ครัวเรือนที่ซื้อบ้านและรถด้วยสินเชื่อได้รับผลกระทบโดยตรง และช่องทางค่าเงินก็กระทบการส่งออกสุทธิอย่างชัดเจน","ไม่ถูกต้อง — สลับทิศทางทั้งหมด ดอกเบี้ยที่สูงขึ้นทำให้ต้นทุนการกู้แพงขึ้น การลงทุนจึงลดลง ไม่ใช่เพิ่มขึ้น","ไม่ถูกต้อง — ต้องแยกให้ออกระหว่างดอกเบี้ยที่เปลี่ยนเพราะระดับราคาเปลี่ยน กับดอกเบี้ยนโยบายที่ธนาคารกลางไปปรับเอง ซึ่งเป็นปัจจัยภายนอกที่เลื่อนเส้น"]},{"id":"D09","type":"mcq","lvl":4,"topic":"AD-AS","ref":"อ่านกราฟการเลื่อนของ AD ในกรอบ SRAS แนวนอน","q":"จากแผนภาพ เศรษฐกิจเริ่มที่ดุลยภาพระยะยาว ณ จุด A แล้วเส้น AD เลื่อนจาก AD₁ ไป AD₂ ข้อใดอธิบายจุด B และสถานะของเศรษฐกิจได้ถูกต้อง","choices":["ผลผลิตที่แท้จริงเพิ่มขึ้นเหนือ Y_FE โดยระดับราคายังคงที่ เศรษฐกิจอยู่ในช่องว่างเงินเฟ้อและกำลังขยายตัวเกินระดับที่ยั่งยืน อัตราการว่างงานจึงต่ำกว่าอัตราธรรมชาติ","ผลผลิตที่แท้จริงเพิ่มขึ้นเหนือ Y_FE พร้อมกับระดับราคาที่สูงขึ้นทันที เศรษฐกิจอยู่ในช่องว่างเงินเฟ้อ และค่าจ้างได้ปรับตัวขึ้นเต็มที่เรียบร้อยแล้วตั้งแต่ระยะสั้น","ระดับราคาสูงขึ้นโดยผลผลิตที่แท้จริงคงเดิมที่ Y_FE เพราะเส้น LRAS เป็นเส้นแนวตั้งซึ่งบังคับไม่ให้ผลผลิตเบี่ยงเบนออกจากระดับการจ้างงานเต็มที่ได้เลย","ผลผลิตที่แท้จริงเพิ่มขึ้นเหนือ Y_FE โดยระดับราคาคงที่ เศรษฐกิจอยู่ในช่องว่างการหดตัว และกลไกปรับตัวเองจะทำให้เส้น SRAS เลื่อนลงจนกลับสู่ดุลยภาพเดิม"],"answer":0,"a":"อ่านกราฟตามลำดับสามขั้น\nขั้นที่ 1 — SRAS เป็นเส้นแนวนอนตามกรอบของสไลด์ ดังนั้นเมื่อ AD เลื่อนขวา จุดตัดใหม่จะเลื่อนไปตามเส้นแนวนอนนั้น ผลคือ Y เพิ่มขึ้นโดย P ไม่เปลี่ยน\nขั้นที่ 2 — เทียบตำแหน่งจุด B กับเส้น LRAS จุด B อยู่ทางขวาของ Y_FE จึงเป็นช่องว่างเงินเฟ้อ\nขั้นที่ 3 — แปลเป็นภาษาตลาดแรงงาน ผลผลิตเกินศักยภาพหมายถึงโรงงานเดินเครื่องเกินกำลังปกติและแรงงานทำล่วงเวลา อัตราการว่างงานจริงจึงต่ำกว่าอัตราธรรมชาติ\nในระยะยาว ตลาดแรงงานที่ตึงตัวจะดันค่าจ้างขึ้น SRAS เลื่อนขึ้น และผลผลิตถอยกลับมาที่ Y_FE โดยระดับราคาสูงกว่าเดิม","whys":["ถูกต้อง — อ่านกราฟตามเส้น SRAS แนวนอนได้ถูก ระบุชนิดของช่องว่างถูก และแปลเป็นภาษาตลาดแรงงานได้ถูกต้อง","ไม่ถูกต้อง — ในกรอบ SRAS แนวนอน ระดับราคาระยะสั้นยังไม่ขยับ การปรับขึ้นของค่าจ้างเป็นกระบวนการของระยะยาวซึ่งยังไม่เกิดขึ้น ณ จุด B","ไม่ถูกต้อง — LRAS กำหนดผลผลิตในระยะยาว ไม่ได้บังคับผลผลิตระยะสั้น เศรษฐกิจออกนอกเส้น LRAS ได้ในระยะสั้นเสมอ","ไม่ถูกต้อง — จุด B อยู่ทางขวาของ LRAS จึงเป็นช่องว่างเงินเฟ้อ และกลไกปรับตัวจะดัน SRAS ขึ้น ไม่ใช่ลง"],"tip":"อ่านกราฟให้ครบสามขั้นเสมอ: P กับ Y ขยับอย่างไร → อยู่ซ้ายหรือขวาของ LRAS → แปลเป็นภาษาการว่างงาน","fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n  <defs>\n    <clipPath id=\"clipG\"><rect x=\"62\" y=\"26\" width=\"466\" height=\"318\"/></clipPath>\n    <marker id=\"arwG\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\ ze=\"14\" font-weight=\"700\" fill=\"var(--curve-lras)\" text-anchor=\"middle\">LRAS</text><text x=\"325.28999999999996\" y=\"366\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"middle\">Y<tspan dy=\"4\" font-size=\"11\">FE</tspan></text><text x=\"53\" y=\"205.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₁</text></svg><div class=\"figcap\">AD เลื่อนขวาในกรอบ SRAS แนวนอน — เปรียบเทียบตำแหน่งของจุด B กับเส้น LRAS</div></div>"},{"id":"D10","type":"mcq","lvl":4,"topic":"AD-AS","ref":"สองช็อกที่ผลักคนละทิศ","q":"ในปีเดียวกัน รัฐบาลเพิ่มรายจ่ายลงทุนโครงสร้างพื้นฐานอย่างมาก ขณะที่ประเทศคู่ค้าหลักทั้งหมดเข้าสู่ภาวะถดถอยพร้อมกันจนคำสั่งซื้อสินค้าส่งออกหดตัวรุนแรง ผลสุทธิต่อเส้น AD เป็นอย่างไร","choices":["ทิศทางสุทธิของ AD สรุปไม่ได้จากข้อมูลที่ให้มา เพราะ G ที่เพิ่มดัน AD ไปทางขวาขณะที่ NX ที่หดดัน AD ไปทางซ้าย ผลลัพธ์ขึ้นกับขนาดสัมพัทธ์ของสองแรงนี้","เส้น AD เลื่อนไปทางขวาแน่นอน เพราะรายจ่ายของรัฐบาลเป็นองค์ประกอบที่มีตัวคูณสูงที่สุดในสมการอุปสงค์มวลรวม จึงมีอิทธิพลเหนือกว่าการส่งออกสุทธิเสมอ","เส้น AD เลื่อนไปทางซ้ายแน่นอน เพราะช็อกจากภายนอกประเทศมีขนาดใหญ่และควบคุมไม่ได้ จึงมีอิทธิพลเหนือกว่านโยบายการคลังภายในประเทศในทุกกรณีที่เกิดขึ้นพร้อมกัน","เส้น AD ไม่เปลี่ยนแปลง เพราะสองแรงที่ผลักคนละทิศทางจะหักล้างกันจนหมดพอดีเสมอตามหลักดุลยภาพทั่วไปของระบบเศรษฐกิจแบบเปิด"],"answer":0,"a":"เมื่อมีช็อกสองตัวผลักตัวแปรเดียวกันไปคนละทิศ คำตอบที่ถูกต้องทางวิชาการคือ “สรุปทิศทางไม่ได้ ขึ้นกับขนาดสัมพัทธ์”\nแรงที่หนึ่ง — G เพิ่มขึ้น ดัน AD ไปทางขวา และยังมีผลผ่านตัวคูณอีกทอด\nแรงที่สอง — คู่ค้าถดถอยพร้อมกัน การส่งออกหดตัว NX ลดลง ดัน AD ไปทางซ้าย\nไม่มีหลักการใดในแบบจำลองที่รับประกันว่าฝ่ายใดจะชนะ การจะสรุปได้ต้องรู้ขนาดของทั้งสองแรง สัดส่วนการส่งออกต่อ GDP และขนาดตัวคูณ ในข้อเขียนควรวาดกราฟแสดงทั้งสองกรณีเพื่อให้ได้คะแนนเต็ม","whys":["ถูกต้อง — ยอมรับความไม่แน่นอนอย่างมีหลักการ และระบุว่าอะไรคือสิ่งที่ต้องรู้เพิ่มจึงจะสรุปได้","ไม่ถูกต้อง — ไม่มีกฎว่ารายจ่ายรัฐบาลมีอิทธิพลเหนือกว่าเสมอ ในประเทศที่พึ่งพาการส่งออกสูง ช็อกจาก NX อาจใหญ่กว่ามาก","ไม่ถูกต้อง — ช็อกภายนอกไม่ได้ใหญ่กว่านโยบายในประเทศเสมอไป ขนาดของทั้งสองขึ้นกับบริบทของแต่ละเศรษฐกิจ","ไม่ถูกต้อง — การหักล้างกันพอดีเป๊ะเป็นความบังเอิญที่เกิดได้ยากมาก ไม่ใช่หลักการทั่วไปของแบบจำลองใด"],"tip":"เจอช็อกสองตัวผลักคนละทาง ให้ตอบ “ไม่แน่นอน ขึ้นกับขนาดสัมพัทธ์” พร้อมวาดกราฟสองกรณี — นี่คือคำตอบที่ได้คะแนนเต็ม ไม่ใช่การเดาข้างใดข้างหนึ่ง"},{"id":"D11","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ความมั่งคั่งจากราคาสินทรัพย์","q":"ราคาอสังหาริมทรัพย์ทั่วประเทศปรับตัวสูงขึ้นอย่างต่อเนื่องหลายปี ทำให้ครัวเรือนที่เป็นเจ้าของบ้านรู้สึกว่าตนเองมั่งคั่งขึ้นมาก ข้อใดอธิบายผลต่อ AD ได้ถูกต้อง","choices":["เส้น AD เลื่อนขวาผ่านการบริโภคที่เพิ่มขึ้นตามความมั่งคั่งที่รับรู้ และอาจแรงขึ้นอีกเมื่อครัวเรือนใช้บ้านเป็นหลักประกันในการกู้เพื่อการใช้จ่าย","เส้น AD เลื่อนซ้าย เพราะราคาบ้านที่สูงขึ้นทำให้ครัวเรือนรุ่นใหม่ต้องเก็บออมมากขึ้นเพื่อซื้อบ้าน การบริโภคโดยรวมของระบบเศรษฐกิจจึงลดลงอย่างมีนัยสำคัญ","เกิดการเคลื่อนที่ไปตามเส้น AD เดิม เพราะราคาอสังหาริมทรัพย์เป็นส่วนหนึ่งของระดับราคาโดยรวมซึ่งเป็นตัวแปรที่อยู่บนแกนตั้งของกราฟ AD-AS อยู่แล้ว","เส้น LRAS เลื่อนขวา เพราะมูลค่าสินทรัพย์ที่สูงขึ้นหมายถึงประเทศมีทุนมากขึ้น ซึ่งเป็นหนึ่งในปัจจัยการผลิตที่กำหนดผลผลิต ณ ระดับการจ้างงานเต็มที่ของประเทศ"],"answer":0,"a":"ความมั่งคั่งเป็นหนึ่งในตัวกำหนดการบริโภคที่สไลด์ระบุไว้ เมื่อมูลค่าสินทรัพย์ในมือครัวเรือนสูงขึ้น ครัวเรือนรู้สึกว่าตนมีฐานะดีขึ้นและใช้จ่ายมากขึ้น ณ ทุกระดับราคา เส้น AD จึงเลื่อนขวาทั้งเส้น\nในโลกจริงยังมีช่องทางเสริมอีกทางหนึ่งคือ ครัวเรือนสามารถนำบ้านที่มูลค่าสูงขึ้นไปเป็นหลักประกันกู้เงินมาใช้จ่าย ทำให้ผลกระตุ้นแรงกว่าผลทางจิตวิทยาเพียงอย่างเดียว ข้อควรระวังคืออย่าสับสนราคาสินทรัพย์ กับระดับราคาสินค้าและบริการ ซึ่งเป็นคนละตัวแปร","whys":["ถูกต้อง — ระบุช่องทาง wealth effect ผ่าน C และเพิ่มช่องทางการกู้โดยใช้สินทรัพย์เป็นหลักประกันได้ตรงประเด็น","ไม่ถูกต้อง — ผลด้านการออมของผู้ที่ยังไม่มีบ้านมีอยู่จริง แต่เล็กกว่าผลด้านความมั่งคั่งของเจ้าของบ้านซึ่งเป็นกลุ่มใหญ่กว่ามาก","ไม่ถูกต้อง — ราคาสินทรัพย์ไม่ใช่ระดับราคาสินค้าและบริการที่อยู่บนแกนตั้ง จึงเป็นปัจจัยภายนอกที่ทำให้เส้นเลื่อน","ไม่ถูกต้อง — มูลค่าที่ประเมินสูงขึ้นไม่ได้แปลว่ามีบ้านหรือเครื่องจักรเพิ่มขึ้นจริง ทุนทางกายภาพของประเทศเท่าเดิม LRAS จึงไม่ขยับ"]},{"id":"D12","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ความคาดหวังต่ออนาคตกับการลงทุน","q":"ผลสำรวจพบว่าผู้บริหารธุรกิจส่วนใหญ่คาดว่ากำไรในอีกสองปีข้างหน้าจะลดลงมาก จากความไม่แน่นอนทางการเมือง แม้ว่าอัตราดอกเบี้ยและยอดขายในปัจจุบันจะยังปกติดี ข้อใดอธิบายผลต่อ AD ได้ถูกต้อง","choices":["เส้น AD เลื่อนซ้ายผ่านการลงทุนที่ลดลง เพราะการตัดสินใจลงทุนขึ้นกับผลตอบแทนที่คาดว่าจะได้รับในอนาคต ไม่ได้ขึ้นกับยอดขายในปัจจุบันเพียงอย่างเดียว","เส้น AD ไม่เปลี่ยนแปลง เพราะอัตราดอกเบี้ยและยอดขายปัจจุบันยังปกติดี ซึ่งเป็นสองตัวแปรหลักที่กำหนดการลงทุนของภาคธุรกิจตามแบบจำลองอุปสงค์มวลรวม","เส้น SRAS เลื่อนขึ้น เพราะความไม่แน่นอนทางการเมืองเป็นต้นทุนแฝงของการดำเนินธุรกิจ ซึ่งผู้ผลิตจะผลักภาระไปยังราคาสินค้าที่ขายให้ผู้บริโภคในที่สุด","เส้น AD เลื่อนขวา เพราะธุรกิจจะเร่งลงทุนให้เสร็จก่อนที่สถานการณ์จะแย่ลง เพื่อชิงความได้เปรียบเหนือคู่แข่งในช่วงที่ต้นทุนเงินทุนยังอยู่ในระดับต่ำอยู่"],"answer":0,"a":"การลงทุนเป็นองค์ประกอบของ AD ที่ผันผวนที่สุด เพราะมันขึ้นอยู่กับความคาดหวังต่ออนาคตเป็นหลัก ไม่ใช่สภาพปัจจุบัน ธุรกิจตัดสินใจสร้างโรงงานวันนี้โดยมองกระแสรายได้อีกสิบปีข้างหน้า เมื่อความคาดหวังต่อกำไรในอนาคตพังลง โครงการที่เคยดูคุ้มก็กลายเป็นไม่คุ้มทันที แม้ดอกเบี้ยจะยังต่ำและยอดขายวันนี้จะยังดีอยู่\nผลคือ I ลดลงที่ทุกระดับราคา เส้น AD เลื่อนซ้าย และเนื่องจากการลงทุนมีตัวคูณ ผลกระทบจะขยายต่อไปยังการจ้างงานและการบริโภคอีกทอด","whys":["ถูกต้อง — จับได้ว่าการลงทุนถูกขับเคลื่อนด้วยความคาดหวังต่ออนาคต ไม่ใช่เพียงตัวแปรในปัจจุบัน","ไม่ถูกต้อง — ความคาดหวังต่อกำไรในอนาคตเป็นตัวกำหนดการลงทุนที่สำคัญที่สุด การมองเพียงดอกเบี้ยและยอดขายวันนี้จึงไม่ครบ","ไม่ถูกต้อง — ความไม่แน่นอนกระทบการตัดสินใจลงทุนซึ่งอยู่ฝั่งอุปสงค์ ไม่ได้เพิ่มต้นทุนการผลิตต่อหน่วยที่กำหนดตำแหน่งของ SRAS","ไม่ถูกต้อง — ความไม่แน่นอนโดยทั่วไปทำให้ธุรกิจเลื่อนการลงทุนออกไปเพื่อรอดูสถานการณ์ ไม่ใช่เร่งลงทุนให้เร็วขึ้น"]},{"id":"D13","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ภาษีนิติบุคคลกับการลงทุน","q":"รัฐบาลปรับขึ้นอัตราภาษีเงินได้นิติบุคคลจาก 20% เป็น 27% โดยไม่ได้เปลี่ยนแปลงรายจ่ายภาครัฐเลย ข้อใดอธิบายผลต่อ AD ได้ถูกต้องที่สุด","choices":["เส้น AD เลื่อนซ้ายผ่านการลงทุนที่ลดลง เพราะผลตอบแทนหลังภาษีของโครงการลงทุนต่ำลง โครงการที่เคยผ่านเกณฑ์ความคุ้มค่าบางส่วนจึงถูกยกเลิกหรือเลื่อนออกไป","เส้น AD เลื่อนขวาผ่านรายจ่ายรัฐบาลที่เพิ่มขึ้น เพราะรายได้ภาษีที่รัฐเก็บได้มากขึ้นจะถูกนำไปใช้จ่ายในระบบเศรษฐกิจโดยอัตโนมัติตามกลไกงบประมาณประจำปี","เส้น AD ไม่เปลี่ยนแปลง เพราะภาษีเป็นเพียงการย้ายเงินจากภาคธุรกิจไปยังภาครัฐ ซึ่งเป็นการโอนภายในระบบเศรษฐกิจเดียวกันจึงไม่กระทบอุปสงค์รวมสุทธิเลย","เส้น LRAS เลื่อนซ้ายทันทีในระยะสั้น เพราะภาษีที่สูงขึ้นลดแรงจูงใจในการสะสมทุน ทำให้ผลผลิต ณ ระดับการจ้างงานเต็มที่ของประเทศลดลงไปด้วยในปีเดียวกันนั้น"],"answer":0,"a":"ภาษีนิติบุคคลกระทบ AD ผ่านช่องทางการลงทุน (I) โดยตรง ธุรกิจตัดสินใจลงทุนจากผลตอบแทนหลังภาษี เมื่ออัตราภาษีสูงขึ้น 7 จุด กระแสเงินสดสุทธิที่คาดว่าจะได้รับจากทุกโครงการลดลง โครงการที่เคยผ่านเกณฑ์อย่างเฉียดฉิวจึงกลายเป็นไม่คุ้มและถูกตัดออก การลงทุนรวมจึงลดลงและ AD เลื่อนซ้าย\nข้อสังเกตเพิ่มเติม — ในระยะยาวมาก การลงทุนที่ลดลงต่อเนื่องอาจทำให้การสะสมทุนช้าลงจนกระทบ LRAS ได้ แต่นั่นเป็นกระบวนการหลายปี ไม่ใช่ผลในระยะสั้นของปีที่ประกาศนโยบาย","whys":["ถูกต้อง — ระบุช่องทาง I และกลไกผลตอบแทนหลังภาษีที่ทำให้โครงการชายขอบถูกตัดออกได้อย่างแม่นยำ","ไม่ถูกต้อง — โจทย์ระบุชัดว่ารายจ่ายภาครัฐไม่เปลี่ยนแปลง จึงไม่มีการเพิ่ม G มาชดเชย ผลสุทธิจึงเป็นการหดตัวของ AD","ไม่ถูกต้อง — ภาษีเปลี่ยนแรงจูงใจในการลงทุน ไม่ใช่แค่ย้ายเงิน พฤติกรรมการใช้จ่ายของภาคเอกชนจึงเปลี่ยนไปจริง","ไม่ถูกต้อง — ผลต่อการสะสมทุนและ LRAS เป็นกระบวนการสะสมหลายปี ไม่ได้เกิดขึ้นทันทีในระยะสั้นตามที่ข้อความระบุ"]},{"id":"D14","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ค่าเงินอ่อนกับการส่งออกสุทธิ","q":"ค่าเงินของประเทศหนึ่งอ่อนค่าลงอย่างต่อเนื่องเมื่อเทียบกับเงินสกุลของประเทศคู่ค้าหลัก โดยปัจจัยอื่นคงที่ ข้อใดอธิบายผลต่อ AD ได้ถูกต้อง","choices":["เส้น AD เลื่อนขวาผ่านการส่งออกสุทธิที่เพิ่มขึ้น เพราะสินค้าของประเทศถูกลงในสายตาต่างชาติทำให้ส่งออกได้มากขึ้น ขณะที่สินค้านำเข้าแพงขึ้นทำให้นำเข้าน้อยลง","เส้น AD เลื่อนซ้ายผ่านการบริโภคที่ลดลง เพราะสินค้านำเข้าที่แพงขึ้นทำให้ครัวเรือนมีอำนาจซื้อลดลงโดยรวม และต้องตัดทอนการใช้จ่ายในหมวดอื่นลงตามไปด้วย","เส้น SRAS เลื่อนลง เพราะค่าเงินที่อ่อนทำให้ผู้ส่งออกมีรายได้เป็นเงินในประเทศมากขึ้น จึงสามารถลดราคาขายในประเทศลงและผลิตสินค้าออกมาได้มากขึ้นกว่าเดิม","เส้น AD ไม่เปลี่ยนแปลง เพราะการส่งออกที่เพิ่มขึ้นจะถูกหักล้างด้วยการนำเข้าที่แพงขึ้นในมูลค่าที่เท่ากันพอดีเสมอตามหลักดุลการชำระเงินของเศรษฐกิจแบบเปิด"],"answer":0,"a":"ค่าเงินที่อ่อนลงทำงานกับ NX สองทางที่เสริมกัน\nด้านส่งออก — ต่างชาติใช้เงินสกุลของตนน้อยลงในการซื้อสินค้าของเรา สินค้าเราจึงถูกลงโดยเปรียบเทียบ ปริมาณส่งออกเพิ่มขึ้น\nด้านนำเข้า — เราต้องใช้เงินในประเทศมากขึ้นเพื่อซื้อของจากต่างประเทศ สินค้านำเข้าจึงแพงขึ้น ปริมาณนำเข้าลดลง\nทั้งสองด้านดัน NX = X − M ขึ้นในทิศทางเดียวกัน เส้น AD จึงเลื่อนขวา\nข้อควรระวัง — ค่าเงินที่อ่อนยังเพิ่มต้นทุนวัตถุดิบและพลังงานนำเข้า ซึ่งดัน SRAS ขึ้นด้วย จึงเป็นเหตุการณ์ที่กระทบทั้งสองฝั่งในทิศทางที่กดดันราคาให้สูงขึ้น","whys":["ถูกต้อง — ครอบคลุมทั้งด้านส่งออกและด้านนำเข้าซึ่งดัน NX ไปทางเดียวกัน ทำให้สรุปทิศทางของ AD ได้แน่นอน","ไม่ถูกต้อง — ผลด้านอำนาจซื้อมีอยู่จริง แต่ช่องทางหลักและตรงที่สุดของค่าเงินคือการส่งออกสุทธิ ซึ่งให้ผลบวกต่อ AD","ไม่ถูกต้อง — ค่าเงินที่อ่อนทำให้วัตถุดิบและพลังงานนำเข้าแพงขึ้น ต้นทุนการผลิตจึงสูงขึ้น SRAS มีแนวโน้มเลื่อนขึ้นไม่ใช่ลง","ไม่ถูกต้อง — ไม่มีหลักการใดที่รับประกันว่าสองด้านจะหักล้างกันพอดี ทั้งคู่ต่างดัน NX ขึ้นในทิศทางเดียวกันด้วยซ้ำ"]},{"id":"D15","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ความชันของ AD กับประสิทธิผลของนโยบาย","q":"สมมติเปรียบเทียบสองเศรษฐกิจที่เหมือนกันทุกอย่าง ยกเว้นเศรษฐกิจ ก มีเส้น AD ที่ชันมาก ส่วนเศรษฐกิจ ข มีเส้น AD ที่ลาดมาก หากทั้งสองเผชิญช็อกด้านอุปทานที่ทำให้ SRAS เลื่อนขึ้นเท่ากัน ข้อใดถูกต้อง","choices":["เศรษฐกิจ ข สูญเสียผลผลิตมากกว่าเศรษฐกิจ ก เพราะเมื่อระดับราคาสูงขึ้นเท่ากัน เส้น AD ที่ลาดมากจะทำให้ปริมาณความต้องการซื้อลดลงมากกว่า","เศรษฐกิจ ก สูญเสียผลผลิตมากกว่าเศรษฐกิจ ข เพราะเส้น AD ที่ชันแสดงว่าผู้บริโภคในเศรษฐกิจนั้นอ่อนไหวต่อการเปลี่ยนแปลงของระดับราคามากกว่าอย่างเห็นได้ชัด","ทั้งสองเศรษฐกิจสูญเสียผลผลิตเท่ากัน เพราะขนาดของช็อกด้านอุปทานที่กระทบเส้น SRAS เป็นตัวกำหนดผลลัพธ์เพียงอย่างเดียว ส่วนความชันของ AD ไม่มีบทบาท","ทั้งสองเศรษฐกิจไม่สูญเสียผลผลิตเลย เพราะช็อกด้านอุปทานกระทบเฉพาะระดับราคา ส่วนผลผลิตที่แท้จริงถูกกำหนดโดยเส้น LRAS ซึ่งไม่ได้เคลื่อนที่ในกรณีนี้"],"answer":0,"a":"ความชันของเส้น AD บอกว่าปริมาณความต้องการซื้อตอบสนองต่อระดับราคามากน้อยเพียงใด เส้นที่ลาดมากหมายถึงตอบสนองมาก คือเมื่อราคาขยับขึ้นเล็กน้อย ปริมาณความต้องการซื้อจะหดตัวลงมาก\nเมื่อ SRAS เลื่อนขึ้นเท่ากันในทั้งสองเศรษฐกิจ ระดับราคาที่สูงขึ้นจะทำให้เศรษฐกิจ ข ซึ่งมีเส้นลาดกว่าเสียผลผลิตมากกว่า เพราะการเคลื่อนที่ไปตามเส้นพาไปได้ไกลกว่าในแนวนอน\nในทางปฏิบัติ ความลาดของ AD ขึ้นกับความอ่อนไหวของ C, I และ NX ต่อระดับราคา เช่น ประเทศที่พึ่งพาการค้าระหว่างประเทศสูงจะมีช่องทางอัตราแลกเปลี่ยนที่แรง ทำให้เส้น AD ลาดกว่า","whys":["ถูกต้อง — เส้นที่ลาดกว่าหมายถึงปริมาณตอบสนองต่อราคามากกว่า จึงสูญเสียผลผลิตมากกว่าเมื่อราคาถูกดันขึ้น","ไม่ถูกต้อง — สลับความหมาย เส้นที่ชันแสดงว่าปริมาณตอบสนองต่อราคาน้อย ไม่ใช่มาก","ไม่ถูกต้อง — ผลลัพธ์สุดท้ายเกิดจากจุดตัดของทั้งสองเส้น ความชันของ AD จึงมีบทบาทโดยตรงต่อขนาดของผลกระทบ","ไม่ถูกต้อง — LRAS กำหนดผลผลิตในระยะยาว ไม่ได้ป้องกันไม่ให้ผลผลิตระยะสั้นเบี่ยงเบนออกจากระดับศักยภาพ"]},{"id":"D16","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ผลของการเลื่อนเวลาการบริโภค","q":"รัฐบาลประกาศลดภาษีสรรพสามิตรถยนต์เป็นการชั่วคราวเพียง 6 เดือน ทำให้ยอดขายรถพุ่งสูงมากในช่วงมาตรการ แต่หลังจากนั้นยอดขายกลับต่ำกว่าปกติอย่างชัดเจน ข้อใดอธิบายปรากฏการณ์นี้ได้ถูกต้อง","choices":["มาตรการดึงอุปสงค์จากอนาคตมาไว้ในปัจจุบัน เส้น AD จึงเลื่อนขวาในช่วงมาตรการแล้วเลื่อนกลับซ้ายหลังจากนั้น ผลรวมตลอดช่วงเวลาจึงน้อยกว่าที่ตัวเลขยอดขายช่วงแรกบ่งชี้","มาตรการทำให้เส้น AD เลื่อนขวาอย่างถาวร เพราะการที่ครัวเรือนมีรถใช้เร็วขึ้นช่วยเพิ่มผลิตภาพในการเดินทางไปทำงาน ส่งผลให้รายได้และการบริโภคสูงขึ้นต่อเนื่องไปในระยะยาว","มาตรการทำให้เส้น SRAS เลื่อนลง เพราะภาษีที่ลดลงเป็นการลดต้นทุนของผู้ผลิตรถยนต์โดยตรง ราคาขายจึงต่ำลงและปริมาณการผลิตเพิ่มขึ้นตลอดช่วงที่มาตรการมีผลบังคับใช้","มาตรการไม่มีผลต่อ AD เลย เพราะการซื้อรถยนต์เป็นการจัดสรรรายจ่ายภายในงบประมาณของครัวเรือนที่มีอยู่จำกัด การใช้จ่ายในหมวดอื่นจึงลดลงในมูลค่าที่เท่ากันพอดี"],"answer":0,"a":"มาตรการที่มีกำหนดเวลาสิ้นสุดชัดเจน สร้างแรงจูงใจให้ครัวเรือนที่ตั้งใจจะซื้ออยู่แล้วในอนาคต เร่งตัดสินใจซื้อในช่วงมาตรการ ยอดขายในหน้าต่างนั้นจึงพุ่งสูงผิดปกติ แต่เมื่อมาตรการจบ กลุ่มผู้ซื้อที่ควรจะซื้อในปีถัดไปได้ซื้อไปแล้ว ยอดขายจึงตกต่ำกว่าปกติ\nในภาษา AD-AS คือเส้น AD เลื่อนขวาชั่วคราวแล้วเลื่อนกลับ ผลรวมตลอดช่วงเวลาน้อยกว่าที่ตัวเลขช่วงแรกทำให้เข้าใจ นี่คือข้อจำกัดสำคัญของมาตรการกระตุ้นการบริโภคสินค้าคงทนแบบมีกำหนดเวลา ซึ่งได้ผลดีในการจับจังหวะช่วงเศรษฐกิจตกต่ำ แต่ไม่ได้เพิ่มอุปสงค์รวมอย่างถาวร","whys":["ถูกต้อง — อธิบายกลไกการดึงอุปสงค์จากอนาคตมาใช้และสรุปผลรวมข้ามช่วงเวลาได้อย่างถูกต้อง","ไม่ถูกต้อง — ข้อมูลในโจทย์ระบุชัดว่ายอดขายหลังมาตรการต่ำกว่าปกติ ซึ่งขัดกับข้อสรุปว่า AD เลื่อนขวาอย่างถาวร","ไม่ถูกต้อง — ภาษีสรรพสามิตกระทบราคาที่ผู้บริโภคจ่าย จึงทำงานผ่านฝั่งอุปสงค์เป็นหลัก และไม่อธิบายว่าทำไมยอดขายจึงตกหลังมาตรการ","ไม่ถูกต้อง — หากหักล้างกันพอดีจริง ยอดขายรถในช่วงมาตรการก็คงไม่พุ่งขึ้นอย่างที่โจทย์ระบุ ข้อความนี้จึงขัดกับข้อมูลที่ให้มา"],"tip":"ศัพท์ที่ใช้เรียกปรากฏการณ์นี้คือ การดึงอุปสงค์มาล่วงหน้า (pull-forward) — เจอมาตรการที่มีวันหมดอายุ ให้คิดถึงผลรวมข้ามช่วงเวลาเสมอ"},{"id":"D17","type":"mcq","lvl":3,"topic":"AD-AS","ref":"รายได้ของประเทศคู่ค้ากับการส่งออก","q":"เศรษฐกิจของประเทศคู่ค้าหลักทั้งหมดขยายตัวอย่างแข็งแกร่ง ทำให้รายได้ของผู้บริโภคในประเทศเหล่านั้นสูงขึ้นมาก โดยอัตราแลกเปลี่ยนและปัจจัยอื่นคงที่ ผลต่อ AD ของเราเป็นอย่างไร","choices":["เส้น AD เลื่อนขวาผ่านการส่งออกสุทธิที่เพิ่มขึ้น เพราะรายได้ของต่างชาติที่สูงขึ้นทำให้เขาซื้อสินค้าและบริการจากเราได้มากขึ้นกว่าเดิม","เส้น AD เลื่อนซ้ายผ่านการส่งออกสุทธิที่ลดลง เพราะประเทศคู่ค้าที่เศรษฐกิจดีจะผลิตสินค้าเองได้มากขึ้นและลดการพึ่งพาการนำเข้าจากประเทศเราลงในที่สุด","เกิดการเคลื่อนที่ไปตามเส้น AD เดิม เพราะรายได้ของต่างชาติส่งผลต่อระดับราคาของสินค้าส่งออกซึ่งเป็นตัวแปรที่อยู่บนแกนตั้งของกราฟ AD-AS อยู่แล้วโดยตรง","เส้น LRAS ของเราเลื่อนขวา เพราะการส่งออกที่เพิ่มขึ้นทำให้โรงงานในประเทศต้องขยายกำลังการผลิตทันที ผลผลิต ณ การจ้างงานเต็มที่จึงสูงขึ้นในปีเดียวกันนั้น"],"answer":0,"a":"ตารางตัวกำหนดการส่งออกสุทธิในสไลด์ระบุว่า Foreign output (income) ↑ → NX Rise เพราะรายได้ของต่างชาติที่สูงขึ้นทำให้ความต้องการสินค้าจากประเทศเราเพิ่มขึ้น เมื่อ X เพิ่มโดยที่ M ไม่เปลี่ยน NX จึงสูงขึ้น และเนื่องจาก NX เป็นองค์ประกอบของ AD เส้น AD จึงเลื่อนไปทางขวา\nทั้งนี้ตารางเดียวกันยังระบุว่าอัตราแลกเปลี่ยนจะแข็งค่าขึ้นด้วย เพราะต่างชาติต้องซื้อเงินสกุลของเราเพื่อชำระค่าสินค้า ซึ่งจะหักล้างผลบวกไปบางส่วน","whys":["ถูกต้อง — ตรงตามตารางตัวกำหนดที่ระบุว่ารายได้ของต่างประเทศที่สูงขึ้นทำให้การส่งออกสุทธิเพิ่มขึ้น","ไม่ถูกต้อง — รายได้ที่สูงขึ้นทำให้ต่างชาติซื้อของทุกประเภทมากขึ้นรวมถึงสินค้านำเข้า ไม่ได้ทำให้เขาลดการนำเข้าลง","ไม่ถูกต้อง — แกนตั้งของกราฟคือระดับราคาในประเทศเรา ส่วนรายได้ของต่างชาติเป็นปัจจัยภายนอกที่ทำให้เส้นเลื่อน","ไม่ถูกต้อง — LRAS ขึ้นกับแรงงาน ทุน และเทคโนโลยีที่มีอยู่จริง การมีคำสั่งซื้อเพิ่มไม่ได้เพิ่มปัจจัยเหล่านี้ในทันที"]},{"id":"D18","type":"mcq","lvl":3,"topic":"AD-AS","ref":"อ่านกราฟ AD เลื่อนซ้ายและระบุช่องว่าง","q":"จากแผนภาพ เศรษฐกิจเริ่มที่ดุลยภาพระยะยาว ณ จุด A แล้วเส้น AD เลื่อนจาก AD₁ ไป AD₂ ข้อใดอธิบายจุด B และสิ่งที่จะเกิดขึ้นในระยะยาวได้ถูกต้อง","choices":["ผลผลิตลดต่ำกว่า Y_FE โดยระดับราคาคงที่ เกิดช่องว่างการหดตัวและการว่างงานตามวัฏจักร · ระยะยาวค่าจ้างและราคาปรับลดลง SRAS เลื่อนลง ผลผลิตกลับสู่ Y_FE ที่ระดับราคาต่ำกว่าเดิม","ผลผลิตลดต่ำกว่า Y_FE พร้อมกับระดับราคาที่ลดลงทันทีในระยะสั้น เกิดช่องว่างการหดตัว · ระยะยาวเส้น LRAS จะเลื่อนซ้ายมาบรรจบกับจุด B เพราะศักยภาพของเศรษฐกิจปรับลดลงตามความเป็นจริง","ระดับราคาลดลงโดยผลผลิตคงที่ที่ Y_FE เพราะเส้น LRAS แนวตั้งบังคับให้ผลผลิตอยู่ที่ระดับการจ้างงานเต็มที่เสมอ · ระยะยาวจึงไม่มีการเปลี่ยนแปลงใด ๆ เพิ่มเติมอีก","ผลผลิตลดต่ำกว่า Y_FE โดยระดับราคาคงที่ เกิดช่องว่างเงินเฟ้อและตลาดแรงงานตึงตัว · ระยะยาวค่าจ้างและราคาปรับสูงขึ้น SRAS เลื่อนขึ้น ผลผลิตกลับสู่ Y_FE ที่ราคาสูงกว่าเดิม"],"answer":0,"a":"เดินสี่ขั้นตามมาตรฐาน\n(1) เส้นไหนเลื่อน — AD เลื่อนซ้าย\n(2) ระยะสั้น — ในกรอบ SRAS แนวนอน ราคาถูกตรึงไว้ ผู้ผลิตจึงปรับด้วยปริมาณ ผลคือ Y ลดลงโดย P คงเดิม\n(3) ชนิดของช่องว่าง — จุด B อยู่ทางซ้ายของ LRAS จึงเป็นช่องว่างการหดตัว พร้อมการว่างงานตามวัฏจักรที่สูงกว่าอัตราธรรมชาติ\n(4) ระยะยาว — ตลาดแรงงานที่หย่อนตัวกดค่าจ้างลง ผู้ผลิตยอมลดราคาเพื่อระบายสินค้า ต้นทุนลดลงทำให้ SRAS เลื่อนลง จนตัด AD₂ ตรงกับ LRAS ผลผลิตกลับสู่ Y_FE โดยระดับราคาต่ำกว่าเดิม","whys":["ถูกต้อง — ครบทั้งผลระยะสั้น ชนิดของช่องว่าง ทิศทางการปรับของ SRAS และระดับราคาปลายทาง","ไม่ถูกต้อง — ระยะสั้นในกรอบนี้ราคายังไม่ขยับ และ LRAS ถูกกำหนดโดยปัจจัยการผลิตที่แท้จริง ไม่ได้เลื่อนตามอุปสงค์ที่ตกต่ำชั่วคราว","ไม่ถูกต้อง — LRAS กำหนดผลผลิตในระยะยาวเท่านั้น ระยะสั้นเศรษฐกิจเบี่ยงเบนออกจากระดับศักยภาพได้ ซึ่งกราฟก็แสดงไว้ชัดเจน","ไม่ถูกต้อง — จุดที่อยู่ทางซ้ายของ LRAS คือช่องว่างการหดตัว ไม่ใช่ช่องว่างเงินเฟ้อ ทิศทางการปรับของ SRAS จึงกลับด้านทั้งหมด"],"fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n  <defs>\n    <clipPath id=\"clipG\"><rect x=\"62\" y=\"26\" width=\"466\" height=\"318\"/></clipPath>\n    <marker id=\"arwG\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/>\n    </marker>\n  </defs>\n  <line x1=\"62\" y1=\"18\" x2=\"62\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <line x1=\"62\" y1=\"344\" x2=\"540\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <text x=\"52\" y=\"14\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">P</text>\n  <text x=\"548\" y=\"349\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Y</text><g clip-path=\"url(#clipG)\"><line x1=\"325.28999999999996\" y1=\"356.72\" x2=\"325.28999999999996\" y2=\"26\" stroke=\"var(--curve-lras)\" stroke-width=\"2.6\" /><line x1=\"34.040000000000006\" y1=\"200.9\" x2=\"555.96\" y2=\"200.9\" stroke=\"var(--curve-as)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"75.98\" y=\"191.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-as)\" text-anchor=\"start\">SRAS₁</text><line x1=\"15.399999999999999\" y1=\"38.72000000000003\" x2=\"574.6\" y2=\"331.28\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\"  stroke-linecap=\"round\"/><text x=\"151.88\" y=\"98.98400000000001\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ghost)\" text-anchor=\"start\">AD₁</text><line x1=\"-87.12\" y1=\"38.72000000000003\" x2=\"472.08\" y2=\"331.28\" stroke=\"var(--curve-ad)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"95.96\" y=\"123.36399999999998\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ad)\" text-anchor=\"start\">AD₂</text><circle cx=\"325.28999999999996\" cy=\"200.9\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"335.28999999999996\" y=\"216.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">A</text><circle cx=\"222.76999999999998\" cy=\"200.9\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"200.76999999999998\" y=\"188.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">B</text></g><text x=\"325.28999999999996\" y=\"17\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-lras)\" text-anchor=\"middle\">LRAS</text><text x=\"325.28999999999996\" y=\"366\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"middle\">Y<tspan dy=\"4\" font-size=\"11\">FE</tspan></text><text x=\"53\" y=\"205.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₁</text></svg><div class=\"figcap\">AD เลื่อนซ้ายในกรอบ SRAS แนวนอน — เปรียบเทียบตำแหน่งของจุด B กับเส้น LRAS</div></div>"},{"id":"D19","type":"mcq","lvl":4,"topic":"AD-AS","ref":"เปรียบเทียบนโยบายการคลังกับนโยบายการเงิน","q":"เมื่อต้องการยกเส้น AD ไปทางขวาเท่ากัน ข้อใดเปรียบเทียบช่องทางและข้อจำกัดของนโยบายการคลังกับนโยบายการเงินได้ถูกต้องที่สุด","choices":["การคลังทำงานผ่าน G โดยตรงและผ่าน C จากภาษี จุดอ่อนคือความล่าช้าในการอนุมัติและหนี้สาธารณะ · การเงินทำงานผ่าน I และ C ผ่านดอกเบี้ย จุดอ่อนคือความล่าช้าในการส่งผ่านและอาจไร้ผลเมื่อดอกเบี้ยต่ำมาก","การคลังทำงานผ่าน I และ C โดยอ้อมผ่านอัตราดอกเบี้ย จุดอ่อนคือส่งผ่านช้า · การเงินทำงานผ่าน G โดยตรง จุดอ่อนคือต้องผ่านกระบวนการงบประมาณที่ใช้เวลานานหลายเดือนกว่าจะเริ่มเบิกจ่ายได้จริง จึงไม่สามารถตอบสนองต่อภาวะฉุกเฉินได้ทันท่วงที","ทั้งสองนโยบายทำงานผ่านช่องทางเดียวกันคือการเปลี่ยนแปลงปริมาณเงินในระบบเศรษฐกิจ จึงมีข้อจำกัดเหมือนกันทุกประการและสามารถใช้ทดแทนกันได้อย่างสมบูรณ์ในทุกสถานการณ์ การเลือกใช้จึงไม่มีความสำคัญแต่อย่างใด","การคลังมีผลเฉพาะในระยะสั้นส่วนการเงินมีผลเฉพาะในระยะยาว จึงต้องใช้การคลังก่อนเสมอแล้วค่อยตามด้วยการเงิน เพื่อให้ผลของทั้งสองนโยบายเสริมกันได้อย่างต่อเนื่องไม่ขาดตอน"],"answer":0,"a":"สองนโยบายยกเส้น AD ได้เหมือนกัน แต่เดินคนละถนน\nนโยบายการคลัง — เพิ่ม G กระทบ AD โดยตรงหนึ่งต่อหนึ่งก่อนเข้าตัวคูณ ส่วนการลดภาษีกระทบผ่าน C ข้อจำกัดคือกระบวนการงบประมาณใช้เวลา ก่อหนี้สาธารณะ และอาจเบียดขับการลงทุนเอกชน\nนโยบายการเงิน — ปรับดอกเบี้ยได้เร็วโดยไม่ต้องผ่านรัฐสภา แต่ส่งผ่านไปยัง I และ C อย่างอ้อมและช้า ต้องรอให้ธุรกิจตัดสินใจลงทุนจริง และจะอ่อนแรงลงมากเมื่ออัตราดอกเบี้ยลงไปใกล้ศูนย์แล้ว หรือเมื่อความเชื่อมั่นต่ำจนไม่มีใครอยากกู้แม้ดอกเบี้ยจะถูก","whys":["ถูกต้อง — ระบุช่องทางของแต่ละนโยบายและข้อจำกัดเฉพาะตัวได้ตรงทั้งสองฝั่ง","ไม่ถูกต้อง — สลับช่องทางกันทั้งหมด รายจ่ายรัฐบาลเป็นเครื่องมือของนโยบายการคลัง ส่วนอัตราดอกเบี้ยเป็นของนโยบายการเงิน","ไม่ถูกต้อง — นโยบายการคลังไม่ได้ทำงานผ่านปริมาณเงิน และข้อจำกัดของสองนโยบายก็ต่างกันชัดเจนจนใช้ทดแทนกันสมบูรณ์ไม่ได้","ไม่ถูกต้อง — ทั้งสองนโยบายกระทบผลผลิตได้ในระยะสั้นและตกอยู่ที่ระดับราคาในระยะยาวเหมือนกัน ไม่ได้แบ่งหน้าที่ตามช่วงเวลาอย่างที่ระบุ"]},{"id":"D20","type":"mcq","lvl":2,"topic":"AD-AS","ref":"ผลระยะยาวของการเลื่อน AD","q":"ในระยะยาว การที่เส้น AD เลื่อนไปทางขวาอย่างถาวร (ไม่ว่าจะมาจากนโยบายการคลังหรือการเงิน) ส่งผลต่อผลผลิตที่แท้จริงและระดับราคาอย่างไร","choices":["ผลผลิตที่แท้จริงกลับสู่ระดับ Y_FE ตามที่เส้น LRAS กำหนด ส่วนระดับราคาสูงขึ้นอย่างถาวร เพราะ SRAS เลื่อนขึ้นจนดุลยภาพใหม่มาอยู่บนเส้น LRAS เดิม","ผลผลิตที่แท้จริงเพิ่มขึ้นอย่างถาวรเหนือระดับ Y_FE ส่วนระดับราคาคงที่ เพราะในกรอบที่ SRAS เป็นเส้นแนวนอน ราคาจะไม่ปรับตัวขึ้นไม่ว่าจะผ่านไปนานเพียงใดก็ตาม","ทั้งผลผลิตและระดับราคากลับสู่ระดับเดิมก่อนการเลื่อนของ AD เพราะกลไกตลาดจะย้อนกลับผลของนโยบายทั้งหมดจนเหมือนไม่มีอะไรเกิดขึ้นเลยในที่สุด","ผลผลิตที่แท้จริงลดต่ำกว่าระดับเดิมและระดับราคาสูงขึ้น เพราะการกระตุ้นอุปสงค์ทำลายแรงจูงใจในการผลิตของภาคเอกชนและทำให้ศักยภาพของเศรษฐกิจหดตัวลง"],"answer":0,"a":"นี่คือข้อสรุปเรื่องความเป็นกลางของนโยบายด้านอุปสงค์ในระยะยาว\nเมื่อ AD เลื่อนขวา ผลผลิตจะเกิน Y_FE ในระยะสั้น ตลาดแรงงานตึงตัว ค่าจ้างและต้นทุนถูกดันขึ้น ผู้ผลิตจึงขึ้นราคา เส้น SRAS เลื่อนขึ้นเรื่อย ๆ กระบวนการนี้จะหยุดก็ต่อเมื่อผลผลิตถอยกลับมาที่ระดับที่ LRAS กำหนดเท่านั้น\nผลสุดท้ายคือ Y กลับที่เดิม แต่ P ค้างอยู่ในระดับที่สูงขึ้นอย่างถาวร การจะเพิ่มผลผลิตอย่างถาวรได้ต้องเลื่อนLRAS ด้วยนโยบายด้านอุปทาน เช่น การศึกษา การสะสมทุน และเทคโนโลยี","whys":["ถูกต้อง — ผลผลิตถูกยึดไว้ที่ LRAS ในระยะยาว ส่วนต้นทุนของนโยบายตกอยู่ที่ระดับราคาที่สูงขึ้นถาวร","ไม่ถูกต้อง — SRAS เป็นเส้นแนวนอนเฉพาะในระยะสั้น เท่านั้น เมื่อเวลาผ่านไปค่าจ้างและราคาปรับตัวได้ เส้นจึงเลื่อนขึ้น","ไม่ถูกต้อง — ระดับราคาไม่ได้กลับที่เดิม การเลื่อนขึ้นของ SRAS ทำให้ P ค้างอยู่ในระดับที่สูงกว่าเดิมอย่างถาวร","ไม่ถูกต้อง — การกระตุ้นอุปสงค์ไม่ได้ทำลายศักยภาพการผลิต เพียงแต่ไม่ได้ช่วยขยายมัน ผลผลิตจึงกลับที่เดิมไม่ใช่ต่ำกว่าเดิม"],"tip":"ประโยคปิดท้ายที่กินคะแนนทุกครั้ง: “ระยะยาวผลผลิตกลับสู่ Y_FE ตาม LRAS เหลือไว้เพียงระดับราคาที่สูงขึ้น”"},{"id":"D21","type":"mcq","lvl":4,"topic":"AD-AS","ref":"รายจ่ายลงทุนกับรายจ่ายประจำของรัฐบาล","q":"รัฐบาลมีทางเลือกใช้เงิน 200,000 ล้านบาทเท่ากันสองแบบ — แบบ ก สร้างระบบรางและโครงข่ายไฟฟ้า · แบบ ข เพิ่มเงินเดือนข้าราชการและค่าใช้จ่ายสำนักงาน ข้อใดเปรียบเทียบผลได้ถูกต้อง","choices":["ทั้งสองแบบยกเส้น AD ไปทางขวาในระยะสั้นใกล้เคียงกัน แต่แบบ ก มีโอกาสเลื่อนเส้น LRAS ไปทางขวาในระยะยาวด้วย เพราะเพิ่มทุนและผลิตภาพของประเทศจริง","ทั้งสองแบบยกเส้น AD ไปทางขวาเท่ากันทุกประการทั้งในระยะสั้นและระยะยาว เพราะเป็นรายจ่ายภาครัฐจำนวนเท่ากันซึ่งถูกนับเป็น G ในสมการอุปสงค์มวลรวมเหมือนกัน","แบบ ก ไม่กระทบ AD ในระยะสั้นเลยเพราะเป็นการลงทุนระยะยาว ส่วนแบบ ข กระทบ AD ทันที ดังนั้นหากต้องการกระตุ้นเศรษฐกิจโดยเร็วจึงควรเลือกแบบ ข เพียงอย่างเดียวเสมอ","แบบ ก ทำให้เส้น LRAS เลื่อนขวาทันทีในปีที่เริ่มก่อสร้าง ส่วนแบบ ข ทำให้เส้น SRAS เลื่อนขึ้นเพราะค่าจ้างที่สูงขึ้นในภาครัฐจะดันค่าจ้างของภาคเอกชนให้สูงตามไปด้วย"],"answer":0,"a":"ทั้งสองแบบเป็นรายจ่ายภาครัฐที่นับเป็น G เหมือนกัน จึงยก AD ไปทางขวาในระยะสั้นใกล้เคียงกัน (อาจต่างกันบ้างตามขนาดตัวคูณของแต่ละหมวด)\nความต่างที่แท้จริงอยู่ที่ระยะยาว — รายจ่ายแบบ ก สร้างทุนทางกายภาพที่เพิ่มผลิตภาพของทั้งระบบเศรษฐกิจ ทำให้ผลผลิต ณ การจ้างงานเต็มที่สูงขึ้นและ LRAS เลื่อนขวาได้จริง ส่วนแบบ ข เป็นรายจ่ายประจำที่ไม่ได้เพิ่มกำลังการผลิตของประเทศ\nข้อควรระวัง — ผลต่อ LRAS ไม่ได้เกิดทันที ต้องรอให้โครงการเสร็จและใช้งานจริงซึ่งกินเวลาหลายปี","whys":["ถูกต้อง — แยกผลระยะสั้นที่เหมือนกันออกจากผลระยะยาวที่ต่างกัน และระบุเงื่อนไขว่าต้องเพิ่มผลิตภาพจริง","ไม่ถูกต้อง — ในระยะยาวสองแบบให้ผลต่างกันชัดเจน เพราะแบบหนึ่งสร้างทุนที่เพิ่มศักยภาพการผลิต อีกแบบไม่ได้สร้าง","ไม่ถูกต้อง — การก่อสร้างจ่ายค่าแรงและค่าวัสดุตั้งแต่วันแรก จึงกระทบ AD ทันทีเช่นกัน ไม่ได้รอจนโครงการเสร็จ","ไม่ถูกต้อง — LRAS เลื่อนได้ก็ต่อเมื่อโครงสร้างพื้นฐานสร้างเสร็จและใช้งานได้จริง ซึ่งใช้เวลาหลายปี ไม่ใช่ปีที่เริ่มก่อสร้าง"]},{"id":"D22","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ภาษีมูลค่าเพิ่มกับการบริโภค","q":"รัฐบาลปรับขึ้นอัตราภาษีมูลค่าเพิ่มจาก 7% เป็น 10% เพื่อลดการขาดดุลงบประมาณ โดยไม่ได้เปลี่ยนแปลงรายจ่ายภาครัฐ ข้อใดอธิบายผลต่อ AD ได้ถูกต้อง","choices":["เส้น AD เลื่อนซ้ายผ่านการบริโภคที่ลดลง เพราะราคาสินค้าที่ผู้บริโภคต้องจ่ายจริงสูงขึ้น อำนาจซื้อของรายได้ที่ใช้จ่ายได้จึงลดลงและครัวเรือนตัดทอนการใช้จ่ายลง","เส้น AD เลื่อนขวาผ่านรายจ่ายรัฐบาลที่สูงขึ้น เพราะรายได้ภาษีที่เก็บได้เพิ่มขึ้นจะถูกแปลงเป็นการใช้จ่ายของภาครัฐในระบบเศรษฐกิจโดยอัตโนมัติตามงบประมาณที่วางไว้","เส้น AD ไม่เปลี่ยนแปลง เพราะภาษีมูลค่าเพิ่มเป็นการย้ายเงินจากครัวเรือนไปยังรัฐบาล ซึ่งเป็นการโอนภายในระบบเดียวกันจึงไม่กระทบอุปสงค์รวมสุทธิของประเทศ","เส้น SRAS เลื่อนลงเพราะผู้ผลิตต้องแข่งขันด้านราคามากขึ้นเมื่อผู้บริโภคมีกำลังซื้อน้อยลง ส่งผลให้ต้นทุนการผลิตต่อหน่วยลดลงและปริมาณการผลิตเพิ่มขึ้นในที่สุด"],"answer":0,"a":"ภาษีมูลค่าเพิ่มทำให้ราคาที่ผู้บริโภคจ่ายจริงสูงขึ้นทุกรายการ อำนาจซื้อของรายได้ที่ใช้จ่ายได้จึงลดลง ครัวเรือนตอบสนองด้วยการลดปริมาณการซื้อ การบริโภค (C) ลดลง ณ ทุกระดับราคาก่อนภาษี เส้น AD จึงเลื่อนซ้าย\nโจทย์ระบุชัดว่ารายจ่ายภาครัฐไม่เปลี่ยน จึงไม่มี G มาชดเชย ผลสุทธิต่อ AD เป็นลบแน่นอน — นี่คือกลไกของนโยบายการคลังแบบหดตัว ซึ่งเหมาะกับภาวะที่เศรษฐกิจร้อนแรงเกินไป แต่จะซ้ำเติมสถานการณ์หากใช้ในช่วงเศรษฐกิจหดตัว","whys":["ถูกต้อง — ระบุช่องทาง C และกลไกอำนาจซื้อที่ลดลงได้ตรงตามที่แบบจำลองอธิบาย","ไม่ถูกต้อง — โจทย์ระบุว่ารายจ่ายภาครัฐไม่เปลี่ยนแปลง รายได้ภาษีที่เพิ่มขึ้นถูกนำไปลดการขาดดุล ไม่ได้ถูกนำไปใช้จ่ายเพิ่ม","ไม่ถูกต้อง — ภาษีเปลี่ยนราคาที่ผู้บริโภคเผชิญและเปลี่ยนพฤติกรรมการใช้จ่ายจริง จึงไม่ใช่การโอนที่ไม่มีผลต่ออุปสงค์","ไม่ถูกต้อง — ภาษีมูลค่าเพิ่มไม่ได้ลดต้นทุนการผลิตของผู้ผลิต และการแข่งขันด้านราคาก็ไม่ได้ทำให้ต้นทุนต่อหน่วยลดลงจริง"]},{"id":"D23","type":"mcq","lvl":4,"topic":"AD-AS","ref":"การชำระคืนหนี้ของภาคครัวเรือน","q":"หลังวิกฤตการเงิน ครัวเรือนทั้งประเทศพร้อมใจกันเร่งชำระคืนหนี้และลดการก่อหนี้ใหม่ เพื่อลดภาระในงบดุลของตนเอง ข้อใดอธิบายผลต่อ AD และความยากของสถานการณ์นี้ได้ถูกต้อง","choices":["เส้น AD เลื่อนซ้ายผ่านการบริโภคที่ลดลงพร้อมกันทั้งระบบ และนโยบายการเงินจะได้ผลน้อยกว่าปกติ เพราะครัวเรือนที่ตั้งใจลดหนี้จะไม่กู้เพิ่มแม้อัตราดอกเบี้ยจะต่ำมากก็ตาม","เส้น AD เลื่อนขวาผ่านการลงทุนที่เพิ่มขึ้น เพราะหนี้ครัวเรือนที่ลดลงทำให้ระบบธนาคารมีเงินเหลือไปปล่อยกู้ให้ภาคธุรกิจได้มากขึ้น การลงทุนของประเทศจึงขยายตัวตามไปด้วย","เส้น AD ไม่เปลี่ยนแปลง เพราะการชำระหนี้เป็นเพียงการโอนเงินจากลูกหนี้ไปยังเจ้าหนี้ ซึ่งเจ้าหนี้จะนำเงินนั้นไปใช้จ่ายต่อในมูลค่าที่เท่ากันพอดีจนหักล้างกันหมด","เส้น SRAS เลื่อนขึ้นเพราะธุรกิจต้องแบกภาระต้นทุนทางการเงินที่สูงขึ้นจากการที่ครัวเรือนแย่งชำระหนี้ก่อน ทำให้ระดับราคาสูงขึ้นพร้อมกับผลผลิตที่แท้จริงลดลงในระยะสั้น"],"answer":0,"a":"การที่ทุกครัวเรือนลดหนี้พร้อมกันเป็นพฤติกรรมที่สมเหตุสมผลในระดับบุคคลแต่ทำร้ายระบบโดยรวม เพราะเงินที่ควรจะเป็นการใช้จ่ายถูกเบนไปชำระหนี้แทน การบริโภคของทั้งระบบหดตัวลงพร้อมกัน เส้น AD เลื่อนซ้าย\nส่วนที่ทำให้สถานการณ์นี้ยากเป็นพิเศษคือ นโยบายการเงินอ่อนแรงลงมาก — ปกติการลดดอกเบี้ยจะกระตุ้นการกู้เพื่อบริโภคและลงทุน แต่เมื่อทุกคนตั้งใจจะลดหนี้ ไม่ใช่เพิ่มหนี้ ดอกเบี้ยที่ถูกลงก็ไม่จูงใจให้ใครกู้ ในสถานการณ์เช่นนี้นโยบายการคลังซึ่งใช้จ่ายโดยตรงจะมีบทบาทสำคัญกว่า","whys":["ถูกต้อง — ระบุทั้งทิศทางของ AD และเหตุผลว่าทำไมเครื่องมือด้านดอกเบี้ยจึงอ่อนแรงลงในสถานการณ์นี้","ไม่ถูกต้อง — ในภาวะที่ทุกคนลดหนี้พร้อมกัน ธุรกิจก็มักชะลอการลงทุนตามไปด้วย เงินที่ธนาคารมีจึงไม่ได้ถูกปล่อยกู้ออกไปจริง","ไม่ถูกต้อง — เจ้าหนี้และสถาบันการเงินไม่ได้นำเงินที่ได้รับคืนไปใช้จ่ายในอัตราเดียวกับที่ครัวเรือนเคยใช้ ผลสุทธิต่อการใช้จ่ายรวมจึงเป็นลบ","ไม่ถูกต้อง — การลดหนี้ของครัวเรือนไม่ได้เพิ่มต้นทุนการผลิตของธุรกิจ ช่องทางหลักของเหตุการณ์นี้อยู่ที่ฝั่งอุปสงค์ผ่านการบริโภค"]},{"id":"D24","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ราคาน้ำมันโลกลดลงกระทบฝั่งไหน","q":"ราคาน้ำมันดิบในตลาดโลกลดลงอย่างรุนแรง ในประเทศผู้นำเข้าน้ำมันสุทธิแห่งหนึ่ง ข้อใดอธิบายผลกระทบต่อแบบจำลอง AD-AS ได้ครบถ้วนที่สุด","choices":["SRAS เลื่อนลงจากต้นทุนพลังงานที่ถูกลง และ AD เลื่อนขวาบ้างจากรายได้ที่แท้จริงของครัวเรือนที่เพิ่มขึ้นและค่าใช้จ่ายนำเข้าที่ลดลง ผลผลิตเพิ่มขึ้นแน่นอนส่วนระดับราคาน่าจะลดลง","SRAS เลื่อนขึ้นจากต้นทุนพลังงานที่เปลี่ยนแปลง และ AD เลื่อนซ้ายจากรายได้ของภาคพลังงานที่หายไป ผลคือระดับราคาสูงขึ้นพร้อมกับผลผลิตที่แท้จริงลดลงในระยะสั้นทันที","เฉพาะเส้น AD เท่านั้นที่เลื่อนขวา เพราะราคาน้ำมันเป็นส่วนหนึ่งของค่าครองชีพของครัวเรือนโดยตรง ส่วนฝั่งอุปทานไม่ได้รับผลกระทบเลยเพราะน้ำมันเป็นสินค้าขั้นสุดท้าย","เฉพาะเส้น LRAS เท่านั้นที่เลื่อนขวา เพราะพลังงานที่ถูกลงทำให้ประเทศผลิตสินค้าได้มากขึ้นอย่างถาวร ส่วน SRAS และ AD ไม่ได้รับผลกระทบใด ๆ จากการเปลี่ยนแปลงครั้งนี้"],"answer":0,"a":"ราคาน้ำมันที่ลดลงเป็นช็อกที่กระทบสองฝั่งพร้อมกัน และทั้งคู่ไปในทางบวกสำหรับประเทศผู้นำเข้าสุทธิ\nฝั่งอุปทาน — พลังงานเป็นต้นทุนการผลิตและขนส่งของแทบทุกอุตสาหกรรม เมื่อถูกลง ต้นทุนต่อหน่วยลดลง SRAS เลื่อนลง\nฝั่งอุปสงค์ — ครัวเรือนจ่ายค่าน้ำมันน้อยลง เหลือเงินไปใช้จ่ายอย่างอื่นมากขึ้น (C เพิ่ม) และประเทศจ่ายค่านำเข้าน้ำมันน้อยลงซึ่งช่วย NX AD เลื่อนขวาบ้าง\nทั้งสองแรงดันผลผลิตขึ้นในทิศทางเดียวกัน Y จึงเพิ่มขึ้นแน่นอน ส่วน P ถูกแรงสองทางขัดกัน (SRAS ลงกดราคา · AD ขวาดันราคา) แต่โดยทั่วไปผลด้านต้นทุนจะแรงกว่า ระดับราคาจึงมีแนวโน้มลดลง","whys":["ถูกต้อง — จับได้ทั้งสองฝั่ง และแยกได้ว่าตัวแปรใดสรุปทิศทางได้แน่นอนและตัวแปรใดต้องชั่งน้ำหนัก","ไม่ถูกต้อง — ราคาน้ำมันที่ลดลงทำให้ต้นทุนถูกลง SRAS จึงเลื่อนลงไม่ใช่เลื่อนขึ้น ทิศทางกลับด้านทั้งหมด","ไม่ถูกต้อง — น้ำมันเป็นปัจจัยการผลิตและต้นทุนขนส่งของแทบทุกอุตสาหกรรม จึงกระทบฝั่งอุปทานอย่างหนักแน่นที่สุด","ไม่ถูกต้อง — ราคาน้ำมันที่ผันผวนเป็นช็อกด้านต้นทุนชั่วคราวซึ่งกระทบ SRAS ไม่ได้เปลี่ยนแรงงาน ทุน หรือเทคโนโลยีที่กำหนด LRAS"],"tip":"ช็อกราคาพลังงานเป็นโจทย์ยอดนิยม — อย่าตอบฝั่งเดียว ให้ตอบทั้ง SRAS (ผ่านต้นทุน) และ AD (ผ่านรายได้ที่แท้จริงและ NX) แล้วชั่งน้ำหนักที่ระดับราคา"},{"id":"D25","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ความโน้มเอียงในการบริโภคกับขนาดของตัวคูณ","q":"เศรษฐกิจ ก มีความโน้มเอียงหน่วยเพิ่มในการบริโภค 0.9 ส่วนเศรษฐกิจ ข มี 0.6 หากรัฐบาลของทั้งสองประเทศเพิ่มรายจ่ายเท่ากันที่ 50,000 ล้านบาท ผลต่อ AD ต่างกันอย่างไร (ไม่คำนึงถึงการรั่วไหลอื่น)","choices":["เศรษฐกิจ ก มีตัวคูณ 10 ทำให้ AD เลื่อนขวาราว 500,000 ล้านบาท ส่วนเศรษฐกิจ ข มีตัวคูณ 2.5 ทำให้ AD เลื่อนขวาราว 125,000 ล้านบาท ต่างกันถึงสี่เท่า","เศรษฐกิจ ก มีตัวคูณ 0.9 ทำให้ AD เลื่อนขวาราว 45,000 ล้านบาท ส่วนเศรษฐกิจ ข มีตัวคูณ 0.6 ทำให้ AD เลื่อนขวาราว 30,000 ล้านบาท ต่างกันประมาณหนึ่งเท่าครึ่งเท่านั้น","ทั้งสองเศรษฐกิจมี AD เลื่อนขวาเท่ากันที่ 50,000 ล้านบาท เพราะรายจ่ายรัฐบาลเป็นองค์ประกอบโดยตรงของอุปสงค์มวลรวม จึงไม่ขึ้นกับพฤติกรรมการบริโภคของครัวเรือน","เศรษฐกิจ ข มีตัวคูณสูงกว่าเพราะครัวเรือนออมมากกว่า ทำให้ธนาคารมีเงินปล่อยกู้มากขึ้นและการลงทุนขยายตัว AD ของเศรษฐกิจ ข จึงเลื่อนขวามากกว่าเศรษฐกิจ ก อย่างชัดเจน"],"answer":0,"a":"ตัวคูณรายจ่าย = 1 ÷ (1 − MPC)\nเศรษฐกิจ ก — 1 ÷ (1 − 0.9) = 1 ÷ 0.1 = 10 · ผลต่อ AD = 50,000 × 10 = 500,000 ล้านบาท\nเศรษฐกิจ ข — 1 ÷ (1 − 0.6) = 1 ÷ 0.4 = 2.5 · ผลต่อ AD = 50,000 × 2.5 = 125,000 ล้านบาท\nเหตุผลเชิงกลไกคือ ยิ่ง MPC สูง เงินที่ไหลเข้ากระเป๋าแต่ละคนยิ่งถูกส่งต่อเป็นรายจ่ายของคนถัดไปในสัดส่วนที่มากกว่า วงจรจึงยาวกว่าและผลรวมใหญ่กว่า ในทางกลับกัน ส่วนที่ถูกเก็บออมคือการรั่วไหลออกจากวงจร","whys":["ถูกต้อง — คำนวณตัวคูณจากสูตร 1 ÷ (1 − MPC) ถูกทั้งสองกรณี และเปรียบเทียบขนาดได้ถูกต้อง","ไม่ถูกต้อง — นำ MPC มาใช้เป็นตัวคูณโดยตรง ซึ่งจะได้ค่าน้อยกว่า 1 เสมอ ขัดกับหลักที่ว่าตัวคูณรายจ่ายต้องมากกว่า 1","ไม่ถูกต้อง — มองเห็นเฉพาะรอบแรกของการใช้จ่าย แต่ละเลยว่าเงินก้อนนั้นกลายเป็นรายได้ที่ถูกนำไปใช้จ่ายต่ออีกหลายทอด","ไม่ถูกต้อง — การออมคือการรั่วไหลออกจากวงจรรายได้–รายจ่าย จึงทำให้ตัวคูณเล็กลง ไม่ใช่ใหญ่ขึ้น"]},{"id":"D26","type":"mcq","lvl":4,"topic":"AD-AS","ref":"มาตรการจำกัดการนำเข้า","q":"รัฐบาลประกาศขึ้นภาษีนำเข้าสินค้าอุปโภคบริโภคอย่างมาก เพื่อหวังให้การส่งออกสุทธิดีขึ้นและกระตุ้นเศรษฐกิจ ข้อใดประเมินนโยบายนี้ได้รอบด้านที่สุด","choices":["การนำเข้าที่ลดลงช่วยให้ NX สูงขึ้นและ AD เลื่อนขวาในเบื้องต้น แต่ต้นทุนวัตถุดิบนำเข้าที่แพงขึ้นดัน SRAS ขึ้น อีกทั้งค่าเงินที่แข็งขึ้นและการตอบโต้ทางการค้าจะกัดกินผลบวกไปมาก","การนำเข้าที่ลดลงช่วยให้ NX สูงขึ้นและ AD เลื่อนขวา โดยไม่มีผลข้างเคียงใด ๆ เพราะภาษีนำเข้ากระทบเฉพาะสินค้าจากต่างประเทศซึ่งไม่ได้เป็นส่วนหนึ่งของการผลิตภายในประเทศเลย","การนำเข้าที่ลดลงทำให้ AD เลื่อนซ้ายทันที เพราะการนำเข้าเป็นองค์ประกอบที่ถูกบวกเข้าไปในสมการอุปสงค์มวลรวม การลดการนำเข้าจึงเท่ากับการลดอุปสงค์รวมลงโดยตรง","นโยบายนี้ทำให้เส้น LRAS เลื่อนขวาอย่างถาวร เพราะการปกป้องอุตสาหกรรมในประเทศจากการแข่งขันจะทำให้ผู้ผลิตในประเทศขยายกำลังการผลิตและเพิ่มผลิตภาพขึ้นอย่างต่อเนื่อง"],"answer":0,"a":"ต้องประเมินสามชั้น\nชั้นแรก ผลที่ตั้งใจ — การนำเข้าลดลงทำให้ NX = X − M สูงขึ้น AD เลื่อนขวา\nชั้นที่สอง ผลข้างเคียงด้านต้นทุน — ผู้ผลิตในประเทศจำนวนมากใช้วัตถุดิบและชิ้นส่วนนำเข้า ภาษีที่สูงขึ้นจึงดันต้นทุนการผลิตขึ้น SRAS เลื่อนขึ้น ซึ่งกดผลผลิตและดันราคา\nชั้นที่สาม ผลย้อนกลับ — เมื่อ NX ดีขึ้น ความต้องการเงินสกุลของเราสูงขึ้น ค่าเงินแข็งขึ้น ทำให้สินค้าส่งออกของเราแพงในสายตาต่างชาติ ซึ่งหักล้างผลบวกไปอีก และประเทศคู่ค้ามักตอบโต้ด้วยมาตรการของตนเอง\nผลสุทธิจึงเล็กกว่าที่ตั้งใจไว้มาก และอาจติดลบได้","whys":["ถูกต้อง — ประเมินครบทั้งผลที่ตั้งใจ ผลข้างเคียงผ่านต้นทุน และผลย้อนกลับผ่านค่าเงินกับการตอบโต้ทางการค้า","ไม่ถูกต้อง — สินค้านำเข้าจำนวนมากเป็นวัตถุดิบและชิ้นส่วนของผู้ผลิตในประเทศ ภาษีจึงกระทบต้นทุนการผลิตในประเทศโดยตรง","ไม่ถูกต้อง — การนำเข้าถูกหักออกในสมการ NX = X − M การนำเข้าที่ลดลงจึงทำให้ NX สูงขึ้น ไม่ใช่ลดอุปสงค์รวมลง","ไม่ถูกต้อง — การปกป้องจากการแข่งขันมักลดแรงจูงใจในการเพิ่มผลิตภาพ ไม่ได้รับประกันว่า LRAS จะเลื่อนขวาอย่างถาวร"]},{"id":"D27","type":"mcq","lvl":3,"topic":"AD-AS","ref":"เงินอุดหนุนราคาพลังงาน","q":"รัฐบาลอุดหนุนราคาน้ำมันดีเซลให้ต่ำกว่าราคาตลาดเป็นเวลาหนึ่งปี โดยใช้งบประมาณจำนวนมาก ข้อใดอธิบายผลต่อแบบจำลอง AD-AS ได้ครบที่สุด","choices":["SRAS เลื่อนลงเพราะต้นทุนเชื้อเพลิงและขนส่งของผู้ผลิตถูกลง และ AD เลื่อนขวาบ้างเพราะครัวเรือนเหลือเงินไปใช้จ่ายอย่างอื่น ผลผลิตเพิ่มขึ้นแต่ภาระทางการคลังของรัฐสูงขึ้นมาก","SRAS เลื่อนขึ้นเพราะรัฐบาลต้องเก็บภาษีเพิ่มในอนาคตเพื่อชดเชยงบประมาณที่ใช้ไป ผู้ผลิตจึงคาดการณ์ต้นทุนที่สูงขึ้นและปรับราคาสินค้าขึ้นล่วงหน้าตั้งแต่ปีที่มีมาตรการ","เฉพาะเส้น AD เท่านั้นที่เลื่อนขวา เพราะเงินอุดหนุนเป็นรายจ่ายของภาครัฐซึ่งถูกนับเป็น G ในสมการอุปสงค์มวลรวม ส่วนฝั่งอุปทานไม่ได้รับผลกระทบใด ๆ จากมาตรการนี้เลย","เส้น LRAS เลื่อนขวาอย่างถาวร เพราะพลังงานที่ถูกลงทำให้ภาคการผลิตของประเทศขยายกำลังการผลิตได้มากขึ้น และผลผลิต ณ ระดับการจ้างงานเต็มที่จะสูงขึ้นตามไปตลอดกาล"],"answer":0,"a":"เงินอุดหนุนพลังงานกระทบทั้งสองฝั่งในทางที่ช่วยเศรษฐกิจระยะสั้น\nฝั่งอุปทาน — ดีเซลเป็นต้นทุนการขนส่งและการผลิตของแทบทุกอุตสาหกรรม เมื่อราคาถูกลง ต้นทุนต่อหน่วยลดลง SRAS เลื่อนลง ผลผลิตเพิ่มและระดับราคาถูกกดลง\nฝั่งอุปสงค์ — ครัวเรือนจ่ายค่าเชื้อเพลิงน้อยลง เหลือเงินไปใช้จ่ายอย่างอื่น C เพิ่ม AD เลื่อนขวาบ้าง\nต้นทุนที่ต้องระบุ — มาตรการนี้ใช้งบประมาณจำนวนมาก ทำให้ฐานะการคลังแย่ลง อีกทั้งราคาที่ถูกบิดเบือนยังลดแรงจูงใจในการประหยัดพลังงาน ซึ่งเป็นต้นทุนระยะยาวที่มองไม่เห็นในกราฟ","whys":["ถูกต้อง — ครอบคลุมทั้งสองฝั่งของแบบจำลองและระบุต้นทุนทางการคลังที่มาพร้อมกับมาตรการ","ไม่ถูกต้อง — ผลจากการคาดการณ์ภาษีในอนาคตมีอยู่ในทฤษฎีบางสำนัก แต่ไม่ใช่กลไกหลักที่แบบจำลองนี้อธิบาย และขัดกับผลด้านต้นทุนที่ลดลงจริง","ไม่ถูกต้อง — เงินอุดหนุนราคาสินค้าไม่ใช่การที่รัฐซื้อสินค้าและบริการ และผลที่ชัดเจนที่สุดของมันคือการลดต้นทุนของผู้ผลิตซึ่งอยู่ฝั่งอุปทาน","ไม่ถูกต้อง — มาตรการนี้มีกำหนดเวลาหนึ่งปีและไม่ได้เพิ่มแรงงาน ทุน หรือเทคโนโลยี LRAS จึงไม่เลื่อนอย่างถาวร"]},{"id":"D28","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ความเชื่อมั่นสองด้านที่ขัดกัน","q":"ผลสำรวจพบว่าดัชนีความเชื่อมั่นผู้บริโภคปรับตัวดีขึ้นมาก ขณะที่ดัชนีความเชื่อมั่นภาคธุรกิจปรับตัวลดลงมากเช่นกัน ในช่วงเวลาเดียวกัน ข้อใดวิเคราะห์ผลต่อ AD ได้ถูกต้อง","choices":["ความเชื่อมั่นผู้บริโภคที่ดีขึ้นดัน C ขึ้นและ AD ไปทางขวา ขณะที่ความเชื่อมั่นธุรกิจที่แย่ลงกด I ลงและ AD ไปทางซ้าย ทิศทางสุทธิจึงขึ้นกับขนาดสัมพัทธ์ของสองแรง","เส้น AD เลื่อนขวาแน่นอน เพราะการบริโภคเป็นองค์ประกอบที่ใหญ่ที่สุดของอุปสงค์มวลรวมในทุกระบบเศรษฐกิจ จึงมีอิทธิพลเหนือกว่าการลงทุนเสมอไม่ว่าสถานการณ์จะเป็นอย่างไร","เส้น AD เลื่อนซ้ายแน่นอน เพราะการลงทุนเป็นองค์ประกอบที่ผันผวนที่สุดของอุปสงค์มวลรวม ความเปลี่ยนแปลงของมันจึงมีขนาดใหญ่กว่าการเปลี่ยนแปลงของการบริโภคเสมอ","เส้น AD ไม่เปลี่ยนแปลง เพราะความเชื่อมั่นเป็นตัวแปรทางจิตวิทยาที่ยังไม่ได้แปลงเป็นการใช้จ่ายจริง จึงไม่มีผลต่อตำแหน่งของเส้นอุปสงค์มวลรวมจนกว่าจะเกิดธุรกรรมขึ้นจริง"],"answer":0,"a":"ความเชื่อมั่นเป็นตัวกำหนดของทั้ง C และ I แต่ในโจทย์นี้สองดัชนีเคลื่อนไปคนละทิศ\nฝั่งครัวเรือน — ความเชื่อมั่นดีขึ้นทำให้กล้าใช้จ่าย โดยเฉพาะสินค้าคงทน C เพิ่ม AD เลื่อนขวา\nฝั่งธุรกิจ — ความเชื่อมั่นแย่ลงทำให้ชะลอหรือยกเลิกโครงการลงทุน I ลด AD เลื่อนซ้าย\nเมื่อสองแรงผลักคนละทาง คำตอบที่ถูกต้องทางวิชาการคือ “ขึ้นกับขนาดสัมพัทธ์” แม้ในทางปฏิบัติการบริโภคจะมีสัดส่วนต่อ GDP ใหญ่กว่าการลงทุนมาก แต่การลงทุนก็ผันผวนกว่าหลายเท่า ความเปลี่ยนแปลงของมันจึงมักมีขนาดใหญ่ได้ไม่แพ้กัน","whys":["ถูกต้อง — ระบุช่องทางของทั้งสองฝั่งและสรุปอย่างมีหลักการว่าทิศทางสุทธิต้องดูขนาดสัมพัทธ์","ไม่ถูกต้อง — แม้การบริโภคจะมีสัดส่วนใหญ่กว่า แต่ขนาดของการเปลี่ยนแปลงต่างหากที่สำคัญ ไม่ใช่ขนาดของฐาน","ไม่ถูกต้อง — การลงทุนผันผวนกว่าจริง แต่ก็ไม่ได้รับประกันว่าความเปลี่ยนแปลงของมันจะใหญ่กว่าเสมอในทุกเหตุการณ์","ไม่ถูกต้อง — ความเชื่อมั่นเป็นตัวกำหนดการใช้จ่ายที่ได้รับการยอมรับในแบบจำลอง และส่งผลต่อการตัดสินใจจริงของทั้งครัวเรือนและธุรกิจ"]},{"id":"D29","type":"mcq","lvl":3,"topic":"AD-AS","ref":"การลงทุนโดยตรงจากต่างประเทศ","q":"บริษัทข้ามชาติหลายรายตัดสินใจสร้างโรงงานใหม่ในประเทศด้วยเงินลงทุนมหาศาล ข้อใดอธิบายผลต่อแบบจำลอง AD-AS ทั้งในระยะสั้นและระยะยาวได้ถูกต้อง","choices":["ระยะสั้น AD เลื่อนขวาจากการลงทุนที่เพิ่มขึ้นในการก่อสร้างและจัดซื้อ · ระยะยาว LRAS เลื่อนขวาด้วย เพราะทุนทางกายภาพและเทคโนโลยีการผลิตของประเทศเพิ่มขึ้นจริง","ระยะสั้น AD เลื่อนซ้ายเพราะเงินลงทุนที่ไหลเข้าทำให้ค่าเงินแข็งจนการส่งออกหดตัวลงมากกว่าผลบวกจากการก่อสร้าง · ระยะยาว LRAS ไม่เลื่อนเพราะโรงงานเป็นของบริษัทต่างชาติ","ระยะสั้นไม่มีผลต่อ AD เลยเพราะเป็นเงินของต่างชาติซึ่งไม่ถูกนับในสมการอุปสงค์มวลรวมของประเทศเรา · ระยะยาว LRAS เลื่อนขวาเมื่อโรงงานเริ่มเดินสายการผลิตจริงในอีกไม่กี่ปี","ระยะสั้น AD เลื่อนขวาจากการก่อสร้าง · ระยะยาว LRAS เลื่อนซ้าย เพราะกำไรที่บริษัทต่างชาติส่งกลับประเทศแม่ทำให้ทรัพยากรของประเทศไหลออกไปอย่างต่อเนื่องทุกปี"],"answer":0,"a":"การลงทุนโดยตรงจากต่างประเทศทำงานสองจังหวะ\nระยะสั้น — ขั้นตอนก่อสร้างและจัดซื้อเครื่องจักรเป็นการใช้จ่ายจริงในประเทศ ซึ่งถูกนับเป็นการลงทุน (I) ในบัญชีรายได้ประชาชาติ ไม่ว่าเจ้าของเงินจะเป็นสัญชาติใด เพราะ GDP นับตามสถานที่ผลิต ไม่ใช่สัญชาติของผู้ผลิต AD จึงเลื่อนขวา\nระยะยาว — เมื่อโรงงานเดินสายการผลิต ประเทศมีทุนทางกายภาพและมักได้รับเทคโนโลยีกับทักษะการบริหารเพิ่ม ผลผลิต ณ การจ้างงานเต็มที่จึงสูงขึ้น LRAS เลื่อนขวา — เป็นกรณีที่นโยบายเดียวได้ผลทั้งสองฝั่ง","whys":["ถูกต้อง — แยกผลระยะสั้นผ่าน AD ออกจากผลระยะยาวผ่าน LRAS และระบุเหตุผลของแต่ละช่วงได้ถูกต้อง","ไม่ถูกต้อง — ผลด้านค่าเงินมีอยู่จริงแต่ไม่มากพอจะพลิกทิศทาง และโรงงานที่ตั้งอยู่ในประเทศคือทุนที่เพิ่มศักยภาพการผลิตของประเทศจริง","ไม่ถูกต้อง — GDP นับตามสถานที่ผลิตโดยไม่คำนึงถึงสัญชาติของผู้ผลิต การก่อสร้างในประเทศจึงถูกนับเป็น I ตั้งแต่ระยะสั้น","ไม่ถูกต้อง — การส่งกำไรกลับกระทบรายได้ประชาชาติ (GNP) แต่ไม่ได้ทำให้โรงงานและเครื่องจักรที่ตั้งอยู่ในประเทศหายไป LRAS จึงไม่เลื่อนซ้าย"]},{"id":"D30","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ขนาดของการเลื่อน AD ที่จำเป็นต้องปิดช่องว่าง","q":"จากแผนภาพ เศรษฐกิจอยู่ที่จุด B ซึ่งต่ำกว่า Y_FE หากผู้ดำเนินนโยบายต้องการใช้นโยบายด้านอุปสงค์เพื่อปิดช่องว่างให้พอดี ข้อใดถูกต้อง","choices":["ต้องยก AD ให้ตัด SRAS ตรงกับ LRAS พอดี หากกระตุ้นน้อยไปจะเหลือช่องว่างการหดตัว หากกระตุ้นมากไปจะพลิกเป็นช่องว่างเงินเฟ้อและดันระดับราคาขึ้นในระยะยาว","ต้องยก AD ให้มากที่สุดเท่าที่ทำได้เสมอ เพราะยิ่งผลผลิตสูงยิ่งดีต่อการจ้างงาน และเนื่องจาก SRAS เป็นเส้นแนวนอน ระดับราคาจะไม่ขยับขึ้นไม่ว่าจะกระตุ้นแรงเพียงใด","ไม่ต้องใช้นโยบายใดเลย เพราะเส้น LRAS เป็นแนวตั้งซึ่งจะดึงผลผลิตกลับมาที่ระดับการจ้างงานเต็มที่โดยอัตโนมัติและทันทีโดยไม่มีต้นทุนต่อการจ้างงานระหว่างทาง","ต้องใช้นโยบายด้านอุปทานแทน โดยเลื่อนเส้น LRAS ไปทางซ้ายให้มาบรรจบกับจุด B ซึ่งจะทำให้เศรษฐกิจกลับสู่ดุลยภาพระยะยาวได้โดยไม่ต้องเพิ่มอุปสงค์มวลรวมเลย"],"answer":0,"a":"เป้าหมายของนโยบายรักษาเสถียรภาพคือพาผลผลิตกลับมาที่ Y_FE ไม่ใช่ให้สูงที่สุด\nกระตุ้นน้อยไป — AD ใหม่ยังตัด SRAS ทางซ้ายของ LRAS ช่องว่างการหดตัวยังเหลืออยู่ การว่างงานตามวัฏจักรยังไม่หมด\nกระตุ้นพอดี — AD ตัด SRAS ตรงจุดที่ LRAS ผ่าน เศรษฐกิจกลับสู่ดุลยภาพระยะยาว\nกระตุ้นมากไป — AD ตัดทางขวาของ LRAS พลิกเป็นช่องว่างเงินเฟ้อ ตลาดแรงงานตึงเกินไป ค่าจ้างและต้นทุนถูกดันขึ้น SRAS เลื่อนขึ้น และในระยะยาวผลผลิตก็ถอยกลับมาที่ Y_FE อยู่ดี เหลือไว้เพียงระดับราคาที่สูงขึ้น\nความยากในทางปฏิบัติคือการประเมิน Y_FE ให้แม่นและความล่าช้าของนโยบาย ทำให้การจับขนาดพอดีเป็นเรื่องยากมาก","whys":["ถูกต้อง — ระบุเป้าหมายที่ถูกต้องและอธิบายต้นทุนของทั้งการกระตุ้นน้อยเกินไปและมากเกินไป","ไม่ถูกต้อง — SRAS เป็นแนวนอนเฉพาะระยะสั้น การกระตุ้นเกินจะดันผลผลิตเหนือศักยภาพจนค่าจ้างและราคาปรับขึ้นในที่สุด","ไม่ถูกต้อง — กลไกปรับตัวเองทำงานจริงแต่ช้ามาก เพราะค่าจ้างมีความหนืด ระหว่างทางมีต้นทุนเป็นการว่างงานที่ยืดเยื้อ","ไม่ถูกต้อง — การเลื่อน LRAS ไปทางซ้ายคือการทำให้ประเทศจนลง ไม่ใช่การแก้ปัญหา เป้าหมายคือดึงผลผลิตขึ้นไปหาศักยภาพ"],"tip":"จำเป้าหมายให้ถูก: นโยบายรักษาเสถียรภาพต้องการให้ผลผลิต เท่ากับ Y_FE ไม่ใช่ มากกว่า — กระตุ้นเกินคือการซื้อผลผลิตชั่วคราวด้วยราคาที่สูงถาวร","fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n  <defs>\n    <clipPath id=\"clipG\"><rect x=\"62\" y=\"26\" width=\"466\" height=\"318\"/></clipPath>\n    <marker id=\"arwG\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/>\n    </marker>\n  </defs>\n  <line x1=\"62\" y1=\"18\" x2=\"62\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <line x1=\"62\" y1=\"344\" x2=\"540\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <text x=\"52\" y=\"14\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">P</text>\n  <text x=\"548\" y=\"349\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Y</text><g clip-path=\"url(#clipG)\"><line x1=\"325.28999999999996\" y1=\"356.72\" x2=\"325.28999999999996\" y2=\"26\" stroke=\"var(--curve-lras)\" stroke-width=\"2.6\" /><line x1=\"34.040000000000006\" y1=\"200.9\" x2=\"555.96\" y2=\"200.9\" stroke=\"var(--curve-as)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"75.98\" y=\"191.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-as)\" text-anchor=\"start\">SRAS</text><line x1=\"-87.12\" y1=\"38.72000000000003\" x2=\"472.08\" y2=\"331.28\" stroke=\"var(--curve-ad)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"95.96\" y=\"123.36399999999998\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ad)\" text-anchor=\"start\">AD ปัจจุบัน</text><line x1=\"15.399999999999999\" y1=\"38.72000000000003\" x2=\"574.6\" y2=\"331.28\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\" stroke-dasharray=\"7 5\" stroke-linecap=\"round\"/><text x=\"291.67999999999995\" y=\"172.124\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ghost)\" text-anchor=\"start\">AD เป้าหมาย</text><circle cx=\"222.76999999999998\" cy=\"200.9\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"200.76999999999998\" y=\"188.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">B</text><circle cx=\"325.28999999999996\" cy=\"200.9\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"335.28999999999996\" y=\"216.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">A</text></g><text x=\"325.28999999999996\" y=\"17\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-lras)\" text-anchor=\"middle\">LRAS</text><text x=\"325.28999999999996\" y=\"366\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"middle\">Y<tspan dy=\"4\" font-size=\"11\">FE</tspan></text><text x=\"53\" y=\"205.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₁</text></svg><div class=\"figcap\">เป้าหมายคือดัน AD ให้ตัด SRAS ตรงกับ LRAS พอดี ไม่มากไม่น้อยกว่านั้น</div></div>"},{"id":"D31","type":"mcq","lvl":4,"topic":"AD-AS","ref":"แยกผลของ AD ออกจากผลของ AS ในข้อมูลจริง","q":"นักวิเคราะห์พบว่าในปีที่ผ่านมา ผลผลิตที่แท้จริงลดลง ขณะที่ระดับราคาลดลงเช่นกัน ข้อใดคือคำอธิบายที่สอดคล้องกับข้อมูลนี้มากที่สุด","choices":["เกิดจากเส้น AD เลื่อนไปทางซ้าย เพราะเมื่ออุปสงค์รวมหดตัว ทั้งผลผลิตและระดับราคาจะเคลื่อนไปในทิศทางเดียวกันคือลดลงทั้งคู่ตามการเคลื่อนที่ไปตามเส้นอุปทาน","เกิดจากเส้น SRAS เลื่อนขึ้น เพราะต้นทุนการผลิตที่สูงขึ้นทำให้ผู้ผลิตลดปริมาณการผลิตลง และการที่ผลผลิตลดลงย่อมทำให้ระดับราคาโดยรวมของระบบเศรษฐกิจลดลงตามไปด้วย","เกิดจากเส้น LRAS เลื่อนไปทางซ้าย เพราะศักยภาพการผลิตของประเทศที่ลดลงจะทำให้ทั้งผลผลิตและระดับราคาลดลงพร้อมกันในระยะยาวโดยไม่เกี่ยวกับอุปสงค์มวลรวมเลย","เกิดจากเส้น AD เลื่อนไปทางขวา เพราะอุปสงค์ที่เพิ่มขึ้นทำให้ผู้ผลิตแข่งขันกันผลิตมากขึ้นจนราคาสินค้าถูกลง และการแข่งขันที่รุนแรงทำให้ธุรกิจบางรายต้องปิดตัวจนผลผลิตรวมลดลง"],"answer":0,"a":"นี่คือทักษะสำคัญ — อ่านทิศทางของ P และ Y แล้วย้อนกลับไปหาว่าเส้นไหนเลื่อน\nกฎที่ใช้ได้เสมอ — ช็อกด้านอุปสงค์ทำให้ P และ Y เคลื่อนไปทางเดียวกัน ส่วนช็อกด้านอุปทานทำให้ P และ Y เคลื่อนไปคนละทาง\nในโจทย์นี้ทั้ง P และ Y ลดลงพร้อมกัน จึงเป็นลายเซ็นของAD เลื่อนซ้าย อย่างชัดเจน ซึ่งอาจมาจากความเชื่อมั่นที่ตกต่ำ การส่งออกที่หดตัว หรือนโยบายการเงินที่เข้มงวดเกินไป\nหมายเหตุ — ในกรอบ SRAS แนวนอนอย่างเคร่งครัด ราคาระยะสั้นจะไม่ขยับ การที่ราคาลดลงด้วยจึงบ่งชี้ว่าเวลาผ่านไปนานพอให้ SRAS เริ่มเลื่อนลงตามกลไกปรับตัวเองแล้ว","whys":["ถูกต้อง — ใช้กฎที่ว่าช็อกด้านอุปสงค์ทำให้ P กับ Y เคลื่อนไปทางเดียวกัน ซึ่งตรงกับข้อมูลที่ทั้งคู่ลดลง","ไม่ถูกต้อง — SRAS ที่เลื่อนขึ้นจะทำให้ระดับราคาสูงขึ้นพร้อมกับผลผลิตที่ลดลง ซึ่งขัดกับข้อมูลที่ราคาลดลง","ไม่ถูกต้อง — LRAS ที่เลื่อนซ้ายทำให้ผลผลิตลดลงแต่ระดับราคาสูงขึ้น เพราะอุปทานที่หายไปทำให้สินค้าหายากขึ้น","ไม่ถูกต้อง — AD ที่เลื่อนขวาทำให้ทั้งผลผลิตและระดับราคาเพิ่มขึ้น ซึ่งขัดกับข้อมูลทั้งสองตัวที่โจทย์ให้มา"],"tip":"กฎทองสำหรับอ่านข้อมูลย้อนกลับ: P กับ Y ไปทางเดียวกัน = ช็อกด้านอุปสงค์ · P กับ Y ไปคนละทาง = ช็อกด้านอุปทาน"},{"id":"D32","type":"mcq","lvl":4,"topic":"AD-AS","ref":"สังเคราะห์: จัดลำดับขนาดผลกระทบต่อ AD","q":"พิจารณาสี่เหตุการณ์ในประเทศที่การส่งออกคิดเป็น 60% ของ GDP และครัวเรือนมีหนี้สูงมาก — (1) ลดดอกเบี้ยนโยบาย 0.25% (2) คู่ค้าหลักทั้งหมดเข้าสู่ภาวะถดถอย (3) แจกเงินให้ครัวเรือนรายได้น้อยมูลค่า 0.2% ของ GDP (4) ราคาบ้านขึ้น 3% ข้อใดประเมินได้สมเหตุสมผลที่สุด","choices":["เหตุการณ์ (2) น่าจะมีผลต่อ AD มากที่สุดเพราะการส่งออกมีสัดส่วนสูงมากต่อ GDP ส่วนเหตุการณ์ (1) น่าจะมีผลน้อยเป็นพิเศษเพราะครัวเรือนที่มีหนี้สูงมักไม่ตอบสนองต่อดอกเบี้ยที่ลดลงเล็กน้อย","เหตุการณ์ (1) น่าจะมีผลต่อ AD มากที่สุดเพราะนโยบายการเงินส่งผ่านไปยังทั้งการลงทุน การบริโภค และการส่งออกสุทธิพร้อมกันสามช่องทาง จึงมีพลังเหนือกว่าปัจจัยอื่นทุกตัวเสมอ","เหตุการณ์ (3) น่าจะมีผลต่อ AD มากที่สุดเพราะครัวเรือนรายได้น้อยมีความโน้มเอียงหน่วยเพิ่มในการบริโภคสูงที่สุด ตัวคูณของมาตรการนี้จึงใหญ่กว่าผลของทุกเหตุการณ์ที่เหลือรวมกัน","ทั้งสี่เหตุการณ์มีผลต่อ AD ในขนาดที่ใกล้เคียงกัน เพราะแต่ละเหตุการณ์กระทบองค์ประกอบของอุปสงค์มวลรวมคนละตัว ซึ่งทุกองค์ประกอบมีน้ำหนักเท่ากันในสมการ Y = C + I + G + NX"],"answer":0,"a":"การประเมินขนาดต้องดูบริบทของเศรษฐกิจนั้น ไม่ใช่ท่องกฎตายตัว\nเหตุการณ์ (2) ใหญ่ที่สุด — เมื่อการส่งออกคิดเป็น 60% ของ GDP การที่คู่ค้าทั้งหมดถดถอยพร้อมกันย่อมกระทบ NX เป็นสัดส่วนมหาศาลของเศรษฐกิจ\nเหตุการณ์ (1) เล็กเป็นพิเศษ — การลด 0.25% เป็นขนาดที่เล็กอยู่แล้ว และในภาวะที่ครัวเรือนมีหนี้สูง คนมักมุ่งชำระหนี้มากกว่าจะกู้เพิ่ม ช่องทางการส่งผ่านจึงตัน\nเหตุการณ์ (3) มีตัวคูณสูงจริงเพราะ MPC ของกลุ่มเป้าหมายสูง แต่ฐานเพียง 0.2% ของ GDP จึงจำกัดขนาดผลรวม\nเหตุการณ์ (4) ผลทางความมั่งคั่งจาก 3% เป็นผลบวกแต่ค่อนข้างเล็กและกระจายตัวช้า","whys":["ถูกต้อง — ประเมินโดยดูทั้งขนาดของช็อกและบริบทเฉพาะของเศรษฐกิจนั้น ทั้งสัดส่วนการส่งออกและภาระหนี้ครัวเรือน","ไม่ถูกต้อง — นโยบายการเงินมีสามช่องทางจริง แต่ขนาด 0.25% เล็กมาก และภาระหนี้ที่สูงยังทำให้การส่งผ่านอ่อนแรงลงอีก","ไม่ถูกต้อง — ตัวคูณสูงจริง แต่ฐานเพียง 0.2% ของ GDP เล็กเกินกว่าจะเทียบกับช็อกที่กระทบภาคส่งออกซึ่งคิดเป็น 60% ของ GDP","ไม่ถูกต้อง — องค์ประกอบทั้งสี่มีสัดส่วนต่อ GDP ต่างกันมาก และขนาดของช็อกแต่ละตัวในโจทย์ก็ต่างกันหลายเท่า"],"tip":"ประเมินขนาดผลกระทบ ให้คูณสองอย่างเสมอ: ขนาดของช็อก × สัดส่วนขององค์ประกอบนั้นต่อ GDP แล้วปรับด้วยบริบทที่อาจทำให้การส่งผ่านตัน"},{"id":"S01","type":"mcq","lvl":2,"topic":"AD-AS","ref":"เหตุผลเบื้องหลังรูปร่างของ SRAS","q":"ในแบบจำลอง AD-AS ที่เส้น SRAS เป็นเส้นแนวนอน (ตามกรอบของ Abel, Bernanke & Croushore) ข้อใดคือเหตุผลเชิงเศรษฐศาสตร์ที่รองรับรูปร่างนี้","choices":["ในระยะสั้นราคาถูกตรึงไว้ด้วยสัญญาค่าจ้าง สัญญาซื้อขายล่วงหน้า และต้นทุนการเปลี่ยนป้ายราคา ผู้ผลิตจึงตอบสนองต่ออุปสงค์ด้วยปริมาณแทนที่จะปรับราคาขึ้นลงตามสถานการณ์","ในระยะสั้นผู้ผลิตทุกรายมีกำล
