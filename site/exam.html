<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ระบบฝึกข้อสอบเศรษฐศาสตร์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* เค้าโครง: หนังสือข้อสอบแนวตั้ง คอลัมน์เดียว แถบสถานะติดบน ตัวเลขและเวลาใช้ฟอนต์ mono */
:root{
  --bg:#f1f4f8; --surface:#ffffff; --surface2:#e8edf4; --ink:#101828; --muted:#566277; --line:#d3dbe6;
  --accent:#2144c7; --accent-ink:#ffffff; --accent-soft:#e1e8fb;
  --ok:#14774b; --ok-soft:#dcf2e6; --warn:#855600; --warn-soft:#faecc8; --bad:#b3261e; --bad-soft:#fae1de;
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai","Sarabun","Loma",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131c; --surface:#161d2a; --surface2:#1f2838; --ink:#e7ebf3; --muted:#9aa6ba; --line:#2b3649;
  --accent:#86a8ff; --accent-ink:#0b1226; --accent-soft:#1d2a4d;
  --ok:#52c68e; --ok-soft:#14301f; --warn:#e7a948; --warn-soft:#352810; --bad:#ff8c82; --bad-soft:#3a1816; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131c; --surface:#161d2a; --surface2:#1f2838; --ink:#e7ebf3; --muted:#9aa6ba; --line:#2b3649;
  --accent:#86a8ff; --accent-ink:#0b1226; --accent-soft:#1d2a4d;
  --ok:#52c68e; --ok-soft:#14301f; --warn:#e7a948; --warn-soft:#352810; --bad:#ff8c82; --bad-soft:#3a1816; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.7 var(--font-body);margin:0}
.wrap{max-width:880px;margin-inline:auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3{line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:1.65rem;font-weight:600} h2{font-size:1.15rem;font-weight:600;margin-block:28px 12px} h3{font-size:1rem;font-weight:600}
small,.muted{color:var(--muted)} .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 16px;min-height:40px}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.sm{padding:4px 12px;min-height:32px;font-size:.9rem} .btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-block:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:500 1.6rem/1.2 var(--font-mono)} .stat span{font-size:.85rem;color:var(--muted)}
.banner{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-block:16px}
.papers{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.paper .no{font:500 2rem/1 var(--font-mono);color:var(--accent)}
.pill{display:inline-block;font-size:.78rem;padding:0 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)} .item:first-child{border-top:0}
.item>div{min-width:0}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 64px;gap:10px;align-items:center;font-size:.92rem}
.bar i{display:block;height:10px;background:var(--surface2);border-radius:99px;overflow:hidden} .bar i b{display:block;height:100%;background:var(--accent)}
.bar i.low b{background:var(--bad)} .bar i.mid b{background:var(--warn)} .bar i.hi b{background:var(--ok)}
.bar span{text-align:right}
/* ข้อสอบ */
.exambar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:12px}
.exambar .row{justify-content:space-between}
#timer{font:500 1.35rem/1 var(--font-mono)} #timer.low{color:var(--bad)}
.nav:not([hidden]){display:grid}
.nav{grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.nv{min-height:36px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font:500 .85rem var(--font-mono);padding:0}
.nv.on{background:var(--accent-soft);border-color:var(--accent)} .nv.fl{box-shadow:inset 0 -3px 0 var(--warn)}
.confirm{margin-top:10px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:12px 14px}
.section{margin-block:24px 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap} .section h2{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-block:12px;scroll-margin-top:84px}
.q.ok{border-color:var(--ok)} .q.no{border-color:var(--bad)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:6px}
.qno{font:500 1rem var(--font-mono);color:var(--accent)}
.qtext{white-space:pre-line;overflow-wrap:anywhere;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--bg)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt input{margin-top:6px;accent-color:var(--accent)} .opt span{min-width:0;overflow-wrap:anywhere}
input.num,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:100%;max-width:100%}
input.num{max-width:14rem;font-family:var(--font-mono)} textarea{resize:vertical;min-height:6.5rem}
.sol{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.soltxt{white-space:pre-line;overflow-wrap:anywhere;border-left:3px solid var(--accent);padding-left:12px}
.note{font-size:.88rem;color:var(--warn);margin:8px 0 0}
.yours{background:var(--surface2);border-radius:8px;padding:8px 12px;white-space:pre-line;overflow-wrap:anywhere;margin-bottom:10px;font-size:.95rem}
.marks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:10px}
.marks .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-block:16px}
.score .big{font:500 3.2rem/1 var(--font-mono)} .score .big small{font-size:1.1rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-block:12px}
.tabs .btn.on{background:var(--accent-soft);border-color:var(--accent)}
.graph{margin:10px 0;max-width:340px} .graph svg{width:100%;height:auto;display:block;overflow:visible}
.graph .gax{stroke:var(--muted);stroke-width:1.5} .graph .gl-s{stroke:var(--bad);stroke-width:2} .graph .gl-d{stroke:var(--accent);stroke-width:2} .graph .gl-l{stroke:var(--ok);stroke-width:2}
.graph .gt{fill:var(--ink);font:11px var(--font-body)} .graph .gt-s{fill:var(--bad)} .graph .gt-d{fill:var(--accent)} .graph .gt-l{fill:var(--ok)} .graph .gp{fill:var(--ink)}
@media (max-width:520px){.score{grid-template-columns:1fr}.bar{grid-template-columns:1fr 56px}.bar i{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.conf{margin-bottom:8px} #suslist{font:.85rem/1.6 var(--font-mono)}
.gw{border:1px solid var(--line);border-radius:10px;padding:12px;margin-block:10px;background:var(--bg)}
.gwgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:16px;align-items:start;margin-top:8px}
.gwf{display:grid;gap:4px} .gwf label{font-size:.9rem;color:var(--muted);margin-top:6px}
.gwf select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0;max-width:100%}
.gwv .graph{margin:0}
.hint{background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin-block:10px;font-size:.93rem}
.hint .btn{margin-left:6px}
.calc{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.calc input.num{max-width:20rem;flex:1 1 12rem} .calc details{margin-top:6px;font-size:.9rem}
.aires{background:var(--surface2);border-radius:8px;padding:8px 12px;margin-top:8px}
.ai{margin-top:10px}
.note-t ul{padding-left:1.2em} .formula{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
@media (max-width:620px){.gwgrid{grid-template-columns:1fr}}

</style>
</head>

<div class="wrap" id="app"></div>
<script>

window.CONFIG = {

  minutes: 90,

  ],

window.SETS = [];
window.registerSet = s => window.SETS.push(s);

<script>
registerSet({
  id: 'fx-orig', title: 'อัตราแลกเปลี่ยน (ต้นฉบับ)', kind: 'original', exam: true, topic: 'อัตราแลกเปลี่ยน',
  source: 'PracticeExchangeRateThai.pdf (ผศ.ดร.ธนารักษ์ เหล่าสุทธิ) + สไลด์ Ch.13',

      graph: { type: 'fx', shift: 'S+' },
      a: 'นักลงทุนต้องขาย BBD เพื่อซื้อ USD ไปลงทุนในสหรัฐฯ → อุปทานของ BBD เพิ่ม (เส้น S เลื่อนขวา) → อัตราแลกเปลี่ยน e (USD ต่อ 1 BBD) ลดลง ค่าเงิน BBD อ่อนลง (depreciation) เช่น จาก 30 เป็นมากกว่า 30 BBD ต่อ 1 USD\nสินค้า BB ถูกลงสำหรับชาวต่างชาติ (real exchange rate ลด) → ส่งออกสุทธิเพิ่มขึ้น' },
    { id: 2, type: 'written', ref: 'แบบฝึกหัด ข้อ 2',
      q: 'ประเทศหนึ่งต้องการสนับสนุนการส่งออก นักเศรษฐศาสตร์เสนอให้รัฐบาลยกเว้นภาษีส่งออก นโยบายนี้ช่วยเพิ่มการส่งออกได้หรือไม่ อย่างไร? วาดรูปพร้อมอธิบายกลไกอัตราแลกเปลี่ยน',
      graph: { type: 'fx', shift: 'D+' },
      a: 'ยกเว้นภาษีส่งออก → สินค้าส่งออกขายได้กำไรมากขึ้น/ราคาถูกลง → อุปสงค์ต่างชาติต่อสินค้าในประเทศเพิ่ม → อุปสงค์ต่อเงินสกุลในประเทศเพิ่ม (D เลื่อนขวา) → ค่าเงินแข็งขึ้น (appreciation)\nค่าเงินแข็งทำให้สินค้าแพงขึ้นสำหรับต่างชาติ (real exchange rate เพิ่ม) จึงหักล้างผลบางส่วน ผลสุทธิ: ปริมาณส่งออกเพิ่มได้ แต่น้อยกว่าที่คาดถ้าไม่คิดผลของอัตราแลกเปลี่ยน' },
    { id: 3, type: 'written', ref: 'แบบฝึกหัด ข้อ 3',
      q: 'ถ้าสหรัฐฯ ขึ้นอัตราภาษีสินค้านำเข้า อัตราแลกเปลี่ยนและการส่งออกของไทยควรเปลี่ยนแปลงอย่างไร? อธิบายพร้อมวาดกราฟ',
      graph: { type: 'fx', shift: 'D-' },
      a: 'สินค้าไทยในสหรัฐฯ แพงขึ้น → สหรัฐฯ นำเข้าจากไทยลดลง → อุปสงค์ต่อเงินบาทลดลง (D เลื่อนซ้าย) → บาทอ่อนค่า (depreciation) อัตราแลกเปลี่ยน e ลดลง\nบาทอ่อนช่วยให้สินค้าไทยถูกลงบางส่วน แต่ผลสุทธิการส่งออกของไทยไปสหรัฐฯ ลดลง' },
    { id: 4, type: 'written', ref: 'แบบฝึกหัด ข้อ 4',
      q: 'อัตราแลกเปลี่ยน (Nominal Exchange Rate) และอัตราแลกเปลี่ยนที่แท้จริง (Real Exchange Rate) เหมือนหรือแตกต่างกันอย่างไร? ยกตัวอย่างประกอบ',
      a: 'Nominal (e_nom) = จำนวนเงินตราต่างประเทศที่แลกได้ด้วยเงินในประเทศ 1 หน่วย (เช่น 110 เยนต่อ 1 ดอลลาร์)\nReal (e) = e_nom × P / P_for = ราคาสินค้าในประเทศเทียบกับสินค้าต่างประเทศ (แลกสินค้าต่างประเทศได้กี่หน่วยต่อสินค้าในประเทศ 1 หน่วย)\nตัวอย่าง: e_nom = 110 เยน/ดอลลาร์ แฮมเบอร์เกอร์โตเกียว 1,100 เยน นิวยอร์ก 2 ดอลลาร์ → e = 110 × 2 / 1,100 = 0.2 แฮมเบอร์เกอร์ญี่ปุ่นต่อแฮมเบอร์เกอร์สหรัฐฯ\nต่างกันที่ real หักผลของระดับราคาแล้ว จึงใช้บอกความสามารถในการแข่งขันได้' },
    { id: 5, type: 'calc', ref: 'แบบฝึกหัด ข้อ 5', expr: '800*1000/160000', answer: 5, tol: 0.01,
      q: 'ข้าวไทย 1 ถัง ราคา 1,000 บาท ข้าวเวียดนาม 1 ถัง ราคา 160,000 ดอง อัตราแลกเปลี่ยน 800 ดอง = 1 บาท จงหาอัตราแลกเปลี่ยนที่แท้จริงของไทย (ตอบเป็นตัวเลข)',
      a: 'e = e_nom × P / P_for = 800 × 1,000 / 160,000 = 5\n(ตรวจ: ข้าวเวียดนามเป็นเงินบาท = 160,000/800 = 200 บาท → 1,000/200 = 5) ข้าวไทยแพงกว่าข้าวเวียดนาม 5 เท่า' },
    { id: 6, type: 'mcq', ref: 'แบบฝึกหัด ข้อ 6', choices: ['จีน', 'ญี่ปุ่น'], answer: 1,
      q: '1 บาท = 1.50 หยวน และ 1 บาท = 0.80 เยน CPI ไทย = 100, จีน = 180, ญี่ปุ่น = 80 ท่านต้องการไปเที่ยวประเทศจีนหรือญี่ปุ่น?',

  ],

<script>
// แบบฝึกหัด AD-AS (PracticeAD_AS_Model_Thai.pdf) — เฉลยตามแบบจำลองในสไลด์ Abel Ch.9:
// ระยะสั้นราคาคงที่ (SRAS แนวนอน) ระยะยาว LRAS แนวตั้ง
const SR = 'ระยะสั้น: ราคาคงที่ (SRAS แนวนอน) ผลผลิตเปลี่ยนตามอุปสงค์\n';
const LR = 'ระยะยาว: ผลผลิตกลับสู่ระดับการจ้างงานเต็มที่ (LRAS) ส่วนระดับราคาปรับตัว (SRAS เลื่อนจนตัดที่จุดใหม่)\n';
registerSet({
  id: 'adas-orig', title: 'AD-AS (ต้นฉบับ)', kind: 'original', exam: true, topic: 'AD-AS',
  source: 'PracticeAD_AS_Model_Thai.pdf + สไลด์ Abel Ch.9',

  add('จากแผนภาพโครงสร้างประชากร ประชากรทั้งประเทศ 65.72 ล้านคน อายุต่ำกว่า 15 ปี 10.06 ล้านคน ผู้อยู่ในกำลังแรงงานมีกี่ล้านคน', '38.86 ล้านคน', ['55.66 ล้านคน', '16.80 ล้านคน', '38.46 ล้านคน'], 44, 'ผู้มีงานทำ 38.46 + ผู้ว่างงาน 0.36 + ผู้รอฤดูกาล 0.04 = 38.86');

// ระดับความยาก 1 = ง่าย (นิยาม/ขั้นเดียว), 2 = ปานกลาง (ประยุกต์/หลายขั้น), 3 = ยาก (ผสมแนวคิด/ตัวเลือกใกล้กัน)

(() => {
  const byId = {
    'ch45-mcq': { 2: [2, 6, 7, 8, 9, 17, 19, 21, 23, 24, 26, 27, 29, 31, 35, 36, 38, 49, 51, 52, 53, 54, 55, 59, 60, 64, 65], 3: [34] },

    'fm-extra': { 1: [4], 2: [1, 2, 3] },
    'gen-fm': { 2: [1, 2, 3, 5, 6], 3: [4, 7] },
  };
  const byRule = {
    'gen-mcq': q => q.lvl || (/แห่งที่สอง/.test(q.q) ? 3 : /สำรองตามกฎหมายคือ|มีผู้ว่างงานกี่คน|ปริมาณเงินรวมสูงสุด|แห่งแรก/.test(q.q) ? 2 : 1),

    'gen-adas': () => 2,
    'ch45-mcq': () => 1,
  };
  for (const s of window.SETS) for (const q of s.questions) {
    if (q.lvl) continue;
    const m = byId[s.id]; if (m) for (const [l, ids] of Object.entries(m)) if (ids.includes(q.id)) q.lvl = +l;

<script>
// สร้างชุดสอบตามระดับ: ไล่หยิบจากสำรับที่สับแบบ seed คงที่ (ชุดเดิมได้ข้อเดิมทุกครั้ง ภายในชุดไม่ซ้ำ ข้ามชุดซ้ำน้อยที่สุด)
(() => {
  const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const shuffle = (a, r) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const C = window.CONFIG, all = window.SETS.flatMap(s => s.questions.map(q => ({ set: s, q })));
  const topic = i => i.q.topic || i.set.topic, decks = {};
  const take = (name, pool, n) => { // หยิบ n ข้อต่อเนื่องจากสำรับ วนกลับเมื่อหมด
    if (pool.length < n) throw new Error(`pool ${name} มี ${pool.length} ข้อ ไม่พอ ${n}`);
    const d = decks[name] ??= { cards: shuffle(pool, rng(name.length * 977 + pool.length)), i: 0 };
    return Array.from({ length: n }, () => d.cards[d.i++ % d.cards.length]);
  };
  const mcq = l => all.filter(i => i.set.mcqPool && i.q.type === 'mcq' && i.q.lvl === l);
  const written = (t, ls) => all.filter(i => i.set.exam && i.q.type === 'written' && topic(i) === t && ls.includes(i.q.lvl));
  const first = x => topic(x) === 'การว่างงาน' ? 0 : 1;
  let n = 0;
  window.PAPERS = C.levels.flatMap((L, li) => Array.from({ length: L.papers }, () => {
    n++;
    const m = Object.entries(L.mcq).flatMap(([l, k]) => take('mcq' + l, mcq(+l), k)).sort((a, b) => first(a) - first(b));
    const w = Object.entries(C.writtenByTopic).flatMap(([t, k]) => take('w' + t + L.written, written(t, L.written), k));
    return { id: 'p' + n, n, level: li, levelName: L.name, title: 'ชุดที่ ' + n, items: [...m, ...w] };
  }));
})();

</script>

(() => {
  const L = (x1, y1, x2, y2, c, d) => `<line class="${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${d ? 'stroke-dasharray="5 4"' : ''}/>`;
  const T = (x, y, v, c) => `<text class="gt ${c || ''}" x="${x}" y="${y}">${v}</text>`;
  const P = (x, y, v) => `<circle class="gp" cx="${x}" cy="${y}" r="3.2"/>` + T(x + 6, y - 6, v);
  // shifts: ['S+','D-',...] (+ = ขวา) ; เส้น S: y = 180 - 0.7(x-50-ds), D: y = 40 + 0.7(x-50-dd)
  function fx(g) {
    const sh = g.shifts || [g.shift], ds = sh.includes('S+') ? 40 : sh.includes('S-') ? -40 : 0, dd = sh.includes('D+') ? 40 : sh.includes('D-') ? -40 : 0;
    const S = o => L(50 + o, 180, 250 + o, 40, 'gl-s', o), D = o => L(50 + o, 40, 250 + o, 180, 'gl-d', o);
    const x2 = 150 + (ds + dd) / 2, y2 = 110 + .35 * (ds - dd);
    return `<svg viewBox="0 0 300 232" role="img" aria-label="กราฟตลาดเงินตรา">${L(50, 22, 50, 200, 'gax') + L(50, 200, 292, 200, 'gax')}${S(0)}${D(0)}${ds ? S(ds) : ''}${dd ? D(dd) : ''}
    ${T(54, 15, 'e (เงินตราต่างประเทศ/เงินในประเทศ)')}${T(150, 220, 'ปริมาณเงินในประเทศ')}${T(252, 40, 'S', 'gt-s')}${T(252, 190, 'D', 'gt-d')}${ds ? T(252 + ds, 40, 'S′', 'gt-s') : ''}${dd ? T(252 + dd, 190, 'D′', 'gt-d') : ''}${P(150, 110, 'E₁')}${P(x2, y2, 'E₂')}</svg>`;
  }
  // ad / lras: ระยะเลื่อนของ AD / LRAS (+ = ขวา) ตามสไลด์: SRAS แนวนอน LRAS แนวตั้ง; AD: y = 110 + 0.7(x-150-ad)
  function adas(g) {
    const ad = g.ad || 0, lr = g.lras || 0, eq = lr ? [150 + lr, 110 + .7 * (lr - ad)] : [150, 110 - .7 * ad];
    const A = o => L(60 + o, 40, 240 + o, 180, 'gl-d', o), SR = y => L(60, y, 262, y, 'gl-s', y !== 110);
    return `<svg viewBox="0 0 300 232" role="img" aria-label="กราฟ AD-AS">${L(50, 22, 50, 200, 'gax') + L(50, 200, 292, 200, 'gax')}
    ${A(0)}${ad ? A(ad) : ''}${L(150, 30, 150, 200, 'gl-l')}${lr ? L(150 + lr, 30, 150 + lr, 200, 'gl-l', 1) : ''}${SR(110)}${lr || ad ? SR(Math.round(eq[1])) : ''}
    ${T(54, 15, 'P (ระดับราคา)')}${T(190, 220, 'Y (ผลผลิตจริง)')}${T(236, 178, 'AD', 'gt-d')}${ad ? T(236 + ad, 178, 'AD′', 'gt-d') : ''}${T(152, 26, 'LRAS', 'gt-l')}${lr ? T(152 + lr, 26, 'LRAS′', 'gt-l') : ''}${T(266, 106, 'SRAS', 'gt-s')}
    ${P(150, 110, 'E₁')}${!lr && ad ? P(150 + ad, 110, 'E₂') : ''}${P(Math.round(eq[0]), Math.round(eq[1]), lr ? 'E₂' : 'E₃')}</svg>`;
  }
  window.graphSvg = g => g ? `<figure class="graph">${g.type === 'fx' ? fx(g) : adas(g)}</figure>` : '';
  // ข้อเขียนกราฟ: ผู้เรียนเลือกเส้นที่เลื่อนและผลลัพธ์ ระบบวาดกราฟจากคำตอบและตรวจกับค่าที่ได้จากสเปกกราฟของเฉลย
  const sg = x => x > 0 ? '+' : x < 0 ? '-' : '0';
  const SHIFT = [['0', 'ไม่เลื่อน'], ['+', 'เลื่อนขวา'], ['-', 'เลื่อนซ้าย']], DIR = [['+', 'เพิ่มขึ้น'], ['-', 'ลดลง'], ['0', 'เท่าเดิม']];
  const kit = window.graphKit = {
    fields: g => g.type === 'fx'
      ? [['S', 'เส้นอุปทานเงินสกุลในประเทศ (S)', SHIFT], ['D', 'เส้นอุปสงค์เงินสกุลในประเทศ (D)', SHIFT], ['e', 'อัตราแลกเปลี่ยน e ที่ดุลยภาพใหม่', [['+', 'เพิ่มขึ้น (แข็งค่า)'], ['-', 'ลดลง (อ่อนค่า)']]]]
      : [['AD', 'เส้น AD', SHIFT], ['LRAS', 'เส้น LRAS', SHIFT], ['srY', 'ผลผลิต Y ระยะสั้น', DIR], ['lrY', 'ผลผลิต Y ระยะยาว', DIR], ['lrP', 'ระดับราคา P ระยะยาว', [...DIR, ['?', 'ไม่แน่นอน']]]],
    expect(g) {
      if (g.type === 'fx') { const sh = g.shifts || [g.shift], S = sh.includes('S+') ? '+' : sh.includes('S-') ? '-' : '0', D = sh.includes('D+') ? '+' : sh.includes('D-') ? '-' : '0'; return { S, D, e: D === '+' || S === '-' ? '+' : '-' }; }
      const a = Math.sign(g.ad || 0), l = Math.sign(g.lras || 0);
      return { AD: sg(a), LRAS: sg(l), srY: sg(a), lrY: sg(l), lrP: !l ? sg(a) : !a ? sg(-l) : a !== l ? sg(a) : '?' };
    },
    score(g, v) { const ex = kit.expect(g), F = Object.keys(ex); return F.filter(f => (v || {})[f] === ex[f]).length / F.length; },
    draw(g, v) { v = v || {}; const d = x => x === '+' ? 40 : x === '-' ? -40 : 0;
      return g.type === 'fx' ? window.graphSvg({ type: 'fx', shifts: [d(v.S) ? 'S' + v.S : '', d(v.D) ? 'D' + v.D : ''].filter(Boolean) }) : window.graphSvg({ type: 'adas', ad: d(v.AD), lras: d(v.LRAS) }); },
  };
})();

// เครื่องคิดเลข: + - * / ^ ( ) % (ไม่ใช้ eval)
function calc(src) {
  const s = src.replace(/×/g, '*').replace(/÷/g, '/').replace(/,/g, ''); let i = 0;
  const sk = () => { while (s[i] === ' ') i++; }, fail = () => { throw new Error('bad'); };
  const num = () => { sk(); const m = /^\d*\.?\d+/.exec(s.slice(i)); if (!m) fail(); i += m[0].length; return +m[0]; };
  const atom = () => { sk(); if (s[i] === '(') { i++; const v = expr(); sk(); if (s[i++] !== ')') fail(); return post(v); } if (s[i] === '-') { i++; return -atom(); } return post(num()); };
  const post = v => { sk(); if (s[i] === '%') { i++; return v / 100; } return v; };
  const pow = () => { const b = atom(); sk(); if (s[i] === '^') { i++; return b ** pow(); } return b; };
  const term = () => { let v = pow(); for (;;) { sk(); if (s[i] === '*') { i++; v *= pow(); } else if (s[i] === '/') { i++; v /= pow(); } else return v; } };
  const expr = () => { let v = term(); for (;;) { sk(); if (s[i] === '+') { i++; v += term(); } else if (s[i] === '-') { i++; v -= term(); } else return v; } };
  const v = expr(); sk(); if (i < s.length || !isFinite(v)) fail(); return v;
}
window.__calc = calc;

  const p = paperOf(att.paper), rows = p.items.map((it, n) => {
    const k = key(it), v = att.ans[k];
    if (it.q.type === 'written') { const m = att.marks[k] ?? null, g = hasG(it.q) ? GK.score(it.q.graph, att.ans[k + '#g']) : null;

}

    <div class="item"><span>ส่วน ข ข้อเขียน (${Object.entries(C.writtenByTopic).map(([t, n]) => t + ' ' + n).join(', ')})</span><b class="mono">${w} ข้อ × ${C.writtenPoints} = ${w * C.writtenPoints} คะแนน</b></div>
    <div class="item"><span>เวลา</span><b class="mono">${C.minutes} นาที</b></div></div>
    <ul><li>ข้อกาตรวจให้อัตโนมัติ ลำดับตัวเลือกสุ่มใหม่ทุกครั้งที่ทำ</li><li>ข้อเขียนที่มีกราฟ: เลือกเส้นที่เลื่อนและผลลัพธ์ ระบบตรวจกราฟให้ (${C.graphShare * 100}% ของข้อ) แล้วพิมพ์คำอธิบาย</li><li>หลังส่ง ดูเฉลยแล้วประเมินคำอธิบายเอง หรือให้ Claude ตรวจ (เมื่อเปิดใน claude.ai)</li><li>มีเครื่องคิดเลขและแผ่นสูตรในแถบด้านบน</li><li>ทำค้างไว้ได้ ระบบเก็บฉบับร่างและเวลาที่เหลือ</li><li>คะแนนต่อข้อและเวลาเป็นค่าตั้งต้น ยังไม่ได้ยืนยันกับ outline จริง</li></ul>
    <button class="btn primary" data-act="start">เริ่มจับเวลา</button>`;
  },
  exam() {
    const p = S.paper; let part = '';
    return `<div class="exambar"><div class="row"><b>${p.title}</b><span id="timer" class="mono"></span><span class="row"><small id="prog" class="mono"></small><button class="btn sm" data-act="nav">เลขข้อ</button><button class="btn sm" data-act="calc">เครื่องคิดเลข</button><button class="btn primary sm" data-act="ask">ส่งข้อสอบ</button></span></div>
    <div class="nav" id="navbox" hidden>${p.items.map((it, n) => `<button class="nv" id="nv${n}" data-act="jump" data-n="${n}" aria-label="ไปข้อ ${n + 1}">${n + 1}</button>`).join('')}</div><div class="calc" id="calcbox" hidden><div class="row"><input id="calcin" class="num" inputmode="decimal" autocomplete="off" placeholder="เช่น 100/0.1 หรือ 60/(300/150)" aria-label="นิพจน์"><b id="calcout" class="mono"></b></div><details><summary>สูตรที่ใช้บ่อย</summary><ul>${NOTES.topics.flatMap(t => t.formulas).map(f => `<li>${esc(f)}</li>`).join('')}</ul></details></div><div class="confirm" id="confirm" hidden></div></div>
    ${p.items.map((it, n) => { const sec = it.q.type === 'written' ? 'ส่วน ข ข้อเขียน' : 'ส่วน ก ข้อกา', h = sec !== part ? `<div class="section"><h2>${sec}</h2><small>${it.q.type === 'written' ? 'พิมพ์ร่างคำตอบ แล้วเทียบเฉลยหลังส่งข้อสอบ' : 'เลือกคำตอบที่ถูกที่สุด'}</small></div>` : ''; part = sec;
      return h + `<div class="q" id="q${n}">${head(it, n, `<button class="btn sm" data-act="flag" data-k="${esc(key(it))}" id="fl${n}" style="margin-left:auto">ทำเครื่องหมายไว้</button>`)}<div class="qtext">${esc(it.q.q)}</div>${qGraph(it)}${inputHtml(it, n, S.ans[key(it)], S.perm[key(it)])}</div>`; }).join('')}
    <div class="row" style="margin-top:20px"><button class="btn primary" data-act="ask">ส่งข้อสอบ</button></div>`;
  },
  result() {
    const a = S.att, p = paperOf(a.paper), g = grade(a), ts = topicStats(g.rows), f = S.filter || 'all', h = history();
    const mcq = g.rows.filter(r => r.it.q.type !== 'written'), okN = mcq.filter(r => r.ok).length, miss = g.rows.filter(r => r.frac !== 1).length;
    const rows = g.rows.filter(r => f === 'all' || (f === 'miss' ? r.frac !== 1 : r.it.q.type === 'written'));
    return `<button class="btn sm" data-act="home">← หน้าแรก</button><h1 style="margin-top:12px">ผลสอบ ${p.title} <small class="muted">· ระดับ${p.levelName}</small></h1>
    <div class="score"><div class="big">${Math.round(g.got * 10) / 10}<small>/${g.max}</small></div><div><b>ข้อกา ${okN}/${mcq.length} ข้อ</b><br><span class="muted">ข้อเขียน ${g.pending ? `ยังไม่ประเมิน ${g.pending} ข้อ (เลื่อนลงไปดูเฉลยแล้วกดประเมินตัวเอง)` : 'ประเมินครบแล้ว'}</span><br><small>ใช้เวลา ${mm(Math.round(a.dur))} จาก ${C.minutes}:00 นาที</small></div></div>
    <h2>คะแนนตามหัวข้อ</h2><div class="bars">${Object.entries(ts).map(([t, o]) => bar(t, o.s / o.n, o.n)).join('')}</div>
    <div class="row" style="margin-top:20px"><button class="btn primary" data-act="retry" ${miss ? '' : 'disabled'}>ฝึกข้อที่ยังไม่ได้ (${miss} ข้อ)</button><button class="btn" data-act="intro" data-p="${p.id}">ทำชุดนี้อีกครั้ง</button><button class="btn" data-act="home">เลือกชุดอื่น</button></div>
    <h2>เฉลยรายข้อ</h2><div class="tabs">${[['all', 'ทั้งหมด'], ['miss', 'ข้อที่ผิด/ยังไม่ได้'], ['written', 'ข้อเขียน']].map(([v, t]) => `<button class="btn sm ${f === v ? 'on' : ''}" data-act="filter" data-v="${v}">${t}</button>`).join('')}</div>
    ${rows.map(r => reviewCard(r, a, h[r.k])).join('') || '<p class="muted">ไม่มีข้อในกลุ่มนี้</p>'}`;
  },
  notes() {
    return `<button class="btn sm" data-act="home">← กลับ</button><h1 style="margin-top:12px">สรุปก่อนสอบ</h1><p class="muted">เรียบเรียงจากสไลด์ บท 4-5, Abel Ch.9 และ Ch.13 ข้อที่เกินสไลด์ระบุไว้ในวงเล็บ</p>
    <div class="tabs">${NOTES.topics.map(t => `<a class="btn sm" href="#t-${t.id}">${esc(t.title)}</a>`).join('')}</div>
    ${NOTES.topics.map(t => `<section class="note-t" id="t-${t.id}"><h2>${esc(t.title)}</h2><ul>${t.body.map(x => `<li>${esc(x)}</li>`).join('')}</ul><div class="formula"><b>สูตร</b><ul>${t.formulas.map(x => `<li class="mono">${esc(x)}</li>`).join('')}</ul></div></section>`).join('')}
    <h2>สรุปรายหน้าสไลด์ (บท 4-5)</h2><div class="list">${Object.entries(NOTES.pages).map(([p, x]) => `<div class="item"><div><b class="mono">หน้า ${p}</b><br><small>${esc(x)}</small></div></div>`).join('')}</div>`;
  },
  practice() {
    return `<button class="btn sm" data-act="home">← กลับ</button><h1 style="margin-top:12px">${esc(S.title)}</h1><p class="muted">${S.items.length} ข้อ · <span id="pscore" class="mono"></span></p>
    ${S.items.map((it, n) => `<div class="q" id="q${n}">${head(it, n)}<div class="qtext">${esc(it.q.q)}</div>${qGraph(it)}${inputHtml(it, n, undefined, S.perm[key(it)])}<div class="row act" style="margin-top:10px"><button class="btn sm" data-act="${it.q.type === 'written' ? 'show' : 'check'}" data-n="${n}">${it.q.type === 'written' ? 'ดูเฉลย' : 'ตรวจ'}</button></div><div id="fb${n}"></div></div>`).join('')}`;
  },
};
const bar = (t, r, n) => `<div class="bar"><span>${esc(t)}</span><i class="${r >= .7 ? 'hi' : r >= .5 ? 'mid' : 'low'}"><b style="width:${Math.round(r * 100)}%"></b></i><span class="mono">${Math.round(r * 100)}% <small>(${n})</small></span></div>`;
function reviewCard(r, a, hist) {
  const q = r.it.q, w = q.type === 'written', st = w ? (r.frac === null ? ['warn', 'รอประเมินคำอธิบาย'] : r.frac >= 1 ? ['ok', 'ได้เต็ม'] : r.frac > 0 ? ['warn', `ได้ ${Math.round(r.frac * 100)}%`] : ['bad', 'ยังไม่ได้']) : r.v === undefined || r.v === '' ? ['bad', 'ไม่ได้ตอบ'] : r.ok ? ['ok', 'ถูก'] : ['bad', 'ผิด'];
  const mine = w ? (r.v ? `<div class="yours"><small>คำตอบของคุณ</small><br>${esc(r.v)}</div>` : '<p class="muted">ไม่ได้พิมพ์คำตอบ</p>') : q.type === 'calc' ? `<div class="yours">คำตอบของคุณ: ${esc(r.v ?? '-')} · เฉลย: ${esc(q.answer)}</div>` : '';
  const gpart = hasG(q) ? graphWidget(r.it, r.n, a.ans[r.k + '#g'], true) + `<p class="muted"><small>คะแนนกราฟ ${Math.round(r.g * 100)}% (คิดเป็น ${C.graphShare * 100}% ของข้อ ส่วนที่เหลือมาจากคำอธิบาย)</small></p>` : '';
  const track = hist && hist[1] > 1 ? `<small class="muted">ทำข้อนี้มาแล้ว ${hist[1]} ครั้ง ได้ ${Math.round(hist[0] / hist[1] * 100)}%</small>` : '';
  return `<div class="q ${w ? '' : r.ok ? 'ok' : 'no'}" id="rq${r.n}">${head(r.it, r.n, `<span class="pill ${st[0]}" style="margin-left:auto">${st[1]}</span>`)}${track}<div class="qtext">${esc(q.q)}</div>${qGraph(r.it)}${q.type === 'mcq' ? optsHtml(r.it, 'r' + r.n, r.v, true, (a.perm || {})[r.k]) : mine}${gpart}${r.frac !== 1 ? hintHtml(r.it) : ''}${solHtml(r.it)}${w && r.v ? aiBlock(r.k, r.n, (a.ai || {})[r.k]) : ''}${w ? marksHtml(r.k, (a.marks || {})[r.k] ?? null, 'mark') : ''}</div>`;
}

// ----- การเปลี่ยนหน้า
function go(v, extra = {}) { clearInterval(timer); S = Object.assign({ view: v }, extra); root.innerHTML = views[v](); const f = S.focus && document.getElementById('t-' + S.focus); f ? f.scrollIntoView() : window.scrollTo(0, 0); if (v === 'exam') startTimer(); if (v === 'practice') pscore(); }
const rerender = () => { const y = scrollY; root.innerHTML = views[S.view](); scrollTo(0, y); };
function startTimer() {
  paint(); const tick = () => { const left = Math.round((S.endAt - Date.now()) / 1000), el = document.getElementById('timer'); if (!el) return; el.textContent = mm(Math.max(0, left)); el.classList.toggle('low', left < 300); if (left <= 0) finish(); };
  tick(); timer = setInterval(tick, 1000);
}
function paint() { // ปรับแถบเลขข้อและปุ่มธง โดยไม่วาดหน้าใหม่ (ไม่ให้ช่องพิมพ์เสียโฟกัส)
  let done = 0; S.paper.items.forEach((it, n) => { const k = key(it), v = S.ans[k], gv = S.ans[k + '#g'], on = (v !== undefined && String(v).trim() !== '') || !!(gv && Object.values(gv).some(Boolean)); if (on) done++;
    const b = document.getElementById('nv' + n); b.classList.toggle('on', on); b.classList.toggle('fl', !!S.flags[k]); document.getElementById('fl' + n).textContent = S.flags[k] ? 'ยกเลิกเครื่องหมาย' : 'ทำเครื่องหมายไว้'; });
  document.getElementById('prog').textContent = done + '/' + S.paper.items.length;
}
const draft = () => { DB.draft = { paper: S.paper.id, ans: S.ans, flags: S.flags, perm: S.perm, endAt: S.endAt }; save(); };
function finish() {
  const att = { id: Date.now(), paper: S.paper.id, ts: Date.now(), dur: Math.min(C.minutes * 60, C.minutes * 60 - (S.endAt - Date.now()) / 1000), ans: S.ans, perm: S.perm, marks: {} };
  DB.attempts.push(att); DB.draft = null; syncWrong(grade(att).rows); go('result', { att });
}
const practice = (title, items) => go('practice', { title, items, perm: makePerm(items), res: {} });
const pscore = () => { const el = document.getElementById('pscore'); if (!el) return; const v = Object.values(S.res || {}); el.textContent = `ตอบถูก ${v.filter(Boolean).length}/${v.length} ที่ทำแล้ว`; };

// ----- ตัวจัดการเหตุการณ์
root.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'calcin') { let out = ''; if (t.value.trim()) try { out = '= ' + (+calc(t.value).toFixed(6)).toLocaleString('en-US', { maximumFractionDigits: 6 }); } catch { out = 'นิพจน์ไม่ถูกต้อง'; } document.getElementById('calcout').textContent = out; return; }
  if (t.dataset.g) { const store = S.view === 'exam' ? S.ans : (S.gans ||= {}), gk = S.view === 'exam' ? t.dataset.g + '#g' : t.dataset.g, v = store[gk] = Object.assign({}, store[gk], { [t.dataset.f]: t.value }), it = (S.paper ? S.paper.items : S.items)[+t.dataset.n];
    document.getElementById('gv' + t.dataset.n).innerHTML = GK.draw(it.q.graph, v); if (S.view === 'exam') { draft(); paint(); } return; }
  const k = t.dataset.k; if (!k || S.view !== 'exam') return;
  S.ans[k] = e.target.type === 'radio' ? +e.target.value : e.target.value; draft(); paint();
});
root.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset, act = d.act, n = +d.n;
  if (act === 'home') go('home');
  else if (act === 'intro') go('intro', { paper: paperOf(d.p) });
  else if (act === 'start') { go('exam', { paper: S.paper, ans: {}, flags: {}, perm: makePerm(S.paper.items), endAt: Date.now() + C.minutes * 60000 }); draft(); }
  else if (act === 'resume') { const p = paperOf(DB.draft.paper); go('exam', { paper: p, ans: DB.draft.ans, flags: DB.draft.flags, perm: DB.draft.perm || makePerm(p.items), endAt: DB.draft.endAt }); }
  else if (act === 'drop') { DB.draft = null; save(); go('home'); }
  else if (act === 'last') go('result', { att: DB.attempts.filter(a => a.paper === d.p).slice(-1)[0] });
  else if (act === 'calc') { const c = document.getElementById('calcbox'); c.hidden = !c.hidden; if (!c.hidden) document.getElementById('calcin').focus(); }
  else if (act === 'notes') go('notes', { focus: d.t });
  else if (act === 'gpractice') practice('ฝึกวาดกราฟ (ข้อเขียนที่มีกราฟทั้งหมด)', allItems().filter(it => it.set.exam && hasG(it.q)));
  else if (act === 'ai') { const k = d.k, out = document.getElementById('ai' + n);
    const it = S.view === 'result' ? grade(S.att).rows.find(r => r.k === k).it : S.items[n], text = S.view === 'result' ? S.att.ans[k] : (document.getElementById('in' + n) || {}).value || '';
    if (!String(text).trim()) { out.textContent = 'พิมพ์คำอธิบายก่อน แล้วค่อยให้ Claude ตรวจ'; return; }
    b.disabled = true; aiGrade(it, String(text), out).then(r => { b.disabled = false; if (!r) return;
      if (S.view === 'result') { (S.att.ai ||= {})[k] = r; S.att.marks[k] = r.score; syncWrong(grade(S.att).rows); save(); rerender(); }
      else { out.innerHTML = aiView(r); setWrong(k, r.score === 1); const mk = document.querySelector(`#fb${n} .marks`); if (mk) mk.querySelectorAll('.btn').forEach(x => x.classList.toggle('on', +x.dataset.v === r.score)); } }); }
  else if (act === 'nav') { const nb = document.getElementById('navbox'); nb.hidden = !nb.hidden; }
  else if (act === 'jump') { document.getElementById('navbox').hidden = true; document.getElementById('q' + n).scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (act === 'flag') { S.flags[d.k] = !S.flags[d.k]; draft(); paint(); }
  else if (act === 'ask') { const un = S.paper.items.filter(it => { const v = S.ans[key(it)], gv = S.ans[key(it) + '#g']; return (v === undefined || String(v).trim() === '') && !(gv && Object.values(gv).some(Boolean)); }).length, c = document.getElementById('confirm');
    c.hidden = false; c.innerHTML = `<p style="margin:0 0 8px">${un ? `ยังไม่ได้ตอบ ${un} ข้อ` : 'ตอบครบทุกข้อแล้ว'} ต้องการส่งข้อสอบหรือไม่</p><div class="row"><button class="btn primary sm" data-act="submit">ส่งข้อสอบ</button><button class="btn sm" data-act="cancel">ทำต่อ</button></div>`; }
  else if (act === 'cancel') document.getElementById('confirm').hidden = true;
  else if (act === 'submit') finish();
  else if (act === 'filter') { S.filter = d.v; rerender(); }
  else if (act === 'mark') { S.att.marks[d.k] = +d.v; syncWrong(grade(S.att).rows); save(); rerender(); }
  else if (act === 'retry') practice('ฝึกข้อที่ยังไม่ได้จาก ' + paperOf(S.att.paper).title, grade(S.att).rows.filter(r => r.frac !== 1).map(r => r.it));
  else if (act === 'set') { const s = SETS.find(x => x.id === d.id); practice(s.title, s.questions.map(q => ({ set: s, q }))); }
  else if (act === 'wrong') { const w = new Set(DB.wrong); practice('สมุดข้อผิด', allItems().filter(it => w.has(key(it)))); }
  else if (act === 'check' || act === 'show') practiceReveal(n);
  else if (act === 'pmark') { setWrong(d.k, +d.v === 1); b.parentElement.querySelectorAll('.btn').forEach(x => x.classList.toggle('on', x === b)); }
  else if (act === 'sus') { const s = new Set(DB.sus); s.has(d.k) ? s.delete(d.k) : s.add(d.k); DB.sus = [...s]; save(); b.textContent = s.has(d.k) ? 'ยกเลิกการรายงาน' : 'รายงานว่าเฉลยน่าสงสัย'; }
  else if (act === 'copysus') { const t = document.getElementById('suslist'), msg = document.getElementById('copied');
    Promise.resolve().then(() => navigator.clipboard.writeText(t.value)).then(() => { msg.textContent = 'คัดลอกแล้ว'; }, () => { t.select(); msg.textContent = 'เลือกข้อความไว้แล้ว กด Ctrl/Cmd + C เพื่อคัดลอก'; }); }
});
function setWrong(k, ok) { const w = new Set(DB.wrong); ok ? w.delete(k) : w.add(k); DB.wrong = [...w]; save(); }
function practiceReveal(n) {
  const it = S.items[n], q = it.q, fb = document.getElementById('fb' + n), box = document.getElementById('q' + n); let ok = null;
  if (q.type === 'mcq') { const r = box.querySelector('input:checked'); if (!r) { fb.innerHTML = '<p class="note">เลือกคำตอบก่อน</p>'; return; } ok = +r.value === q.answer;
    box.querySelectorAll('.opt').forEach(o => { const i = +o.querySelector('input').value; o.classList.add(i === q.answer ? 'ok' : i === +r.value ? 'no' : 'x'); o.querySelector('input').disabled = true; }); }
  else if (q.type === 'calc') { ok = autoOk(q, document.getElementById('in' + n).value); if (ok === null) { fb.innerHTML = '<p class="note">กรอกตัวเลขก่อน</p>'; return; } }
  box.querySelector('.act').hidden = true;
  let gpart = '';
  if (hasG(q)) { const v = (S.gans || {})[key(it)], gs = GK.score(q.graph, v), w = box.querySelector('.gw'); w.outerHTML = graphWidget(it, n, v, true); gpart = `<p class="muted"><small>คะแนนกราฟ ${Math.round(gs * 100)}%</small></p>`; }
  const txt = q.type === 'written' ? (document.getElementById('in' + n) || {}).value || '' : '';
  fb.innerHTML = (ok === null ? '' : `<span class="pill ${ok ? 'ok' : 'bad'}">${ok ? 'ถูก' : 'ผิด'}</span>`) + gpart + (ok === false || q.type === 'written' ? hintHtml(it) : '') + solHtml(it) + (q.type === 'written' && txt.trim() ? aiBlock(key(it), n) : '') + (ok === null ? marksHtml(key(it), undefined, 'pmark') : '');
  if (ok !== null) { S.res[key(it)] = ok; setWrong(key(it), ok); pscore(); }
}
go('home');
})();

</script>
</body>
</html>
