\"/><circle cx=\"329.2\" cy=\"214.2311111111111\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><line x1=\"329.2\" y1=\"214.2311111111111\" x2=\"76\" y2=\"214.2311111111111\" stroke=\"var(--line-2)\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/></g><text x=\"396.28\" y=\"255.06666666666666\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--curve-ad)\">D (อุปสงค์)</text><text x=\"404.72\" y=\"176.13333333333333\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--curve-as)\">S&#8322; (อุปทาน)</text><text x=\"67\" y=\"192.92000000000002\" font-size=\"13\" fill=\"var(--muted)\" text-anchor=\"end\">e<tspan dy=\"3\" font-size=\"10\">1</tspan></text><text x=\"67\" y=\"219.2311111111111\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"end\">e<tspan dy=\"3\" font-size=\"10\">2</tspan></text>\n  </svg><div class=\"figcap\">เส้นอุปทานเงินบาทเลื่อนขวา · เปรียบเทียบดุลยภาพเดิมกับดุลยภาพใหม่</div></div>"},{"id":"X11","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"ผลของค่าเงินต่อดุลการค้าที่ใช้เวลา","q":"หลังค่าเงินอ่อนลง 15% ดุลการค้าของประเทศหนึ่งกลับแย่ลงในช่วงหกเดือนแรก ก่อนจะค่อย ๆ ดีขึ้นในปีถัดมา ข้อใดอธิบายปรากฏการณ์นี้ได้ถูกต้องที่สุด","choices":["ระยะแรก ปริมาณการค้ายังไม่ปรับตัวเพราะสัญญาและห่วงโซ่การผลิตเปลี่ยนไม่ทัน แต่ราคาสินค้านำเข้าแพงขึ้นทันที มูลค่าการนำเข้าจึงเพิ่ม · ระยะถัดมา ปริมาณปรับตัวตามราคา ดุลการค้าจึงดีขึ้น","ระยะแรกดุลการค้าแย่ลงเพราะผู้ส่งออกลดราคาสินค้าลงมากเกินไปจนขาดทุน · ระยะถัดมาผู้ส่งออกเรียนรู้และปรับราคาขึ้นจนได้กำไรกลับคืนมา ซึ่งทำให้ดุลการค้าปรับตัวดีขึ้นในที่สุด","ปรากฏการณ์นี้เป็นความคลาดเคลื่อนของการวัดในช่วงเปลี่ยนผ่าน · ในความเป็นจริงดุลการค้าปรับตัวดีขึ้นทันทีที่ค่าเงินอ่อนลงตามความสัมพันธ์ที่เกิดขึ้นพร้อมกันโดยไม่มีความล่าช้าใด ๆ","ระยะแรกดุลการค้าแย่ลงเพราะค่าเงินที่อ่อนทำให้ต่างชาติไม่มั่นใจและลดการสั่งซื้อ · ระยะถัดมาความเชื่อมั่นกลับคืนมาเองเมื่อค่าเงินทรงตัว ดุลการค้าจึงกลับสู่ระดับเดิมที่เคยเป็นมาก่อน"],"answer":0,"a":"รูปแบบที่ดุลการค้าแย่ลงก่อนแล้วจึงดีขึ้นนี้เรียกว่าผลแบบเส้นโค้งรูปตัวเจ (J-curve) ซึ่งเกิดจากความต่างของความเร็วในการปรับตัว ระหว่างราคาและปริมาณ\nระยะแรก ราคาขยับแต่ปริมาณยังนิ่ง\n· สัญญาซื้อขายที่ทำไว้ล่วงหน้ายังผูกพันอยู่ ปริมาณจึงเปลี่ยนไม่ได้\n· ห่วงโซ่การผลิตเปลี่ยนผู้ขายไม่ได้ทันที เพราะต้องหาผู้ขายใหม่ ตรวจคุณภาพ และปรับสายการผลิต\n· ผู้บริโภคยังไม่เปลี่ยนพฤติกรรมทันที\nแต่ราคาสินค้านำเข้าในรูปเงินในประเทศแพงขึ้นทันที เมื่อปริมาณเท่าเดิมแต่ราคาต่อหน่วยสูงขึ้นมูลค่าการนำเข้าจึงเพิ่มขึ้น ดุลการค้าแย่ลง\nระยะถัดมา ปริมาณปรับตัวตามราคา\n· ผู้ซื้อต่างชาติค่อย ๆ สั่งซื้อสินค้าจากประเทศเรามากขึ้นเพราะถูกลง\n· ผู้ซื้อในประเทศค่อย ๆ ลดการนำเข้าและหันมาใช้สินค้าในประเทศ\nเมื่อปริมาณปรับตัวเต็มที่ ผลด้านปริมาณจะชนะผลด้านราคา ดุลการค้าจึงดีขึ้น\nนัยเชิงนโยบาย — การลดค่าเงินเพื่อแก้ปัญหาดุลการค้าต้องใจเย็นและมองยาว เพราะตัวเลขในระยะแรกจะดูเหมือนว่านโยบายล้มเหลว","whys":["ถูกต้อง — อธิบายด้วยความต่างของความเร็วในการปรับตัวระหว่างราคาที่ขยับทันทีกับปริมาณที่ใช้เวลา","ไม่ถูกต้อง — ผู้ส่งออกไม่จำเป็นต้องลดราคาในสกุลของตัวเอง เพราะค่าเงินที่อ่อนทำให้สินค้าถูกลงในสายตาต่างชาติอยู่แล้ว","ไม่ถูกต้อง — รูปแบบนี้เป็นปรากฏการณ์ที่สังเกตพบสม่ำเสมอในหลายประเทศและมีคำอธิบายทางเศรษฐศาสตร์รองรับชัดเจน","ไม่ถูกต้อง — ปัจจัยหลักคือความล่าช้าในการปรับปริมาณ ไม่ใช่ความเชื่อมั่นของผู้ซื้อต่างชาติที่เปลี่ยนไปตามค่าเงิน"],"tip":"เส้นโค้งรูปตัวเจ: ราคาปรับทันที ปริมาณปรับช้า — ดุลการค้าจึงแย่ลงก่อนดีขึ้น ต้องอ่านตัวเลขระยะแรกด้วยความเข้าใจ"},{"id":"X12","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"หนี้ต่างประเทศสกุลเงินต่างชาติ","q":"ประเทศหนึ่งมีภาคธุรกิจที่กู้เงินสกุลดอลลาร์จำนวนมากแต่มีรายได้เป็นเงินในประเทศ เมื่อค่าเงินในประเทศอ่อนลง 30% ข้อใดอธิบายผลได้ถูกต้องที่สุด","choices":["ภาระหนี้ที่วัดเป็นเงินในประเทศเพิ่มขึ้นราว 30% ทั้งที่ยอดหนี้สกุลดอลลาร์เท่าเดิม ธุรกิจจึงอ่อนแอลงและอาจล้ม · ผลลบต่อการลงทุนและสินเชื่อนี้อาจกลบประโยชน์ที่ได้จากการส่งออกที่ดีขึ้น","ภาระหนี้ที่วัดเป็นเงินในประเทศลดลงราว 30% เพราะค่าเงินที่อ่อนทำให้มูลค่าของหนี้ลดลงตามไปด้วย · ธุรกิจจึงมีฐานะการเงินแข็งแรงขึ้นและสามารถขยายการลงทุนได้มากกว่าเดิมอย่างมีนัยสำคัญ","ภาระหนี้ไม่เปลี่ยนแปลงเลยเพราะหนี้ถูกกำหนดเป็นสกุลดอลลาร์ซึ่งจำนวนดอลลาร์ที่ต้องชำระยังเท่าเดิม · อัตราแลกเปลี่ยนจึงไม่มีผลต่อฐานะการเงินของธุรกิจที่กู้เงินสกุลต่างประเทศเลย","ค่าเงินที่อ่อนลงจะช่วยธุรกิจเหล่านี้มากที่สุดเพราะพวกเขาเป็นผู้ส่งออก · ประโยชน์จากยอดขายที่เพิ่มขึ้นจะมากกว่าภาระหนี้ที่เปลี่ยนแปลงในทุกกรณีโดยไม่ต้องพิจารณาโครงสร้างรายได้เลย"],"answer":0,"a":"นี่คือความเปราะบางที่เรียกว่าความไม่สอดคล้องของสกุลเงินในงบดุล (currency mismatch) ซึ่งเป็นสาเหตุสำคัญของวิกฤตในหลายประเทศ\nคิดด้วยตัวเลข — สมมติธุรกิจกู้ 100 ล้านดอลลาร์ ที่อัตรา 33 บาทต่อดอลลาร์ ภาระหนี้เท่ากับ 3,300 ล้านบาท เมื่อค่าเงินอ่อนลงจนเป็น 43 บาทต่อดอลลาร์ ภาระหนี้กลายเป็น 4,300 ล้านบาท\n· ยอดหนี้สกุลดอลลาร์เท่าเดิมทุกบาททุกสตางค์\n· แต่ภาระที่ต้องหาเงินในประเทศมาชำระเพิ่มขึ้นราว 30%\n· ขณะที่รายได้ยังเป็นเงินในประเทศเท่าเดิม\nผลลูกโซ่\n· ธุรกิจที่มีหนี้สูงอาจผิดนัดชำระหรือล้มละลาย\n· ธนาคารที่ปล่อยกู้ให้ธุรกิจเหล่านี้เสียหาย สินเชื่อตึงตัวทั้งระบบ\n· การลงทุนหดตัว ซึ่งกด AD ลง\nประเด็นสำคัญ — ตำราบอกว่าค่าเงินอ่อนช่วยการส่งออก ซึ่งจริง แต่ในประเทศที่มีความไม่สอดคล้องของสกุลเงินในงบดุลอย่างรุนแรงผลลบจากงบดุลอาจใหญ่กว่าผลบวกจากการค้า ทำให้การอ่อนค่าของเงินเป็นวิกฤตแทนที่จะเป็นการปรับตัว\nบทเรียนเชิงนโยบาย — นี่คือเหตุผลที่ประเทศตลาดเกิดใหม่ให้ความสำคัญกับการสะสมเงินสำรอง กำกับดูแลการก่อหนี้ต่างประเทศ และส่งเสริมการป้องกันความเสี่ยงค่าเงิน","whys":["ถูกต้อง — คิดภาระหนี้ในรูปเงินในประเทศได้ถูกต้องและชี้ผลลูกโซ่ที่อาจกลบประโยชน์จากการส่งออกที่ดีขึ้น","ไม่ถูกต้อง — กลับทิศ เมื่อเงินในประเทศอ่อนลง ต้องใช้เงินในประเทศมากขึ้นเพื่อซื้อดอลลาร์ไปชำระหนี้ ภาระจึงหนักขึ้น","ไม่ถูกต้อง — จำนวนดอลลาร์เท่าเดิมจริง แต่ธุรกิจมีรายได้เป็นเงินในประเทศ จึงต้องแลกเงินในประเทศมากขึ้นเพื่อชำระหนี้ก้อนเดิม","ไม่ถูกต้อง — โจทย์ระบุว่าธุรกิจเหล่านี้มีรายได้เป็นเงินในประเทศ จึงไม่ได้ประโยชน์จากค่าเงินที่อ่อนแบบผู้ส่งออก"],"tip":"หลักที่ต้องจำ: กู้สกุลต่างชาติแต่มีรายได้สกุลในประเทศ = เปราะบาง — ค่าเงินอ่อนทำให้หนี้พองขึ้นทันทีโดยที่รายได้ไม่โตตาม"},{"id":"X13","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"ข้อจำกัดสามประการที่เลือกได้เพียงสองอย่าง","q":"ทฤษฎีชี้ว่าประเทศหนึ่งไม่สามารถมีทั้งอัตราแลกเปลี่ยนคงที่ การเปิดเสรีเงินทุน และอิสระของนโยบายการเงินได้พร้อมกันทั้งสามอย่าง ข้อใดอธิบายเหตุผลได้ถูกต้องที่สุด","choices":["เพราะหากเปิดเสรีเงินทุนและตรึงค่าเงินไว้ ธนาคารกลางต้องใช้ดอกเบี้ยรักษาค่าเงินตามตลาดโลกจึงไม่เหลืออิสระ · หากต้องการอิสระต้องยอมให้ค่าเงินลอยตัวหรือควบคุมการเคลื่อนย้ายเงินทุน","เพราะการมีทั้งสามอย่างจะทำให้ปริมาณเงินในระบบเพิ่มขึ้นเร็วเกินไปจนเกิดเงินเฟ้อรุนแรง · ประเทศจึงต้องเลือกเพียงสองอย่างเพื่อรักษาเสถียรภาพของระดับราคาไว้ให้อยู่ในกรอบเป้าหมายที่กำหนด","เพราะข้อจำกัดทางกฎหมายระหว่างประเทศห้ามไม่ให้ประเทศสมาชิกใช้ทั้งสามนโยบายพร้อมกัน · เป็นข้อตกลงที่กำหนดขึ้นเพื่อป้องกันการแข่งขันลดค่าเงินระหว่างประเทศโดยไม่ได้มีเหตุผลทางเศรษฐศาสตร์","ในความเป็นจริงประเทศสามารถมีทั้งสามอย่างได้พร้อมกันหากมีเงินสำรองระหว่างประเทศเพียงพอ · ข้อจำกัดนี้จึงใช้ได้เฉพาะกับประเทศยากจนที่ไม่มีเงินสำรองมากพอที่จะรักษาทั้งสามเป้าหมายไว้ได้"],"answer":0,"a":"เหตุผลเบื้องหลังเข้าใจได้ด้วยการลองสมมติว่ามีทั้งสามอย่างแล้วดูว่าพังที่ไหน\nสมมติประเทศหนึ่งตรึงค่าเงินไว้ เปิดเสรีเงินทุน และต้องการลดดอกเบี้ยเพื่อกระตุ้นเศรษฐกิจ\n· ดอกเบี้ยในประเทศต่ำกว่าต่างประเทศ\n· เงินทุนที่เคลื่อนย้ายได้เสรีจะไหลออกไปหาผลตอบแทนที่สูงกว่า\n· นักลงทุนขายเงินในประเทศเป็นจำนวนมาก แรงกดดันให้ค่าเงินอ่อนลง\n· แต่ประเทศตรึงค่าเงินไว้ ธนาคารกลางจึงต้องขายเงินสำรองระหว่างประเทศเพื่อพยุงค่าเงิน\n· เงินสำรองมีจำกัด สุดท้ายต้องเลือก คือขึ้นดอกเบี้ยกลับ (สละอิสระทางการเงิน) ปล่อยค่าเงินลอย (สละอัตราคงที่) หรือควบคุมการเคลื่อนย้ายเงินทุน (สละการเปิดเสรี)\nสามคู่ที่เลือกได้ในทางปฏิบัติ\n· อัตราคงที่ + เปิดเสรีเงินทุน — สละอิสระทางการเงิน ตัวอย่างคือประเทศที่ใช้สกุลเงินร่วมกัน\n· ลอยตัว + เปิดเสรีเงินทุน — สละอัตราคงที่ ซึ่งเป็นทางเลือกของประเทศส่วนใหญ่ในปัจจุบัน\n· อัตราคงที่ + อิสระทางการเงิน — สละการเปิดเสรีเงินทุน คือต้องควบคุมการเคลื่อนย้ายเงินทุน\nคุณค่าของแนวคิดนี้ — มันเป็นเครื่องมือวินิจฉัยที่บอกล่วงหน้าว่านโยบายชุดใดจะขัดกันเองและนำไปสู่วิกฤต","whys":["ถูกต้อง — อธิบายกลไกที่ความขัดแย้งเกิดขึ้นผ่านการไหลของเงินทุนและการต้องใช้ดอกเบี้ยรักษาค่าเงิน","ไม่ถูกต้อง — ข้อจำกัดนี้เกิดจากความขัดแย้งเชิงกลไกระหว่างเป้าหมายทั้งสาม ไม่ใช่จากผลด้านปริมาณเงินที่เพิ่มขึ้นเร็วเกินไป","ไม่ถูกต้อง — นี่เป็นข้อจำกัดเชิงเศรษฐศาสตร์ที่เกิดจากกลไกตลาด ไม่ใช่ข้อห้ามทางกฎหมายระหว่างประเทศ","ไม่ถูกต้อง — เงินสำรองที่มากช่วยยื้อเวลาได้นานขึ้นแต่ไม่ได้ยกเลิกข้อจำกัดนี้ เพราะเงินสำรองใดก็มีวันหมด"],"tip":"ท่าจำ: ตรึงค่าเงิน + เปิดเสรีเงินทุน + อิสระทางการเงิน = เลือกได้แค่สอง — ลองสมมติว่ามีทั้งสามแล้วดูว่าเงินทุนไหลไปทางไหน จะเห็นว่าพังที่ไหน"},{"id":"X14","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"เงินทุนไหลเข้ากับผลต่อภาคการส่งออก","q":"ประเทศหนึ่งค้นพบแหล่งทรัพยากรธรรมชาติขนาดใหญ่ ทำให้เงินทุนต่างชาติไหลเข้าและรายได้จากการส่งออกทรัพยากรพุ่งขึ้น ค่าเงินจึงแข็งขึ้นอย่างมาก ข้อใดอธิบายผลต่อภาคการผลิตอื่นได้ถูกต้อง","choices":["ค่าเงินที่แข็งขึ้นทำให้สินค้าอุตสาหกรรมของประเทศแพงขึ้นในสายตาต่างชาติ ภาคการผลิตที่ไม่เกี่ยวกับทรัพยากรจึงแข่งขันไม่ได้และหดตัวลง · โครงสร้างเศรษฐกิจกระจุกตัวและเปราะบางต่อราคาทรัพยากรมากขึ้น","ค่าเงินที่แข็งขึ้นช่วยภาคการผลิตทุกภาคส่วนอย่างทั่วถึง เพราะทำให้เครื่องจักรและวัตถุดิบนำเข้าถูกลง · ภาคอุตสาหกรรมจึงขยายตัวไปพร้อมกับภาคทรัพยากรและโครงสร้างเศรษฐกิจกระจายตัวมากขึ้นกว่าเดิมอย่างชัดเจน","ค่าเงินที่แข็งขึ้นไม่มีผลต่อภาคการผลิตอื่นเลย เพราะแต่ละภาคการผลิตแยกจากกันโดยสิ้นเชิง · ผลของอัตราแลกเปลี่ยนจำกัดอยู่เฉพาะในภาคทรัพยากรที่เป็นต้นเหตุของการแข็งค่าเท่านั้น","รายได้จากทรัพยากรที่เพิ่มขึ้นจะทำให้ค่าเงินอ่อนลงไม่ใช่แข็งขึ้น เพราะเงินตราต่างประเทศที่ไหลเข้ามามากทำให้อุปทานเงินตราต่างประเทศในตลาดสูงขึ้นจนกดค่าเงินในประเทศให้ต่ำลง"],"answer":0,"a":"ปรากฏการณ์นี้เรียกว่าโรคดัตช์ (Dutch disease) ซึ่งแสดงว่าโชคดีที่มาเร็วอาจสร้างปัญหาโครงสร้างได้\nลำดับกลไก\n1. การค้นพบทรัพยากรทำให้เงินทุนไหลเข้าและรายได้ส่งออกทรัพยากรพุ่ง\n2. อุปสงค์ต่อเงินในประเทศเพิ่มขึ้นมาก ค่าเงินแข็งขึ้น\n3. ค่าเงินที่แข็งทำให้สินค้าอุตสาหกรรมและบริการส่งออกอื่น ๆ แพงขึ้นในสายตาต่างชาติ ขณะที่สินค้านำเข้าถูกลง\n4. ภาคการผลิตที่ไม่เกี่ยวกับทรัพยากรสูญเสียความสามารถในการแข่งขันและหดตัว แรงงานและทุนไหลไปสู่ภาคทรัพยากร\nทำไมจึงเป็นปัญหา\n· โครงสร้างเศรษฐกิจกระจุกตัวอยู่กับสินค้าเพียงชนิดเดียว จึงเปราะบางมากเมื่อราคาทรัพยากรดิ่งลง\n· ภาคอุตสาหกรรมที่หายไปมักเป็นภาคที่สะสมทักษะและผลิตภาพได้ดีกว่า การสูญเสียจึงกระทบการเติบโตระยะยาวผ่าน LRAS\n· เมื่อทรัพยากรหมดหรือราคาตก การสร้างภาคอุตสาหกรรมกลับคืนมาใช้เวลานานกว่าที่เสียไปมาก\nแนวทางที่ประเทศต่าง ๆ ใช้ — ตั้งกองทุนความมั่งคั่งเก็บรายได้ส่วนเกินไว้ลงทุนต่างประเทศเพื่อลดแรงกดดันให้ค่าเงินแข็ง และลงทุนในการศึกษาและภาคการผลิตอื่นอย่างจงใจ","whys":["ถูกต้อง — อธิบายลำดับกลไกจากเงินทุนไหลเข้าสู่ค่าเงินแข็งและสู่การหดตัวของภาคการผลิตอื่น พร้อมนัยเชิงโครงสร้าง","ไม่ถูกต้อง — ผลด้านต้นทุนนำเข้าที่ถูกลงมีอยู่จริง แต่เล็กกว่าผลเสียจากการที่สินค้าส่งออกแพงขึ้นในสายตาผู้ซื้อต่างชาติ","ไม่ถูกต้อง — อัตราแลกเปลี่ยนเป็นราคาที่กระทบทุกภาคการผลิตที่ค้าขายกับต่างประเทศ ไม่ได้จำกัดอยู่ที่ภาคใดภาคเดียว","ไม่ถูกต้อง — รายได้ส่งออกที่เพิ่มขึ้นหมายถึงต่างชาติต้องแลกเงินมาเป็นเงินในประเทศมากขึ้น ซึ่งทำให้ค่าเงินแข็งขึ้น"]},{"id":"X15","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"การส่งผ่านของค่าเงินไปสู่ราคาในประเทศ","q":"ค่าเงินของสองประเทศอ่อนลงในอัตราเท่ากันคือ 20% แต่ประเทศ ก. มีเงินเฟ้อเพิ่มขึ้น 4 จุด ขณะที่ประเทศ ข. เพิ่มขึ้นเพียง 1 จุด ข้อใดอธิบายความแตกต่างได้ถูกต้องที่สุด","choices":["ประเทศ ก. น่าจะพึ่งพาสินค้านำเข้าในตะกร้าผู้บริโภคสูงกว่า มีการแข่งขันในประเทศน้อยกว่า และการคาดการณ์เงินเฟ้อไม่ถูกตรึงไว้มั่นคงเท่า · ปัจจัยเหล่านี้ทำให้ค่าเงินส่งผ่านไปสู่ราคาได้แรงกว่า","ประเทศ ก. ต้องมีอัตราการอ่อนค่าที่มากกว่าจริงแต่รายงานไม่ตรงกับความเป็นจริง · เพราะค่าเงินที่อ่อนในอัตราเท่ากันย่อมส่งผ่านไปสู่ระดับราคาในอัตราที่เท่ากันเสมอในทุกประเทศโดยไม่มีข้อยกเว้นในทุกช่วงเวลา","ประเทศ ข. น่าจะพึ่งพาสินค้านำเข้าสูงกว่าประเทศ ก. · เพราะยิ่งนำเข้ามากเท่าไร ผู้ผลิตในประเทศก็ยิ่งมีทางเลือกในการหาวัตถุดิบมากขึ้น จึงสามารถตรึงราคาขายไว้ได้ดีกว่า","ความแตกต่างเกิดจากวิธีคำนวณดัชนีราคาที่ไม่เหมือนกันเพียงอย่างเดียว · ในทางเศรษฐศาสตร์ค่าเงินไม่มีความสัมพันธ์กับระดับราคาในประเทศเลยเพราะเป็นตัวแปรที่ถูกกำหนดในตลาดที่แยกจากกัน"],"answer":0,"a":"ระดับที่ค่าเงินส่งผ่านไปสู่ราคาในประเทศเรียกว่าการส่งผ่านของอัตราแลกเปลี่ยน (exchange rate pass-through) และมันต่างกันมากระหว่างประเทศ ด้วยเหตุผลหลายข้อ\nปัจจัยที่หนึ่ง สัดส่วนสินค้านำเข้าในตะกร้าผู้บริโภค — ประเทศที่ผู้บริโภคซื้อสินค้านำเข้าและสินค้าที่ใช้วัตถุดิบนำเข้าในสัดส่วนสูง จะเห็นดัชนีราคาขยับตามค่าเงินแรงกว่าอย่างเห็นได้ชัด\nปัจจัยที่สอง ระดับการแข่งขันในประเทศ — ในตลาดที่แข่งขันสูง ผู้ขายกลัวเสียลูกค้าจึงยอมรับกำไรที่บางลงแทนการขึ้นราคาเต็มจำนวน ในตลาดที่ผู้ขายมีอำนาจตลาด ต้นทุนที่เพิ่มถูกผลักไปที่ผู้บริโภคได้ง่ายกว่า\nปัจจัยที่สาม ความน่าเชื่อถือของธนาคารกลาง — สำคัญที่สุดในระยะยาว หากการคาดการณ์เงินเฟ้อถูกตรึงไว้มั่นคง ผู้ผลิตและแรงงานจะมองว่าค่าเงินที่อ่อนเป็นเรื่องชั่วคราวและไม่ปรับราคาหรือค่าจ้างตาม การส่งผ่านจึงจำกัดอยู่ที่รอบแรก ตรงข้ามกับประเทศที่การคาดการณ์ไม่มั่นคงซึ่งจะเกิดรอบที่สองผ่านค่าจ้างและราคาต่อเนื่อง\nปัจจัยที่สี่ สกุลเงินที่ใช้ตั้งราคาในสัญญา — หากสัญญาส่วนใหญ่ตั้งราคาเป็นสกุลต่างประเทศ การส่งผ่านจะเร็วและแรงกว่า\nนัยเชิงนโยบาย — การลงทุนสร้างความน่าเชื่อถือของธนาคารกลางให้ผลตอบแทนตรงนี้ คือทำให้เศรษฐกิจรับช็อกค่าเงินได้โดยไม่บานปลายเป็นเงินเฟ้อ","whys":["ถูกต้อง — ระบุปัจจัยที่กำหนดระดับการส่งผ่านได้ครบ ทั้งสัดส่วนการนำเข้า ระดับการแข่งขัน และความมั่นคงของการคาดการณ์","ไม่ถูกต้อง — ระดับการส่งผ่านต่างกันมากระหว่างประเทศตามโครงสร้างเศรษฐกิจ ไม่ใช่ค่าคงที่ที่เท่ากันทุกประเทศ","ไม่ถูกต้อง — กลับทิศ ยิ่งพึ่งพาสินค้านำเข้ามาก ค่าเงินที่อ่อนยิ่งส่งผ่านไปสู่ราคาในประเทศแรงกว่าไม่ใช่น้อยกว่า","ไม่ถูกต้อง — ความสัมพันธ์ระหว่างค่าเงินกับราคาในประเทศมีกลไกชัดเจนผ่านราคาสินค้านำเข้าและต้นทุนวัตถุดิบ"]},{"id":"X16","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"คำนวณเปอร์เซ็นต์การแข็งค่าและอ่อนค่า","q":"ต้นปี อัตราแลกเปลี่ยนอยู่ที่ 32 บาทต่อดอลลาร์ · ปลายปีอยู่ที่ 40 บาทต่อดอลลาร์ · ข้อใดอธิบายการเปลี่ยนแปลงได้ถูกต้อง","choices":["เงินบาทอ่อนค่าลง 20% เมื่อวัดจากมุมของดอลลาร์ต่อบาท ขณะที่ดอลลาร์แข็งค่าขึ้น 25% เมื่อวัดจากมุมของบาทต่อดอลลาร์ · ตัวเลขสองค่านี้ต่างกันเพราะใช้ฐานในการคำนวณต่างกัน","เงินบาทแข็งค่าขึ้น 25% เพราะตัวเลขอัตราแลกเปลี่ยนเพิ่มขึ้นจาก 32 เป็น 40 · ซึ่งหมายความว่าเงินบาทมีอำนาจซื้อในตลาดต่างประเทศเพิ่มขึ้นในสัดส่วนที่เท่ากันกับตัวเลขที่เพิ่มขึ้นนั้น","เงินบาทอ่อนค่าลง 25% และดอลลาร์อ่อนค่าลง 20% ไปพร้อมกัน · เพราะการเปลี่ยนแปลงของอัตราแลกเปลี่ยนกระทบทั้งสองสกุลในทิศทางเดียวกันเมื่อวัดเทียบกับสกุลอื่นในตลาดโลก","ไม่สามารถคำนวณเปอร์เซ็นต์ได้เพราะอัตราแลกเปลี่ยนเป็นราคาเปรียบเทียบที่ไม่มีหน่วยที่แน่นอน · ต้องทราบระดับราคาของทั้งสองประเทศก่อนจึงจะคำนวณการเปลี่ยนแปลงเป็นเปอร์เซ็นต์ได้"],"answer":0,"a":"โจทย์นี้ทดสอบความเข้าใจว่าเปอร์เซ็นต์การแข็งและอ่อนค่าไม่เท่ากัน เพราะฐานต่างกัน\nมุมที่หนึ่ง คิดจากบาทต่อดอลลาร์\nดอลลาร์เปลี่ยนจาก 32 เป็น 40 บาท\n= (40 − 32) ÷ 32 = 8 ÷ 32 = 25% → ดอลลาร์แข็งค่าขึ้น 25%\nมุมที่สอง คิดจากดอลลาร์ต่อบาท ซึ่งเป็นนิยามของตำรา\nต้นปี e = 1 ÷ 32 = 0.03125 ดอลลาร์ต่อบาท\nปลายปี e = 1 ÷ 40 = 0.02500 ดอลลาร์ต่อบาท\n= (0.025 − 0.03125) ÷ 0.03125 = −0.20 = ลดลง 20% → เงินบาทอ่อนค่าลง 20%\nทำไมสองตัวเลขจึงไม่เท่ากัน — เพราะเป็นการคิดเปอร์เซ็นต์จากฐานที่ต่างกัน ในกรณีแรกฐานคือ 32 ในกรณีที่สองฐานคือ 0.03125 นี่เป็นคุณสมบัติของการคิดเปอร์เซ็นต์จากตัวเลขที่เป็นส่วนกลับกัน ไม่ใช่ความขัดแย้งทางเศรษฐศาสตร์\nข้อสรุปที่ตรงกันของทั้งสองมุม — เงินบาทอ่อนค่าลงและดอลลาร์แข็งค่าขึ้น ทิศทางตรงกันเสมอ ต่างกันเพียงตัวเลขเปอร์เซ็นต์\nข้อควรระวังในห้องสอบ — เมื่อโจทย์ถามเปอร์เซ็นต์ ต้องดูให้ชัดว่าถามจากมุมของสกุลใด","whys":["ถูกต้อง — คำนวณได้ทั้งสองมุมและอธิบายถูกต้องว่าเหตุใดตัวเลขเปอร์เซ็นต์จึงไม่เท่ากันทั้งที่ทิศทางตรงกัน","ไม่ถูกต้อง — ตัวเลข 32 เป็น 40 อยู่ในรูปบาทต่อดอลลาร์ ซึ่งการเพิ่มขึ้นหมายถึงต้องใช้บาทมากขึ้นเพื่อซื้อหนึ่งดอลลาร์ นั่นคือบาทอ่อนลง","ไม่ถูกต้อง — อัตราแลกเปลี่ยนเป็นราคาเปรียบเทียบ ทั้งสองสกุลจึงเคลื่อนไหวในทิศตรงข้ามกันเสมอ ไม่ใช่ทิศเดียวกัน","ไม่ถูกต้อง — เปอร์เซ็นต์การเปลี่ยนแปลงของอัตราแลกเปลี่ยนที่เป็นตัวเงินคำนวณได้โดยไม่ต้องใช้ระดับราคา ซึ่งจำเป็นเฉพาะค่าที่แท้จริง"],"tip":"อย่าตกหลุมนี้: แข็ง 25% กับอ่อน 20% เป็นเหตุการณ์เดียวกัน — ต่างกันแค่ฐานในการคิดเปอร์เซ็นต์ ทิศทางตรงกันเสมอ"},{"id":"X17","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"ค่าเงินแข็งกับการวิเคราะห์ AD-AS สองระยะ","q":"เงินทุนต่างชาติไหลเข้าอย่างมากทำให้ค่าเงินแข็งขึ้นอย่างรวดเร็ว ขณะที่เศรษฐกิจอยู่ที่ดุลยภาพระยะยาวพอดี ข้อใดวิเคราะห์ผลตามกรอบที่ SRAS เป็นเส้นแนวนอนได้ถูกต้องที่สุด","choices":["ระยะสั้น การส่งออกสุทธิลดลงทำให้ AD เลื่อนซ้าย ผลผลิตลดต่ำกว่า Y_FE เกิดช่องว่างการหดตัว · ระยะยาว ค่าจ้างและราคาที่ปรับลดลงทำให้ SRAS เลื่อนลง ผลผลิตกลับสู่ Y_FE ที่ระดับราคาต่ำลง","ระยะสั้น การส่งออกสุทธิเพิ่มขึ้นทำให้ AD เลื่อนขวา ผลผลิตเพิ่มเกิน Y_FE เกิดช่องว่างเงินเฟ้อ · ระยะยาว ค่าจ้างถูกดันขึ้นทำให้ SRAS เลื่อนขึ้น ผลผลิตกลับสู่ Y_FE ที่ระดับราคาสูงขึ้นกว่าเดิม","ระยะสั้น เฉพาะเส้น LRAS เท่านั้นที่เลื่อนซ้ายเพราะค่าเงินที่แข็งทำให้ภาคส่งออกสูญเสียกำลังการผลิต · ระยะยาว ระดับราคาจะสูงขึ้นพร้อมกับผลผลิตที่ต่ำลงโดยไม่มีกลไกใดที่จะดึงกลับสู่ระดับเดิม","ไม่มีผลต่อทั้ง AD และ AS เลย เพราะเงินทุนที่ไหลเข้าเป็นธุรกรรมในบัญชีทุนซึ่งแยกจากบัญชีเดินสะพัดโดยสิ้นเชิง · อัตราแลกเปลี่ยนที่เปลี่ยนแปลงจึงไม่กระทบการผลิตและการใช้จ่ายในระบบเศรษฐกิจจริง"],"answer":0,"a":"ต่อสะพานจากอัตราแลกเปลี่ยน ไปสู่ AD-AS ครบสองระยะ\nขั้นที่ 1 ตลาดเงินตราต่างประเทศ — เงินทุนไหลเข้าทำให้อุปสงค์ต่อเงินในประเทศเพิ่ม ค่าเงินแข็งขึ้น\nขั้นที่ 2 ผลต่อการค้า — สินค้าส่งออกแพงขึ้นในสายตาต่างชาติ สินค้านำเข้าถูกลง NX ลดลง\nขั้นที่ 3 ระยะสั้น — NX ที่ลดลงทำให้ AD เลื่อนซ้าย ในกรอบที่ SRAS เป็นเส้นแนวนอน ระดับราคายังไม่ขยับ ผลผลิตลดลงต่ำกว่า Y_FE เกิดช่องว่างการหดตัว การว่างงานสูงกว่าอัตราธรรมชาติ\nขั้นที่ 4 ระยะยาว — ตลาดแรงงานที่หย่อนตัวกดค่าจ้างและต้นทุนลง SRAS เลื่อนลง ผลผลิตไหลกลับสู่ Y_FE ที่ระดับราคาต่ำลง\nข้อควรระวังในโลกจริง — กลไกปรับตัวขาลงนี้ทำงานช้ากว่าขาขึ้นมาก เพราะค่าจ้างที่เป็นตัวเงินลดลงยาก ช่วงที่มีช่องว่างการหดตัวจึงอาจลากยาว\nผลข้างเคียงอีกทาง — ค่าเงินที่แข็งยังทำให้วัตถุดิบนำเข้าถูกลง ซึ่งช่วยดัน SRAS ลงบางส่วนตั้งแต่ต้น ทำให้แรงกดดันเงินเฟ้อลดลงเร็วกว่าที่กรอบพื้นฐานบอก แต่ไม่ได้เปลี่ยนทิศทางของผลต่อผลผลิต","whys":["ถูกต้อง — เดินจากค่าเงินแข็งสู่ NX ที่ลดลง สู่ AD เลื่อนซ้าย และสู่การปรับตัวของ SRAS ในระยะยาวอย่างครบถ้วน","ไม่ถูกต้อง — กลับทิศตั้งแต่ต้น ค่าเงินที่แข็งทำให้สินค้าส่งออกแพงขึ้นในสายตาต่างชาติ NX จึงลดลงไม่ใช่เพิ่มขึ้น","ไม่ถูกต้อง — ผลหลักอยู่ที่ AD ผ่านการส่งออกสุทธิ ส่วน LRAS ถูกกำหนดโดยทุน แรงงาน และเทคโนโลยี ไม่ใช่โดยค่าเงิน","ไม่ถูกต้อง — เงินทุนที่ไหลเข้ากระทบเศรษฐกิจจริงผ่านอัตราแลกเปลี่ยนซึ่งเปลี่ยนราคาเปรียบเทียบของสินค้าส่งออกและนำเข้า"],"tip":"สะพานที่ต้องต่อให้ครบ: เงินทุนไหลเข้า → ค่าเงินแข็ง → NX↓ → AD ซ้าย → ช่องว่างการหดตัว → SRAS ลง → P ต่ำลง"},{"id":"X18","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"อ่านข้อมูลย้อนกลับเพื่อหาสาเหตุ","q":"ข้อมูลของประเทศหนึ่งในหนึ่งปี — ค่าเงินอ่อนลง 12% · อัตราดอกเบี้ยในประเทศคงที่ขณะที่ดอกเบี้ยต่างประเทศคงที่เช่นกัน · ดุลบัญชีเดินสะพัดขาดดุลเพิ่มขึ้น · เงินสำรองระหว่างประเทศลดลง · ข้อใดอธิบายสาเหตุที่น่าจะเป็นได้ถูกต้องที่สุด","choices":["แรงกดดันน่าจะมาจากดุลบัญชีเดินสะพัดที่ขาดดุลมากขึ้นซึ่งเพิ่มอุปทานเงินในประเทศในตลาด ประกอบกับธนาคารกลางที่พยายามพยุงค่าเงินจึงใช้เงินสำรองไป · ส่วนต่างดอกเบี้ยไม่ใช่ต้นเหตุเพราะไม่เปลี่ยนแปลง","แรงกดดันน่าจะมาจากส่วนต่างอัตราดอกเบี้ยที่กว้างขึ้นซึ่งทำให้เงินทุนไหลออก · โดยดุลบัญชีเดินสะพัดและเงินสำรองระหว่างประเทศเป็นเพียงผลที่ตามมาภายหลังและไม่ได้มีส่วนในการอธิบายการอ่อนค่าเลย จึงไม่ควรนำมาใช้ประกอบการวินิจฉัย","แรงกดดันน่าจะมาจากการที่ธนาคารกลางตั้งใจลดค่าเงินเพื่อกระตุ้นการส่งออก · ซึ่งสังเกตได้จากเงินสำรองระหว่างประเทศที่ลดลง เพราะการลดค่าเงินต้องใช้การขายเงินสำรองออกไปจำนวนมาก","ข้อมูลชุดนี้ขัดแย้งกันเองจึงต้องมีความคลาดเคลื่อน · เพราะค่าเงินที่อ่อนลงย่อมทำให้ดุลบัญชีเดินสะพัดดีขึ้นและเงินสำรองระหว่างประเทศเพิ่มขึ้นในปีเดียวกันนั้นเสมอ"],"answer":0,"a":"โจทย์แบบนี้ต้องอ่านข้อมูลย้อนกลับ ไปหาสาเหตุ โดยใช้วิธีตัดตัวเลือกที่ข้อมูลหักล้าง\nตัดส่วนต่างดอกเบี้ยออกก่อน — โจทย์ระบุชัดว่าดอกเบี้ยทั้งในและต่างประเทศคงที่ ส่วนต่างจึงไม่เปลี่ยน ไม่ใช่ต้นเหตุของการอ่อนค่าในปีนี้\nดุลบัญชีเดินสะพัดเป็นเบาะแสหลัก — การขาดดุลที่เพิ่มขึ้นหมายถึงประเทศจ่ายเงินตราต่างประเทศออกมากกว่ารับเข้า ซึ่งในตลาดเงินตราต่างประเทศเท่ากับมีอุปทานเงินในประเทศออกมามากขึ้น แรงนี้กดค่าเงินให้อ่อนลงโดยตรง\nเงินสำรองที่ลดลงบอกอะไร — บอกว่าธนาคารกลางเข้าแทรกแซงเพื่อพยุงค่าเงิน คือขายเงินสำรองระหว่างประเทศเพื่อซื้อเงินในประเทศกลับ ซึ่งเป็นการต้านทานการอ่อนค่า ไม่ใช่การเร่งให้เกิด นี่เป็นจุดที่ตัวเลือกอื่นตีความกลับด้าน\nภาพรวมที่สอดคล้องกัน — การขาดดุลเรื้อรังสร้างแรงกดดันให้ค่าเงินอ่อน ธนาคารกลางต้านไว้บางส่วนด้วยเงินสำรอง แต่ต้านได้ไม่หมด ค่าเงินจึงอ่อนลง 12% ขณะที่เงินสำรองร่อยหรอลง\nสิ่งที่ควรเฝ้าระวังต่อ — หากขาดดุลยังไม่ลดลงและเงินสำรองยังลดต่อ ความเสี่ยงของวิกฤตค่าเงินจะเพิ่มขึ้น ซึ่งเป็นสัญญาณที่ผู้ดำเนินนโยบายต้องจัดการที่ต้นเหตุ","whys":["ถูกต้อง — ใช้ข้อมูลตัดส่วนต่างดอกเบี้ยออก และตีความเงินสำรองที่ลดลงว่าเป็นการพยุงค่าเงินได้ถูกทิศ","ไม่ถูกต้อง — โจทย์ระบุว่าดอกเบี้ยทั้งสองฝ่ายคงที่ ส่วนต่างจึงไม่กว้างขึ้นและไม่สามารถเป็นต้นเหตุได้","ไม่ถูกต้อง — การจะลดค่าเงินต้องขายเงินในประเทศและซื้อเงินสำรองเข้ามา ซึ่งจะทำให้เงินสำรองเพิ่มไม่ใช่ลด","ไม่ถูกต้อง — ข้อมูลสอดคล้องกันได้ เพราะผลของค่าเงินอ่อนต่อดุลการค้าใช้เวลา และการพยุงค่าเงินทำให้เงินสำรองลดลงตามที่คาด"]},{"id":"X19","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"ค่าเงินกับเป้าหมายของนโยบายการเงิน","q":"ธนาคารกลางของประเทศที่พึ่งพาการนำเข้าพลังงานสูงเผชิญค่าเงินที่อ่อนลงอย่างรวดเร็ว พร้อมกับเงินเฟ้อที่เร่งตัวและเศรษฐกิจที่ชะลอตัว ข้อใดอธิบายความยากลำบากและแนวทางที่เหมาะสมได้ถูกต้องที่สุด","choices":["การขึ้นดอกเบี้ยช่วยพยุงค่าเงินและสกัดเงินเฟ้อผ่านราคาสินค้านำเข้า แต่ซ้ำเติมเศรษฐกิจที่ชะลออยู่แล้ว · แนวทางคือขึ้นดอกเบี้ยเท่าที่จำเป็นเพื่อป้องกันการคาดการณ์หลุดกรอบ พร้อมสื่อสารและใช้เงินสำรองลดความผันผวน","การลดดอกเบี้ยเป็นทางออกที่ดีที่สุดเพราะจะช่วยกระตุ้นเศรษฐกิจที่ชะลอตัว · และค่าเงินที่อ่อนลงไปอีกจะยิ่งช่วยเพิ่มการส่งออกจนชดเชยผลของราคาพลังงานนำเข้าที่แพงขึ้นได้ทั้งหมด โดยเงินเฟ้อจะกลับเข้ากรอบเป้าหมายได้เองในที่สุด","ควรตรึงอัตราแลกเปลี่ยนไว้ที่ระดับเดิมโดยไม่จำกัดจำนวนเงินสำรองที่ใช้ · เพราะการรักษาค่าเงินให้นิ่งเป็นเป้าหมายที่สำคัญกว่าทั้งเงินเฟ้อและการว่างงานในทุกสถานการณ์โดยไม่มีข้อยกเว้น","ไม่มีความยากลำบากใดเลยเพราะค่าเงินที่อ่อนลงส่งผลดีต่อเศรษฐกิจในทุกด้าน · ธนาคารกลางจึงควรปล่อยให้ค่าเงินอ่อนลงต่อไปโดยไม่ต้องดำเนินมาตรการใด ๆ เพราะตลาดจะปรับตัวเองได้"],"answer":0,"a":"สถานการณ์นี้เป็นโจทย์ที่ธนาคารกลางของประเทศเปิดขนาดเล็กเจอบ่อย เพราะค่าเงินที่อ่อนเป็นทั้งปัญหาและทางออกในเวลาเดียวกัน\nทำไมค่าเงินที่อ่อนจึงเป็นปัญหาในกรณีนี้ — ประเทศที่พึ่งพาการนำเข้าพลังงานสูงจะเห็นค่าเงินที่อ่อนส่งผ่านไปสู่ราคาในประเทศอย่างรวดเร็วผ่านค่าน้ำมัน ค่าไฟ และค่าขนส่ง ซึ่งกระทบเกือบทุกสินค้า SRAS ถูกดันขึ้น เงินเฟ้อเร่งตัวขณะที่ผลผลิตลดลง\nความยากลำบาก\n· ขึ้นดอกเบี้ย — ดึงเงินทุนไหลเข้า พยุงค่าเงิน และสกัดเงินเฟ้อทั้งจากฝั่งอุปสงค์และฝั่งราคานำเข้า แต่ซ้ำเติมเศรษฐกิจที่ชะลออยู่แล้ว\n· ลดดอกเบี้ย — ช่วยเศรษฐกิจในประเทศ แต่เร่งให้เงินทุนไหลออก ค่าเงินอ่อนลงอีก เงินเฟ้อเร่งขึ้นอีก ซึ่งอาจกลายเป็นวงจรที่เลี้ยงตัวเอง\nแนวทางที่สมเหตุสมผล\n· ขึ้นดอกเบี้ยเท่าที่จำเป็น เพื่อส่งสัญญาณว่าจะไม่ปล่อยให้การคาดการณ์เงินเฟ้อหลุดกรอบ ซึ่งเป็นเส้นแบ่งที่สำคัญที่สุด\n· ใช้เงินสำรองลดความผันผวน ไม่ใช่ฝืนทิศทางพื้นฐาน เพราะการฝืนพื้นฐานจะเผาเงินสำรองไปเปล่า ๆ\n· สื่อสารอย่างชัดเจน ซึ่งเป็นเครื่องมือที่ต้นทุนต่ำที่สุดในการตรึงการคาดการณ์\n· ประสานกับมาตรการทางการคลังที่ช่วยกลุ่มเปราะบางแบบเฉพาะเจาะจงแทนการอุดหนุนราคาทั่วหน้า","whys":["ถูกต้อง — ระบุความขัดแย้งของเป้าหมายอย่างตรงไปตรงมา และเสนอแนวทางที่คำนึงถึงทั้งการคาดการณ์และข้อจำกัดของเงินสำรอง","ไม่ถูกต้อง — ในประเทศที่พึ่งพาการนำเข้าพลังงานสูง ผลด้านต้นทุนอาจใหญ่กว่าผลด้านการส่งออก และการลดดอกเบี้ยเสี่ยงต่อการเร่งวงจรเงินเฟ้อ","ไม่ถูกต้อง — เงินสำรองมีจำกัดและการฝืนพื้นฐานจะทำให้ถูกโจมตีค่าเงิน อีกทั้งค่าเงินไม่ใช่เป้าหมายที่สำคัญกว่าเสถียรภาพราคาในทุกกรณี","ไม่ถูกต้อง — ค่าเงินที่อ่อนมีทั้งผลบวกต่อการส่งออกและผลลบต่อต้นทุนนำเข้า จึงมีความยากลำบากที่ต้องชั่งน้ำหนักจริง"]},{"id":"X20","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"สังเคราะห์: วินิจฉัยและวางนโยบายในเศรษฐกิจเปิด","q":"ข้อมูลของประเทศเปิดขนาดเล็ก — ค่าเงินอ่อนลง 18% ในหกเดือน · เงินเฟ้อ 7% โดยสองในสามมาจากราคาสินค้านำเข้า · ผลผลิตต่ำกว่าศักยภาพและการว่างงานสูงกว่าอัตราธรรมชาติ 1.5 จุด · ภาคธุรกิจมีหนี้สกุลต่างประเทศสูง · เงินสำรองระหว่างประเทศอยู่ในระดับปานกลาง · ข้อใดคือชุดนโยบายที่เหมาะสมที่สุด","choices":["ขึ้นดอกเบี้ยอย่างระมัดระวังเพื่อตรึงการคาดการณ์และชะลอการอ่อนค่า · ใช้เงินสำรองลดความผันผวนโดยไม่ฝืนพื้นฐาน · ใช้มาตรการการคลังแบบเฉพาะเจาะจงช่วยกลุ่มเปราะบาง · เร่งดูแลความเสี่ยงหนี้สกุลต่างประเทศ","ลดดอกเบี้ยลงอย่างมากเพื่อปิดช่องว่างการหดตัวให้เร็วที่สุด · ปล่อยให้ค่าเงินอ่อนต่อไปเพื่อช่วยการส่งออก · ไม่ต้องใช้เงินสำรองเลยเพื่อเก็บไว้ใช้ในอนาคต · ปล่อยให้ภาคธุรกิจจัดการหนี้ของตัวเองไป","ขึ้นดอกเบี้ยอย่างรุนแรงที่สุดเท่าที่ทำได้ทันทีเพื่อดึงค่าเงินกลับมาที่ระดับเดิมภายในไตรมาสเดียว · ใช้เงินสำรองทั้งหมดที่มีเพื่อตรึงค่าเงินไว้ · ตัดรายจ่ายภาครัฐลงเพื่อแสดงวินัยการคลังให้ตลาดเห็น","คงดอกเบี้ยไว้เท่าเดิมและไม่ดำเนินมาตรการใด ๆ · เพราะเงินเฟ้อที่มาจากราคาสินค้านำเข้าเป็นเรื่องภายนอกที่นโยบายในประเทศแก้ไม่ได้ · และค่าเงินจะกลับมาแข็งขึ้นเองตามอำนาจซื้อเสมอภาคในที่สุด"],"answer":0,"a":"โจทย์สังเคราะห์ที่รวมทุกความขัดแย้งของเศรษฐกิจเปิดเข้าไว้ด้วยกัน ต้องอ่านข้อมูลทุกชิ้นให้ครบ\nวินิจฉัยสถานการณ์\n· เงินเฟ้อ 7% ที่สองในสามมาจากราคาสินค้านำเข้า → เป็นช็อกต้นทุนจากค่าเงินที่อ่อน ไม่ใช่เศรษฐกิจร้อนแรง\n· ผลผลิตต่ำกว่าศักยภาพและการว่างงานสูงกว่าอัตราธรรมชาติ → มีช่องว่างการหดตัว จึงไม่ควรกระชากดอกเบี้ยขึ้นแรง\n· หนี้สกุลต่างประเทศสูง → การอ่อนค่าเป็นความเสี่ยงต่อเสถียรภาพระบบการเงิน ไม่ใช่เพียงเรื่องเงินเฟ้อ\n· เงินสำรองปานกลาง → มีกระสุนอยู่บ้างแต่ไม่พอฝืนพื้นฐาน\nเหตุผลของแต่ละมาตรการ\n· ขึ้นดอกเบี้ยอย่างระมัดระวัง — ต้องขึ้นเพราะการอ่อนค่า 18% ในหกเดือนมีความเสี่ยงที่การคาดการณ์จะหลุดกรอบ แต่ต้องระมัดระวังเพราะเศรษฐกิจอ่อนแอและหนี้สกุลต่างประเทศทำให้การอ่อนค่าเพิ่มเติมอันตราย\n· ใช้เงินสำรองลดความผันผวน — ช่วยไม่ให้ค่าเงินเคลื่อนไหวเร็วเกินกว่าที่ภาคธุรกิจจะปรับตัวได้ แต่ไม่ฝืนทิศทางพื้นฐานเพราะจะเผาสำรองไปเปล่า ๆ\n· มาตรการการคลังแบบเฉพาะเจาะจง — ช่วยกลุ่มเปราะบางที่รับผลกระทบจากราคาพลังงานและอาหาร โดยไม่อุดหนุนทั่วหน้าซึ่งแพงและบิดเบือนราคา\n· ดูแลความเสี่ยงหนี้สกุลต่างประเทศ — ส่งเสริมการป้องกันความเสี่ยงค่าเงินและติดตามธุรกิจที่เปราะบาง เพื่อป้องกันไม่ให้ปัญหาค่าเงินลุกลามเป็นวิกฤตสถาบันการเงิน\nหลักคิดที่สรุปได้ — เมื่อเครื่องมือน้อยกว่าเป้าหมาย ต้องใช้เครื่องมือหลายชนิดประกอบกัน และเลือกขนาดของแต่ละมาตรการให้เหมาะกับน้ำหนักของแต่ละความเสี่ยง","whys":["ถูกต้อง — ใช้ข้อมูลทุกชิ้นในการเลือกทั้งชนิดและขนาดของมาตรการ และใช้เครื่องมือหลายชนิดประกอบกันเพราะเป้าหมายมีมากกว่าหนึ่ง","ไม่ถูกต้อง — การลดดอกเบี้ยจะเร่งการอ่อนค่าซึ่งอันตรายมากเมื่อภาคธุรกิจมีหนี้สกุลต่างประเทศสูง และเสี่ยงให้การคาดการณ์หลุดกรอบ","ไม่ถูกต้อง — การขึ้นดอกเบี้ยรุนแรงและตัดรายจ่ายจะซ้ำเติมช่องว่างการหดตัว และการใช้เงินสำรองทั้งหมดฝืนพื้นฐานจะเชิญการโจมตีค่าเงิน","ไม่ถูกต้อง — การนิ่งเฉยเสี่ยงให้การคาดการณ์เงินเฟ้อหลุดกรอบ และอำนาจซื้อเสมอภาคเป็นแรงโน้มถ่วงระยะยาวที่ช้าเกินกว่าจะพึ่งพาในสถานการณ์นี้"],"tip":"หลักสำหรับโจทย์สังเคราะห์เศรษฐกิจเปิด: เป้าหมายหลายอย่างต้องใช้เครื่องมือหลายชนิด — และข้อมูลแต่ละชิ้น (หนี้สกุลต่างประเทศ · ระดับเงินสำรอง · ต้นตอของเงินเฟ้อ) เป็นตัวกำหนดขนาดของแต่ละมาตรการ"}]});

// โจทย์เพิ่มเติม: อัตราแลกเปลี่ยน — นำเข้าจากไฟล์ที่ผู้ใช้ส่งมา (HTML→ข้อความ) 28 ข้อ
registerSet({"id":"imp-fx","title":"โจทย์เพิ่มเติม: อัตราแลกเปลี่ยน","kind":"import","exam":true,"mcqPool":true,"topic":"โจทย์เพิ่มเติม","source":"ไฟล์ที่คุณส่งมา (โจทย์เพิ่มเติม: อัตราแลกเปลี่ยน)","conf":"import","questions":[{"id":"C01","type":"mcq","lvl":2,"topic":"อัตราแลกเปลี่ยน","ref":"ความหมายของอัตราแลกเปลี่ยน (nominal exchange rate)","q":"ตามนิยาม อัตราแลกเปลี่ยนตามชื่อ (nominal exchange rate, e_nom) คือค่าใด และถ้าอัตราแลกเปลี่ยนเท่ากับ 120 เยนต่อ 1 ดอลลาร์ ในมุมของสหรัฐฯ หมายความว่าอย่างไร","choices":["คือจำนวนหน่วยเงินต่างประเทศที่แลกได้ต่อเงินในประเทศ 1 หน่วย ดังนั้น 1 ดอลลาร์แลกได้ 120 เยน และเมื่อค่านี้สูงขึ้น เงินดอลลาร์แข็งค่าขึ้นเมื่อเทียบกับเยน","คือจำนวนหน่วยเงินในประเทศที่ต้องจ่ายเพื่อซื้อสินค้าต่างประเทศ 1 หน่วย ดังนั้น 1 ดอลลาร์ซื้อสินค้าญี่ปุ่นได้ 120 หน่วย และเมื่อค่านี้สูงขึ้น เงินดอลลาร์อ่อนค่าลง","คืออัตราส่วนระดับราคาสินค้าของสองประเทศ ดังนั้นสินค้า 1 ชิ้นในสหรัฐฯ ราคาเท่ากับ 120 ชิ้นในญี่ปุ่นเสมอ และเมื่อค่านี้สูงขึ้น ราคาสินค้าภายในประเทศแพงขึ้นเทียบกับเยน","คือจำนวนหน่วยเงินต่างประเทศที่แลกได้ต่อเงินในประเทศ 1 หน่วย ดังนั้น 1 เยนแลกได้ 120 ดอลลาร์ และเมื่อค่านี้สูงขึ้น เงินดอลลาร์แข็งค่าขึ้นเมื่อเทียบกับเยนเช่นกัน"],"answer":0,"a":"จากสไลด์ Chapter 13 (Pearson): nominal exchange rate = จำนวนหน่วยเงินต่างประเทศที่ได้รับต่อเงินในประเทศ 1 หน่วย ตัวอย่างในสไลด์คือ 120 เยนต่อ 1 ดอลลาร์\nขั้นที่ 1 — ระบุว่าใครคือ “เงินในประเทศ” โจทย์ถามมุมสหรัฐฯ ดังนั้นเงินในประเทศคือดอลลาร์ และเงินต่างประเทศคือเยน\nขั้นที่ 2 — อ่านตัวเลข 120 เป็น “เยนที่ได้ต่อ 1 ดอลลาร์” จึงแลก $1 ได้ ¥120\nขั้นที่ 3 — ถ้าตัวเลขนี้เพิ่มเป็น 130 แสดงว่า $1 แลกเยนได้มากขึ้น คือดอลลาร์แข็งค่า (appreciation)\nข้อควรระวัง — ตัวเลือกที่กลับด้าน (1 เยน = 120 ดอลลาร์) คือการสลับหน่วยตัวตั้งกับตัวหาร ซึ่งเป็นข้อผิดที่พบบ่อยที่สุดในบทนี้","whys":["ถูกต้อง — นิยามถูกว่าเป็นหน่วยเงินต่างประเทศต่อเงินในประเทศ 1 หน่วย และตัวเลข 120 อ่านได้ว่า $1 แลก ¥120 ค่าสูงขึ้นคือดอลลาร์แข็งค่า","ไม่ถูกต้อง — นิยามผิด อัตราแลกเปลี่ยนเป็นราคาของเงินสกุลหนึ่งในหน่วยของอีกสกุล ไม่ใช่จำนวนสินค้าที่ซื้อได้ และทิศทางการแข็งค่าก็กลับด้าน","ไม่ถูกต้อง — ข้อนี้อธิบายอัตราแลกเปลี่ยนที่แท้จริงโดยปนกับสมมติฐานราคาเท่ากันเสมอ ซึ่งไม่ใช่นิยามของอัตราแลกเปลี่ยนตามชื่อ","ไม่ถูกต้อง — นิยามถูกแต่การอ่านค่ากลับด้าน 120 เยนต่อ 1 ดอลลาร์หมายถึง $1 แลกได้ ¥120 ไม่ใช่ ¥1 แลกได้ $120"],"tip":"อ่านอัตราแลกเปลี่ยนเป็นประโยคเสมอ: “1 หน่วยของเงินในประเทศแลกเงินต่างประเทศได้กี่หน่วย” แล้วค่อยตัดสินแข็งหรืออ่อน"},{"id":"C03","type":"mcq","lvl":3,"topic":"อัตราแลกเปลี่ยน","ref":"ตีความตัวเลขอัตราแลกเปลี่ยนของประเทศ BB","q":"ประเทศ BB ใช้อัตราแลกเปลี่ยนแบบลอยตัว ดุลยภาพเดิมคือ 30 BBD = 1 ดอลลาร์สหรัฐ (BBD เป็นสกุลเงินของ BB) ต่อมาตลาดเปลี่ยนไปเป็น 36 BBD = 1 ดอลลาร์สหรัฐ ข้อใดสรุปการเปลี่ยนแปลงนี้ได้ถูกต้อง","choices":["BBD อ่อนค่า (depreciation) เพราะต้องใช้ BBD มากขึ้นเพื่อแลก 1 ดอลลาร์ ขณะที่ดอลลาร์ที่ได้ต่อ 1 BBD ลดจาก 0.0333 เหลือ 0.0278","BBD แข็งค่า (appreciation) เพราะตัวเลขอัตราแลกเปลี่ยนเพิ่มขึ้นจาก 30 เป็น 36 และเมื่อตัวเลขสูงขึ้นแปลว่าเงินสกุล BBD มีมูลค่ามากขึ้น","BBD อ่อนค่า (devaluation) เพราะเปลี่ยนแปลงถึง 20% ซึ่งใหญ่พอที่จะเรียกว่าลดค่าเงิน ทั้งที่ BB ใช้ระบบลอยตัวซึ่งไม่มีการประกาศปรับค่า","BBD ไม่เปลี่ยนค่า เพราะอัตราแลกเปลี่ยนที่แท้จริงคงเดิมแม้ตัวเลขอัตราแลกเปลี่ยนตามชื่อจะเปลี่ยน ผู้ซื้อสินค้าจึงไม่รู้สึกถึงความแตกต่างใด ๆ"],"answer":0,"a":"ตัวเลข “BBD ต่อ 1 ดอลลาร์” ที่เพิ่มขึ้นทำให้สับสนได้ ให้แปลงเป็นมุมของ BB\nขั้นที่ 1 — แปลงเป็นดอลลาร์ต่อ 1 BBD: ก่อน = 1 ÷ 30 = 0.0333 · หลัง = 1 ÷ 36 = 0.0278\nขั้นที่ 2 — 1 BBD แลกดอลลาร์ได้น้อยลง = BBD อ่อนค่า\nขั้นที่ 3 — ระบบลอยตัว จึงเรียก depreciation (ไม่ใช่ devaluation)\nกฎลัด — ถ้าอัตราคือ “เงินต่างประเทศต่อเงินในประเทศ” ตัวเลขขึ้น = แข็ง แต่ถ้าอัตราคือ “เงินในประเทศต่อเงินต่างประเทศ” (แบบ 30 BBD/$) ตัวเลขขึ้น = อ่อน","whys":["ถูกต้อง — ต้องใช้ BBD มากขึ้นเพื่อแลก 1 ดอลลาร์ และ 1 BBD แลกดอลลาร์ได้น้อยลง (0.0333 → 0.0278) จึงเป็น depreciation ของ BBD","ไม่ถูกต้อง — เป็นการอ่านทิศทางกลับด้านโดยลืมว่าตัวเลข 30 และ 36 เป็นจำนวน BBD ต่อ 1 ดอลลาร์ ตัวเลขที่สูงขึ้นหมายความว่า BBD ถูกลง","ไม่ถูกต้อง — ทิศถูกแต่ศัพท์ผิด devaluation ใช้เฉพาะระบบคงที่ที่ทางการประกาศปรับ ส่วนระบบลอยตัวใช้คำว่า depreciation","ไม่ถูกต้อง — ค่าเงินตามชื่อเปลี่ยนจริง 1 BBD แลกดอลลาร์ได้น้อยลง และข้ออ้างเรื่องอัตราที่แท้จริงไม่เกี่ยวกับการตัดสินว่าเงินอ่อนหรือแข็ง"]},{"id":"C04","type":"mcq","lvl":2,"topic":"อัตราแลกเปลี่ยน","ref":"อัตราสปอตและอัตราล่วงหน้า (spot / forward)","q":"นักค้าเงินพบว่าอัตราล่วงหน้า (forward rate) ของเงินบาทเทียบดอลลาร์ที่ครบกำหนด 90 วัน 180 วัน และ 360 วัน สูงขึ้นตามลำดับเมื่อเทียบกับอัตราสปอตวันนี้ รูปแบบนี้สื่อถึงอะไร","choices":["ผู้คนในตลาดคาดว่าอัตราสปอตจะสูงขึ้นในอนาคต เพราะอัตราล่วงหน้าคือราคาของเงินที่ตกลงซื้อขายกันล่วงหน้า ณ วันที่กำหนดในอนาคต จึงสะท้อนความคาดหวังของตลาด","ผู้คนในตลาดคาดว่าอัตราสปอตจะลดลงในอนาคต เพราะอัตราล่วงหน้าที่สูงกว่าแปลว่าผู้ซื้อต้องจ่ายแพงขึ้นเพื่อป้องกันความเสี่ยง ซึ่งเป็นสัญญาณของการอ่อนค่า","ธนาคารกลางมีนโยบายตรึงอัตราแลกเปลี่ยนไว้ที่ระดับเดิม เพราะอัตราล่วงหน้าคือเพดานที่ธนาคารกลางประกาศไว้ล่วงหน้าเพื่อควบคุมอัตราสปอตของวันนี้","ไม่สื่อถึงสิ่งใด เพราะอัตราล่วงหน้ากับอัตราสปอตเป็นคนละตลาดและไม่มีความเกี่ยวข้องกัน อัตราล่วงหน้าจึงไม่ได้สะท้อนอะไรเกี่ยวกับอนาคตเลย"],"answer":0,"a":"จากสไลด์หัวข้อ “In touch with data and research: Exchange rates”\n· spot rate — อัตราที่แลกเปลี่ยนกันได้ทันที\n· forward rate — อัตราที่ตกลงแลกเปลี่ยนกัน ณ วันที่กำหนดในอนาคต เช่น 90 หรือ 180 วันข้างหน้า\nสไลด์ระบุตรง ๆ ว่า รูปแบบของอัตราล่วงหน้าที่สูงขึ้น (rising forward rates) แสดงว่าผู้คนคาดว่าอัตราสปอตจะสูงขึ้นในอนาคต\nตรวจ — ตลาดที่เชื่อว่าเงินบาทจะแข็งขึ้นจึงยอมจ่ายแพงขึ้นเพื่อล็อกอัตราล่วงหน้า","whys":["ถูกต้อง — ตรงกับสไลด์ อัตราล่วงหน้าที่สูงขึ้นเป็นสัญญาณว่าตลาดคาดว่าอัตราสปอตจะสูงขึ้นในอนาคต","ไม่ถูกต้อง — ทิศคาดการณ์กลับด้าน อัตราล่วงหน้าที่สูงขึ้นสะท้อนการคาดว่าอัตราสปอตสูงขึ้น ไม่ใช่ลดลง","ไม่ถูกต้อง — อัตราล่วงหน้าไม่ใช่เพดานของธนาคารกลาง แต่เป็นราคาที่ตลาดตกลงกันสำหรับการแลกเปลี่ยนในอนาคต","ไม่ถูกต้อง — ทั้งสองอัตราเชื่อมโยงกันและอัตราล่วงหน้าสะท้อนความคาดหวังเกี่ยวกับอัตราสปอตในอนาคต ข้ออ้างว่าไม่เกี่ยวข้องจึงผิด"]},{"id":"C05","type":"mcq","lvl":3,"topic":"อัตราแลกเปลี่ยน","ref":"เหตุผลที่คนต้องการและเสนอขายเงินสกุลหนึ่ง","q":"กรณีใดต่อไปนี้ทำให้ชาวต่างชาติต้องซื้อเงินบาท (เพิ่มอุปสงค์ต่อบาท) ในตลาดแลกเปลี่ยนเงินตรา","choices":["บริษัทอเมริกันสั่งซื้อข้าวหอมมะลิจากไทย และกองทุนต่างชาติซื้อพันธบัตรรัฐบาลไทย เพราะทั้งสองต้องจ่ายค่าสินค้าและสินทรัพย์ด้วยเงินบาท","ผู้นำเข้าชาวไทยสั่งซื้อรถยนต์จากญี่ปุ่น และกองทุนไทยซื้อหุ้นบริษัทอเมริกัน เพราะทั้งสองต้องจ่ายด้วยเงินต่างประเทศซึ่งต้องนำบาทไปแลก","นักท่องเที่ยวไทยเดินทางไปเที่ยวญี่ปุ่น และบริษัทไทยไปลงทุนสร้างโรงงานในเวียดนาม เพราะทั้งสองต้องใช้เงินต่างประเทศในการใช้จ่ายและลงทุน","ธนาคารกลางไทยซื้อดอลลาร์ไว้เป็นทุนสำรองระหว่างประเทศ และรัฐบาลไทยจ่ายหนี้ต่างประเทศ เพราะทั้งสองต้องการเงินดอลลาร์มากกว่าเงินบาท"],"answer":0,"a":"จากสไลด์ “Why do people demand or supply dollars?” (ใช้บาทแทนดอลลาร์) เหตุผลของการต้องการเงินบาทมีสองข้อ:\n1. เพื่อซื้อสินค้าและบริการของไทย (การส่งออกของไทย)\n2. เพื่อซื้อสินทรัพย์จริงและสินทรัพย์การเงินของไทย (เงินทุนไหลเข้า)\nเหตุผลของการเสนอขายบาทก็มีสองข้อเช่นกัน คือเพื่อซื้อสินค้าต่างประเทศ (การนำเข้าของไทย) และซื้อสินทรัพย์ต่างประเทศ (เงินทุนไหลออก)\nตรวจ — ข้อที่ถูกมีทั้งส่งออกและเงินทุนไหลเข้า ส่วนข้ออื่นเป็นการนำเข้าหรือเงินทุนไหลออก ซึ่งเพิ่มอุปทานของบาทไม่ใช่อุปสงค์","whys":["ถูกต้อง — การซื้อสินค้าไทยและสินทรัพย์ไทยต้องจ่ายด้วยบาท ทั้งสองกรณีเพิ่มอุปสงค์ต่อบาท ตรงกับสองเหตุผลในสไลด์","ไม่ถูกต้อง — การนำเข้าและการซื้อสินทรัพย์ต่างประเทศ (เงินทุนไหลออก) ทำให้คนไทยขายบาทซื้อเงินต่างประเทศ จึงเพิ่มอุปทานของบาท","ไม่ถูกต้อง — การท่องเที่ยวต่างประเทศและการลงทุนโดยตรงในต่างประเทศคือรายจ่ายและเงินทุนไหลออก ซึ่งเพิ่มอุปทานของบาท ไม่ใช่อุปสงค์","ไม่ถูกต้อง — ธนาคารกลางไทยซื้อดอลลาร์และรัฐบาลชำระหนี้ต่างประเทศคือการขายบาทเพื่อซื้อดอลลาร์ ซึ่งเพิ่มอุปทานของบาท"],"tip":"ถามตัวเองว่า “ใครต้องจ่ายเงินบาทให้ผู้ขายชาวไทย?” ถ้าคนต่างชาติจ่ายบาท = อุปสงค์ต่อบาท · ถ้าคนไทยจ่ายสกุลอื่น = อุปทานของบาท"},{"id":"C06","type":"mcq","lvl":3,"topic":"อัตราแลกเปลี่ยน","ref":"แปลงราคาสินค้าด้วยอัตราแลกเปลี่ยน","q":"อัตราแลกเปลี่ยนระหว่างไทยกับญี่ปุ่นเท่ากับ 1 บาท = 0.80 เยน หากเสื้อตัวหนึ่งราคา 2,400 เยนในกรุงโตเกียว ราคาเสื้อตัวนี้เมื่อคิดเป็นเงินบาทเท่ากับเท่าใด","choices":["3,000 บาท","1,920 บาท","2,400 บาท","30,000 บาท"],"answer":0,"a":"อ่านอัตรา — 1 บาท = 0.80 เยน หมายความว่า ¥0.80 มีค่าเท่า ฿1\nขั้นที่ 1 — หาราคา ¥1 เป็นบาท = 1 ÷ 0.80 = ฿1.25\nขั้นที่ 2 — ราคาเสื้อ = 2,400 × 1.25 = ฿3,000 (หรือ 2,400 ÷ 0.80)\nตรวจ — 3,000 บาท × 0.80 = 2,400 เยน ✓\nข้อสังเกต — เมื่อรู้ “เงินต่างประเทศต่อ 1 บาท” การแปลงเงินต่างประเทศเป็นบาทต้องหาร ไม่ใช่คูณ","whys":["ถูกต้อง — แปลงเยนเป็นบาทด้วยการหารด้วย 0.80 ได้ 3,000 บาท และตรวจกลับ 3,000 × 0.80 = 2,400 เยน","ไม่ถูกต้อง — เกิดจากการคูณ 2,400 ด้วย 0.80 ซึ่งเป็นการแปลงผิดทิศ ราคาเป็นบาทต้องมากกว่าราคาเป็นเยนเมื่อ 1 บาทแลกได้ไม่ถึง 1 เยน","ไม่ถูกต้อง — เป็นการตอบว่าตัวเลขเท่ากันโดยไม่แปลงหน่วยเงิน ทั้งที่ 1 บาทกับ 1 เยนมีมูลค่าไม่เท่ากัน","ไม่ถูกต้อง — เกิดจากการเลื่อนจุดทศนิยมผิดหนึ่งตำแหน่ง ซึ่งทำให้ราคาในรูปบาทสูงเกินจริงสิบเท่า"]},{"id":"C07","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"เงินทุนไหลออกจากประเทศ BB (ข้อ 1 ในแบบฝึกหัด)","q":"ประเทศ BB ใช้ระบบลอยตัว ดุลยภาพเดิมคือ 30 BBD = 1 ดอลลาร์ เกิดวิกฤตเศรษฐกิจในประเทศ BB นักลงทุนต่างชาติถอนเงินลงทุนออกไปลงทุนในสหรัฐฯ แทน กราฟแสดงตลาดเงิน BBD ข้อใดอธิบายการเลื่อนของเส้นและผลต่ออัตราแลกเปลี่ยนได้ถูกต้อง","choices":["นักลงทุนขาย BBD เพื่อซื้อดอลลาร์ ทำให้อุปสงค์ต่อ BBD ลดลง (เส้นเลื่อนซ้าย) และอุปทาน BBD เพิ่มขึ้น (เส้นเลื่อนขวา) ดอลลาร์ต่อ 1 BBD ลดลง BBD อ่อนค่า","นักลงทุนซื้อ BBD เพื่อนำไปลงทุนในประเทศ BB ทำให้อุปสงค์ต่อ BBD เพิ่มขึ้น (เส้นเลื่อนขวา) และอุปทาน BBD ลดลง (เส้นเลื่อนซ้าย) BBD แข็งค่าขึ้นมาก","นักลงทุนขาย BBD เพื่อซื้อดอลลาร์ ทำให้อุปสงค์ต่อ BBD ลดลง (เส้นเลื่อนซ้าย) แต่อุปทาน BBD ไม่เปลี่ยนแปลง เพราะ BBD ที่ขายถูกธนาคารกลางซื้อกลับไปทั้งหมด","นักลงทุนถอนเงินแต่ไม่ได้เปลี่ยนสกุลเงิน จึงไม่มีผลต่อตลาดเงิน BBD เส้นอุปสงค์และอุปทานคงเดิม อัตราแลกเปลี่ยนจึงอยู่ที่ 30 BBD ต่อดอลลาร์เหมือนเดิม"],"answer":0,"a":"โจทย์ข้อนี้ตรงกับแบบฝึกหัดของ ผศ. ดร. ธนารักษ์ ข้อ 1 ซึ่งให้อธิบายพร้อมวาดกราฟ ลำดับคำตอบมาตรฐานคือ\nขั้นที่ 1 ใครขายอะไร — ต่างชาติถอนเงินลงทุนเพื่อไปลงทุนในสหรัฐฯ ต้องแลก BBD เป็นดอลลาร์ = ขาย BBD ซื้อดอลลาร์\nขั้นที่ 2 เส้นที่เลื่อน — ต่างชาติไม่ซื้อสินทรัพย์ BB จึงอุปสงค์ต่อ BBD ลดลง (D เลื่อนซ้าย) และเงินทุนไหลออกทำให้ อุปทาน BBD เพิ่มขึ้น (S เลื่อนขวา)\nขั้นที่ 3 ผล — ราคาของ BBD ลดลง: ดอลลาร์ต่อ 1 BBD ลดลง (หรือ BBD ต่อ 1 ดอลลาร์เพิ่มจาก 30) = BBD อ่อนค่า\nตรวจกับกราฟ — จุดดุลยภาพใหม่ e₂ อยู่ต่ำกว่า e₁","whys":["ถูกต้อง — ตรงกับตารางสรุป: เงินทุนไหลออกลดอุปสงค์และเพิ่มอุปทานของเงินในประเทศ ทำให้อัตราแลกเปลี่ยนลดลงและ BBD อ่อนค่า","ไม่ถูกต้อง — ทิศกลับด้านทั้งหมด เหตุการณ์ในโจทย์คือเงินทุนไหลออกจาก BB ไม่ใช่ไหลเข้า จึงไม่มีการซื้อ BBD เพิ่ม","ไม่ถูกต้อง — เมื่อนักลงทุนขาย BBD ปริมาณ BBD ที่เสนอขายในตลาดย่อมเพิ่มขึ้น และตลาดลอยตัวไม่มีธนาคารกลางซื้อกลับ","ไม่ถูกต้อง — การถอนเงินลงทุนไปสหรัฐฯ ต้องแลกเงินจาก BBD เป็นดอลลาร์ จึงกระทบทั้งอุปสงค์และอุปทานของ BBD อย่างแน่นอน"],"tip":"เงินทุนไหลออก = ขายเงินในประเทศ → D ซ้าย + S ขวา → ค่าเงินอ่อน · เงินทุนไหลเข้า = ตรงข้าม","fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n    <defs><clipPath id=\"clipFX\"><rect x=\"76\" y=\"34\" width=\"422\" height=\"296\"/></clipPath></defs>\n    <line x1=\"76\" y1=\"26\" x2=\"76\" y2=\"330\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n    <line x1=\"76\" y1=\"330\" x2=\"512\" y2=\"330\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n    <text x=\"70\" y=\"20\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"middle\">e (อัตราแลกเปลี่ยน)</text>\n    <text x=\"516\" y=\"336\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"end\" transform=\"translate(0,22)\">ปริมาณเงิน BBD ในตลาดเงินตราต่างประเทศ</text>\n    <g clip-path=\"url(#clipFX)\"><line x1=\"97.1\" y1=\"69.51999999999998\" x2=\"476.9\" y2=\"306.32\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\" stroke-dasharray=\"7 5\"/><line x1=\"97.1\" y1=\"306.32\" x2=\"476.9\" y2=\"69.51999999999998\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\" stroke-dasharray=\"7 5\"/><line x1=\"38.02\" y1=\"69.51999999999998\" x2=\"417.82000000000005\" y2=\"306.32\" stroke=\"var(--curve-ad)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><line x1=\"156.18\" y1=\"306.32\" x2=\"535.98\" y2=\"69.51999999999998\" stroke=\"var(--curve-as)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><circle cx=\"287\" cy=\"187.92000000000002\" r=\"4.5\" fill=\"var(--surface)\" stroke=\"var(--muted)\" stroke-width=\"2\"/><line x1=\"287\" y1=\"187.92000000000002\" x2=\"76\" y2=\"187.92000000000002\" stroke=\"var(--line-2)\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/><circle cx=\"287\" cy=\"224.75555555555553\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><line x1=\"287\" y1=\"224.75555555555553\" x2=\"76\" y2=\"224.75555555555553\" stroke=\"var(--line-2)\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/></g><text x=\"337.2\" y=\"255.06666666666666\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--curve-ad)\">D&#8322; (อุปสงค์)</text><text x=\"404.72\" y=\"160.34666666666666\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--curve-as)\">S&#8322; (อุปทาน)</text><text x=\"67\" y=\"192.92000000000002\" font-size=\"13\" fill=\"var(--muted)\" text-anchor=\"end\">e<tspan dy=\"3\" font-size=\"10\">1</tspan></text><text x=\"67\" y=\"229.75555555555553\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"end\">e<tspan dy=\"3\" font-size=\"10\">2</tspan></text>\n  </svg><div class=\"figcap\">ตลาดเงิน BBD · เส้นอุปสงค์เลื่อนซ้ายและเส้นอุปทานเลื่อนขวา · เส้นประคือตำแหน่งเดิม</div></div>"},{"id":"C08","type":"mcq","lvl":3,"topic":"อัตราแลกเปลี่ยน","ref":"ผลต่อการส่งออกของ BB หลังเงินอ่อนค่า (ข้อ 1)","q":"จากวิกฤตในประเทศ BB ที่ทำให้ BBD อ่อนค่า ผลดังกล่าวส่งผลต่อการส่งออกของ BB อย่างไร และอธิบายได้อย่างไร (กำหนดให้ราคาสินค้าภายในประเทศ BB เป็นเงิน BBD ไม่เปลี่ยนแปลงในระยะแรก)","choices":["การส่งออกเพิ่มขึ้น เพราะ BBD อ่อนค่าทำให้สินค้า BB ราคาเป็นดอลลาร์ถูกลงสำหรับชาวต่างชาติ ความต้องการซื้อสินค้า BB จึงสูงขึ้น การส่งออกสุทธิเพิ่ม","การส่งออกลดลง เพราะ BBD อ่อนค่าทำให้ราคาสินค้า BB เป็นดอลลาร์สูงขึ้นสำหรับชาวต่างชาติ ความต้องการซื้อสินค้า BB จึงลดลง การส่งออกสุทธิลดลง","การส่งออกไม่เปลี่ยนแปลง เพราะราคาสินค้าเป็น BBD คงเดิม ผู้ซื้อต่างชาติจึงไม่รู้สึกถึงความต่างใด ๆ แม้อัตราแลกเปลี่ยนจะเปลี่ยนไปอย่างมาก","การส่งออกเพิ่มขึ้น เพราะ BBD อ่อนค่าทำให้ต้นทุนวัตถุดิบนำเข้าถูกลงมาก ผู้ผลิตจึงผลิตสินค้าส่งออกได้มากขึ้นและส่งออกเพิ่มโดยไม่เกี่ยวกับราคาในมุมผู้ซื้อ"],"answer":0,"a":"ส่วนที่สองของข้อ 1 ถามผลต่อการส่งออก\nขั้นที่ 1 — ราคาสินค้า BB เป็น BBD คงเดิม แต่ 1 ดอลลาร์แลกได้ BBD มากขึ้น (เช่น 30 → 36)\nขั้นที่ 2 — ผู้ซื้อชาวต่างชาติจ่ายดอลลาร์น้อยลงต่อสินค้าเดิม สินค้า BB ถูกลงในสายตาต่างชาติ\nขั้นที่ 3 — อุปสงค์ต่อสินค้า BB เพิ่ม การส่งออกและการส่งออกสุทธิเพิ่มขึ้น\nเชื่อมกับสไลด์ — อัตราแลกเปลี่ยนที่แท้จริงลดลง = สินค้าในประเทศถูกลงเมื่อเทียบกับสินค้าต่างประเทศ ดังนั้นการส่งออกสุทธิเพิ่ม (the higher the real exchange rate, the lower a country’s net exports)","whys":["ถูกต้อง — BBD อ่อนค่า สินค้า BB ถูกลงเมื่อคิดเป็นดอลลาร์ ความต้องการจากต่างชาติเพิ่ม การส่งออกสุทธิเพิ่ม","ไม่ถูกต้อง — ทิศกลับด้าน เงินที่อ่อนค่าทำให้สินค้าถูกลงในสายตาต่างชาติ ไม่ใช่แพงขึ้น จึงเพิ่มการส่งออกไม่ใช่ลด","ไม่ถูกต้อง — แม้ราคาเป็น BBD คงเดิม แต่ราคาที่ผู้ซื้อต่างชาติจ่ายเป็นดอลลาร์เปลี่ยนไปตามอัตราแลกเปลี่ยน จึงกระทบการส่งออก","ไม่ถูกต้อง — ผลหลักของค่าเงินอ่อนต่อการส่งออกมาจากราคาที่ต่างชาติเผชิญ ไม่ใช่ต้นทุนนำเข้า และข้ออ้างนี้ข้ามกลไกราคาไปทั้งหมด"]},{"id":"C09","type":"mcq","lvl":3,"topic":"อัตราแลกเปลี่ยน","ref":"คำนวณราคาสินค้าส่งออกเป็นดอลลาร์","q":"สินค้าส่งออกของประเทศ BB ราคา 6,000 BBD ต่อชิ้น ก่อนเกิดวิกฤตอัตราแลกเปลี่ยนคือ 30 BBD = 1 ดอลลาร์ หลังเกิดวิกฤตเปลี่ยนเป็น 40 BBD = 1 ดอลลาร์ ราคาสินค้าชิ้นนี้ในสายตาผู้ซื้อชาวอเมริกัน (หน่วยดอลลาร์) เปลี่ยนจากเดิมเป็นเท่าใด","choices":["$200 → $150","$200 → $240","$180 → $150","$150 → $200"],"answer":0,"a":"สูตร — ราคาเป็นดอลลาร์ = ราคาเป็น BBD ÷ (BBD ต่อ 1 ดอลลาร์)\nก่อนวิกฤต — 6,000 ÷ 30 = $200\nหลังวิกฤต — 6,000 ÷ 40 = $150\nความหมาย — สินค้า BB ถูกลง 25% ในสายตาผู้ซื้อต่างชาติ (200 → 150) จึงกระตุ้นการส่งออก\nข้อควรระวัง — หากคูณแทนที่จะหาร จะได้ 6,000 × 30 = 180,000 ซึ่งไม่ใช่ราคาดอลลาร์","whys":["ถูกต้อง — 6,000 ÷ 30 = $200 ก่อนวิกฤต และ 6,000 ÷ 40 = $150 หลังวิกฤต ราคาในสายตาต่างชาติถูกลง","ไม่ถูกต้อง — ราคาหลังวิกฤตเป็น $240 เกิดจากการคำนวณผิดทิศ ซึ่งขัดกับหลักว่าเงินที่อ่อนค่าทำให้สินค้าถูกลงในสายตาต่างชาติ","ไม่ถูกต้อง — ราคาก่อนวิกฤตไม่ใช่ $180 เพราะ 6,000 ÷ 30 = 200 ไม่ใช่ 180 จึงเป็นการคำนวณก่อนวิกฤตผิด","ไม่ถูกต้อง — สลับลำดับก่อนกับหลัง ซึ่งทำให้สรุปว่าสินค้าแพงขึ้นทั้งที่ BBD อ่อนค่าและสินค้าควรถูกลง"]},{"id":"C10","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"ยกเว้นภาษีส่งออก (ข้อ 2 ในแบบฝึกหัด)","q":"ประเทศตองต้องการส่งเสริมการส่งออก นักเศรษฐศาสตร์เสนอให้ยกเว้นภาษีส่งออก ข้อใดประเมินนโยบายนี้โดยใช้กลไกของอัตราแลกเปลี่ยนได้ถูกต้องที่สุด","choices":["ช่วยเพิ่มการส่งออกได้ แต่ไม่เต็มที่ เพราะการส่งออกที่เพิ่มทำให้ความต้องการเงินตองสูงขึ้นและเงินแข็งค่า สินค้าส่งออกจึงแพงขึ้นสำหรับต่างชาติและหักล้างผลบางส่วน","ช่วยเพิ่มการส่งออกได้เต็มที่ เพราะต้นทุนผู้ส่งออกลดลงและอัตราแลกเปลี่ยนไม่ได้รับผลกระทบใด ๆ การส่งออกจึงเพิ่มตามต้นทุนที่ลดลงโดยไม่มีแรงต้านใดเลย","ไม่ช่วยเพิ่มการส่งออกเลย เพราะการส่งออกที่เพิ่มทำให้เงินตองแข็งค่าและหักล้างผลทั้งหมด การส่งออกจึงเท่าเดิมไม่ว่าภาษีที่ยกเว้นจะมากเพียงใดก็ตาม","ทำให้การส่งออกลดลง เพราะการยกเว้นภาษีทำให้เงินตองอ่อนค่า สินค้าส่งออกจึงแพงขึ้นสำหรับต่างชาติและความต้องการสินค้าจากตองลดลงทั้งหมด"],"answer":0,"a":"โจทย์ข้อนี้ตรงกับแบบฝึกหัดของ ผศ. ดร. ธนารักษ์ ข้อ 2 ซึ่งให้ “วาดรูปพร้อมอธิบายกลไกการทำงานของอัตราแลกเปลี่ยน” ลำดับตรรกะ:\nขั้นที่ 1 ผลเบื้องต้น — ไม่ต้องเสียภาษีส่งออก ผู้ส่งออกกำไรมากขึ้นและตั้งราคาแข่งขันได้ การส่งออกเพิ่ม\nขั้นที่ 2 ผลต่อตลาดเงิน — ต่างชาติต้องซื้อเงินตองมากขึ้นเพื่อจ่ายค่าสินค้า อุปสงค์ต่อเงินตองเพิ่ม (D เลื่อนขวา) อัตราแลกเปลี่ยนสูงขึ้น เงินตองแข็งค่า\nขั้นที่ 3 ผลย้อนกลับ — เงินแข็งทำให้สินค้าตองแพงขึ้นสำหรับต่างชาติ ลดการส่งออกบางส่วน\nสรุป — การส่งออกเพิ่มจริงแต่น้อยกว่าที่คาดไว้ในตอนแรก\nข้อสังเกต — ผลย้อนกลับไม่ใหญ่พอจะลบผลเบื้องต้นทั้งหมด จึงตอบว่า “ไม่ช่วยเลย” ไม่ได้","whys":["ถูกต้อง — ครบกลไกสองชั้น ส่งออกเพิ่มก่อน แล้วเงินแข็งค่าจากอุปสงค์ที่เพิ่ม ทำให้ผลสุทธิน้อยกว่าที่คาดแต่ยังเป็นบวก","ไม่ถูกต้อง — มองข้ามกลไกอัตราแลกเปลี่ยน ซึ่งเป็นโจทย์หลักของข้อนี้ การส่งออกที่เพิ่มต้องกระทบตลาดเงินตราและค่าเงินด้วยเสมอ","ไม่ถูกต้อง — ผลย้อนกลับจากค่าเงินแข็งช่วยหักล้างเพียงบางส่วน ไม่ใช่ทั้งหมด การสรุปว่าไม่ได้ผลเลยจึงเกินจริง","ไม่ถูกต้อง — ทิศของค่าเงินกลับด้าน การส่งออกที่เพิ่มทำให้อุปสงค์ต่อเงินตองเพิ่ม เงินจึงแข็งค่า ไม่ใช่อ่อนค่า"],"tip":"นโยบายเพิ่มส่งออก → ความต้องการเงินในประเทศเพิ่ม → ค่าเงินแข็ง → หักล้างผลบางส่วน (ไม่ใช่ทั้งหมด)"},{"id":"C11","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"สหรัฐฯ ขึ้นภาษีนำเข้า (ข้อ 3 ในแบบฝึกหัด)","q":"สหรัฐฯ ขึ้นอัตราภาษีสินค้านำเข้า ทำให้สินค้าไทยที่ส่งไปสหรัฐฯ มีราคาสูงขึ้นสำหรับผู้บริโภคอเมริกัน กราฟแสดงตลาดเงินบาท ข้อใดอธิบายการเปลี่ยนแปลงของเส้นและผลต่ออัตราแลกเปลี่ยนได้ถูกต้อง","choices":["ชาวอเมริกันซื้อสินค้าไทยน้อยลง จึงต้องการบาทน้อยลง อุปสงค์ต่อเงินบาทเลื่อนซ้าย อัตราแลกเปลี่ยน (ดอลลาร์ต่อบาท) ลดลง เงินบาทอ่อนค่า","ชาวอเมริกันซื้อสินค้าไทยน้อยลง จึงเสนอขายบาทเพิ่มขึ้น อุปทานเงินบาทเลื่อนขวา อัตราแลกเปลี่ยน (ดอลลาร์ต่อบาท) ลดลง เงินบาทอ่อนค่าลงมาก","สินค้าไทยแพงขึ้นในสหรัฐฯ จึงมีคนต้องการบาทมากขึ้นเพื่อชำระภาษีนำเข้า อุปสงค์ต่อเงินบาทเลื่อนขวา อัตราแลกเปลี่ยนสูงขึ้น เงินบาทแข็งค่า","ภาษีนำเข้าของสหรัฐฯ เป็นเรื่องภายในสหรัฐฯ ไม่กระทบตลาดเงินบาท เส้นอุปสงค์และอุปทานบาทคงเดิม อัตราแลกเปลี่ยนจึงไม่เปลี่ยนแปลงแต่อย่างใด"],"answer":0,"a":"โจทย์ข้อนี้ตรงกับแบบฝึกหัดของ ผศ. ดร. ธนารักษ์ ข้อ 3\nขั้นที่ 1 — ภาษีนำเข้าของสหรัฐฯ ทำให้สินค้าไทยแพงขึ้นในสหรัฐฯ ปริมาณสินค้าไทยที่อเมริกันซื้อลดลง\nขั้นที่ 2 — อเมริกันต้องใช้บาทจ่ายค่าสินค้าไทยน้อยลง = อุปสงค์ต่อบาทลดลง (D เลื่อนซ้าย) ซึ่งตรงกับแถว “World demand for domestic goods” ในตารางสรุปปัจจัยกำหนดอัตราแลกเปลี่ยน (ลดลง → อัตราลดลง)\nขั้นที่ 3 — อัตราแลกเปลี่ยนลดลง เงินบาทอ่อนค่า\nข้อสังเกต — ตัวเลือกที่ว่าอุปทานบาทเลื่อนขวาไม่เหมาะ เพราะเหตุการณ์นี้กระทบฝั่งอุปสงค์ ไม่ได้เพิ่มความต้องการซื้อสินค้าต่างประเทศของคนไทยโดยตรง","whys":["ถูกต้อง — ความต้องการสินค้าไทยลดลง จึงอุปสงค์ต่อบาทลดลง เส้นเลื่อนซ้าย อัตราแลกเปลี่ยนลดลงและเงินบาทอ่อนค่าตามกราฟ","ไม่ถูกต้อง — ผลของภาษีนำเข้าเกิดที่ฝั่งอุปสงค์ต่อบาทตามที่กราฟแสดง ไม่ได้ทำให้คนไทยต้องเสนอขายบาทเพิ่มขึ้น","ไม่ถูกต้อง — ภาษีนำเข้าจ่ายเป็นดอลลาร์ให้รัฐบาลสหรัฐฯ ไม่ได้ต้องใช้บาท และสินค้าที่แพงขึ้นทำให้ซื้อน้อยลงไม่ใช่มากขึ้น","ไม่ถูกต้อง — แม้ภาษีเป็นนโยบายของสหรัฐฯ แต่ลดความต้องการสินค้าไทยจึงกระทบอุปสงค์ต่อบาทโดยตรง ตลาดเงินจึงเปลี่ยน"],"fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n    <defs><clipPath id=\"clipFX\"><rect x=\"76\" y=\"34\" width=\"422\" height=\"296\"/></clipPath></defs>\n    <line x1=\"76\" y1=\"26\" x2=\"76\" y2=\"330\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n    <line x1=\"76\" y1=\"330\" x2=\"512\" y2=\"330\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n    <text x=\"70\" y=\"20\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"middle\">e (อัตราแลกเปลี่ยน)</text>\n    <text x=\"516\" y=\"336\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"end\" transform=\"translate(0,22)\">ปริมาณเงินบาทในตลาดเงินตราต่างประเทศ</text>\n    <g clip-path=\"url(#clipFX)\"><line x1=\"97.1\" y1=\"69.51999999999998\" x2=\"476.9\" y2=\"306.32\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\" stroke-dasharray=\"7 5\"/><line x1=\"21.14\" y1=\"69.51999999999998\" x2=\"400.94\" y2=\"306.32\" stroke=\"var(--curve-ad)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><line x1=\"97.1\" y1=\"306.32\" x2=\"476.9\" y2=\"69.51999999999998\" stroke=\"var(--curve-as)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><circle cx=\"287\" cy=\"187.92000000000002\" r=\"4.5\" fill=\"var(--surface)\" stroke=\"var(--muted)\" stroke-width=\"2\"/><line x1=\"287\" y1=\"187.92000000000002\" x2=\"76\" y2=\"187.92000000000002\" stroke=\"var(--line-2)\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/><circle cx=\"249.01999999999998\" cy=\"211.6\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><line x1=\"249.01999999999998\" y1=\"211.6\" x2=\"76\" y2=\"211.6\" stroke=\"var(--line-2)\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/></g><text x=\"320.32000000000005\" y=\"255.06666666666666\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--curve-ad)\">D&#8322; (อุปสงค์)</text><text x=\"404.72\" y=\"123.51111111111109\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--curve-as)\">S (อุปทาน)</text><text x=\"67\" y=\"192.92000000000002\" font-size=\"13\" fill=\"var(--muted)\" text-anchor=\"end\">e<tspan dy=\"3\" font-size=\"10\">1</tspan></text><text x=\"67\" y=\"216.6\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"end\">e<tspan dy=\"3\" font-size=\"10\">2</tspan></text>\n  </svg><div class=\"figcap\">ตลาดเงินบาท · เส้นอุปสงค์ต่อเงินบาทเลื่อนซ้าย · เส้นประคือตำแหน่งเดิม</div></div>"},{"id":"C12","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"ผลของค่าเงินอ่อนต่อการส่งออกไทยหลังสหรัฐฯ ขึ้นภาษี","q":"หลังสหรัฐฯ ขึ้นภาษีนำเข้า ทำให้เงินบาทอ่อนค่าลงตามกลไกตลาดเงินตรา ข้อใดอธิบายผลของการอ่อนค่านี้ต่อการส่งออกของไทยเมื่อเทียบกับตอนที่ภาษีสูงขึ้นแล้วเงินบาทยังไม่ปรับตัวได้ถูกต้อง","choices":["ค่าเงินบาทที่อ่อนลงทำให้สินค้าไทยถูกลงสำหรับต่างชาติ ช่วยชดเชยการส่งออกที่ลดลงจากภาษีได้บางส่วน แต่ไม่ถึงกับทำให้การส่งออกกลับมาเท่าเดิมทั้งหมด","ค่าเงินบาทที่อ่อนลงทำให้สินค้าไทยถูกลงสำหรับต่างชาติ จึงชดเชยการส่งออกที่ลดลงจากภาษีได้ครบทุกบาท การส่งออกจึงกลับมาเท่าเดิมโดยอัตโนมัติ","ค่าเงินบาทที่อ่อนลงทำให้สินค้าไทยแพงขึ้นสำหรับต่างชาติ จึงซ้ำเติมการส่งออกที่ลดลงจากภาษีและทำให้การส่งออกลดลงมากกว่าตอนแรก","ค่าเงินบาทที่อ่อนลงไม่มีผลต่อการส่งออก เพราะการส่งออกขึ้นกับภาษีของประเทศผู้นำเข้าเท่านั้น ราคาที่คิดเป็นเงินตราต่างประเทศไม่มีบทบาทต่อการตัดสินใจ"],"answer":0,"a":"ข้อ 3 ในแบบฝึกหัดถามทั้ง “อัตราแลกเปลี่ยน” และ “การส่งออก” คำตอบที่สมบูรณ์จึงต้องเล่าสองช่วง\nช่วงที่ 1 (แรงกระแทก) — ภาษีทำให้สินค้าไทยแพงขึ้นในสหรัฐฯ ส่งออกลดลง\nช่วงที่ 2 (ตลาดเงินปรับตัว) — อุปสงค์ต่อบาทลด เงินบาทอ่อนค่า สินค้าไทยถูกลงเมื่อคิดเป็นดอลลาร์ นี่คือแรงชดเชย\nผลสุทธิ — ค่าเงินอ่อนบรรเทาผลกระทบบางส่วน แต่ภาษีที่เพิ่มขึ้นยังคงทำให้การส่งออกต่ำกว่าเดิม\nข้อสังเกต — กลไกนี้คือ “ตัวดูดซับแรงกระแทก” ของระบบลอยตัว ซึ่งต่างจากระบบคงที่ที่ไม่มีการปรับตัวอัตโนมัติ","whys":["ถูกต้อง — ค่าเงินที่อ่อนลงชดเชยผลของภาษีได้บางส่วน แต่ไม่ถึงกับทำให้การส่งออกกลับสู่ระดับเดิมทั้งหมด","ไม่ถูกต้อง — การชดเชยครบทุกบาทเป็นข้ออ้างที่เกินจริง ค่าเงินอ่อนลงเพียงบางส่วนของราคาที่สูงขึ้นจากภาษี การส่งออกจึงยังต่ำกว่าเดิม","ไม่ถูกต้อง — เงินบาทอ่อนค่าทำให้สินค้าไทยถูกลงสำหรับต่างชาติ ไม่ใช่แพงขึ้น จึงบรรเทาไม่ใช่ซ้ำเติมการส่งออก","ไม่ถูกต้อง — ราคาสินค้าที่คิดเป็นสกุลเงินของผู้ซื้อมีบทบาทสำคัญต่อการตัดสินใจซื้อ ค่าเงินจึงมีผลต่อการส่งออกเสมอ"]},{"id":"C13","type":"mcq","lvl":3,"topic":"อัตราแลกเปลี่ยน","ref":"ดอกเบี้ยที่แท้จริงในประเทศสูงขึ้น","q":"ดอกเบี้ยที่แท้จริงภายในประเทศไทย (r) สูงขึ้น โดยดอกเบี้ยที่แท้จริงต่างประเทศคงเดิม ผู้ลงทุนต่างชาติสนใจซื้อสินทรัพย์ไทย (สมมติ P คงที่) กราฟแสดงผลต่อตลาดเงินบาท ข้อใดสรุปผลต่ออัตราแลกเปลี่ยนและการส่งออกสุทธิได้ถูกต้อง","choices":["ต่างชาติซื้อบาทเพื่อซื้อสินทรัพย์ไทยมากขึ้น และคนไทยขายบาทออกไปซื้อสินทรัพย์ต่างประเทศน้อยลง อัตราแลกเปลี่ยนสูงขึ้น เงินบาทแข็งค่า การส่งออกสุทธิลดลง","ต่างชาติขายบาทเพื่อนำเงินกลับประเทศมากขึ้น และคนไทยซื้อสินทรัพย์ต่างประเทศมากขึ้น อัตราแลกเปลี่ยนลดลง เงินบาทอ่อนค่า การส่งออกสุทธิเพิ่มขึ้น","ต่างชาติซื้อบาทเพื่อซื้อสินทรัพย์ไทยมากขึ้น และคนไทยขายบาทออกไปซื้อสินทรัพย์ต่างประเทศน้อยลง อัตราแลกเปลี่ยนสูงขึ้น เงินบาทแข็งค่า การส่งออกสุทธิเพิ่มขึ้น","ดอกเบี้ยที่สูงขึ้นทำให้ต้นทุนผู้ผลิตไทยสูงขึ้น ผู้ส่งออกจึงขายบาทมากขึ้นเพื่อลดความเสี่ยง อัตราแลกเปลี่ยนลดลง เงินบาทอ่อนค่า การส่งออกสุทธิเพิ่มขึ้น"],"answer":0,"a":"จากตารางสรุป “Determinants of the Exchange Rate”: ดอกเบี้ยที่แท้จริงภายในประเทศ (r) สูงขึ้น → อัตราแลกเปลี่ยนสูงขึ้น เพราะสินทรัพย์ในประเทศน่าสนใจมากขึ้น อุปสงค์ต่อเงินในประเทศเพิ่ม และอุปทานลดลง\nขั้นที่ 1 — D เลื่อนขวา · S เลื่อนซ้าย (ตามกราฟ)\nขั้นที่ 2 — เงินบาทแข็งค่า สินค้าไทยแพงขึ้นเมื่อเทียบกับสินค้าต่างประเทศ (อัตราแลกเปลี่ยนที่แท้จริงสูงขึ้น)\nขั้นที่ 3 — ตามตาราง “Determinants of Net Exports”: r สูงขึ้น → การส่งออกสุทธิลดลง\nข้อสังเกต — ผลต่ออัตราแลกเปลี่ยนกับผลต่อการส่งออกสุทธิตรงข้ามกัน เพราะเงินแข็งทำให้ส่งออกยากขึ้น","whys":["ถูกต้อง — ตรงกับตารางสรุป ดอกเบี้ยจริงในประเทศสูงขึ้นทำให้เงินแข็งค่าและการส่งออกสุทธิลดลง","ไม่ถูกต้อง — ทิศกลับด้านทั้งหมด ดอกเบี้ยที่สูงขึ้นดึงดูดเงินทุนไหลเข้า ไม่ใช่ทำให้ต่างชาติขายบาท","ไม่ถูกต้อง — ผลต่ออัตราแลกเปลี่ยนถูกต้อง แต่การส่งออกสุทธิกลับทิศ เงินที่แข็งค่าทำให้สินค้าไทยแพงขึ้น ส่งออกสุทธิจึงลดไม่ใช่เพิ่ม","ไม่ถูกต้อง — กลไกนี้ผ่านการเคลื่อนย้ายสินทรัพย์การเงินเป็นหลัก ไม่ใช่ต้นทุนผู้ผลิต และทิศของอัตราแลกเปลี่ยนก็ผิดด้วย"],"fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n    <defs><clipPath id=\"clipFX\"><rect x=\"76\" y=\"34\" width=\"422\" height=\"296\"/></clipPath></defs>\n    <line x1=\"76\" y1=\"26\" x2=\"76\" y2=\"330\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n    <line x1=\"76\" y1=\"330\" x2=\"512\" y2=\"330\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n    <text x=\"70\" y=\"20\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"middle\">e (อัตราแลกเปลี่ยน)</text>\n    <text x=\"516\" y=\"336\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"end\" transform=\"translate(0,22)\">ปริมาณเงินบาทในตลาดเงินตราต่างประเทศ</text>\n    <g clip-path=\"url(#clipFX)\"><line x1=\"97.1\" y1=\"69.51999999999998\" x2=\"476.9\" y2=\"306.32\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\" stroke-dasharray=\"7 5\"/><line x1=\"97.1\" y1=\"306.32\" x2=\"476.9\" y2=\"69.51999999999998\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\" stroke-dasharray=\"7 5\"/><line x1=\"147.74\" y1=\"69.51999999999998\" x2=\"527.54\" y2=\"306.32\" stroke=\"var(--curve-ad)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><line x1=\"46.459999999999994\" y1=\"306.32\" x2=\"426.26\" y2=\"69.51999999999998\" stroke=\"var(--curve-as)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><circle cx=\"287\" cy=\"187.92000000000002\" r=\"4.5\" fill=\"var(--surface)\" stroke=\"var(--muted)\" stroke-width=\"2\"/><line x1=\"287\" y1=\"187.92000000000002\" x2=\"76\" y2=\"187.92000000000002\" stroke=\"var(--line-2)\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/><circle cx=\"287\" cy=\"156.34666666666666\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><line x1=\"287\" y1=\"156.34666666666666\" x2=\"76\" y2=\"156.34666666666666\" stroke=\"var(--line-2)\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/></g><text x=\"404.72\" y=\"228.75555555555553\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--curve-ad)\">D&#8322; (อุปสงค์)</text><text x=\"354.08\" y=\"123.51111111111109\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--curve-as)\">S&#8322; (อุปทาน)</text><text x=\"67\" y=\"192.92000000000002\" font-size=\"13\" fill=\"var(--muted)\" text-anchor=\"end\">e<tspan dy=\"3\" font-size=\"10\">1</tspan></text><text x=\"67\" y=\"161.34666666666666\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"end\">e<tspan dy=\"3\" font-size=\"10\">2</tspan></text>\n  </svg><div class=\"figcap\">ตลาดเงินบาท · อุปสงค์เลื่อนขวาและอุปทานเลื่อนซ้าย · เส้นประคือตำแหน่งเดิม</div></div>"},{"id":"C14","type":"mcq","lvl":3,"topic":"อัตราแลกเปลี่ยน","ref":"รายได้ในประเทศเพิ่มขึ้น","q":"เศรษฐกิจไทยขยายตัว ผลผลิตและรายได้ภายในประเทศ (Y) เพิ่มขึ้น โดยปัจจัยอื่นคงเดิม ข้อใดอธิบายผลต่ออัตราแลกเปลี่ยนตามกลไกของตลาดเงินตราได้ถูกต้อง","choices":["รายได้ที่เพิ่มทำให้ชาวไทยซื้อสินค้านำเข้ามากขึ้น ต้องขายบาทเพื่อซื้อเงินต่างประเทศ อุปทานเงินบาทเพิ่ม อัตราแลกเปลี่ยนลดลง เงินบาทอ่อนค่า การส่งออกสุทธิลดลง","รายได้ที่เพิ่มทำให้ชาวไทยซื้อสินค้านำเข้ามากขึ้น ต้องขายบาทเพื่อซื้อเงินต่างประเทศ อุปทานเงินบาทเพิ่ม อัตราแลกเปลี่ยนลดลง เงินบาทอ่อนค่า การส่งออกสุทธิเพิ่มขึ้น","รายได้ที่เพิ่มทำให้ชาวไทยออมมากขึ้นและนำเงินกลับเข้าประเทศ อุปสงค์ต่อบาทเพิ่ม อัตราแลกเปลี่ยนสูงขึ้น เงินบาทแข็งค่า การส่งออกสุทธิเพิ่มขึ้นตามไปด้วย","รายได้ที่เพิ่มทำให้ชาวต่างชาติซื้อสินค้าไทยมากขึ้น อุปสงค์ต่อบาทเพิ่ม อัตราแลกเปลี่ยนสูงขึ้น เงินบาทแข็งค่า การส่งออกสุทธิเพิ่มขึ้นเพราะส่งออกมากขึ้น"],"answer":0,"a":"จากสไลด์ “Effects of changes in output (income)”\nขั้นที่ 1 — Y ในประเทศเพิ่ม → อุปสงค์ต่อสินค้าทุกชนิดรวมสินค้านำเข้าเพิ่ม\nขั้นที่ 2 — จะซื้อสินค้านำเข้าต้องขายบาทเพื่อซื้อเงินต่างประเทศ = อุปทานเงินบาทเพิ่ม อัตราแลกเปลี่ยนลดลง เงินบาทอ่อนค่า\nขั้นที่ 3 — การนำเข้าเพิ่ม การส่งออกสุทธิลดลง ตามตาราง “Determinants of Net Exports”\nข้อสังเกต — ผลต่ออัตราแลกเปลี่ยน (ลดลง) และต่อการส่งออกสุทธิ (ลดลง) ไปทางเดียวกันในกรณี Y ในประเทศ ซึ่งต่างจากกรณีดอกเบี้ยที่ผลสวนทางกัน","whys":["ถูกต้อง — ตรงกับสไลด์ รายได้ในประเทศเพิ่มทำให้นำเข้ามากขึ้น อุปทานเงินบาทเพิ่ม เงินอ่อนค่า และการส่งออกสุทธิลดลง","ไม่ถูกต้อง — ผลต่ออัตราแลกเปลี่ยนถูกต้อง แต่การส่งออกสุทธิกลับทิศ เมื่อการนำเข้าเพิ่มขึ้น การส่งออกสุทธิต้องลดลง ไม่ใช่เพิ่มขึ้น","ไม่ถูกต้อง — รายได้ที่สูงขึ้นไม่ได้ทำให้เงินไหลกลับประเทศ แต่ทำให้ความต้องการสินค้านำเข้าเพิ่ม ซึ่งเพิ่มอุปทานบาท","ไม่ถูกต้อง — ข้อนี้ใช้กับกรณีที่ผลผลิตหรือรายได้ของต่างประเทศเพิ่มขึ้น ไม่ใช่รายได้ในประเทศไทยตามโจทย์"]},{"id":"C15","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"ดอกเบี้ยที่แท้จริงต่างประเทศสูงขึ้น","q":"ธนาคารกลางสหรัฐฯ ขึ้นอัตราดอกเบี้ย ทำให้ดอกเบี้ยที่แท้จริงของสหรัฐฯ สูงขึ้นขณะที่ดอกเบี้ยที่แท้จริงของไทยคงเดิม ข้อใดวิเคราะห์ผลต่อเงินบาทและการส่งออกสุทธิของไทยได้ถูกต้อง","choices":["สินทรัพย์สหรัฐฯ น่าสนใจขึ้น คนไทยและต่างชาติขายบาทเพื่อซื้อดอลลาร์ไปลงทุน อุปทานบาทเพิ่มและอุปสงค์ลด เงินบาทอ่อนค่า สินค้าไทยถูกลง การส่งออกสุทธิเพิ่ม","สินทรัพย์สหรัฐฯ น่าสนใจขึ้น คนไทยและต่างชาติขายบาทเพื่อซื้อดอลลาร์ไปลงทุน อุปทานบาทเพิ่มและอุปสงค์ลด เงินบาทอ่อนค่า สินค้าไทยแพงขึ้น การส่งออกสุทธิลดลง","สินทรัพย์ไทยน่าสนใจขึ้นเมื่อเทียบกัน ต่างชาติซื้อบาทเพื่อลงทุนในไทยมากขึ้น อุปสงค์บาทเพิ่ม เงินบาทแข็งค่า สินค้าไทยแพงขึ้น การส่งออกสุทธิลดลง","ดอกเบี้ยต่างประเทศที่สูงขึ้นไม่มีผลต่ออัตราแลกเปลี่ยนของบาท เพราะการลงทุนข้ามประเทศขึ้นกับดอกเบี้ยในประเทศเท่านั้น การส่งออกสุทธิจึงคงเดิม"],"answer":0,"a":"จากตารางสรุป: ดอกเบี้ยที่แท้จริงต่างประเทศ (r_For) สูงขึ้น → อัตราแลกเปลี่ยนลดลง เพราะสินทรัพย์ต่างประเทศน่าสนใจขึ้น อุปทานของเงินในประเทศเพิ่มและอุปสงค์ลด\nขั้นที่ 1 — ขายบาทเพื่อซื้อดอลลาร์ → อุปทานบาทเพิ่ม (S ขวา) และอุปสงค์บาทลด (D ซ้าย)\nขั้นที่ 2 — เงินบาทอ่อนค่า = อัตราแลกเปลี่ยนที่แท้จริงลดลง สินค้าไทยถูกลงเมื่อเทียบกับสินค้าต่างประเทศ\nขั้นที่ 3 — ตาราง Determinants of Net Exports: r_For สูงขึ้น → การส่งออกสุทธิเพิ่มขึ้น\nตรวจ — ตัวเลือกที่สองถูกครึ่งแรก แต่การส่งออกสุทธิกลับทิศ เงินที่อ่อนต้องทำให้สินค้าถูกลง","whys":["ถูกต้อง — r ต่างประเทศสูงขึ้นทำให้เงินบาทอ่อนค่า สินค้าไทยถูกลงเมื่อเทียบกับต่างประเทศ จึงการส่งออกสุทธิเพิ่ม","ไม่ถูกต้อง — ครึ่งแรกถูกแต่สรุปการส่งออกสุทธิกลับทิศ เงินบาทที่อ่อนค่าทำให้สินค้าไทยถูกลง ไม่ใช่แพงขึ้น","ไม่ถูกต้อง — ทิศกลับด้าน เมื่อดอกเบี้ยต่างประเทศสูงขึ้น สินทรัพย์ไทยน่าสนใจน้อยลงเมื่อเทียบกัน ไม่ใช่มากขึ้น","ไม่ถูกต้อง — ตารางสรุปบอกชัดว่าดอกเบี้ยต่างประเทศเป็นหนึ่งในปัจจัยกำหนดอัตราแลกเปลี่ยน การลงทุนข้ามประเทศเทียบผลตอบแทนทั้งสองประเทศ"]},{"id":"C16","type":"mcq","lvl":2,"topic":"อัตราแลกเปลี่ยน","ref":"อัตราแลกเปลี่ยนตามชื่อ vs ที่แท้จริง (ข้อ 4 ในแบบฝึกหัด)","q":"อัตราแลกเปลี่ยนตามชื่อ (nominal exchange rate) และอัตราแลกเปลี่ยนที่แท้จริง (real exchange rate) เหมือนหรือต่างกันอย่างไร ข้อใดอธิบายพร้อมยกตัวอย่างได้ถูกต้อง","choices":["ต่างกัน อัตราตามชื่อบอกว่าเงิน 1 หน่วยแลกเงินต่างประเทศได้กี่หน่วย ส่วนอัตราที่แท้จริงบอกว่าสินค้าในประเทศ 1 หน่วยแลกสินค้าต่างประเทศได้กี่หน่วย เช่น เบอร์เกอร์สหรัฐฯ 1 ชิ้นแลกเบอร์เกอร์ญี่ปุ่นได้ 0.2 ชิ้น","เหมือนกัน เพราะทั้งสองค่าบอกว่าเงินสกุลหนึ่งแลกอีกสกุลได้เท่าใด อัตราที่แท้จริงเป็นเพียงชื่อเรียกอีกแบบของอัตราตามชื่อและมีค่าเท่ากันทุกกรณี เช่น 110 เยนต่อ 1 ดอลลาร์","ต่างกัน อัตราตามชื่อคำนวณจากราคาสินค้า ส่วนอัตราที่แท้จริงคำนวณจากอัตราแลกเปลี่ยนตลาดเท่านั้น เช่น เบอร์เกอร์สหรัฐฯ ราคา 2 ดอลลาร์ ต้องนำมาหารด้วย 110 เยน","ต่างกัน อัตราตามชื่อเปลี่ยนแปลงได้ทุกวันแต่อัตราที่แท้จริงเป็นค่าคงที่ตายตัวไม่มีวันเปลี่ยน เพราะระดับราคาสินค้าของแต่ละประเทศคงที่ตลอดเวลาตามกฎของตลาด"],"answer":0,"a":"โจทย์ข้อนี้ตรงกับแบบฝึกหัดของ ผศ. ดร. ธนารักษ์ ข้อ 4 โครงสร้างคำตอบที่ดีมีสามส่วน คือ นิยาม · ความต่าง · ตัวอย่าง\nนิยามอัตราตามชื่อ — จำนวนหน่วยเงินต่างประเทศต่อเงินในประเทศ 1 หน่วย (e_nom) เช่น 110 เยนต่อดอลลาร์\nนิยามอัตราที่แท้จริง — ราคาสินค้าในประเทศเทียบกับสินค้าต่างประเทศ e = e_nom × P ÷ P_For บอกว่าสินค้าในประเทศ 1 หน่วยแลกสินค้าต่างประเทศได้กี่หน่วย\nตัวอย่างในสไลด์ — e_nom = 110 เยนต่อดอลลาร์ เบอร์เกอร์โตเกียว ¥1,100 เบอร์เกอร์นิวยอร์ก $2 → e = 110 × 2 ÷ 1,100 = 0.2 คือเบอร์เกอร์สหรัฐฯ 1 ชิ้นแลกเบอร์เกอร์ญี่ปุ่นได้ 0.2 ชิ้น\nความต่างหลัก — อัตราที่แท้จริงรวมเรื่องระดับราคาไว้ด้วย อัตราตามชื่อไม่รวม","whys":["ถูกต้อง — แยกนิยามได้ถูกต้อง อัตราตามชื่อเป็นเรื่องเงินต่อเงิน อัตราที่แท้จริงเป็นเรื่องสินค้าต่อสินค้า และตัวอย่าง 0.2 ตรงกับสไลด์","ไม่ถูกต้อง — สองค่านี้ไม่เหมือนกัน อัตราที่แท้จริงต้องนำระดับราคาของทั้งสองประเทศเข้ามาคำนวณ จึงมีค่าและความหมายต่างจากอัตราตามชื่อ","ไม่ถูกต้อง — สลับนิยามของสองค่า อัตราตามชื่อไม่ได้คำนวณจากราคาสินค้า แต่อัตราที่แท้จริงต่างหากที่ใช้ราคาสินค้าร่วมคำนวณ","ไม่ถูกต้อง — อัตราที่แท้จริงเปลี่ยนได้เมื่ออัตราตามชื่อหรือระดับราคาเปลี่ยน ระดับราคาสินค้าไม่ได้คงที่ตลอดเวลา"]},{"id":"C17","type":"mcq","lvl":3,"topic":"อัตราแลกเปลี่ยน","ref":"ตัวอย่างเบอร์เกอร์ในสไลด์","q":"อัตราแลกเปลี่ยนคือ 110 เยนต่อ 1 ดอลลาร์ เบอร์เกอร์ในโตเกียวราคา 1,100 เยน ขณะที่เบอร์เกอร์ในนิวยอร์กราคา 2 ดอลลาร์ อัตราแลกเปลี่ยนที่แท้จริงในมุมของสหรัฐฯ (จำนวนเบอร์เกอร์ญี่ปุ่นที่แลกได้ต่อเบอร์เกอร์สหรัฐฯ 1 ชิ้น) เท่ากับเท่าใด","choices":["0.2","5","55","2.2"],"answer":0,"a":"สูตร — e = e_nom × P ÷ P_For โดย สหรัฐฯ เป็น “ประเทศในประเทศ”\nแทนค่า — e_nom = 110 · P = 2 (ดอลลาร์) · P_For = 1,100 (เยน)\nคำนวณ — e = 110 × 2 ÷ 1,100 = 220 ÷ 1,100 = 0.2\nความหมาย — เบอร์เกอร์สหรัฐฯ 1 ชิ้นแลกเบอร์เกอร์ญี่ปุ่นได้เพียง 0.2 ชิ้น เพราะเบอร์เกอร์สหรัฐฯ ราคา ¥220 เท่านั้น ขณะที่ของญี่ปุ่นราคา ¥1,100 หรือเบอร์เกอร์สหรัฐฯ ถูกกว่าญี่ปุ่นถึง 5 เท่า\nข้อควรระวัง — ค่า 5 คืออัตราแลกเปลี่ยนที่แท้จริงในมุมของญี่ปุ่น (กลับด้าน)","whys":["ถูกต้อง — แทนค่าได้ 110 × 2 ÷ 1,100 = 0.2 ตรงกับตัวอย่างในสไลด์ที่เบอร์เกอร์สหรัฐฯ 1 ชิ้นแลกเบอร์เกอร์ญี่ปุ่นได้ 0.2 ชิ้น","ไม่ถูกต้อง — ค่า 5 เป็นอัตราแลกเปลี่ยนที่แท้จริงในมุมของญี่ปุ่น ซึ่งเป็นส่วนกลับของค่าที่ถูกถาม ตัวหารตัวตั้งจึงสลับกัน","ไม่ถูกต้อง — ค่า 55 เกิดจากการหาร 110 ด้วย 2 ซึ่งแปลงราคาแต่ยังไม่ได้เทียบกับราคาเบอร์เกอร์ญี่ปุ่น 1,100 เยน","ไม่ถูกต้อง — ค่า 2.2 เกิดจากการคูณ 2 ด้วย 1,100 แล้วหารด้วย 1,000 ซึ่งไม่มีที่มาจากสูตรอัตราแลกเปลี่ยนที่แท้จริง"]},{"id":"C18","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"ข้าวไทยและข้าวเวียดนาม (ข้อ 5 ในแบบฝึกหัด)","q":"ข้าวไทย 1 ถังราคา 1,000 บาท ข้าวเวียดนาม 1 ถังราคา 160,000 ดอง อัตราแลกเปลี่ยนคือ 800 ดอง = 1 บาท อัตราแลกเปลี่ยนที่แท้จริงของไทย (ข้าวเวียดนามกี่ถังต่อข้าวไทย 1 ถัง) เท่ากับเท่าใด","choices":["5","0.2","200","1.25"],"answer":0,"a":"โจทย์ข้อนี้ตรงกับแบบฝึกหัดของ ผศ. ดร. ธนารักษ์ ข้อ 5 ให้ “แสดงวิธีคำนวณ” จึงเขียนทีละบรรทัด\nขั้นที่ 1 ระบุตัวแปร — ไทยเป็นประเทศในประเทศ · e_nom = 800 ดองต่อบาท · P = 1,000 บาท · P_For = 160,000 ดอง\nขั้นที่ 2 แทนค่า — e = e_nom × P ÷ P_For = 800 × 1,000 ÷ 160,000\nขั้นที่ 3 คำนวณ — 800,000 ÷ 160,000 = 5\nตรวจด้วยวิธีที่สอง — ข้าวไทย 1,000 บาท = 800,000 ดอง ขณะที่ข้าวเวียดนามราคา 160,000 ดอง ข้าวไทย 1 ถังแลกข้าวเวียดนามได้ 800,000 ÷ 160,000 = 5 ถัง ✓\nคำตอบ — อัตราแลกเปลี่ยนที่แท้จริงของไทย = 5","whys":["ถูกต้อง — แทนค่า 800 × 1,000 ÷ 160,000 = 5 และตรวจด้วยวิธีที่สองได้ตรงกัน ข้าวไทย 1 ถังแลกข้าวเวียดนามได้ 5 ถัง","ไม่ถูกต้อง — ค่า 0.2 เป็นส่วนกลับ คืออัตราแลกเปลี่ยนที่แท้จริงในมุมของเวียดนาม ไม่ใช่ของไทยตามที่โจทย์ถาม","ไม่ถูกต้อง — ค่า 200 คือราคาข้าวเวียดนามเมื่อแปลงเป็นบาท (160,000 ÷ 800) ซึ่งยังไม่ได้เทียบกับราคาข้าวไทย","ไม่ถูกต้อง — ค่า 1.25 เกิดจากการหาร 1,000 ด้วย 800 ซึ่งไม่ได้นำราคาข้าวเวียดนามเข้ามาเปรียบเทียบเลย"],"tip":"ตรวจ e ด้วยวิธีที่สอง: แปลงราคาสินค้าของประเทศหนึ่งเป็นเงินอีกประเทศ แล้วหารด้วยราคาสินค้าของอีกประเทศ"},{"id":"C19","type":"mcq","lvl":3,"topic":"อัตราแลกเปลี่ยน","ref":"ตีความอัตราแลกเปลี่ยนที่แท้จริงเท่ากับ 5","q":"จากผลคำนวณว่าอัตราแลกเปลี่ยนที่แท้จริง % ซึ่งเท่ากับการแข็งค่าของบาท (1.50 → 1.80) เพราะระดับราคาคงที่ การเปลี่ยนของอัตราตามชื่อจึงส่งผ่านเป็นอัตราที่แท้จริงเต็มจำนวน\nผล — สินค้าไทยแพงขึ้นเมื่อเทียบกับสินค้าจีน การส่งออกสุทธิไปจีนลดลง\nเชื่อมสไลด์ — “Holding prices fixed means that changes in the real exchange rate are matched by changes in the nominal exchange rate”","whys":["ถูกต้อง — e เพิ่มจาก ≈ 0.83 เป็น 1.00 สินค้าไทยแพงขึ้นเมื่อเทียบกับจีน การส่งออกสุทธิลดลง ตรงกับหลัก e สูงยิ่งส่งออกสุทธิต่ำ","ไม่ถูกต้อง — ทิศผิดทั้งหมด บาทแข็งค่าทำให้ e เพิ่มขึ้น (1.50 → 1.80 ในสูตร) ไม่ใช่ลดลง และสินค้าไทยแพงขึ้น","ไม่ถูกต้อง — ค่า e ถูกแต่ตีความผิด e ที่สูงขึ้นหมายถึงสินค้าไทยแพงขึ้นเมื่อเทียบกับสินค้าจีน ไม่ใช่ถูกลง","ไม่ถูกต้อง — แม้ระดับราคาไม่เปลี่ยน แต่อัตราตามชื่อเปลี่ยนจาก 1.50 เป็น 1.80 e ซึ่งมี e_nom เป็นตัวคูณจึงเปลี่ยนตามด้วย"]},{"id":"C24","type":"mcq","lvl":2,"topic":"อัตราแลกเปลี่ยน","ref":"สมมติราคาคงที่ อัตราที่แท้จริงเปลี่ยนตามอัตราตามชื่อ","q":"เมื่อวิเคราะห์การกำหนดอัตราแลกเปลี่ยนด้วยอุปสงค์–อุปทาน ในการวิเคราะห์นี้สมมติให้ระดับราคาคงที่ ข้อใดอธิบายเหตุผลและผลของสมมติฐานนี้ได้ถูกต้อง","choices":["เมื่อราคาคงที่ การเปลี่ยนของอัตราแลกเปลี่ยนที่แท้จริงจะตรงกับการเปลี่ยนของอัตราตามชื่อ เช่น อัตราตามชื่อสูงขึ้น 10% อัตราที่แท้จริงก็สูงขึ้น 10% ด้วย","เมื่อราคาคงที่ อัตราที่แท้จริงจะไม่เปลี่ยนแปลงเลยไม่ว่าอัตราตามชื่อจะเปลี่ยนไปเท่าใด จึงวิเคราะห์ได้ง่ายขึ้นเพราะตัดตัวแปรอัตราที่แท้จริงออกจากแบบจำลอง","เมื่อราคาคงที่ อัตราตามชื่อจะคงที่ตามไปด้วย จึงไม่ต้องใช้อุปสงค์–อุปทานในการวิเคราะห์ และอัตราที่แท้จริงจะถูกกำหนดโดยรัฐบาลแต่เพียงผู้เดียวในทุกกรณี","เมื่อราคาคงที่ อัตราที่แท้จริงจะเปลี่ยนมากกว่าอัตราตามชื่อเสมอ เพราะการคงราคาทำให้ผลของอัตราแลกเปลี่ยนต่อการค้าถูกขยายขึ้นหลายเท่าตัว"],"answer":0,"a":"จากสไลด์ “Holding prices fixed means that changes in the real exchange rate are matched by changes in the nominal exchange rate”\nเหตุผลทางสูตร — e = e_nom × (P ÷ P_For) ถ้า P และ P_For คงที่ ส่วน P ÷ P_For เป็นค่าคงที่ ดังนั้น e เปลี่ยนในสัดส่วนเดียวกับ e_nom\nตัวอย่าง — e_nom เพิ่ม 10% → e เพิ่ม 10%\nประโยชน์ — วิเคราะห์ตลาดเงินตราด้วยกราฟอุปสงค์–อุปทานของค่าเงินเพียงกราฟเดียว ไม่ต้องแยกผลของราคา\nข้อจำกัด — ในระยะยาวที่เงินเฟ้อต่างกัน สมมติฐานนี้ใช้ไม่ได้ (ดูข้อ 22)","whys":["ถูกต้อง — เมื่อราคาคงที่ ส่วน P ÷ P_For คงที่ อัตราที่แท้จริงจึงเปลี่ยนตามอัตราตามชื่อในสัดส่วนเดียวกัน","ไม่ถูกต้อง — ถ้าอัตราตามชื่อเปลี่ยนในขณะที่ราคาคงที่ อัตราที่แท้จริงต้องเปลี่ยนตามด้วย เพราะ e_nom เป็นตัวคูณในสูตร","ไม่ถูกต้อง — ราคาคงที่ไม่ได้ทำให้อัตราตามชื่อคงที่ ซึ่งยังถูกกำหนดโดยอุปสงค์–อุปทานในตลาดเงินตรา","ไม่ถูกต้อง — อัตราที่แท้จริงเปลี่ยนในสัดส่วนเดียวกับอัตราตามชื่อ ไม่ได้ขยายเป็นหลายเท่า เมื่อราคาคงที่"]},{"id":"C25","type":"mcq","lvl":2,"topic":"อัตราแลกเปลี่ยน","ref":"อัตราที่แท้จริงสูง → ส่งออกสุทธิต่ำ","q":"เหตุใดอัตราแลกเปลี่ยนที่แท้จริงของประเทศที่สูงขึ้นจึงทำให้การส่งออกสุทธิ (net exports) ของประเทศนั้นลดลง","choices":["สินค้าต่างประเทศถูกลงเมื่อเทียบกับสินค้าในประเทศ ความต้องการสินค้าต่างประเทศสูงขึ้นทั้งในและนอกประเทศ การนำเข้าเพิ่มขึ้นและการส่งออกลดลง การส่งออกสุทธิจึงลดลง","สินค้าในประเทศถูกลงเมื่อเทียบกับสินค้าต่างประเทศ ความต้องการสินค้าในประเทศสูงขึ้นทั้งในและนอกประเทศ การส่งออกเพิ่มขึ้นและการนำเข้าลดลง การส่งออกสุทธิจึงลดลง","สินค้าต่างประเทศแพงขึ้นเมื่อเทียบกับสินค้าในประเทศ ความต้องการสินค้าต่างประเทศลดลงทั้งในและนอกประเทศ การนำเข้าลดลงอย่างมาก การส่งออกสุทธิจึงลดลงตามไปด้วย","อัตราแลกเปลี่ยนที่แท้จริงเป็นเพียงตัวเลขเชิงบัญชี ไม่มีผลต่อการตัดสินใจซื้อสินค้าของผู้บริโภค การส่งออกสุทธิจึงไม่เปลี่ยนแปลงตามค่าดังกล่าวแต่อย่างใด"],"answer":0,"a":"จากสไลด์ “The real exchange rate and net exports”\nขั้นที่ 1 — e สูง = สินค้าของประเทศแพงเมื่อเทียบกับของต่างประเทศ = สินค้าต่างประเทศถูกเมื่อเทียบ\nขั้นที่ 2 — “there is a high demand for foreign goods (in both countries)” คนในประเทศนำเข้ามากขึ้น คนต่างประเทศซื้อสินค้าเราน้อยลง\nขั้นที่ 3 — นำเข้าเพิ่ม ส่งออกลด → การส่งออกสุทธิ = ส่งออก − นำเข้า ลดลง\nสรุปสไลด์ — “the higher the real exchange rate, the lower a country’s net exports”","whys":["ถูกต้อง — e สูงทำให้สินค้าต่างประเทศถูกกว่า นำเข้าเพิ่มและส่งออกลด การส่งออกสุทธิจึงลดลงตามสไลด์","ไม่ถูกต้อง — เหตุผลข้อนี้สอดคล้องกับ e ที่ต่ำลง ไม่ใช่สูงขึ้น และข้อสรุปว่าส่งออกสุทธิลดลงก็ขัดกับเหตุผลที่ให้มาเอง","ไม่ถูกต้อง — ถ้า e สูงขึ้น สินค้าต่างประเทศถูกลงเมื่อเทียบ ไม่ใช่แพงขึ้น ความต้องการสินค้าต่างประเทศจึงเพิ่มไม่ใช่ลด","ไม่ถูกต้อง — อัตราที่แท้จริงสะท้อนราคาสัมพัทธ์ของสินค้า ซึ่งกำหนดการตัดสินใจซื้อโดยตรง จึงมีผลต่อการส่งออกสุทธิอย่างชัดเจน"]},{"id":"C26","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"ดอลลาร์แข็ง 1980–1985 และความล่าช้า (beachhead effect)","q":"ระหว่างปี 1980–1985 ดอลลาร์สหรัฐฯ แข็งค่าและการส่งออกสุทธิของสหรัฐฯ ลดลงมาก ดอลลาร์เริ่มอ่อนค่าตั้งแต่ปี 1985 แต่การส่งออกสุทธิเพิ่งเริ่มเพิ่มขึ้นในปลายปี 1987 ข้อใดอธิบายความล่าช้านี้ได้ถูกต้อง","choices":["ดอลลาร์แข็งยาวนานทำให้ธุรกิจสหรัฐฯ สูญเสียลูกค้าต่างประเทศ และบริษัทต่างชาติเข้ามาสร้างฐานในตลาดสหรัฐฯ ซึ่งเรียกว่า beachhead effect จึงทำให้ฟื้นตัวช้ากว่าที่ค่าเงินปรับ","ดอลลาร์อ่อนค่าแล้วทำให้สินค้าสหรัฐฯ แพงขึ้นในช่วงแรก การส่งออกจึงลดลงก่อนแล้วจึงฟื้นตัว ซึ่งเรียกว่า beachhead effect และเกิดทุกครั้งที่ค่าเงินอ่อน","ธนาคารกลางสหรัฐฯ ห้ามไม่ให้ผู้ส่งออกใช้ประโยชน์จากค่าเงินที่อ่อนในช่วงสองปีแรก จึงทำให้การส่งออกสุทธิเพิ่มขึ้นช้ากว่าที่ควรเป็นในช่วงเวลาดังกล่าว","การส่งออกสุทธิไม่ขึ้นกับอัตราแลกเปลี่ยนที่แท้จริงเลย การลดลงในช่วง 1980–1985 เป็นเรื่องบังเอิญและการฟื้นตัวปลายปี 1987 เป็นผลของปัจจัยอื่นล้วน ๆ"],"answer":0,"a":"จากสไลด์ Application: The value of the dollar and U.S. net exports\nปรากฏการณ์ — ดอลลาร์แข็ง 1980–85 → NX ลดลงมาก · ดอลลาร์อ่อนตั้งแต่ 1985 แต่ NX เพิ่งขึ้นปลายปี 1987 (ความล่าช้าคล้ายเส้นโค้ง J)\nคำอธิบายที่สไลด์ให้ (beachhead effect)\n1. ดอลลาร์แข็งนานครึ่งแรกของทศวรรษ 1980 ทำให้บริษัทสหรัฐฯ สูญเสียลูกค้าต่างประเทศไปหลายราย\n2. บริษัทต่างชาติจึงเข้ามาในตลาดสหรัฐฯ และสร้าง “ฐานหาดทราย” (beachheads) ไว้ได้\n3. เมื่อค่าเงินกลับทิศ ฐานเหล่านั้นไม่หายไปทันที การฟื้นตัวจึงช้า\nบทเรียน — การเปลี่ยนค่าเงินไม่ส่งผลต่อการส่งออกสุทธิทันที เพราะความสัมพันธ์ทางการค้าปรับตัวช้า","whys":["ถูกต้อง — ตรงกับสไลด์ ดอลลาร์แข็งนานทำให้สูญเสียลูกค้าและคู่แข่งต่างชาติสร้างฐานในตลาดสหรัฐฯ จึงฟื้นตัวช้า","ไม่ถูกต้อง — เมื่อดอลลาร์อ่อนค่า สินค้าสหรัฐฯ ถูกลงในสายตาต่างชาติ ไม่ใช่แพงขึ้น และ beachhead effect ไม่ได้อธิบายเช่นนี้","ไม่ถูกต้อง — ไม่มีข้อห้ามจากธนาคารกลางเช่นนั้น และสไลด์ไม่ได้ใช้ข้อนี้เป็นคำอธิบายความล่าช้า","ไม่ถูกต้อง — สไลด์ใช้ช่วงเวลานี้เป็นตัวอย่างของความสัมพันธ์ระหว่างค่าเงินกับการส่งออกสุทธิ ไม่ใช่เรื่องบังเอิญ"]},{"id":"C28","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"ความต้องการสินค้าไทยจากทั่วโลกเพิ่มขึ้น","q":"ทั่วโลกต้องการสินค้าไทยมากขึ้นเพราะคุณภาพสินค้าไทยดีขึ้น ข้อใดวิเคราะห์ผลต่ออัตราแลกเปลี่ยนและการส่งออกสุทธิของไทยได้ถูกต้องที่สุด","choices":["อุปสงค์ต่อบาทเพิ่มและอุปทานลด เงินบาทแข็งค่า การส่งออกสุทธิเพิ่มขึ้นโดยตรงจากความต้องการที่สูงขึ้น แต่ถูกหักล้างบางส่วนเพราะเงินแข็งทำให้สินค้าแพงขึ้น","อุปสงค์ต่อบาทเพิ่มและอุปทานลด เงินบาทแข็งค่า การส่งออกสุทธิลดลงอย่างสิ้นเชิง เพราะเงินแข็งทำให้สินค้าแพงขึ้นจนผู้ซื้อไม่ต้องการสินค้าไทยอีก","อุปสงค์ต่อบาทลดและอุปทานเพิ่ม เงินบาทอ่อนค่า การส่งออกสุทธิเพิ่มขึ้นเพราะเงินอ่อนทำให้สินค้าถูกลง ซึ่งเป็นผลที่เกิดตามมาจากคุณภาพที่ดีขึ้นของสินค้า","คุณภาพสินค้าไม่มีผลต่อตลาดเงินบาท เพราะอัตราแลกเปลี่ยนกำหนดจากดอกเบี้ยเท่านั้น การส่งออกสุทธิจึงไม่เปลี่ยนแปลงแม้ต่างชาติต้องการสินค้าไทยมากขึ้น"],"answer":0,"a":"จากสไลด์ “The Effect of Increased Export Quality on the Value of the Dollar” (ใช้บาทแทนดอลลาร์) และแถว World demand for domestic goods ในสองตารางสรุป\nขั้นที่ 1 ตลาดเงิน — ต่างชาติต้องการสินค้าไทยมากขึ้น จึงต้องการบาทมากขึ้น (D ขวา) และคนไทยซื้อสินค้าต่างประเทศน้อยลงจึงเสนอขายบาทน้อยลง (S ซ้าย) → อัตราแลกเปลี่ยนสูงขึ้น บาทแข็งค่า\nขั้นที่ 2 การส่งออกสุทธิ — ตาราง Determinants of Net Exports: ความต้องการสินค้าในประเทศเพิ่ม → NX เพิ่มโดยตรง\nขั้นที่ 3 ผลย้อนกลับ — เงินที่แข็งขึ้นทำให้สินค้าแพงขึ้น หักล้างบางส่วน แต่ไม่ลบผลโดยตรงจนหมด\nข้อสังเกต — กรณีนี้ผลต่ออัตราแลกเปลี่ยนและ NX ไปทางเดียวกัน ต่างจากกรณีดอกเบี้ยในประเทศสูงขึ้น","whys":["ถูกต้อง — เงินแข็งค่า การส่งออกสุทธิเพิ่มตามความต้องการ แต่ผลบางส่วนถูกหักล้างด้วยค่าเงินที่แข็งขึ้น ตรงกับสไลด์","ไม่ถูกต้อง — ผลหักล้างจากเงินแข็งเป็นเพียงบางส่วน ไม่ใช่ทั้งหมด การส่งออกสุทธิจึงไม่ลดลงอย่างสิ้นเชิงเมื่อความต้องการเพิ่ม","ไม่ถูกต้อง — ทิศของค่าเงินกลับด้าน เมื่อต่างชาติต้องการสินค้าไทยมากขึ้น ความต้องการบาทเพิ่ม บาทแข็งค่า ไม่ใช่อ่อนค่า","ไม่ถูกต้อง — ตารางสรุประบุว่าความต้องการสินค้าในประเทศจากทั่วโลกเป็นปัจจัยกำหนดอัตราแลกเปลี่ยนโดยตรง ไม่ใช่เฉพาะดอกเบี้ย"]},{"id":"C29","type":"mcq","lvl":4,"topic":"อัตราแลกเปลี่ยน","ref":"ตารางสรุปปัจจัยกำหนดอัตราแลกเปลี่ยนและการส่งออกสุทธิ","q":"ข้อใดจับคู่ปัจจัยที่เพิ่มขึ้นกับผลต่ออัตราแลกเปลี่ยน (e) และการส่งออกสุทธิ (NX) ของประเทศได้ถูกต้องครบทั้งสี่รายการ","choices":["Y ในประเทศเพิ่ม → e ลด, NX ลด · Y ต่างประเทศเพิ่ม → e เพิ่ม, NX เพิ่ม · r ในประเทศเพิ่ม → e เพิ่ม, NX ลด · r ต่างประเทศเพิ่ม → e ลด, NX เพิ่ม","Y ในประเทศเพิ่ม → e เพิ่ม, NX ลด · Y ต่างประเทศเพิ่ม → e ลด, NX เพิ่ม · r ในประเทศเพิ่ม → e เพิ่ม, NX ลด · r ต่างประเทศเพิ่ม → e ลด, NX เพิ่ม","Y ในประเทศเพิ่ม → e ลด, NX ลด · Y ต่างประเทศเพิ่ม → e เพิ่ม, NX เพิ่ม · r ในประเทศเพิ่ม → e ลด, NX เพิ่ม · r ต่างประเทศเพิ่ม → e เพิ่ม, NX ลด","Y ในประเทศเพิ่ม → e ลด, NX เพิ่ม · Y ต่างประเทศเพิ่ม → e เพิ่ม, NX ลด · r ในประเทศเพิ่ม → e เพิ่ม, NX เพิ่ม · r ต่างประเทศเพิ่ม → e ลด, NX ลด"],"answer":0,"a":"นี่คือตารางสรุปสองตารางของสไลด์ (Determinants of the Exchange Rate / Determinants of Net Exports) ให้ตรวจทีละรายการ\n· Y ในประเทศเพิ่ม — นำเข้าเพิ่ม อุปทานเงินในประเทศเพิ่ม → e ลด · NX ลด ✓\n· Y ต่างประเทศเพิ่ม — ต่างชาติซื้อสินค้าเรามากขึ้น อุปสงค์เงินเพิ่ม → e เพิ่ม · NX เพิ่ม ✓\n· r ในประเทศเพิ่ม — เงินทุนไหลเข้า → e เพิ่ม · เงินแข็ง สินค้าแพง → NX ลด ✓\n· r ต่างประเทศเพิ่ม — เงินทุนไหลออก → e ลด · เงินอ่อน สินค้าถูก → NX เพิ่ม ✓\nเทคนิคจำ — ปัจจัย Y: e กับ NX ไปทางเดียวกัน · ปัจจัย r: e กับ NX สวนทางกัน\nตัวเลือกอื่นแต่ละข้อมีอย่างน้อยหนึ่งรายการผิด","whys":["ถูกต้อง — ทั้งสี่รายการตรงกับตารางสรุปของสไลด์ รายได้ทำให้ e และ NX ไปทางเดียวกัน ส่วนดอกเบี้ยทำให้สวนทางกัน","ไม่ถูกต้อง — รายการ Y ในประเทศและ Y ต่างประเทศผิดทิศของ e ทั้งสองรายการ รายได้ในประเทศเพิ่มทำให้เงินอ่อนค่า ส่วนรายได้ต่างประเทศเพิ่มทำให้เงินแข็งค่า","ไม่ถูกต้อง — รายการ r ในประเทศเพิ่ม และ r ต่างประเทศเพิ่ม สลับทิศกันทั้งสองรายการ ดอกเบี้ยในประเทศสูงทำให้เงินแข็ง ไม่ใช่อ่อน","ไม่ถูกต้อง — ทั้งสี่รายการผิดทิศของ NX หรือ e เช่น Y ในประเทศเพิ่มทำให้นำเข้าเพิ่ม NX จึงลด ไม่ใช่เพิ่ม"],"tip":"ตรวจตารางทีละบรรทัด: รายได้ (Y) → e กับ NX ไปทางเดียวกัน · ดอกเบี้ย (r) → e กับ NX สวนทางกัน"},{"id":"C30","type":"mcq","lvl":3,"topic":"อัตราแลกเปลี่ยน","ref":"รายได้ต่างประเทศเพิ่มขึ้น","q":"เศรษฐกิจของคู่ค้าหลักของไทยขยายตัวเร็วขึ้น รายได้ต่างประเทศ (Y_For) เพิ่มขึ้นโดยปัจจัยอื่นคงเดิม ข้อใดอธิบายผลต่ออัตราแลกเปลี่ยนและการส่งออกสุทธิของไทยได้ถูกต้อง","choices":["ต่างชาติรายได้สูงขึ้นจึงซื้อสินค้าไทยมากขึ้น อุปสงค์ต่อบาทเพิ่ม เงินบาทแข็งค่า และการส่งออกสุทธิของไทยเพิ่มขึ้นจากความต้องการส่งออกที่สูงขึ้น","ต่างชาติรายได้สูงขึ้นจึงซื้อสินค้าไทยมากขึ้น อุปสงค์ต่อบาทเพิ่ม เงินบาทอ่อนค่า และการส่งออกสุทธิของไทยเพิ่มขึ้นจากการที่สินค้าไทยถูกลง","ต่างชาติรายได้สูงขึ้นจึงขายบาทที่ถืออยู่เพื่อซื้อสินทรัพย์ในประเทศตนเอง อุปทานบาทเพิ่ม เงินบาทอ่อนค่า และการส่งออกสุทธิของไทยเพิ่มขึ้นตามค่าเงิน","ต่างชาติรายได้สูงขึ้นจึงซื้อสินค้าไทยน้อยลงเพราะหันไปซื้อสินค้าหรูในประเทศตนเอง อุปสงค์ต่อบาทลด เงินบาทอ่อนค่า และการส่งออกสุทธิของไทยลดลง"],"answer":0,"a":"จากสไลด์ “The opposite occurs if foreign output (income) rises — domestic net exports rise, the exchange rate appreciates”\nขั้นที่ 1 — Y_For เพิ่ม → ต่างชาติใช้จ่ายเพิ่ม รวมถึงสินค้านำเข้าจากไทย\nขั้นที่ 2 — การซื้อสินค้าไทยต้องใช้บาท → อุปสงค์ต่อบาทเพิ่ม → อัตราแลกเปลี่ยนสูงขึ้น บาทแข็งค่า\nขั้นที่ 3 — การส่งออกไทยเพิ่ม → การส่งออกสุทธิเพิ่มขึ้น (ตาราง Determinants of Net Exports)\nเปรียบเทียบกับรายได้ในประเทศ — Y ในประเทศเพิ่มให้ผลตรงข้ามทั้ง e และ NX (ข้อ 14)\nข้อสังเกต — ตัวเลือกที่ว่าเงินบาทอ่อนแต่ NX เพิ่ม ถูกครึ่งหลังเพราะเหตุผลผิด รายได้ต่างชาติทำให้เงินบาทแข็ง ไม่ใช่อ่อน","whys":["ถูกต้อง — Y ต่างประเทศเพิ่มทำให้อุปสงค์ต่อบาทเพิ่ม เงินบาทแข็งค่า และการส่งออกสุทธิของไทยเพิ่ม ตรงกับสไลด์","ไม่ถูกต้อง — ผลต่อการส่งออกสุทธิถูก แต่ทิศของค่าเงินผิด เมื่ออุปสงค์ต่อบาทเพิ่ม เงินบาทต้องแข็งค่า ไม่ใช่อ่อนค่า","ไม่ถูกต้อง — ต่างชาติรายได้สูงขึ้นไม่ได้ทำให้ขายบาท การส่งออกสุทธิที่เพิ่มมาจากความต้องการสินค้าไทย ไม่ใช่จากการอ่อนค่าของเงิน","ไม่ถูกต้อง — ขัดกับตารางสรุปที่ระบุว่ารายได้ต่างประเทศที่สูงขึ้นทำให้ส่งออกสุทธิเพิ่ม และเงินแข็งค่า ไม่ใช่ลดลงและอ่อนค่า"]}]});
