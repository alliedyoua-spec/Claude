var(--ink)\" stroke-width=\"2.2\"/><text x=\"200.76999999999998\" y=\"188.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">B</text><circle cx=\"325.28999999999996\" cy=\"254.95999999999998\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"335.28999999999996\" y=\"270.96\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">C</text></g><text x=\"325.28999999999996\" y=\"17\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-lras)\" text-anchor=\"middle\">LRAS</text><text x=\"325.28999999999996\" y=\"366\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"middle\">Y<tspan dy=\"4\" font-size=\"11\">FE</tspan></text><text x=\"53\" y=\"205.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₁</text><text x=\"53\" y=\"259.96\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₂</text></svg><div class=\"figcap\">เส้นทาง A → B → C — กลไกปรับตัวเองปิดช่องว่างการหดตัว</div></div>"},{"id":"E32","type":"mcq","lvl":4,"topic":"AD-AS","ref":"กรณีที่เศรษฐกิจไม่กลับสู่ระดับเดิม","q":"หลังภาวะถดถอยที่ยืดเยื้อนานหลายปี เศรษฐกิจฟื้นตัวแต่ผลผลิตไม่กลับไปที่แนวโน้มเดิมก่อนวิกฤต แม้อัตราการว่างงานจะกลับมาที่ระดับปกติแล้ว ข้อใดอธิบายปรากฏการณ์นี้ได้ถูกต้องที่สุด","choices":["ภาวะถดถอยที่ยืดเยื้อทำให้ทักษะแรงงานเสื่อมถอย การลงทุนสะสมทุนหยุดชะงัก และธุรกิจล้มหายไป เส้น LRAS จึงเลื่อนซ้ายจริง ผลผลิตศักยภาพจึงต่ำกว่าแนวโน้มเดิมอย่างถาวร","เป็นเพียงความคลาดเคลื่อนของการวัด เพราะแนวโน้มเดิมถูกประมาณการไว้สูงเกินจริงตั้งแต่ต้น ในความเป็นจริงเศรษฐกิจได้กลับสู่ผลผลิตศักยภาพที่แท้จริงเรียบร้อยแล้วทุกประการ","เป็นเพราะเส้น AD ยังไม่ได้เลื่อนกลับไปที่ตำแหน่งเดิม หากรัฐบาลกระตุ้นอุปสงค์ต่อไปเรื่อย ๆ ผลผลิตจะกลับไปที่แนวโน้มเดิมได้อย่างแน่นอนโดยไม่มีข้อจำกัดใด ๆ ทั้งสิ้น","เป็นเพราะเส้น SRAS ยังค้างอยู่ในตำแหน่งสูงจากช่วงวิกฤต เมื่อเวลาผ่านไปอีกสักระยะ SRAS จะเลื่อนลงเองและผลผลิตจะกลับไปที่แนวโน้มเดิมโดยอัตโนมัติไม่ต้องใช้นโยบายใด"],"answer":0,"a":"ปกติแบบจำลองแยกฝั่งอุปสงค์ออกจากฝั่งอุปทานอย่างชัดเจน — ช็อก AD กระทบผลผลิตชั่วคราวแล้วเศรษฐกิจกลับสู่ Y_FE เดิม แต่เมื่อภาวะถดถอยยืดเยื้อมากพอ เส้นแบ่งนี้จะพร่าเลือน\nช่องทางที่ทำให้ LRAS เลื่อนซ้ายจริง\n· แรงงานที่ว่างงานนานทักษะเสื่อมถอยและถูกนายจ้างคัดออก ทำให้อัตราธรรมชาติสูงขึ้น\n· ธุรกิจหยุดลงทุน การสะสมทุนชะงัก สต็อกทุนของประเทศโตช้ากว่าที่ควรเป็นหลายปี\n· บริษัทจำนวนมากล้มหายไปพร้อมกับความรู้ เครือข่ายซัพพลายเชน และความสัมพันธ์กับลูกค้าที่สร้างมานาน\n· การวิจัยและพัฒนาถูกตัดงบ ความก้าวหน้าทางเทคโนโลยีชะลอตัว\nผลรวมคือผลผลิตศักยภาพหายไปอย่างถาวร ปรากฏการณ์นี้เรียกว่า hysteresis และเป็นเหตุผลที่หนักแน่นที่สุดว่าทำไมจึงไม่ควรปล่อยให้ภาวะถดถอยลากยาว","whys":["ถูกต้อง — อธิบายช่องทางที่ช็อกด้านอุปสงค์ทิ้งรอยแผลถาวรไว้ที่ฝั่งอุปทานได้ครบถ้วน","ไม่ถูกต้อง — แม้การประมาณแนวโน้มจะมีความคลาดเคลื่อนได้ แต่หลักฐานจากหลายประเทศชี้ว่าการสูญเสียศักยภาพหลังวิกฤตยืดเยื้อเกิดขึ้นจริง","ไม่ถูกต้อง — เมื่ออัตราการว่างงานกลับสู่ระดับปกติแล้ว การกระตุ้นต่อจะผลักผลผลิตเกินศักยภาพใหม่ และจบที่เงินเฟ้อ","ไม่ถูกต้อง — โจทย์ระบุว่าอัตราการว่างงานกลับสู่ระดับปกติแล้ว ซึ่งหมายความว่ากระบวนการปรับตัวของ SRAS เสร็จสิ้นไปแล้ว"],"tip":"คำว่า hysteresis คือคำตอบของคำถามที่ว่า “ช็อกด้านอุปสงค์กระทบ LRAS ได้ไหม” — ตอบว่าได้ ถ้ามันลากยาวและลึกพอ"},{"id":"E33","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ระบุตำแหน่งดุลยภาพจากข้อมูลหลายชุด","q":"ประเทศหนึ่งรายงานว่า อัตราการว่างงานจริง 7.8% เทียบอัตราธรรมชาติ 5.0% · กำลังการผลิตภาคอุตสาหกรรมถูกใช้เพียง 68% เทียบค่าเฉลี่ยระยะยาว 80% · และอัตราเงินเฟ้อชะลอลงต่อเนื่อง ข้อใดวินิจฉัยและเสนอแนวทางได้ถูกต้องที่สุด","choices":["เศรษฐกิจอยู่ในช่องว่างการหดตัวขนาดใหญ่ ดุลยภาพระยะสั้นอยู่ซ้ายของ LRAS มาก · ควรใช้นโยบายด้านอุปสงค์แบบขยายตัว และความเสี่ยงเงินเฟ้อต่ำเพราะมีกำลังการผลิตว่างอยู่มาก","เศรษฐกิจอยู่ในช่องว่างเงินเฟ้อ ดุลยภาพระยะสั้นอยู่ขวาของ LRAS · ควรใช้นโยบายด้านอุปสงค์แบบหดตัวทันทีเพื่อป้องกันไม่ให้การคาดการณ์เงินเฟ้อฝังตัวในระบบเศรษฐกิจ","เศรษฐกิจอยู่ในดุลยภาพระยะยาวพอดี เพราะอัตราเงินเฟ้อที่ชะลอลงแสดงว่าไม่มีแรงกดดันด้านราคาเหลืออยู่ · จึงไม่ควรใช้นโยบายใด ๆ เพราะจะเป็นการรบกวนสมดุลที่ดีอยู่แล้ว","เศรษฐกิจกำลังเผชิญช็อกด้านอุปทานเชิงลบ เพราะกำลังการผลิตถูกใช้ต่ำกว่าปกติ · ควรใช้นโยบายด้านอุปทานเท่านั้น เพราะเครื่องมือด้านอุปสงค์จะทำให้เงินเฟ้อเร่งตัวขึ้นทันที"],"answer":0,"a":"ข้อมูลสามชุดชี้ไปทางเดียวกันทั้งหมด\nอัตราการว่างงาน 7.8% เทียบอัตราธรรมชาติ 5.0% → มีการว่างงานตามวัฏจักร 2.8 จุด → ผลผลิตต่ำกว่าศักยภาพ\nการใช้กำลังการผลิต 68% เทียบค่าเฉลี่ย 80% → โรงงานเดินเครื่องต่ำกว่าปกติมาก ยืนยันว่ามีทรัพยากรว่างอยู่เยอะ\nเงินเฟ้อชะลอลง → ไม่มีแรงกดดันด้านราคา สอดคล้องกับอุปสงค์ที่อ่อนแอ\nวินิจฉัย — ช่องว่างการหดตัวขนาดใหญ่ ดุลยภาพระยะสั้นอยู่ซ้ายของ LRAS มาก\nแนวทาง — ใช้นโยบายด้านอุปสงค์แบบขยายตัว และประเด็นสำคัญคือความเสี่ยงเงินเฟ้อต่ำเป็นพิเศษในสถานการณ์นี้ เพราะเมื่อมีกำลังการผลิตและแรงงานว่างอยู่มาก การเพิ่มอุปสงค์จะถูกดูดซับด้วยปริมาณเป็นหลักก่อนที่จะไปกดดันราคา","whys":["ถูกต้อง — อ่านข้อมูลทั้งสามชุดได้สอดคล้องกัน และเชื่อมโยงกำลังการผลิตที่ว่างเข้ากับความเสี่ยงเงินเฟ้อที่ต่ำ","ไม่ถูกต้อง — ข้อมูลทุกชุดชี้ไปที่เศรษฐกิจที่อ่อนแอ ทั้งการว่างงานที่สูงกว่าอัตราธรรมชาติและกำลังการผลิตที่ถูกใช้ต่ำกว่าปกติ","ไม่ถูกต้อง — ดุลยภาพระยะยาวต้องมีอัตราการว่างงานเท่ากับอัตราธรรมชาติ แต่ข้อมูลแสดงว่าสูงกว่าถึง 2.8 จุด","ไม่ถูกต้อง — ช็อกด้านอุปทานเชิงลบจะทำให้เงินเฟ้อเร่งตัว แต่ข้อมูลระบุว่าเงินเฟ้อชะลอลง ซึ่งชี้ไปที่ปัญหาด้านอุปสงค์"],"tip":"ตัวชี้วัดที่ควรดูควบคู่กันเสมอ: อัตราการว่างงานเทียบอัตราธรรมชาติ · อัตราการใช้กำลังการผลิต · ทิศทางของเงินเฟ้อ — สามตัวนี้บอกตำแหน่งเทียบ LRAS ได้แม่นยำ"},{"id":"E34","type":"mcq","lvl":4,"topic":"AD-AS","ref":"เปรียบเทียบผลลัพธ์ปลายทางของช็อกสี่แบบ","q":"เปรียบเทียบดุลยภาพระยะยาวใหม่เทียบกับจุดเริ่มต้น สำหรับช็อกสี่แบบ ข้อใดสรุปได้ถูกต้องทั้งหมด","choices":["AD ขวา: Y เท่าเดิม P สูงขึ้น · AD ซ้าย: Y เท่าเดิม P ต่ำลง · LRAS ขวา: Y สูงขึ้น P ต่ำลง · SRAS ขึ้นชั่วคราว: Y เท่าเดิม P เท่าเดิมเมื่อช็อกหมดไป","AD ขวา: Y สูงขึ้น P สูงขึ้น · AD ซ้าย: Y ต่ำลง P ต่ำลง · LRAS ขวา: Y สูงขึ้น P สูงขึ้น · SRAS ขึ้นชั่วคราว: Y ต่ำลงถาวร P สูงขึ้นถาวรแม้ช็อกจะหมดไปแล้วก็ตาม","AD ขวา: Y เท่าเดิม P ต่ำลง · AD ซ้าย: Y เท่าเดิม P สูงขึ้น · LRAS ขวา: Y ต่ำลง P สูงขึ้น · SRAS ขึ้นชั่วคราว: Y สูงขึ้นถาวร P ต่ำลงถาวรหลังจากที่ช็อกผ่านพ้นไป","ทั้งสี่แบบให้ผลลัพธ์ระยะยาวเหมือนกันคือ Y กลับสู่ระดับเดิมและ P กลับสู่ระดับเดิม เพราะกลไกปรับตัวเองของเส้นอุปทานระยะสั้นจะลบผลของช็อกทุกชนิดออกไปจนหมดสิ้นในที่สุด"],"answer":0,"a":"ตารางสรุปนี้คือแก่นของทั้งบท\nAD เลื่อนขวา — Y ทะลุ Y_FE ชั่วคราว แต่ SRAS ปรับขึ้นจนกลับมาที่เดิม → Y เท่าเดิม · P สูงขึ้น\nAD เลื่อนซ้าย — ภาพกระจกของกรณีแรก SRAS ปรับลง → Y เท่าเดิม · P ต่ำลง\nLRAS เลื่อนขวา — ระดับผลผลิตที่ยั่งยืนสูงขึ้นจริง จึงไม่ถูกดึงกลับ และอุปทานที่มากขึ้นกดราคาลง → Y สูงขึ้น · P ต่ำลง\nSRAS เลื่อนขึ้นชั่วคราว — ระยะสั้นได้ P สูง Y ต่ำ แต่เมื่อช็อกหมดไปและ LRAS ไม่ขยับ กลไกปรับตัวเองพากลับสู่จุดเดิม → Y เท่าเดิม · P เท่าเดิม\nบทเรียนสำคัญ — มีเพียงการเลื่อนของ LRAS เท่านั้นที่เปลี่ยนผลผลิตในระยะยาวได้","whys":["ถูกต้อง — สรุปครบทั้งสี่กรณีอย่างถูกต้อง รวมถึงกรณี SRAS ชั่วคราวที่กลับสู่จุดเดิมทั้งสองตัวแปร","ไม่ถูกต้อง — สับสนระหว่างผลระยะสั้นกับระยะยาว ในระยะยาวการเลื่อนของ AD ไม่เปลี่ยนผลผลิต และ LRAS ที่ขวาก็กดราคาลงไม่ใช่ดันขึ้น","ไม่ถูกต้อง — สลับทิศทางของระดับราคาในกรณี AD และสลับผลของ LRAS ทั้งหมด ซึ่งกลับด้านจากที่แบบจำลองอธิบาย","ไม่ถูกต้อง — การเลื่อนของ AD ทิ้งผลถาวรไว้ที่ระดับราคา และการเลื่อนของ LRAS ก็เปลี่ยนผลผลิตระยะยาวอย่างถาวร"],"tip":"ท่องตารางสี่แถวนี้ให้ขึ้นใจก่อนเข้าห้องสอบ — มันตอบคำถาม “ระยะยาวเป็นอย่างไร” ได้แทบทุกข้อของบทนี้"},{"id":"E35","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ดุลยภาพเมื่อ LRAS และ AD เลื่อนไปทางเดียวกัน","q":"ประเทศหนึ่งมีทั้งการลงทุนในโครงสร้างพื้นฐานที่เสร็จสมบูรณ์จนเพิ่มผลิตภาพ และการเติบโตของประชากรวัยแรงงาน พร้อมกับการบริโภคภายในประเทศที่ขยายตัวต่อเนื่อง ข้อใดอธิบายดุลยภาพระยะยาวใหม่ได้ถูกต้อง","choices":["LRAS และ AD เลื่อนขวาทั้งคู่ ผลผลิตระยะยาวสูงขึ้นแน่นอนตาม LRAS ใหม่ ส่วนระดับราคาสรุปทิศทางไม่ได้เพราะขึ้นกับว่า AD หรือ LRAS เลื่อนไปมากกว่ากัน","LRAS และ AD เลื่อนขวาทั้งคู่ ผลผลิตและระดับราคาจึงสูงขึ้นทั้งคู่อย่างแน่นอน เพราะทั้งสองเส้นที่เลื่อนไปทางขวาย่อมดันทั้งสองตัวแปรไปในทิศทางเดียวกันเสมอในทุกกรณี","LRAS เลื่อนขวาแต่ AD เลื่อนซ้าย เพราะการเพิ่มขึ้นของกำลังการผลิตทำให้สินค้าล้นตลาดและผู้บริโภคชะลอการซื้อเพื่อรอราคาที่ถูกลง ผลผลิตจึงเท่าเดิมและระดับราคาลดลงมาก","เฉพาะ LRAS เท่านั้นที่เลื่อนขวา ส่วน AD ไม่เปลี่ยนแปลงเพราะการบริโภคที่ขยายตัวเป็นผลจากผลผลิตที่สูงขึ้นอยู่แล้ว จึงเป็นเพียงการเคลื่อนที่ไปตามเส้นอุปสงค์มวลรวมเดิมเท่านั้น"],"answer":0,"a":"เมื่อสองเส้นเลื่อนไปทางเดียวกัน ต้องแยกให้ออกว่าแต่ละตัวแปรถูกกำหนดโดยอะไร\nผลผลิตระยะยาว — ถูกกำหนดโดย LRAS เพียงเส้นเดียว เมื่อ LRAS เลื่อนขวาจากทั้งผลิตภาพที่สูงขึ้นและกำลังแรงงานที่เพิ่ม ผลผลิตระยะยาวสูงขึ้นแน่นอน ไม่ว่า AD จะเลื่อนไปมากน้อยเพียงใด\nระดับราคาระยะยาว — ถูกกำหนดโดยว่า AD ไปตัด LRAS ใหม่ที่ความสูงเท่าใด\n· ถ้า AD เลื่อนขวามากกว่า LRAS → ราคาสูงขึ้น\n· ถ้า AD เลื่อนขวาน้อยกว่า LRAS → ราคาต่ำลง\n· ถ้าเลื่อนเท่ากันพอดี → ราคาเท่าเดิม\nโจทย์ไม่ได้บอกขนาดสัมพัทธ์ จึงสรุปทิศทางของราคาไม่ได้ — นี่คือภาพของเศรษฐกิจที่เติบโตอย่างสมดุล ซึ่งผลผลิตขยายตัวโดยที่เงินเฟ้ออยู่ในระดับที่ควบคุมได้","whys":["ถูกต้อง — แยกได้ว่าผลผลิตระยะยาวสรุปได้แน่นอนจาก LRAS ส่วนระดับราคาต้องรู้ขนาดสัมพัทธ์จึงจะสรุปได้","ไม่ถูกต้อง — LRAS ที่เลื่อนขวาเพียงลำพังจะกดระดับราคาลง ทิศทางของราคาจึงขึ้นกับว่า AD เลื่อนมากกว่าหรือน้อยกว่า","ไม่ถูกต้อง — โจทย์ระบุชัดว่าการบริโภคภายในประเทศขยายตัวต่อเนื่อง ซึ่งดัน AD ไปทางขวาไม่ใช่ซ้าย","ไม่ถูกต้อง — การบริโภคที่ขยายตัวเปลี่ยนการใช้จ่าย ณ ทุกระดับราคา จึงเป็นการเลื่อนเส้น AD ไม่ใช่การเคลื่อนที่ไปตามเส้น"]},{"id":"E36","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ความน่าเชื่อถือของธนาคารกลางกับต้นทุนการลดเงินเฟ้อ","q":"ธนาคารกลางสองแห่งต้องการลดเงินเฟ้อจาก 8% เหลือ 2% เท่ากัน โดยธนาคาร ก มีความน่าเชื่อถือสูงและประชาชนเชื่อคำประกาศ ส่วนธนาคาร ข ไม่มีใครเชื่อ ข้อใดเปรียบเทียบต้นทุนของทั้งสองได้ถูกต้อง","choices":["ธนาคาร ก เสียผลผลิตและการจ้างงานน้อยกว่า เพราะการคาดการณ์เงินเฟ้อปรับลงเร็วทำให้ค่าจ้างชะลอตามและ SRAS เลื่อนลงช่วย · ธนาคาร ข ต้องกด AD แรงและนานกว่ามากจึงจะดึงเงินเฟ้อลงได้","ธนาคาร ข เสียผลผลิตน้อยกว่า เพราะการที่ประชาชนไม่เชื่อทำให้ไม่มีใครเปลี่ยนพฤติกรรม เศรษฐกิจจึงดำเนินไปตามปกติและเงินเฟ้อจะลดลงเองโดยไม่กระทบการจ้างงานเลยแม้แต่น้อย","ทั้งสองธนาคารเสียผลผลิตเท่ากัน เพราะต้นทุนของการลดเงินเฟ้อถูกกำหนดโดยขนาดของการลดเงินเฟ้อเพียงอย่างเดียว ส่วนความน่าเชื่อถือเป็นเรื่องของภาพลักษณ์ที่ไม่มีผลทางเศรษฐกิจจริง","ธนาคาร ก เสียผลผลิตมากกว่า เพราะการที่ประชาชนเชื่อทำให้ทุกคนรีบปรับตัวพร้อมกันจนเกิดความปั่นป่วนในตลาดแรงงานและตลาดสินค้า ซึ่งซ้ำเติมภาวะถดถอยให้รุนแรงกว่าปกติ"],"answer":0,"a":"ต้นทุนของการลดเงินเฟ้อขึ้นกับว่าการคาดการณ์เงินเฟ้อปรับลงเร็วแค่ไหน\nธนาคาร ก มีความน่าเชื่อถือ — เมื่อประกาศว่าจะคุมเงินเฟ้อให้เหลือ 2% สหภาพแรงงานจะเรียกค่าจ้างเพิ่มเพียงเล็กน้อยในการเจรจารอบถัดไป ผู้ผลิตตั้งราคาเพิ่มน้อยลง ต้นทุนจึงชะลอตัวเอง SRAS เลื่อนลงมาช่วย ธนาคารกลางจึงไม่ต้องกด AD แรงนัก ผลผลิตและการจ้างงานเสียหายน้อย\nธนาคาร ข ไม่มีใครเชื่อ — ทุกฝ่ายยังคาดว่าเงินเฟ้อจะอยู่ที่ 8% ต่อไป จึงยังเรียกค่าจ้างและตั้งราคาตามนั้น SRAS ไม่ช่วยเลย ธนาคารกลางต้องกด AD ลงอย่างรุนแรงและนานพอที่จะสร้างการว่างงานสูงจนบีบให้ค่าจ้างชะลอลงจริง ต้นทุนในรูปผลผลิตและการจ้างงานที่สูญเสียไปจึงมากกว่ามาก\nนี่คือเหตุผลที่ความน่าเชื่อถือคือสินทรัพย์ที่มีค่าที่สุดของธนาคารกลาง และเป็นเหตุผลที่ธนาคารกลางยอมแลกทุกอย่างเพื่อไม่ให้การคาดการณ์เงินเฟ้อฝังตัว","whys":["ถูกต้อง — เชื่อมความน่าเชื่อถือเข้ากับความเร็วในการปรับของการคาดการณ์ ซึ่งกำหนดว่า SRAS จะช่วยหรือไม่","ไม่ถูกต้อง — การที่ไม่มีใครเชื่อทำให้ค่าจ้างและราคายังปรับขึ้นตามเดิม ธนาคารกลางจึงต้องใช้ยาแรงกว่าและเสียผลผลิตมากกว่า","ไม่ถูกต้อง — การคาดการณ์เปลี่ยนพฤติกรรมการเจรจาค่าจ้างและการตั้งราคาจริง จึงมีผลทางเศรษฐกิจที่วัดได้ชัดเจน","ไม่ถูกต้อง — การที่ทุกฝ่ายปรับการคาดการณ์ลงพร้อมกันเป็นสิ่งที่ช่วยลดต้นทุน เพราะทำให้ค่าจ้างและราคาชะลอตัวเองโดยไม่ต้องใช้การว่างงานบีบ"],"tip":"ศัพท์ที่เกี่ยวข้องคือ อัตราส่วนการเสียสละ (sacrifice ratio) — ผลผลิตที่ต้องสูญเสียต่อการลดเงินเฟ้อหนึ่งจุด ยิ่งธนาคารกลางน่าเชื่อถือ ตัวเลขนี้ยิ่งต่ำ"},{"id":"E37","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ระบุจุดดุลยภาพระยะยาวจากหลายจุดในกราฟ","q":"จากแผนภาพ มีจุดสามจุดบนกราฟ ข้อใดระบุได้ถูกต้องว่าจุดใดเป็นดุลยภาพระยะยาวและเพราะเหตุใด","choices":["จุด X และจุด Z เป็นดุลยภาพระยะยาวทั้งคู่ เพราะแต่ละจุดมีเส้น AD, SRAS และ LRAS ผ่านพร้อมกัน ส่วนจุด Y เป็นเพียงดุลยภาพระยะสั้นเพราะอยู่ขวาของ LRAS","มีเพียงจุด X เท่านั้นที่เป็นดุลยภาพระยะยาว เพราะเป็นจุดเริ่มต้นก่อนเกิดการเปลี่ยนแปลงใด ๆ ส่วนจุด Z เป็นเพียงดุลยภาพระยะสั้นที่เกิดขึ้นหลังจากที่เส้นอุปทานระยะสั้นได้เลื่อนขึ้นไปแล้ว","มีเพียงจุด Y เท่านั้นที่เป็นดุลยภาพระยะยาว เพราะเป็นจุดที่ผลผลิตของระบบเศรษฐกิจสูงที่สุดในบรรดาสามจุด ซึ่งแสดงว่าทรัพยากรของประเทศถูกใช้อย่างเต็มประสิทธิภาพที่สุดแล้ว","ทั้งสามจุดเป็นดุลยภาพระยะยาวเหมือนกัน เพราะทุกจุดล้วนเป็นจุดที่เส้นอุปสงค์มวลรวมตัดกับเส้นอุปทานมวลรวมระยะสั้น ซึ่งเป็นเงื่อนไขเพียงพอของการเป็นดุลยภาพในแบบจำลองนี้"],"answer":0,"a":"ใช้เกณฑ์เดียวคือ เส้นทั้งสามต้องผ่านจุดนั้นพร้อมกัน\nจุด X — AD₁ ตัด SRAS₁ ที่จุดนี้ และ LRAS ก็ผ่านพอดี → เป็นดุลยภาพระยะยาว\nจุด Y — AD₂ ตัด SRAS₁ ที่จุดนี้ แต่อยู่ขวาของ LRAS → เป็นเพียงดุลยภาพระยะสั้นที่มีช่องว่างเงินเฟ้อ\nจุด Z — AD₂ ตัด SRAS₂ ที่จุดนี้ และ LRAS ก็ผ่านพอดี → เป็นดุลยภาพระยะยาว\nสิ่งที่กราฟนี้เล่า — เศรษฐกิจเดินจาก X (ดุลยภาพระยะยาวเดิม) ไป Y (ระยะสั้นหลัง AD เลื่อนขวา) แล้วจบที่ Z (ดุลยภาพระยะยาวใหม่) โดยผลผลิตที่ X กับ Z เท่ากันที่ Y_FE แต่ระดับราคาที่ Z สูงกว่า — ยืนยันว่าดุลยภาพระยะยาวมีได้หลายจุด ตราบใดที่อยู่บนเส้น LRAS","whys":["ถูกต้อง — ใช้เกณฑ์เส้นครบสามได้ถูกต้อง และเข้าใจว่าดุลยภาพระยะยาวมีได้หลายจุดบนเส้น LRAS เดียวกัน","ไม่ถูกต้อง — จุด Z มีทั้ง AD₂, SRAS₂ และ LRAS ผ่านพร้อมกัน จึงเข้าเงื่อนไขของดุลยภาพระยะยาวอย่างครบถ้วน","ไม่ถูกต้อง — จุด Y อยู่ขวาของ LRAS ซึ่งเป็นผลผลิตที่เกินระดับยั่งยืน จึงเป็นดุลยภาพระยะสั้นที่ไม่สามารถคงอยู่ได้","ไม่ถูกต้อง — การที่ AD ตัด SRAS เป็นเงื่อนไขของดุลยภาพระยะสั้น ส่วนระยะยาวต้องมี LRAS ผ่านจุดเดียวกันด้วย"],"fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n  <defs>\n    <clipPath id=\"clipG\"><rect x=\"62\" y=\"26\" width=\"466\" height=\"318\"/></clipPath>\n    <marker id=\"arwG\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/>\n    </marker>\n  </defs>\n  <line x1=\"62\" y1=\"18\" x2=\"62\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <line x1=\"62\" y1=\"344\" x2=\"540\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <text x=\"52\" y=\"14\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">P</text>\n  <text x=\"548\" y=\"349\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Y</text><g clip-path=\"url(#clipG)\"><line x1=\"325.28999999999996\" y1=\"356.72\" x2=\"325.28999999999996\" y2=\"26\" stroke=\"var(--curve-lras)\" stroke-width=\"2.6\" /><line x1=\"34.040000000000006\" y1=\"200.9\" x2=\"555.96\" y2=\"200.9\" stroke=\"var(--curve-as)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"75.98\" y=\"191.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-as)\" text-anchor=\"start\">SRAS₁</text><line x1=\"34.040000000000006\" y1=\"146.84\" x2=\"555.96\" y2=\"146.84\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\"  stroke-linecap=\"round\"/><text x=\"75.98\" y=\"137.84\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ghost)\" text-anchor=\"start\">SRAS₂</text><line x1=\"15.399999999999999\" y1=\"38.72000000000003\" x2=\"574.6\" y2=\"331.28\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\"  stroke-linecap=\"round\"/><text x=\"151.88\" y=\"98.98400000000001\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ghost)\" text-anchor=\"start\">AD₁</text><line x1=\"117.91999999999999\" y1=\"38.72000000000003\" x2=\"677.12\" y2=\"331.28\" stroke=\"var(--curve-ad)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"254.4\" y=\"98.98400000000001\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ad)\" text-anchor=\"start\">AD₂</text><circle cx=\"325.28999999999996\" cy=\"200.9\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"303.28999999999996\" y=\"216.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">X</text><circle cx=\"427.81\" cy=\"200.9\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"437.81\" y=\"216.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">Y</text><circle cx=\"325.28999999999996\" cy=\"146.84\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"335.28999999999996\" y=\"134.84\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">Z</text></g><text x=\"325.28999999999996\" y=\"17\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-lras)\" text-anchor=\"middle\">LRAS</text><text x=\"325.28999999999996\" y=\"366\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"middle\">Y<tspan dy=\"4\" font-size=\"11\">FE</tspan></text><text x=\"53\" y=\"205.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₁</text><text x=\"53\" y=\"151.84\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₂</text></svg><div class=\"figcap\">สามจุดบนกราฟ — ตรวจสอบว่าจุดใดมีเส้นครบทั้งสามผ่านพร้อมกัน</div></div>"},{"id":"E38","type":"mcq","lvl":4,"topic":"AD-AS","ref":"สังเคราะห์: วินิจฉัยและวางแผนนโยบายครบวงจร","q":"เศรษฐกิจมีผลผลิตต่ำกว่าศักยภาพ 4% · อัตราการว่างงาน 8% เทียบอัตราธรรมชาติ 5% · เงินเฟ้ออยู่ที่ 6% และเร่งตัวขึ้นจากราคาพลังงานนำเข้า · หนี้สาธารณะสูงมากจนกู้เพิ่มได้จำกัด ข้อใดคือแนวทางที่สมเหตุสมผลที่สุด","choices":["ยอมรับว่าเผชิญทั้งช่องว่างการหดตัวและเงินเฟ้อจากต้นทุน เครื่องมือด้านอุปสงค์แก้ได้ทีละอย่าง จึงควรใช้นโยบายแบบระมัดระวังควบคู่กับมาตรการด้านอุปทานที่ลดต้นทุนพลังงานซึ่งแก้ตรงจุดที่สุด","ควรเร่งกระตุ้นด้วยนโยบายการคลังแบบขาดดุลขนาดใหญ่ทันทีเพื่อปิดช่องว่าง 4% ให้เร็วที่สุด โดยไม่ต้องกังวลเรื่องเงินเฟ้อเพราะผลผลิตยังต่ำกว่าศักยภาพและยังมีทรัพยากรว่างอยู่มาก อีกทั้งยังมีพื้นที่ทางการคลังเหลือเพียงพอ","ควรขึ้นอัตราดอกเบี้ยอย่างรุนแรงทันทีเพื่อกดเงินเฟ้อให้ลงมาก่อน เพราะเสถียรภาพราคาต้องมาก่อนเสมอ และเมื่อเงินเฟ้อลงแล้วผลผลิตจะฟื้นตัวกลับมาเองโดยอัตโนมัติในเวลาไม่นาน","ควรใช้มาตรการควบคุมราคาสินค้าและตรึงราคาพลังงานไว้อย่างเข้มงวด ซึ่งจะแก้ทั้งปัญหาเงินเฟ้อและปัญหาผลผลิตพร้อมกันโดยไม่ต้องใช้งบประมาณหรือกระทบหนี้สาธารณะเลย"],"answer":0,"a":"สถานการณ์นี้มีข้อจำกัดซ้อนกันสามชั้น\nชั้นที่หนึ่ง ปัญหาสองด้านพร้อมกัน — มีทั้งช่องว่างการหดตัว (Y ต่ำกว่าศักยภาพ 4% · u สูงกว่า u_n 3 จุด) และเงินเฟ้อที่เร่งตัว ซึ่งลายเซ็นบ่งชี้ว่ามาจากฝั่งต้นทุน ไม่ใช่จากอุปสงค์ที่ร้อนแรง\nชั้นที่สอง เครื่องมือไม่พอ — เครื่องมือด้านอุปสงค์เคลื่อน P กับ Y ไปทางเดียวกันเสมอ จึงแก้ได้ทีละอย่างและทำให้อีกอย่างแย่ลง\nชั้นที่สาม พื้นที่ทางการคลังจำกัด — หนี้สาธารณะที่สูงตัดทางเลือกของนโยบายการคลังขนาดใหญ่ออกไป\nแนวทางที่สมเหตุสมผล — ใช้นโยบายด้านอุปสงค์อย่างระมัดระวังและมีขนาดจำกัด โดยเฝ้าระวังการคาดการณ์เงินเฟ้อไม่ให้ฝังตัว ควบคู่ไปกับมาตรการด้านอุปทานที่ลดต้นทุนพลังงาน เช่น เพิ่มประสิทธิภาพการใช้พลังงาน กระจายแหล่งนำเข้า หรือเร่งพลังงานทางเลือก ซึ่งเลื่อน SRAS ลงและ LRAS ขวา จึงช่วยทั้งสองปัญหาพร้อมกันโดยไม่ต้องเลือก","whys":["ถูกต้อง — วินิจฉัยครบทั้งสามชั้นของข้อจำกัด และเสนอทางออกที่แก้ทั้งสองปัญหาพร้อมกันผ่านฝั่งอุปทาน","ไม่ถูกต้อง — มองข้ามทั้งเงินเฟ้อที่กำลังเร่งตัวและข้อจำกัดด้านหนี้สาธารณะที่โจทย์ระบุไว้ชัดเจน","ไม่ถูกต้อง — การขึ้นดอกเบี้ยรุนแรงในขณะที่ผลผลิตต่ำกว่าศักยภาพอยู่แล้วจะยิ่งถ่างช่องว่างการหดตัวและเพิ่มการว่างงาน","ไม่ถูกต้อง — การควบคุมราคาไม่ได้แก้ต้นทุนที่แท้จริงของผู้ผลิต และมักทำให้เกิดการขาดแคลนสินค้าตามมา"],"tip":"เจอโจทย์ที่มีทั้งช่องว่างการหดตัวและเงินเฟ้อจากต้นทุน พร้อมพื้นที่ทางการคลังจำกัด — คำตอบที่ได้คะแนนเต็มคือมาตรการด้านอุปทานที่ลดต้นทุน เพราะเป็นเครื่องมือเดียวที่ช่วยทั้งสองด้านพร้อมกัน"},{"id":"C01","type":"mcq","lvl":3,"topic":"AD-AS","ref":"สี่ระยะของวัฏจักรธุรกิจ","q":"ตามนิยาม อัตราแลกเปลี่ยนตามชื่อ (nominal exchange rate, e_nom) คือค่าใด และถ้าอัตราแลกเปลี่ยนเท่ากับ 120 เยนต่อ 1 ดอลลาร์ ในมุมของสหรัฐฯ หมายความว่าอย่างไร","choices":["เส้นประคือผลผลิตศักยภาพซึ่งเติบโตตามการสะสมปัจจัยการผลิต · เส้นทึบคือผลผลิตจริงที่แกว่งรอบเส้นนั้น โดยช่วงที่ผลผลิตจริงเพิ่มขึ้นเรียกขยายตัว และช่วงที่ลดลงเรียกหดตัว","เส้นประคือผลผลิตจริงของประเทศที่วัดได้จากบัญชีรายได้ประชาชาติ · เส้นทึบคือค่าเฉลี่ยเคลื่อนที่ที่นักเศรษฐศาสตร์คำนวณขึ้นเพื่อลดความผันผวนของข้อมูลรายไตรมาสให้ดูราบเรียบขึ้น","เส้นประคือระดับราคาของประเทศที่เพิ่มขึ้นตามเวลา · เส้นทึบคือผลผลิตที่แท้จริงซึ่งจะแกว่งรอบระดับราคานั้นตามความสัมพันธ์ระหว่างเงินเฟ้อกับการเติบโตทางเศรษฐกิจ","เส้นประคือเป้าหมายการเติบโตที่รัฐบาลกำหนดไว้ในแผนพัฒนาเศรษฐกิจ · เส้นทึบคือผลผลิตจริงที่เกิดขึ้น โดยระยะห่างระหว่างสองเส้นแสดงถึงความล้มเหลวของการดำเนินนโยบาย"],"answer":0,"a":"กราฟนี้คือภาพรวมของทั้งบท\nเส้นประ คือผลผลิตศักยภาพ (Y ศักยภาพ) ซึ่งเป็นระดับผลผลิตที่ยั่งยืน ณ การจ้างงานเต็มที่ เส้นนี้ลาดขึ้นเรื่อย ๆ เพราะประเทศสะสมทุน แรงงานเพิ่ม และเทคโนโลยีก้าวหน้า — มันคือเส้น LRAS ที่วาดตามเวลา\nเส้นทึบ คือผลผลิตที่แท้จริง ซึ่งแกว่งขึ้นลงรอบเส้นศักยภาพ\nสี่ระยะ — ช่วงที่ผลผลิตจริงกำลังเพิ่มขึ้นคือการขยายตัว · จุดที่หยุดเพิ่มและเริ่มลดคือจุดสูงสุด · ช่วงที่กำลังลดลงคือการหดตัว · จุดที่หยุดลดและเริ่มเพิ่มคือจุดต่ำสุด\nระยะห่างระหว่างสองเส้นคือช่องว่างผลผลิต ซึ่งแปลเป็นตำแหน่งซ้ายหรือขวาของ LRAS ในกราฟ AD-AS ได้โดยตรง","whys":["ถูกต้อง — ระบุความหมายของทั้งสองเส้นและนิยามของสี่ระยะได้ตรงตามหลักวิชา","ไม่ถูกต้อง — สลับกัน เส้นที่แกว่งขึ้นลงคือผลผลิตจริง ส่วนเส้นที่ราบเรียบกว่าคือผลผลิตศักยภาพ ไม่ใช่ค่าเฉลี่ยเคลื่อนที่","ไม่ถูกต้อง — แกนตั้งของกราฟนี้คือผลผลิตที่แท้จริง ไม่ใช่ระดับราคา ทั้งสองเส้นจึงวัดในหน่วยเดียวกันคือผลผลิต","ไม่ถูกต้อง — ผลผลิตศักยภาพเป็นข้อจำกัดทางเศรษฐกิจที่แท้จริง ไม่ใช่เป้าหมายที่รัฐบาลตั้งขึ้น และช่องว่างก็ไม่ได้แปลว่านโยบายล้มเหลว"],"tip":"กราฟวัฏจักรกับกราฟ AD-AS เล่าเรื่องเดียวกัน: เส้นศักยภาพในกราฟวัฏจักร = เส้น LRAS ในกราฟ AD-AS","fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n    <defs><clipPath id=\"clipCY\"><rect x=\"66\" y=\"24\" width=\"510\" height=\"300\"/></clipPath></defs>\n    <line x1=\"66\" y1=\"24\" x2=\"66\" y2=\"318\" stroke=\"var(--ink-2)\" s hor=\"middle\">หดตัว</text><line x1=\"148.2\" y1=\"325\" x2=\"247.79999999999998\" y2=\"325\" stroke=\"var(--line-2)\" stroke-width=\"1.4\"/><text x=\"303.6\" y=\"338\" font-size=\"11.5\" font-weight=\"600\" fill=\"var(--muted)\" text-anchor=\"middle\">ขยายตัว</text><line x1=\"253.79999999999998\" y1=\"325\" x2=\"353.40000000000003\" y2=\"325\" stroke=\"var(--line-2)\" stroke-width=\"1.4\"/><text x=\"409.2\" y=\"338\" font-size=\"11.5\" font-weight=\"600\" fill=\"var(--muted)\" text-anchor=\"middle\">หดตัว</text><line x1=\"359.40000000000003\" y1=\"325\" x2=\"459\" y2=\"325\" stroke=\"var(--line-2)\" stroke-width=\"1.4\"/>\n  </svg><div class=\"figcap\">ผลผลิตที่แท้จริงแกว่งตัวรอบเส้นแนวโน้มผลผลิตศักยภาพ</div></div>"},{"id":"C02","type":"mcq","lvl":4,"topic":"AD-AS","ref":"แปลระยะของวัฏจักรเป็นภาษา AD-AS","q":"เศรษฐกิจอยู่ในช่วงปลายของการขยายตัวใกล้จุดสูงสุด ข้อใดแปลสถานะนี้เป็นภาษาของแบบจำลอง AD-AS และตลาดแรงงานได้ถูกต้องที่สุด","choices":["ผลผลิตจริงอยู่เหนือผลผลิตศักยภาพ ดุลยภาพระยะสั้นอยู่ขวาของ LRAS เป็นช่องว่างเงินเฟ้อ อัตราการว่างงานต่ำกว่าอัตราธรรมชาติ และแรงกดดันให้ค่าจ้างกับราคาสูงขึ้นกำลังก่อตัว","ผลผลิตจริงอยู่ต่ำกว่าผลผลิตศักยภาพ ดุลยภาพระยะสั้นอยู่ซ้ายของ LRAS เป็นช่องว่างการหดตัว อัตราการว่างงานสูงกว่าอัตราธรรมชาติ และแรงกดดันให้ค่าจ้างลดลงกำลังก่อตัวขึ้นในระบบ","ผลผลิตจริงเท่ากับผลผลิตศักยภาพพอดี เส้นทั้งสามตัดกันที่จุดเดียว เศรษฐกิจอยู่ในดุลยภาพระยะยาวที่สมบูรณ์ และไม่มีแรงกดดันใด ๆ ต่อค่าจ้างหรือระดับราคาในระยะถัดไป","ไม่สามารถแปลได้ เพราะวัฏจักรธุรกิจเป็นแนวคิดเชิงประจักษ์ที่อธิบายการเคลื่อนไหวของข้อมูลตามเวลา ส่วนแบบจำลอง AD-AS เป็นแบบจำลองเชิงทฤษฎีที่พิจารณาดุลยภาพ ณ จุดเวลาเดียว"],"answer":0,"a":"ปลายของการขยายตัวคือช่วงที่เศรษฐกิจวิ่งร้อนที่สุด ผลผลิตจริงพุ่งขึ้นจนแซงเส้นศักยภาพไปแล้ว\nแปลเป็นภาษา AD-AS — ผลผลิตจริงอยู่เหนือผลผลิตศักยภาพ แปลว่าดุลยภาพระยะสั้นอยู่ขวาของ LRAS นั่นคือช่องว่างเงินเฟ้อ\nแปลเป็นภาษาตลาดแรงงาน — บริษัทแย่งคนกัน อัตราการว่างงานจริงต่ำกว่าอัตราธรรมชาติ แรงงานมีอำนาจต่อรองสูง\nสิ่งที่กำลังก่อตัว — ค่าจ้างเริ่มถูกดันขึ้น ซัพพลายเออร์ขึ้นราคาเพราะของขาด ต้นทุนของผู้ผลิตสูงขึ้น SRAS กำลังจะเลื่อนขึ้น ซึ่งจะดึงผลผลิตกลับลงมาและเป็นจุดเริ่มต้นของการพลิกเข้าสู่จุดสูงสุดและการหดตัวในที่สุด","whys":["ถูกต้อง — แปลได้ครบทั้งสามภาษา คือภาษาวัฏจักร ภาษา AD-AS และภาษาตลาดแรงงาน","ไม่ถูกต้อง — นี่คือคำอธิบายของช่วงการหดตัวหรือใกล้จุดต่ำสุด ซึ่งตรงข้ามกับปลายของการขยายตัวโดยสิ้นเชิง","ไม่ถูกต้อง — ดุลยภาพระยะยาวคือจุดที่ผลผลิตจริงตัดเส้นศักยภาพพอดี ซึ่งอยู่ระหว่างทาง ไม่ใช่ที่ปลายของการขยายตัว","ไม่ถูกต้อง — สองกรอบนี้อธิบายปรากฏการณ์เดียวกันคนละมุม และแปลไปมาได้โดยตรงผ่านแนวคิดช่องว่างผลผลิต"],"tip":"ท่องโซ่การแปลนี้ให้คล่อง: ปลายขยายตัว = Y > Y ศักยภาพ = ขวาของ LRAS = ช่องว่างเงินเฟ้อ = u"},{"id":"C03","type":"mcq","lvl":2,"topic":"AD-AS","ref":"นิยามภาวะถดถอยและข้อจำกัดของมัน","q":"สื่อมักนิยามภาวะถดถอยว่าคือ “ผลผลิตที่แท้จริงหดตัวติดต่อกันสองไตรมาส” ข้อใดประเมินนิยามนี้ได้ถูกต้องที่สุด","choices":["เป็นเกณฑ์คร่าว ๆ ที่ใช้ง่ายแต่ไม่สมบูรณ์ เพราะมองเฉพาะผลผลิตโดยไม่ดูการจ้างงาน รายได้ หรือความลึกของการหดตัว จึงอาจพลาดภาวะถดถอยจริงหรือเตือนผิดพลาดได้","เป็นนิยามที่ถูกต้องสมบูรณ์และเป็นสากล เพราะผลผลิตที่แท้จริงเป็นตัวชี้วัดเดียวที่สะท้อนภาวะเศรษฐกิจได้ครบถ้วน การใช้ตัวชี้วัดอื่นประกอบจึงเป็นการทำให้เรื่องซับซ้อนโดยไม่จำเป็น","เป็นนิยามที่ผิดโดยสิ้นเชิง เพราะภาวะถดถอยต้องวัดจากอัตราการว่างงานที่สูงกว่าอัตราธรรมชาติเท่านั้น ส่วนผลผลิตเป็นตัวแปรที่วัดได้ยากและมักถูกปรับปรุงย้อนหลังอยู่เสมอ","เป็นนิยามที่ใช้ไม่ได้เลยในทางปฏิบัติ เพราะข้อมูลผลผลิตรายไตรมาสเผยแพร่ช้าเกินไป กว่าจะรู้ว่าเกิดภาวะถดถอยเศรษฐกิจก็ฟื้นตัวไปแล้ว จึงไม่มีประโยชน์ในการดำเนินนโยบายใด ๆ"],"answer":0,"a":"เกณฑ์สองไตรมาสเป็นกฎง่าย ๆ ที่มีประโยชน์แต่หยาบ\nข้อดี — ชัดเจน วัดได้ ไม่ต้องตีความ ใช้สื่อสารกับสาธารณะได้ง่าย\nข้อจำกัด\n· มองเฉพาะผลผลิต ไม่ดูการจ้างงาน รายได้ที่แท้จริง ยอดค้าปลีก และการผลิตภาคอุตสาหกรรม ซึ่งอาจบอกภาพที่ต่างออกไป\n· ไม่สนใจความลึก — หดตัว 0.1% สองไตรมาสถูกนับ แต่หดตัว 3% ในไตรมาสเดียวแล้วฟื้นกลับไม่ถูกนับ ทั้งที่กรณีหลังเจ็บกว่ามาก\n· ข้อมูล GDP มักถูกปรับปรุงย้อนหลัง สถานะจึงเปลี่ยนได้หลังประกาศไปแล้ว\nด้วยเหตุนี้ หน่วยงานที่กำหนดวันเริ่มต้นและสิ้นสุดของภาวะถดถอยอย่างเป็นทางการจึงพิจารณาตัวชี้วัดหลายตัวร่วมกัน ไม่ได้ยึดกฎสองไตรมาสเพียงอย่างเดียว","whys":["ถูกต้อง — ยอมรับประโยชน์ของเกณฑ์นี้ขณะเดียวกันก็ชี้ข้อจำกัดเรื่องมิติที่ขาดหายและความลึกของการหดตัว","ไม่ถูกต้อง — ผลผลิตเป็นตัวชี้วัดสำคัญแต่ไม่ครบถ้วน การจ้างงานและรายได้ที่แท้จริงให้ข้อมูลเพิ่มเติมที่จำเป็นต่อการวินิจฉัย","ไม่ถูกต้อง — อัตราการว่างงานเป็นตัวชี้วัดที่ตามหลังวัฏจักร การใช้มันเพียงตัวเดียวจะทำให้รู้ตัวช้ากว่าการดูผลผลิตเสียอีก","ไม่ถูกต้อง — แม้ข้อมูลจะมีความล่าช้าจริง แต่ก็ยังใช้ประเมินสถานะและปรับนโยบายได้ การบอกว่าไม่มีประโยชน์เลยจึงเกินจริง"]},{"id":"C04","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ตัวชี้วัดล่วงหน้า พร้อมกัน และตามหลัง","q":"ข้อใดจำแนกตัวชี้วัดทางเศรษฐกิจตามจังหวะเวลาเทียบกับวัฏจักรธุรกิจได้ถูกต้อง","choices":["ตัวชี้วัดล่วงหน้าเช่นคำสั่งซื้อสินค้าทุนและดัชนีความเชื่อมั่นจะเปลี่ยนก่อน · ตัวชี้วัดพร้อมกันเช่นผลผลิตอุตสาหกรรมเปลี่ยนไปพร้อมวัฏจักร · ตัวชี้วัดตามหลังเช่นอัตราการว่างงานเปลี่ยนทีหลัง","ตัวชี้วัดล่วงหน้าเช่นอัตราการว่างงานจะเปลี่ยนก่อนเสมอ · ตัวชี้วัดพร้อมกันเช่นดัชนีความเชื่อมั่นเปลี่ยนไปพร้อมวัฏจักร · ตัวชี้วัดตามหลังเช่นคำสั่งซื้อสินค้าทุนจะเปลี่ยนเป็นอันดับสุดท้ายเสมอ","ตัวชี้วัดทุกประเภทเปลี่ยนแปลงไปพร้อมกันทั้งหมด เพราะเศรษฐกิจเป็นระบบที่เชื่อมโยงกันอย่างสมบูรณ์ การแบ่งประเภทตามจังหวะเวลาจึงเป็นเพียงการจัดหมวดหมู่ที่ไม่มีความหมายในทางปฏิบัติ","ตัวชี้วัดล่วงหน้าคือตัวที่หน่วยงานเผยแพร่ข้อมูลได้เร็วที่สุด · ตัวชี้วัดตามหลังคือตัวที่เผยแพร่ช้าที่สุด การจำแนกจึงขึ้นกับความเร็วในการจัดเก็บข้อมูลของหน่วยงานสถิติแต่ละแห่งเป็นหลัก"],"answer":0,"a":"การจำแนกนี้อิงจากลำดับเวลาของการเปลี่ยนแปลงจริง ไม่ใช่ความเร็วในการเผยแพร่ข้อมูล\nตัวชี้วัดล่วงหน้า (leading) — เปลี่ยนก่อนวัฏจักร เช่น คำสั่งซื้อสินค้าทุน ใบอนุญาตก่อสร้าง ดัชนีความเชื่อมั่น ราคาหุ้น และส่วนต่างอัตราดอกเบี้ย เหตุผลคือตัวแปรเหล่านี้สะท้อนการตัดสินใจเกี่ยวกับอนาคต\nตัวชี้วัดพร้อมกัน (coincident) — เปลี่ยนไปพร้อมวัฏจักร เช่น ผลผลิตอุตสาหกรรม ยอดค้าปลีก รายได้ส่วนบุคคลที่แท้จริง เพราะเป็นภาพของกิจกรรมทางเศรษฐกิจในปัจจุบัน\nตัวชี้วัดตามหลัง (lagging) — เปลี่ยนทีหลัง เช่น อัตราการว่างงาน เพราะบริษัทมักลดชั่วโมงทำงานก่อนแล้วจึงเลิกจ้าง และเมื่อเศรษฐกิจฟื้นก็มักเพิ่มชั่วโมงทำงานก่อนที่จะจ้างคนใหม่\nนี่คือเหตุผลที่ผู้ดำเนินนโยบายต้องดูตัวชี้วัดหลายตัว — การรอดูอัตราการว่างงานอย่างเดียวจะทำให้ตอบสนองช้าเกินไปเสมอ","whys":["ถูกต้อง — จำแนกได้ถูกทั้งสามประเภทพร้อมตัวอย่างที่สอดคล้องกับเหตุผลเชิงกลไก","ไม่ถูกต้อง — สลับกันทั้งหมด อัตราการว่างงานเป็นตัวชี้วัดตามหลัง ส่วนคำสั่งซื้อสินค้าทุนเป็นตัวชี้วัดล่วงหน้า","ไม่ถูกต้อง — ตัวแปรต่าง ๆ เปลี่ยนแปลงในจังหวะเวลาที่ต่างกันจริง ซึ่งเป็นข้อเท็จจริงเชิงประจักษ์ที่ใช้ประโยชน์ได้ในการพยากรณ์","ไม่ถูกต้อง — การจำแนกอิงจากลำดับเวลาที่ตัวแปรเปลี่ยนแปลงจริง ไม่ใช่ความเร็วในการเผยแพร่ข้อมูลของหน่วยงาน"],"tip":"จำเหตุผลไว้ด้วย ไม่ใช่แค่รายชื่อ: ล่วงหน้า = การตัดสินใจเกี่ยวกับอนาคต · ตามหลัง = การจ้างงานที่บริษัทลังเลจะปรับ"},{"id":"C05","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ความผันผวนขององค์ประกอบต่าง ๆ ตามวัฏจักร","q":"เมื่อสังเกตข้อมูลจริงตลอดวัฏจักรธุรกิจ พบว่าองค์ประกอบของ GDP มีความผันผวนไม่เท่ากัน ข้อใดอธิบายรูปแบบนี้ได้ถูกต้องที่สุด","choices":["การลงทุนผันผวนมากที่สุดเพราะเป็นการตัดสินใจที่เลื่อนได้และขึ้นกับความคาดหวังต่ออนาคต · การบริโภคผันผวนน้อยกว่าเพราะครัวเรือนพยายามปรับการใช้จ่ายให้ราบเรียบตลอดช่วงชีวิต","การบริโภคผันผวนมากที่สุดเพราะเป็นองค์ประกอบที่ใหญ่ที่สุดของ GDP · การลงทุนผันผวนน้อยกว่าเพราะโครงการลงทุนมักผูกพันด้วยสัญญาระยะยาวจึงไม่สามารถเปลี่ยนแปลงได้ตามภาวะเศรษฐกิจ","องค์ประกอบทุกตัวผันผวนเท่ากันตามสัดส่วนของตนใน GDP เพราะเมื่อเศรษฐกิจหดตัว รายได้ของทุกภาคส่วนจะลดลงในอัตราเดียวกันตามกลไกการหมุนเวียนของรายได้ในระบบเศรษฐกิจ","รายจ่ายภาครัฐผันผวนมากที่สุดเพราะรัฐบาลปรับเปลี่ยนงบประมาณได้ตลอดเวลา · ส่วนการลงทุนและการบริโภคของภาคเอกชนค่อนข้างคงที่เพราะขึ้นกับรายได้ประจำที่ไม่ผันผวนมากนัก"],"answer":0,"a":"รูปแบบนี้เป็นข้อเท็จจริงเชิงประจักษ์ที่สำคัญของวัฏจักรธุรกิจ\nการลงทุนผันผวนที่สุด — เพราะเป็นรายจ่ายที่เลื่อนออกไปได้ บริษัทที่ไม่แน่ใจอนาคตสามารถชะลอการสร้างโรงงานออกไปอีกปีได้โดยไม่กระทบการดำเนินงานวันนี้ อีกทั้งการตัดสินใจลงทุนขึ้นกับความคาดหวังต่อกำไรในอนาคตซึ่งเปลี่ยนแปลงได้รวดเร็วตามความเชื่อมั่น\nการบริโภคผันผวนน้อยกว่า — เพราะครัวเรือนพยายามปรับการใช้จ่ายให้ราบเรียบ (consumption smoothing) โดยใช้เงินออมและการกู้ยืมเป็นกันชนเมื่อรายได้ผันผวน ค่าอาหาร ค่าเช่า และค่าสาธารณูปโภคก็ตัดลงได้ยาก\nข้อยกเว้นที่ควรรู้ — การบริโภคสินค้าคงทนอย่างรถยนต์และเครื่องใช้ไฟฟ้าผันผวนสูงมาก เพราะเลื่อนการซื้อออกไปได้เหมือนการลงทุน\nนี่คือเหตุผลที่การลงทุนมักเป็นตัวจุดชนวนของทั้งการหดตัวและการฟื้นตัว","whys":["ถูกต้อง — อธิบายทั้งเหตุผลที่การลงทุนผันผวนสูงและกลไกที่ทำให้การบริโภคราบเรียบกว่า","ไม่ถูกต้อง — สลับกัน ขนาดของฐานไม่ได้กำหนดความผันผวน และโครงการลงทุนใหม่ก็เลื่อนหรือยกเลิกได้ง่ายกว่าที่ระบุ","ไม่ถูกต้อง — ข้อมูลจริงแสดงชัดว่าการลงทุนผันผวนหลายเท่าของการบริโภค ไม่ได้ผันผวนตามสัดส่วนของตนอย่างสม่ำเสมอ","ไม่ถูกต้อง — รายจ่ายภาครัฐค่อนข้างมีเสถียรภาพเพราะผูกกับงบประมาณประจำปี และมักถูกใช้เป็นตัวรักษาเสถียรภาพด้วยซ้ำ"]},{"id":"C06","type":"mcq","lvl":4,"topic":"AD-AS","ref":"สินค้าคงคลังกับจุดพลิกของวัฏจักร","q":"ในช่วงที่เศรษฐกิจกำลังขยายตัวอย่างแข็งแกร่ง ธุรกิจทั่วประเทศเริ่มรายงานว่าสินค้าคงคลังพอกขึ้นผิดปกติเพราะยอดขายชะลอตัวกว่าที่คาด ข้อใดตีความสัญญาณนี้ได้ถูกต้องที่สุด","choices":["เป็นสัญญาณเตือนล่วงหน้าว่าเศรษฐกิจอาจกำลังเข้าใกล้จุดสูงสุด ผู้ผลิตจะลดการผลิตและการจ้างงานในรอบถัดไปเพื่อระบายสต็อก ซึ่งจะเร่งให้ผลผลิตหดตัวเป็นทอด ๆ","เป็นสัญญาณว่าเศรษฐกิจกำลังขยายตัวแข็งแกร่งขึ้นอีก เพราะสินค้าคงคลังที่เพิ่มขึ้นถูกนับเป็นการลงทุนซึ่งเป็นองค์ประกอบของ GDP การสะสมสต็อกจึงทำให้ผลผลิตของประเทศสูงขึ้นโดยตรง","เป็นสัญญาณว่าเส้น SRAS กำลังจะเลื่อนลง เพราะผู้ผลิตที่มีสินค้าเหลือมากจะแข่งขันกันลดราคาเพื่อระบายสต็อก ทำให้ต้นทุนการผลิตต่อหน่วยของทั้งอุตสาหกรรมลดลงตามไปด้วย","ไม่ใช่สัญญาณอะไรเลยในระดับมหภาค เพราะการบริหารสินค้าคงคลังเป็นเรื่องภายในของแต่ละบริษัท ซึ่งขึ้นกับกลยุทธ์การจัดการห่วงโซ่อุปทานที่แตกต่างกันไปในแต่ละอุตสาหกรรม"],"answer":0,"a":"สินค้าคงคลังเป็นหนึ่งในตัวชี้วัดล่วงหน้าที่มีพลังที่สุดของวัฏจักรธุรกิจ\nกลไก — ผู้ผลิตวางแผนการผลิตล่วงหน้าจากยอดขายที่คาดไว้ เมื่อยอดขายจริงต่ำกว่าที่คาด สินค้าที่ผลิตออกมาจึงค้างสต็อก นี่คือการสะสมสินค้าคงคลังที่ไม่ได้ตั้งใจ ซึ่งเป็นสัญญาณว่าอุปสงค์รวมอ่อนแรงกว่าที่ผู้ผลิตประเมินไว้\nสิ่งที่จะเกิดต่อไป — ผู้ผลิตตอบสนองด้วยการตัดกำลังการผลิตและชะลอการจ้างงานในรอบถัดไป เพื่อระบายสต็อกที่ค้างอยู่ การลดการผลิตหมายถึงการสั่งซื้อวัตถุดิบน้อยลงและจ่ายค่าจ้างน้อยลง ซึ่งกลายเป็นรายได้ที่หายไปของคนอื่นและกดอุปสงค์ลงอีกทอด\nผลรวม — วงจรนี้เร่งให้เศรษฐกิจพลิกจากการขยายตัวเข้าสู่จุดสูงสุดและการหดตัว เป็นกลไกที่ทำให้วัฏจักรธุรกิจมีลักษณะขยายตัวเองทั้งขาขึ้นและขาลง","whys":["ถูกต้อง — ระบุว่าเป็นสัญญาณอุปสงค์อ่อนและอธิบายกลไกที่ทำให้การหดตัวขยายตัวเองเป็นทอด ๆ","ไม่ถูกต้อง — ต้องแยกการสะสมสต็อกที่ตั้งใจออกจากที่ไม่ได้ตั้งใจ กรณีหลังสะท้อนอุปสงค์ที่อ่อนแอ แม้ทางบัญชีจะถูกนับเป็น I เหมือนกัน","ไม่ถูกต้อง — การลดราคาระบายสต็อกไม่ได้ทำให้ต้นทุนการผลิตต่อหน่วยลดลง SRAS เลื่อนเมื่อต้นทุนเปลี่ยน ไม่ใช่เมื่อยอดขายเปลี่ยน","ไม่ถูกต้อง — เมื่อธุรกิจทั่วประเทศรายงานรูปแบบเดียวกัน นั่นคือสัญญาณมหภาคที่นักเศรษฐศาสตร์ติดตามอย่างใกล้ชิด"]},{"id":"C07","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ตัวรักษาเสถียรภาพอัตโนมัติ","q":"ในช่วงที่เศรษฐกิจหดตัว รัฐบาลพบว่างบประมาณขาดดุลกว้างขึ้นเองโดยไม่ได้ประกาศมาตรการใหม่ ส่วนในช่วงขยายตัวงบประมาณกลับดีขึ้นเอง ข้อใดอธิบายปรากฏการณ์นี้และบทบาทของมันได้ถูกต้อง","choices":["เป็นตัวรักษาเสถียรภาพอัตโนมัติ เพราะภาษีลดลงและสวัสดิการเพิ่มขึ้นเองเมื่อเศรษฐกิจแย่ ซึ่งช่วยพยุงอุปสงค์รวมไว้ และทำงานกลับด้านเมื่อเศรษฐกิจดี จึงลดความรุนแรงของวัฏจักรโดยไม่ต้องรอการตัดสินใจ","เป็นความล้มเหลวของการบริหารการคลัง เพราะงบประมาณที่แกว่งตามภาวะเศรษฐกิจแสดงว่ารัฐบาลไม่สามารถวางแผนรายรับรายจ่ายได้อย่างแม่นยำ ซึ่งบั่นทอนความน่าเชื่อถือทางการคลังของประเทศ และทำให้ต้นทุนการกู้ยืมของภาครัฐสูงขึ้นในระยะถัดไป","เป็นผลของนโยบายการคลังแบบสวนวัฏจักรที่รัฐบาลตั้งใจดำเนินการ โดยรัฐสภาจะอนุมัติงบประมาณเพิ่มเติมทุกครั้งที่เศรษฐกิจหดตัวและตัดงบทุกครั้งที่เศรษฐกิจขยายตัวอย่างเป็นระบบ","เป็นปรากฏการณ์ที่ไม่มีผลต่อวัฏจักรธุรกิจเลย เพราะการเปลี่ยนแปลงของงบประมาณเป็นเพียงการบันทึกทางบัญชีที่สะท้อนภาวะเศรษฐกิจ ไม่ได้ส่งผลย้อนกลับไปกระทบอุปสงค์มวลรวมแต่อย่างใด"],"answer":0,"a":"ตัวรักษาเสถียรภาพอัตโนมัติ คือกลไกทางการคลังที่ทำงานเองตามภาวะเศรษฐกิจโดยไม่ต้องรอการตัดสินใจใด ๆ\nช่วงหดตัว — รายได้และกำไรลดลง ฐานภาษีเล็กลง รัฐจึงเก็บภาษีได้น้อยลงเอง ทำให้เงินเหลืออยู่ในมือครัวเรือนและธุรกิจมากกว่าที่ควรจะเป็น ขณะเดียวกันรายจ่ายด้านประกันการว่างงานและสวัสดิการเพิ่มขึ้นเองตามจำนวนผู้มีสิทธิ์ ทั้งสองด้านช่วยพยุง AD ไม่ให้ดิ่งลึกเกินไป\nช่วงขยายตัว — กลไกทำงานกลับด้าน ภาษีเก็บได้มากขึ้นและรายจ่ายสวัสดิการลดลง ซึ่งช่วยเบรกไม่ให้เศรษฐกิจร้อนแรงเกินไป\nข้อได้เปรียบสำคัญ — ไม่มีความล่าช้าในการตัดสินใจ ต่างจากมาตรการที่ต้องผ่านกระบวนการงบประมาณซึ่งอาจมาถึงตอนที่สายเกินไปแล้ว การขาดดุลที่กว้างขึ้นในช่วงหดตัวจึงไม่ใช่ความล้มเหลว แต่คือกลไกที่กำลังทำงานตามที่ออกแบบไว้","whys":["ถูกต้อง — อธิบายกลไกทั้งสองทิศทางและระบุข้อได้เปรียบเรื่องการไม่มีความล่าช้าในการตัดสินใจ","ไม่ถูกต้อง — งบประมาณที่แกว่งตามวัฏจักรเป็นคุณสมบัติที่ออกแบบไว้โดยตั้งใจ ไม่ใช่ความล้มเหลวของการวางแผน","ไม่ถูกต้อง — จุดเด่นของกลไกนี้คือทำงานเองโดยไม่ต้องผ่านการอนุมัติ ซึ่งต่างจากมาตรการที่ใช้ดุลยพินิจ","ไม่ถูกต้อง — เงินภาษีที่เก็บน้อยลงและสวัสดิการที่จ่ายเพิ่มขึ้นเป็นเงินที่อยู่ในมือประชาชนจริง จึงพยุงการใช้จ่ายและ AD ได้จริง"],"tip":"แยกให้ออกระหว่าง ตัวรักษาเสถียรภาพอัตโนมัติ (ทำงานเอง ไม่มีความล่าช้าในการตัดสินใจ) กับ นโยบายที่ใช้ดุลยพินิจ (ต้องอนุมัติ มีความล่าช้าสามชั้น)"},{"id":"C08","type":"mcq","lvl":4,"topic":"AD-AS","ref":"การขยายตัวที่ยั่งยืนกับไม่ยั่งยืน","q":"ประเทศ ก ขยายตัว 5% ต่อปี โดยผลิตภาพและกำลังแรงงานเติบโต 5% ตามไปด้วย · ประเทศ ข ขยายตัว 5% ต่อปีเช่นกัน แต่ผลผลิตศักยภาพโตเพียง 2% ข้อใดเปรียบเทียบได้ถูกต้อง","choices":["ประเทศ ก เติบโตอย่างยั่งยืนเพราะ LRAS ขยายตามไปด้วย ช่องว่างผลผลิตจึงไม่เปิด · ประเทศ ข สะสมช่องว่างเงินเฟ้อปีละ 3 จุด แรงกดดันเงินเฟ้อจะเร่งตัวขึ้นและการเติบโตจะสะดุดในที่สุด","ทั้งสองประเทศเติบโตในอัตราเดียวกันจึงมีสถานะทางเศรษฐกิจเหมือนกันทุกประการ เพราะอัตราการเติบโตของผลผลิตที่แท้จริงเป็นตัวชี้วัดความสำเร็จทางเศรษฐกิจที่ครอบคลุมและเพียงพอแล้ว","ประเทศ ข เติบโตได้ดีกว่าเพราะสามารถผลิตได้เกินศักยภาพของตนเองถึง 3 จุดต่อปี ซึ่งแสดงว่าประเทศนี้ใช้ทรัพยากรได้อย่างมีประสิทธิภาพสูงกว่าและควรเป็นแบบอย่างให้ประเทศ ก","ประเทศ ก จะเผชิญภาวะเงินฝืดเพราะอุปทานที่ขยายตัวเร็วเท่ากับอุปสงค์จะทำให้สินค้าล้นตลาดและราคาลดลงต่อเนื่อง ส่วนประเทศ ข จะมีเสถียรภาพด้านราคาที่ดีกว่าในระยะยาว"],"answer":0,"a":"อัตราการเติบโตตัวเดียวบอกอะไรไม่ได้ ต้องเทียบกับอัตราการเติบโตของผลผลิตศักยภาพเสมอ\nประเทศ ก — AD และ LRAS ขยายตัวไปพร้อมกันที่ 5% ผลผลิตจริงจึงวิ่งตามเส้นศักยภาพตลอด ช่องว่างผลผลิตไม่เปิด ตลาดแรงงานไม่ตึงเกินไป ไม่มีแรงกดดันเงินเฟ้อสะสม นี่คือการเติบโตที่ยั่งยืน\nประเทศ ข — AD โต 5% แต่ LRAS โตเพียง 2% ทุกปีผลผลิตจริงจะแซงศักยภาพไปอีก 3 จุด ช่องว่างเงินเฟ้อสะสมขึ้นเรื่อย ๆ ตลาดแรงงานตึงตัวขึ้นทุกปี ค่าจ้างและราคาถูกดันขึ้น SRAS เลื่อนขึ้น และในที่สุดเงินเฟ้อจะเร่งตัวจนธนาคารกลางต้องขึ้นดอกเบี้ยอย่างรุนแรง ทำให้การขยายตัวสะดุดลง\nบทเรียน — การเติบโตที่เกินศักยภาพไม่ใช่ความสำเร็จ แต่คือการยืมผลผลิตจากอนาคตมาใช้ และต้องจ่ายคืนด้วยเงินเฟ้อหรือภาวะถดถอย","whys":["ถูกต้อง — เปรียบเทียบอัตราการเติบโตกับอัตราการขยายตัวของศักยภาพ ซึ่งเป็นเกณฑ์ที่ถูกต้องของความยั่งยืน","ไม่ถูกต้อง — อัตราการเติบโตตัวเดียวไม่บอกความยั่งยืน ต้องเทียบกับศักยภาพเสมอจึงจะรู้ว่ามีช่องว่างสะสมหรือไม่","ไม่ถูกต้อง — การผลิตเกินศักยภาพทำได้ชั่วคราวด้วยการทำล่วงเวลาและเดินเครื่องเต็มกำลัง ซึ่งไม่ยั่งยืนและจบด้วยเงินเฟ้อ","ไม่ถูกต้อง — เมื่ออุปสงค์และอุปทานขยายตัวเท่ากัน ระดับราคาจะมีเสถียรภาพ ไม่ใช่เกิดภาวะเงินฝืดอย่างที่ระบุ"],"tip":"อย่าดูอัตราการเติบโตโดด ๆ ให้เทียบเสมอว่า โตเร็วกว่าหรือช้ากว่าศักยภาพ — ส่วนต่างนั้นคือช่องว่างผลผลิตที่กำลังสะสม"},{"id":"C09","type":"mcq","lvl":3,"topic":"AD-AS","ref":"สัญญาณที่บ่งชี้จุดต่ำสุดและการฟื้นตัว","q":"หลังเศรษฐกิจหดตัวมาหลายไตรมาส นักวิเคราะห์เริ่มเห็นสัญญาณว่าอาจใกล้ถึงจุดต่ำสุด ข้อใดคือชุดสัญญาณที่สอดคล้องกันที่สุดของการใกล้ฟื้นตัว","choices":["คำสั่งซื้อสินค้าทุนและใบอนุญาตก่อสร้างเริ่มกลับมาเพิ่มขึ้น · สินค้าคงคลังถูกระบายจนลดลงมาก · ดัชนีความเชื่อมั่นธุรกิจปรับตัวดีขึ้น ขณะที่อัตราการว่างงานยังคงสูงอยู่","อัตราการว่างงานเริ่มลดลงอย่างชัดเจนก่อนเป็นอันดับแรก · จากนั้นคำสั่งซื้อสินค้าทุนจึงเริ่มฟื้นตัวตามมา · และสุดท้ายสินค้าคงคลังจะเริ่มถูกสะสมเพิ่มขึ้นในโกดังของผู้ผลิตทั่วประเทศ","สินค้าคงคลังเพิ่มขึ้นอย่างรวดเร็ว · ดัชนีความเชื่อมั่นธุรกิจยังคงตกต่ำต่อเนื่อง · แต่อัตราการว่างงานลดลงเพราะบริษัทเริ่มจ้างคนเพิ่มเพื่อรองรับการผลิตสินค้าเข้าสต็อกจำนวนมาก","ราคาสินทรัพย์ปรับตัวลดลงต่อเนื่อง · อัตราดอกเบี้ยในตลาดปรับสูงขึ้น · และการลงทุนภาคเอกชนยังคงหดตัว ซึ่งทั้งสามอย่างเป็นสัญญาณมาตรฐานของการเข้าสู่ช่วงฟื้นตัวของวัฏจักร"],"answer":0,"a":"ชุดสัญญาณที่ถูกต้องต้องสอดคล้องกับลำดับเวลาของตัวชี้วัด\nตัวชี้วัดล่วงหน้าฟื้นก่อน — คำสั่งซื้อสินค้าทุนและใบอนุญาตก่อสร้างสะท้อนการตัดสินใจเกี่ยวกับอนาคต เมื่อธุรกิจเริ่มมองเห็นแสงสว่าง ตัวเลขเหล่านี้จะขยับขึ้นก่อนใคร\nสินค้าคงคลังลดลง — เป็นสัญญาณสำคัญมาก เพราะเมื่อสต็อกที่ค้างถูกระบายจนหมด ผู้ผลิตต้องกลับมาผลิตใหม่เพื่อเติมสต็อก ซึ่งจุดชนวนการฟื้นตัวของการผลิตและการจ้างงาน\nความเชื่อมั่นธุรกิจดีขึ้น — นำไปสู่การกลับมาลงทุน ซึ่งมีตัวคูณขยายผลต่อ\nอัตราการว่างงานยังสูง — เป็นเรื่องปกติและไม่ขัดแย้งกับการฟื้นตัว เพราะเป็นตัวชี้วัดตามหลัง บริษัทจะเพิ่มชั่วโมงทำงานของคนเดิมก่อน แล้วค่อยจ้างคนใหม่เมื่อมั่นใจว่าการฟื้นตัวเป็นของจริง","whys":["ถูกต้อง — ชุดสัญญาณสอดคล้องกับลำดับของตัวชี้วัดล่วงหน้า พร้อมกัน และตามหลังอย่างถูกต้อง","ไม่ถูกต้อง — อัตราการว่างงานเป็นตัวชี้วัดตามหลัง จึงไม่ฟื้นเป็นอันดับแรก และสต็อกที่ถูกสะสมเพิ่มก็เป็นสัญญาณของช่วงหลังการฟื้นตัวแล้ว","ไม่ถูกต้อง — สินค้าคงคลังที่เพิ่มขึ้นพร้อมความเชื่อมั่นที่ตกต่ำเป็นสัญญาณของการเข้าสู่การหดตัว ไม่ใช่การฟื้นตัว","ไม่ถูกต้อง — ทั้งสามสัญญาณที่ระบุล้วนเป็นลักษณะของช่วงหดตัวที่ยังดำเนินอยู่ ไม่ใช่สัญญาณของการใกล้ฟื้นตัว"]},{"id":"C10","type":"mcq","lvl":4,"topic":"AD-AS","ref":"การเติบโตตามแนวโน้มเทียบกับการแกว่งตามวัฏจักร","q":"ข้อใดอธิบายความแตกต่างระหว่างการเติบโตทางเศรษฐกิจระยะยาวกับวัฏจักรธุรกิจ และปัจจัยที่ขับเคลื่อนแต่ละอย่างได้ถูกต้อง","choices":["การเติบโตระยะยาวคือการเลื่อนขวาของ LRAS ซึ่งขับเคลื่อนโดยทุน แรงงาน และเทคโนโลยี · วัฏจักรคือการแกว่งของผลผลิตจริงรอบเส้นนั้น ซึ่งขับเคลื่อนโดยช็อกด้านอุปสงค์และอุปทานระยะสั้น","การเติบโตระยะยาวคือการเลื่อนขวาของ AD ซึ่งขับเคลื่อนโดยการใช้จ่ายที่เพิ่มขึ้น · วัฏจักรคือการแกว่งของ LRAS ที่เกิดจากการเปลี่ยนแปลงของปัจจัยการผลิตในแต่ละช่วงเวลาของปี","ทั้งสองอย่างเป็นสิ่งเดียวกัน เพราะการที่เศรษฐกิจขยายตัวในช่วงหนึ่งของวัฏจักรก็คือการเติบโตทางเศรษฐกิจนั่นเอง การแยกสองแนวคิดนี้จึงเป็นเพียงการจำแนกทางวิชาการที่ไม่มีนัยเชิงนโยบาย","การเติบโตระยะยาวถูกขับเคลื่อนโดยนโยบายการเงินและการคลังเป็นหลัก · ส่วนวัฏจักรธุรกิจถูกขับเคลื่อนโดยการสะสมทุนและความก้าวหน้าทางเทคโนโลยีซึ่งเกิดขึ้นเป็นรอบตามช่วงเวลา"],"answer":0,"a":"สองแนวคิดนี้อยู่คนละมิติเวลาและมีตัวขับเคลื่อนคนละชุด\nการเติบโตระยะยาว — คือการที่เส้นศักยภาพเลื่อนสูงขึ้นตามเวลา หรือในภาษา AD-AS คือ LRAS เลื่อนขวา ตัวขับเคลื่อนคือการสะสมทุน การเพิ่มขึ้นของกำลังแรงงานและทักษะ และความก้าวหน้าทางเทคโนโลยี นี่คือสิ่งที่กำหนดว่าประเทศจะรวยขึ้นแค่ไหนในอีก 30 ปี\nวัฏจักรธุรกิจ — คือการที่ผลผลิตจริงแกว่งรอบเส้นศักยภาพ ตัวขับเคลื่อนคือช็อกด้านอุปสงค์ (ความเชื่อมั่น การส่งออก นโยบาย) และช็อกด้านอุปทานระยะสั้น (ราคาพลังงาน ภัยพิบัติ) นี่คือสิ่งที่กำหนดว่าปีหน้าจะมีงานทำหรือตกงาน\nนัยเชิงนโยบายที่สำคัญมาก — นโยบายด้านอุปสงค์จัดการวัฏจักรได้แต่ไม่สร้างการเติบโต ส่วนนโยบายด้านอุปทานสร้างการเติบโตได้แต่ช้าเกินกว่าจะใช้ดับไฟเฉพาะหน้า การสับสนสองเรื่องนี้นำไปสู่การใช้เครื่องมือผิดประเภท","whys":["ถูกต้อง — แยกสองแนวคิดตามเส้นที่เคลื่อนที่และระบุตัวขับเคลื่อนของแต่ละอย่างได้ถูกต้อง","ไม่ถูกต้อง — สลับกันทั้งหมด การเติบโตระยะยาวคือการเลื่อนของ LRAS ส่วนวัฏจักรคือการแกว่งของผลผลิตจริงรอบเส้นนั้น","ไม่ถูกต้อง — การแยกสองแนวคิดมีนัยเชิงนโยบายที่สำคัญมาก เพราะเครื่องมือที่ใช้จัดการแต่ละอย่างต่างกันโดยสิ้นเชิง","ไม่ถูกต้อง — สลับตัวขับเคลื่อน นโยบายด้านอุปสงค์จัดการวัฏจักร ส่วนทุนและเทคโนโลยีขับเคลื่อนการเติบโตระยะยาว"],"tip":"คำถามที่ต้องถามตัวเองทุกครั้ง: โจทย์กำลังพูดถึง การแกว่งรอบเส้น (วัฏจักร) หรือ การยกเส้นขึ้น (การเติบโต) — คำตอบจะต่างกันสิ้นเชิง"},{"id":"C11","type":"mcq","lvl":4,"topic":"AD-AS","ref":"อ่านตำแหน่งบนวัฏจักรจากกราฟ","q":"จากแผนภาพ จุด A ถูกทำเครื่องหมายไว้บนเส้นผลผลิตจริง ข้อใดอธิบายสถานะของเศรษฐกิจ ณ จุดนั้นได้ถูกต้องที่สุด","choices":["เศรษฐกิจอยู่ในช่วงหดตัวหลังผ่านจุดสูงสุดมาแล้ว แต่ผลผลิตจริงยังอยู่เหนือเส้นศักยภาพ จึงยังคงมีช่องว่างเงินเฟ้อและอัตราการว่างงานยังต่ำกว่าอัตราธรรมชาติอยู่","เศรษฐกิจอยู่ในช่วงขยายตัวก่อนถึงจุดสูงสุด ผลผลิตจริงกำลังเพิ่มขึ้นและอยู่เหนือเส้นศักยภาพ จึงมีช่องว่างเงินเฟ้อที่กำลังถ่างกว้างขึ้นเรื่อย ๆ ในทุกไตรมาสที่ผ่านไป","เศรษฐกิจอยู่ในช่วงหดตัวและผลผลิตจริงอยู่ต่ำกว่าเส้นศักยภาพแล้ว จึงเกิดช่องว่างการหดตัวและอัตราการว่างงานสูงกว่าอัตราธรรมชาติ ควรใช้นโยบายกระตุ้นโดยเร็วที่สุด","เศรษฐกิจอยู่ที่จุดต่ำสุดของวัฏจักรพอดี ซึ่งเป็นจุดที่ผลผลิตจริงหยุดลดลงและกำลังจะเริ่มฟื้นตัวขึ้น จึงเป็นจังหวะที่เหมาะสมที่สุดในการเริ่มถอนมาตรการกระตุ้นเศรษฐกิจออก"],"answer":0,"a":"ต้องอ่านกราฟสองมิติพร้อมกัน ซึ่งเป็นจุดที่นักศึกษาพลาดบ่อยที่สุด\nมิติที่หนึ่ง ทิศทางการเคลื่อนไหว — จุด A อยู่หลังจุดสูงสุด เส้นผลผลิตจริงกำลังลดลง จึงอยู่ในช่วงหดตัว\nมิติที่สอง ตำแหน่งเทียบเส้นศักยภาพ — แม้จะกำลังลดลง แต่ผลผลิตจริงยังอยู่เหนือเส้นศักยภาพ จึงยังเป็นช่องว่างเงินเฟ้อ และอัตราการว่างงานยังต่ำกว่าอัตราธรรมชาติ\nบทเรียนสำคัญ — “เศรษฐกิจกำลังชะลอตัว” ไม่ได้แปลว่า “เศรษฐกิจอยู่ต่ำกว่าศักยภาพ” เศรษฐกิจอาจกำลังหดตัวลงจากระดับที่ร้อนเกินไปกลับสู่ระดับปกติก็ได้ ซึ่งเป็นการปรับตัวที่พึงประสงค์ ไม่ใช่ปัญหาที่ต้องรีบกระตุ้น\nการรีบกระตุ้นในจังหวะนี้จะดันเศรษฐกิจกลับไปร้อนอีกครั้งและเติมเชื้อเงินเฟ้อ","whys":["ถูกต้อง — อ่านทั้งทิศทางการเคลื่อนไหวและตำแหน่งเทียบเส้นศักยภาพได้ครบทั้งสองมิติ","ไม่ถูกต้อง — จุด A อยู่หลังจุดสูงสุด เส้นผลผลิตจริงกำลังลดลงแล้ว ไม่ใช่กำลังเพิ่มขึ้นในช่วงขยายตัว","ไม่ถูกต้อง — ทิศทางถูกแต่ตำแหน่งผิด ผลผลิตจริงยังอยู่เหนือเส้นศักยภาพ จึงยังไม่เกิดช่องว่างการหดตัว","ไม่ถูกต้อง — จุดต่ำสุดคือจุดที่เส้นผลผลิตจริงอยู่ต่ำสุดและกำลังพลิกขึ้น ซึ่งไม่ตรงกับตำแหน่งของจุด A ในกราฟ"],"tip":"อ่านกราฟวัฏจักรต้องดูสองเรื่องเสมอ: กำลังขึ้นหรือลง (ระยะของวัฏจักร) และ อยู่เหนือหรือใต้เส้นศักยภาพ (ชนิดของช่องว่าง) — สองเรื่องนี้ไม่เหมือนกัน","fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n    <defs><clipPath id=\"clipCY\"><rect x=\"66\" y=\"24\" width=\"510\ var(--ink-2)\" text-anchor=\"middle\">จุดต่ำสุด</text><text x=\"114.4\" y=\"338\" font-size=\"11.5\" font-weight=\"600\" fill=\"var(--muted)\" text-anchor=\"middle\">ขยายตัว</text><line x1=\"86.6\" y1=\"325\" x2=\"142.2\" y2=\"325\" stroke=\"var(--line-2)\" stroke-width=\"1.4\"/><text x=\"198\" y=\"338\" font-size=\"11.5\" font-weight=\"600\" fill=\"var(--muted)\" text-anchor=\"middle\">หดตัว</text><line x1=\"148.2\" y1=\"325\" x2=\"247.79999999999998\" y2=\"325\" stroke=\"var(--line-2)\" stroke-width=\"1.4\"/><text x=\"303.6\" y=\"338\" font-size=\"11.5\" font-weight=\"600\" fill=\"var(--muted)\" text-anchor=\"middle\">ขยายตัว</text><line x1=\"253.79999999999998\" y1=\"325\" x2=\"353.40000000000003\" y2=\"325\" stroke=\"var(--line-2)\" stroke-width=\"1.4\"/><text x=\"409.2\" y=\"338\" font-size=\"11.5\" font-weight=\"600\" fill=\"var(--muted)\" text-anchor=\"middle\">หดตัว</text><line x1=\"359.40000000000003\" y1=\"325\" x2=\"459\" y2=\"325\" stroke=\"var(--line-2)\" stroke-width=\"1.4\"/><text x=\"180.6\" y=\"308\" font-size=\"13\" font-weight=\"700\" fill=\"var(--warn)\" text-anchor=\"start\">จุด A</text>\n  </svg><div class=\"figcap\">จุด A อยู่ในช่วงที่ผลผลิตจริงกำลังลดลงและอยู่เหนือเส้นศักยภาพ</div></div>"},{"id":"C12","type":"mcq","lvl":3,"topic":"AD-AS","ref":"การว่างงานตามวัฏจักรตลอดช่วงต่าง ๆ","q":"ตลอดหนึ่งรอบวัฏจักรธุรกิจ อัตราการว่างงานเคลื่อนไหวอย่างไรเมื่อเทียบกับอัตราธรรมชาติ และเพราะเหตุใด","choices":["ช่วงขยายตัวอัตราการว่างงานลดลงจนต่ำกว่าอัตราธรรมชาติใกล้จุดสูงสุด · ช่วงหดตัวอัตราการว่างงานเพิ่มขึ้นจนสูงกว่าอัตราธรรมชาติใกล้จุดต่ำสุด · ส่วนต่างนั้นคือการว่างงานตามวัฏจักร","อัตราการว่างงานคงที่เท่ากับอัตราธรรมชาติตลอดทั้งวัฏจักร เพราะอัตราธรรมชาติถูกนิยามให้เป็นค่าเฉลี่ยของอัตราการว่างงานจริงในระยะยาว จึงไม่มีทางที่ทั้งสองค่าจะแตกต่างกันได้","ช่วงขยายตัวอัตราการว่างงานเพิ่มขึ้นเพราะมีคนเข้าสู่กำลังแรงงานมากขึ้นตามโอกาสที่ดีขึ้น · ช่วงหดตัวอัตราการว่างงานลดลงเพราะคนท้อแท้ถอนตัวออกจากกำลังแรงงานไปเป็นจำนวนมาก","อัตราการว่างงานเคลื่อนไหวไปในทิศทางเดียวกับผลผลิตที่แท้จริงตลอดทั้งวัฏจักร คือเพิ่มขึ้นเมื่อเศรษฐกิจขยายตัวและลดลงเมื่อเศรษฐกิจหดตัว ตามความสัมพันธ์ระหว่างการผลิตกับการจ้างงาน"],"answer":0,"a":"อัตราการว่างงานเคลื่อนไหวสวนทางกับผลผลิตตลอดวัฏจักร\nช่วงขยายตัว — ผลผลิตเพิ่ม บริษัทต้องการแรงงานมากขึ้น อัตราการว่างงานลดลงเรื่อย ๆ และเมื่อเข้าใกล้จุดสูงสุด ผลผลิตแซงศักยภาพ อัตราการว่างงานจึงต่ำกว่าอัตราธรรมชาติ ตลาดแรงงานตึงตัวจนบริษัทแย่งคนกัน\nช่วงหดตัว — ผลผลิตลดลง บริษัทลดชั่วโมงทำงานแล้วเลิกจ้าง อัตราการว่างงานเพิ่มขึ้น และเมื่อเข้าใกล้จุดต่ำสุด อัตราการว่างงานจะสูงกว่าอัตราธรรมชาติอย่างชัดเจน\nส่วนต่างคือหัวใจ — ระยะห่างระหว่างอัตราการว่างงานจริงกับอัตราธรรมชาติ ณ เวลาใด ๆ คือการว่างงานตามวัฏจักร ซึ่งเป็นส่วนที่นโยบายด้านอุปสงค์จัดการได้ ส่วนอัตราธรรมชาติเองเป็นปัญหาเชิงโครงสร้างที่ต้องใช้นโยบายด้านอุปทาน\nที่สำคัญคืออัตราการว่างงานเป็นตัวชี้วัดตามหลัง จึงขยับช้ากว่าผลผลิตเสมอ","whys":["ถูกต้อง — อธิบายการเคลื่อนไหวตลอดวัฏจักรและนิยามการว่างงานตามวัฏจักรว่าคือส่วนต่างจากอัตราธรรมชาติ","ไม่ถูกต้อง — อัตราธรรมชาติเป็นระดับที่การว่างงานจะกลับไปหาในภาวะปกติ ไม่ใช่ค่าที่ตรึงอัตราจริงไว้ตลอดเวลา","ไม่ถูกต้อง — สลับทิศทางทั้งหมด ช่วงขยายตัวอัตราการว่างงานลดลง ส่วนช่วงหดตัวเพิ่มขึ้น ตามความต้องการแรงงานของธุรกิจ","ไม่ถูกต้อง — อัตราการว่างงานเคลื่อนไหวสวนทางกับผลผลิต เมื่อผลิตมากขึ้นต้องจ้างคนมากขึ้น การว่างงานจึงลดลง"]},{"id":"C13","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ฐานะการคลังที่แกว่งตามวัฏจักร","q":"นักการเมืองคนหนึ่งอ้างว่ารัฐบาลชุดปัจจุบันบริหารการคลังเก่งกว่าชุดก่อน เพราะงบประมาณเกินดุลในปีนี้ ขณะที่ชุดก่อนขาดดุล โดยไม่ได้กล่าวถึงภาวะเศรษฐกิจในแต่ละช่วง ข้อใดประเมินข้ออ้างนี้ได้ถูกต้อง","choices":["ข้ออ้างนี้อ่อนมาก เพราะงบประมาณแกว่งตามวัฏจักรเองผ่านตัวรักษาเสถียรภาพอัตโนมัติ ต้องดูดุลการคลังเชิงโครงสร้างที่ปรับผลของวัฏจักรออกแล้วจึงจะเปรียบเทียบฝีมือได้อย่างเป็นธรรม","ข้ออ้างนี้ถูกต้องสมบูรณ์ เพราะดุลงบประมาณเป็นตัวชี้วัดโดยตรงของความสามารถในการบริหารการคลัง รัฐบาลที่ทำให้งบประมาณเกินดุลได้ย่อมมีวินัยทางการคลังที่ดีกว่าอย่างไม่ต้องสงสัย","ข้ออ้างนี้ผิดโดยสิ้นเชิง เพราะงบประมาณเกินดุลเป็นสัญญาณที่ไม่ดีเสมอ แสดงว่ารัฐบาลเก็บภาษีมากเกินไปและใช้จ่ายน้อยเกินไป ซึ่งฉุดอุปสงค์มวลรวมและทำร้ายเศรษฐกิจในทุกสถานการณ์","ข้ออ้างนี้ประเมินไม่ได้เลย เพราะดุลงบประมาณของรัฐบาลไม่มีความเกี่ยวข้องใด ๆ กับภาวะเศรษฐกิจมหภาค ทั้งสองเรื่องเป็นคนละระบบที่ไม่ส่งผลกระทบต่อกันในทางใดทางหนึ่ง"],"answer":0,"a":"ดุลงบประมาณที่เห็นในรายงาน (headline balance) ประกอบด้วยสองส่วน\nส่วนที่หนึ่ง องค์ประกอบตามวัฏจักร — ในช่วงเศรษฐกิจดี รายได้ภาษีพุ่งเองและรายจ่ายสวัสดิการหดเอง งบประมาณจึงดูดีขึ้นโดยที่รัฐบาลไม่ได้ทำอะไรเลย และกลับด้านในช่วงเศรษฐกิจแย่\nส่วนที่สอง องค์ประกอบเชิงโครงสร้าง — คือดุลที่จะเกิดขึ้นถ้าเศรษฐกิจอยู่ที่ระดับศักยภาพพอดี ส่วนนี้ต่างหากที่สะท้อนการตัดสินใจเชิงนโยบายของรัฐบาล\nการเปรียบเทียบที่เป็นธรรม — ต้องดูดุลการคลังเชิงโครงสร้าง รัฐบาลที่เกินดุลในช่วงเศรษฐกิจบูมอาจมีวินัยแย่กว่ารัฐบาลที่ขาดดุลในช่วงวิกฤตด้วยซ้ำ\nยิ่งไปกว่านั้น การพยายามทำงบประมาณให้สมดุลทุกปีเป็นนโยบายตามวัฏจักรที่อันตราย เพราะจะบังคับให้รัฐตัดรายจ่ายในช่วงที่เศรษฐกิจกำลังแย่ ซึ่งซ้ำเติมการหดตัวให้ลึกขึ้น","whys":["ถูกต้อง — แยกองค์ประกอบตามวัฏจักรออกจากองค์ประกอบเชิงโครงสร้าง ซึ่งเป็นวิธีเปรียบเทียบที่ถูกต้องทางวิชาการ","ไม่ถูกต้อง — ดุลงบประมาณที่เห็นถูกบิดเบือนโดยภาวะเศรษฐกิจอย่างมาก จึงไม่ใช่ตัวชี้วัดฝีมือการบริหารโดยตรง","ไม่ถูกต้อง — งบประมาณเกินดุลไม่ได้เป็นสัญญาณที่ไม่ดีเสมอไป ในช่วงเศรษฐกิจร้อนแรงมันคือนโยบายที่เหมาะสมด้วยซ้ำ","ไม่ถูกต้อง — ดุลงบประมาณกับภาวะเศรษฐกิจเชื่อมโยงกันสองทาง ทั้งผ่านตัวรักษาเสถียรภาพและผ่านผลของนโยบายการคลังต่อ AD"],"tip":"ศัพท์ที่ควรรู้: ดุลการคลังเชิงโครงสร้าง (structural balance) คือดุลที่ปรับผลของวัฏจักรออกแล้ว — เป็นตัวเดียวที่ใช้ตัดสินเจตนาเชิงนโยบายได้"},{"id":"C14","type":"mcq","lvl":4,"topic":"AD-AS","ref":"การหดตัวจากฝั่งอุปสงค์เทียบกับฝั่งอุปทาน","q":"เศรษฐกิจไทยขยายตัว ผลผลิตและรายได้ภายในประเทศ (Y) เพิ่มขึ้น โดยปัจจัยอื่นคงเดิม ข้อใดอธิบายผลต่ออัตราแลกเปลี่ยนตามกลไกของตลาดเงินตราได้ถูกต้อง","choices":["กรณี ก เป็นการหดตัวจากฝั่งอุปสงค์ ซึ่งนโยบายกระตุ้นแก้ได้ตรงจุดและความเสี่ยงเงินเฟ้อต่ำ · กรณี ข เป็นการหดตัวจากฝั่งอุปทาน ซึ่งการกระตุ้นจะซ้ำเติมเงินเฟ้อ ต้องพึ่งนโยบายด้านอุปทาน","กรณี ก เป็นการหดตัวจากฝั่งอุปทานเพราะเงินเฟ้อชะลอลงแสดงว่าต้นทุนการผลิตลดลง · กรณี ข เป็นการหดตัวจากฝั่งอุปสงค์เพราะเงินเฟ้อที่เร่งตัวแสดงว่าประชาชนยังใช้จ่ายมากอยู่ตามปกติ","ทั้งสองกรณีเป็นการหดตัวจากฝั่งอุปสงค์เหมือนกัน เพราะผลผลิตที่ลดลงเป็นลายเซ็นของอุปสงค์ที่อ่อนแอเสมอ · ทั้งสองกรณีจึงควรใช้นโยบายกระตุ้นขนาดใหญ่โดยไม่ต้องกังวลเรื่องเงินเฟ้อเลย","ทั้งสองกรณีต้องใช้นโยบายการเงินแบบเข้มงวดเหมือนกัน เพราะเมื่อผลผลิตลดลงแล้วสิ่งสำคัญที่สุดคือการรักษาเสถียรภาพของราคาไว้ก่อน จากนั้นผลผลิตจะฟื้นตัวกลับมาได้เองในภายหลัง"],"answer":0,"a":"กุญแจคือดูทิศทางของเงินเฟ้อควบคู่กับผลผลิตเสมอ\nกรณี ก ผลผลิตลง เงินเฟ้อชะลอ — P กับ Y เคลื่อนไปทางเดียวกัน จึงเป็นช็อกด้านอุปสงค์ คือ AD เลื่อนซ้าย เศรษฐกิจมีทรัพยากรว่างอยู่มาก การกระตุ้นจึงถูกดูดซับด้วยปริมาณเป็นหลักก่อนจะไปกดดันราคา ความเสี่ยงเงินเฟ้อต่ำ นโยบายด้านอุปสงค์แก้ได้ตรงจุด\nกรณี ข ผลผลิตลง เงินเฟ้อเร่ง — P กับ Y เคลื่อนไปคนละทาง จึงเป็นช็อกด้านอุปทาน คือ SRAS เลื่อนขึ้น ในกรณีนี้การกระตุ้น AD จะยิ่งเติมเชื้อเงินเฟ้อโดยแลกมาด้วยผลผลิตเพียงชั่วคราว ทางออกที่แท้จริงคือนโยบายด้านอุปทานที่ลดต้นทุน\nบทเรียน — ผลผลิตที่ลดลงเหมือนกันแต่ต้นเหตุต่างกัน จึงต้องใช้ยาคนละขนาน การวินิจฉัยผิดจะทำให้ใช้เครื่องมือผิดและซ้ำเติมปัญหา","whys":["ถูกต้อง — วินิจฉัยด้วยทิศทางของเงินเฟ้อควบคู่ผลผลิต และจับคู่เครื่องมือกับต้นเหตุได้ถูกทั้งสองกรณี","ไม่ถูกต้อง — สลับกันทั้งคู่ เงินเฟ้อที่ชะลอพร้อมผลผลิตที่ลดคือลายเซ็นของอุปสงค์ที่อ่อน ส่วนเงินเฟ้อที่เร่งพร้อมผลผลิตที่ลดคือลายเซ็นของต้นทุน","ไม่ถูกต้อง — ผลผลิตที่ลดลงเกิดได้จากทั้งสองฝั่ง การดูเฉพาะผลผลิตโดยไม่ดูเงินเฟ้อจึงวินิจฉัยต้นเหตุไม่ได้","ไม่ถูกต้อง — ในกรณี ก การใช้นโยบายเข้มงวดจะซ้ำเติมการหดตัวโดยไม่จำเป็น เพราะไม่มีแรงกดดันเงินเฟ้ออยู่แล้ว"],"tip":"เจอโจทย์ “เศรษฐกิจหดตัว” อย่าเพิ่งตอบว่าให้กระตุ้น — ให้ดูเงินเฟ้อก่อนว่าชะลอ (ด้านอุปสงค์) หรือเร่ง (ด้านอุปทาน)"},{"id":"C15","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ความเชื่อมโยงของวัฏจักรระหว่างประเทศ","q":"เมื่อประเทศเศรษฐกิจขนาดใหญ่ของโลกเข้าสู่ภาวะถดถอย มักพบว่าประเทศคู่ค้าเข้าสู่ภาวะถดถอยตามในเวลาไม่นาน ข้อใดอธิบายช่องทางการส่งผ่านนี้ได้ครบถ้วนที่สุด","choices":["ส่งผ่านทางการค้าเมื่อคำสั่งซื้อสินค้าส่งออกหดตัวทำให้ NX ลดลง · ทางการเงินเมื่อตลาดทุนผันผวนและสินเชื่อตึงตัว · และทางความเชื่อมั่นเมื่อธุรกิจกับครัวเรือนทั่วโลกชะลอการใช้จ่ายพร้อมกัน","ส่งผ่านทางการค้าเพียงช่องทางเดียวเท่านั้น เพราะการส่งออกเป็นความเชื่อมโยงเดียวระหว่างเศรษฐกิจของสองประเทศ ส่วนตลาดการเงินและความเชื่อมั่นเป็นเรื่องภายในของแต่ละประเทศโดยเฉพาะ","ไม่มีการส่งผ่านใด ๆ เกิดขึ้นจริง เพราะแต่ละประเทศมีวัฏจักรธุรกิจของตนเองที่ถูกกำหนดโดยปัจจัยภายในประเทศเท่านั้น ความบังเอิญที่เกิดพร้อมกันเป็นเพียงเรื่องของสถิติที่ไม่มีสาเหตุร่วมกัน","ส่งผ่านผ่านอัตราแลกเปลี่ยนเพียงช่องทางเดียว โดยเมื่อประเทศใหญ่ถดถอย ค่าเงินของประเทศคู่ค้าจะแข็งค่าขึ้นจนการส่งออกหดตัว ซึ่งเป็นกลไกเดียวที่ทำให้วัฏจักรเชื่อมโยงกันข้ามพรมแดน"],"answer":0,"a":"วัฏจักรธุรกิจในโลกปัจจุบันเคลื่อนไหวสอดคล้องกันสูง ผ่านสามช่องทางหลัก\nช่องทางการค้า — เมื่อประเทศใหญ่ถดถอย รายได้ของผู้บริโภคที่นั่นลดลง คำสั่งซื้อสินค้านำเข้าหดตัว การส่งออกของประเทศคู่ค้าจึงลดลง NX ลด AD เลื่อนซ้าย ยิ่งประเทศพึ่งพาการส่งออกมาก ผลกระทบยิ่งรุนแรง\nช่องทางการเงิน — ตลาดทุนเชื่อมโยงกันทั่วโลก เมื่อเกิดความปั่นป่วน นักลงทุนถอนเงินจากสินทรัพย์เสี่ยงกลับไปหาสินทรัพย์ปลอดภัย สภาพคล่องตึงตัว ธนาคารเข้มงวดการปล่อยกู้ การลงทุนจึงหดตัวตาม\nช่องทางความเชื่อมั่น — ข่าวสารเดินทางทันที เมื่อเห็นเศรษฐกิจใหญ่ทรุด ธุรกิจและครัวเรือนทั่วโลกชะลอการลงทุนและการบริโภคพร้อมกัน โดยที่ผลกระทบทางการค้ายังมาไม่ถึงด้วยซ้ำ\nสามช่องทางนี้เสริมกันและทำให้ภาวะถดถอยแพร่กระจายได้เร็วกว่าที่ช่องทางการค้าเพียงอย่างเดียวจะอธิบายได้","whys":["ถูกต้อง — ครอบคลุมทั้งสามช่องทางหลักที่ทำให้วัฏจักรธุรกิจของแต่ละประเทศเคลื่อนไหวสอดคล้องกัน","ไม่ถูกต้อง — ตลาดการเงินโลกเชื่อมโยงกันสูงมาก และความเชื่อมั่นก็แพร่กระจายข้ามพรมแดนได้เร็วกว่าการค้าเสียอีก","ไม่ถูกต้อง — ข้อมูลเชิงประจักษ์แสดงชัดว่าวัฏจักรของประเทศที่เชื่อมโยงกันทางการค้าและการเงินเคลื่อนไหวสอดคล้องกันสูง","ไม่ถูกต้อง — อัตราแลกเปลี่ยนเป็นหนึ่งในกลไกที่เกี่ยวข้อง แต่ไม่ใช่ช่องทางเดียว และไม่ใช่ช่องทางที่สำคัญที่สุดด้วย"]},{"id":"C16","type":"mcq","lvl":4,"topic":"AD-AS","ref":"นโยบายสวนวัฏจักรเทียบกับตามวัฏจักร","q":"รัฐบาลประเทศหนึ่งมีกฎหมายบังคับให้ต้องทำงบประมาณสมดุลทุกปี เมื่อเศรษฐกิจเข้าสู่ภาวะถดถอย รายได้ภาษีลดลง รัฐบาลจึงต้องตัดรายจ่ายลงตามเพื่อรักษาสมดุล ข้อใดประเมินผลของกฎนี้ได้ถูกต้อง","choices":["กฎนี้บังคับให้รัฐดำเนินนโยบายตามวัฏจักร คือตัดรายจ่ายตอนที่เศรษฐกิจกำลังแย่ ซึ่งซ้ำเติมการหดตัวให้ลึกขึ้น และยังทำลายการทำงานของตัวรักษาเสถียรภาพอัตโนมัติไปพร้อมกัน","กฎนี้เป็นนโยบายสวนวัฏจักรที่ดี เพราะการรักษาวินัยทางการคลังในช่วงวิกฤตจะสร้างความเชื่อมั่นให้นักลงทุนต่างชาติ ซึ่งจะทำให้เงินทุนไหลเข้าและเศรษฐกิจฟื้นตัวได้เร็วกว่าการก่อหนี้เพิ่ม","กฎนี้ไม่มีผลต่อวัฏจักรธุรกิจเลย เพราะรายจ่ายภาครัฐเป็นเพียงส่วนน้อยของ GDP และการตัดรายจ่ายจะถูกชดเชยด้วยการใช้จ่ายของภาคเอกชนที่เพิ่มขึ้นในสัดส่วนที่เท่ากันพอดีเสมอ","กฎนี้ช่วยลดความผันผวนของวัฏจักรได้ดีที่สุด เพราะการที่งบประมาณสมดุลทุกปีทำให้ภาครัฐไม่เป็นแหล่งของความผันผวนเพิ่มเติมในระบบเศรษฐกิจ วัฏจักรจึงราบเรียบกว่าที่ควรจะเป็น"],"answer":0,"a":"ต้องแยกสองแนวคิดให้ชัด\nนโยบายสวนวัฏจักร (countercyclical) — กระตุ้นตอนเศรษฐกิจแย่ เบรกตอนเศรษฐกิจร้อน ซึ่งช่วยลดความผันผวน\nนโยบายตามวัฏจักร (procyclical) — ตัดรายจ่ายตอนแย่ ใช้จ่ายมากตอนดี ซึ่งขยายความผันผวน\nกฎงบประมาณสมดุลทุกปีบังคับให้รัฐทำแบบหลัง เมื่อเศรษฐกิจถดถอย รายได้ภาษีลดลงเอง รัฐจึงต้องตัดรายจ่ายตาม ซึ่งหมายถึง G ที่ลดลงในจังหวะที่ AD กำลังอ่อนแออยู่แล้ว เส้น AD จึงถูกดันซ้ายซ้ำเข้าไปอีก การหดตัวลึกขึ้น\nยิ่งไปกว่านั้น กฎนี้ยังทำลายตัวรักษาเสถียรภาพอัตโนมัติซึ่งเป็นกลไกที่ควรจะช่วยพยุงเศรษฐกิจโดยอัตโนมัติผ่านการขาดดุลชั่วคราว\nนี่คือเหตุผลที่นักเศรษฐศาสตร์ส่วนใหญ่สนับสนุนให้ดูดุลการคลังตลอดวัฏจักรแทนที่จะบังคับให้สมดุลทุกปี","whys":["ถูกต้อง — ระบุว่ากฎนี้บังคับให้เป็นนโยบายตามวัฏจักร และชี้ผลเสียซ้ำซ้อนที่ทำลายตัวรักษาเสถียรภาพอัตโนมัติด้วย","ไม่ถูกต้อง — นโยบายสวนวัฏจักรคือการกระตุ้นตอนเศรษฐกิจแย่ การตัดรายจ่ายในภาวะถดถอยจึงเป็นสิ่งตรงข้ามอย่างชัดเจน","ไม่ถูกต้อง — รายจ่ายภาครัฐเป็นองค์ประกอบสำคัญของ AD และไม่มีกลไกใดรับประกันว่าภาคเอกชนจะใช้จ่ายชดเชยให้พอดี","ไม่ถูกต้อง — กฎนี้ทำให้ภาครัฐกลายเป็นแหล่งของความผันผวนเพิ่มเติม เพราะบังคับให้ตัดรายจ่ายในจังหวะที่แย่ที่สุด"],"tip":"จำคู่ตรงข้าม: สวนวัฏจักร = ลดความผันผวน (ดี) · ตามวัฏจักร = ขยายความผันผวน (แย่) — กฎงบสมดุลทุกปีบังคับให้เป็นแบบหลัง"},{"id":"C17","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ฟองสบู่สินทรัพย์กับวัฏจักร","q":"ราคาอสังหาริมทรัพย์พุ่งขึ้นต่อเนื่องหลายปีจนสูงกว่าปัจจัยพื้นฐานมาก ครัวเรือนกู้เงินมาซื้อบ้านเก็งกำไรและใช้จ่ายมากขึ้นตามความมั่งคั่งที่เพิ่ม จากนั้นราคาก็ดิ่งลงอย่างรุนแรง ข้อใดอธิบายผลต่อวัฏจักรได้ถูกต้องที่สุด","choices":["ช่วงราคาขึ้น AD ถูกดันขวาจากความมั่งคั่งและสินเชื่อที่ขยายตัว เร่งการขยายตัวให้เกินศักยภาพ · ช่วงราคาดิ่ง ความมั่งคั่งหายไปและครัวเรือนเร่งชำระหนี้ AD หดแรง ทำให้การหดตัวลึกและยาวกว่าปกติ","ราคาสินทรัพย์ที่ผันผวนไม่กระทบวัฏจักรธุรกิจเลย เพราะการซื้อขายสินทรัพย์ที่มีอยู่แล้วเป็นเพียงการโอนความเป็นเจ้าของระหว่างบุคคล ซึ่งไม่ถูกนับเป็นการผลิตในบัญชีรายได้ประชาชาติ","ช่วงราคาขึ้น AD หดตัวเพราะครัวเรือนต้องเก็บเงินเพื่อซื้อบ้านที่แพงขึ้น · ช่วงราคาดิ่ง AD ขยายตัวเพราะบ้านถูกลงทำให้ครัวเรือนเหลือเงินไปใช้จ่ายด้านอื่นมากขึ้นกว่าเดิมอย่างมีนัยสำคัญ","ราคาสินทรัพย์ที่พุ่งขึ้นทำให้เส้น LRAS เลื่อนขวาเพราะความมั่งคั่งของประเทศเพิ่มขึ้นจริง · และเมื่อราคาดิ่งลง LRAS ก็เลื่อนซ้ายกลับมาที่เดิม ส่วนเส้น AD ไม่ได้รับผลกระทบใด ๆ เลย"],"answer":0,"a":"ฟองสบู่สินทรัพย์เป็นตัวขยายความผันผวนของวัฏจักรที่ทรงพลังที่สุดตัวหนึ่ง ผ่านสองช่องทางที่เสริมกัน\nขาขึ้น\n· ช่องทางความมั่งคั่ง — เจ้าของบ้านรู้สึกรวยขึ้นจึงใช้จ่ายมากขึ้น C เพิ่ม\n· ช่องทางหลักประกัน — บ้านที่ราคาสูงขึ้นใช้เป็นหลักประกันกู้เงินได้มากขึ้น สินเชื่อขยายตัว การใช้จ่ายเพิ่มอีก\nทั้งสองดัน AD ไปขวา เร่งการขยายตัวจนอาจเกินศักยภาพ\nขาลง\n· ความมั่งคั่งหายไปทันที C หดตัว\n· ครัวเรือนที่มีหนี้สูงกว่ามูลค่าบ้านเร่งชำระหนี้แทนการใช้จ่าย\n· ธนาคารที่ถือหลักประกันด้อยค่าเข้มงวดการปล่อยกู้ สินเชื่อตึงตัว\nทั้งหมดดัน AD ไปซ้ายอย่างรุนแรง\nสิ่งที่ทำให้อันตรายเป็นพิเศษ — ในภาวะนี้นโยบายการเงินอ่อนแรงลงมาก เพราะคนที่ตั้งใจลดหนี้จะไม่กู้เพิ่มแม้ดอกเบี้ยจะต่ำ การหดตัวจึงลึกและยาวกว่าภาวะถดถอยปกติ","whys":["ถูกต้อง — อธิบายทั้งช่องทางความมั่งคั่งและช่องทางสินเชื่อ ทั้งขาขึ้นและขาลง พร้อมเหตุผลว่าทำไมการหดตัวจึงลึกกว่าปกติ","ไม่ถูกต้อง — แม้การซื้อขายสินทรัพย์เดิมจะไม่นับใน GDP โดยตรง แต่ราคาสินทรัพย์กระทบความมั่งคั่งและความสามารถในการกู้ซึ่งเปลี่ยนการใช้จ่ายจริง","ไม่ถูกต้อง — สลับทิศทางทั้งสองช่วง ราคาสินทรัพย์ที่สูงขึ้นทำให้เจ้าของรู้สึกรวยขึ้นและใช้จ่ายมากขึ้น ไม่ใช่รัดเข็มขัด","ไม่ถูกต้อง — มูลค่าที่ประเมินสูงขึ้นไม่ได้แปลว่ามีบ้านหรือเครื่องจักรเพิ่มขึ้นจริง ทุนทางกายภาพเท่าเดิม LRAS จึงไม่ขยับ"]},{"id":"C18","type":"mcq","lvl":2,"topic":"AD-AS","ref":"รูปแบบของการฟื้นตัวหลังภาวะถดถอย","q":"นักวิเคราะห์มักเรียกรูปแบบการฟื้นตัวตามรูปร่างของเส้นผลผลิต ข้อใดอธิบายความหมายและเงื่อนไขที่ทำให้เกิดแต่ละรูปแบบได้ถูกต้อง","choices":["การฟื้นตัวรูปตัววีคือหดตัวแรงแล้วกลับเร็ว มักเกิดเมื่อสาเหตุเป็นช็อกชั่วคราวที่ผ่านไป · รูปตัวแอลคือหดตัวแล้วค้างต่ำยาวนาน มักเกิดเมื่อระบบการเงินเสียหายหรือศักยภาพถูกทำลายถาวร","การฟื้นตัวรูปตัววีคือหดตัวแล้วค้างต่ำเป็นเวลานาน ซึ่งเกิดจากการที่รัฐบาลกระตุ้นเศรษฐกิจมากเกินไป · รูปตัวแอลคือการฟื้นตัวที่รวดเร็วที่สุดเพราะปล่อยให้กลไกตลาดทำงานเองอย่างเต็มที่","รูปแบบการฟื้นตัวถูกกำหนดโดยขนาดของมาตรการกระตุ้นเพียงอย่างเดียว ยิ่งรัฐบาลใช้เงินมากเท่าไรการฟื้นตัวก็จะยิ่งเป็นรูปตัววีมากเท่านั้นโดยไม่ขึ้นกับสาเหตุของการหดตัวเลย","รูปแบบการฟื้นตัวไม่มีความหมายทางเศรษฐศาสตร์ เป็นเพียงคำเรียกที่สื่อมวลชนสร้างขึ้นเพื่อความสะดวกในการรายงานข่าว โดยไม่มีความสัมพันธ์กับกลไกทางเศรษฐกิจใด ๆ ทั้งสิ้น"],"answer":0,"a":"รูปร่างของการฟื้นตัวสะท้อนธรรมชาติของสาเหตุที่ทำให้หดตัว\nรูปตัววี — หดตัวแรงและเร็ว แล้วฟื้นกลับเร็วพอ ๆ กัน มักเกิดเมื่อสาเหตุเป็นช็อกชั่วคราวที่ผ่านพ้นไป เช่น ภัยธรรมชาติหรือมาตรการปิดเมืองชั่วคราว โดยที่โครงสร้างการผลิตไม่เสียหาย โรงงานยังอยู่ แรงงานยังมี พอข้อจำกัดหมดไปก็กลับมาผลิตได้ทันที\nรูปตัวยู — หดตัวแล้วค้างอยู่สักพักก่อนจะค่อย ๆ ฟื้น มักเกิดเมื่อต้องใช้เวลาระบายสินค้าคงคลัง ซ่อมงบดุลของธุรกิจ หรือรอความเชื่อมั่นกลับคืนมา\nรูปตัวแอล — หดตัวแล้วค้างต่ำยาวนาน ไม่กลับสู่แนวโน้มเดิม มักเกิดเมื่อระบบการเงินเสียหายหนักจนสินเชื่อไม่ทำงาน หรือเมื่อเกิด hysteresis ที่ทักษะแรงงานเสื่อมและทุนถูกทำลาย ทำให้ LRAS เลื่อนซ้ายจริง\nการวินิจฉัยว่าน่าจะเป็นรูปแบบใดจึงสำคัญต่อการเลือกขนาดและระยะเวลาของมาตรการ","whys":["ถูกต้อง — จับคู่รูปร่างของการฟื้นตัวกับธรรมชาติของสาเหตุได้ถูกต้องทั้งกรณีช็อกชั่วคราวและกรณีที่ศักยภาพเสียหาย","ไม่ถูกต้อง — สลับความหมายของสองรูปแบบ รูปตัววีคือการฟื้นตัวที่เร็ว ส่วนรูปตัวแอลคือการค้างอยู่ในระดับต่ำเป็นเวลานาน","ไม่ถูกต้อง — ขนาดของมาตรการมีผลอยู่บ้าง แต่สาเหตุของการหดตัวเป็นตัวกำหนดหลัก หากศักยภาพถูกทำลาย เงินมากแค่ไหนก็ไม่ทำให้เป็นรูปตัววีได้","ไม่ถูกต้อง — รูปร่างของการฟื้นตัวสะท้อนกลไกทางเศรษฐกิจที่แตกต่างกันจริง และมีนัยสำคัญต่อการออกแบบนโยบาย"]},{"id":"C19","type":"mcq","lvl":4,"topic":"AD-AS","ref":"การขยายตัวที่ไม่สร้างแรงกดดันเงินเฟ้อ","q":"เศรษฐกิจขยายตัว 6% ต่อปีติดต่อกันห้าปี โดยที่อัตราเงินเฟ้ออยู่ในระดับต่ำและมีเสถียรภาพตลอดช่วงเวลาดังกล่าว ข้อใดอธิบายปรากฏการณ์นี้ได้ถูกต้องที่สุด","choices":["ผลผลิตศักยภาพต้องขยายตัวในอัตราใกล้เคียง 6% ด้วย จากการสะสมทุน การเพิ่มขึ้นของกำลังแรงงาน และผลิตภาพที่สูงขึ้น ทำให้ LRAS เลื่อนขวาตาม AD ช่องว่างผลผลิตจึงไม่เปิด","เศรษฐกิจต้องอยู่ในช่องว่างเงินเฟ้อที่ถ่างกว้างขึ้นทุกปี เพียงแต่แรงกดดันด้านราคายังไม่ปรากฏเพราะการคาดการณ์เงินเฟ้อของประชาชนยังไม่ปรับตัว ซึ่งเป็นภาวะที่ไม่ยั่งยืนอย่างยิ่ง","ธนาคารกลางต้องใช้นโยบายการเงินแบบเข้มงวดอย่างต่อเนื่องตลอดห้าปีเพื่อกดเงินเฟ้อไว้ ซึ่งหมายความว่าผลผลิตที่แท้จริงถูกกดให้ต่ำกว่าศักยภาพมาตลอดแม้ตัวเลขการเติบโตจะดูสูงก็ตาม","เป็นไปไม่ได้ในทางทฤษฎี เพราะการขยายตัวในอัตราสูงย่อมทำให้เกิดเงินเฟ้อเสมอตามความสัมพันธ์ระหว่างผลผลิตกับระดับราคา ข้อมูลที่ให้มาจึงต้องมีความคลาดเคลื่อนในการวัด"],"answer":0,"a":"กุญแจอยู่ที่ว่าเงินเฟ้อเกิดจากช่องว่างผลผลิต ไม่ใช่จากอัตราการเติบโตโดยตัวมันเอง\nเมื่อ AD ขยายตัว 6% ต่อปี หากผลผลิตศักยภาพ (LRAS) ขยายตัวในอัตราใกล้เคียงกันด้วย ผลผลิตจริงจะวิ่งไปตามเส้นศักยภาพพอดีช่องว่างผลผลิตไม่เปิด ตลาดแรงงานไม่ตึงเกินไป ค่าจ้างเติบโตตามผลิตภาพ ต้นทุนแรงงานต่อหน่วยจึงไม่เพิ่ม SRAS ไม่ถูกดันขึ้น และเงินเฟ้ออยู่ในระดับต่ำ\nสิ่งที่ทำให้ LRAS โตเร็วได้ — อัตราการลงทุนสูงทำให้สะสมทุนเร็ว กำลังแรงงานเพิ่มจากโครงสร้างประชากรหรือการมีส่วนร่วมที่สูงขึ้น และการดูดซับเทคโนโลยีจากต่างประเทศทำให้ผลิตภาพก้าวกระโดด\nนี่คือรูปแบบที่พบในประเทศที่เติบโตเร็วหลายประเทศในช่วงพัฒนา — การเติบโตสูงไม่จำเป็นต้องมาพร้อมเงินเฟ้อ ถ้าฝั่งอุปทานตามทัน","whys":["ถูกต้อง — อธิบายว่าเงินเฟ้อขึ้นกับช่องว่างผลผลิตไม่ใช่อัตราการเติบโต และระบุสิ่งที่ทำให้ LRAS ขยายตัวตามได้","ไม่ถูกต้อง — หากมีช่องว่างเงินเฟ้อถ่างขึ้นทุกปีติดต่อกันห้าปี แรงกดดันด้านราคาย่อมปรากฏชัดเจนแล้ว ไม่สามารถซ่อนไว้ได้นานขนาดนั้น","ไม่ถูกต้อง — หากถูกกดให้ต่ำกว่าศักยภาพมาตลอด อัตราการว่างงานจะสูงและการเติบโตจะไม่สูงถึง 6% ติดต่อกันได้","ไม่ถูกต้อง — ไม่มีความสัมพันธ์ตายตัวระหว่างอัตราการเติบโตกับเงินเฟ้อ สิ่งที่สำคัญคือการเติบโตนั้นเกินหรือไม่เกินศักยภาพ"],"tip":"ท่องประโยคนี้: เงินเฟ้อเกิดจากช่องว่างผลผลิต ไม่ใช่จากอัตราการเติบโต — โตเร็วแค่ไหนก็ไม่เฟ้อ ถ้าศักยภาพโตตามทัน"},{"id":"C20","type":"mcq","lvl":4,"topic":"AD-AS","ref":"วินิจฉัยผิดระหว่างปัญหาวัฏจักรกับปัญหาโครงสร้าง","q":"ธนาคารกลางเชื่อว่าการที่ผลผลิตต่ำกว่าแนวโน้มเดิมเป็นปัญหาวัฏจักร จึงกระตุ้นอย่างต่อเนื่อง แต่ความจริงคือผลผลิตศักยภาพได้ลดลงถาวรแล้วจากวิกฤตก่อนหน้า ข้อใดอธิบายผลที่จะเกิดขึ้น","choices":["การกระตุ้นจะดันผลผลิตเกินศักยภาพที่แท้จริงซึ่งต่ำลงแล้ว เกิดช่องว่างเงินเฟ้อโดยที่ผู้ดำเนินนโยบายไม่รู้ตัว เงินเฟ้อจะเร่งตัวขึ้นทั้งที่ผลผลิตยังดูต่ำกว่าแนวโน้มเดิมอยู่","การกระตุ้นจะดึงผลผลิตกลับไปที่แนวโน้มเดิมได้สำเร็จ เพราะการเพิ่มอุปสงค์อย่างต่อเนื่องจะจูงใจให้ภาคธุรกิจลงทุนขยายกำลังการผลิตจนศักยภาพที่หายไปกลับคืนมาได้ในที่สุด","การกระตุ้นจะไม่มีผลใด ๆ เลยทั้งต่อผลผลิตและระดับราคา เพราะเมื่อผลผลิตศักยภาพลดลงแล้ว เส้น LRAS ที่เป็นแนวตั้งจะตรึงผลผลิตไว้ไม่ให้เปลี่ยนแปลงตั้งแต่ระยะสั้น","การกระตุ้นจะทำให้เกิดภาวะเงินฝืด เพราะอุปสงค์ที่เพิ่มขึ้นจะกระตุ้นให้ผู้ผลิตแข่งขันกันผลิตมากขึ้นจนสินค้าล้นตลาดและระดับราคาลดลงต่อเนื่องตลอดช่วงที่มีการกระตุ้น"],"answer":0,"a":"นี่คือความผิดพลาดที่อันตรายที่สุดในทางปฏิบัติ — เข้าใจผิดว่าปัญหาโครงสร้างเป็นปัญหาวัฏจักร\nสิ่งที่ผู้ดำเนินนโยบายเห็น — ผลผลิตต่ำกว่าแนวโน้มเดิม จึงสรุปว่ายังมีช่องว่างการหดตัวเหลืออยู่และกระตุ้นต่อ\nสิ่งที่เป็นจริง — LRAS ได้เลื่อนซ้ายไปแล้วจากวิกฤตก่อนหน้า (ทักษะแรงงานเสื่อม ทุนถูกทำลาย ธุรกิจล้มหาย) ผลผลิตศักยภาพที่แท้จริงต่ำกว่าแนวโน้มเดิม\nผลที่ตามมา — การกระตุ้นดันผลผลิตเกิน Y_FE ที่แท้จริง เกิดช่องว่างเงินเฟ้อโดยที่ไม่มีใครรู้ตัว ตลาดแรงงานตึงตัว ค่าจ้างถูกดันขึ้น SRAS เลื่อนขึ้น เงินเฟ้อเร่งตัว\nสิ่งที่ทำให้สับสนหนัก — เงินเฟ้อเร่งตัวขึ้นทั้งที่ตัวเลขผลผลิตยังดู “ต่ำกว่าแนวโน้มเดิม” ซึ่งขัดกับสัญชาตญาณ และอาจทำให้ผู้ดำเนินนโยบายยิ่งสับสนและกระตุ้นซ้ำเข้าไปอีก\nทางแก้ที่แท้จริงคือนโยบายด้านอุปทานที่ฟื้นฟูศักยภาพ ไม่ใช่การเติมอุปสงค์","whys":["ถูกต้อง — อธิบายกลไกที่การวินิจฉัยผิดนำไปสู่ช่องว่างเงินเฟ้อที่มองไม่เห็น และเหตุผลที่ข้อมูลดูขัดแย้งกัน","ไม่ถูกต้อง — การเพิ่มอุปสงค์ไม่ได้คืนทักษะแรงงานที่เสื่อมไปหรือสร้างทุนที่ถูกทำลายขึ้นมาใหม่ ศักยภาพจึงไม่กลับคืนมาด้วยวิธีนี้","ไม่ถูกต้อง — LRAS กำหนดผลผลิตในระยะยาว ไม่ได้ตรึงผลผลิตระยะสั้น เศรษฐกิจจึงถูกดันเกินศักยภาพได้ชั่วคราว","ไม่ถูกต้อง — การกระตุ้นอุปสงค์เกินศักยภาพย่อมดันระดับราคาขึ้น ไม่ใช่ทำให้เกิดภาวะเงินฝืดอย่างที่ระบุ"],"tip":"คำถามที่ต้องถามก่อนกระตุ้นเสมอ: ผลผลิตต่ำเพราะอุปสงค์ไม่พอ หรือเพราะศักยภาพลดลงจริง — ตอบผิดแล้วยาจะกลายเป็นพิษ"},{"id":"C21","type":"mcq","lvl":4,"topic":"AD-AS","ref":"อ่านกราฟตำแหน่งใกล้จุดต่ำสุด","q":"จากแผนภาพ จุด B ถูกทำเครื่องหมายไว้บนเส้นผลผลิตจริง ข้อใดอธิบายสถานะและแนวทางนโยบายที่เหมาะสมได้ถูกต้องที่สุด","choices":["เศรษฐกิจผ่านจุดต่ำสุดมาแล้วและอยู่ในช่วงขยายตัวช่วงต้น แต่ผลผลิตยังต่ำกว่าเส้นศักยภาพ จึงยังมีช่องว่างการหดตัวเหลืออยู่ นโยบายกระตุ้นยังเหมาะสมแต่ควรเริ่มวางแผนถอนออกอย่างค่อยเป็นค่อยไป","เศรษฐกิจอยู่ในช่วงหดตัวที่กำลังดิ่งลงต่อเนื่อง ผลผลิตยังต่ำกว่าเส้นศักยภาพมาก จึงควรเร่งอัดฉีดมาตรการกระตุ้นขนาดใหญ่เพิ่มเติมทันทีเพื่อหยุดการดิ่งลงของเศรษฐกิจให้ได้โดยเร็ว พร้อมกับผ่อนคลายนโยบายการเงินลงอีกในเวลาเดียวกัน","เศรษฐกิจอยู่ในช่วงขยายตัวและผลผลิตได้แซงเส้นศักยภาพไปแล้ว จึงเกิดช่องว่างเงินเฟ้อ ควรใช้นโยบายหดตัวทันทีเพื่อป้องกันไม่ให้แรงกดดันด้านราคาก่อตัวขึ้นในระยะถัดไป","เศรษฐกิจอยู่ที่จุดสูงสุดของวัฏจักรพอดี ซึ่งเป็นจุดที่ผลผลิตหยุดเพิ่มและกำลังจะเริ่มลดลง จึงควรเตรียมมาตรการรับมือภาวะถดถอยที่กำลังจะมาถึงในไตรมาสถัดไปอย่างเร่งด่วน"],"answer":0,"a":"อ่านกราฟสองมิติเช่นเดิม\nมิติทิศทาง — จุด B อยู่หลังจุดต่ำสุด เส้นผลผลิตจริงกำลังเพิ่มขึ้น จึงอยู่ในช่วงขยายตัวช่วงต้น การฟื้นตัวเริ่มแล้ว\nมิติตำแหน่ง — แม้จะกำลังเพิ่มขึ้น แต่ผลผลิตจริงยังอยู่ใต้เส้นศักยภาพ จึงยังมีช่องว่างการหดตัวเหลืออยู่ อัตราการว่างงานยังสูงกว่าอัตราธรรมชาติ\nนัยเชิงนโยบาย — เนื่องจากยังมีช่องว่างเหลือ นโยบายกระตุ้นยังมีเหตุผลรองรับ และความเสี่ยงเงินเฟ้อยังต่ำเพราะมีทรัพยากรว่างอยู่ แต่เนื่องจากเศรษฐกิจกำลังฟื้นและนโยบายมีความล่าช้าในการออกฤทธิ์ ผู้ดำเนินนโยบายควรเริ่มวางแผนถอนออกอย่างค่อยเป็นค่อยไป มิฉะนั้นมาตรการที่ออกวันนี้อาจไปออกฤทธิ์ตอนที่เศรษฐกิจเลยศักยภาพไปแล้วและกลายเป็นตัวสร้างเงินเฟ้อ","whys":["ถูกต้อง — อ่านได้ทั้งสองมิติ และเสนอแนวทางที่คำนึงถึงความล่าช้าของนโยบายอย่างเหมาะสม","ไม่ถูกต้อง — จุด B อยู่หลังจุดต่ำสุดแล้ว เส้นผลผลิตกำลังเพิ่มขึ้นไม่ใช่ดิ่งลง การเร่งอัดฉีดเพิ่มอาจกลายเป็นการกระตุ้นเกินขนาด","ไม่ถูกต้อง — ผลผลิตจริงยังอยู่ใต้เส้นศักยภาพตามที่กราฟแสดง จึงยังไม่เกิดช่องว่างเงินเฟ้อ การใช้นโยบายหดตัวจะฉุดการฟื้นตัว","ไม่ถูกต้อง — จุดสูงสุดคือจุดที่ผลผลิตอยู่สูงสุดและกำลังพลิกลง ซึ่งไม่ตรงกับตำแหน่งของจุด B ที่กำลังไต่ขึ้นจากจุดต่ำสุด"],"fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n    <defs><clipPath id=\"clipCY\"><rect x=\"66\" y=\"24\" width=\"510\" height=\"300\"/></clipPath></defs>\n    <line x1=\"66\" y1=\"24\" x2=\"66\" y2=\"318\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n    <line x1=\"66\" y1=\"318\" x2=\"552\" y2=\"318\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n    <text x=\"62\" y=\"16\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"middle\">ผลผลิตที่แท้จริง</text>\n    <text x=\"546\" y=\"340\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"end\">เวลา</text>\n    <g clip-path=\"url(#clipCY)\"><path d=\"M66.0 245.2 L72.6 243.3 L79.2 241.3 L85.8 239.4 L92.4 237.5 L99.0 235.5 L105.6 233.6 L112.2 231.7 L118.8 229.7 L125.4 227.8 L132 ายตัว</text><line x1=\"253.79999999999998\" y1=\"325\" x2=\"353.40000000000003\" y2=\"325\" stroke=\"var(--line-2)\" stroke-width=\"1.4\"/><text x=\"409.2\" y=\"338\" font-size=\"11.5\" font-weight=\"600\" fill=\"var(--muted)\" text-anchor=\"middle\">หดตัว</text><line x1=\"359.40000000000003\" y1=\"325\" x2=\"459\" y2=\"325\" stroke=\"var(--line-2)\" stroke-width=\"1.4\"/><text x=\"281.79999999999995\" y=\"308\" font-size=\"13\" font-weight=\"700\" fill=\"var(--warn)\" text-anchor=\"start\">จุด B</text>\n  </svg><div class=\"figcap\">จุด B อยู่ในช่วงที่ผลผลิตจริงเริ่มกลับมาเพิ่มขึ้นแต่ยังอยู่ใต้เส้นศักยภาพ</div></div>"},{"id":"C22","type":"mcq","lvl":2,"topic":"AD-AS","ref":"ทำไมความผันผวนจึงเป็นปัญหา","q":"หากในระยะยาวเศรษฐกิจจะกลับสู่ผลผลิตศักยภาพเสมอ เหตุใดนักเศรษฐศาสตร์จึงยังให้ความสำคัญกับการลดความผันผวนของวัฏจักรธุรกิจ","choices":["เพราะต้นทุนระหว่างทางเป็นของจริง ทั้งการว่างงานที่ทำลายรายได้และทักษะ การลงทุนที่หายไป ความเสี่ยงที่ปัญหาวัฏจักรจะกลายเป็นโครงสร้าง และความไม่แน่นอนที่บั่นทอนการวางแผนระยะยาว","เพราะความผันผวนทำให้ตัวเลขการเติบโตเฉลี่ยระยะยาวต่ำลงโดยตรงตามหลักคณิตศาสตร์ ประเทศที่มีวัฏจักรผันผวนจึงมีรายได้ต่อหัวต่ำกว่าประเทศที่ราบเรียบเสมอในทุกกรณี","เพราะความผันผวนทำให้เส้น LRAS เลื่อนซ้ายทุกครั้งที่เศรษฐกิจหดตัว และไม่สามารถเลื่อนกลับมาที่เดิมได้อีกเลยไม่ว่าจะฟื้นตัวดีเพียงใดก็ตาม ศักยภาพจึงลดลงเรื่อย ๆ ทุกรอบวัฏจักร","ในความเป็นจริงนักเศรษฐศาสตร์ไม่ได้ให้ความสำคัญกับเรื่องนี้ เพราะเมื่อระยะยาวผลผลิตกลับสู่ศักยภาพเสมอ ความผันผวนระยะสั้นจึงไม่มีนัยสำคัญต่อสวัสดิการของสังคมแต่อย่างใด"],"answer":0,"a":"แม้ปลายทางจะกลับสู่ Y_FE แต่เส้นทางระหว่างทางมีต้นทุนจริง\nต้นทุนต่อคน — คนที่ตกงานในช่วงถดถอยสูญเสียรายได้ในช่วงเวลานั้นไปเลย ไม่ได้คืน อีกทั้งทักษะเสื่อมถอยและเส้นทางอาชีพเสียหายระยะยาว บัณฑิตที่จบในปีที่เศรษฐกิจแย่มีรายได้ต่ำกว่าเพื่อนร่วมรุ่นที่จบปีอื่นไปอีกหลายปี\nต้นทุนต่อการผลิต — การลงทุนที่ถูกยกเลิกในช่วงถดถอยคือทุนที่ไม่ได้ถูกสร้าง ซึ่งกระทบผลผลิตในอนาคต\nความเสี่ยงที่จะกลายเป็นถาวร — ถ้าการหดตัวลากยาวพอ ปัญหาวัฏจักรจะแปรเป็นปัญหาโครงสร้างผ่าน hysteresis และ LRAS เลื่อนซ้ายจริง\nต้นทุนของความไม่แน่นอน — ครัวเรือนและธุรกิจที่เผชิญความผันผวนสูงต้องกันเงินสำรองมากขึ้นและลงทุนน้อยลง ซึ่งลดสวัสดิการและการเติบโต\nนี่คือเหตุผลที่การรักษาเสถียรภาพเป็นหนึ่งในเป้าหมายหลักของนโยบายมหภาค แม้จะไม่เปลี่ยนผลผลิตปลายทางก็ตาม","whys":["ถูกต้อง — ครอบคลุมต้นทุนทั้งด้านรายได้ ทักษะ การลงทุน ความเสี่ยงเชิงโครงสร้าง และต้นทุนของความไม่แน่นอน","ไม่ถูกต้อง — ความผันผวนไม่ได้ลดการเติบโตเฉลี่ยโดยอัตโนมัติตามหลักคณิตศาสตร์ ผลกระทบเกิดผ่านช่องทางเศรษฐกิจที่เป็นรูปธรรม","ไม่ถูกต้อง — LRAS ไม่ได้เลื่อนซ้ายทุกครั้งที่หดตัว จะเกิดก็ต่อเมื่อการหดตัวลึกและยาวพอจนเกิด hysteresis เท่านั้น","ไม่ถูกต้อง — การรักษาเสถียรภาพเป็นหนึ่งในเป้าหมายหลักของเศรษฐศาสตร์มหภาค เพราะต้นทุนระหว่างทางเป็นของจริงและวัดได้"]},{"id":"C23","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ประเทศที่พึ่งพาสินค้าโภคภัณฑ์","q":"ประเทศหนึ่งมีรายได้จากการส่งออกน้ำมันคิดเป็น 70% ของรายได้ส่งออกทั้งหมด เมื่อราคาน้ำมันโลกดิ่งลง 50% ข้อใดวิเคราะห์ผลต่อวัฏจักรและเสนอแนวทางได้ถูกต้องที่สุด","choices":["AD หดตัวรุนแรงจาก NX และรายได้ภาครัฐที่หายไป เกิดช่องว่างการหดตัวขนาดใหญ่ · แนวทางระยะสั้นคือใช้เงินสำรองที่สะสมไว้พยุง ระยะยาวคือกระจายโครงสร้างเศรษฐกิจให้พึ่งพาสินค้าเดียวน้อยลง","AD ขยายตัวเพราะน้ำมันที่ถูกลงทำให้ต้นทุนพลังงานในประเทศลดลง ครัวเรือนและธุรกิจจึงมีเงินเหลือไปใช้จ่ายมากขึ้น เศรษฐกิจของประเทศผู้ส่งออกน้ำมันจึงได้ประโยชน์จากราคาที่ลดลง","เฉพาะเส้น SRAS เท่านั้นที่เลื่อนลงเพราะต้นทุนพลังงานถูกลง ทำให้ผลผลิตเพิ่มขึ้นและระดับราคาลดลง ส่วนเส้น AD ไม่ได้รับผลกระทบเพราะราคาน้ำมันเป็นเรื่องของฝั่งต้นทุนการผลิตเท่านั้น","ไม่มีผลต่อวัฏจักรของประเทศเลย เพราะราคาน้ำมันที่ลดลงจะถูกชดเชยด้วยปริมาณการส่งออกที่เพิ่มขึ้นตามกฎอุปสงค์ ทำให้รายได้จากการส่งออกรวมยังคงเท่าเดิมโดยไม่เปลี่ยนแปลง"],"answer":0,"a":"สำหรับประเทศผู้ส่งออกน้ำมัน ราคาที่ดิ่งลงเป็นช็อกเชิงลบที่รุนแรงมาก และต่างจากประเทศผู้นำเข้าโดยสิ้นเชิง\nช่องทางการส่งออก — รายได้จากการส่งออกหายไปเกือบครึ่ง NX ดิ่ง AD เลื่อนซ้ายอย่างแรง\nช่องทางการคลัง — รายได้ภาครัฐของประเทศเหล่านี้มักพึ่งพาค่าภาคหลวงและภาษีจากน้ำมันเป็นหลัก เมื่อรายได้หาย รัฐบาลอาจต้องตัดรายจ่าย ซึ่งกด G ลงซ้ำเข้าไปอีกเป็นนโยบายตามวัฏจักร\nช่องทางการลงทุน — โครงการลงทุนในภาคพลังงานถูกยกเลิก I หดตัว และมีผลกระทบลูกโซ่ไปยังภาคบริการที่พึ่งพาภาคพลังงาน\nแนวทาง\n· ระยะสั้น — ใช้กองทุนความมั่งคั่งหรือเงินสำรองที่สะสมไว้ในช่วงราคาสูงมาพยุงรายจ่าย เพื่อไม่ให้ต้องตัดงบในจังหวะที่แย่ที่สุด\n· ระยะยาว — กระจายโครงสร้างเศรษฐกิจและพัฒนาภาคการผลิตอื่น ซึ่งเป็นนโยบายด้านอุปทานที่ลดความเปราะบางต่อช็อกราคาสินค้าโภคภัณฑ์","whys":["ถูกต้อง — ระบุช่องทางผลกระทบครบและเสนอแนวทางทั้งระยะสั้นที่ใช้เงินสำรองและระยะยาวที่กระจายความเสี่ยง","ไม่ถูกต้อง — สำหรับประเทศผู้ส่งออก รายได้ที่หายไปมีขนาดใหญ่กว่าประโยชน์จากต้นทุนพลังงานในประเทศที่ถูกลงมาก","ไม่ถูกต้อง — มองข้ามผลกระทบหลักซึ่งอยู่ที่รายได้จากการส่งออกและรายได้ภาครัฐที่หายไป ซึ่งกระทบ AD โดยตรง","ไม่ถูกต้อง — อุปสงค์น้ำมันในระยะสั้นค่อนข้างไม่ยืดหยุ่น ปริมาณที่เพิ่มขึ้นจึงไม่สามารถชดเชยราคาที่ดิ่งลงครึ่งหนึ่งได้"],"tip":"ช็อกราคาสินค้าโภคภัณฑ์ให้ผลตรงข้ามกันระหว่างประเทศผู้ส่งออกกับผู้นำเข้า — อ่านโจทย์ให้ดีว่าประเทศนั้นอยู่ฝั่งไหน"},{"id":"C24","type":"mcq","lvl":4,"topic":"AD-AS","ref":"การหดตัวที่มีต้นตอจากภาคการเงิน","q":"ภาวะถดถอยครั้งหนึ่งมีต้นตอจากวิกฤตธนาคารที่ทำให้ระบบสินเชื่อหยุดชะงัก ข้อใดอธิบายว่าเหตุใดภาวะถดถอยแบบนี้จึงมักลึกและยาวกว่าภาวะถดถอยทั่วไป","choices":["เพราะสินเชื่อเป็นเส้นเลือดที่ส่งเงินออมไปสู่การลงทุน เมื่อระบบเสียหาย แม้ธุรกิจที่ดีก็กู้ไม่ได้ · อีกทั้งนโยบายการเงินอ่อนแรงลงมากเพราะการลดดอกเบี้ยไม่ช่วยถ้าธนาคารไม่ยอมปล่อยกู้","เพราะวิกฤตธนาคารทำให้ปริมาณเงินในระบบเพิ่มขึ้นอย่างรวดเร็วจนเกิดเงินเฟ้อรุนแรง ซึ่งบีบให้ธนาคารกลางต้องขึ้นดอกเบี้ยอย่างหนักและซ้ำเติมการหดตัวให้ลึกลงไปอีกขั้นหนึ่ง","เพราะภาคการเงินเป็นส่วนเล็กมากของ GDP ปัญหาจึงจำกัดอยู่ในภาคนั้นและไม่ลุกลาม แต่ใช้เวลานานในการซ่อมแซมเพราะเป็นเรื่องทางเทคนิคที่ซับซ้อนเกินกว่าจะแก้ได้อย่างรวดเร็ว","เพราะวิกฤตธนาคารทำให้เส้น SRAS เลื่อนขึ้นอย่างรุนแรงจากต้นทุนทางการเงินที่สูงขึ้น ทำให้เกิดภาวะเงินเฟ้อควบคู่เศรษฐกิจซบเซาซึ่งแก้ไขได้ยากกว่าการหดตัวจากฝั่งอุปสงค์ทั่วไป"],"answer":0,"a":"ภาวะถดถอยที่มีต้นตอจากภาคการเงินต่างจากแบบทั่วไปในสองมิติสำคัญ\nมิติที่หนึ่ง กลไกส่งผ่านเงินทุนพัง — ระบบธนาคารทำหน้าที่ส่งเงินออมของครัวเรือนไปสู่โครงการลงทุนของธุรกิจ เมื่อธนาคารเสียหายและต้องซ่อมงบดุลของตัวเอง พวกเขาจะเข้มงวดการปล่อยกู้อย่างมาก ผลคือแม้แต่ธุรกิจที่มีโครงการดีก็หาเงินทุนไม่ได้ การลงทุนหยุดชะงักในวงกว้าง\nมิติที่สอง นโยบายการเงินอ่อนแรง — ปกติธนาคารกลางลดดอกเบี้ยแล้วการกู้จะเพิ่ม แต่ในวิกฤตการเงิน ธนาคารพาณิชย์ไม่ยอมปล่อยกู้แม้ต้นทุนเงินจะถูกลง ขณะที่ครัวเรือนและธุรกิจที่มีหนี้สูงก็มุ่งลดหนี้มากกว่ากู้เพิ่ม กลไกส่งผ่านจึงตัน\nผลรวม — การฟื้นตัวมักเป็นรูปตัวยูหรือตัวแอล ใช้เวลาหลายปีกว่างบดุลของทั้งธนาคาร ครัวเรือน และธุรกิจจะกลับมาแข็งแรง และมักต้องพึ่งนโยบายการคลังซึ่งใช้จ่ายโดยตรงมากกว่านโยบายการเงิน","whys":["ถูกต้อง — ระบุทั้งการพังของกลไกส่งผ่านเงินทุนและเหตุผลที่นโยบายการเงินอ่อนแรงลงในสถานการณ์นี้","ไม่ถูกต้อง — วิกฤตธนาคารทำให้สินเชื่อและปริมาณเงินใน ระบบหดตัว ไม่ใช่เพิ่มขึ้น และมักมาพร้อมแรงกดดันเงินฝืดมากกว่าเงินเฟ้อ","ไม่ถูกต้อง — ภาคการเงินเชื่อมโยงกับทุกภาคส่วนผ่านสินเชื่อ ปัญหาจึงลุกลามไปทั้งระบบเศรษฐกิจ ไม่ได้จำกัดอยู่ในภาคนั้น","ไม่ถูกต้อง — วิกฤตการเงินกระทบผ่านฝั่งอุปสงค์เป็นหลักจากการลงทุนและการบริโภคที่หดตัว ไม่ใช่ผ่านต้นทุนการผลิตที่เลื่อน SRAS"]},{"id":"C25","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ผลของวัฏจักรที่ไม่เท่ากันในแต่ละกลุ่ม","q":"ในช่วงภาวะถดถอย ข้อมูลแสดงว่าอัตราการว่างงานของแรงงานทักษะต่ำเพิ่มขึ้นมากกว่าของแรงงานทักษะสูงหลายเท่า ข้อใดอธิบายปรากฏการณ์นี้และนัยเชิงนโยบายได้ถูกต้องที่สุด","choices":["แรงงานทักษะต่ำมักอยู่ในภาคที่อ่อนไหวต่อวัฏจักรและถูกเลิกจ้างก่อน อีกทั้งค่าจ้างขั้นต่ำยังผูกพันกับกลุ่มนี้ · ภาวะถดถอยจึงซ้ำเติมความเหลื่อมล้ำ ซึ่งเป็นเหตุผลเพิ่มเติมที่ต้องรักษาเสถียรภาพ","แรงงานทักษะต่ำมีผลิตภาพสูงกว่าจึงมีต้นทุนต่อหน่วยผลผลิตแพงกว่า นายจ้างจึงเลิกจ้างกลุ่มนี้ก่อนเพื่อลดต้นทุน · นัยเชิงนโยบายคือควรลดค่าจ้างของแรงงานทักษะสูงลงให้เท่ากัน","เป็นเพียงความคลาดเคลื่อนของการวัด เพราะแรงงานทักษะต่ำมักทำงานนอกระบบจึงไม่ถูกนับในสถิติ · ในความเป็นจริงทั้งสองกลุ่มได้รับผลกระทบจากภาวะถดถอยในระดับที่เท่ากันทุกประการ ความแตกต่างที่เห็นจึงหายไปเมื่อปรับข้อมูลใหม่","แรงงานทักษะสูงได้รับผลกระทบมากกว่าเสมอเพราะมีค่าจ้างสูงจึงเป็นเป้าหมายแรกของการลดต้นทุน · ข้อมูลที่แสดงผลตรงข้ามจึงต้องมาจากการเก็บข้อมูลในช่วงเวลาที่ไม่ครอบคลุม"],"answer":0,"a":"วัฏจักรธุรกิจไม่ได้กระทบทุกคนเท่ากัน และความไม่เท่ากันนี้มีเหตุผลเชิงโครงสร้าง\nเหตุผลที่หนึ่ง โครงสร้างอุตสาหกรรม — แรงงานทักษะต่ำกระจุกตัวอยู่ในภาคก่อสร้าง การผลิต ค้าปลีก และบริการ ซึ่งเป็นภาคที่อ่อนไหวต่อวัฏจักรสูง เพราะสินค้าและบริการเหล่านี้เลื่อนการซื้อได้ง่ายเมื่อเศรษฐกิจแย่\nเหตุผลที่สอง ต้นทุนการปรับตัวของนายจ้าง — บริษัทลงทุนฝึกอบรมแรงงานทักษะสูงไว้มาก การเลิกจ้างแล้วหาคนใหม่มีต้นทุนสูง จึงมักเก็บคนกลุ่มนี้ไว้และตัดกลุ่มที่ทดแทนได้ง่ายกว่าก่อน\nเหตุผลที่สาม ค่าจ้างขั้นต่ำ — กฎหมายผูกพันกับกลุ่มทักษะต่ำ ทำให้ค่าจ้างของกลุ่มนี้ปรับลดลงไม่ได้เมื่ออุปสงค์แรงงานหด การปรับตัวจึงตกที่จำนวนคนแทน\nนัยเชิงนโยบาย — ภาวะถดถอยซ้ำเติมความเหลื่อมล้ำ ซึ่งเป็นเหตุผลเพิ่มเติมนอกเหนือจากประสิทธิภาพที่ทำให้การรักษาเสถียรภาพมีคุณค่า","whys":["ถูกต้อง — อธิบายทั้งโครงสร้างอุตสาหกรรม ต้นทุนการปรับตัวของนายจ้าง และผลของค่าจ้างขั้นต่ำ พร้อมนัยเชิงนโยบาย","ไม่ถูกต้อง — โดยทั่วไปแรงงานทักษะสูงมีผลิตภาพสูงกว่า และการลดค่าจ้างของกลุ่มนี้ก็ไม่ใช่ข้อเสนอที่แก้ปัญหาที่ต้นเหตุ","ไม่ถูกต้อง — ความแตกต่างระหว่างสองกลุ่มปรากฏชัดเจนและสม่ำเสมอในข้อมูลของหลายประเทศ ไม่ใช่เพียงความคลาดเคลื่อนของการวัด","ไม่ถูกต้อง — ข้อเท็จจริงเชิงประจักษ์ชี้ตรงข้าม เพราะบริษัทมีแรงจูงใจที่จะรักษาแรงงานที่ลงทุนฝึกอบรมไว้มากกว่า"]},{"id":"C26","type":"mcq","lvl":4,"topic":"AD-AS","ref":"สัญญาณเตือนที่ให้ข้อมูลผิดพลาด","q":"ตัวชี้วัดล่วงหน้าชุดหนึ่งส่งสัญญาณว่าเศรษฐกิจกำลังจะเข้าสู่ภาวะถดถอย ธนาคารกลางจึงลดดอกเบี้ยทันที แต่ปรากฏว่าสัญญาณนั้นผิดและเศรษฐกิจยังขยายตัวต่อเนื่อง ข้อใดประเมินสถานการณ์นี้ได้ถูกต้อง","choices":["การกระตุ้นในจังหวะที่เศรษฐกิจยังแข็งแรงจะดันผลผลิตเกินศักยภาพและสร้างแรงกดดันเงินเฟ้อ · ข้อนี้สะท้อนปัญหาว่าตัวชี้วัดล่วงหน้าเตือนผิดพลาดได้บ่อย จึงต้องดูหลายตัวประกอบและปรับนโยบายอย่างค่อยเป็นค่อยไป","การลดดอกเบี้ยไม่มีผลเสียใด ๆ เลยแม้สัญญาณจะผิด เพราะหากเศรษฐกิจยังแข็งแรงอยู่ ดอกเบี้ยที่ต่ำลงจะถูกดูดซับด้วยการลงทุนที่เพิ่มขึ้น ซึ่งขยายศักยภาพการผลิตของประเทศให้สูงขึ้นตามไปด้วย","ธนาคารกลางตัดสินใจถูกต้องแล้วเพราะการป้องกันภาวะถดถอยสำคัญกว่าความเสี่ยงเงินเฟ้อเสมอ · การเตือนผิดพลาดจึงไม่ใช่ปัญหา เพราะต้นทุนของการกระตุ้นเกินจำเป็นนั้นต่ำกว่าต้นทุนของภาวะถดถอยมาก จึงไม่ต้องปรับวิธีใช้ตัวชี้วัด","ตัวชี้วัดล่วงหน้าไม่มีประโยชน์ใด ๆ ในการดำเนินนโยบาย เพราะมันเตือนผิดพลาดอยู่เสมอ · ธนาคารกลางจึงควรรอจนกว่าตัวเลขผลผลิตจริงจะยืนยันภาวะถดถอยแล้วจึงค่อยดำเนินนโยบายใด ๆ"],"answer":0,"a":"นี่คือปัญหาสัญญาณเตือนผิดพลาด (false positive) ซึ่งเป็นความยากในทางปฏิบัติที่กราฟไม่ได้บอก\nผลของการกระตุ้นผิดจังหวะ — เมื่อเศรษฐกิจยังอยู่ใกล้หรือที่ Y_FE การลดดอกเบี้ยจะดัน AD ไปขวาจนผลผลิตเกินศักยภาพ เกิดช่องว่างเงินเฟ้อ ตลาดแรงงานตึงตัว ค่าจ้างถูกดันขึ้น SRAS เลื่อนขึ้น และในระยะยาวเหลือไว้เพียงระดับราคาที่สูงขึ้น\nความเป็นจริงของตัวชี้วัดล่วงหน้า — ตัวชี้วัดเหล่านี้มีประโยชน์จริงแต่ไม่แม่นยำ มีสุภาษิตในวงการที่ว่าตัวชี้วัดบางตัว “ทำนายภาวะถดถอยได้เก้าครั้งจากห้าครั้งที่เกิดขึ้นจริง” ซึ่งสะท้อนปัญหาการเตือนเกินจริง\nบทเรียนเชิงนโยบาย — ควรดูตัวชี้วัดหลายตัวประกอบกัน รอการยืนยันจากตัวชี้วัดพร้อมกันบ้าง และปรับนโยบายอย่างค่อยเป็นค่อยไปแทนที่จะตอบสนองเต็มกำลังทันทีต่อสัญญาณเดียว — แต่ก็ต้องสมดุลกับความล่าช้าของนโยบายที่ทำให้รอนานเกินไปก็ไม่ได้เช่นกัน","whys":["ถูกต้อง — ระบุผลเสียของการกระตุ้นผิดจังหวะและสรุปบทเรียนเรื่องการใช้ตัวชี้วัดหลายตัวอย่างสมดุล","ไม่ถูกต้อง — ดอกเบี้ยที่ต่ำลงกระทบ AD เป็นหลัก ไม่ได้ขยายศักยภาพการผลิต และการกระตุ้นเกินจำเป็นมีต้นทุนเป็นเงินเฟ้อจริง","ไม่ถูกต้อง — การกระตุ้นเกินจำเป็นมีต้นทุนที่แท้จริง และการอ้างว่าเป้าหมายหนึ่งสำคัญกว่าอีกเป้าหมายเสมอไม่ใช่หลักการที่ถูกต้อง","ไม่ถูกต้อง — การรอจนตัวเลขผลผลิตยืนยันจะทำให้นโยบายมาถึงช้าเกินไปมาก เพราะข้อมูลมีความล่าช้าและนโยบายก็ออกฤทธิ์ช้าอีกทอด"]},{"id":"C27","type":"mcq","lvl":4,"topic":"AD-AS","ref":"จังหวะการถอนมาตรการกระตุ้น","q":"หลังใช้มาตรการกระตุ้นขนาดใหญ่มาสองปี เศรษฐกิจฟื้นตัวจนผลผลิตใกล้ระดับศักยภาพและอัตราการว่างงานใกล้อัตราธรรมชาติ ข้อใดคือแนวทางที่เหมาะสมที่สุดในการจัดการมาตรการที่ใช้อยู่
