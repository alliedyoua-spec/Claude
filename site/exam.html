<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ระบบฝึกข้อสอบเศรษฐศาสตร์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* เค้าโครง: หนังสือข้อสอบแนวตั้ง คอลัมน์เดียว แถบสถานะติดบน ตัวเลขและเวลาใช้ฟอนต์ mono */
:root{
  --bg:#f1f4f8; --surface:#ffffff; --surface2:#e8edf4; --ink:#101828; --muted:#566277; --line:#d3dbe6;
  --accent:#2144c7; --accent-ink:#ffffff; --accent-soft:#e1e8fb;
  --ok:#14774b; --ok-soft:#dcf2e6; --warn:#855600; --warn-soft:#faecc8; --bad:#b3261e; --bad-soft:#fae1de;
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai","Sarabun","Loma",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131c; --surface:#161d2a; --surface2:#1f2838; --ink:#e7ebf3; --muted:#9aa6ba; --line:#2b3649;
  --accent:#86a8ff; --accent-ink:#0b1226; --accent-soft:#1d2a4d;
  --ok:#52c68e; --ok-soft:#14301f; --warn:#e7a948; --warn-soft:#352810; --bad:#ff8c82; --bad-soft:#3a1816; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131c; --surface:#161d2a; --surface2:#1f2838; --ink:#e7ebf3; --muted:#9aa6ba; --line:#2b3649;
  --accent:#86a8ff; --accent-ink:#0b1226; --accent-soft:#1d2a4d;
  --ok:#52c68e; --ok-soft:#14301f; --warn:#e7a948; --warn-soft:#352810; --bad:#ff8c82; --bad-soft:#3a1816; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.7 var(--font-body);margin:0}
.wrap{max-width:880px;margin-inline:auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3{line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:1.65rem;font-weight:600} h2{font-size:1.15rem;font-weight:600;margin-block:28px 12px} h3{font-size:1rem;font-weight:600}
small,.muted{color:var(--muted)} .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 16px;min-height:40px}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.sm{padding:4px 12px;min-height:32px;font-size:.9rem} .btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-block:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:500 1.6rem/1.2 var(--font-mono)} .stat span{font-size:.85rem;color:var(--muted)}
.banner{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-block:16px}
.papers{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.paper .no{font:500 2rem/1 var(--font-mono);color:var(--accent)}
.pill{display:inline-block;font-size:.78rem;padding:0 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)} .item:first-child{border-top:0}
.item>div{min-width:0}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 64px;gap:10px;align-items:center;font-size:.92rem}
.bar i{display:block;height:10px;background:var(--surface2);border-radius:99px;overflow:hidden} .bar i b{display:block;height:100%;background:var(--accent)}
.bar i.low b{background:var(--bad)} .bar i.mid b{background:var(--warn)} .bar i.hi b{background:var(--ok)}
.bar span{text-align:right}
/* ข้อสอบ */
.exambar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:12px}
.exambar .row{justify-content:space-between}
#timer{font:500 1.35rem/1 var(--font-mono)} #timer.low{color:var(--bad)}
.nav:not([hidden]){display:grid}
.nav{grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.nv{min-height:36px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font:500 .85rem var(--font-mono);padding:0}
.nv.on{background:var(--accent-soft);border-color:var(--accent)} .nv.fl{box-shadow:inset 0 -3px 0 var(--warn)}
.confirm{margin-top:10px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:12px 14px}
.section{margin-block:24px 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap} .section h2{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-block:12px;scroll-margin-top:84px}
.q.ok{border-color:var(--ok)} .q.no{border-color:var(--bad)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:6px}
.qno{font:500 1rem var(--font-mono);color:var(--accent)}
.qtext{white-space:pre-line;overflow-wrap:anywhere;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--bg)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt input{margin-top:6px;accent-color:var(--accent)} .opt span{min-width:0;overflow-wrap:anywhere}
input.num,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:100%;max-width:100%}
input.num{max-width:14rem;font-family:var(--font-mono)} textarea{resize:vertical;min-height:6.5rem}
.sol{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.soltxt{white-space:pre-line;overflow-wrap:anywhere;border-left:3px solid var(--accent);padding-left:12px}
.note{font-size:.88rem;color:var(--warn);margin:8px 0 0}
.yours{background:var(--surface2);border-radius:8px;padding:8px 12px;white-space:pre-line;overflow-wrap:anywhere;margin-bottom:10px;font-size:.95rem}
.marks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:10px}
.marks .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-block:16px}
.score .big{font:500 3.2rem/1 var(--font-mono)} .score .big small{font-size:1.1rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-block:12px}
.tabs .btn.on{background:var(--accent-soft);border-color:var(--accent)}
.graph{margin:10px 0;max-width:340px} .graph svg{width:100%;height:auto;display:block;overflow:visible}
.graph .gax{stroke:var(--muted);stroke-width:1.5} .graph .gl-s{stroke:var(--bad);stroke-width:2} .graph .gl-d{stroke:var(--accent);stroke-width:2} .graph .gl-l{stroke:var(--ok);stroke-width:2}
.graph .gt{fill:var(--ink);font:11px var(--font-body)} .graph .gt-s{fill:var(--bad)} .graph .gt-d{fill:var(--accent)} .graph .gt-l{fill:var(--ok)} .graph .gp{fill:var(--ink)}
@media (max-width:520px){.score{grid-template-columns:1fr}.bar{grid-template-columns:1fr 56px}.bar i{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.conf{margin-bottom:8px} #suslist{font:.85rem/1.6 var(--font-mono)}
.gw{border:1px solid var(--line);border-radius:10px;padding:12px;margin-block:10px;background:var(--bg)}
.gwgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:16px;align-items:start;margin-top:8px}
.gwf{display:grid;gap:4px} .gwf label{font-size:.9rem;color:var(--muted);margin-top:6px}
.gwf select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0;max-width:100%}
.gwv .graph{margin:0}
.hint{background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin-block:10px;font-size:.93rem}
.hint .btn{margin-left:6px}
.calc{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.calc input.num{max-width:20rem;flex:1 1 12rem} .calc details{margin-top:6px;font-size:.9rem}
.aires{background:var(--surface2);border-radius:8px;padding:8px 12px;margin-top:8px}
.ai{margin-top:10px}
.note-t ul{padding-left:1.2em} .formula{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
@media (max-width:620px){.gwgrid{grid-template-columns:1fr}}
.gws{margin-top:12px;padding-top:6px;border-top:1px solid var(--line);font-size:.8rem;letter-spacing:.04em;color:var(--accent);font-weight:600} .gws:first-child{margin-top:0;border-top:0;padding-top:0}
.gwf select{width:100%}
.gwa{margin-top:2px}
/* รูปจากโจทย์ที่นำเข้า: ใช้ตัวแปรสีของหน้านี้ */
:root{--ink-2:var(--muted);--curve-ad:var(--accent);--curve-as:var(--bad);--curve-lras:var(--ok);--curve-ghost:var(--muted);--line-2:var(--line)}
.figwrap{margin:10px 0;max-width:560px;overflow-x:auto} .figwrap svg{width:100%;height:auto;display:block;max-width:560px}
.figwrap svg text{font-family:var(--font-body)} .figwrap table{border-collapse:collapse;font-size:.9rem} .figwrap th,.figwrap td{border:1px solid var(--line);padding:4px 10px;text-align:left}
.whys{margin-top:10px;font-size:.92rem} .whys summary{cursor:pointer;color:var(--accent)} .whys ul{padding-left:1.1em} .whys li{margin-block:6px}

</style>
</head>

<script>
// ค่าตั้งต้น รอผู้ใช้ยืนยันจำนวนข้อ/คะแนน/เวลา — แก้ที่นี่ที่เดียว
window.CONFIG = {

  minutes: 90,
  // ระดับชุดสอบ: จำนวนชุด, จำนวนข้อกาต่อระดับข้อ, ระดับของข้อเขียนที่อนุญาต
  levels: [

    { name: 'ยาก', papers: 3, mcq: { 2: 8, 3: 18, 4: 4 }, written: [3] },
    { name: 'ท้าทาย', papers: 3, mcq: { 3: 8, 4: 22 }, written: [3, 4] },
  ],

window.SETS = [];
window.registerSet = s => window.SETS.push(s);

<script>
registerSet({
  id: 'fx-orig', title: 'อัตราแลกเปลี่ยน (ต้นฉบับ)', kind: 'original', exam: true, topic: 'อัตราแลกเปลี่ยน',
  source: 'PracticeExchangeRateThai.pdf (ผศ.ดร.ธนารักษ์ เหล่าสุทธิ) + สไลด์ Ch.13',

      q: 'สมมติว่าประเทศ BB ใช้อัตราแลกเปลี่ยนแบบลอยตัว มีอัตราแลกเปลี่ยนดุลยภาพ 30 BBD = 1 USD เกิดวิกฤตเศรษฐกิจในประเทศ BB ทำให้นักลงทุนต่างประเทศถอนเงินทุนจาก BB ไปลงทุนที่สหรัฐฯ แทน อัตราแลกเปลี่ยนและการส่งออกของ BB เปลี่ยนอย่างไร? อธิบายพร้อมวาดกราฟ',
      graph: { type: 'fx', shift: 'S+' },
      a: 'นักลงทุนต้องขาย BBD เพื่อซื้อ USD ไปลงทุนในสหรัฐฯ → อุปทานของ BBD เพิ่ม (เส้น S เลื่อนขวา) → อัตราแลกเปลี่ยน e (USD ต่อ 1 BBD) ลดลง ค่าเงิน BBD อ่อนลง (depreciation) เช่น จาก 30 เป็นมากกว่า 30 BBD ต่อ 1 USD\nสินค้า BB ถูกลงสำหรับชาวต่างชาติ (real exchange rate ลด) → ส่งออกสุทธิเพิ่มขึ้น' },
    { id: 2, type: 'written', ref: 'แบบฝึกหัด ข้อ 2',
      q: 'ประเทศหนึ่งต้องการสนับสนุนการส่งออก นักเศรษฐศาสตร์เสนอให้รัฐบาลยกเว้นภาษีส่งออก นโยบายนี้ช่วยเพิ่มการส่งออกได้หรือไม่ อย่างไร? วาดรูปพร้อมอธิบายกลไกอัตราแลกเปลี่ยน',
      graph: { type: 'fx', shift: 'D+' },
      a: 'ยกเว้นภาษีส่งออก → สินค้าส่งออกขายได้กำไรมากขึ้น/ราคาถูกลง → อุปสงค์ต่างชาติต่อสินค้าในประเทศเพิ่ม → อุปสงค์ต่อเงินสกุลในประเทศเพิ่ม (D เลื่อนขวา) → ค่าเงินแข็งขึ้น (appreciation)\nค่าเงินแข็งทำให้สินค้าแพงขึ้นสำหรับต่างชาติ (real exchange rate เพิ่ม) จึงหักล้างผลบางส่วน ผลสุทธิ: ปริมาณส่งออกเพิ่มได้ แต่น้อยกว่าที่คาดถ้าไม่คิดผลของอัตราแลกเปลี่ยน' },
    { id: 3, type: 'written', ref: 'แบบฝึกหัด ข้อ 3',
      q: 'ถ้าสหรัฐฯ ขึ้นอัตราภาษีสินค้านำเข้า อัตราแลกเปลี่ยนและการส่งออกของไทยควรเปลี่ยนแปลงอย่างไร? อธิบายพร้อมวาดกราฟ',
      graph: { type: 'fx', shift: 'D-' },
      a: 'สินค้าไทยในสหรัฐฯ แพงขึ้น → สหรัฐฯ นำเข้าจากไทยลดลง → อุปสงค์ต่อเงินบาทลดลง (D เลื่อนซ้าย) → บาทอ่อนค่า (depreciation) อัตราแลกเปลี่ยน e ลดลง\nบาทอ่อนช่วยให้สินค้าไทยถูกลงบางส่วน แต่ผลสุทธิการส่งออกของไทยไปสหรัฐฯ ลดลง' },
    { id: 4, type: 'written', ref: 'แบบฝึกหัด ข้อ 4',
      q: 'อัตราแลกเปลี่ยน (Nominal Exchange Rate) และอัตราแลกเปลี่ยนที่แท้จริง (Real Exchange Rate) เหมือนหรือแตกต่างกันอย่างไร? ยกตัวอย่างประกอบ',
      a: 'Nominal (e_nom) = จำนวนเงินตราต่างประเทศที่แลกได้ด้วยเงินในประเทศ 1 หน่วย (เช่น 110 เยนต่อ 1 ดอลลาร์)\nReal (e) = e_nom × P / P_for = ราคาสินค้าในประเทศเทียบกับสินค้าต่างประเทศ (แลกสินค้าต่างประเทศได้กี่หน่วยต่อสินค้าในประเทศ 1 หน่วย)\nตัวอย่าง: e_nom = 110 เยน/ดอลลาร์ แฮมเบอร์เกอร์โตเกียว 1,100 เยน นิวยอร์ก 2 ดอลลาร์ → e = 110 × 2 / 1,100 = 0.2 แฮมเบอร์เกอร์ญี่ปุ่นต่อแฮมเบอร์เกอร์สหรัฐฯ\nต่างกันที่ real หักผลของระดับราคาแล้ว จึงใช้บอกความสามารถในการแข่งขันได้' },
    { id: 5, type: 'calc', ref: 'แบบฝึกหัด ข้อ 5', expr: '800*1000/160000', answer: 5, tol: 0.01,
      q: 'ข้าวไทย 1 ถัง ราคา 1,000 บาท ข้าวเวียดนาม 1 ถัง ราคา 160,000 ดอง อัตราแลกเปลี่ยน 800 ดอง = 1 บาท จงหาอัตราแลกเปลี่ยนที่แท้จริงของไทย (ตอบเป็นตัวเลข)',
      a: 'e = e_nom × P / P_for = 800 × 1,000 / 160,000 = 5\n(ตรวจ: ข้าวเวียดนามเป็นเงินบาท = 160,000/800 = 200 บาท → 1,000/200 = 5) ข้าวไทยแพงกว่าข้าวเวียดนาม 5 เท่า' },
    { id: 6, type: 'mcq', ref: 'แบบฝึกหัด ข้อ 6', choices: ['จีน', 'ญี่ปุ่น'], answer: 1,
      q: '1 บาท = 1.50 หยวน และ 1 บาท = 0.80 เยน CPI ไทย = 100, จีน = 180, ญี่ปุ่น = 80 ท่านต้องการไปเที่ยวประเทศจีนหรือญี่ปุ่น?',
      a: 'จีน: e = 1.50 × 100 / 180 ≈ 0.83\nญี่ปุ่น: e = 0.80 × 100 / 80 = 1.00\ne สูงกว่า = สินค้าต่างประเทศถูกกว่าเมื่อเทียบกับสินค้าไทย → ญี่ปุ่น (1.00 > 0.83) เงินบาทซื้อสินค้าในญี่ปุ่นได้มากกว่า' },
  ],
});

</script>
<script>

registerSet({"id":"imp-all","title":"โจทย์เพิ่มเติม: ทบทวนรวม","kind":"import","exam":true,"mcqPool":true,"topic":"โจทย์เพิ่มเติม","source":"ไฟล์ที่คุณส่งมา (โจทย์เพิ่มเติม: ทบทวนรวม)","conf":"import","questions":[{"id":"U01","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"ผลของแรงงานท้อแท้ต่อสถิติสามตัวพร้อมกัน","q":"ประเทศหนึ่งมีประชากรวัยผู้ใหญ่ 50.0 ล้านคน ผู้มีงานทำ 30.0 ล้านคน ผู้ว่างงาน 2.0 ล้านคน และผู้ไม่อยู่ในกำลังแรงงาน 18.0 ล้านคน ต่อมามีข่าวว่าเศรษฐกิจกำลังฟื้น ทำให้แรงงานท้อแท้ 0.5 ล้านคนกลับเข้ามาหางานอีกครั้ง โดยยังไม่มีใครได้งาน สถิติสามตัวเปลี่ยนแปลงอย่างไร","choices":["อัตราการว่างงานเพิ่มจาก 6.25% เป็น 7.69% · อัตราการมีส่วนร่วมเพิ่มจาก 64.0% เป็น 65.0% · สัดส่วนผู้มีงานทำต่อประชากรคงที่ที่ 60.0%","อัตราการว่างงานลดจาก 6.25% เป็น 6.15% · อัตราการมีส่วนร่วมเพิ่มจาก 64.0% เป็น 65.0% · สัดส่วนผู้มีงานทำต่อประชากรเพิ่มเป็น 61.0%","อัตราการว่างงานเพิ่มจาก 6.25% เป็น 7.69% · อัตราการมีส่วนร่วมคงที่ที่ 64.0% · สัดส่วนผู้มีงานทำต่อประชากรลดลงเหลือ 59.0%","อัตราการว่างงานคงที่ที่ 6.25% · อัตราการมีส่วนร่วมเพิ่มจาก 64.0% เป็น 65.0% · สัดส่วนผู้มีงานทำต่อประชากรลดลงเหลือ 58.8%"],"answer":0,"a":"ก่อน กำลังแรงงาน = 30.0 + 2.0 = 32.0 ล้าน · u = 2.0 ÷ 32.0 = 6.25% · LFPR = 32.0 ÷ 50.0 = 64.0% · EP ratio = 30.0 ÷ 50.0 = 60.0%\nหลัง ผู้ว่างงานเพิ่มเป็น 2.5 ล้าน กำลังแรงงานเพิ่มเป็น 32.5 ล้าน · u = 2.5 ÷ 32.5 = 7.69% · LFPR = 32.5 ÷ 50.0 = 65.0%\nส่วน EP ratio ใช้ตัวเศษเป็นผู้มีงานทำซึ่งไม่เปลี่ยน และตัวส่วนเป็นประชากรวัยผู้ใหญ่ซึ่งก็ไม่เปลี่ยน จึงคงที่ที่ 60.0% นี่คือบทเรียนสำคัญ — ข่าวดีทางเศรษฐกิจสามารถทำให้อัตราการว่างงานสูงขึ้นได้ในระยะสั้น","whys":["ถูกต้อง — ผู้ว่างงานและกำลังแรงงานเพิ่มพร้อมกัน ทำให้ u และ LFPR สูงขึ้น ส่วน EP ratio ไม่ขยับเพราะการจ้างงานยังเท่าเดิม","ไม่ถูกต้อง — ผู้ว่างงานเพิ่มขึ้นจริง 0.5 ล้านคน อัตราการว่างงานจึงต้องสูงขึ้น และ EP ratio จะเพิ่มได้ก็ต่อเมื่อมีคนได้งานเพิ่ม","ไม่ถูกต้อง — LFPR ต้องเพิ่มขึ้นเพราะกำลังแรงงานโตขึ้นขณะที่ประชากรวัยผู้ใหญ่เท่าเดิม และ EP ratio ไม่ได้ลดเพราะผู้มีงานทำไม่เปลี่ยน","ไม่ถูกต้อง — เมื่อตัวเศษเพิ่ม 0.5 เร็วกว่าตัวส่วนที่เพิ่ม 0.5 ในสัดส่วน อัตราการว่างงานย่อมสูงขึ้น ไม่มีทางคงที่ได้"],"tip":"โจทย์แนวนี้ต้องคำนวณทั้งสามตัวก่อนตอบ เพราะตัวเลือกมักถูกหนึ่งตัวผิดสองตัว — คำนวณครบแล้วค่อยจับคู่"},{"id":"U02","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"อัตราการว่างงานเท่ากันแต่ตลาดแรงงานต่างกัน","q":"ประเทศ ก และประเทศ ข มีอัตราการว่างงานเท่ากันที่ 5% แต่ประเทศ ก มีสัดส่วนผู้มีงานทำต่อประชากรวัยผู้ใหญ่ 62% ส่วนประเทศ ข มีเพียง 48% ข้อใดตีความได้สมเหตุสมผลที่สุด","choices":["ประเทศ ข มีคนวัยทำงานจำนวนมากอยู่นอกกำลังแรงงาน ตลาดแรงงานจึงใช้ทรัพยากรมนุษย์ได้ด้อยกว่า แม้ตัวเลขการว่างงานจะดูเท่ากันก็ตาม","ประเทศ ข มีตลาดแรงงานที่แข็งแรงกว่า เพราะการที่คนอยู่นอกกำลังแรงงานมากแสดงว่าครัวเรือนมั่งคั่งพอจะไม่ต้องทำงานทุกคน","ทั้งสองประเทศมีสภาพตลาดแรงงานเหมือนกันทุกประการ เพราะอัตราการว่างงานเป็นตัวชี้วัดมาตรฐานที่ครอบคลุมสภาพตลาดแรงงานได้ครบถ้วน","ประเทศ ก ต้องมีอัตราการว่างงานตามธรรมชาติสูงกว่าประเทศ ข เพราะมีคนอยู่ในกำลังแรงงานมากกว่าจึงเกิดการเปลี่ยนงานบ่อยกว่า"],"answer":0,"a":"อัตราการว่างงานวัดเฉพาะคนที่อยู่ในกำลังแรงงาน จึงมองไม่เห็นคนที่ถอนตัวออกไปแล้ว เมื่อสองประเทศมี u เท่ากันแต่ EP ratio ต่างกันถึง 14 จุด แปลว่าประเทศ ข มีประชากรวัยทำงานจำนวนมากที่ไม่ได้ทำงานและไม่ได้หางาน ซึ่งอาจมาจากแรงงานท้อแท้ ข้อจำกัดด้านการเดินทาง หรือโครงสร้างสังคม การใช้ทรัพยากรมนุษย์จึงด้อยกว่าอย่างมีนัยสำคัญ นี่คือเหตุผลที่นักเศรษฐศาสตร์ดูสองสถิตินี้ควบคู่กันเสมอ","whys":["ถูกต้อง — EP ratio จับคนที่หายไปจากกำลังแรงงานได้ ในขณะที่อัตราการว่างงานมองไม่เห็นคนกลุ่มนี้เลย","ไม่ถูกต้อง — ความมั่งคั่งเป็นเพียงคำอธิบายหนึ่งในหลายข้อ และโดยทั่วไป EP ratio ที่ต่ำมากบ่งชี้ปัญหาเชิงโครงสร้างมากกว่าความมั่งคั่ง","ไม่ถูกต้อง — โจทย์แสดงชัดว่าสองประเทศต่างกันที่ EP ratio ถึง 14 จุด การบอกว่าเหมือนกันทุกประการจึงขัดกับข้อมูลที่ให้มา","ไม่ถูกต้อง — อัตราธรรมชาติขึ้นกับสถาบันตลาดแรงงานและความเร็วในการจับคู่งาน ไม่ได้ถูกกำหนดโดยขนาดของกำลังแรงงานโดยตรง"]},{"id":"U03","type":"mcq","lvl":3,"topic":"การว่างงาน","ref":"แยกประเภทการว่างงานจากกลไก ไม่ใช่จากอาชีพ","q":"บริษัทสิ่งทอขนาดใหญ่ย้ายฐานการผลิตไปประเทศเพื่อนบ้านทั้งโรงงาน ทำให้แรงงานเย็บผ้าในเมืองนั้นตกงานพร้อมกันหลายพันคน โดยอุตสาหกรรมอื่นในเมืองยังคงรับสมัครงานตามปกติ การว่างงานนี้จัดเป็นประเภทใด","choices":["การว่างงานตามโครงสร้าง เพราะตำแหน่งงานสำหรับทักษะเย็บผ้าหายไปจากพื้นที่อย่างถาวร แรงงานต้องเปลี่ยนทักษะหรือย้ายถิ่นจึงจะกลับเข้าทำงานได้","การว่างงานตามวัฏจักรธุรกิจ เพราะเป็นการเลิกจ้างจำนวนมากพร้อมกัน ซึ่งเป็นลักษณะเฉพาะของช่วงที่เศรษฐกิจโดยรวมกำลังเข้าสู่ภาวะถดถอย","การว่างงานชั่วคราว เพราะอุตสาหกรรมอื่นในเมืองยังรับสมัครงานอยู่ แรงงานจึงเพียงต้องใช้เวลาสักระยะในการค้นหาตำแหน่งที่เหมาะสม","การว่างงานตามฤดูกาล เพราะการย้ายฐานการผลิตของอุตสาหกรรมสิ่งทอมักเกิดขึ้นเป็นรอบตามคำสั่งซื้อที่เปลี่ยนไปในแต่ละช่วงของปี"],"answer":0,"a":"เกณฑ์ตัดสินคือ “ตำแหน่งงานสำหรับทักษะนั้นยังมีอยู่ในระบบหรือไม่” เมื่อโรงงานย้ายออกทั้งโรง ตำแหน่งงานเย็บผ้าในพื้นที่หายไปอย่างถาวร ไม่ใช่แค่หายากขึ้น แรงงานจึงต้องฝึกทักษะใหม่หรือย้ายถิ่นจึงจะกลับมามีงานทำ — ตรงนิยามของการว่างงานตามโครงสร้างซึ่งสไลด์ระบุว่าเกิดจากการเปลี่ยนแปลงโครงสร้างเศรษฐกิจ เช่น การย้ายแหล่งผลิตอุตสาหกรรม","whys":["ถูกต้อง — การย้ายแหล่งผลิตเป็นตัวอย่างที่สไลด์ยกไว้โดยตรงว่าเป็นสาเหตุของการว่างงานตามโครงสร้าง","ไม่ถูกต้อง — โจทย์ระบุว่าอุตสาหกรรมอื่นยังรับสมัครงานตามปกติ จึงไม่มีสัญญาณว่าเศรษฐกิจโดยรวมกำลังหดตัว ซึ่งเป็นเงื่อนไขของการว่างงานตามวัฏจักร","ไม่ถูกต้อง — งานที่เปิดรับในอุตสาหกรรมอื่นต้องการทักษะคนละชุด แรงงานเย็บผ้าจึงไม่ได้แค่ “ยังหาไม่เจอ” แต่ทักษะไม่ตรงกับตำแหน่งที่มี","ไม่ถูกต้อง — การย้ายฐานการผลิตทั้งโรงงานเป็นการเปลี่ยนแปลงถาวร ไม่ใช่การจ้างงานที่กลับมาใหม่ทุกฤดูกาลอย่างภาคเกษตรหรือท่องเที่ยว"],"tip":"อย่าตัดสินจากชื่ออาชีพหรือจำนวนคนที่ตกงาน ให้ถามว่า “ตำแหน่งงานนั้นยังมีอยู่ไหม” — ยังมีแต่หายาก = ชั่วคราว · หายไปแล้ว = โครงสร้าง"},{"id":"U04","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"หลักฐานที่ยืนยันการว่างงานตามวัฏจักร","q":"นักเศรษฐศาสตร์ต้องการยืนยันว่าการว่างงานที่สูงขึ้นในปีนี้เป็นการว่างงานตามวัฏจักรธุรกิจ ไม่ใช่การว่างงานตามโครงสร้าง ข้อมูลชุดใดสนับสนุนข้อสรุปนี้ได้หนักแน่นที่สุด","choices":["อัตราการว่างงานสูงขึ้นพร้อมกันเกือบทุกอุตสาหกรรมและทุกระดับทักษะ ขณะที่ผลผลิตที่แท้จริงต่ำกว่าระดับศักยภาพ และตำแหน่งงานว่างต่อผู้ว่างงานลดลงทั่วทั้งระบบ","อัตราการว่างงานสูงขึ้นเฉพาะในอุตสาหกรรมที่ถูกเทคโนโลยีใหม่เข้ามาทดแทน ขณะที่อุตสาหกรรมอื่นยังประกาศรับสมัครงานจำนวนมากและขึ้นค่าจ้างเพื่อแย่งแรงงาน","สัดส่วนแรงงานที่ว่างงานเกินหนึ่งปีเพิ่มขึ้นอย่างชัดเจน ขณะที่ตำแหน่งงานว่างในระบบยังมีจำนวนมากแต่ไม่มีผู้สมัครที่มีคุณสมบัติตรงตามที่นายจ้างต้องการ","ค่าจ้างขั้นต่ำถูกปรับขึ้นอย่างมีนัยสำคัญในปีเดียวกัน และการว่างงานกระจุกตัวอยู่ในกลุ่มแรงงานอายุน้อยที่มีทักษะต่ำเป็นหลัก ส่วนกลุ่มอื่นแทบไม่เปลี่ยน"],"answer":0,"a":"การว่างงานตามวัฏจักรมาจากอุปสงค์รวมที่ตกต่ำ ลายเซ็นของมันจึงเป็นความ “กว้าง” คือกระทบทุกอุตสาหกรรมและทุกระดับทักษะพร้อมกัน ประกอบกับผลผลิตที่แท้จริงต่ำกว่าศักยภาพ (อยู่ซ้ายของ LRAS) และตำแหน่งงานว่างหดตัวทั้งระบบ ตรงข้ามกับการว่างงานตามโครงสร้างซึ่ง “แคบและลึก” คือกระจุกในบางอุตสาหกรรมหรือบางทักษะ ขณะที่ตำแหน่งงานว่างในที่อื่นยังมีอยู่แต่จับคู่กันไม่ได้","whys":["ถูกต้อง — ความกว้างของผลกระทบบวกกับช่องว่างการหดตัวคือหลักฐานที่ชี้ไปที่ฝั่งอุปสงค์อย่างชัดเจน","ไม่ถูกต้อง — รูปแบบที่กระจุกในอุตสาหกรรมเดียวขณะที่อุตสาหกรรมอื่นแย่งแรงงานกัน คือลายเซ็นของการว่างงานตามโครงสร้างโดยตรง","ไม่ถูกต้อง — ตำแหน่งงานว่างเหลือเฟือแต่ไม่มีคนคุณสมบัติตรง คือปัญหาการจับคู่ทักษะ ซึ่งเป็นการว่างงานตามโครงสร้าง ไม่ใช่ตามวัฏจักร","ไม่ถูกต้อง — การว่างงานที่มาจากค่าจ้างที่ถูกตรึงเหนือดุลยภาพและกระจุกในกลุ่มทักษะต่ำ เป็นการว่างงานตามโครงสร้างตามแบบจำลองค่าจ้างขั้นต่ำ"]},{"id":"U05","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"อัตราธรรมชาติที่เปลี่ยนไปกับตำแหน่งของ LRAS","q":"แพลตฟอร์มจับคู่งานออนไลน์ที่มีประสิทธิภาพสูงถูกใช้อย่างแพร่หลาย ทำให้ระยะเวลาเฉลี่ยในการหางานของแรงงานสั้นลงอย่างถาวร ผลต่ออัตราการว่างงานตามธรรมชาติและต่อแบบจำลอง AD-AS เป็นอย่างไร","choices":["อัตราการว่างงานตามธรรมชาติลดลงเพราะการว่างงานชั่วคราวลดลง ผลผลิต ณ การจ้างงานเต็มที่จึงสูงขึ้น และเส้น LRAS เลื่อนไปทางขวาอย่างถาวร","อัตราการว่างงานตามธรรมชาติลดลงเพราะการว่างงานชั่วคราวลดลง แต่เส้น LRAS ไม่ขยับ เพราะการจับคู่งานเป็นเรื่องของข้อมูลข่าวสารไม่ใช่ปัจจัยการผลิต","อัตราการว่างงานตามธรรมชาติไม่เปลี่ยน เพราะการว่างงานชั่วคราวเป็นสิ่งที่หลีกเลี่ยงไม่ได้เสมอ ส่วนเส้น AD จะเลื่อนขวาจากรายได้ของแรงงานที่เพิ่มขึ้น","อัตราการว่างงานตามธรรมชาติเพิ่มขึ้นเพราะแรงงานเลือกงานได้มากขึ้นจึงใช้เวลาตัดสินใจนานขึ้น และเส้น LRAS เลื่อนไปทางซ้ายตามกำลังแรงงานที่หดตัว"],"answer":0,"a":"อัตราธรรมชาติ = การว่างงานชั่วคราว + การว่างงานตามโครงสร้าง เมื่อการจับคู่งานเร็วขึ้นอย่างถาวร ส่วนที่เป็น frictional ลดลง อัตราธรรมชาติจึงต่ำลง และเนื่องจากผลผลิต ณ การจ้างงานเต็มที่ถูกนิยามที่อัตราธรรมชาตินี้เอง การที่อัตราธรรมชาติลดลงหมายความว่าประเทศใช้แรงงานได้เต็มเม็ดเต็มหน่วยขึ้น ผลผลิตศักยภาพจึงสูงขึ้นและ LRAS เลื่อนขวา นี่คือตัวอย่างชัดเจนของนโยบายด้านอุปทานที่เพิ่มผลผลิตได้อย่างถาวร","whys":["ถูกต้อง — เชื่อมโยงครบวงจรจากกลไกจับคู่งาน สู่อัตราธรรมชาติ สู่ผลผลิตศักยภาพ และสู่ตำแหน่งของ LRAS","ไม่ถูกต้อง — LRAS ถูกกำหนดที่ผลผลิต ณ การจ้างงานเต็มที่ เมื่ออัตราธรรมชาติต่ำลง ผลผลิตนั้นย่อมสูงขึ้น เส้นจึงต้องเลื่อน","ไม่ถูกต้อง — การว่างงานชั่วคราวไม่มีวันเป็นศูนย์ก็จริง แต่ “ลดลงได้” กับ “หมดไป” เป็นคนละเรื่อง และสไลด์ระบุเองว่ารัฐลดมันได้","ไม่ถูกต้อง — การค้นหาที่มีประสิทธิภาพขึ้นทำให้จับคู่ได้เร็วขึ้น ไม่ใช่ช้าลง และกำลังแรงงานก็ไม่ได้หดตัวจากการมีแพลตฟอร์ม"],"tip":"ข้อสอบชั้นดีจะเชื่อมบทว่างงานเข้ากับ AD-AS เสมอ — จำโซ่นี้: อัตราธรรมชาติ ↔ ผลผลิตการจ้างงานเต็มที่ ↔ ตำแหน่งของ LRAS"},{"id":"U06","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"ค่าจ้างขั้นต่ำที่ผูกพันและไม่ผูกพัน","q":"ในเมืองหนึ่ง ตลาดแรงงานทักษะต่ำมีค่าจ้างดุลยภาพ 320 บาทต่อวัน ส่วนตลาดแรงงานทักษะสูงมีค่าจ้างดุลยภาพ 900 บาทต่อวัน หากรัฐประกาศค่าจ้างขั้นต่ำที่ 400 บาทต่อวัน ผลที่เกิดขึ้นในสองตลาดเป็นอย่างไร","choices":["ตลาดทักษะต่ำเกิดอุปทานแรงงานส่วนเกินเพราะกฎหมายผูกพันจริง ส่วนตลาดทักษะสูงไม่เปลี่ยนแปลงเพราะค่าจ้างดุลยภาพสูงกว่าเพดานที่ประกาศอยู่แล้ว","ทั้งสองตลาดเกิดอุปทานแรงงานส่วนเกินในสัดส่วนที่เท่ากัน เพราะกฎหมายค่าจ้างขั้นต่ำมีผลบังคับใช้กับนายจ้างทุกรายในเมืองอย่างเสมอภาคกัน","ตลาดทักษะต่ำไม่เปลี่ยนแปลงเพราะนายจ้างจะเลี่ยงไปจ้างนอกระบบ ส่วนตลาดทักษะสูงเกิดการขาดแคลนแรงงานเพราะคนย้ายไปหางานที่ได้ค่าจ้างขั้นต่ำแทน","ตลาดทักษะต่ำเกิดการขาดแคลนแรงงานเพราะค่าจ้างที่สูงขึ้นจูงใจนายจ้างให้จ้างมากขึ้น ส่วนตลาดทักษะสูงเกิดอุปทานส่วนเกินจากแรงงานที่ย้ายเข้ามา"],"answer":0,"a":"ค่าจ้างขั้นต่ำสร้างการว่างงานได้ก็ต่อเมื่อถูกกำหนดไว้เหนือค่าจ้างดุลยภาพของตลาดนั้น ซึ่งเรียกว่า “ผูกพัน (binding)”\nตลาดทักษะต่ำ — ดุลยภาพ 320 บาท ต่ำกว่าเพดาน 400 บาท กฎหมายจึงดันค่าจ้างขึ้น ปริมาณอุปสงค์แรงงานลดลงและอุปทานเพิ่มขึ้น เกิดส่วนเกิน = การว่างงาน\nตลาดทักษะสูง — ดุลยภาพ 900 บาท สูงกว่าเพดานมาก กฎหมายจึงไม่ผูกพันและไม่มีผลใด ๆ ต่อตลาดนี้\nนี่คือเหตุผลเชิงทฤษฎีว่าทำไมค่าจ้างขั้นต่ำจึงอธิบายการว่างงานของวัยรุ่นได้ดีกว่าของบัณฑิตปริญญา","whys":["ถูกต้อง — ผลของกฎหมายขึ้นกับว่ามันอยู่เหนือหรือต่ำกว่าดุลยภาพของแต่ละตลาด ไม่ได้ขึ้นกับว่ากฎหมายครอบคลุมใครบ้าง","ไม่ถูกต้อง — ความครอบคลุมทางกฎหมายกับการมีผลทางเศรษฐกิจเป็นคนละเรื่อง กฎที่กำหนดต่ำกว่าดุลยภาพจะไม่เปลี่ยนพฤติกรรมใด ๆ ของตลาด","ไม่ถูกต้อง — แบบจำลองสมมติว่ากฎหมายถูกบังคับใช้จริง และแรงงานทักษะสูงย่อมไม่ย้ายไปรับ 400 บาทในเมื่อตลาดของตนให้ 900 บาท","ไม่ถูกต้อง — สลับทิศทางทั้งคู่ ค่าจ้างที่สูงขึ้นทำให้นายจ้างจ้างน้อยลง จึงเกิดส่วนเกินด้านอุปทาน ไม่ใช่การขาดแคลนแรงงาน"],"tip":"ก่อนตอบโจทย์ค่าจ้างขั้นต่ำทุกข้อ ให้เทียบตัวเลขสองตัวก่อน: ค่าจ้างขั้นต่ำ เทียบกับ ค่าจ้างดุลยภาพของตลาดนั้น ถ้าต่ำกว่า แปลว่าไม่มีผล"},{"id":"U07","type":"mcq","lvl":3,"topic":"การว่างงาน","ref":"กลไกของค่าจ้างประสิทธิภาพ","q":"บริษัทแห่งหนึ่งขึ้นค่าจ้างเหนือระดับตลาด 15% แล้วพบว่าอัตราการลาออกลดลงจาก 30% เหลือ 8% ต่อปี และต้นทุนการสรรหากับฝึกอบรมพนักงานใหม่ลดลงมาก จนกำไรรวมสูงขึ้น กลไกใดของทฤษฎีค่าจ้างประสิทธิภาพอธิบายกรณีนี้ตรงที่สุด","choices":["การเคลื่อนย้ายเข้าออกของแรงงาน เพราะค่าจ้างที่สูงกว่าตลาดทำให้พนักงานไม่อยากลาออก บริษัทจึงประหยัดต้นทุนการสรรหาและการฝึกอบรมคนใหม่ได้มาก","สุขภาพของแรงงาน เพราะค่าจ้างที่สูงขึ้นทำให้พนักงานมีโภชนาการดีขึ้น ร่างกายแข็งแรงขึ้น จึงทำงานได้มีประสิทธิผลมากกว่าเดิมและลาป่วยน้อยลง","คุณภาพของแรงงาน เพราะค่าจ้างที่สูงกว่าตลาดดึงดูดผู้สมัครที่มีความสามารถสูงกว่าเดิม บริษัทจึงคัดเลือกคนเก่งเข้ามาทำงานได้มากขึ้นกว่าคู่แข่ง","ความพยายามของแรงงาน เพราะค่าจ้างที่สูงทำให้พนักงานกลัวเสียงานดี จึงตั้งใจทำงานมากขึ้นและลดการหลีกเลี่ยงงานลงอย่างเห็นได้ชัดเจน"],"answer":0,"a":"ทฤษฎีค่าจ้างประสิทธิภาพให้เหตุผลไว้สี่ทาง คือ สุขภาพของแรงงาน · การเคลื่อนย้ายเข้าออกของแรงงาน · คุณภาพของแรงงาน · และความพยายามของแรงงาน ทั้งสี่ข้อล้วนถูกต้องในตัวมันเอง แต่หลักฐานในโจทย์ชี้ไปที่ข้อเดียว คือตัวเลขอัตราการลาออกที่ดิ่งจาก 30% เหลือ 8% และต้นทุนการสรรหาที่ลดลง ซึ่งเป็นการวัด worker turnover โดยตรง ส่วนกลไกอื่นแม้อาจเกิดขึ้นด้วย แต่โจทย์ไม่ได้ให้หลักฐานรองรับ","whys":["ถูกต้อง — ตัวเลขอัตราการลาออกและต้นทุนการสรรหาเป็นหลักฐานที่ชี้ตรงไปที่กลไก worker turnover","ไม่ถูกต้อง — เป็นกลไกจริงของทฤษฎีนี้ แต่โจทย์ไม่ได้ให้ข้อมูลเรื่องสุขภาพ โภชนาการ หรือการลาป่วยของพนักงานเลย","ไม่ถูกต้อง — เป็นกลไกจริงของทฤษฎีนี้ แต่โจทย์ไม่ได้กล่าวถึงคุณภาพของผู้สมัครหรือการเปลี่ยนแปลงในกระบวนการคัดเลือกแต่อย่างใด","ไม่ถูกต้อง — เป็นกลไกจริงของทฤษฎีนี้ แต่โจทย์วัดที่การลาออก ไม่ได้วัดผลิตภาพต่อคนหรือพฤติกรรมการหลีกเลี่ยงงานของพนักงาน"],"tip":"เมื่อทุกตัวเลือกเป็นทฤษฎีที่ถูกต้องทั้งหมด ให้เลือกข้อที่ หลักฐานในโจทย์รองรับ — นี่คือทักษะที่ข้อสอบระดับสูงต้องการวัด"},{"id":"U08","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"ผลข้ามภาคของสหภาพแรงงาน","q":"ในประเทศหนึ่ง สหภาพแรงงานในภาคอุตสาหกรรมหนักเจรจาขึ้นค่าจ้างได้สูงกว่าระดับดุลยภาพอย่างมาก ขณะที่ภาคบริการไม่มีสหภาพเลย ผลที่คาดว่าจะเกิดขึ้นกับทั้งสองภาคเป็นอย่างไร","choices":["ภาคอุตสาหกรรมหนักจ้างงานน้อยลงและเกิดการว่างงาน แรงงานส่วนเกินไหลไปเสนอตัวในภาคบริการ ทำให้อุปทานแรงงานที่นั่นเพิ่มขึ้นและค่าจ้างถูกกดลง","ภาคอุตสาหกรรมหนักจ้างงานเท่าเดิมเพราะสัญญาจ้างคุ้มครองไว้ ส่วนภาคบริการต้องขึ้นค่าจ้างตามเพื่อรักษาแรงงานไว้ ทำให้ค่าจ้างทั้งประเทศสูงขึ้นพร้อมกัน","ภาคอุตสาหกรรมหนักจ้างงานมากขึ้นเพราะค่าจ้างที่สูงจูงใจให้แรงงานมีผลิตภาพสูงขึ้น ส่วนภาคบริการสูญเสียแรงงานจนเกิดภาวะขาดแคลนคนทำงานรุนแรง","ทั้งสองภาคไม่เปลี่ยนแปลงในระยะยาว เพราะแรงงานจะเคลื่อนย้ายไปมาจนค่าจ้างสองภาคเท่ากันโดยอัตโนมัติ และอัตราการว่างงานตามธรรมชาติคงเดิม"],"answer":0,"a":"เมื่อค่าจ้างในภาคที่มีสหภาพถูกดันขึ้นเหนือดุลยภาพ ปริมาณอุปสงค์แรงงานในภาคนั้นลดลง เกิดการว่างงานแบบโครงสร้าง แรงงานที่ถูกกันออกไม่ได้หายไปจากระบบแต่ย้ายไปเสนอตัวในภาคที่ไม่มีสหภาพ ทำให้อุปทานแรงงานที่นั่นเพิ่มขึ้นและกดค่าจ้างลง ผลสุทธิตามที่สไลด์ระบุคือ แรงงานในสหภาพได้ประโยชน์จากการเจรจาต่อรองร่วม ส่วนแรงงานนอกสหภาพแบกรับต้นทุนบางส่วน และอัตราการว่างงานตามธรรมชาติของประเทศสูงขึ้น","whys":["ถูกต้อง — จับได้ทั้งผลในภาคที่มีสหภาพและผลกระทบล้นข้ามไปยังภาคที่ไม่มีสหภาพ ซึ่งเป็นประเด็นหลักของหัวข้อนี้","ไม่ถูกต้อง — สัญญาจ้างคุ้มครองคนที่ยังอยู่ในงาน แต่ไม่ได้บังคับให้นายจ้างจ้างเพิ่มหรือห้ามลดตำแหน่งในระยะยาว การจ้างงานจึงลดลง","ไม่ถูกต้อง — แม้ค่าจ้างที่สูงอาจเพิ่มผลิตภาพได้บ้าง แต่ในแบบจำลองนี้ค่าจ้างเหนือดุลยภาพทำให้ปริมาณการจ้างงานลดลง ไม่ใช่เพิ่มขึ้น","ไม่ถูกต้อง — ค่าจ้างในภาคสหภาพถูกตรึงไว้ด้วยการเจรจา จึงไม่ปรับลงมาเท่ากับภาคอื่น ส่วนต่างและการว่างงานจึงคงอยู่ต่อไป"]},{"id":"U09","type":"mcq","lvl":3,"topic":"การว่างงาน","ref":"สถาบันตลาดแรงงานกับอัตราธรรมชาติ","q":"รัฐบาลขยายโครงการประกันการว่างงานให้จ่ายเงินชดเชยสูงขึ้นและนานขึ้นอย่างมาก โดยไม่มีเงื่อนไขเร่งรัดให้รับงานที่เสนอมา ผลที่ทฤษฎีคาดการณ์ต่ออัตราการว่างงานตามธรรมชาติและต่อสวัสดิการเป็นอย่างไร","choices":["อัตราธรรมชาติมีแนวโน้มสูงขึ้นเพราะผู้ว่างงานใช้เวลาค้นหางานนานขึ้น แต่การจับคู่งานอาจมีคุณภาพดีขึ้นและครัวเรือนเผชิญความเสี่ยงด้านรายได้น้อยลง","อัตราธรรมชาติลดลงเพราะเงินชดเชยช่วยให้ผู้ว่างงานมีกำลังซื้อและเดินทางไปสัมภาษณ์งานได้มากขึ้น การจับคู่งานจึงเกิดเร็วขึ้นกว่าเดิมอย่างชัดเจน","อัตราธรรมชาติไม่เปลี่ยนแปลงเพราะเงินชดเชยเป็นเงินโอนซึ่งไม่ถูกนับในรายจ่ายรัฐบาล จึงไม่มีผลต่อตัวแปรที่แท้จริงใด ๆ ในระบบเศรษฐกิจ","อัตราธรรมชาติสูงขึ้นและสวัสดิการของสังคมลดลงแน่นอนทุกกรณี เพราะการว่างงานที่นานขึ้นทำให้ทักษะของแรงงานเสื่อมถอยลงอย่างรวดเร็วเสมอ"],"answer":0,"a":"ประกันการว่างงานที่ใจกว้างขึ้นลดต้นทุนของการว่างงานต่อไปอีกหนึ่งสัปดาห์ ผู้ว่างงานจึงมีแรงจูงใจจะค้นหาต่อแทนที่จะรีบรับงานแรกที่เสนอมา ระยะเวลาว่างงานเฉลี่ยยาวขึ้น การว่างงานชั่วคราวเพิ่ม และอัตราธรรมชาติสูงขึ้น อย่างไรก็ตาม ข้อสรุปเชิงสวัสดิการไม่ได้เป็นลบเสมอไป เพราะเวลาค้นหาที่มากขึ้นอาจทำให้จับคู่คนกับงานได้เหมาะสมกว่า และช่วยกระจายความเสี่ยงด้านรายได้ให้ครัวเรือน — การชั่งน้ำหนักสองด้านนี้คือคำตอบระดับที่ข้อสอบต้องการ","whys":["ถูกต้อง — ระบุทั้งผลต่ออัตราธรรมชาติและข้อดีเชิงสวัสดิการที่หักล้างกันอยู่ โดยไม่ตัดสินด้านเดียว","ไม่ถูกต้อง — ผลด้านสภาพคล่องมีอยู่จริงแต่เล็กกว่าผลด้านแรงจูงใจมาก โดยรวมระยะเวลาค้นหางานจึงยาวขึ้น ไม่ใช่สั้นลง","ไม่ถูกต้อง — เงินโอนไม่ถูกนับใน G ก็จริง แต่มันเปลี่ยนแรงจูงใจของผู้ว่างงานโดยตรง จึงกระทบตัวแปรที่แท้จริงอย่างชัดเจน","ไม่ถูกต้อง — ทิศทางของอัตราธรรมชาติถูก แต่การสรุปว่าสวัสดิการลดลง “แน่นอนทุกกรณี” เกินกว่าที่ทฤษฎีจะรับรองได้"]},{"id":"U10","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"ตัวเลขว่างงานดีขึ้นแต่ตลาดแรงงานแย่ลง","q":"จากตารางข้อมูลตลาดแรงงานสองปีของประเทศหนึ่ง (ประชากรวัยผู้ใหญ่คงที่ 50.0 ล้านคน) ข้อใดสรุปได้ถูกต้องที่สุด","choices":["อัตราการว่างงานลดจาก 6.25% เหลือ 5.16% แต่การจ้างงานและอัตราการมีส่วนร่วมต่างก็ลดลง ตัวเลขที่ดูดีขึ้นจึงมาจากคนที่ออกจากกำลังแรงงาน ไม่ใช่จากการจ้างงานที่ฟื้น","อัตราการว่างงานลดจาก 6.25% เหลือ 5.16% พร้อมกับอัตราการมีส่วนร่วมที่เพิ่มขึ้น แสดงว่าตลาดแรงงานฟื้นตัวจริงและเศรษฐกิจน่าจะอยู่ในช่วงขยายตัวอย่างชัดเจน","อัตราการว่างงานเพิ่มจาก 6.25% เป็น 7.14% เพราะผู้มีงานทำลดลง 0.6 ล้านคน ซึ่งสะท้อนว่าเศรษฐกิจกำลังเข้าสู่ภาวะหดตัวและมีการเลิกจ้างเป็นวงกว้าง","อัตราการว่างงานลดจาก 6.25% เหลือ 5.16% และสัดส่วนผู้มีงานทำต่อประชากรเพิ่มขึ้นด้วย จึงสรุปได้ว่าทั้งสองสถิติชี้ไปในทิศทางเดียวกันคือดีขึ้น"],"answer":0,"a":"ปีที่ 1 กำลังแรงงาน = 32.0 · u = 2.0 ÷ 32.0 = 6.25% · LFPR = 32.0 ÷ 50.0 = 64.0% · EP = 30.0 ÷ 50.0 = 60.0%\nปีที่ 2 กำลังแรงงาน = 31.0 · u = 1.6 ÷ 31.0 = 5.16% · LFPR = 31.0 ÷ 50.0 = 62.0% · EP = 29.4 ÷ 50.0 = 58.8%\nอัตราการว่างงานดูดีขึ้นกว่าหนึ่งจุด แต่ผู้มีงานทำหายไป 0.6 ล้านคน และผู้ไม่อยู่ในกำลังแรงงานเพิ่มขึ้น 1.0 ล้านคน แปลว่าคนที่หายไปจากกลุ่มผู้ว่างงานไม่ได้ไปมีงานทำ แต่เลิกหางาน ตลาดแรงงานจึงแย่ลง ไม่ใช่ดีขึ้น","whys":["ถูกต้อง — อ่านสามสถิติพร้อมกันแล้วเห็นว่าการว่างงานที่ลดลงมาจากการถอนตัวออกจากกำลังแรงงาน ไม่ใช่จากการจ้างงานที่เพิ่มขึ้น","ไม่ถูกต้อง — อัตราการมีส่วนร่วมลดลงจาก 64.0% เหลือ 62.0% ไม่ได้เพิ่มขึ้น จึงสรุปว่าตลาดแรงงานฟื้นตัวไม่ได้","ไม่ถูกต้อง — คำนวณผิด อัตราการว่างงานปีที่ 2 คือ 1.6 ÷ 31.0 = 5.16% ซึ่งลดลง แม้ว่าผู้มีงานทำจะลดลงจริงก็ตาม","ไม่ถูกต้อง — สัดส่วนผู้มีงานทำต่อประชากรลดลงจาก 60.0% เหลือ 58.8% สองสถิติจึงชี้คนละทิศทาง ไม่ใช่ทิศทางเดียวกัน"],"tip":"นี่คือข้อสอบที่แยกคนได้เก่งที่สุดของบทนี้ — เจอตารางสองปี ให้คำนวณ u, LFPR และ EP ratio ครบทั้งสามตัว ก่อนอ่านตัวเลือก","fig":"<div class=\"tablewrap\"><table class=\"data\">\n  <tr><th>รายการ (ล้านคน)</th><th>ปีที่ 1</th><th>ปีที่ 2</th></tr>\n  <tr><td>ผู้มีงานทำ</td><td>30.0</td><td>29.4</td></tr>\n  <tr><td>ผู้ว่างงาน</td><td>2.0</td><td>1.6</td></tr>\n  <tr><td>ผู้ไม่อยู่ในกำลังแรงงาน</td><td>18.0</td><td>19.0</td></tr>\n </table></div>"},{"id":"U11","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"เชื่อมช่องว่างผลผลิตกับการว่างงานตามวัฏจักร","q":"เศรษฐกิจหนึ่งมีผลผลิตที่แท้จริงต่ำกว่าผลผลิตศักยภาพอยู่ราว 3% และอัตราการว่างงานจริงอยู่ที่ 8.5% ขณะที่อัตราการว่างงานตามธรรมชาติประมาณไว้ที่ 5.0% ข้อใดตีความสถานการณ์นี้ได้ถูกต้อง","choices":["มีการว่างงานตามวัฏจักรประมาณ 3.5 จุด สอดคล้องกับช่องว่างการหดตัว และดุลยภาพระยะสั้นอยู่ทางซ้ายของเส้น LRAS ในแบบจำลอง AD-AS","มีการว่างงานตามโครงสร้างประมาณ 3.5 จุด สอดคล้องกับช่องว่างเงินเฟ้อ และดุลยภาพระยะสั้นอยู่ทางขวาของเส้น LRAS ในแบบจำลอง AD-AS","มีการว่างงานตามวัฏจักรประมาณ 8.5 จุด เพราะอัตราการว่างงานจริงทั้งหมดเกิดจากอุปสงค์รวมที่ตกต่ำในช่วงที่เศรษฐกิจกำลังหดตัวลงอย่างต่อเนื่อง","ไม่มีการว่างงานตามวัฏจักรเลย เพราะอัตราการว่างงานตามธรรมชาติเป็นเพียงค่าประมาณ จึงไม่สามารถนำมาเปรียบเทียบกับอัตราการว่างงานจริงได้"],"answer":0,"a":"การว่างงานตามวัฏจักรคือส่วนต่างระหว่างอัตราการว่างงานจริงกับอัตราธรรมชาติ = 8.5% − 5.0% = 3.5 จุด ส่วนอีก 5.0 จุดคืออัตราธรรมชาติซึ่งประกอบด้วยการว่างงานชั่วคราวและตามโครงสร้าง\nเมื่ออัตราการว่างงานจริงสูงกว่าอัตราธรรมชาติ แปลว่าเศรษฐกิจใช้ทรัพยากรต่ำกว่าศักยภาพ ซึ่งตรงกับข้อมูลที่ว่าผลผลิตต่ำกว่าศักยภาพ 3% ในแบบจำลอง AD-AS นี่คือช่องว่างการหดตัว ดุลยภาพระยะสั้นจึงอยู่ทางซ้ายของ LRAS และกลไกปรับตัวเองจะกดค่าจ้างกับราคาลงจน SRAS เลื่อนลง","whys":["ถูกต้อง — เชื่อมสามภาษาเข้าด้วยกันครบ ทั้งส่วนต่างอัตราการว่างงาน ช่องว่างผลผลิต และตำแหน่งเทียบเส้น LRAS","ไม่ถูกต้อง — ส่วนต่างที่เกินอัตราธรรมชาติคือการว่างงานตามวัฏจักร ไม่ใช่ตามโครงสร้าง และผลผลิตที่ต่ำกว่าศักยภาพคือช่องว่างการหดตัว ไม่ใช่เงินเฟ้อ","ไม่ถูกต้อง — อัตราการว่างงานจริง 8.5% รวมอัตราธรรมชาติ 5.0% อยู่ด้วยแล้ว ส่วนที่เป็นวัฏจักรมีเพียง 3.5 จุดเท่านั้น","ไม่ถูกต้อง — อัตราธรรมชาติเป็นค่าประมาณก็จริง แต่เป็นเกณฑ์อ้างอิงมาตรฐานที่ใช้แยกการว่างงานตามวัฏจักรออกจากส่วนที่เหลือเสมอ"],"tip":"สูตรที่ต้องติดหัว: การว่างงานตามวัฏจักร = อัตราจริง − อัตราธรรมชาติ ค่าบวก = ช่องว่างการหดตัว · ค่าลบ = ช่องว่างเงินเฟ้อ"},{"id":"U12","type":"mcq","lvl":3,"topic":"การว่างงาน","ref":"การว่างงานแอบแฝงกับผลิตภาพส่วนเพิ่ม","q":"ในหมู่บ้านเกษตรแห่งหนึ่ง เมื่อแรงงาน 4 คนจากทั้งหมด 12 คนย้ายเข้าเมืองไปทำงาน ผลผลิตข้าวของหมู่บ้านลดลงเพียง 2% ข้อมูลนี้บ่งชี้ถึงอะไร และมีนัยอย่างไรต่อการวัดการว่างงาน","choices":["บ่งชี้การว่างงานแอบแฝง เพราะผลิตภาพส่วนเพิ่มของแรงงานที่ย้ายออกเข้าใกล้ศูนย์ แต่สถิติทางการจะนับคนเหล่านี้เป็นผู้มีงานทำตลอดเวลาที่ยังอยู่ในหมู่บ้าน","บ่งชี้การว่างงานตามฤดูกาล เพราะการย้ายถิ่นของแรงงานเกษตรเกิดขึ้นเป็นรอบตามช่วงเพาะปลูกและเก็บเกี่ยว สถิติทางการจึงนับคนเหล่านี้เป็นผู้ว่างงานชั่วคราว","บ่งชี้การว่างงานตามโครงสร้าง เพราะทักษะการทำนาไม่ตรงกับความต้องการของเศรษฐกิจสมัยใหม่ สถิติทางการจึงนับคนเหล่านี้เป็นผู้ไม่อยู่ในกำลังแรงงาน","บ่งชี้ว่าเทคโนโลยีการเกษตรก้าวหน้าขึ้นมาก เพราะใช้แรงงานน้อยลงแต่ผลผลิตแทบไม่ลด สถิติทางการจึงสะท้อนภาพตลาดแรงงานได้อย่างถูกต้องครบถ้วนแล้ว"],"answer":0,"a":"เมื่อถอนแรงงานหนึ่งในสามออกไปแล้วผลผลิตลดเพียง 2% แปลว่าผลิตภาพส่วนเพิ่มของแรงงานเหล่านั้นแทบเป็นศูนย์ พวกเขา “มีงานทำ” ในทางสถิติ แต่แทบไม่ได้เพิ่มผลผลิตให้ระบบเลย นี่คือนิยามของการว่างงานแอบแฝง ซึ่งสไลด์ระบุว่าเกิดจากการมีคนงานมากเกินความจำเป็น โดยเฉพาะในการผลิตแบบเกษตรที่ใช้แรงงานจากครัวเรือนเดียวกัน ผลคือสถิติการว่างงานของประเทศกำลังพัฒนามักดูต่ำเกินจริง","whys":["ถูกต้อง — ผลิตภาพส่วนเพิ่มที่เข้าใกล้ศูนย์คือลายเซ็นของการว่างงานแอบแฝง และอธิบายได้ว่าทำไมสถิติจึงมองไม่เห็น","ไม่ถูกต้อง — โจทย์ไม่ได้ระบุว่าเป็นการย้ายถิ่นตามรอบฤดูกาล และคนที่ทำงานอยู่ในฟาร์มครอบครัวถูกนับเป็นผู้มีงานทำ ไม่ใช่ผู้ว่างงาน","ไม่ถูกต้อง — คนเหล่านี้ไม่ได้กำลังหางานใหม่และไม่ได้ถูกเลิกจ้าง จึงไม่ใช่การว่างงานตามโครงสร้าง และก็ไม่ได้อยู่นอกกำลังแรงงาน","ไม่ถูกต้อง — ผลผลิตที่แทบไม่ลดมาจากการที่แรงงานส่วนเกินไม่ได้เพิ่มผลผลิตอยู่แล้ว ไม่ใช่จากเทคโนโลยี และสถิติก็ไม่ได้สะท้อนภาพจริง"]},{"id":"U13","type":"mcq","lvl":3,"topic":"การว่างงาน","ref":"ข้อมูลปรับฤดูกาลกับการตีความ","q":"สำนักงานสถิติรายงานว่าในเดือนธันวาคม จำนวนผู้มีงานทำที่ยังไม่ปรับฤดูกาลเพิ่มขึ้นมาก แต่ตัวเลขที่ปรับฤดูกาลแล้วกลับลดลงเล็กน้อย ข้อใดตีความได้ถูกต้อง","choices":["การจ้างงานเพิ่มขึ้นน้อยกว่าที่ควรเป็นสำหรับเดือนธันวาคมซึ่งปกติมีการจ้างงานตามเทศกาล เมื่อหักรูปแบบตามฤดูกาลออกแล้วตลาดแรงงานจึงอ่อนแอลงจริง","การจ้างงานเพิ่มขึ้นมากกว่าปกติสำหรับเดือนธันวาคม จึงควรใช้ตัวเลขที่ยังไม่ปรับฤดูกาลเป็นหลักในการประเมินภาวะตลาดแรงงานในช่วงเวลานี้","ตัวเลขทั้งสองชุดขัดแย้งกันเองจนใช้ประเมินอะไรไม่ได้ ควรรอข้อมูลของเดือนถัดไปก่อนจึงจะสรุปทิศทางของตลาดแรงงานได้อย่างน่าเชื่อถือ","การปรับฤดูกาลเป็นการแทรกแซงตัวเลขจริงโดยไม่จำเป็น ตัวเลขดิบที่ยังไม่ปรับจึงสะท้อนสภาพตลาดแรงงานที่แท้จริงได้ตรงกว่าเสมอ"],"answer":0,"a":"การจ้างงานมีรูปแบบซ้ำเดิมทุกปี เช่น ห้างและโลจิสติกส์จ้างคนเพิ่มในเดือนธันวาคม การปรับฤดูกาลคือการหักรูปแบบที่คาดการณ์ได้นี้ออก เพื่อให้เห็นการเปลี่ยนแปลงที่เกินกว่าปกติ เมื่อตัวเลขดิบเพิ่มแต่ตัวเลขที่ปรับแล้วลดลง แปลว่าปีนี้จ้างเพิ่มน้อยกว่าที่เดือนธันวาคมทั่วไปควรจะเป็น สัญญาณพื้นฐานจึงอ่อนแอลง ตัวเลขที่ปรับฤดูกาลแล้วคือตัวที่ควรใช้ตัดสินแนวโน้ม","whys":["ถูกต้อง — เปรียบเทียบกับรูปแบบตามฤดูกาลที่คาดไว้ แล้วสรุปว่าส่วนที่เหลือคือสัญญาณพื้นฐานที่อ่อนแอลง","ไม่ถูกต้อง — ถ้าเพิ่มมากกว่าปกติ ตัวเลขที่ปรับฤดูกาลแล้วจะต้องเพิ่มขึ้น ไม่ใช่ลดลงอย่างที่โจทย์ระบุ","ไม่ถูกต้อง — ตัวเลขสองชุดไม่ได้ขัดแย้งกัน แต่ตอบคนละคำถาม ชุดหนึ่งบอกการเปลี่ยนแปลงดิบ อีกชุดบอกการเปลี่ยนแปลงเทียบรูปแบบปกติ","ไม่ถูกต้อง — การปรับฤดูกาลเป็นวิธีมาตรฐานทางสถิติที่จำเป็น เพราะตัวเลขดิบจะทำให้เข้าใจผิดทุกครั้งที่เปรียบเทียบข้ามเดือน"]},{"id":"U14","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"การว่างงานยืดเยื้อกับผลผลิตศักยภาพ","q":"ประเทศหนึ่งเผชิญภาวะถดถอยรุนแรงติดต่อกันหลายปี จนแรงงานจำนวนมากว่างงานเกินสองปี ทักษะเสื่อมถอย และนายจ้างลังเลที่จะรับคนที่ว่างงานนาน ข้อใดอธิบายผลระยะยาวที่เป็นไปได้ในแบบจำลอง AD-AS","choices":["การว่างงานตามวัฏจักรบางส่วนแปรสภาพเป็นการว่างงานตามโครงสร้าง อัตราธรรมชาติจึงสูงขึ้น ผลผลิตศักยภาพลดลง และเส้น LRAS อาจเลื่อนไปทางซ้าย","การว่างงานตามวัฏจักรจะหายไปเองเมื่ออุปสงค์รวมฟื้น อัตราธรรมชาติและตำแหน่งของเส้น LRAS จึงกลับสู่ระดับเดิมทุกประการโดยไม่ทิ้งร่องรอยใด ๆ ไว้","การว่างงานที่ยืดเยื้อทำให้ค่าจ้างลดลงมาก ต้นทุนการผลิตจึงถูกลงอย่างถาวร ส่งผลให้เส้น LRAS เลื่อนไปทางขวาและผลผลิตศักยภาพสูงขึ้นในระยะยาว","การว่างงานที่ยืดเยื้อกระทบเฉพาะเส้น AD เท่านั้น เพราะรายได้ครัวเรือนที่หายไปทำให้การบริโภคลดลง ส่วนฝั่งอุปทานทั้งสองเส้นไม่ได้รับผลกระทบเลย"],"answer":0,"a":"โดยปกติแบบจำลองแยกฝั่งอุปสงค์กับฝั่งอุปทานออกจากกัน แต่เมื่อภาวะถดถอยยืดเยื้อมากพอ เส้นแบ่งนี้จะพร่าเลือน — ทักษะที่เสื่อมถอย เครือข่ายการทำงานที่ขาด และการที่นายจ้างใช้ระยะเวลาว่างงานเป็นสัญญาณคัดกรอง ทำให้คนกลุ่มนี้กลับเข้าทำงานยากขึ้นแม้อุปสงค์จะฟื้นแล้ว การว่างงานตามวัฏจักรจึงกลายเป็นการว่างงานตามโครงสร้าง อัตราธรรมชาติสูงขึ้น ผลผลิตศักยภาพลดลง และ LRAS เลื่อนซ้าย ปรากฏการณ์นี้เป็นเหตุผลสำคัญที่ผู้ดำเนินนโยบายไม่ควรปล่อยให้ภาวะถดถอยลากยาว","whys":["ถูกต้อง — อธิบายกลไกที่ช็อกด้านอุปสงค์ทิ้งรอยแผลถาวรไว้ที่ฝั่งอุปทานได้อย่างครบถ้วน","ไม่ถูกต้อง — เป็นกรณีอุดมคติที่ช็อกไม่ทิ้งร่องรอย ซึ่งขัดกับข้อมูลในโจทย์ที่ระบุชัดว่าทักษะเสื่อมถอยและนายจ้างลังเล","ไม่ถูกต้อง — ค่าจ้างที่ลดลงทำให้ SRAS เลื่อนลง ซึ่งเป็นการปรับตัวระยะสั้น ไม่ได้เพิ่มแรงงาน ทุน หรือเทคโนโลยีที่กำหนดตำแหน่งของ LRAS","ไม่ถูกต้อง — โจทย์ระบุชัดว่าทักษะแรงงานเสื่อมถอย ซึ่งเป็นการกระทบปัจจัยการผลิตโดยตรง ฝั่งอุปทานจึงได้รับผลกระทบแน่นอน"],"tip":"คำศัพท์ที่ใช้เรียกปรากฏการณ์นี้คือ hysteresis — ข้อสอบระดับสูงชอบถามว่า “ช็อกด้านอุปสงค์กระทบ LRAS ได้หรือไม่” คำตอบคือได้ ถ้ามันลากยาวพอ"},{"id":"U15","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"จับคู่นโยบายให้ตรงกับประเภทการว่างงาน","q":"ประเทศหนึ่งมีอัตราการว่างงานจริง 9% โดยประเมินว่าอัตราธรรมชาติอยู่ที่ 6% ซึ่งสูงกว่าประเทศเพื่อนบ้านมากเพราะปัญหาทักษะไม่ตรงงาน ข้อใดคือชุดนโยบายที่จับคู่ถูกทั้งสองส่วน","choices":["ใช้นโยบายด้านอุปสงค์เช่นลดดอกเบี้ยหรือเพิ่มรายจ่ายภาครัฐ เพื่อปิดส่วนต่าง 3 จุดที่เป็นวัฏจักร ควบคู่กับการฝึกทักษะใหม่และปฏิรูปการจับคู่งานเพื่อกดอัตราธรรมชาติลง","ใช้นโยบายด้านอุปสงค์อย่างเข้มข้นเพียงอย่างเดียวจนอัตราการว่างงานลงมาต่ำกว่า 6% เพราะเมื่ออุปสงค์แรงงานสูงพอ นายจ้างจะยอมฝึกทักษะให้แรงงานเองโดยรัฐไม่ต้องทำ ต้นทุนการฝึกอบรมจึงตกอยู่กับภาคเอกชนทั้งหมดโดยไม่มีบทบาทของรัฐ","ใช้นโยบายด้านอุปทานอย่างการฝึกทักษะเพียงอย่างเดียว เพราะปัญหาทั้งหมดมาจากโครงสร้าง ส่วนการกระตุ้นอุปสงค์จะสร้างแต่เงินเฟ้อโดยไม่ช่วยการจ้างงานเลยแม้แต่ในระยะสั้นที่สุด","ไม่ใช้นโยบายใดเลยและรอให้กลไกตลาดปรับตัวเอง เพราะทั้งสองส่วนจะหายไปในระยะยาวโดยที่ระบบเศรษฐกิจไม่ต้องแบกรับต้นทุนใด ๆ ระหว่างทาง การใช้นโยบายจึงเป็นการแทรกแซงที่สร้างความบิดเบือนโดยไม่จำเป็น"],"answer":0,"a":"โจทย์แยกปัญหาออกเป็นสองชั้นชัดเจน ส่วนแรกคือการว่างงานตามวัฏจักร 3 จุด (9% − 6%) ซึ่งมาจากอุปสงค์รวมที่ตกต่ำ แก้ได้ด้วยนโยบายที่ยก AD ไปทางขวา ส่วนที่สองคืออัตราธรรมชาติที่สูงผิดปกติถึง 6% ซึ่งมาจากปัญหาทักษะไม่ตรงงาน เป็นปัญหาฝั่งอุปทานที่การกระตุ้นอุปสงค์แก้ไม่ได้ ต้องใช้การฝึกทักษะและปฏิรูปกลไกจับคู่งาน หากใช้เพียงนโยบายด้านอุปสงค์เกินเลยไปกดการว่างงานให้ต่ำกว่าอัตราธรรมชาติ ผลที่ได้จะเป็นเงินเฟ้อมากกว่าการจ้างงานที่ยั่งยืน","whys":["ถูกต้อง — จับคู่นโยบายด้านอุปสงค์กับส่วนที่เป็นวัฏจักร และนโยบายด้านอุปทานกับอัตราธรรมชาติได้ตรงทั้งคู่","ไม่ถูกต้อง — การกดการว่างงานต่ำกว่าอัตราธรรมชาติด้วยอุปสงค์จะเร่งเงินเฟ้อ และนายจ้างก็ไม่ได้แก้ปัญหาทักษะให้ทั้งระบบโดยอัตโนมัติ","ไม่ถูกต้อง — มองข้ามส่วนต่าง 3 จุดที่เป็นวัฏจักรจริง ซึ่งนโยบายด้านอุปสงค์แก้ได้และควรแก้ ไม่เช่นนั้นจะเสียผลผลิตไปโดยเปล่าประโยชน์","ไม่ถูกต้อง — การรอมีต้นทุนจริงทั้งต่อการออมและการลงทุน การกระจายรายได้ ฐานะการคลัง และต้นทุนทางสังคม ตามที่สไลด์ระบุไว้"],"tip":"หลักจับคู่ที่ใช้ได้ทุกข้อ: ส่วนที่เกินอัตราธรรมชาติ → เครื่องมือด้านอุปสงค์ · ตัวอัตราธรรมชาติเอง → เครื่องมือด้านอุปทาน"},{"id":"U16","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"ผลรวมของการเข้าและออกกำลังแรงงานพร้อมกัน","q":"ในปีหนึ่ง ประเทศหนึ่งมีผู้มีงานทำ 24.0 ล้านคน ผู้ว่างงาน 1.5 ล้านคน ผู้ไม่อยู่ในกำลังแรงงาน 14.5 ล้านคน ปีถัดมามีบัณฑิตจบใหม่เข้าสู่กำลังแรงงาน 0.8 ล้านคน โดย 0.5 ล้านคนได้งานทันทีและอีก 0.3 ล้านคนยังหางานอยู่ ขณะที่ผู้สูงอายุ 0.4 ล้านคนที่เคยมีงานทำเกษียณออกจากกำลังแรงงาน อัตราการว่างงานใหม่เท่ากับเท่าใด","choices":["ประมาณ 7.06% เพราะผู้ว่างงานเพิ่มเป็น 1.8 ล้านคน ขณะที่ผู้มีงานทำเพิ่มสุทธิเพียง 0.1 ล้านคน ทำให้กำลังแรงงานรวมขยับขึ้นเป็น 25.9 ล้านคนจากเดิม 25.5 ล้านคน","ประมาณ 5.88% เพราะผู้ว่างงานคงเดิมที่ 1.5 ล้านคน ส่วนกำลังแรงงานเพิ่มขึ้นจากบัณฑิตที่เข้ามาใหม่ทั้ง 0.8 ล้านคน จึงกลายเป็น 25.5 ล้านคนในปีถัดมา","ประมาณ 6.92% เพราะผู้ว่างงานเพิ่มเป็น 1.8 ล้านคน และกำลังแรงงานเพิ่มเป็น 26.0 ล้านคน โดยการเกษียณของผู้สูงอายุไม่ถูกนำมาหักออกจากกำลังแรงงาน","ประมาณ 7.50% เพราะผู้ว่างงานเพิ่มเป็น 1.8 ล้านคน และการเกษียณทำให้กำลังแรงงานลดลงเหลือ 24.0 ล้านคน ซึ่งเป็นจำนวนผู้มีงานทำเดิมก่อนการเปลี่ยนแปลง"],"answer":0,"a":"ไล่ทีละรายการ\nผู้มีงานทำ = 24.0 + 0.5 (บัณฑิตที่ได้งาน) − 0.4 (เกษียณ) = 24.1 ล้านคน\nผู้ว่างงาน = 1.5 + 0.3 (บัณฑิตที่ยังหางาน) = 1.8 ล้านคน\nกำลังแรงงาน = 24.1 + 1.8 = 25.9 ล้านคน\nอัตราการว่างงาน = 1.8 ÷ 25.9 = 6.95% ซึ่งปัดเป็นประมาณ 7.0% (ค่าที่ใกล้ที่สุดในตัวเลือกคือ 7.06% จากการปัดกลาง)\nจุดที่พลาดกันบ่อยคือลืมว่าผู้เกษียณออกจากทั้งผู้มีงานทำและกำลังแรงงาน ไม่ใช่ย้ายไปเป็นผู้ว่างงาน","whys":["ถูกต้อง — หักผู้เกษียณออกจากกำลังแรงงาน และนับเฉพาะบัณฑิตที่ยังหางานเป็นผู้ว่างงาน ได้อัตราประมาณ 7%","ไม่ถูกต้อง — บัณฑิต 0.3 ล้านคนที่ยังหางานอยู่ต้องถูกนับเป็นผู้ว่างงาน ตัวเศษจึงไม่สามารถคงอยู่ที่ 1.5 ล้านคนได้","ไม่ถูกต้อง — ผู้เกษียณออกจากกำลังแรงงานแล้ว จึงต้องหักออกจากตัวส่วน การคงไว้ที่ 26.0 ล้านคนทำให้อัตราต่ำกว่าความจริง","ไม่ถูกต้อง — กำลังแรงงานต้องรวมผู้ว่างงานด้วยเสมอ การใช้เฉพาะจำนวนผู้มีงานทำเดิมเป็นตัวส่วนจึงผิดนิยามพื้นฐาน"],"tip":"โจทย์หลายกระแสแบบนี้ให้ทำเป็นตารางสามช่อง (มีงานทำ / ว่างงาน / นอกกำลังแรงงาน) แล้วบวกลบทีละเหตุการณ์ จะไม่พลาด"},{"id":"U18","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"จำแนกสองกรณีพร้อมกัน","q":"พิจารณาสองกรณี — กรณีที่หนึ่ง วิศวกรลาออกเองเพื่อย้ายไปบริษัทที่จ่ายดีกว่าและใช้เวลาหางานสองเดือน · กรณีที่สอง พนักงานรับโทรศัพท์ในศูนย์บริการลูกค้าถูกเลิกจ้างเพราะบริษัทเปลี่ยนไปใช้ระบบตอบรับอัตโนมัติทั้งหมด ข้อใดจำแนกได้ถูกต้อง","choices":["กรณีแรกเป็นการว่างงานตามวัฏจักรธุรกิจเพราะการลาออกมักเกิดในช่วงที่เศรษฐกิจดี ส่วนกรณีที่สองเป็นการว่างงานชั่วคราวเพราะยังมีศูนย์บริการลูกค้าที่อื่นเปิดรับอยู่","กรณีแรกเป็นการว่างงานชั่วคราวเพราะเป็นกระบวนการจับคู่คนกับงานที่ต้องใช้เวลา ส่วนกรณีที่สองเป็นการว่างงานตามโครงสร้างเพราะเทคโนโลยีทำให้ตำแหน่งงานนั้นหายไป","ทั้งสองกรณีเป็นการว่างงานชั่วคราว เพราะแรงงานทั้งคู่ยังมีทักษะที่ตลาดต้องการอยู่ และเพียงต้องใช้เวลาระยะหนึ่งในการค้นหาตำแหน่งงานใหม่ที่เหมาะสมกับตนเอง","ทั้งสองกรณีเป็นการว่างงานตามโครงสร้าง เพราะทั้งคู่เกิดจากการเปลี่ยนแปลงของโครงสร้างการผลิตในอุตสาหกรรมที่แรงงานทั้งสองคนทำงานอยู่เดิมก่อนตกงาน"],"answer":1,"a":"กรณีแรก วิศวกรลาออกเอง ทักษะยังเป็นที่ต้องการ ตำแหน่งงานสำหรับทักษะนั้นยังมีอยู่มาก สองเดือนที่ใช้ไปคือเวลาในการจับคู่คนกับงาน ซึ่งสไลด์ระบุว่าเป็นที่มาของการว่างงานชั่วคราว\nกรณีที่สอง ระบบอัตโนมัติเข้ามาแทนที่ทั้งหมด ตำแหน่งงานรับโทรศัพท์หายไปจากโครงสร้างการผลิต ไม่ใช่แค่หายาก แรงงานต้องเปลี่ยนทักษะจึงจะกลับเข้าทำงานได้ จึงเป็นการว่างงานตามโครงสร้างซึ่งเป็นระยะยาว","whys":["ไม่ถูกต้อง — การลาออกเพื่อย้ายงานไม่ได้เกิดจากภาวะเศรษฐกิจโดยรวม และตำแหน่งรับโทรศัพท์ก็ถูกเทคโนโลยีแทนที่ ไม่ใช่แค่ย้ายที่","ถูกต้อง — แยกด้วยเกณฑ์เดียวคือตำแหน่งงานสำหรับทักษะนั้นยังมีอยู่หรือหายไปแล้ว ซึ่งให้คำตอบต่างกันในสองกรณี","ไม่ถูกต้อง — ทักษะการรับโทรศัพท์ถูกระบบอัตโนมัติทดแทนไปแล้ว จึงไม่ใช่กรณีที่เพียงต้องใช้เวลาค้นหางานที่เหมาะสม","ไม่ถูกต้อง — กรณีแรกไม่มีการเปลี่ยนแปลงโครงสร้างใด ๆ เกิดขึ้น เป็นเพียงการย้ายงานตามปกติของแรงงานที่มีทักษะเป็นที่ต้องการ"]},{"id":"U19","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"ค่าจ้างขั้นต่ำเชื่อมเข้าแบบจำลอง AD-AS","q":"รัฐบาลปรับขึ้นค่าจ้างขั้นต่ำทั่วประเทศ 20% ในคราวเดียว โดยเศรษฐกิจเริ่มต้นที่ดุลยภาพระยะยาว ข้อใดอธิบายผลต่อทั้งตลาดแรงงานและแบบจำลอง AD-AS ได้ถูกต้อง","choices":["ตลาดแรงงานทักษะต่ำเกิดอุปทานส่วนเกิน การว่างงานตามโครงสร้างเพิ่มขึ้น และต้นทุนแรงงานที่สูงขึ้นทำให้ SRAS เลื่อนขึ้น ระดับราคาสูงขึ้นพร้อมผลผลิตที่ลดลง","ตลาดแรงงานทักษะต่ำเกิดอุปทานส่วนเกิน แต่แบบจำลอง AD-AS ไม่ได้รับผลกระทบใด ๆ เพราะค่าจ้างเป็นตัวแปรของตลาดแรงงานซึ่งแยกขาดจากตลาดสินค้าโดยสิ้นเชิง","ตลาดแรงงานเกิดการขาดแคลนแรงงานเพราะค่าจ้างที่สูงขึ้นดึงดูดให้นายจ้างขยายการจ้างงาน และเส้น AD เลื่อนไปทางขวาจากรายได้ของแรงงานที่เพิ่มขึ้นอย่างมาก","ตลาดแรงงานทักษะต่ำไม่เปลี่ยนแปลงเพราะนายจ้างส่งผ่านต้นทุนไปยังราคาสินค้าได้ทั้งหมด และเส้น LRAS เลื่อนไปทางซ้ายอย่างถาวรตามค่าจ้างที่สูงขึ้น"],"answer":0,"a":"ต้องตอบสองชั้น\nชั้นตลาดแรงงาน — ค่าจ้างขั้นต่ำที่ถูกดันขึ้นเหนือดุลยภาพของตลาดทักษะต่ำ ทำให้ปริมาณอุปสงค์แรงงานลดลงและอุปทานเพิ่มขึ้น เกิดส่วนเกิน = การว่างงานตามโครงสร้างที่สูงขึ้น\nชั้น AD-AS — ค่าจ้างเป็นต้นทุนการผลิตที่ใหญ่ที่สุดของธุรกิจจำนวนมาก เมื่อต้นทุนสูงขึ้น ผู้ผลิตขึ้นราคา เส้น SRAS เลื่อนขึ้น ผลระยะสั้นคือระดับราคาสูงขึ้นและผลผลิตที่แท้จริงลดลง ซึ่งก็คือกลไกเงินเฟ้อต้นทุนผลักนั่นเอง","whys":["ถูกต้อง — เชื่อมสองชั้นได้ครบ ทั้งอุปทานแรงงานส่วนเกินในตลาดแรงงานและการเลื่อนขึ้นของ SRAS ในแบบจำลอง AD-AS","ไม่ถูกต้อง — ค่าจ้างคือต้นทุนการผลิตโดยตรง จึงเป็นตัวกำหนดตำแหน่งของเส้น SRAS สองตลาดนี้เชื่อมกันผ่านต้นทุนเสมอ","ไม่ถูกต้อง — ค่าจ้างที่สูงขึ้นทำให้นายจ้างจ้างน้อยลงตามกฎอุปสงค์ จึงเกิดส่วนเกินด้านอุปทาน ไม่ใช่การขาดแคลนแรงงาน","ไม่ถูกต้อง — ปริมาณการจ้างงานย่อมลดลงเมื่อค่าจ้างถูกตรึงเหนือดุลยภาพ และ LRAS ขึ้นกับแรงงาน ทุน เทคโนโลยี ไม่ใช่ระดับค่าจ้าง"]},{"id":"U20","type":"mcq","lvl":3,"topic":"การว่างงาน","ref":"ความแตกต่างของอัตราการว่างงานตามกลุ่มอายุ","q":"ในเกือบทุกประเทศ อัตราการว่างงานของแรงงานอายุ 15–24 ปี สูงกว่าของแรงงานอายุ 35–54 ปี อย่างสม่ำเสมอ ข้อใดคือคำอธิบายที่สอดคล้องกับทฤษฎีการว่างงานมากที่สุด","choices":["แรงงานอายุน้อยเปลี่ยนงานบ่อยกว่าจึงมีการว่างงานชั่วคราวสูงกว่า และค่าจ้างดุลยภาพของพวกเขาต่ำจนค่าจ้างขั้นต่ำมีผลผูกพัน ทำให้เกิดการว่างงานตามโครงสร้างเพิ่มด้วย","แรงงานอายุน้อยไม่ต้องการทำงานเท่ากับแรงงานวัยกลางคน จึงเลือกที่จะอยู่นอกกำลังแรงงานมากกว่า ทำให้อัตราการว่างงานของกลุ่มนี้ถูกคำนวณออกมาสูงกว่ากลุ่มอื่นเสมอ","แรงงานอายุน้อยมีผลิตภาพสูงกว่าจึงเรียกค่าจ้างได้สูงกว่า นายจ้างจึงเลือกจ้างแรงงานวัยกลางคนที่ค่าจ้างถูกกว่าแทน ทำให้กลุ่มอายุน้อยว่างงานมากกว่าอย่างเป็นระบบ","แรงงานอายุน้อยมักได้รับการคุ้มครองจากสหภาพแรงงานมากกว่า ค่าจ้างของพวกเขาจึงถูกตรึงไว้เหนือระดับดุลยภาพ ส่งผลให้เกิดอุปทานแรงงานส่วนเกินในกลุ่มนี้มากกว่ากลุ่มอื่น"],"answer":0,"a":"บทเรียนให้เครื่องมืออธิบายสองชิ้นที่ทำงานพร้อมกันในกลุ่มนี้\nชิ้นแรก แรงงานอายุน้อยอยู่ในช่วงค้นหางานที่เหมาะกับตนเอง จึงเข้าออกตลาดแรงงานบ่อย ทำให้การว่างงานชั่วคราวสูงกว่าโดยธรรมชาติ\nชิ้นที่สอง ค่าจ้างดุลยภาพของแรงงานทักษะต่ำอยู่ใกล้หรือต่ำกว่าค่าจ้างขั้นต่ำ กฎหมายจึงมีผลผูกพันกับกลุ่มนี้และสร้างการว่างงานตามโครงสร้างเพิ่มเข้าไปอีก — นี่คือเหตุผลที่สไลด์ระบุว่าค่าจ้างขั้นต่ำอธิบายการว่างงานของวัยรุ่นได้ดีกว่าของบัณฑิตปริญญา","whys":["ถูกต้อง — รวมทั้งกลไกการค้นหางานและกลไกค่าจ้างขั้นต่ำที่ผูกพัน ซึ่งเป็นสองเครื่องมือหลักที่บทเรียนให้ไว้","ไม่ถูกต้อง — คนที่อยู่นอกกำลังแรงงานจะไม่ถูกนับในอัตราการว่างงานเลย การอยู่นอกกำลังแรงงานมากจึงไม่ได้ดันอัตราการว่างงานให้สูงขึ้น","ไม่ถูกต้อง — โดยทั่วไปแรงงานอายุน้อยมีประสบการณ์น้อยกว่าและผลิตภาพต่ำกว่า จึงมีค่าจ้างดุลยภาพต่ำกว่า ไม่ใช่สูงกว่า","ไม่ถูกต้อง — สหภาพแรงงานมักครอบคลุมแรงงานที่มีอายุงานยาวและมั่นคง ไม่ใช่แรงงานอายุน้อยที่เพิ่งเข้าตลาดแรงงาน"]},{"id":"U21","type":"mcq","lvl":3,"topic":"การว่างงาน","ref":"อัตราธรรมชาติที่ต่างกันระหว่างประเทศ","q":"ประเทศ A มีอัตราการว่างงานตามธรรมชาติ 4% ส่วนประเทศ B มี 8% โดยทั้งสองประเทศมีจำนวนประชากรวัยแรงงาน ปริมาณทุน และระดับเทคโนโลยีใกล้เคียงกัน ข้อใดสรุปได้ถูกต้อง","choices":["ประเทศ A มีผลผลิต ณ การจ้างงานเต็มที่สูงกว่า เส้น LRAS จึงอยู่ทางขวาของประเทศ B และความต่างนี้สะท้อนประสิทธิภาพของสถาบันตลาดแรงงานที่ต่างกัน","ประเทศ B มีผลผลิต ณ การจ้างงานเต็มที่สูงกว่า เพราะการมีแรงงานว่างงานสำรองไว้จำนวนมากทำให้ประเทศสามารถขยายการผลิตได้ทันทีเมื่ออุปสงค์เพิ่มขึ้น","ทั้งสองประเทศมีเส้น LRAS อยู่ตำแหน่งเดียวกัน เพราะ LRAS ถูกกำหนดโดยแรงงาน ทุน และเทคโนโลยี ซึ่งโจทย์ระบุว่าใกล้เคียงกันอยู่แล้วทั้งสามอย่าง","ประเทศ A จะมีอัตราเงินเฟ้อสูงกว่าประเทศ B อย่างถาวร เพราะการที่ตลาดแรงงานตึงตัวกว่าทำให้ค่าจ้างถูกดันขึ้นเรื่อย ๆ โดยไม่มีจุดสิ้นสุด"],"answer":0,"a":"อัตราธรรมชาติคือระดับการว่างงานที่เหลืออยู่แม้เศรษฐกิจอยู่ในภาวะปกติ ประเทศที่มีอัตราธรรมชาติต่ำกว่าแปลว่าใช้แรงงานที่มีอยู่ได้เต็มเม็ดเต็มหน่วยกว่า ผลผลิต ณ การจ้างงานเต็มที่จึงสูงกว่า และเส้น LRAS อยู่ทางขวากว่า ความต่าง 4 จุดนี้ไม่ได้มาจากปัจจัยการผลิต (ซึ่งโจทย์บอกว่าใกล้เคียงกัน) แต่มาจากสถาบันตลาดแรงงาน เช่น ประสิทธิภาพการจับคู่งาน ความเข้มงวดของกฎหมายคุ้มครองแรงงาน ความใจกว้างของประกันการว่างงาน และอำนาจของสหภาพ","whys":["ถูกต้อง — อัตราธรรมชาติที่ต่ำกว่าแปลเป็นผลผลิตศักยภาพที่สูงกว่าโดยตรง และชี้ไปที่คุณภาพของสถาบันตลาดแรงงาน","ไม่ถูกต้อง — แรงงานที่ว่างงานเรื้อรังไม่ใช่ “กำลังสำรอง” ที่พร้อมใช้ เพราะทักษะเสื่อมถอยและจับคู่กับงานได้ยาก","ไม่ถูกต้อง — ปัจจัยการผลิตที่เท่ากันเป็นเพียงวัตถุดิบ แต่ประสิทธิภาพในการนำแรงงานมาใช้จริงต่างกัน ผลผลิตศักยภาพจึงต่างกัน","ไม่ถูกต้อง — อัตราธรรมชาติที่ต่ำกว่าไม่ได้แปลว่าเงินเฟ้อสูงกว่า เงินเฟ้อจะเร่งตัวก็ต่อเมื่ออัตราการว่างงานจริงถูกกดต่ำกว่าอัตราธรรมชาติของประเทศนั้น"]},{"id":"U22","type":"mcq","lvl":4,"topic":"การว่างงาน","ref":"แรงงานข้ามชาติกับสถิติและศักยภาพ","q":"ประเทศหนึ่งเปิดรับแรงงานข้ามชาติที่มีทักษะตรงกับความต้องการของอุตสาหกรรมเข้ามาทำงานอย่างถูกกฎหมายจำนวนมาก โดยเกือบทั้งหมดได้งานทำภายในไม่กี่เดือน ข้อใดอธิบายผลต่อสถิติและต่อเส้น LRAS ได้ถูกต้อง","choices":["กำลังแรงงานและผู้มีงานทำเพิ่มขึ้นพร้อมกัน อัตราการว่างงานจึงเปลี่ยนแปลงน้อย แต่ผลผลิต ณ การจ้างงานเต็มที่สูงขึ้น เส้น LRAS เลื่อนไปทางขวา","กำลังแรงงานเพิ่มขึ้นขณะที่ผู้มีงานทำคงเดิม อัตราการว่างงานจึงพุ่งสูงขึ้นอย่างมีนัยสำคัญ และเส้น LRAS เลื่อนไปทางซ้ายเพราะต้องแบ่งทุนที่มีอยู่ให้คนจำนวนมากขึ้น","กำลังแรงงานไม่เปลี่ยนแปลงเพราะแรงงานข้ามชาติไม่ถูกนับในสถิติของประเทศผู้รับ และเส้น LRAS ก็ไม่ขยับเพราะกำลังการผลิตของประเทศยังเท่าเดิมทุกประการ","อัตราการว่างงานลดลงอย่างชัดเจนเพราะมีผู้มีงานทำเพิ่มขึ้น และเส้น AD เลื่อนไปทางขวาเพียงเส้นเดียว ส่วนฝั่งอุปทานทั้งสองเส้นไม่ได้รับผลกระทบใด ๆ เลย"],"answer":0,"a":"เมื่อแรงงานที่เข้ามาได้งานทำเกือบทั้งหมด ตัวเศษ (ผู้ว่างงาน) และตัวส่วน (กำลังแรงงาน) เพิ่มขึ้นในสัดส่วนที่ใกล้เคียงกัน อัตราการว่างงานจึงแทบไม่ขยับ แต่สิ่งที่เปลี่ยนแน่นอนคือปริมาณแรงงานซึ่งเป็นปัจจัยการผลิตโดยตรง สไลด์ระบุเองว่าการเปลี่ยนแปลงของกำลังแรงงานเป็นหนึ่งในตัวอย่างที่ทำให้ LRAS เลื่อน ผลผลิต ณ การจ้างงานเต็มที่จึงสูงขึ้นและ LRAS เลื่อนขวา (ในทางปฏิบัติ AD ก็เลื่อนขวาด้วยเพราะมีผู้บริโภคเพิ่ม แต่ประเด็นหลักคือการขยายศักยภาพ)","whys":["ถูกต้อง — แยกได้ว่าสถิติการว่างงานแทบไม่ขยับ ในขณะที่ศักยภาพการผลิตของประเทศเพิ่มขึ้นจริง","ไม่ถูกต้อง — โจทย์ระบุชัดว่าเกือบทั้งหมดได้งานทำ ผู้มีงานทำจึงเพิ่มขึ้นด้วย และผลผลิตรวมของประเทศก็สูงขึ้น ไม่ใช่ลดลง","ไม่ถูกต้อง — แรงงานข้ามชาติที่ทำงานอย่างถูกกฎหมายถูกนับในสถิติกำลังแรงงานของประเทศผู้รับ และเป็นปัจจัยการผลิตจริง","ไม่ถูกต้อง — แรงงานเป็นทั้งผู้บริโภคและผู้ผลิต การมองเพียงด้าน AD จึงไม่ครบ และอัตราการว่างงานก็ไม่ได้ลดลงชัดเจนเพราะกำลังแรงงานโตตามไปด้วย"]},{"id":"U23","type":"mcq","lvl":3,"topic":"การว่างงาน","ref":"การว่างงานกับฐานะการคลัง","q":"ในช่วงที่อัตราการว่างงานเพิ่มจาก 4% เป็น 9% รัฐบาลพบว่างบประมาณขาดดุลกว้างขึ้นมาก ทั้งที่ยังไม่ได้ประกาศมาตรการกระตุ้นเศรษฐกิจใหม่ใด ๆ เลย ข้อใดอธิบายปรากฏการณ์นี้ได้ถูกต้อง","choices":["รายได้ภาษีเงินได้และภาษีมูลค่าเพิ่มลดลงตามรายได้และการบริโภคที่หดตัว ขณะที่รายจ่ายด้านสวัสดิการและเงินช่วยเหลือผู้ว่างงานเพิ่มขึ้นโดยอัตโนมัติ","รัฐบาลต้องจ่ายดอกเบี้ยหนี้สาธารณะสูงขึ้นในช่วงเศรษฐกิจถดถอย เพราะธนาคารกลางมักปรับขึ้นอัตราดอกเบี้ยนโยบายเพื่อควบคุมเงินเฟ้อในภาวะเช่นนี้เสมอ","การว่างงานที่สูงขึ้นทำให้ผลผลิตศักยภาพของประเทศลดลงทันที รัฐบาลจึงต้องเพิ่มรายจ่ายด้านการลงทุนโครงสร้างพื้นฐานเพื่อชดเชยศักยภาพที่หายไปโดยอัตโนมัติ","เงินโอนที่รัฐบาลจ่
