" fill=\"var(--curve-lras)\" text-anchor=\"middle\">LRAS</text><text x=\"325.28999999999996\" y=\"366\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"middle\">Y<tspan dy=\"4\" font-size=\"11\">FE</tspan></text><text x=\"53\" y=\"205.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₁</text></svg><div class=\"figcap\">จุด E คือจุดที่ AD ตัดกับ SRAS ในปัจจุบัน — เทียบตำแหน่งกับเส้น LRAS</div></div>"},{"id":"E06","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ช็อกด้านอุปทานเชิงลบครบสองระยะ","q":"เศรษฐกิจอยู่ในดุลยภาพระยะยาว แล้วราคาพลังงานโลกพุ่งขึ้นอย่างรุนแรงแต่เป็นการชั่วคราว หากไม่มีนโยบายใด ๆ ข้อใดบรรยายเส้นทางได้ถูกต้องครบทั้งสองระยะ","choices":["ระยะสั้น SRAS เลื่อนขึ้น ราคาสูงขึ้นและผลผลิตลดต่ำกว่า Y_FE เกิดช่องว่างการหดตัวควบคู่เงินเฟ้อ · ระยะยาว การว่างงานที่สูงกดค่าจ้างลง SRAS เลื่อนกลับลงมา ผลผลิตและราคากลับสู่ระดับเดิม","ระยะสั้น SRAS เลื่อนขึ้น ราคาสูงขึ้นและผลผลิตลดต่ำกว่า Y_FE · ระยะยาว เส้น LRAS เลื่อนซ้ายมาบรรจบกับผลผลิตที่ลดลง เศรษฐกิจจึงเข้าสู่ดุลยภาพใหม่ที่ผลผลิตต่ำกว่าเดิมอย่างถาวร","ระยะสั้น AD เลื่อนซ้ายเพราะราคาพลังงานที่แพงทำให้ครัวเรือนมีกำลังซื้อน้อยลง ราคาและผลผลิตลดลงพร้อมกัน · ระยะยาว SRAS เลื่อนลงจนผลผลิตกลับสู่ Y_FE ที่ระดับราคาต่ำกว่าเดิม","ระยะสั้น SRAS เลื่อนลงเพราะผู้ผลิตปรับตัวหาแหล่งพลังงานทดแทนได้ทันที ราคาลดลงและผลผลิตเพิ่มขึ้น · ระยะยาว เศรษฐกิจเข้าสู่ดุลยภาพใหม่ที่ผลผลิตสูงกว่าเดิมอย่างถาวร"],"answer":0,"a":"ระยะสั้น — พลังงานเป็นต้นทุนการผลิตและขนส่งของแทบทุกอุตสาหกรรม เมื่อแพงขึ้น ต้นทุนต่อหน่วยสูงขึ้น SRAS เลื่อนขึ้น จุดตัดใหม่กับ AD ที่ลาดลงย่อมอยู่ทางซ้าย ผลคือ P สูงขึ้นและ Y ลดลงพร้อมกัน — เป็นภาวะชะงักงันเงินเฟ้อ และเนื่องจากจุดใหม่อยู่ซ้ายของ LRAS จึงเป็นช่องว่างการหดตัวด้วย\nระยะยาว — เมื่อช็อกเป็นเพียงชั่วคราวและ LRAS ไม่ขยับ กลไกปรับตัวเองจะทำงาน: การว่างงานที่สูงกว่าอัตราธรรมชาติกดดันให้ค่าจ้างและราคาปรับลดลง ต้นทุนของผู้ผลิตลดลง SRAS ค่อย ๆ เลื่อนกลับลงมา จนผลผลิตกลับสู่ Y_FE และระดับราคากลับสู่ระดับเดิม\nต้นทุนที่ต้องระบุ — ระหว่างทางสังคมแบกการว่างงานที่ยืดเยื้อ ซึ่งคือราคาของการ “ไม่ทำอะไรเลย”","whys":["ถูกต้อง — ครบทั้งลายเซ็นของช็อกด้านอุปทาน ชนิดของช่องว่าง กลไกปรับตัวเอง และจุดจบที่กลับสู่เดิม","ไม่ถูกต้อง — ช็อกเป็นเพียงชั่วคราวและไม่ได้ทำลายแรงงาน ทุน หรือเทคโนโลยี LRAS จึงไม่เลื่อนตามผลผลิตที่ลดลงชั่วคราว","ไม่ถูกต้อง — ช่องทางหลักของราคาพลังงานคือต้นทุนการผลิตซึ่งเลื่อน SRAS และผลลัพธ์ที่ราคาลดลงก็ขัดกับกลไกนี้","ไม่ถูกต้อง — การหาแหล่งพลังงานทดแทนใช้เวลาหลายปี ไม่ใช่ผลทันที และราคาพลังงานที่แพงขึ้นย่อมดันต้นทุนขึ้นไม่ใช่ลง"]},{"id":"E07","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ช็อกด้านอุปทานเชิงบวกครบสองระยะ","q":"เศรษฐกิจอยู่ในดุลยภาพระยะยาว แล้วเกิดความก้าวหน้าทางเทคโนโลยีที่เพิ่มผลิตภาพอย่างถาวร ข้อใดบรรยายเส้นทางได้ถูกต้องที่สุด","choices":["SRAS เลื่อนลงจากต้นทุนต่อหน่วยที่ถูกลง และ LRAS เลื่อนขวาจากศักยภาพที่สูงขึ้น ดุลยภาพระยะยาวใหม่จึงอยู่ที่ผลผลิตสูงกว่าเดิมและระดับราคาต่ำกว่าเดิมอย่างถาวร","SRAS เลื่อนลงเพียงเส้นเดียว ผลผลิตเพิ่มและราคาลดในระยะสั้น · ระยะยาวค่าจ้างจะถูกดันขึ้นจน SRAS เลื่อนกลับขึ้นไปที่เดิม ผลผลิตและระดับราคาจึงกลับสู่จุดเริ่มต้นทุกประการ","LRAS เลื่อนขวาเพียงเส้นเดียว ผลผลิตเพิ่มขึ้นในระยะยาวโดยที่ระดับราคาไม่เปลี่ยนแปลงเลย เพราะเส้น SRAS ยังคงอยู่ที่ระดับราคาเดิมตลอดเวลาไม่ว่าต้นทุนจะเปลี่ยนไปอย่างไร","AD เลื่อนขวาเพราะเทคโนโลยีใหม่กระตุ้นให้ธุรกิจลงทุนมากขึ้น ผลผลิตและระดับราคาเพิ่มขึ้นพร้อมกันทั้งในระยะสั้นและระยะยาว ส่วนฝั่งอุปทานไม่ได้รับผลกระทบโดยตรงเลย"],"answer":0,"a":"ผลิตภาพที่สูงขึ้นอย่างถาวรเป็นกรณีพิเศษที่กระทบทั้งสองเส้นฝั่งอุปทานไปในทางเดียวกัน\nต่อ SRAS — ต้นทุนต่อหน่วยผลผลิตลดลง ผู้ผลิตยอมขายในราคาต่ำลง เส้นเลื่อนลง ระยะสั้นจึงได้ผลผลิตเพิ่มและราคาลด\nต่อ LRAS — ประเทศผลิตได้มากขึ้นด้วยปัจจัยชุดเดิม ผลผลิต ณ การจ้างงานเต็มที่สูงขึ้น เส้นเลื่อนขวา\nดุลยภาพระยะยาวใหม่ — เนื่องจาก LRAS เลื่อนขวาจริง ผลผลิตที่สูงขึ้นจึงไม่ถูกดึงกลับ เหมือนกรณีที่ AD เลื่อน เศรษฐกิจจึงจบที่ผลผลิตสูงกว่าเดิมและระดับราคาต่ำกว่าเดิมอย่างถาวร\nนี่คือความต่างที่สำคัญที่สุดระหว่างช็อกด้านอุปทานเชิงบวกกับการกระตุ้นอุปสงค์ — อย่างแรกได้ทั้งผลผลิตและราคาที่ดีขึ้นถาวร อย่างหลังได้ผลผลิตชั่วคราวโดยแลกกับราคาที่สูงขึ้นถาวร","whys":["ถูกต้อง — จับได้ว่าเมื่อ LRAS เลื่อนจริง ผลผลิตที่สูงขึ้นจะคงอยู่ถาวรและไม่ถูกดึงกลับเหมือนกรณีที่ AD เลื่อน","ไม่ถูกต้อง — เมื่อ LRAS เลื่อนขวาด้วย ผลผลิตที่เพิ่มขึ้นไม่ได้อยู่เหนือศักยภาพ จึงไม่มีแรงกดดันให้ค่าจ้างถูกดันขึ้นแบบช่องว่างเงินเฟ้อ","ไม่ถูกต้อง — ต้นทุนต่อหน่วยที่ลดลงจริงย่อมทำให้ผู้ผลิตยอมขายในราคาที่ต่ำลง SRAS จึงเลื่อนลงไม่ได้อยู่นิ่ง","ไม่ถูกต้อง — ผลกระทบหลักของเทคโนโลยีอยู่ที่ฝั่งอุปทานผ่านต้นทุนและศักยภาพ แม้จะกระตุ้นการลงทุนได้บ้างก็ตาม"],"tip":"เปรียบเทียบให้ขึ้นใจ: AD เลื่อนขวา → ระยะยาวได้แค่ราคาสูงขึ้น · LRAS เลื่อนขวา → ระยะยาวได้ผลผลิตสูงขึ้นและราคาต่ำลง"},{"id":"E08","type":"mcq","lvl":4,"topic":"AD-AS","ref":"เหตุใดระยะยาวผลผลิตจึงกลับที่เดิมเสมอเมื่อ AD เลื่อน","q":"เหตุใดเมื่อเส้น AD เลื่อนขวา ผลผลิตจึงกลับมาที่ Y_FE ในระยะยาวเสมอ ทั้งที่อุปสงค์รวมสูงขึ้นอย่างถาวร","choices":["เพราะผลผลิตที่เกินศักยภาพทำได้ด้วยการเดินเครื่องเกินกำลังและทำล่วงเวลาเท่านั้น ซึ่งไม่ยั่งยืน เมื่อค่าจ้างและต้นทุนปรับขึ้นตามความตึงตัว SRAS จะเลื่อนขึ้นจนดันผลผลิตกลับลงมา","เพราะรัฐบาลจะเข้ามาแทรกแซงด้วยนโยบายหดตัวทุกครั้งที่ผลผลิตเกินระดับศักยภาพ เพื่อป้องกันไม่ให้เศรษฐกิจร้อนแรงเกินไป ผลผลิตจึงถูกดึงกลับมาที่ระดับการจ้างงานเต็มที่เสมอ","เพราะอุปสงค์รวมที่สูงขึ้นจะทำให้ราคาสินค้าแพงขึ้นจนผู้บริโภคซื้อไม่ไหว เส้น AD จึงเลื่อนกลับมาทางซ้ายที่ตำแหน่งเดิมโดยอัตโนมัติ และผลผลิตกลับมาที่ระดับเริ่มต้น","เพราะเส้น LRAS เป็นเส้นแนวตั้งที่มีคุณสมบัติทางคณิตศาสตร์บังคับให้ทุกจุดดุลยภาพต้องอยู่บนเส้นนั้น ไม่ว่าเส้นอื่นจะเลื่อนไปที่ตำแหน่งใดก็ตามทั้งในระยะสั้นและระยะยาว"],"answer":0,"a":"คำตอบอยู่ที่เหตุผลทางกายภาพและเชิงพฤติกรรม ไม่ใช่กฎทางคณิตศาสตร์\nการผลิตเกิน Y_FE ทำได้จริงในระยะสั้น ด้วยการให้พนักงานทำล่วงเวลา เดินเครื่องจักรโดยไม่หยุดซ่อมบำรุง และจ้างคนที่ปกติจะไม่ได้ทำงาน แต่ทั้งหมดนี้ไม่ยั่งยืน\nเมื่อตลาดแรงงานตึงตัวจนหาคนไม่ได้ แรงงานมีอำนาจต่อรองสูงและเรียกค่าจ้างสูงขึ้น ซัพพลายเออร์ก็ขึ้นราคาเพราะของขาด ต้นทุนต่อหน่วยของผู้ผลิตจึงสูงขึ้นจริง ผู้ผลิตขึ้นราคาตาม SRAS เลื่อนขึ้น\nกระบวนการนี้จะไม่หยุดจนกว่าผลผลิตจะถอยกลับมาที่ระดับที่ปัจจัยการผลิตที่มีอยู่จริงรองรับได้อย่างยั่งยืน ซึ่งก็คือ Y_FE นั่นเอง — LRAS แนวตั้งเป็นเพียงภาพวาดของข้อเท็จจริงนี้ ไม่ใช่สาเหตุของมัน","whys":["ถูกต้อง — อธิบายด้วยกลไกที่เกิดขึ้นจริงในตลาดแรงงานและตลาดปัจจัยการผลิต ไม่ใช่การอ้างรูปร่างของเส้น","ไม่ถูกต้อง — กลไกนี้ทำงานเองผ่านตลาดโดยไม่ต้องมีรัฐบาลเข้าแทรกแซง แม้รัฐบาลจะอยู่เฉยก็ตาม ผลผลิตก็จะกลับมาเอง","ไม่ถูกต้อง — เส้น AD ไม่ได้เลื่อนกลับเอง สิ่งที่ปรับตัวคือเส้นอุปทานระยะสั้นผ่านค่าจ้างและต้นทุนที่เปลี่ยนไป","ไม่ถูกต้อง — สลับเหตุกับผล LRAS แนวตั้งเป็นการบันทึกข้อเท็จจริงที่ว่าผลผลิตถูกจำกัดด้วยปัจจัยการผลิต ไม่ใช่สาเหตุที่บังคับให้เป็นเช่นนั้น"]},{"id":"E09","type":"mcq","lvl":4,"topic":"AD-AS","ref":"เปรียบเทียบดุลยภาพสองแบบเมื่อเส้นต่างกันเลื่อน","q":"เปรียบเทียบสองกรณี — กรณี ก เส้น AD เลื่อนขวา · กรณี ข เส้น LRAS เลื่อนขวา ทั้งสองกรณีทำให้ผลผลิตเพิ่มขึ้นในตอนแรก ข้อใดเปรียบเทียบดุลยภาพระยะยาวของสองกรณีได้ถูกต้อง","choices":["กรณี ก ผลผลิตกลับสู่ระดับเดิมและระดับราคาสูงขึ้นถาวร · กรณี ข ผลผลิตสูงขึ้นถาวรและระดับราคาต่ำลง ความต่างเกิดจากกรณีหลังขยายศักยภาพการผลิตที่แท้จริงของประเทศ","ทั้งสองกรณีจบเหมือนกันคือผลผลิตสูงขึ้นถาวรและระดับราคาสูงขึ้นถาวร เพราะไม่ว่าเส้นใดจะเลื่อนไปทางขวา ผลลัพธ์สุดท้ายต่อระบบเศรษฐกิจย่อมเป็นการขยายตัวเหมือนกันทั้งคู่","กรณี ก ผลผลิตสูงขึ้นถาวรและราคาคงที่ · กรณี ข ผลผลิตกลับสู่ระดับเดิมและราคาลดลง เพราะการเลื่อนของอุปสงค์มีพลังถาวรกว่าการเลื่อนของอุปทานระยะยาวเสมอ","ทั้งสองกรณีจบเหมือนกันคือผลผลิตกลับสู่ระดับเดิม เพราะกลไกปรับตัวเองของเส้นอุปทานระยะสั้นจะดึงเศรษฐกิจกลับสู่จุดเริ่มต้นไม่ว่าเส้นใดจะเป็นต้นเหตุของการเปลี่ยนแปลง"],"answer":0,"a":"นี่คือการเปรียบเทียบที่แยกคนเข้าใจจริงออกจากคนท่องจำ\nกรณี ก AD เลื่อนขวา — ผลผลิตทะลุ Y_FE ในระยะสั้น แต่ Y_FE ไม่ได้เปลี่ยน ตลาดแรงงานตึงตัว ค่าจ้างและต้นทุนถูกดันขึ้น SRAS เลื่อนขึ้นจนผลผลิตถอยกลับมาที่ Y_FE เดิม เหลือไว้เพียงระดับราคาที่สูงขึ้นถาวร\nกรณี ข LRAS เลื่อนขวา — ระดับผลผลิตที่ยั่งยืนสูงขึ้นจริง เศรษฐกิจผลิตมากขึ้นได้โดยไม่ตึงตัว ไม่มีแรงกดดันให้ค่าจ้างพุ่ง ผลผลิตที่สูงขึ้นจึงคงอยู่ และอุปทานที่มากขึ้นยังกดระดับราคาให้ต่ำลงด้วย\nบทเรียนเชิงนโยบาย — การเติบโตที่แท้จริงและยั่งยืนมาจากการเลื่อน LRAS เท่านั้น นโยบายด้านอุปสงค์มีไว้เพื่อรักษาเสถียรภาพระยะสั้น ไม่ใช่เพื่อสร้างการเติบโตระยะยาว","whys":["ถูกต้อง — ระบุความต่างที่ปลายทางได้ถูกทั้งสองกรณี และชี้ต้นเหตุว่ามาจากการขยายศักยภาพที่แท้จริงหรือไม่","ไม่ถูกต้อง — กรณีที่ AD เลื่อนไม่ได้เพิ่มศักยภาพการผลิต ผลผลิตในระยะยาวจึงกลับสู่ระดับเดิม ไม่ได้สูงขึ้นถาวร","ไม่ถูกต้อง — สลับผลลัพธ์ของสองกรณีทั้งหมด การเลื่อนของ LRAS ต่างหากที่ให้ผลถาวร ไม่ใช่การเลื่อนของ AD","ไม่ถูกต้อง — กลไกปรับตัวเองดึงผลผลิตกลับสู่ Y_FE ซึ่งในกรณีที่ LRAS เลื่อนขวา ค่า Y_FE นั้นสูงขึ้นแล้ว"],"tip":"ประโยคสรุปที่ควรจำ: นโยบายด้านอุปสงค์รักษาเสถียรภาพ · นโยบายด้านอุปทานสร้างการเติบโต — สองอย่างนี้คนละหน้าที่กัน"},{"id":"E10","type":"mcq","lvl":3,"topic":"AD-AS","ref":"ระบุช่องว่างจากข้อมูลตลาดแรงงาน","q":"ธนาคารกลางรายงานว่าอัตราการว่างงานจริงอยู่ที่ 3.2% ขณะที่ประเมินอัตราธรรมชาติไว้ที่ 4.5% และอัตราการเปิดรับสมัครงานต่อผู้ว่างงานสูงเป็นประวัติการณ์ ข้อใดวินิจฉัยสถานะของเศรษฐกิจได้ถูกต้อง","choices":["เศรษฐกิจอยู่ในช่องว่างเงินเฟ้อ ผลผลิตสูงกว่า Y_FE ดุลยภาพระยะสั้นอยู่ขวาของ LRAS และมีแรงกดดันให้ค่าจ้างกับราคาสูงขึ้นจน SRAS เลื่อนขึ้นในระยะถัดไป","เศรษฐกิจอยู่ในช่องว่างการหดตัว ผลผลิตต่ำกว่า Y_FE ดุลยภาพระยะสั้นอยู่ซ้ายของ LRAS และมีแรงกดดันให้ค่าจ้างกับราคาลดลงจนเส้นอุปทานระยะสั้นเลื่อนลงในระยะถัดไป","เศรษฐกิจอยู่ในดุลยภาพระยะยาวพอดี เพราะอัตราการว่างงานที่ต่ำกว่าอัตราธรรมชาติแสดงว่าตลาดแรงงานทำงานได้อย่างมีประสิทธิภาพสูงสุดและทรัพยากรถูกใช้อย่างเหมาะสมที่สุดแล้ว","ไม่สามารถวินิจฉัยได้เลยจากข้อมูลนี้ เพราะอัตราการว่างงานเป็นตัวชี้วัดของตลาดแรงงานซึ่งแยกขาดจากแบบจำลอง AD-AS ที่พิจารณาเฉพาะตลาดสินค้าและบริการเท่านั้น"],"answer":0,"a":"ข้อมูลตลาดแรงงานแปลตรงเป็นสถานะในแบบจำลอง AD-AS ได้\nอัตราการว่างงานจริงต่ำกว่าอัตราธรรมชาติ (3.2% เทียบ 4.5%) แปลว่าเศรษฐกิจกำลังใช้แรงงานเกินระดับที่ยั่งยืน คือมีการว่างงานตามวัฏจักรติดลบ\nตำแหน่งในกราฟ — ผลผลิตสูงกว่า Y_FE ดุลยภาพระยะสั้นอยู่ขวาของ LRAS จึงเป็นช่องว่างเงินเฟ้อ\nหลักฐานเสริม — อัตราการเปิดรับสมัครงานต่อผู้ว่างงานที่สูงเป็นประวัติการณ์ยืนยันว่าตลาดแรงงานตึงตัวมาก นายจ้างแย่งคนกัน\nสิ่งที่จะเกิดต่อไป — แรงงานมีอำนาจต่อรองสูง ค่าจ้างถูกดันขึ้น ต้นทุนของผู้ผลิตสูงตาม SRAS เลื่อนขึ้น ผลผลิตถอยกลับสู่ Y_FE โดยราคาค้างสูงขึ้น","whys":["ถูกต้อง — แปลข้อมูลตลาดแรงงานเป็นตำแหน่งในกราฟ AD-AS ได้ถูกต้อง และคาดการณ์ทิศทางการปรับตัวถัดไปได้","ไม่ถูกต้อง — อัตราการว่างงานจริงต่ำกว่าอัตราธรรมชาติ ซึ่งหมายถึงเศรษฐกิจร้อนแรงเกินไป ไม่ใช่ซบเซา","ไม่ถูกต้อง — ดุลยภาพระยะยาวคือจุดที่อัตราการว่างงานจริงเท่ากับอัตราธรรมชาติพอดี การต่ำกว่าแปลว่าเกินความยั่งยืน","ไม่ถูกต้อง — ตลาดแรงงานกับตลาดสินค้าเชื่อมกันโดยตรง เพราะแรงงานคือปัจจัยที่ใช้ผลิตสินค้า ข้อมูลทั้งสองจึงแปลกันได้"],"tip":"ท่องสามภาษาที่พูดเรื่องเดียวกัน: u  Y_FE = ขวาของ LRAS = ช่องว่างเงินเฟ้อ และกลับด้านทั้งหมดสำหรับช่องว่างการหดตัว"},{"id":"E11","type":"mcq","lvl":2,"topic":"AD-AS","ref":"ผลผลิตเกินศักยภาพเป็นไปได้อย่างไร","q":"หากเส้น LRAS แสดงถึงผลผลิต ณ การจ้างงานเต็มที่ เหตุใดเศรษฐกิจจึงสามารถผลิตได้มากกว่าระดับนั้นในระยะสั้น","choices":["เพราะผลผลิตการจ้างงานเต็มที่คือระดับที่ยั่งยืนในระยะยาว ไม่ใช่เพดานทางกายภาพสูงสุด ระยะสั้นจึงผลิตเกินได้ด้วยการทำล่วงเวลา เดินเครื่องโดยไม่หยุดซ่อม และดึงคนที่ปกติไม่ทำงานเข้ามา","เพราะเส้น LRAS ถูกประเมินไว้ต่ำกว่าความเป็นจริงเสมอ การที่เศรษฐกิจผลิตได้เกินระดับนั้นจึงเป็นเพียงหลักฐานว่าการประมาณการผลผลิตศักยภาพของหน่วยงานทางการมีความคลาดเคลื่อน","เพราะในระยะสั้นประเทศสามารถนำเข้าสินค้าจากต่างประเทศมาเสริม ทำให้ปริมาณสินค้าในระบบเศรษฐกิจสูงกว่าที่ผลิตได้เอง ผลผลิตที่วัดได้จึงเกินระดับการจ้างงานเต็มที่ไปได้","เพราะระดับราคาที่สูงขึ้นทำให้มูลค่าผลผลิตที่วัดเป็นตัวเงินสูงขึ้น แม้ปริมาณสินค้าที่ผลิตได้จริงจะไม่ได้เพิ่มขึ้นเลย ตัวเลขผลผลิตจึงดูเหมือนเกินระดับศักยภาพในทางสถิติ"],"answer":0,"a":"ความเข้าใจผิดที่พบบ่อยคือคิดว่า Y_FE เป็นเพดานทางกายภาพที่ทะลุไม่ได้ ความจริงคือมันเป็นระดับที่ยั่งยืน\nในระยะสั้น เศรษฐกิจผลิตเกินระดับนี้ได้จริงด้วยวิธีที่แลกมาด้วยต้นทุน — ให้พนักงานทำล่วงเวลา เดินเครื่องจักรต่อเนื่องโดยเลื่อนการซ่อมบำรุง ดึงคนที่ปกติอยู่นอกกำลังแรงงานเข้ามาทำงาน และลดการฝึกอบรมลงเพื่อเอาคนเข้าไลน์ผลิต\nทั้งหมดนี้ทำได้ชั่วคราว แต่ไม่ยั่งยืน เพราะพนักงานเหนื่อยล้า เครื่องจักรเสื่อม และค่าจ้างที่ต้องจ่ายเพิ่มขึ้นเรื่อย ๆ เมื่อหาคนไม่ได้ ต้นทุนจึงสูงขึ้นจนผู้ผลิตต้องขึ้นราคา และเศรษฐกิจถูกดึงกลับมาที่ Y_FE ในที่สุด\nการเข้าใจจุดนี้ทำให้เห็นว่าทำไมช่องว่างเงินเฟ้อจึงต้องปิดตัวลงเสมอในระยะยาว","whys":["ถูกต้อง — แยกระหว่างระดับที่ยั่งยืนกับเพดานทางกายภาพ และยกวิธีที่เศรษฐกิจใช้ผลิตเกินได้ชั่วคราว","ไม่ถูกต้อง — แม้การประเมิน Y_FE จะมีความคลาดเคลื่อนได้จริง แต่การผลิตเกินศักยภาพเป็นปรากฏการณ์จริงที่เกิดขึ้นได้แม้ประเมินถูก","ไม่ถูกต้อง — ผลผลิตที่แท้จริง (GDP) นับเฉพาะสิ่งที่ผลิตภายในประเทศ สินค้านำเข้าจึงไม่ถูกนับรวมในตัวเลขนี้","ไม่ถูกต้อง — แกนนอนของกราฟคือผลผลิตที่แท้จริงซึ่งหักผลของระดับราคาออกไปแล้ว จึงไม่ใช่ภาพลวงทางสถิติ"]},{"id":"E12","type":"mcq","lvl":4,"topic":"AD-AS","ref":"อ่านกราฟลำดับการปรับตัวสามจุด","q":"จากแผนภาพ เศรษฐกิจเริ่มที่ A แล้ว AD เลื่อนขวาพาไปที่ B และในที่สุดปรับตัวไปจบที่ C ข้อใดอธิบายลำดับเหตุการณ์และสิ่งที่เปลี่ยนแปลงระหว่าง A กับ C ได้ถูกต้อง","choices":["A เป็นดุลยภาพระยะยาวเดิม · B เป็นดุลยภาพระยะสั้นที่มีช่องว่างเงินเฟ้อ · C เป็นดุลยภาพระยะยาวใหม่ที่ผลผลิตเท่า A แต่ระดับราคาสูงขึ้นจาก P₁ เป็น P₂","A เป็นดุลยภาพระยะสั้น · B เป็นดุลยภาพระยะยาวที่ผลผลิตสูงขึ้นถาวร · C เป็นจุดที่เศรษฐกิจถดถอยลงเพราะราคาที่สูงเกินไปทำให้ผู้บริโภคลดการใช้จ่ายลงอย่างมาก","A เป็นดุลยภาพระยะยาวเดิม · B เป็นดุลยภาพระยะสั้นที่มีช่องว่างการหดตัว · C เป็นดุลยภาพระยะยาวใหม่ที่ผลผลิตเท่า A แต่ระดับราคาลดลงจาก P₁ มาที่ระดับที่ต่ำกว่าเดิม","ทั้งสามจุดเป็นดุลยภาพระยะยาวเหมือนกันหมด เพราะทุกจุดล้วนเป็นจุดที่เส้นอุปสงค์มวลรวมตัดกับเส้นอุปทานมวลรวมระยะสั้น ณ ระดับราคาและผลผลิตที่ตลาดยอมรับได้ในขณะนั้น"],"answer":0,"a":"อ่านเส้นทางทีละจุด\nจุด A — เส้นทั้งสาม (AD₁, SRAS₁, LRAS) ตัดกันที่จุดเดียว จึงเป็นดุลยภาพระยะยาว\nจุด B — AD เลื่อนไป AD₂ จุดตัดกับ SRAS₁ ขยับไปทางขวาโดยราคาคงที่ที่ P₁ จุด B อยู่ขวาของ LRAS จึงเป็นดุลยภาพระยะสั้นที่มีช่องว่างเงินเฟ้อ ตลาดแรงงานตึงตัว อัตราการว่างงานต่ำกว่าอัตราธรรมชาติ\nจุด C — ความตึงตัวดันค่าจ้างและต้นทุนขึ้น SRAS เลื่อนจาก SRAS₁ ขึ้นไป SRAS₂ ผลผลิตถอยกลับมาที่ Y_FE และเส้นทั้งสามตัดกันอีกครั้ง จึงเป็นดุลยภาพระยะยาวใหม่\nเปรียบเทียบ A กับ C — ผลผลิตเท่ากันที่ Y_FE แต่ระดับราคาสูงขึ้นจาก P₁ เป็น P₂ นี่คือภาพสรุปของความเป็นกลางของนโยบายด้านอุปสงค์ในระยะยาว","whys":["ถูกต้อง — จำแนกประเภทของทั้งสามจุดได้ถูก และสรุปการเปรียบเทียบ A กับ C ได้ตรงตามภาพ","ไม่ถูกต้อง — จุด B ไม่ใช่ดุลยภาพระยะยาวเพราะอยู่นอกเส้น LRAS และจุด C ก็ไม่ใช่ภาวะถดถอยเพราะอยู่ที่ Y_FE พอดี","ไม่ถูกต้อง — จุด B อยู่ทางขวาของ LRAS จึงเป็นช่องว่างเงินเฟ้อ และระดับราคาปลายทางที่ C ก็สูงขึ้นไม่ใช่ลดลง","ไม่ถูกต้อง — ดุลยภาพระยะยาวต้องมีเส้นทั้งสามตัดกันที่จุดเดียว ซึ่งจุด B ไม่เข้าเงื่อนไขนี้เพราะอยู่นอกเส้น LRAS"],"fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n  <defs>\n    <clipPath id=\"clipG\"><rect x=\"62\" y=\"26\" width=\"466\" height=\"318\"/></clipPath>\n    <marker id=\"arwG\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/>\n    </marker>\n  </defs>\n  <line x1=\"62\" y1=\"18\" x2=\"62\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <line x1=\"62\" y1=\"344\" x2=\"540\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <text x=\"52\" y=\"14\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">P</text>\n  <text x=\"548\" y=\"349\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Y</text><g clip-path=\"url(#clipG)\"><line x1=\"325.28999999999996\" y1=\"356.72\" x2=\"325.28999999999996\" y2=\"26\" stroke=\"var(--curve-lras)\" stroke-width=\"2.6\" /><line x1=\"34.040000000000006\" y1=\"200.9\" x2=\"555.96\" y2=\"200.9\" stroke=\"var(--curve-as)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"75.98\" y=\"191.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-as)\" text-anchor=\"start\">SRAS₁</text><line x1=\"34.040000000000006\" y1=\"146.84\" x2=\"555.96\" y2=\"146.84\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\" stroke-dasharray=\"7 5\" stroke-linecap=\"round\"/><text x=\"75.98\" y=\"137.84\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ghost)\" text-anchor=\"start\">SRAS₂</text><line x1=\"15.399999999999999\" y1=\"38.72000000000003\" x2=\"574.6\" y2=\"331.28\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\"  stroke-linecap=\"round\"/><text x=\"151.88\" y=\"98.98400000000001\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ghost)\" text-anchor=\"start\">AD₁</text><line x1=\"117.91999999999999\" y1=\"38.72000000000003\" x2=\"677.12\" y2=\"331.28\" stroke=\"var(--curve-ad)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"254.4\" y=\"98.98400000000001\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ad)\" text-anchor=\"start\">AD₂</text><circle cx=\"325.28999999999996\" cy=\"200.9\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"303.28999999999996\" y=\"216.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">A</text><circle cx=\"427.81\" cy=\"200.9\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"437.81\" y=\"216.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">B</text><circle cx=\"325.28999999999996\" cy=\"146.84\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"335.28999999999996\" y=\"134.84\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">C</text></g><text x=\"325.28999999999996\" y=\"17\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-lras)\" text-anchor=\"middle\">LRAS</text><text x=\"325.28999999999996\" y=\"366\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"middle\">Y<tspan dy=\"4\" font-size=\"11\">FE</tspan></text><text x=\"53\" y=\"205.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₁</text><text x=\"53\" y=\"151.84\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₂</text></svg><div class=\"figcap\">เส้นทาง A → B → C — จุด A และ C ต่างก็เป็นดุลยภาพระยะยาว ส่วน B เป็นดุลยภาพระยะสั้น</div></div>"},{"id":"E13","type":"mcq","lvl":4,"topic":"AD-AS","ref":"กรณีที่ดุลยภาพระยะยาวใหม่ต่างจากเดิมทั้ง P และ Y","q":"เศรษฐกิจอยู่ในดุลยภาพระยะยาว แล้วเกิดสองเหตุการณ์พร้อมกัน — ประเทศค้นพบแหล่งพลังงานขนาดใหญ่ที่ใช้ได้อย่างถาวร และรัฐบาลลดรายจ่ายภาครัฐลงอย่างมาก ข้อใดอธิบายดุลยภาพระยะยาวใหม่ได้ถูกต้องที่สุด","choices":["LRAS เลื่อนขวาจากทรัพยากรที่เพิ่มขึ้น ขณะที่ AD เลื่อนซ้ายจาก G ที่ลดลง ดุลยภาพระยะยาวใหม่จึงอยู่ที่ผลผลิตสูงขึ้นตาม LRAS ใหม่ และระดับราคาต่ำลงชัดเจนจากทั้งสองแรง","LRAS เลื่อนขวาและ AD เลื่อนซ้าย ดุลยภาพระยะยาวใหม่จึงอยู่ที่ผลผลิตเท่าเดิมและระดับราคาเท่าเดิม เพราะสองเหตุการณ์นี้หักล้างกันพอดีตามหลักดุลยภาพทั่วไปของระบบเศรษฐกิจ","LRAS เลื่อนซ้ายเพราะการลดรายจ่ายภาครัฐทำให้การลงทุนในโครงสร้างพื้นฐานหายไป ส่วน AD เลื่อนซ้ายด้วย ดุลยภาพระยะยาวใหม่จึงอยู่ที่ผลผลิตต่ำลงและระดับราคาสูงขึ้นอย่างชัดเจน","เฉพาะ AD เท่านั้นที่เลื่อนซ้าย เพราะการค้นพบแหล่งพลังงานยังไม่ได้ถูกนำมาใช้ผลิตจริง ดุลยภาพระยะยาวใหม่จึงอยู่ที่ผลผลิตเท่าเดิมตาม LRAS เดิมและระดับราคาที่ต่ำลงกว่าเดิม"],"answer":0,"a":"ข้อนี้ยากเพราะเส้นสองเส้นเลื่อนพร้อมกัน และต้องแยกให้ออกว่าแต่ละเส้นกำหนดอะไร\nผลผลิตในระยะยาว — ถูกกำหนดโดยLRAS เท่านั้น เมื่อ LRAS เลื่อนขวาจากทรัพยากรพลังงานที่เพิ่มขึ้นอย่างถาวร ผลผลิตระยะยาวจึงสูงขึ้นแน่นอน โดยไม่สนว่า AD จะเลื่อนไปทางไหน\nระดับราคาในระยะยาว — ถูกกำหนดโดยตำแหน่งของ AD เทียบกับ LRAS ในที่นี้ AD เลื่อนซ้าย (G ลด) ขณะที่ LRAS เลื่อนขวา ทั้งสองแรงต่างก็กดระดับราคาลง ระดับราคาจึงลดลงชัดเจน\nนี่คือกรณีที่ดุลยภาพระยะยาวใหม่ต่างจากเดิมทั้งสองมิติ ซึ่งต่างจากกรณีที่ AD เลื่อนอย่างเดียว (Y เท่าเดิม P เปลี่ยน) หรือ LRAS เลื่อนอย่างเดียว (เปลี่ยนทั้งคู่ไปคนละทาง)","whys":["ถูกต้อง — แยกได้ว่าผลผลิตระยะยาวถูกกำหนดโดย LRAS เท่านั้น ส่วนระดับราคาถูกกำหนดโดยตำแหน่งสัมพัทธ์ของ AD","ไม่ถูกต้อง — สองเหตุการณ์กระทบคนละเส้นและคนละมิติ จึงไม่มีทางหักล้างกันพอดี ผลผลิตระยะยาวสูงขึ้นแน่นอนตาม LRAS","ไม่ถูกต้อง — โจทย์ไม่ได้ระบุว่ารายจ่ายที่ลดเป็นการลงทุนโครงสร้างพื้นฐาน และการค้นพบพลังงานก็ดัน LRAS ไปทางขวาชัดเจน","ไม่ถูกต้อง — โจทย์ระบุว่าแหล่งพลังงานใช้ได้อย่างถาวร ซึ่งเพิ่มทรัพยากรที่แท้จริงของประเทศและเลื่อน LRAS ไปทางขวา"],"tip":"เมื่อ LRAS เลื่อน ให้จำหลักนี้: ผลผลิตระยะยาว อ่านจาก LRAS เท่านั้น · ระดับราคาระยะยาว อ่านจากว่า AD ไปตัด LRAS ใหม่ที่ความสูงเท่าใด"},{"id":"E14","type":"mcq","lvl":3,"topic":"AD-AS","ref":"นโยบายการเงินแบบผ่อนคลายครบสองระยะ","q":"เศรษฐกิจอยู่ในช่องว่างการหดตัว ธนาคารกลางจึงลดอัตราดอกเบี้ยนโยบายลงมาก ข้อใดอธิบายกลไก ผลระยะสั้นและระยะยาว พร้อมข้อเสียของนโยบายนี้ได้ถูกต้องที่สุด","choices":["ต้นทุนการกู้ถูกลง I และ C เพิ่ม AD เลื่อนขวา ระยะสั้นผลผลิตฟื้นเข้าหา Y_FE โดยราคาคงเดิม · ข้อเสียคือเสี่ยงเงินเฟ้อและฟองสบู่ ส่งผ่านล่าช้า และเงินทุนไหลออกทำให้ค่าเงินอ่อน","ต้นทุนการกู้ถูกลง I และ C เพิ่ม AD เลื่อนขวา ระยะสั้นผลผลิตฟื้นเข้าหา Y_FE โดยราคาคงเดิม · ข้อดีคือได้ผลผลิตสูงขึ้นอย่างถาวรโดยไม่มีต้นทุนใด ๆ เพราะเส้น LRAS เลื่อนตามไปด้วย","ต้นทุนการกู้ถูกลงทำให้ผู้ผลิตลดราคาขาย SRAS เลื่อนลง ระยะสั้นผลผลิตเพิ่มและราคาลด · ข้อเสียคือผู้ผลิตอาจขาดทุนจนต้องปิดกิจการและผลผลิตศักยภาพของประเทศลดลงในระยะยาว","ต้นทุนการกู้ถูกลงทำให้ผู้ออมได้ผลตอบแทนน้อยลงจึงออมมากขึ้นเพื่อชดเชย AD เลื่อนซ้าย ระยะสั้นผลผลิตยิ่งลดลง · ข้อเสียคือภาวะถดถอยจะรุนแรงขึ้นกว่าเดิมอย่างมีนัยสำคัญ"],"answer":0,"a":"กลไกส่งผ่าน — อัตราดอกเบี้ยนโยบายที่ต่ำลงทำให้ต้นทุนเงินทุนถูกลง ธุรกิจลงทุนมากขึ้น (I เพิ่ม) ครัวเรือนกู้ซื้อบ้านซื้อรถมากขึ้น (C เพิ่ม) และดอกเบี้ยที่ต่ำยังทำให้เงินทุนไหลออกจนค่าเงินอ่อนซึ่งช่วย NX อีกทาง เส้น AD จึงเลื่อนขวา\nระยะสั้น — ในกรอบ SRAS แนวนอน ผลผลิตฟื้นตัวเข้าหา Y_FE โดยระดับราคายังคงเดิม การว่างงานตามวัฏจักรลดลง\nระยะยาว — หากกระตุ้นพอดี ช่องว่างปิดและเศรษฐกิจกลับสู่ดุลยภาพระยะยาว แต่หากกระตุ้นเกิน ผลผลิตจะทะลุ Y_FE ค่าจ้างถูกดันขึ้น SRAS เลื่อนขึ้น และผลผลิตถอยกลับโดยเหลือราคาที่สูงขึ้น\nข้อเสีย — เสี่ยงเงินเฟ้อและฟองสบู่ในสินทรัพย์ · ส่งผ่านล่าช้าจนจับจังหวะยาก · เงินทุนไหลออกทำให้ค่าเงินอ่อนและต้นทุนนำเข้าแพงขึ้น","whys":["ถูกต้อง — ครบทั้งกลไกส่งผ่าน ผลระยะสั้น และข้อเสียที่แท้จริงของนโยบายการเงินแบบผ่อนคลาย","ไม่ถูกต้อง — นโยบายการเงินกระทบฝั่งอุปสงค์ ไม่ได้ขยายศักยภาพการผลิต เส้น LRAS จึงไม่เลื่อนตาม และนโยบายนี้มีต้นทุนจริง","ไม่ถูกต้อง — ช่องทางหลักของอัตราดอกเบี้ยคือการตัดสินใจใช้จ่ายและลงทุนซึ่งอยู่ฝั่งอุปสงค์ ไม่ใช่ต้นทุนการผลิตที่เลื่อน SRAS","ไม่ถูกต้อง — ดอกเบี้ยที่ต่ำลงทำให้ผลตอบแทนจากการออมน้อยลง จึงจูงใจให้ใช้จ่ายมากขึ้น ไม่ใช่ออมมากขึ้น"],"tip":"โจทย์ข้อเขียนแนวนี้ให้คะแนนสี่ส่วน: ทิศทางนโยบาย · กลไกส่งผ่าน · กราฟ · ข้อดีข้อเสีย — ขาดส่วนใดเสียคะแนนทันที"},{"id":"E15","type":"mcq","lvl":3,"topic":"AD-AS","ref":"นโยบายการเงินแบบเข้มงวดครบสองระยะ","q":"เศรษฐกิจอยู่ในช่องว่างเงินเฟ้อ ธนาคารกลางจึงปรับขึ้นอัตราดอกเบี้ยนโยบายอย่างมีนัยสำคัญ ข้อใดอธิบายวัตถุประสงค์ ผลต่อ P และ Y พร้อมต้นทุนของนโยบายได้ถูกต้อง","choices":["วัตถุประสงค์คือชะลอเศรษฐกิจที่ร้อนแรงและคุมเงินเฟ้อ AD เลื่อนซ้ายทำให้ผลผลิตกลับเข้าหา Y_FE · ต้นทุนคือการว่างงานที่สูงขึ้นชั่วคราว ภาระดอกเบี้ยของลูกหนี้ และการลงทุนที่ถูกชะลอ","วัตถุประสงค์คือกระตุ้นการจ้างงานให้สูงขึ้น AD เลื่อนขวาทำให้ผลผลิตเพิ่มขึ้นเหนือระดับศักยภาพ · ต้นทุนคือระดับราคาที่ลดต่ำลงมากเกินไปจนเกิดภาวะเงินฝืดในระบบเศรษฐกิจ","วัตถุประสงค์คือเพิ่มปริมาณเงินในระบบให้มากขึ้น SRAS เลื่อนลงทำให้ราคาลดลงโดยผลผลิตไม่เปลี่ยน · ต้นทุนคือธนาคารพาณิชย์มีสภาพคล่องล้นเกินจนต้องปล่อยกู้อย่างไม่ระมัดระวัง","วัตถุประสงค์คือทำให้ค่าเงินอ่อนลงเพื่อช่วยผู้ส่งออก NX เพิ่มขึ้นและ AD เลื่อนขวา · ต้นทุนคือสินค้านำเข้าแพงขึ้นจนกระทบค่าครองชีพของครัวเรือนที่มีรายได้น้อยอย่างรุนแรง"],"answer":0,"a":"วัตถุประสงค์ — เมื่อเศรษฐกิจอยู่ขวาของ LRAS ตลาดแรงงานตึงตัวจนค่าจ้างและราคาถูกดันขึ้น ธนาคารกลางต้องชะลออุปสงค์ก่อนที่การคาดการณ์เงินเฟ้อจะฝังตัว\nกลไก — ดอกเบี้ยที่สูงขึ้นทำให้ต้นทุนการกู้แพงขึ้น I และ C ลดลง อีกทั้งเงินทุนไหลเข้าทำให้ค่าเงินแข็งและ NX ลดลง เส้น AD เลื่อนซ้าย ผลผลิตชะลอกลับเข้าหา Y_FE และแรงกดดันด้านราคาผ่อนคลายลง\nต้นทุน — ระหว่างทางการว่างงานสูงขึ้น ธุรกิจชะลอการลงทุน ลูกหนี้แบกภาระดอกเบี้ยหนักขึ้น และหากขึ้นแรงหรือนานเกินไปอาจผลักเศรษฐกิจเข้าสู่ภาวะถดถอยจริง\nนี่คือเหตุผลที่ธนาคารกลางต้องชั่งน้ำหนักระหว่างเสถียรภาพราคากับการจ้างงานอยู่เสมอ","whys":["ถูกต้อง — ระบุวัตถุประสงค์ กลไกผ่าน AD และต้นทุนที่แท้จริงของนโยบายการเงินแบบเข้มงวดได้ครบถ้วน","ไม่ถูกต้อง — การขึ้นดอกเบี้ยเป็นนโยบายหดตัว ซึ่งลดอุปสงค์รวม ไม่ใช่กระตุ้นการจ้างงานหรือเลื่อน AD ไปทางขวา","ไม่ถูกต้อง — การขึ้นดอกเบี้ยลดปริมาณเงินในระบบ และนโยบายการเงินทำงานผ่านเส้น AD ไม่ใช่ผ่านเส้น SRAS","ไม่ถูกต้อง — ดอกเบี้ยที่สูงขึ้นดึงเงินทุนไหลเข้าและทำให้ค่าเงินแข็งขึ้น ซึ่งกด NX ลง ไม่ใช่ทำให้ค่าเงินอ่อน"]},{"id":"E16","type":"mcq","lvl":4,"topic":"AD-AS","ref":"เปรียบเทียบการรอกลไกตลาดกับการใช้นโยบาย","q":"เศรษฐกิจอยู่ในช่องว่างการหดตัวขนาดใหญ่ ที่ปรึกษาสองฝ่ายถกกันว่าควร “รอให้กลไกตลาดปรับตัวเอง” หรือ “ใช้นโยบายกระตุ้น” ข้อใดสรุปข้อดีข้อเสียของทั้งสองทางได้สมดุลที่สุด","choices":["รอกลไกตลาด ได้ผลลัพธ์เดียวกันคือกลับสู่ Y_FE โดยราคาต่ำลงและไม่ก่อหนี้สาธารณะ แต่ช้ามากเพราะค่าจ้างหนืด · ใช้นโยบาย เร็วกว่าและลดต้นทุนการว่างงาน แต่ก่อหนี้และอาจกระตุ้นเกินขนาด","รอกลไกตลาด ได้ผลเร็วกว่าเพราะราคาปรับตัวได้ทันทีในระบบเศรษฐกิจที่มีการแข่งขัน · ใช้นโยบาย ช้ากว่าเพราะต้องผ่านกระบวนการอนุมัติ และไม่มีข้อได้เปรียบใด ๆ เหนือการปล่อยให้ตลาดทำงานเอง","รอกลไกตลาด จะทำให้เศรษฐกิจติดอยู่ในภาวะถดถอยอย่างถาวรเพราะไม่มีแรงใดดึงกลับได้ · ใช้นโยบาย เป็นทางเดียวที่เป็นไปได้และไม่มีต้นทุนใด ๆ เพราะผลผลิตที่ได้คืนมาคุ้มค่าเสมอ","ทั้งสองทางให้ผลลัพธ์ต่างกันโดยสิ้นเชิง โดยการรอกลไกตลาดจะจบที่ระดับราคาสูงขึ้น ส่วนการใช้นโยบายจะจบที่ระดับราคาต่ำลง ดังนั้นการเลือกจึงขึ้นกับว่าต้องการควบคุมเงินเฟ้อหรือไม่"],"answer":0,"a":"สองทางเลือกนี้พาไปที่ผลผลิตปลายทางเดียวกันคือ Y_FE แต่ต่างกันที่เส้นทาง ความเร็ว ต้นทุน และระดับราคาปลายทาง\nรอกลไกตลาด — การว่างงานที่สูงกดค่าจ้างลง SRAS เลื่อนลง ผลผลิตกลับมาเองโดยระดับราคาต่ำลง ข้อดีคือไม่ก่อหนี้สาธารณะและไม่เสี่ยงเงินเฟ้อ ข้อเสียคือช้ามากเพราะค่าจ้างมีความหนืดในการปรับลด ระหว่างทางสังคมแบกต้นทุนเป็นการว่างงานยืดเยื้อ ทักษะเสื่อม และเสี่ยงต่อการที่ปัญหาวัฏจักรกลายเป็นปัญหาโครงสร้าง\nใช้นโยบาย — AD ถูกยกกลับขึ้น ผลผลิตฟื้นเร็วกว่ามาก ข้อดีคือประหยัดต้นทุนการว่างงาน ข้อเสียคือก่อหนี้สาธารณะ อาจเบียดขับการลงทุนเอกชน มีความล่าช้าในการออกฤทธิ์ และหากประเมิน Y_FE ผิดหรือกระตุ้นเกินขนาดจะพลิกเป็นช่องว่างเงินเฟ้อ","whys":["ถูกต้อง — เปรียบเทียบทั้งความเร็ว ต้นทุน ระดับราคาปลายทาง และความเสี่ยงของทั้งสองทางอย่างเป็นธรรม","ไม่ถูกต้อง — ค่าจ้างและราคาปรับตัวลงช้ามากเพราะความหนืด การรอจึงช้ากว่าการใช้นโยบายอย่างมีนัยสำคัญ","ไม่ถูกต้อง — กลไกปรับตัวเองทำงานจริงแม้จะช้า เศรษฐกิจจึงไม่ติดอยู่ถาวร และนโยบายก็มีต้นทุนที่ต้องยอมรับจริง","ไม่ถูกต้อง — ทั้งสองทางพาไปที่ผลผลิตเดียวกันคือ Y_FE ต่างกันที่ระดับราคาปลายทางและความเร็วในการไปถึง"],"tip":"คำตอบที่ได้คะแนนเต็มต้องระบุว่า ปลายทางของผลผลิตเหมือนกัน แต่ระดับราคาและเวลาที่ใช้ต่างกัน — อย่าตอบว่าทางใดทางหนึ่งดีกว่าเสมอ"},{"id":"E17","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ภาวะชะงักงันเงินเฟ้อกับทางเลือกนโยบาย","q":"เศรษฐกิจเผชิญช็อกด้านอุปทานเชิงลบจนระดับราคาสูงขึ้นพร้อมผลผลิตที่ลดลง ข้อใดอธิบายภาวะกลืนไม่เข้าคายไม่ออกของผู้ดำเนินนโยบายและทางออกที่แท้จริงได้ถูกต้อง","choices":["กระตุ้น AD จะกู้ผลผลิตแต่ดันราคาสูงขึ้นอีก · กด AD จะคุมราคาแต่ซ้ำเติมการว่างงาน · ปล่อยกลไกตลาดจะกลับสู่เดิมแต่ช้า · ทางออกระยะยาวคือนโยบายด้านอุปทานที่เลื่อน LRAS ไปทางขวา","กระตุ้น AD จะแก้ได้ทั้งการว่างงานและเงินเฟ้อพร้อมกัน เพราะผลผลิตที่มากขึ้นจะทำให้สินค้าในตลาดมีมากขึ้นและราคาลดลงเองตามกลไกอุปสงค์อุปทานของตลาดสินค้าโดยธรรมชาติ","กด AD อย่างรุนแรงเป็นทางออกเดียวเสมอ เพราะเงินเฟ้อเป็นปัญหาที่ร้ายแรงกว่าการว่างงานในทุกสถานการณ์ และเมื่อควบคุมราคาได้แล้วผลผลิตจะฟื้นตัวกลับมาเองโดยอัตโนมัติ","ไม่มีภาวะกลืนไม่เข้าคายไม่ออกใด ๆ เพราะเครื่องมือด้านอุปสงค์สามารถเลือกกระทบเฉพาะผลผลิตโดยไม่กระทบระดับราคาได้ หากธนาคารกลางปรับขนาดของนโยบายให้เหมาะสมกับสถานการณ์"],"answer":0,"a":"แก่นของปัญหาอยู่ที่ความไม่เข้ากันของเครื่องมือกับปัญหา\nช็อกด้านอุปทาน เคลื่อน P กับ Y ไปคนละทาง\nเครื่องมือด้านอุปสงค์ เคลื่อน P กับ Y ไปทางเดียวกันเสมอ\nเครื่องมือชุดเดียวจึงไม่มีทางแก้ทั้งสองปัญหาพร้อมกันได้ — กระตุ้นเพื่อกู้ผลผลิตก็จะยิ่งดันราคา กดเพื่อคุมราคาก็จะยิ่งกดผลผลิต\nทางเลือกที่สาม คือปล่อยให้กลไกปรับตัวเองทำงาน ค่าจ้างและราคาจะค่อย ๆ ปรับลดลงจน SRAS เลื่อนกลับ ผลผลิตกลับสู่ Y_FE เอง แต่ต้องแลกกับการว่างงานที่ยืดเยื้อ\nทางออกที่แท้จริงในระยะยาว คือนโยบายด้านอุปทาน เช่น กระจายแหล่งพลังงาน เพิ่มประสิทธิภาพการใช้พลังงาน หรือลดต้นทุนเชิงโครงสร้าง ซึ่งเลื่อน LRAS ไปทางขวาและแก้ที่รากของปัญหาโดยไม่ต้องเลือกระหว่างสองความชั่วร้าย","whys":["ถูกต้อง — ระบุทั้งสามทางเลือกพร้อมต้นทุนของแต่ละทาง และชี้ทางออกที่แท้จริงว่าอยู่ฝั่งอุปทาน","ไม่ถูกต้อง — การกระตุ้น AD เพิ่มทั้งผลผลิตและระดับราคา จึงแก้การว่างงานได้แต่ซ้ำเติมเงินเฟ้อให้หนักขึ้น","ไม่ถูกต้อง — การจัดลำดับความสำคัญขึ้นกับบริบทและอาณัติของธนาคารกลาง ไม่มีกฎว่าเงินเฟ้อร้ายแรงกว่าเสมอ","ไม่ถูกต้อง — เครื่องมือด้านอุปสงค์เคลื่อน P กับ Y ไปทางเดียวกันเสมอ จึงไม่สามารถเลือกกระทบเพียงตัวใดตัวหนึ่งได้"]},{"id":"E18","type":"mcq","lvl":4,"topic":"AD-AS","ref":"นโยบายที่สวนทางกันระหว่างสองหน่วยงาน","q":"รัฐบาลเดินนโยบายการคลังแบบขยายตัวอย่างหนัก ขณะที่ธนาคารกลางขึ้นอัตราดอกเบี้ยเพื่อคุมเงินเฟ้อในเวลาเดียวกัน ข้อใดวิเคราะห์ผลลัพธ์ได้ถูกต้องที่สุด","choices":["ทิศทางสุทธิของผลผลิตสรุปไม่ได้เพราะสองแรงผลัก AD คนละทาง แต่ผลที่ค่อนข้างแน่นอนคืออัตราดอกเบี้ยจะสูงขึ้นมากและการลงทุนภาคเอกชนจะถูกเบียดขับออกไปอย่างรุนแรง","ผลผลิตเพิ่มขึ้นแน่นอนเพราะนโยบายการคลังกระทบ AD โดยตรงผ่านรายจ่ายภาครัฐ ซึ่งมีพลังเหนือกว่านโยบายการเงินที่ต้องส่งผ่านทางอ้อมผ่านการตัดสินใจของเอกชนเสมอในทุกกรณี","ผลผลิตลดลงแน่นอนเพราะนโยบายการเงินออกฤทธิ์เร็วกว่านโยบายการคลังที่ต้องผ่านกระบวนการงบประมาณอันยาวนาน ธนาคารกลางจึงเป็นฝ่ายชนะในการชักเย่อทางนโยบายครั้งนี้เสมอ","ทั้งสองนโยบายจะหักล้างกันพอดีทำให้เส้น AD ไม่ขยับเลย ผลผลิตและระดับราคาจึงคงที่ ซึ่งเป็นผลลัพธ์ที่พึงประสงค์ที่สุดเพราะเศรษฐกิจมีเสถียรภาพโดยไม่ต้องแบกต้นทุนใด ๆ"],"answer":0,"a":"เมื่อสองนโยบายผลัก AD ไปคนละทิศ\nทิศทางของผลผลิต — สรุปไม่ได้จากทฤษฎีเพียงอย่างเดียว ต้องรู้ขนาดของแต่ละแรง ขนาดตัวคูณ และความไวของการลงทุนต่ออัตราดอกเบี้ย\nสิ่งที่สรุปได้ค่อนข้างแน่นอน — อัตราดอกเบี้ยจะสูงขึ้นมาก เพราะทั้งสองด้านดันไปทางเดียวกัน คือรัฐบาลกู้เงินจำนวนมากซึ่งเพิ่มความต้องการเงินทุนในตลาด และธนาคารกลางก็ขึ้นดอกเบี้ยนโยบายซ้ำเข้าไปอีก\nผลที่ตามมา — ดอกเบี้ยที่สูงมากทำให้การเบียดขับการลงทุนภาคเอกชนรุนแรงเป็นพิเศษ องค์ประกอบของ GDP จึงเปลี่ยนโครงสร้างไป คือสัดส่วนของ G สูงขึ้นในขณะที่ I หดตัว ซึ่งกระทบการสะสมทุนและอาจฉุด LRAS ในระยะยาว\nนี่คือเหตุผลที่การประสานนโยบาย (policy coordination) ระหว่างรัฐบาลกับธนาคารกลางจึงสำคัญมาก","whys":["ถูกต้อง — แยกได้ว่าอะไรสรุปไม่ได้และอะไรสรุปได้ พร้อมชี้ผลข้างเคียงสำคัญคือการเบียดขับที่รุนแรงขึ้น","ไม่ถูกต้อง — ไม่มีหลักการใดรับประกันว่านโยบายการคลังจะชนะเสมอ ขนาดของผลขึ้นกับตัวคูณและความไวต่อดอกเบี้ย","ไม่ถูกต้อง — ความเร็วในการออกฤทธิ์ไม่ได้ตัดสินขนาดของผลกระทบ และนโยบายการเงินก็มีความล่าช้าในการส่งผ่านเช่นกัน","ไม่ถูกต้อง — การหักล้างพอดีเป๊ะเป็นความบังเอิญที่เกิดยากมาก และแม้ AD จะไม่ขยับ โครงสร้างของ GDP ก็บิดเบี้ยวไปแล้ว"]},{"id":"E19","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ความล่าช้าของนโยบายกับความเสี่ยงที่ตามมา","q":"รัฐบาลเริ่มออกมาตรการกระตุ้นเศรษฐกิจในเดือนที่เศรษฐกิจกำลังถดถอย แต่กว่าเงินจะเบิกจ่ายและส่งผ่านเข้าสู่ระบบก็ผ่านไป 18 เดือน ซึ่งตอนนั้นเศรษฐกิจฟื้นตัวเองแล้ว ข้อใดอธิบายผลได้ถูกต้อง","choices":["มาตรการมาถึงตอนที่เศรษฐกิจอยู่ใกล้ Y_FE แล้ว AD ที่ถูกยกขึ้นจึงผลักผลผลิตเกินศักยภาพ เกิดช่องว่างเงินเฟ้อ นโยบายที่ตั้งใจรักษาเสถียรภาพกลับกลายเป็นตัวสร้างความผันผวนเสียเอง","มาตรการมาถึงช้าจึงไม่มีผลใด ๆ ต่อระบบเศรษฐกิจเลย เพราะเมื่อเศรษฐกิจฟื้นตัวเองแล้ว เส้น AD จะกลับไปอยู่ที่ตำแหน่งดุลยภาพและไม่ตอบสนองต่อรายจ่ายภาครัฐที่เพิ่มเข้ามาอีก","มาตรการมาถึงช้าแต่ยังเป็นผลดี เพราะการกระตุ้นเพิ่มเติมในช่วงที่เศรษฐกิจฟื้นตัวแล้วจะช่วยให้ผลผลิตศักยภาพของประเทศสูงขึ้นถาวรตามแรงส่งของอุปสงค์ที่ขยายตัวต่อเนื่อง","มาตรการจะทำให้เส้น SRAS เลื่อนลงเพราะรายจ่ายภาครัฐช่วยลดต้นทุนของผู้ผลิตผ่านการอุดหนุน ผลผลิตจึงเพิ่มขึ้นพร้อมกับระดับราคาที่ลดลงโดยไม่มีความเสี่ยงด้านเงินเฟ้อใด ๆ"],"answer":0,"a":"นี่คือปัญหาความล่าช้าของนโยบาย (policy lag) ซึ่งมีสามชั้น คือความล่าช้าในการรับรู้ว่าเศรษฐกิจถดถอย ความล่าช้าในการตัดสินใจและอนุมัติ และความล่าช้าในการออกฤทธิ์\nเมื่อรวมกันเป็น 18 เดือน มาตรการจึงมาถึงตอนที่เศรษฐกิจปรับตัวเองกลับใกล้ Y_FE แล้ว การยก AD ขึ้นในจังหวะนั้นจึงผลักผลผลิตให้เกินศักยภาพ เกิดช่องว่างเงินเฟ้อ ตลาดแรงงานตึงตัว ค่าจ้างถูกดันขึ้น และในระยะยาว SRAS เลื่อนขึ้นจนเหลือไว้เพียงระดับราคาที่สูงขึ้น\nผลสุทธิคือนโยบายที่ตั้งใจจะลดความผันผวน กลับเพิ่มความผันผวนเสียเอง — เป็นข้อโต้แย้งหลักของนักเศรษฐศาสตร์ที่สนับสนุนกฎเกณฑ์นโยบายที่คาดเดาได้ แทนการใช้ดุลยพินิจปรับตามสถานการณ์","whys":["ถูกต้อง — เชื่อมความล่าช้าของนโยบายเข้ากับผลที่นโยบายกลายเป็นตัวสร้างความผันผวนแทนที่จะลดมัน","ไม่ถูกต้อง — รายจ่ายภาครัฐที่เบิกจ่ายจริงย่อมเพิ่มอุปสงค์รวมเสมอ ไม่ว่าจะมาถึงในจังหวะใดของวัฏจักรก็ตาม","ไม่ถูกต้อง — การกระตุ้นอุปสงค์ไม่ได้เพิ่มแรงงาน ทุน หรือเทคโนโลยี ผลผลิตศักยภาพจึงไม่สูงขึ้นถาวรจากมาตรการนี้","ไม่ถูกต้อง — โจทย์ระบุว่าเป็นมาตรการกระตุ้นเศรษฐกิจทั่วไป ไม่ใช่การอุดหนุนต้นทุนผู้ผลิต ช่องทางหลักจึงอยู่ที่ AD"],"tip":"จำคำว่า policy lag สามชั้น: รับรู้ช้า · ตัดสินใจช้า · ออกฤทธิ์ช้า — นี่คือเหตุผลที่นโยบายรักษาเสถียรภาพทำได้ยากกว่าที่กราฟบอก"},{"id":"E20","type":"mcq","lvl":4,"topic":"AD-AS","ref":"การประเมินผลผลิตศักยภาพผิดพลาด","q":"ธนาคารกลางเชื่อว่าผลผลิตศักยภาพของประเทศสูงกว่าความเป็นจริง จึงกระตุ้นเศรษฐกิจต่อไปแม้ผลผลิตจะเลย Y_FE ที่แท้จริงไปแล้ว ข้อใดอธิบายผลที่จะเกิดขึ้นได้ถูกต้อง","choices":["เศรษฐกิจอยู่ในช่องว่างเงินเฟ้อโดยที่ผู้ดำเนินนโยบายไม่รู้ตัว ค่าจ้างและราคาถูกดันขึ้นต่อเนื่อง SRAS เลื่อนขึ้นเรื่อย ๆ และเงินเฟ้อจะเร่งตัวขึ้นจนกลายเป็นปัญหาที่แก้ยากในภายหลัง","ไม่เกิดปัญหาใด ๆ เพราะการที่ธนาคารกลางกระตุ้นต่อจะทำให้ผลผลิตศักยภาพสูงขึ้นตามความเชื่อนั้นจริง เนื่องจากอุปสงค์ที่แข็งแกร่งจะจูงใจให้ภาคธุรกิจขยายกำลังการผลิตตามไปด้วย","เศรษฐกิจจะเข้าสู่ภาวะเงินฝืดเพราะการกระตุ้นที่มากเกินไปทำให้ผู้ผลิตแข่งขันกันผลิตจนสินค้าล้นตลาด ระดับราคาจึงลดลงต่อเนื่องและผลผลิตหดตัวลงตามอุปสงค์ที่อิ่มตัวแล้ว","เส้น LRAS จะเลื่อนขวามาบรรจบกับระดับผลผลิตที่ธนาคารกลางเชื่อ เพราะการประเมินของหน่วยงานทางการมีผลต่อการคาดการณ์ของตลาดซึ่งจะทำให้ศักยภาพที่แท้จริงปรับตามในที่สุด"],"answer":0,"a":"ปัญหานี้คือความยากที่สุดในทางปฏิบัติของนโยบายรักษาเสถียรภาพ — Y_FE มองไม่เห็นด้วยตาเปล่า ต้องประมาณการเอาและมักคลาดเคลื่อน\nเมื่อประเมินสูงเกินจริง ธนาคารกลางจะคิดว่ายังมีช่องว่างการหดตัวเหลืออยู่และกระตุ้นต่อ ทั้งที่เศรษฐกิจอยู่ขวาของ LRAS จริงแล้ว ผลคือช่องว่างเงินเฟ้อที่ถูกซ้ำเติมเรื่อย ๆ\nตลาดแรงงานตึงตัวเกินไป ค่าจ้างถูกดันขึ้น SRAS เลื่อนขึ้น แต่เมื่อผู้ดำเนินนโยบายยังเชื่อว่ายังมีที่ว่าง ก็จะกระตุ้นซ้ำอีก วงจรนี้ทำให้เงินเฟ้อเร่งตัวขึ้นเรื่อย ๆ และที่อันตรายที่สุดคือเมื่อการคาดการณ์เงินเฟ้อฝังตัวแล้ว การดึงกลับลงมาต้องแลกด้วยการว่างงานที่สูงเป็นเวลานาน — บทเรียนนี้คือสิ่งที่เกิดขึ้นจริงในหลายประเทศช่วงทศวรรษ 1970","whys":["ถูกต้อง — อธิบายทั้งกลไกที่เงินเฟ้อเร่งตัวและอันตรายของการที่การคาดการณ์เงินเฟ้อฝังตัวในระบบ","ไม่ถูกต้อง — อุปสงค์ที่แข็งแกร่งไม่ได้เพิ่มแรงงาน ทุน หรือเทคโนโลยี ผลผลิตศักยภาพจึงไม่ปรับตามความเชื่อของผู้ดำเนินนโยบาย","ไม่ถูกต้อง — การกระตุ้นเกินขนาดทำให้อุปสงค์ล้นเกินกำลังการผลิต ซึ่งดันราคาขึ้น ไม่ใช่ทำให้เกิดภาวะเงินฝืด","ไม่ถูกต้อง — LRAS ถูกกำหนดโดยปัจจัยการผลิตที่มีอยู่จริง ไม่ได้ปรับตามการประเมินหรือความเชื่อของหน่วยงานใด"],"tip":"ข้อจำกัดใหญ่ที่สุดของนโยบายรักษาเสถียรภาพคือ เรามองไม่เห็น Y_FE — กราฟดูง่ายเพราะมีเส้น LRAS วาดไว้ให้ แต่ในโลกจริงไม่มีใครวาดให้"},{"id":"E21","type":"mcq","lvl":3,"topic":"AD-AS","ref":"เลือกนโยบายจากกราฟช่องว่างการหดตัว","q":"จากแผนภาพ เศรษฐกิจอยู่ที่จุด B ข้อใดคือชุดนโยบายที่ตรงกับปัญหาและระบุผลข้างเคียงได้ถูกต้อง","choices":["ใช้นโยบายการคลังแบบขาดดุลร่วมกับนโยบายการเงินแบบผ่อนคลายเพื่อยก AD ไปทางขวา · ผลข้างเคียงคือหนี้สาธารณะสูงขึ้น การเบียดขับการลงทุนเอกชน และความเสี่ยงหากกระตุ้นเกินขนาด","ใช้นโยบายงบประมาณแบบเกินดุลร่วมกับการขึ้นอัตราดอกเบี้ยนโยบายเพื่อสร้างความเชื่อมั่นให้ตลาดการเงิน · ผลข้างเคียงคือการว่างงานอาจสูงขึ้นชั่วคราวก่อนที่เศรษฐกิจจะฟื้นตัวอย่างยั่งยืน","ใช้มาตรการควบคุมราคาสินค้าด้วยการกำหนดเพดานราคาเพื่อให้ผู้บริโภคซื้อของได้ถูกลง · ผลข้างเคียงคืออาจเกิดการขาดแคลนสินค้าในตลาดหากผู้ผลิตไม่ยอมผลิตในราคาที่กำหนด","ใช้การเพิ่มการดำรงสินทรัพย์สภาพคล่องของธนาคารพาณิชย์เพื่อให้ระบบธนาคารมั่นคงและปล่อยกู้ได้มากขึ้น · ผลข้างเคียงคือธนาคารอาจมีกำไรลดลงจากการที่ต้องกันเงินสำรองไว้มากกว่าเดิม"],"answer":0,"a":"วินิจฉัยปัญหา — จุด B อยู่ซ้ายของ LRAS ผลผลิตต่ำกว่าศักยภาพ อัตราการว่างงานสูงกว่าอัตราธรรมชาติ นี่คือปัญหาอุปสงค์ไม่พอ\nเลือกเครื่องมือ — ต้องใช้เครื่องมือที่ยก AD ไปทางขวา ได้แก่ นโยบายการคลังแบบขาดดุล (เพิ่ม G ลด T ซึ่งเพิ่มทั้ง G และ C) และนโยบายการเงินแบบผ่อนคลาย (ลดดอกเบี้ยนโยบาย ซื้อพันธบัตรในตลาดเปิด ลดอัตราคิดลด หรือลดการดำรงสินทรัพย์สภาพคล่อง)\nผลข้างเคียงที่ต้องระบุ — หนี้สาธารณะและภาระดอกเบี้ยในอนาคต · การเบียดขับการลงทุนเอกชนผ่านดอกเบี้ยที่สูงขึ้น · ความล่าช้าในการออกฤทธิ์ · และหากกระตุ้นเกินขนาดจะพลิกเป็นช่องว่างเงินเฟ้อและเหลือไว้เพียงระดับราคาที่สูงขึ้นในระยะยาว","whys":["ถูกต้อง — เลือกเครื่องมือด้านอุปสงค์ให้ตรงกับปัญหาด้านอุปสงค์ และระบุผลข้างเคียงได้ครบ","ไม่ถูกต้อง — ทั้งสองเป็นนโยบายหดตัวซึ่งดัน AD ไปทางซ้าย จะยิ่งถ่างช่องว่างการหดตัวให้กว้างขึ้นไปอีก","ไม่ถูกต้อง — การควบคุมราคาเป็นเครื่องมือแก้เงินเฟ้อ ไม่ได้เพิ่มอุปสงค์มวลรวม และไม่ได้แก้ปัญหาผลผลิตที่ต่ำกว่าศักยภาพ","ไม่ถูกต้อง — การเพิ่มการดำรงสินทรัพย์สภาพคล่องทำให้ตัวคูณทางการเงินเล็กลงและปริมาณเงินหดตัว เป็นนโยบายแบบเข้มงวด"],"tip":"ระวังตัวลวงเรื่อง reserve requirement ให้ดี — เพิ่ม R → ตัวคูณ 1/R เล็กลง → ปริมาณเงินลด ซึ่งเป็นนโยบายหดตัว ไม่ใช่ขยายตัว","fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n  <defs>\n    <clipPath id=\"clipG\"><rect x=\"62\" y=\"26\" width=\"466\" height=\"318\"/></clipPath>\n    <marker id=\"arwG\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/>\n    </marker>\n  </defs>\n  <line x1=\"62\" y1=\"18\" x2=\"62\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <line x1=\"62\" y1=\"344\" x2=\"540\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <text x=\"52\" y=\"14\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">P</text>\n  <text x=\"548\" y=\"349\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Y</text><g clip-path=\"url(#c cap\">ช่องว่างการหดตัว — เป้าหมายคือยก AD ให้ตัด SRAS ตรงกับ LRAS พอดี</div></div>"},{"id":"E22","type":"mcq","lvl":3,"topic":"AD-AS","ref":"เลือกนโยบายจากกราฟช่องว่างเงินเฟ้อ","q":"จากแผนภาพ เศรษฐกิจอยู่ที่จุด B ซึ่งอยู่ขวาของ Y_FE หากผู้ดำเนินนโยบายต้องการปิดช่องว่างนี้ก่อนที่กลไกปรับตัวเองจะทำงาน ข้อใดถูกต้อง","choices":["ควรใช้นโยบายหดตัวคือขึ้นดอกเบี้ยนโยบายหรือลดรายจ่ายภาครัฐเพื่อกด AD ลง ซึ่งจะปิดช่องว่างโดยที่ระดับราคายังไม่ทันถูกดันขึ้น ต่างจากการรอกลไกตลาดที่จะจบด้วยราคาที่สูงขึ้น","ควรใช้นโยบายขยายตัวคือลดดอกเบี้ยนโยบายหรือเพิ่มรายจ่ายภาครัฐเพื่อดัน AD ขึ้นต่อ ซึ่งจะทำให้ผลผลิตสูงขึ้นอีกและช่องว่างเงินเฟ้อปิดลงเพราะเศรษฐกิจปรับตัวเข้าสู่ระดับใหม่ที่สูงกว่าเดิม","ควรใช้นโยบายด้านอุปทานโดยเลื่อนเส้น LRAS ไปทางซ้ายให้มาบรรจบกับจุด B ซึ่งจะทำให้ช่องว่างปิดลงทันทีโดยไม่ต้องแตะต้องอุปสงค์มวลรวมและไม่กระทบระดับราคาเลยแม้แต่น้อย","ไม่ควรทำอะไรเลยเพราะช่องว่างเงินเฟ้อเป็นสัญญาณว่าเศรษฐกิจกำลังเติบโตดี การแทรกแซงจะทำลายโมเมนตัมของการขยายตัวและทำให้ประเทศเสียโอกาสในการเติบโตไปอย่างน่าเสียดาย"],"answer":0,"a":"วินิจฉัย — จุด B อยู่ขวาของ LRAS ผลผลิตเกินระดับที่ยั่งยืน ตลาดแรงงานตึงตัว อัตราการว่างงานต่ำกว่าอัตราธรรมชาติ นี่คือช่องว่างเงินเฟ้อ\nถ้าปล่อยไว้ — ค่าจ้างและต้นทุนจะถูกดันขึ้น SRAS เลื่อนขึ้น ผลผลิตถอยกลับมาที่ Y_FE เอง แต่ระดับราคาจะค้างอยู่ในระดับที่สูงขึ้นถาวร\nถ้าใช้นโยบายหดตัวก่อน — กด AD กลับลงมาตัด SRAS ตรงกับ LRAS ผลผลิตกลับสู่ Y_FE เหมือนกัน แต่ระดับราคายังไม่ทันถูกดันขึ้น เพราะเราปิดช่องว่างก่อนที่ค่าจ้างจะปรับ\nนี่คือคุณค่าที่แท้จริงของนโยบายรักษาเสถียรภาพในกรณีช่องว่างเงินเฟ้อ — ไม่ใช่การเปลี่ยนผลผลิตปลายทาง แต่คือการประหยัดเงินเฟ้อถาวรที่จะเกิดขึ้นถ้าปล่อยไว้","whys":["ถูกต้อง — เลือกทิศทางนโยบายถูก และอธิบายคุณค่าที่แท้จริงว่าคือการป้องกันไม่ให้ระดับราคาถูกดันขึ้นถาวร","ไม่ถูกต้อง — การกระตุ้นเพิ่มจะยิ่งถ่างช่องว่างเงินเฟ้อให้กว้างขึ้น และเร่งให้ค่าจ้างกับราคาถูกดันขึ้นเร็วกว่าเดิม","ไม่ถูกต้อง — การเลื่อน LRAS ไปทางซ้ายคือการทำให้ประเทศจนลงอย่างถาวร ไม่ใช่การแก้ปัญหา และไม่มีเครื่องมือใดทำเช่นนั้นโดยตั้งใจ","ไม่ถูกต้อง — การผลิตเกินศักยภาพไม่ยั่งยืนและจะจบลงด้วยเงินเฟ้อที่สูงขึ้นถาวร ไม่ใช่การเติบโตที่แท้จริงของประเทศ"],"fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n  <defs>\n    <clipPath id=\"clipG\"><rect x=\"62\" y=\"26\" width=\"466\" height=\"318\"/></clipPath>\n    <marker id=\"arwG\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/>\n    </marker>\n  </defs>\n  <line x1=\"62\" y1=\"18\" x2=\"62\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <line x1=\"62\" y1=\"344\" x2=\"540\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <text x=\"52\" y=\"14\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">P</text>\n  <text x=\"548\" y=\"349\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Y</text><g clip-path=\"url(#clipG)\"><line x1=\"325.28999999999996\" y1=\"356.72\" x2=\"325.28999999999996\" y2=\"26\" stroke=\"var(--curve-lras)\" stroke-width=\"2.6\" /><line x1=\"34.040000000000006\" y1=\"200.9\" x2=\"555.96\" y2=\"200.9\" stroke=\"var(--curve-as)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"75.98\" y=\"191.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-as)\" text-anchor=\"start\">SRAS</text><line x1=\"117.91999999999999\" y1=\"38.72000000000003\" x2=\"677.12\" y2=\"331.28\" stroke=\"var(--curve-ad)\" stroke-width=\"2.6\"  stroke-linecap=\"round\"/><text x=\"254.4\" y=\"98.98400000000001\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ad)\" text-anchor=\"start\">AD ปัจจุบัน</text><line x1=\"15.399999999999999\" y1=\"38.72000000000003\" x2=\"574.6\" y2=\"331.28\" stroke=\"var(--curve-ghost)\" stroke-width=\"2\" stroke-dasharray=\"7 5\" stroke-linecap=\"round\"/><text x=\"114.6\" y=\"79.47999999999996\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-ghost)\" text-anchor=\"start\">AD เป้าหมาย</text><circle cx=\"427.81\" cy=\"200.9\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"437.81\" y=\"216.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">B</text><circle cx=\"325.28999999999996\" cy=\"200.9\" r=\"5\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"303.28999999999996\" y=\"216.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\" text-anchor=\"start\">A</text></g><text x=\"325.28999999999996\" y=\"17\" font-size=\"14\" font-weight=\"700\" fill=\"var(--curve-lras)\" text-anchor=\"middle\">LRAS</text><text x=\"325.28999999999996\" y=\"366\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"middle\">Y<tspan dy=\"4\" font-size=\"11\">FE</tspan></text><text x=\"53\" y=\"205.9\" font-size=\"14\" font-weight=\"700\" fill=\"var(--muted)\" text-anchor=\"end\">P₁</text></svg><div class=\"figcap\">ช่องว่างเงินเฟ้อ — เป้าหมายคือกด AD ลงให้ตัด SRAS ตรงกับ LRAS</div></div>"},{"id":"E23","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ผลของการกระตุ้นเกินขนาด","q":"ในภาวะถดถอย รัฐบาลอัดฉีดมาตรการกระตุ้นขนาดใหญ่กว่าช่องว่างการหดตัวที่มีอยู่มาก ข้อใดอธิบายผลระยะสั้นและระยะยาวของการกระตุ้นเกินขนาดได้ถูกต้อง","choices":["ระยะสั้นผลผลิตทะลุ Y_FE เกิดช่องว่างเงินเฟ้อและตลาดแรงงานตึงตัวเกินไป · ระยะยาวค่าจ้างและต้นทุนถูกดันขึ้น SRAS เลื่อนขึ้น ผลผลิตถอยกลับสู่ Y_FE เหลือไว้เพียงระดับราคาที่สูงขึ้นถาวร","ระยะสั้นผลผลิตทะลุ Y_FE และคงอยู่ที่ระดับนั้นอย่างถาวร เพราะการกระตุ้นขนาดใหญ่ทำให้ภาคธุรกิจมั่นใจและขยายกำลังการผลิตตามไปด้วย ผลผลิตศักยภาพของประเทศจึงสูงขึ้นถาวร","ระยะสั้นและระยะยาวผลผลิตกลับมาที่ Y_FE พอดีโดยที่ระดับราคาไม่เปลี่ยนแปลงเลย เพราะกลไกตลาดจะดูดซับส่วนที่เกินออกไปทันทีโดยไม่ทิ้งร่องรอยใด ๆ ไว้ในระบบเศรษฐกิจ","ระยะสั้นผลผลิตลดลงเพราะมาตรการที่ใหญ่เกินไปสร้างความไม่แน่นอนให้ภาคเอกชน · ระยะยาวเส้น LRAS เลื่อนซ้ายเพราะหนี้สาธารณะที่สูงขึ้นจะบั่นทอนศักยภาพการผลิตของประเทศทันที"],"answer":0,"a":"การกระตุ้นเกินขนาดคือการยก AD สูงกว่าที่จำเป็นในการปิดช่องว่าง\nระยะสั้น — ผลผลิตไม่ได้หยุดที่ Y_FE แต่ทะลุเลยไป จุดดุลยภาพขยับไปอยู่ขวาของ LRAS กลายเป็นช่องว่างเงินเฟ้อ ตลาดแรงงานตึงตัวจนอัตราการว่างงานต่ำกว่าอัตราธรรมชาติ\nระยะยาว — แรงงานมีอำนาจต่อรองสูง ค่าจ้างถูกดันขึ้น ซัพพลายเออร์ขึ้นราคาเพราะของขาด ต้นทุนต่อหน่วยสูงขึ้น ผู้ผลิตขึ้นราคาตาม SRAS เลื่อนขึ้นจนผลผลิตถอยกลับมาที่ Y_FE\nสิ่งที่เหลืออยู่ — ระดับราคาที่สูงขึ้นอย่างถาวร บวกกับหนี้สาธารณะที่ก่อไว้ นี่คือความหมายของคำว่า “ซื้อผลผลิตชั่วคราวด้วยราคาถาวร” และเป็นเหตุผลที่การประเมินขนาดของช่องว่างให้แม่นยำจึงสำคัญไม่แพ้การเลือกทิศทางนโยบาย","whys":["ถูกต้อง — ระบุครบทั้งช่องว่างเงินเฟ้อที่เกิดขึ้น กลไกที่ SRAS เลื่อนขึ้น และสิ่งที่เหลืออยู่ในระยะยาว","ไม่ถูกต้อง — ความมั่นใจของภาคธุรกิจไม่ได้เพิ่มแรงงาน ทุน หรือเทคโนโลยี ผลผลิตศักยภาพจึงไม่สูงขึ้นถาวรจากการกระตุ้นอุปสงค์","ไม่ถูกต้อง — ระดับราคาไม่ได้กลับที่เดิม การเลื่อนขึ้นของ SRAS ทำให้ราคาค้างสูงอย่างถาวรหลังกระบวนการปรับตัวจบลง","ไม่ถูกต้อง — มาตรการกระตุ้นเพิ่มอุปสงค์รวมและดันผลผลิตขึ้นในระยะสั้น ไม่ได้ทำให้ผลผลิตลดลงตามที่ข้อความระบุ"]},{"id":"E24","type":"mcq","lvl":2,"topic":"AD-AS","ref":"ความเป็นกลางของเงินในระยะยาว","q":"ธนาคารกลางเพิ่มปริมาณเงินในระบบขึ้นอย่างถาวร 20% โดยที่ปัจจัยการผลิตของประเทศไม่เปลี่ยนแปลงเลย ข้อใดอธิบายผลระยะสั้นและระยะยาวได้ถูกต้อง","choices":["ระยะสั้นดอกเบี้ยลด AD เลื่อนขวา ผลผลิตเพิ่มและการว่างงานลด · ระยะยาวราคาและค่าจ้างปรับขึ้นตามสัดส่วน SRAS เลื่อนขึ้น ผลผลิตกลับสู่ Y_FE เหลือไว้เพียงระดับราคาที่สูงขึ้น","ระยะสั้นและระยะยาวไม่มีผลต่อตัวแปรใดเลย เพราะเงินเป็นกลางเสมอในทุกช่วงเวลา การเปลี่ยนแปลงปริมาณเงินจึงกระทบเฉพาะตัวเลขที่เป็นตัวเงินโดยไม่แตะตัวแปรที่แท้จริงตั้งแต่ต้น","ระยะสั้นและระยะยาวผลผลิตเพิ่มขึ้นถาวร 20% ตามสัดส่วนของปริมาณเงินที่เพิ่มขึ้น เพราะเงินที่มากขึ้นทำให้ธุรกิจมีเงินทุนหมุนเวียนในการผลิตมากขึ้นอย่างต่อเนื่องในทุกช่วงเวลา","ระยะสั้น LRAS เลื่อนขวาเพราะสภาพคล่องที่มากขึ้นทำให้ภาคธุรกิจขยายกำลังการผลิตได้ · ระยะยาวระดับราคาลดลงเพราะอุปทานสินค้าในระบบเศรษฐกิจเพิ่มขึ้นมากกว่าปริมาณเงินที่เพิ่ม"],"answer":0,"a":"นี่คือข้อสรุปเรื่องความเป็นกลางของเงินในระยะยาว ซึ่งต้องแยกสองช่วงเวลาให้ชัด\nระยะสั้น เงินไม่เป็นกลาง — ปริมาณเงินที่มากขึ้นกดอัตราดอกเบี้ยลง การลงทุนและการบริโภคสินค้าคงทนเพิ่มขึ้น AD เลื่อนขวา ผลผลิตที่แท้จริงเพิ่มและการว่างงานลดลงจริง มิฉะนั้นนโยบายการเงินก็จะไร้ประโยชน์โดยสิ้นเชิง\nระยะยาว เงินเป็นกลาง — เมื่อผลผลิตทะลุ Y_FE ตลาดแรงงานตึงตัว ค่าจ้างและราคาปรับขึ้นตามสัดส่วนของเงินที่เพิ่มมา SRAS เลื่อนขึ้นจนผลผลิตกลับสู่ระดับที่ปัจจัยการผลิตกำหนด\nสิ่งที่เหลือ — ระดับราคาที่สูงขึ้นเท่านั้น ตัวแปรที่แท้จริงทั้งหมด (ผลผลิต การจ้างงาน อัตราดอกเบี้ยที่แท้จริง) กลับสู่ระดับเดิม เงินจึงเป็นเพียง “ผ้าคลุม” ที่ไม่เปลี่ยนโครงสร้างที่แท้จริงของเศรษฐกิจในระยะยาว","whys":["ถูกต้อง — แยกได้ชัดว่าระยะสั้นเงินไม่เป็นกลางแต่ระยะยาวเป็นกลาง และระบุสิ่งที่เหลืออยู่ได้ถูกต้อง","ไม่ถูกต้อง — ความเป็นกลางของเงินเป็นข้อสรุปของระยะยาวเท่านั้น ในระยะสั้นเงินมีผลต่อผลผลิตและการจ้างงานอย่างชัดเจน","ไม่ถูกต้อง — ในระยะยาวผลผลิตถูกกำหนดโดยแรงงาน ทุน และเทคโนโลยี ไม่ได้เพิ่มตามสัดส่วนของปริมาณเงินที่เพิ่มขึ้น","ไม่ถูกต้อง — ปริมาณเงินกระทบ AD ไม่ใช่ LRAS และการเพิ่มปริมาณเงินย่อมดันระดับราคาขึ้นในระยะยาว ไม่ใช่ลดลง"],"tip":"ประโยคที่ต้องเขียนให้ได้: ระยะสั้นเงินไม่เป็นกลาง ระยะยาวเงินเป็นกลาง — ปริมาณเงินที่เพิ่มขึ้นจบลงที่ระดับราคา ไม่ใช่ที่ผลผลิต"},{"id":"E25","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ความเร็วของการปรับตัวกับการเลือกนโยบาย","q":"ประเทศ ก มีตลาดแรงงานยืดหยุ่นสูง ค่าจ้างปรับขึ้นลงได้เร็ว ส่วนประเทศ ข มีสัญญาจ้างระยะยาวและสหภาพเข้มแข็ง ทั้งสองเผชิญช่องว่างการหดตัวขนาดเท่ากัน ข้อใดสรุปได้ถูกต้องที่สุด","choices":["ประเทศ ก กลับสู่ Y_FE เองได้เร็วกว่ามาก การรอกลไกตลาดจึงสมเหตุสมผล · ประเทศ ข ปรับตัวช้ามาก ต้นทุนการว่างงานสะสมสูง การใช้นโยบายกระตุ้นจึงมีเหตุผลรองรับมากกว่า","ประเทศ ข กลับสู่ Y_FE เองได้เร็วกว่า เพราะสหภาพแรงงานที่เข้มแข็งจะเจรจาลดค่าจ้างลงอย่างรวดเร็วเพื่อรักษาการจ้างงานของสมาชิกไว้ · ประเทศ ก จึงเป็นฝ่ายที่ต้องใช้นโยบายกระตุ้นแทน","ทั้งสองประเทศปรับตัวด้วยความเร็วเท่ากัน เพราะความเร็วของกลไกปรับตัวเองถูกกำหนดโดยขนาดของช่องว่างผลผลิตเพียงอย่างเดียว ไม่เกี่ยวกับโครงสร้างสถาบันของตลาดแรงงานในประเทศนั้น","ทั้งสองประเทศไม่สามารถกลับสู่ Y_FE ได้เองเลย เพราะกลไกปรับตัวเองเป็นเพียงสมมติฐานทางทฤษฎีที่ไม่เกิดขึ้นจริง ทุกประเทศจึงจำเป็นต้องใช้นโยบายกระตุ้นในทุกกรณีเสมอ"],"answer":0,"a":"กลไกปรับตัวเองทำงานผ่านค่าจ้างและราคาที่ปรับลดลง ดังนั้นความเร็วของมันจึงขึ้นกับว่าค่าจ้างในประเทศนั้นเปลี่ยนได้เร็วแค่ไหน\nประเทศ ก — ตลาดแรงงานยืดหยุ่น สัญญาสั้น ค่าจ้างลดลงได้ไว SRAS เลื่อนลงเร็ว ผลผลิตกลับสู่ Y_FE ภายในเวลาไม่นาน ต้นทุนการรอจึงต่ำ การปล่อยให้ตลาดทำงานเองเป็นทางเลือกที่สมเหตุสมผล และยังได้ระดับราคาที่ต่ำลงเป็นของแถม\nประเทศ ข — สัญญาจ้างระยะยาวและสหภาพที่เข้มแข็งทำให้ค่าจ้างลดลงยากมาก SRAS แทบไม่ขยับเป็นปี ๆ ระหว่างนั้นการว่างงานสะสมสูง ทักษะแรงงานเสื่อมถอย และเสี่ยงที่ปัญหาวัฏจักรจะกลายเป็นปัญหาโครงสร้าง ต้นทุนของการรอจึงสูงมากจนการใช้นโยบายกระตุ้นคุ้มค่ากว่า\nบทเรียนคือ คำถามว่า “ควรรอหรือควรแทรกแซง” ไม่มีคำตอบสากล ต้องดูโครงสร้างสถาบันของแต่ละประเทศประกอบ","whys":["ถูกต้อง — เชื่อมความยืดหยุ่นของค่าจ้างเข้ากับความเร็วของกลไกปรับตัวเอง และสรุปนัยเชิงนโยบายที่ต่างกันของสองประเทศ","ไม่ถูกต้อง — สหภาพที่เข้มแข็งมักต่อต้านการลดค่าจ้างเพื่อปกป้องสมาชิกที่ยังมีงานทำ ทำให้ค่าจ้างหนืดลงมากกว่าไม่ใช่น้อยลง","ไม่ถูกต้อง — ขนาดของช่องว่างมีผลต่อแรงกดดันอยู่บ้าง แต่โครงสร้างสถาบันของตลาดแรงงานเป็นตัวกำหนดความเร็วที่สำคัญกว่า","ไม่ถูกต้อง — กลไกปรับตัวเองเกิดขึ้นจริง เพียงแต่ความเร็วต่างกันมากในแต่ละประเทศตามความยืดหยุ่นของค่าจ้างและราคา"]},{"id":"E26","type":"mcq","lvl":4,"topic":"AD-AS","ref":"นโยบายที่ถูกคาดการณ์ล่วงหน้า","q":"ธนาคารกลางประกาศล่วงหน้าอย่างชัดเจนว่าจะอัดฉีดเงินเข้าระบบจำนวนมาก และทุกฝ่ายเชื่อประกาศนั้นเต็มที่ ข้อใดอธิบายผลที่น่าจะเกิดขึ้นเมื่อเทียบกับกรณีที่นโยบายออกมาโดยไม่มีใครคาดคิด","choices":["เมื่อถูกคาดการณ์ล่วงหน้า สหภาพและผู้ผลิตจะปรับค่าจ้างกับราคาขึ้นก่อน SRAS เลื่อนขึ้นเร็วกว่าปกติ ผลต่อผลผลิตจึงน้อยกว่าและระยะสั้นสั้นลง ผลส่วนใหญ่ตกที่ระดับราคาเร็วขึ้น","เมื่อถูกคาดการณ์ล่วงหน้า ผลต่อผลผลิตจะมากกว่ากรณีที่ไม่มีใครคาดคิด เพราะความชัดเจนของนโยบายทำให้ภาคธุรกิจวางแผนการลงทุนได้ดีขึ้นและตอบสนองต่อการอัดฉีดได้เต็มที่กว่าเดิม","การคาดการณ์ล่วงหน้าไม่มีผลใด ๆ ต่อผลลัพธ์ เพราะสิ่งที่กำหนดผลของนโยบายคือขนาดของเงินที่อัดฉีดเข้าระบบเท่านั้น ส่วนความคาดหวังของผู้คนเป็นเพียงปัจจัยทางจิตวิทยาที่ไม่มีผลจริง","เมื่อถูกคาดการณ์ล่วงหน้า เส้น LRAS จะเลื่อนขวาเพราะความเชื่อมั่นที่เพิ่มขึ้นทำให้ภาคเอกชนลงทุนขยายกำลังการผลิต ผลผลิตศักยภาพจึงสูงขึ้นถาวรและระดับราคาไม่จำเป็นต้องสูงขึ้นเลย"],"answer":0,"a":"หัวใจอยู่ที่ความหนืดของราคาเป็นสิ่งที่เกิดจากสัญญาและความไม่รู้ เมื่อทุกฝ่ายรู้ล่วงหน้าและเชื่อ ความหนืดนั้นก็ลดลง\nกรณีไม่มีใครคาดคิด — ค่าจ้างและราคายังถูกล็อกด้วยสัญญาที่ทำไว้ก่อนหน้า SRAS จึงอยู่นิ่งไปสักระยะ ผลของการอัดฉีดจึงตกที่ปริมาณเป็นหลัก ผลผลิตเพิ่มขึ้นชัดเจนและอยู่ได้นานพอสมควร\nกรณีถูกคาดการณ์ล่วงหน้า — สหภาพจะเรียกค่าจ้างสูงขึ้นในการเจรจารอบนี้เลย ซัพพลายเออร์ตั้งราคาสัญญาสูงขึ้น ผู้ผลิตปรับป้ายราคาล่วงหน้า ต้นทุนจึงสูงขึ้นเร็ว SRAS เลื่อนขึ้นแทบจะพร้อมกับที่ AD เลื่อนขวา ผลต่อผลผลิตจึงน้อยลงและช่วงระยะสั้นสั้นลงมาก ผลส่วนใหญ่ตกที่ระดับราคาเร็วกว่าปกติ\nข้อสรุปนี้มีนัยสำคัญ — นโยบายด้านอุปสงค์จะมีพลังต่อผลผลิตก็ต่อเมื่อมันสร้างความประหลาดใจ ซึ่งเป็นข้อโต้แย้งคลาสสิกต่อการใช้นโยบายกระตุ้นซ้ำ ๆ จนตลาดเรียนรู้รูปแบบได้","whys":["ถูกต้อง — เชื่อมการคาดการณ์เข้ากับความเร็วในการเลื่อนของ SRAS และสรุปว่าผลต่อผลผลิตลดลงเมื่อถูกคาดการณ์ได้","ไม่ถูกต้อง — ความชัดเจนช่วยการวางแผนก็จริง แต่มันเร่งให้ค่าจ้างและราคาปรับขึ้นก่อน ซึ่งกลืนผลที่จะตกถึงผลผลิต","ไม่ถูกต้อง — การคาดการณ์เปลี่ยนพฤติกรรมการเจรจาค่าจ้างและการตั้งราคาจริง จึงเปลี่ยนตำแหน่งของ SRAS ได้จริง","ไม่ถูกต้อง — การอัดฉีดเงินไม่ได้เพิ่มแรงงาน ทุน หรือเทคโนโลยี LRAS จึงไม่เลื่อน และระดับราคาย่อมสูงขึ้นในระยะยาว"],"tip":"หลักที่ควรจำ: นโยบายด้านอุปสงค์มีพลังต่อผลผลิตมากที่สุดเมื่อมันไม่ถูกคาดการณ์ — เมื่อตลาดเรียนรู้รูปแบบได้แล้ว ผลจะตกที่ราคาเร็วขึ้น"},{"id":"E27","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ช็อกสองรอบที่เกิดต่อเนื่องกัน","q":"เศรษฐกิจอยู่ในดุลยภาพระยะยาว ปีที่หนึ่งเกิดวิกฤตความเชื่อมั่นทำให้ AD เลื่อนซ้าย ปีที่สองก่อนที่เศรษฐกิจจะปรับตัวเสร็จ ราคาพลังงานโลกก็พุ่งขึ้นรุนแรง ข้อใดอธิบายสถานะหลังช็อกทั้งสองได้ถูกต้อง","choices":["ผลผลิตต่ำกว่า Y_FE มากขึ้นกว่ารอบแรก เพราะ AD ที่ซ้ายและ SRAS ที่ขึ้นต่างก็กดผลผลิตลงทางเดียวกัน ส่วนระดับราคาสรุปไม่ได้เพราะช็อกแรกกดราคาลงขณะที่ช็อกหลังดันราคาขึ้น","ผลผลิตกลับมาที่ Y_FE พอดีเพราะช็อกทั้งสองหักล้างกันหมด ช็อกแรกกดอุปสงค์ลงส่วนช็อกที่สองดันต้นทุนขึ้น ซึ่งเป็นแรงที่ตรงข้ามกันจึงทำให้ระบบเศรษฐกิจกลับเข้าสู่สมดุลเดิมโดยไม่เหลือร่องรอยใด ๆ ไว้","ผลผลิตสูงกว่า Y_FE เพราะราคาพลังงานที่แพงขึ้นจะกระตุ้นให้ผู้ผลิตในประเทศเร่งผลิตทดแทนการนำเข้า ทำให้กำลังการผลิตของประเทศถูกใช้เกินระดับปกติในช่วงเวลานั้น","ผลผลิตต่ำกว่า Y_FE และระดับราคาลดลงแน่นอน เพราะช็อกทั้งสองรอบเป็นช็อกเชิงลบซึ่งกดทั้งผลผลิตและระดับราคาลงในทิศทางเดียวกันทั้งคู่อย่างชัดเจน"],"answer":0,"a":"ต้องแยกผลของแต่ละช็อกต่อผลผลิตและต่อระดับราคาทีละตัว\nช็อกที่หนึ่ง AD เลื่อนซ้าย — ผลผลิตลดลง · แรงกดดันด้านราคาเป็นลบ\nช็อกที่สอง SRAS เลื่อนขึ้น — ผลผลิตลดลงอีก · แรงกดดันด้านราคาเป็นบวก\nต่อผลผลิต — สองแรงไปทางเดียวกันคือกดลง ดังนั้นช่องว่างการหดตัวกว้างขึ้นกว่ารอบแรกอย่างแน่นอน\nต่อระดับราคา — สองแรงขัดกัน ผลสุทธิขึ้นกับว่าช็อกใดใหญ่กว่า จึงสรุปทิศทางไม่ได้\nสถานการณ์นี้เป็นฝันร้ายของผู้ดำเนินนโยบาย เพราะช่องว่างการหดตัวขนาดใหญ่เรียกร้องการกระตุ้น แต่หากแรงกดดันด้านราคาจากฝั่งต้นทุนยังสูงอยู่ การกระตุ้นจะยิ่งเติมเชื้อเงินเฟ้อ","whys":["ถูกต้อง — แยกผลของสองช็อกต่อผลผลิตและต่อราคาได้อย่างเป็นระบบ และกล้าสรุปว่าตัวใดสรุปได้ตัวใดสรุปไม่ได้","ไม่ถูกต้อง — ช็อกทั้งสองกดผลผลิตลงไปทางเดียวกัน จึงไม่หักล้างกันในมิติของผลผลิต ที่ขัดกันมีเพียงมิติของระดับราคา","ไม่ถูกต้อง — ราคาพลังงานที่แพงขึ้นเป็นการเพิ่มต้นทุนการผลิต ซึ่งกดผลผลิตลง ไม่ได้กระตุ้นให้ผลิตเกินระดับปกติ","ไม่ถูกต้อง — ทิศทางของผลผลิตถูก แต่ระดับราคาสรุปไม่ได้ เพราะช็อกด้านอุปทานเชิงลบดันราคาขึ้นไม่ใช่กดลง"],"tip":"เจอช็อกหลายรอบ ให้ทำตารางสองคอลัมน์: ผลต่อ Y และ ผลต่อ P แล้วดูทีละคอลัมน์ว่าแรงไปทางเดียวกันหรือขัดกัน"},{"id":"E28","type":"mcq","lvl":4,"topic":"AD-AS","ref":"AD และ SRAS เลื่อนพร้อมกันในทางที่ขัดกัน","q":"รัฐบาลกระตุ้นเศรษฐกิจด้วยการเพิ่มรายจ่ายอย่างมาก ในขณะเดียวกันค่าจ้างขั้นต่ำก็ถูกปรับขึ้นทั่วประเทศ ข้อใดอธิบายผลระยะสั้นได้ถูกต้องที่สุด","choices":["ระดับราคาสูงขึ้นแน่นอนเพราะทั้ง AD ที่เลื่อนขวาและ SRAS ที่เลื่อนขึ้นต่างก็ดันราคาไปทางเดียวกัน ส่วนผลผลิตสรุปไม่ได้เพราะ AD ดันขึ้นขณะที่ SRAS กดลง","ผลผลิตเพิ่มขึ้นแน่นอนเพราะทั้งสองมาตรการล้วนเพิ่มกำลังซื้อในระบบเศรษฐกิจ ส่วนระดับราคาสรุปไม่ได้เพราะขึ้นกับว่าต้นทุนหรืออุปสงค์เป็นตัวนำในสถานการณ์นั้น","ทั้งผลผลิตและระดับราคาสรุปทิศทางไม่ได้เลย เพราะมีสองเส้นเลื่อนพร้อมกันซึ่งทำให้ระบบมีตัวแปรมากเกินกว่าที่แบบจำลอง AD-AS จะวิเคราะห์ผลลัพธ์ออกมาได้อย่างชัดเจน","ทั้งผลผลิตและระดับราคาเพิ่มขึ้นแน่นอน เพราะการเพิ่มรายจ่ายภาครัฐและการขึ้นค่าจ้างต่างก็เป็นการอัดฉีดเงินเข้าสู่มือประชาชน ซึ่งกระตุ้นการใช้จ่ายและการผลิตไปพร้อมกัน"],"answer":0,"a":"วิเคราะห์ทีละเส้นแล้วรวมผล\nรายจ่ายภาครัฐเพิ่ม → AD เลื่อนขวา → Y ขึ้น · P ขึ้น\nค่าจ้างขั้นต่ำเพิ่ม → ต้นทุนแรงงานสูงขึ้น → SRAS เลื่อนขึ้น → Y ลง · P ขึ้น\nต่อระดับราคา — ทั้งสองแรงดันราคาไปทางเดียวกัน ระดับราคาจึงสูงขึ้นแน่นอน และแรงกว่ากรณีที่มีช็อกเดียว\nต่อผลผลิต — AD ดันขึ้นแต่ SRAS กดลง สองแรงขัดกัน ผลสุทธิจึงขึ้นกับขนาดสัมพัทธ์ สรุปทิศทางไม่ได้\nนี่คือส่วนผสมของนโยบายที่อันตราย เพราะได้เงินเฟ้อแน่ ๆ แต่ไม่รับประกันว่าจะได้ผลผลิตหรือการจ้างงานเพิ่มขึ้นเลย","whys":["ถูกต้อง — แยกได้ว่าระดับราคาสรุปทิศทางได้แน่นอน ส่วนผลผลิตต้องชั่งน้ำหนักระหว่างสองแรงที่ขัดกัน","ไม่ถูกต้อง — ค่าจ้างขั้นต่ำที่สูงขึ้นเป็นต้นทุนของผู้ผลิตซึ่งกดผลผลิตลงผ่าน SRAS ไม่ได้เพิ่มผลผลิตเหมือนการเพิ่มรายจ่ายภาครัฐ","ไม่ถูกต้อง — แบบจำลองวิเคราะห์ได้ชัดเจนเมื่อสองแรงดันตัวแปรใดไปทางเดียวกัน ในที่นี้ระดับราคาสรุปได้แน่นอนว่าสูงขึ้น","ไม่ถูกต้อง — ค่าจ้างที่สูงขึ้นเป็นต้นทุนของธุรกิจ ซึ่งลดปริมาณการจ้างงานและการผลิต ไม่ได้กระตุ้นการผลิตอย่างที่ระบุ"]},{"id":"E29","type":"mcq","lvl":4,"topic":"AD-AS","ref":"LRAS หดพร้อมกับ AD ที่ถูกกระตุ้น","q":"ประเทศหนึ่งสูญเสียแรงงานและทุนทางกายภาพจำนวนมากอย่างถาวรจากภัยพิบัติ รัฐบาลจึงตอบสนองด้วยการกระตุ้นเศรษฐกิจครั้งใหญ่ ข้อใดประเมินผลระยะยาวได้ถูกต้องที่สุด","choices":["LRAS เลื่อนซ้ายทำให้ผลผลิตระยะยาวลดลงไม่ว่าจะกระตุ้นมากเพียงใด ส่วน AD ที่ถูกยกขึ้นเทียบกับ LRAS ที่หดลง จะทำให้ระดับราคาสูงขึ้นมากเป็นพิเศษในดุลยภาพระยะยาวใหม่","การกระตุ้นจะดึงผลผลิตกลับมาที่ระดับเดิมก่อนภัยพิบัติได้ในระยะยาว เพราะนโยบายด้านอุปสงค์ที่มีขนาดใหญ่พอสามารถชดเชยการสูญเสียปัจจัยการผลิตที่เกิดขึ้นได้อย่างสมบูรณ์","LRAS เลื่อนซ้ายแต่ระดับราคาจะลดลงในระยะยาว เพราะการกระตุ้นทำให้ภาคการผลิตแข่งขันกันรุนแรงขึ้นจนราคาสินค้าถูกลงกว่าเดิมแม้ศักยภาพการผลิตจะหดตัวลงไปแล้วก็ตาม","ทั้ง LRAS และ AD ไม่เปลี่ยนแปลงในระยะยาว เพราะภัยพิบัติเป็นเหตุการณ์ชั่วคราวและการกระตุ้นก็เป็นมาตรการชั่วคราว ผลของทั้งสองจึงหายไปพร้อมกันเมื่อสถานการณ์กลับสู่ภาวะปกติ"],"answer":0,"a":"ต้องแยกให้ชัดว่าอะไรกำหนดผลผลิตระยะยาวและอะไรกำหนดระดับราคา\nผลผลิตระยะยาว — ถูกกำหนดโดย LRAS เท่านั้น เมื่อแรงงานและทุนหายไปอย่างถาวร LRAS เลื่อนซ้าย ผลผลิตระยะยาวลดลงแน่นอน ไม่ว่าจะอัดฉีดอุปสงค์มากเพียงใด เพราะการกระตุ้นไม่ได้สร้างเครื่องจักรหรือคืนแรงงานที่หายไป\nระดับราคาระยะยาว — ถูกกำหนดโดยตำแหน่งของ AD เทียบกับ LRAS ในกรณีนี้ AD ถูกยกขึ้นขณะที่ LRAS หดเข้ามา ทั้งสองแรงดันราคาขึ้นทางเดียวกัน ระดับราคาจึงสูงขึ้นมากเป็นพิเศษ\nนัยเชิงนโยบาย — การกระตุ้นอาจสมเหตุสมผลในระยะสั้นเพื่อประคองการจ้างงานระหว่างฟื้นฟู แต่สิ่งที่จำเป็นจริง ๆ คือการลงทุนฟื้นฟูทุนและทักษะแรงงานซึ่งเป็นนโยบายด้านอุปทานที่ดัน LRAS กลับไปทางขวา","whys":["ถูกต้อง — แยกได้ว่าผลผลิตระยะยาวอ่านจาก LRAS เท่านั้น และระบุว่าทำไมระดับราคาจึงถูกดันขึ้นแรงเป็นพิเศษ","ไม่ถูกต้อง — นโยบายด้านอุปสงค์ไม่สามารถทดแทนปัจจัยการผลิตที่หายไปได้ ผลผลิตระยะยาวถูกจำกัดโดย LRAS เสมอ","ไม่ถูกต้อง — เมื่ออุปทานรวมของประเทศหดตัวลงขณะที่อุปสงค์ถูกยกขึ้น ราคาย่อมถูกดันสูงขึ้น ไม่ใช่ลดลง","ไม่ถูกต้อง — โจทย์ระบุชัดว่าการสูญเสียเป็นการถาวร ซึ่งกระทบปัจจัยการผลิตที่กำหนดตำแหน่งของ LRAS โดยตรง"]},{"id":"E30","type":"mcq","lvl":4,"topic":"AD-AS","ref":"ช็อกด้านต้นทุนซ้อนบนช่องว่างเงินเฟ้อ","q":"เศรษฐกิจอยู่ในช่องว่างเงินเฟ้ออยู่แล้ว จากนั้นเกิดช็อกราคาน้ำมันที่ดัน SRAS ขึ้น ข้อใดอธิบายสถานะใหม่และความยากของการดำเนินนโยบายได้ถูกต้องที่สุด","choices":["ผลผลิตถูกดึงกลับเข้าหา Y_FE ซึ่งช่วยปิดช่องว่างเงินเฟ้อ แต่ระดับราคาถูกดันขึ้นจากทั้งช่องว่างเดิมและช็อกต้นทุนใหม่ ทำให้แรงกดดันเงินเฟ้อรุนแรงกว่ากรณีที่เริ่มจากดุลยภาพ","ผลผลิตยิ่งสูงขึ้นเหนือ Y_FE มากกว่าเดิม เพราะราคาน้ำมันที่แพงขึ้นทำให้ผู้ผลิตเร่งผลิตเพื่อชดเชยรายได้ที่หายไป ช่องว่างเงินเฟ้อจึงถ่างกว้างขึ้นและเงินเฟ้อเร่งตัวขึ้นอย่างรวดเร็ว","ผลผลิตและระดับราคาลดลงพร้อมกัน เพราะช็อกด้านต้นทุนทำให้ทั้งผู้ผลิตและผู้บริโภคลดกิจกรรมทางเศรษฐกิจลง ช่องว่างเงินเฟ้อจึงพลิกกลับเป็นช่องว่างการหดตัวพร้อมภาวะเงินฝืด","ไม่มีอะไรเปลี่ยนแปลงเพราะเศรษฐกิจอยู่ในช่องว่างเงินเฟ้ออยู่แล้ว การที่ SRAS เลื่อนขึ้นเป็นเพียงการเร่งกระบวนการปรับตัวเองที่กำลังจะเกิดขึ้นอยู่แล้วให้เร็วขึ้นเท่านั้นเอง"],"answer":0,"a":"สถานการณ์นี้มีสองชั้นทับกัน\nชั้นที่หนึ่ง — เศรษฐกิจอยู่ขวาของ LRAS อยู่แล้ว ตลาดแรงงานตึงตัว ค่าจ้างกำลังจะถูกดันขึ้น\nชั้นที่สอง — ช็อกราคาน้ำมันดัน SRAS ขึ้นซ้ำเข้าไปอีก\nผลต่อผลผลิต — SRAS ที่เลื่อนขึ้นดึงผลผลิตลงเข้าหา Y_FE ซึ่ง “ช่วย” ปิดช่องว่างเงินเฟ้อโดยบังเอิญ\nผลต่อราคา — นี่คือส่วนที่เลวร้าย ระดับราคาถูกดันขึ้นจากสองแหล่งพร้อมกัน คือแรงกดดันค่าจ้างจากช่องว่างเดิม บวกกับต้นทุนพลังงานที่พุ่ง เงินเฟ้อจึงรุนแรงกว่ากรณีที่เริ่มจากดุลยภาพมาก\nความยากเชิงนโยบาย — ธนาคารกลางเผชิญเงินเฟ้อที่มาจากสองทาง การขึ้นดอกเบี้ยจะจัดการแรงกดดันฝั่งอุปสงค์ได้ แต่ไม่ได้แก้ต้นทุนพลังงาน และเสี่ยงผลักเศรษฐกิจเลย Y_FE ลงไปเป็นช่องว่างการหดตัวแทน","whys":["ถูกต้อง — วิเคราะห์ได้ทั้งผลต่อผลผลิตที่ถูกดึงกลับและแรงกดดันราคาจากสองแหล่งที่ทับซ้อนกัน","ไม่ถูกต้อง — ต้นทุนที่สูงขึ้นทำให้ผู้ผลิตลดปริมาณการผลิตลง ไม่ใช่เร่งผลิตมากขึ้น ผลผลิตจึงถูกดึงลงไม่ใช่ดันขึ้น","ไม่ถูกต้อง — ช็อกด้านอุปทานเชิงลบดันระดับราคาขึ้น ไม่ใช่กดลง จึงไม่มีทางเกิดภาวะเงินฝืดจากช็อกลักษณะนี้","ไม่ถูกต้อง — ช็อกต้นทุนเพิ่มแรงกดดันด้านราคาเข้ามาอีกทางหนึ่ง จึงไม่ใช่แค่การเร่งกระบวนการเดิม แต่ทำให้เงินเฟ้อแรงกว่าเดิม"]},{"id":"E31","type":"mcq","lvl":4,"topic":"AD-AS","ref":"อ่านกราฟกลไกปิดช่องว่างการหดตัว","q":"จากแผนภาพ เศรษฐกิจอยู่ที่จุด B หลังจาก AD เลื่อนซ้าย และกำลังจะปรับตัวไปยังจุด C ข้อใดอธิบายกลไกและเปรียบเทียบจุด A กับ C ได้ถูกต้อง","choices":["การว่างงานที่สูงกว่าอัตราธรรมชาติกดค่าจ้างและราคาลง ต้นทุนผู้ผลิตลดลง SRAS เลื่อนลงจาก SRAS₁ ไป SRAS₂ · จุด C มีผลผลิตเท่ากับจุด A แต่ระดับราคาต่ำลงจาก P₁ เป็น P₂","ตลาดแรงงานที่ตึงตัวดันค่าจ้างและราคาขึ้น ต้นทุนผู้ผลิตสูงขึ้น SRAS เลื่อนขึ้น · จุด C มีผลผลิตเท่ากับจุด A แต่ระดับราคาสูงขึ้น ซึ่งเป็นผลลัพธ์มาตรฐานของการปรับตัวในระยะยาวเสมอ","เส้น AD จะเลื่อนกลับไปทางขวาเองจนถึงตำแหน่งเดิม · จุด C จึงมีทั้งผลผลิตและระดับราคาเท่ากับจุด A ทุกประการ ราวกับว่าไม่เคยมีการเลื่อนของอุปสงค์มวลรวมเกิดขึ้นมาก่อนเลย","เส้น LRAS จะเลื่อนซ้ายมาบรรจบกับจุด B เพราะภาวะถดถอยที่ยืดเยื้อทำให้ศักยภาพการผลิตของประเทศลดลง · จุด C จึงมีผลผลิตต่ำกว่าจุด A และระดับราคาต่ำลงด้วยเช่นกัน"],"answer":0,"a":"อ่านเส้นทางทีละช่วง\nA → B — AD เลื่อนซ้ายจาก AD₁ ไป AD₂ ในกรอบ SRAS แนวนอน ผลผลิตลดลงโดยราคาคงที่ที่ P₁ จุด B อยู่ซ้ายของ LRAS จึงเป็นช่องว่างการหดตัว อัตราการว่างงานสูงกว่าอัตราธรรมชาติ\nB → C กลไกปรับตัวเอง — ตลาดแรงงานหย่อนตัว แรงงานยอมรับค่าจ้างต่ำลง ผู้ผลิตยอมลดราคาเพื่อระบายสินค้า ต้นทุนต่อหน่วยลดลง SRAS เลื่อนลงจาก SRAS₁ ไป SRAS₂ จนตัด AD₂ ตรงกับ LRAS พอดี\nเปรียบเทียบ A กับ C — ผลผลิตเท่ากันที่ Y_FE แต่ระดับราคาต่ำลงจาก P₁ เป็น P₂ เพราะอุปสงค์รวมที่หดตัวลงอย่างถาวร\nนี่คือภาพสะท้อนกระจกของกรณีที่ AD เลื่อนขวา ซึ่งจบด้วยราคาที่สูงขึ้น","whys":["ถูกต้อง — ระบุกลไกผ่านตลาดแรงงานที่หย่อนตัว ทิศทางการเลื่อนของ SRAS และเปรียบเทียบ A กับ C ได้ถูกต้อง","ไม่ถูกต้อง — จุด B อยู่ซ้ายของ LRAS ตลาดแรงงานจึงหย่อนตัวไม่ใช่ตึงตัว ค่าจ้างถูกกดลงไม่ใช่ดันขึ้น","ไม่ถูกต้อง — เส้น AD ไม่ได้เลื่อนกลับเอง สิ่งที่ปรับตัวคือฝั่งอุปทานระยะสั้นผ่านค่าจ้างและราคาที่ลดลง","ไม่ถูกต้อง — กราฟแสดงว่าจุด C อยู่ที่ระดับ Y_FE เดียวกับ A ไม่ได้ขยับไปตามจุด B และ LRAS ก็ไม่ได้เลื่อน"],"fig":"<div class=\"figbox\"><svg viewBox=\"0 0 560 400\" role=\"img\">\n  <defs>\n    <clipPath id=\"clipG\"><rect x=\"62\" y=\"26\" width=\"466\" height=\"318\"/></clipPath>\n    <marker id=\"arwG\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/>\n    </marker>\n  </defs>\n  <line x1=\"62\" y1=\"18\" x2=\"62\" y2=\"344\" stroke=\"var(--ink-2)\" stroke-width=\"1.6\"/>\n  <line x1
