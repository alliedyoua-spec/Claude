<title>ระบบฝึกข้อสอบเศรษฐศาสตร์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* เค้าโครง: หนังสือข้อสอบแนวตั้ง คอลัมน์เดียว แถบสถานะติดบน ตัวเลขและเวลาใช้ฟอนต์ mono */
:root{
  --bg:#f1f4f8; --surface:#ffffff; --surface2:#e8edf4; --ink:#101828; --muted:#566277; --line:#d3dbe6;
  --accent:#2144c7; --accent-ink:#ffffff; --accent-soft:#e1e8fb;
  --ok:#14774b; --ok-soft:#dcf2e6; --warn:#855600; --warn-soft:#faecc8; --bad:#b3261e; --bad-soft:#fae1de;
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai","Sarabun","Loma",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131c; --surface:#161d2a; --surface2:#1f2838; --ink:#e7ebf3; --muted:#9aa6ba; --line:#2b3649;
  --accent:#86a8ff; --accent-ink:#0b1226; --accent-soft:#1d2a4d;
  --ok:#52c68e; --ok-soft:#14301f; --warn:#e7a948; --warn-soft:#352810; --bad:#ff8c82; --bad-soft:#3a1816; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131c; --surface:#161d2a; --surface2:#1f2838; --ink:#e7ebf3; --muted:#9aa6ba; --line:#2b3649;
  --accent:#86a8ff; --accent-ink:#0b1226; --accent-soft:#1d2a4d;
  --ok:#52c68e; --ok-soft:#14301f; --warn:#e7a948; --warn-soft:#352810; --bad:#ff8c82; --bad-soft:#3a1816; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.7 var(--font-body);margin:0}
.wrap{max-width:880px;margin-inline:auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3{line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:1.65rem;font-weight:600} h2{font-size:1.15rem;font-weight:600;margin-block:28px 12px} h3{font-size:1rem;font-weight:600}
small,.muted{color:var(--muted)} .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 16px;min-height:40px}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.sm{padding:4px 12px;min-height:32px;font-size:.9rem} .btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-block:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:500 1.6rem/1.2 var(--font-mono)} .stat span{font-size:.85rem;color:var(--muted)}
.banner{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-block:16px}
.papers{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.paper .no{font:500 2rem/1 var(--font-mono);color:var(--accent)}
.pill{display:inline-block;font-size:.78rem;padding:0 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)} .item:first-child{border-top:0}
.item>div{min-width:0}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 64px;gap:10px;align-items:center;font-size:.92rem}
.bar i{display:block;height:10px;background:var(--surface2);border-radius:99px;overflow:hidden} .bar i b{display:block;height:100%;background:var(--accent)}
.bar i.low b{background:var(--bad)} .bar i.mid b{background:var(--warn)} .bar i.hi b{background:var(--ok)}
.bar span{text-align:right}
/* ข้อสอบ */
.exambar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:12px}
.exambar .row{justify-content:space-between}
#timer{font:500 1.35rem/1 var(--font-mono)} #timer.low{color:var(--bad)}
.nav:not([hidden]){display:grid}
.nav{grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.nv{min-height:36px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font:500 .85rem var(--font-mono);padding:0}
.nv.on{background:var(--accent-soft);border-color:var(--accent)} .nv.fl{box-shadow:inset 0 -3px 0 var(--warn)}
.confirm{margin-top:10px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:12px 14px}
.section{margin-block:24px 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap} .section h2{margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-block:12px;scroll-margin-top:84px}
.q.ok{border-color:var(--ok)} .q.no{border-color:var(--bad)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:6px}
.qno{font:500 1rem var(--font-mono);color:var(--accent)}
.qtext{white-space:pre-line;overflow-wrap:anywhere;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--bg)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt input{margin-top:6px;accent-color:var(--accent)} .opt span{min-width:0;overflow-wrap:anywhere}
input.num,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:100%;max-width:100%}
input.num{max-width:14rem;font-family:var(--font-mono)} textarea{resize:vertical;min-height:6.5rem}
.sol{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.soltxt{white-space:pre-line;overflow-wrap:anywhere;border-left:3px solid var(--accent);padding-left:12px}
.note{font-size:.88rem;color:var(--warn);margin:8px 0 0}
.yours{background:var(--surface2);border-radius:8px;padding:8px 12px;white-space:pre-line;overflow-wrap:anywhere;margin-bottom:10px;font-size:.95rem}
.marks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:10px}
.marks .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-block:16px}
.score .big{font:500 3.2rem/1 var(--font-mono)} .score .big small{font-size:1.1rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-block:12px}
.tabs .btn.on{background:var(--accent-soft);border-color:var(--accent)}
.graph{margin:10px 0;max-width:340px} .graph svg{width:100%;height:auto;display:block;overflow:visible}
.graph .gax{stroke:var(--muted);stroke-width:1.5} .graph .gl-s{stroke:var(--bad);stroke-width:2} .graph .gl-d{stroke:var(--accent);stroke-width:2} .graph .gl-l{stroke:var(--ok);stroke-width:2}
.graph .gt{fill:var(--ink);font:11px var(--font-body)} .graph .gt-s{fill:var(--bad)} .graph .gt-d{fill:var(--accent)} .graph .gt-l{fill:var(--ok)} .graph .gp{fill:var(--ink)}
@media (max-width:520px){.score{grid-template-columns:1fr}.bar{grid-template-columns:1fr 56px}.bar i{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

</style>
<div class="wrap" id="app"></div>
<script>
// ค่าตั้งต้น รอผู้ใช้ยืนยันจำนวนข้อ/คะแนน/เวลา — แก้ที่นี่ที่เดียว
window.CONFIG = {
  papers: 10,
  mcqCount: 30, mcqPoints: 1,
  writtenByTopic: { 'อัตราแลกเปลี่ยน': 2, 'AD-AS': 2, 'การเงินการคลัง': 3 }, writtenPoints: 10,
  minutes: 90,
};
window.SETS = [];
window.registerSet = s => window.SETS.push(s);

</script>

registerSet({
  id: 'fx-orig', title: 'อัตราแลกเปลี่ยน (ต้นฉบับ)', kind: 'original', exam: true, topic: 'อัตราแลกเปลี่ยน',
  source: 'PracticeExchangeRateThai.pdf (ผศ.ดร.ธนารักษ์ เหล่าสุทธิ) + สไลด์ Ch.13',
  questions: [

      q: 'สมมติว่าประเทศ BB ใช้อัตราแลกเปลี่ยนแบบลอยตัว มีอัตราแลกเปลี่ยนดุลยภาพ 30 BBD = 1 USD เกิดวิกฤตเศรษฐกิจในประเทศ BB ทำให้นักลงทุนต่างประเทศถอนเงินทุนจาก BB ไปลงทุนที่สหรัฐฯ แทน อัตราแลกเปลี่ยนและการส่งออกของ BB เปลี่ยนอย่างไร? อธิบายพร้อมวาดกราฟ',
      graph: { type: 'fx', shift: 'S+' },
      a: 'นักลงทุนต้องขาย BBD เพื่อซื้อ USD ไปลงทุนในสหรัฐฯ → อุปทานของ BBD เพิ่ม (เส้น S เลื่อนขวา) → อัตราแลกเปลี่ยน e (USD ต่อ 1 BBD) ลดลง ค่าเงิน BBD อ่อนลง (depreciation) เช่น จาก 30 เป็นมากกว่า 30 BBD ต่อ 1 USD\nสินค้า BB ถูกลงสำหรับชาวต่างชาติ (real exchange rate ลด) → ส่งออกสุทธิเพิ่มขึ้น' },
    { id: 2, type: 'written', ref: 'แบบฝึกหัด ข้อ 2',
      q: 'ประเทศหนึ่งต้องการสนับสนุนการส่งออก นักเศรษฐศาสตร์เสนอให้รัฐบาลยกเว้นภาษีส่งออก นโยบายนี้ช่วยเพิ่มการส่งออกได้หรือไม่ อย่างไร? วาดรูปพร้อมอธิบายกลไกอัตราแลกเปลี่ยน',
      graph: { type: 'fx', shift: 'D+' },
      a: 'ยกเว้นภาษีส่งออก → สินค้าส่งออกขายได้กำไรมากขึ้น/ราคาถูกลง → อุปสงค์ต่างชาติต่อสินค้าในประเทศเพิ่ม → อุปสงค์ต่อเงินสกุลในประเทศเพิ่ม (D เลื่อนขวา) → ค่าเงินแข็งขึ้น (appreciation)\nค่าเงินแข็งทำให้สินค้าแพงขึ้นสำหรับต่างชาติ (real exchange rate เพิ่ม) จึงหักล้างผลบางส่วน ผลสุทธิ: ปริมาณส่งออกเพิ่มได้ แต่น้อยกว่าที่คาดถ้าไม่คิดผลของอัตราแลกเปลี่ยน' },
    { id: 3, type: 'written', ref: 'แบบฝึกหัด ข้อ 3',

      a: 'สินค้าไทยในสหรัฐฯ แพงขึ้น → สหรัฐฯ นำเข้าจากไทยลดลง → อุปสงค์ต่อเงินบาทลดลง (D เลื่อนซ้าย) → บาทอ่อนค่า (depreciation) อัตราแลกเปลี่ยน e ลดลง\nบาทอ่อนช่วยให้สินค้าไทยถูกลงบางส่วน แต่ผลสุทธิการส่งออกของไทยไปสหรัฐฯ ลดลง' },
    { id: 4, type: 'written', ref: 'แบบฝึกหัด ข้อ 4',
      q: 'อัตราแลกเปลี่ยน (Nominal Exchange Rate) และอัตราแลกเปลี่ยนที่แท้จริง (Real Exchange Rate) เหมือนหรือแตกต่างกันอย่างไร? ยกตัวอย่างประกอบ',
      a: 'Nominal (e_nom) = จำนวนเงินตราต่างประเทศที่แลกได้ด้วยเงินในประเทศ 1 หน่วย (เช่น 110 เยนต่อ 1 ดอลลาร์)\nReal (e) = e_nom × P / P_for = ราคาสินค้าในประเทศเทียบกับสินค้าต่างประเทศ (แลกสินค้าต่างประเทศได้กี่หน่วยต่อสินค้าในประเทศ 1 หน่วย)\nตัวอย่าง: e_nom = 110 เยน/ดอลลาร์ แฮมเบอร์เกอร์โตเกียว 1,100 เยน นิวยอร์ก 2 ดอลลาร์ → e = 110 × 2 / 1,100 = 0.2 แฮมเบอร์เกอร์ญี่ปุ่นต่อแฮมเบอร์เกอร์สหรัฐฯ\nต่างกันที่ real หักผลของระดับราคาแล้ว จึงใช้บอกความสามารถในการแข่งขันได้' },

      a: 'e = e_nom × P / P_for = 800 × 1,000 / 160,000 = 5\n(ตรวจ: ข้าวเวียดนามเป็นเงินบาท = 160,000/800 = 200 บาท → 1,000/200 = 5) ข้าวไทยแพงกว่าข้าวเวียดนาม 5 เท่า' },
    { id: 6, type: 'mcq', ref: 'แบบฝึกหัด ข้อ 6', choices: ['จีน', 'ญี่ปุ่น'], answer: 1,
      q: '1 บาท = 1.50 หยวน และ 1 บาท = 0.80 เยน CPI ไทย = 100, จีน = 180, ญี่ปุ่น = 80 ท่านต้องการไปเที่ยวประเทศจีนหรือญี่ปุ่น?',

<script>

      note: 'เหตุผลเชิงกลไก (ผลของความมั่งคั่ง/อัตราดอกเบี้ย/อัตราแลกเปลี่ยน) นอกสไลด์ที่อ่าน' },
    { id: 2, type: 'written', ref: 'ข้อ 2', q: 'สิ่งใดที่ทำให้เส้นอุปสงค์มวลรวมเคลื่อนย้ายไปทางด้านซ้ายมือ? อธิบายพร้อมยกเหตุผลประกอบ',

<script>
// สร้างชุดสอบ: แจกไพ่จากคลังโจทย์แบบกำหนดตายตัว (seed คงที่) ชุดเดิมได้ข้อเดิมทุกครั้ง ภายในชุดไม่ซ้ำ
(() => {
  const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const shuffle = (a, r) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const C = window.CONFIG, all = window.SETS.flatMap(s => s.questions.map(q => ({ set: s, q })));
  const topic = i => i.q.topic || i.set.topic;
  const deal = (pool, per, seed) => { const d = shuffle(pool, rng(seed)); return Array.from({ length: C.papers }, (_, p) => Array.from({ length: per }, (_, k) => d[(p * per + k) % d.length])); };
  const mc = deal(all.filter(i => i.set.mcqPool && i.q.type === 'mcq'), C.mcqCount, 11);
  const wr = Object.entries(C.writtenByTopic).map(([t, n], i) => deal(all.filter(x => x.set.exam && x.q.type === 'written' && topic(x) === t), n, 23 + i));
  const first = x => topic(x) === 'การว่างงาน' ? 0 : 1;
  window.PAPERS = Array.from({ length: C.papers }, (_, p) => ({ id: 'p' + (p + 1), n: p + 1, title: 'ชุดที่ ' + (p + 1),
    items: [...mc[p].sort((a, b) => first(a) - first(b)), ...wr.flatMap(w => w[p])] }));
})();

<script>
// กราฟ SVG นิ่ง: ตลาดเงินตรา (fx) และ AD-AS (adas) สีมาจาก token ในหน้า (class gl-*, gt-*)
(() => {
  const L = (x1, y1, x2, y2, c, d) => `<line class="${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${d ? 'stroke-dasharray="5 4"' : ''}/>`;
  const T = (x, y, v, c) => `<text class="gt ${c || ''}" x="${x}" y="${y}">${v}</text>`;
  const P = (x, y, v) => `<circle class="gp" cx="${x}" cy="${y}" r="3.2"/>` + T(x + 6, y - 6, v);
  // shifts: ['S+','D-',...] (+ = ขวา) ; เส้น S: y = 180 - 0.7(x-50-ds), D: y = 40 + 0.7(x-50-dd)
  function fx(g) {
    const sh = g.shifts || [g.shift], ds = sh.includes('S+') ? 40 : sh.includes('S-') ? -40 : 0, dd = sh.includes('D+') ? 40 : sh.includes('D-') ? -40 : 0;
    const S = o => L(50 + o, 180, 250 + o, 40, 'gl-s', o), D = o => L(50 + o, 40, 250 + o, 180, 'gl-d', o);
    const x2 = 150 + (ds + dd) / 2, y2 = 110 + .35 * (ds - dd);
    return `<svg viewBox="0 0 300 232" role="img" aria-label="กราฟตลาดเงินตรา">${L(50, 22, 50, 200, 'gax') + L(50, 200, 292, 200, 'gax')}${S(0)}${D(0)}${ds ? S(ds) : ''}${dd ? D(dd) : ''}
    ${T(54, 15, 'e (เงินตราต่างประเทศ/เงินในประเทศ)')}${T(150, 220, 'ปริมาณเงินในประเทศ')}${T(252, 40, 'S', 'gt-s')}${T(252, 190, 'D', 'gt-d')}${ds ? T(252 + ds, 40, 'S′', 'gt-s') : ''}${dd ? T(252 + dd, 190, 'D′', 'gt-d') : ''}${P(150, 110, 'E₁')}${P(x2, y2, 'E₂')}</svg>`;
  }
  // ad / lras: ระยะเลื่อนของ AD / LRAS (+ = ขวา) ตามสไลด์: SRAS แนวนอน LRAS แนวตั้ง; AD: y = 110 + 0.7(x-150-ad)
  function adas(g) {
    const ad = g.ad || 0, lr = g.lras || 0, eq = lr ? [150 + lr, 110 + .7 * (lr - ad)] : [150, 110 - .7 * ad];
    const A = o => L(60 + o, 40, 240 + o, 180, 'gl-d', o), SR = y => L(60, y, 262, y, 'gl-s', y !== 110);
    return `<svg viewBox="0 0 300 232" role="img" aria-label="กราฟ AD-AS">${L(50, 22, 50, 200, 'gax') + L(50, 200, 292, 200, 'gax')}
    ${A(0)}${ad ? A(ad) : ''}${L(150, 30, 150, 200, 'gl-l')}${lr ? L(150 + lr, 30, 150 + lr, 200, 'gl-l', 1) : ''}${SR(110)}${lr || ad ? SR(Math.round(eq[1])) : ''}
    ${T(54, 15, 'P (ระดับราคา)')}${T(190, 220, 'Y (ผลผลิตจริง)')}${T(236, 178, 'AD', 'gt-d')}${ad ? T(236 + ad, 178, 'AD′', 'gt-d') : ''}${T(152, 26, 'LRAS', 'gt-l')}${lr ? T(152 + lr, 26, 'LRAS′', 'gt-l') : ''}${T(266, 106, 'SRAS', 'gt-s')}
    ${P(150, 110, 'E₁')}${!lr && ad ? P(150 + ad, 110, 'E₂') : ''}${P(Math.round(eq[0]), Math.round(eq[1]), lr ? 'E₂' : 'E₃')}</svg>`;
  }
  window.graphSvg = g => g ? `<figure class="graph">${g.type === 'fx' ? fx(g) : adas(g)}</figure>` : '';
})();

</script>

  const x = parseFloat(String(v).replace(/,/g, '')); return isNaN(x) ? null : Math.abs(x - q.answer) <= q.tol;
};
const paperOf = id => PAPERS.find(p => p.id === id);
function grade(att) { // ผลรายข้อ: frac = 1 / 0.5 / 0 ; null = ยังไม่ประเมิน (ข้อเขียน)
  const p = paperOf(att.paper), rows = p.items.map((it, n) => {
    const k = key(it), v = att.ans[k];
    if (it.q.type === 'written') return { it, n, k, v, frac: att.marks[k] ?? null, pts: C.writtenPoints };
    const ok = autoOk(it.q, v); return { it, n, k, v, ok, frac: ok ? 1 : 0, pts: C.mcqPoints };
  });
  const got = rows.reduce((a, r) => a + (r.frac ?? 0) * r.pts, 0), max = rows.reduce((a, r) => a + r.pts, 0);
  return { rows, got, max, pending: rows.filter(r => r.frac === null).length };
}
const topicStats = rows => { const m = {}; rows.forEach(r => { if (r.frac === null) return; const t = topicOf(r.it), o = m[t] ??= { s: 0, n: 0 }; o.s += r.frac; o.n++; }); return m; };
function syncWrong(rows) {
  const w = new Set(DB.wrong);
  rows.forEach(r => { if (r.frac === null) return; r.frac >= 1 ? w.delete(r.k) : w.add(r.k); });
  DB.wrong = [...w]; save();
}
const bestOf = id => { const a = DB.attempts.filter(x => x.paper === id).map(x => { const g = grade(x); return g.got / g.max; }); return a.length ? Math.max(...a) : null; };

// ----- ส่วนประกอบของข้อสอบ
function optsHtml(it, n, val, reveal) {
  return `<div class="opts">${it.q.choices.map((c, i) => `<label class="opt ${reveal ? (i === it.q.answer ? 'ok' : val === i ? 'no' : '') : ''}"><input type="radio" name="r${n}" data-k="${esc(key(it))}" value="${i}" ${val === i ? 'checked' : ''} ${reveal ? 'disabled' : ''}><span>${esc(c)}</span></label>`).join('')}</div>`;
}
function inputHtml(it, n, val, reveal) {

const solHtml = it => `<div class="sol">${window.graphSvg(it.q.graph)}<div class="soltxt">${esc(it.q.a)}</div>${it.q.note ? `<p class="note">ตรวจเพิ่ม: ${esc(it.q.note)}</p>` : ''}</div>`;
const head = (it, n, extra = '') => `<div class="qhead"><span class="qno">${n + 1}.</span><span class="pill">${KIND[it.q.type]}</span><small>${esc(it.set.title)} · ${esc(it.q.ref || '')}</small>${extra}</div>`;
const marksHtml = (k, cur, act) => `<div class="marks"><span>ประเมินตัวเอง:</span>${[[1, 'ได้เต็ม'], [.5, 'ได้บางส่วน'], [0, 'ยังไม่ได้']].map(([v, t]) => `<button class="btn sm ${cur === v ? 'on' : ''}" data-act="${act}" data-k="${esc(k)}" data-v="${v}">${t}</button>`).join('')}</div>`;

    <div class="score"><div class="big">${Math.round(g.got * 10) / 10}<small>/${g.max}</small></div><div><b>ข้อกา/คำนวณ ${okN}/${mcq.length} ข้อ</b><br><span class="muted">ข้อเขียน ${g.pending ? `ยังไม่ประเมิน ${g.pending} ข้อ (เลื่อนลงไปดูเฉลยแล้วกดประเมินตัวเอง)` : 'ประเมินครบแล้ว'}</span><br><small>ใช้เวลา ${mm(Math.round(a.dur))} จาก ${C.minutes}:00 นาที</small></div></div>

const bar = (t, r, n) => `<div class="bar"><span>${esc(t)}</span><i class="${r >= .7 ? 'hi' : r >= .5 ? 'mid' : 'low'}"><b style="width:${Math.round(r * 100)}%"></b></i><span class="mono">${Math.round(r * 100)}% <small>(${n})</small></span></div>`;
function reviewCard(r, a) {
  const q = r.it.q, w = q.type === 'written', st = w ? (r.frac === null ? ['warn', 'รอประเมิน'] : r.frac === 1 ? ['ok', 'ได้เต็ม'] : r.frac === .5 ? ['warn', 'ได้บางส่วน'] : ['bad', 'ยังไม่ได้']) : r.v === undefined || r.v === '' ? ['bad', 'ไม่ได้ตอบ'] : r.ok ? ['ok', 'ถูก'] : ['bad', 'ผิด'];
  const mine = w ? (r.v ? `<div class="yours"><small>คำตอบของคุณ</small><br>${esc(r.v)}</div>` : '<p class="muted">ไม่ได้พิมพ์คำตอบ</p>') : q.type === 'calc' ? `<div class="yours">คำตอบของคุณ: ${esc(r.v ?? '-')} · เฉลย: ${esc(q.answer)}</div>` : '';
  return `<div class="q ${w ? '' : r.ok ? 'ok' : 'no'}" id="rq${r.n}">${head(r.it, r.n, `<span class="pill ${st[0]}" style="margin-left:auto">${st[1]}</span>`)}<div class="qtext">${esc(q.q)}</div>${q.type === 'mcq' ? optsHtml(r.it, 'r' + r.n, r.v, true) : mine}${solHtml(r.it)}${w ? marksHtml(r.k, r.frac, 'mark') : ''}</div>`;
}

// ----- การเปลี่ยนหน้า
function go(v, extra = {}) { clearInterval(timer); S = Object.assign({ view: v }, extra); root.innerHTML = views[v](); window.scrollTo(0, 0); if (v === 'exam') startTimer(); if (v === 'practice') pscore(); }
function startTimer() {
  paint(); const tick = () => { const left = Math.round((S.endAt - Date.now()) / 1000), el = document.getElementById('timer'); if (!el) return; el.textContent = mm(Math.max(0, left)); el.classList.toggle('low', left < 300); if (left <= 0) finish(); };
  tick(); timer = setInterval(tick, 1000);
}
function paint() { // ปรับแถบเลขข้อและปุ่มธง โดยไม่วาดหน้าใหม่ (ไม่ให้ช่องพิมพ์เสียโฟกัส)
  let done = 0; S.paper.items.forEach((it, n) => { const k = key(it), v = S.ans[k], on = v !== undefined && String(v).trim() !== ''; if (on) done++;
    const b = document.getElementById('nv' + n); b.classList.toggle('on', on); b.classList.toggle('fl', !!S.flags[k]); document.getElementById('fl' + n).textContent = S.flags[k] ? 'ยกเลิกเครื่องหมาย' : 'ทำเครื่องหมายไว้'; });
  document.getElementById('prog').textContent = done + '/' + S.paper.items.length;
}
const draft = () => { DB.draft = { paper: S.paper.id, ans: S.ans, flags: S.flags, endAt: S.endAt }; save(); };
function finish() {
  const att = { id: Date.now(), paper: S.paper.id, ts: Date.now(), dur: Math.min(C.minutes * 60, C.minutes * 60 - (S.endAt - Date.now()) / 1000), ans: S.ans, marks: {} };
  DB.attempts.push(att); DB.draft = null; syncWrong(grade(att).rows); go('result', { att });
}
const pscore = () => { const el = document.getElementById('pscore'); if (!el) return; const v = Object.values(S.res || {}); el.textContent = `ตอบถูก ${v.filter(Boolean).length}/${v.length} ที่ทำแล้ว`; };

// ----- ตัวจัดการเหตุการณ์
root.addEventListener('input', e => {
  const k = e.target.dataset.k; if (!k || S.view !== 'exam') return;
  S.ans[k] = e.target.type === 'radio' ? +e.target.value : e.target.value; draft(); paint();
});
root.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset, act = d.act, n = +d.n;
  if (act === 'home') go('home');
  else if (act === 'intro') go('intro', { paper: paperOf(d.p) });
  else if (act === 'start') { go('exam', { paper: S.paper, ans: {}, flags: {}, endAt: Date.now() + C.minutes * 60000 }); draft(); }
  else if (act === 'resume') go('exam', { paper: paperOf(DB.draft.paper), ans: DB.draft.ans, flags: DB.draft.flags, endAt: DB.draft.endAt });
  else if (act === 'drop') { DB.draft = null; save(); go('home'); }
  else if (act === 'last') go('result', { att: DB.attempts.filter(a => a.paper === d.p).slice(-1)[0] });
  else if (act === 'nav') { const nb = document.getElementById('navbox'); nb.hidden = !nb.hidden; }
  else if (act === 'jump') { document.getElementById('navbox').hidden = true; document.getElementById('q' + n).scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (act === 'flag') { S.flags[d.k] = !S.flags[d.k]; draft(); paint(); }
  else if (act === 'ask') { const un = S.paper.items.filter(it => { const v = S.ans[key(it)]; return v === undefined || String(v).trim() === ''; }).length, c = document.getElementById('confirm');
    c.hidden = false; c.innerHTML = `<p style="margin:0 0 8px">${un ? `ยังไม่ได้ตอบ ${un} ข้อ` : 'ตอบครบทุกข้อแล้ว'} ต้องการส่งข้อสอบหรือไม่</p><div class="row"><button class="btn primary sm" data-act="submit">ส่งข้อสอบ</button><button class="btn sm" data-act="cancel">ทำต่อ</button></div>`; }
  else if (act === 'cancel') document.getElementById('confirm').hidden = true;
  else if (act === 'submit') finish();
  else if (act === 'filter') { S.filter = d.v; const y = scrollY; root.innerHTML = views.result(); scrollTo(0, y); }
  else if (act === 'mark') { S.att.marks[d.k] = +d.v; const g = grade(S.att); syncWrong(g.rows); save(); const y = scrollY; root.innerHTML = views.result(); scrollTo(0, y); }
  else if (act === 'set') { const s = SETS.find(x => x.id === d.id); go('practice', { title: s.title, items: s.questions.map(q => ({ set: s, q })), res: {} }); }
  else if (act === 'wrong') { const w = new Set(DB.wrong), items = SETS.flatMap(s => s.questions.map(q => ({ set: s, q }))).filter(it => w.has(key(it))); go('practice', { title: 'สมุดข้อผิด', items, res: {} }); }
  else if (act === 'check' || act === 'show') practiceReveal(n);
  else if (act === 'pmark') { setWrong(d.k, +d.v === 1); }
});
function setWrong(k, ok) { const w = new Set(DB.wrong); ok ? w.delete(k) : w.add(k); DB.wrong = [...w]; save(); }
function practiceReveal(n) {
  const it = S.items[n], q = it.q, fb = document.getElementById('fb' + n), box = document.getElementById('q' + n); let ok = null;
  if (q.type === 'mcq') { const r = box.querySelector('input:checked'); if (!r) { fb.innerHTML = '<p class="note">เลือกคำตอบก่อน</p>'; return; } ok = +r.value === q.answer; box.querySelectorAll('.opt').forEach((o, i) => o.classList.add(i === q.answer ? 'ok' : i === +r.value ? 'no' : 'x')); }
  else if (q.type === 'calc') { ok = autoOk(q, document.getElementById('in' + n).value); if (ok === null) { fb.innerHTML = '<p class="note">กรอกตัวเลขก่อน</p>'; return; } }
  box.querySelector('.row').hidden = true;
  fb.innerHTML = (ok === null ? marksHtml(key(it), undefined, 'pmark') : `<span class="pill ${ok ? 'ok' : 'bad'}">${ok ? 'ถูก' : 'ผิด'}</span>`) + solHtml(it);
  if (ok !== null) { S.res[key(it)] = ok; setWrong(key(it), ok); pscore(); }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-act=pmark]'); if (b) { b.parentElement.querySelectorAll('.btn').forEach(x => x.classList.remove('on')); b.classList.add('on'); } });
go('home');
})();

</script>
